<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atoll - Build for the Web, With the Web!</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Browser Theme Color (Matches manifest & adapts dynamically) -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151719" media="(prefers-color-scheme: dark)" />

  <!-- iOS Support -->
  <link rel="apple-touch-icon" href="/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Atoll Chat">

  <!-- ALTCHA Captcha Web Component -->
  <script type="module" src="/altcha.js" async defer></script>
</head>

<body>
  <app-root></app-root>

  <script type="module">
    if ('serviceWorker' in navigator) {
      const isControlled = !!navigator.serviceWorker.controller

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (isControlled) {
          window.location.reload()
        }
      })

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err))
      })
    }
  </script>
</body>

</html>
