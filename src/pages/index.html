  <!-- PWA Manifest -->

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Atoll Chat">

  <!-- ALTCHA Captcha Web Component -->
  <script type="module" src="/assets/altcha.js" async defer></script>
</head>
