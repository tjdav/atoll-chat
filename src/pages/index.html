<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
  <title>Atoll - A secure, end-to-end encrypted messaging and media platform.</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <script type="module" src="/assets/altcha.js"></script>
</head>

<body>
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192x192.png">

  <app-root></app-root>

  <script>
    (function () {
      window.__coralite_instanceCounters = window.__coralite_instanceCounters || {}
      document.querySelectorAll('[data-cid]').forEach(function (el) {
        const cid = el.getAttribute('data-cid')
        if (cid) {
          const parts = cid.split('-')
          const num = parseInt(parts.pop(), 10)
          const prefix = parts.join('-')
          if (prefix && !isNaN(num)) {
            window.__coralite_instanceCounters[prefix] = Math.max(window.__coralite_instanceCounters[prefix] || 0, num + 1)
          }
        }
      })
    })()
  </script>
</body>

</html>
