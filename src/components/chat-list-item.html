<template id="chat-list-item">
  <div ref="container" class="chat-list-item app-list-item position-relative {{ activeClass }}">
    <div ref="avatarContainer" class="list-item-icon">
      <!-- Avatar(s) will be rendered here via client-side logic if needed, but attributes provide initial state -->
    </div>
    <div class="text-truncate flex-grow-1">
      <div class="text-truncate {{ unreadClass }}">
        {{ roomName }}
      </div>
      <div class="d-flex align-items-center">
        <small class="text-truncate flex-grow-1 opacity-75 {{ unreadClass }}">
          {{ previewText }}
        </small>
        <small class="opacity-75 ms-1 flex-shrink-0">
          {{ relativeTime }}
        </small>
      </div>
    </div>
    <span class="position-absolute top-50 translate-middle-y bg-primary rounded-circle unread-dot {{ unreadDotClass }}" data-testid="unread-dot"></span>

    <!-- Dropdown Menu -->
    <div class="dropdown ms-2">
      <button class="btn btn-link text-muted p-0 opacity-0 group-hover-visible" data-bs-toggle="dropdown" aria-expanded="false" ref="dropdownBtn" aria-label="Chat actions">
        <i class="bi bi-three-dots"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm" ref="dropdownMenu">
        <li ref="editRoomLi" class="d-none">
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnEditRoom" data-testid="btn-edit-room">
            <i class="bi bi-pencil"></i> Edit Room
          </a>
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnToggleRead" data-testid="btn-toggle-read">
            <i class="bi {{ readIcon }}"></i> {{ readLabel }}
          </a>
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnToggleMute" data-testid="btn-toggle-mute">
            <i class="bi {{ muteIcon }}"></i> {{ muteLabel }}
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#" ref="btnDelete" data-testid="btn-delete-chat">
            <i class="bi bi-trash"></i> {{ deleteLabel }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      roomId: String,
      roomName: String,
      previewText: String,
      relativeTime: String,
      isUnread: String,
      isActive: String,
      isGroup: String,
      userRole: String,
      participantsJson: String,
      roomAvatar: String,
      isMuted: String
    },
    getters: {
      unreadClass: (state) => (state.isUnread === 'true' ? 'fw-bold' : ''),
      unreadDotClass: (state) => (state.isUnread === 'true' ? '' : 'd-none'),
      activeClass: (state) => (state.isActive === 'true' ? 'active' : ''),
      readLabel: (state) => (state.isUnread === 'true' ? 'Mark as read' : 'Mark as unread'),
      readIcon: (state) => (state.isUnread === 'true' ? 'bi-envelope-open' : 'bi-envelope'),
      muteLabel: (state) => (state.isMuted === 'true' ? 'Unmute notifications' : 'Mute notifications'),
      muteIcon: (state) => (state.isMuted === 'true' ? 'bi-bell' : 'bi-bell-slash'),
      deleteLabel: (state) => (state.isGroup === 'true' ? 'Leave group' : 'Delete chat')
    },
    client: ({ refs, state, globalStore, pocketbase, eventBus, localDb, cryptoWorker, signal }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $localDb } = localDb
      const { $worker } = cryptoWorker
      const avatarContainer = refs('avatarContainer')
      const dropdownMenu = refs('dropdownMenu')
      const container = refs('container')

      const avatarCache = new Map()
      let sodiumInstance = null

      const getInitials = (name) => {
        if (!name) {
          return '?'
        }
        return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
      }

      const createAvatarEl = (user, size = 40) => {
        const div = document.createElement('div')
        div.className = 'avatar-circle d-flex align-items-center justify-content-center w-40px h-40px'
        if (size !== 40) {
          div.style.width = `${size}px`
          div.style.height = `${size}px`
        }
        div.style.fontSize = `${size * 0.4}px`

        if (user.avatar) {
          const avatarUrl = pb.files.getURL(user, user.avatar, { thumb: `${size}x${size}` })
          const img = document.createElement('img')
          img.src = avatarUrl
          img.style.width = '100%'
          img.style.height = '100%'
          img.style.objectFit = 'cover'
          div.appendChild(img)
        } else {
          div.textContent = getInitials(user.name || user.username)
        }
        return div
      }

      const renderAvatar = async () => {
        if (!avatarContainer) {
          return
        }
        avatarContainer.innerHTML = ''
        avatarContainer.className = 'list-item-icon d-flex align-items-center justify-content-center flex-shrink-0 overflow-hidden'

        // 1. Custom Room Avatar (Needs decryption, so it stays in client block)
        if (state.roomAvatar) {
          try {
            const avatarData = JSON.parse(state.roomAvatar)
            if (avatarCache.has(avatarData.media_id)) {
              const img = document.createElement('img')
              img.src = avatarCache.get(avatarData.media_id)
              img.className = 'room-avatar-img'
              avatarContainer.appendChild(img)
              return
            }

            if (!sodiumInstance) {
              const { default: sodium } = await import('libsodium-wrappers-sumo')
              await sodium.ready
              sodiumInstance = sodium
            }
            const sodium = sodiumInstance

            const record = await pb.collection('media').getOne(avatarData.media_id)
            const encryptedUrl = pb.files.getURL(record, record.file)
            const resp = await fetch(encryptedUrl)
            const buffer = await resp.arrayBuffer()

            const key = sodium.from_base64(avatarData.key, sodium.base64_variants.ORIGINAL)
            const nonce = sodium.from_base64(avatarData.nonce, sodium.base64_variants.ORIGINAL)
            const decrypted = sodium.crypto_secretbox_open_easy(new Uint8Array(buffer), nonce, key)

            if (decrypted) {
              const blob = new Blob([decrypted], { type: 'image/jpeg' })
              const url = URL.createObjectURL(blob)
              avatarCache.set(avatarData.media_id, url)
              const img = document.createElement('img')
              img.src = url
              img.className = 'room-avatar-img'
              avatarContainer.appendChild(img)
              signal.addEventListener('abort', () => URL.revokeObjectURL(url))
              return
            }
          } catch (err) {
            console.error('[chat-list-item] Failed to render custom avatar:', err)
          }
        }

        // 2. Fallback to Participants
        const participants = JSON.parse(state.participantsJson || '[]').filter(p => p.id !== $state.currentUser?.id)
  
        if (state.isGroup !== 'true' && participants.length > 0) {
          const otherUser = participants[0]
          avatarContainer.appendChild(createAvatarEl(otherUser))
        } else if (state.isGroup === 'true' && participants.length > 0) {
          avatarContainer.className = 'list-item-icon group-avatar-container position-relative flex-shrink-0'
          const displayCount = Math.min(participants.length, 3)
          for (let i = 0; i < displayCount; i++) {
            const avatar = createAvatarEl(participants[i], 28)
            avatar.classList.add(`stacked-avatar-${i + 1}`)
            avatarContainer.appendChild(avatar)
          }
        } else {
          const icon = document.createElement('i')
          icon.className = 'bi bi-chat-left-text fs-5'
          avatarContainer.appendChild(icon)
        }
      }

      const toggleMarkAsUnread = async () => {
        const room = await $localDb.local_rooms.get(state.roomId)
        if (!room) {
          return
        }

        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }

        let newLastReadId = null
        let toastMessage = 'Marked as unread'

        if (state.isUnread === 'true') {
          // Mark as read
          const latestMsg = await $localDb.local_messages
            .where('[room_id+created_at]')
            .between([state.roomId, ''], [state.roomId, '\uffff'])
            .last()
          if (latestMsg) {
            newLastReadId = latestMsg.id
          }
          toastMessage = 'Marked as read'
        }

        me.last_read_message_id = newLastReadId
        await $localDb.local_rooms.put(room)
        state.isUnread = newLastReadId === null ? 'true' : 'false'

        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${room.id}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').update(memberRecord.id, {
              last_read_message_id: newLastReadId
            }, { requestKey: null })
          }
        } catch (err) {
          console.error('[chat-list-item] Failed to update read status on server:', err)
        }

        $bus.emit('room:read_state_changed', room.id)
        $bus.emit('ui:show_toast', {
          message: toastMessage,
          type: 'success'
        })
      }

      const toggleMute = async () => {
        const room = await $localDb.local_rooms.get(state.roomId)
        if (!room) {
          return
        }

        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }

        const newMuteStatus = state.isMuted !== 'true'
        me.is_muted = newMuteStatus
        await $localDb.local_rooms.put(room)
        state.isMuted = newMuteStatus ? 'true' : 'false'

        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${room.id}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').update(memberRecord.id, {
              is_muted: newMuteStatus
            }, { requestKey: null })
          }
        } catch (err) {
          console.error('[chat-list-item] Failed to update mute status on server:', err)
        }

        $bus.emit('room:member_updated', { room_id: room.id })
        $bus.emit('ui:show_toast', {
          message: newMuteStatus ? 'Notifications muted' : 'Notifications unmuted',
          type: 'success'
        })
      }

      const deleteChat = async () => {
        const room = await $localDb.local_rooms.get(state.roomId)
        if (!room) {
          return
        }

        const isGroup = state.isGroup === 'true'
        const confirmMessage = isGroup
          ? 'Are you sure you want to leave this group?'
          : 'Are you sure you want to delete this chat?'

        if (!confirm(confirmMessage)) {
          return
        }

        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${room.id}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').delete(memberRecord.id, { requestKey: null })
          }

          if (!isGroup && room.participants.length <= 1) {
            // Delete room from server if only participant in DM
            await pb.collection('rooms').delete(room.id, { requestKey: null })
          }

          // Trigger local deletion immediately for responsiveness
          await $worker.execute('worker:delete_local_room', { roomId: room.id })

          $bus.emit('ui:show_toast', {
            message: isGroup ? 'Left group' : 'Chat deleted',
            type: 'success'
          })
  
          if ($state.activeSelectionId === state.roomId) {
            $state.activeSelectionId = null
          }
        } catch (err) {
          console.error('[chat-list-item] Failed to delete chat:', err)
          $bus.emit('ui:show_toast', {
            message: 'Failed to delete chat',
            type: 'danger'
          })
        }
      }

      const initDropdown = () => {
        const updateDropdownUI = () => {
          if (state.userRole === 'admin') {
            refs('editRoomLi').classList.remove('d-none')
          } else {
            refs('editRoomLi').classList.add('d-none')
          }
        }

        refs('dropdownBtn').onclick = () => {
          updateDropdownUI()
        }

        refs('btnEditRoom').onclick = async (e) => {
          e.preventDefault()
          e.stopPropagation()
          const room = await $localDb.local_rooms.get(state.roomId)
          if (room) {
            $bus.emit('ui:open_edit_room', room)
          }
        }

        refs('btnToggleRead').onclick = (e) => {
          e.preventDefault()
          e.stopPropagation()
          toggleMarkAsUnread()
        }

        refs('btnToggleMute').onclick = (e) => {
          e.preventDefault()
          e.stopPropagation()
          toggleMute()
        }

        refs('btnDelete').onclick = (e) => {
          e.preventDefault()
          e.stopPropagation()
          deleteChat()
        }
      }

      const markAsRead = async () => {
        const room = await $localDb.local_rooms.get(state.roomId)
        if (!room) {
          return
        }

        const latestMsg = await $localDb.local_messages
          .where('[room_id+created_at]')
          .between([state.roomId, ''], [state.roomId, '\uffff'])
          .last()

        if (!latestMsg) {
          return
        }

        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (me && me.last_read_message_id !== latestMsg.id) {
          me.last_read_message_id = latestMsg.id
          await $localDb.local_rooms.put(room)
          try {
            const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${room.id}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
            if (memberRecord) {
              pb.collection('room_members').update(memberRecord.id, {
                last_read_message_id: latestMsg.id
              }, { requestKey: null }).catch(err => console.error('[chat-list-item] Failed to update read status on server:', err))
            }
          } catch (err) {
            console.error('[chat-list-item] Failed to find room member record:', err)
          }
          $bus.emit('room:read_state_changed', room.id)
        }
      }

      container.onclick = async (e) => {
        if (e.target.closest('.dropdown')) {
          return
        }
        $state.activeSelectionId = state.roomId
        $state.activeSelectionType = 'chats'
        if (state.isUnread === 'true') {
          await markAsRead()
        }
      }

      renderAvatar()
      initDropdown()

    }
  })
</script>
