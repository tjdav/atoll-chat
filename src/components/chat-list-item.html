<template id="chat-list-item">
  <div ref="container" class="chat-list-item app-list-item position-relative {{ activeClass }}">
    <div class="list-item-icon d-flex align-items-center justify-content-center flex-shrink-0">
      <slot name="avatar"></slot>
    </div>
    <div class="text-truncate flex-grow-1">
      <div class="text-truncate {{ unreadClass }}">
        {{ roomName }}
      </div>
      <div class="d-flex align-items-center">
        <small class="text-truncate flex-grow-1 opacity-75 {{ unreadClass }}">
          {{ previewText }}
        </small>
        <small class="opacity-75 ms-1 flex-shrink-0">
          {{ relativeTime }}
        </small>
      </div>
    </div>
    <span class="position-absolute top-50 translate-middle-y bg-primary rounded-circle unread-dot" hidden="{{ isRead }}" data-testid="unread-dot"></span>

    <!-- Dropdown Menu -->
    <div class="dropdown ms-2">
      <button class="btn btn-link text-muted p-0 opacity-0 group-hover-visible" data-bs-toggle="dropdown" aria-expanded="false" ref="dropdownBtn" aria-label="Chat actions">
        <i class="bi bi-three-dots"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm" ref="dropdownMenu">
        <li class="{{ editRoomClass }}" ref="editRoomLi">
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnEditRoom" data-testid="btn-edit-room">
            <i class="bi bi-pencil"></i> Edit Room
          </a>
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnToggleRead" data-testid="btn-toggle-read">
            <i class="bi {{ readIcon }}"></i> {{ readLabel }}
          </a>
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2" href="#" ref="btnToggleMute" data-testid="btn-toggle-mute">
            <i class="bi {{ muteIcon }}"></i> {{ muteLabel }}
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#" ref="btnDelete" data-testid="btn-delete-chat">
            <i class="bi bi-trash"></i> {{ deleteLabel }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      roomId: String,
      roomName: String,
      previewText: String,
      relativeTime: String,
      isUnread: String,
      isGroup: String,
      userRole: String,
      isMuted: String
    },
    state: {
      isActive: false
    },
    getters: {
      isRead: (state) => state.isUnread !== 'true',
      unreadClass: (state) => (state.isUnread === 'true' ? 'fw-bold' : ''),
      activeClass: (state) => (state.isActive ? 'active' : ''),
      readLabel: (state) => (state.isUnread === 'true' ? 'Mark as read' : 'Mark as unread'),
      readIcon: (state) => (state.isUnread === 'true' ? 'bi-envelope-open' : 'bi-envelope'),
      muteLabel: (state) => (state.isMuted === 'true' ? 'Unmute notifications' : 'Mute notifications'),
      muteIcon: (state) => (state.isMuted === 'true' ? 'bi-bell' : 'bi-bell-slash'),
      deleteLabel: (state) => (state.isGroup === 'true' ? 'Leave group' : 'Delete chat'),
      editRoomClass: (state) => (state.userRole === 'admin' ? '' : 'd-none')
    },
    client: ({ refs, state, globalStore, signal }) => {
      const { $state } = globalStore
      const container = refs('container')

      const syncActiveState = () => {
        state.isActive = $state.activeSelectionId === state.roomId && $state.activeSelectionType === 'chats'
      }

      $state.subscribe('activeSelectionId', syncActiveState)
      $state.subscribe('activeSelectionType', syncActiveState)
      syncActiveState()

      const emitAction = (name, detail = {}) => {
        if (!container) return
        container.dispatchEvent(new CustomEvent(name, {
          bubbles: true,
          detail: { roomId: state.roomId, ...detail }
        }))
      }

      const btnEditRoom = refs('btnEditRoom')
      if (btnEditRoom) {
        btnEditRoom.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation()
          emitAction('action:edit-room')
        }, { signal })
      }

      const btnToggleRead = refs('btnToggleRead')
      if (btnToggleRead) {
        btnToggleRead.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation()
          emitAction('action:toggle-read', { isUnread: state.isUnread === 'true' })
        }, { signal })
      }

      const btnToggleMute = refs('btnToggleMute')
      if (btnToggleMute) {
        btnToggleMute.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation()
          emitAction('action:toggle-mute', { isMuted: state.isMuted === 'true' })
        }, { signal })
      }

      const btnDelete = refs('btnDelete')
      if (btnDelete) {
        btnDelete.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation()
          emitAction('action:delete-chat', { isGroup: state.isGroup === 'true' })
        }, { signal })
      }

      if (container) {
        container.addEventListener('click', (e) => {
          if (e.target.closest('.dropdown')) return
          emitAction('action:select-chat')
        }, { signal })
      }
    }
  })
</script>
