<template id="picture-list">
  <div class="picture-list h-100 overflow-y-auto p-3">
    <div class="row row-cols-2 g-3" ref="gridContainer">
      <!-- Pictures will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const gridContainer = refs('gridContainer')

      let currentRenderId = 0
      const render = async () => {
        if (!gridContainer) {
          return
        }

        const renderId = ++currentRenderId
        try {
          const rawItems = await $localDb.local_assets.where('mime_type').startsWith('image/').reverse().sortBy('created_at')
          if (renderId !== currentRenderId) {
            return
          }

          if (rawItems.length === 0) {
            gridContainer.innerHTML = '<div class="col-12 p-4 text-center text-muted">No pictures found</div>'
            return
          }

          const fragment = document.createDocumentFragment()
          rawItems.forEach(item => {
            const dt = new Date(item.created_at)
            const dateStr = dt.toLocaleDateString()
            const timeStr = dt.toLocaleTimeString([], {
              hour: '2-digit',
              minute: '2-digit'
            })
            const isActive = item.id === $state.activeSelectionId && $state.activeSelectionType === 'pictures'

            const card = document.createElement('media-grid-card')
            card.setAttribute('asset-id', item.id)
            card.setAttribute('media-id', item.media_id)
            card.setAttribute('mime-type', item.mime_type)
            card.setAttribute('is-active', isActive)
            card.setAttribute('type', 'pictures')
            card.setAttribute('date-str', dateStr)
            card.setAttribute('time-str', timeStr)
            card.setAttribute('file-key', item.file_key)
            card.setAttribute('file-nonce', item.file_nonce)
            fragment.appendChild(card)
          })

          if (renderId === currentRenderId) {
            gridContainer.innerHTML = ''
            gridContainer.appendChild(fragment)
          }
        } catch (error) {
          console.error('[picture-list] Error fetching pictures:', error)
        }
      }

      // Initial render
      render()

      const debouncedRender = $utils.debounce(render, 10)

      // Handle selection change
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'pictures') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => {
        debouncedRender()
      })

      const handleNewData = () => {
        debouncedRender()
      }

      $bus.on('NEW_LOCAL_DATA', handleNewData)
    }
  })
</script>
