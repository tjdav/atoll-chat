<template id="chat-input">
  <div id="{{ ref_chatInputContainer }}" ref="chatInputContainer" class="chat-input-container p-3 border-top bg-body">
    <!-- Attachment Preview Bar -->
    <div id="{{ ref_attachmentPreview }}" class="attachment-preview p-2 mb-2 bg-light rounded {{ attachmentPreviewClass }} align-items-center justify-content-between border">
      <div class="d-flex align-items-center">
        <i class="bi bi-file-earmark-arrow-up text-primary fs-4 me-2"></i>
        <div>
          <div class="small fw-bold text-truncate" style="max-width: 200px;">{{ fileName }}</div>
          <div class="x-small text-muted">{{ uploadStatus }}</div>
        </div>
      </div>
      <button id="{{ ref_cancelFileButton }}" class="btn btn-sm btn-link text-danger" ref="cancelFileButton" title="Cancel" {{ isDisabled }}>
        <i class="bi bi-x-circle"></i>
      </button>
    </div>

    <div class="input-group {{ inputGroupClass }}">
      <input id="{{ ref_fileInput }}" type="file" ref="fileInput" class="d-none" accept="image/*, video/*, audio/*">
      <button id="{{ ref_attachButton }}" class="btn btn-outline-secondary" type="button" ref="attachButton" title="Attach file" {{ isDisabled }}>
        <i class="bi bi-paperclip"></i>
      </button>
      <button id="{{ ref_micButton }}" class="btn btn-outline-secondary" type="button" ref="micButton" title="Voice message" {{ isDisabled }}>
        <i class="bi bi-mic"></i>
      </button>
      <textarea
        id="{{ ref_messageInput }}"
        ref="messageInput"
        class="form-control"
        placeholder="Type a message..."
        rows="1"
        style="resize: none; max-height: 200px;"
        {{ isDisabled }}
      ></textarea>
      <button id="{{ ref_sendButton }}" class="btn btn-primary d-flex align-items-center" type="button" ref="sendButton" {{ isDisabled }}>
        <span class="me-1 {{ sendTextClasses }}">Send</span>
        <i class="bi bi-send {{ iconClasses }}"></i>
        <div class="spinner-border spinner-border-sm {{ spinnerClasses }}" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </button>
    </div>

    <!-- Recording UI -->
    <div class="recording-ui {{ recordingUIClass }} align-items-center gap-2">
      <button id="{{ ref_discardButton }}" class="btn btn-link text-danger p-1" ref="discardButton" title="Discard">
        <i class="bi bi-trash fs-4"></i>
      </button>
      
      <div class="recording-controls flex-grow-1 d-flex align-items-center bg-light rounded-pill px-3 py-1 border">
        <button id="{{ ref_pauseResumeButton }}" class="btn btn-sm btn-light rounded-circle me-2" ref="pauseResumeButton">
          <i class="bi {{ pauseResumeIcon }}"></i>
        </button>

        <button id="{{ ref_redoButton }}" class="btn btn-sm btn-link text-primary me-2 {{ redoClass }}" ref="redoButton" title="Restart">
          <i class="bi bi-arrow-counterclockwise fs-5"></i>
        </button>

        <div class="recording-visualizer flex-grow-1 d-flex align-items-center overflow-hidden" style="height: 24px;">
          <div class="recording-dots d-flex gap-1">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>

        <span class="recording-timer small fw-bold font-monospace ms-2">{{ formattedDuration }}</span>

        <button id="{{ ref_resumeMicButton }}" class="btn btn-sm btn-link text-secondary ms-2 {{ redoClass }}" ref="resumeMicButton" title="Add more">
          <i class="bi bi-mic-fill"></i>
        </button>
      </div>

      <button id="{{ ref_sendVoiceButton }}" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" ref="sendVoiceButton" {{ isDisabled }}>
        <i class="bi bi-send-fill" style="transform: rotate(-45deg); margin-left: 3px;"></i>
      </button>
    </div>
  </div>
</template>

<style>
  .chat-input-container {
    transition: background-color 0.2s ease;
  }
  .chat-input-container textarea {
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .chat-input-container .btn {
    align-self: flex-end;
    height: 38px; /* Match single line bootstrap input height */
  }
  .attachment-preview {
    animation: fadeIn 0.3s ease;
  }
  .recording-ui {
    animation: slideUp 0.3s ease;
  }
  .x-small {
    font-size: 0.75rem;
  }
  .dot {
    width: 3px;
    height: 3px;
    background-color: #ccc;
    border-radius: 50%;
  }
  .recording-ui .dot {
    background-color: var(--bs-primary);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isSending: false,
      isUploading: false,
      uploadStatus: '',
      fileName: '',
      hasFile: false,
      isRecording: false,
      isPaused: false,
      recordingDuration: 0
    }),
    getters: {
      attachmentPreviewClass: (state) => (state.hasFile ? 'd-flex' : 'd-none'),
      isDisabled: (state) => (state.isSending || state.isUploading ? 'disabled' : ''),
      sendTextClasses: (state) => (state.isSending || state.isUploading ? 'd-none' : 'd-none d-sm-inline'),
      iconClasses: (state) => (state.isSending || state.isUploading ? 'd-none' : ''),
      spinnerClasses: (state) => (state.isSending || state.isUploading ? '' : 'd-none'),
      inputGroupClass: (state) => (state.isRecording ? 'd-none' : 'd-flex'),
      recordingUIClass: (state) => (state.isRecording ? 'd-flex' : 'd-none'),
      pauseResumeIcon: (state) => (state.isPaused ? 'bi-play-fill' : 'bi-pause-fill'),
      redoClass: (state) => (state.isPaused ? '' : 'd-none'),
      formattedDuration: (state) => {
        const mins = Math.floor(state.recordingDuration / 60)
        const secs = state.recordingDuration % 60
        return `${mins}:${secs.toString().padStart(2, '0')}`
      }
    },
    client: ({ refs, state, globalStore, pocketbase, localDb, signal }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $localDb } = localDb
      const messageInput = refs('messageInput')
      const sendButton = refs('sendButton')
      const attachButton = refs('attachButton')
      const fileInput = refs('fileInput')
      const micButton = refs('micButton')
      const discardButton = refs('discardButton')
      const pauseResumeButton = refs('pauseResumeButton')
      const redoButton = refs('redoButton')
      const sendVoiceButton = refs('sendVoiceButton')
      const resumeMicButton = refs('resumeMicButton')

      let mediaRecorder = null
      let audioChunks = []
      let timerInterval = null
      let shouldSendVoice = false

      const autoExpand = () => {
        messageInput.style.height = 'auto'
        messageInput.style.height = messageInput.scrollHeight + 'px'
      }

      messageInput.addEventListener('input', autoExpand, { signal })

      const resetUI = () => {
        state.isSending = false
        state.isUploading = false
        state.uploadStatus = ''
        state.fileName = ''
        state.hasFile = false
        state.isRecording = false
        state.isPaused = false
        state.recordingDuration = 0
        fileInput.value = ''
        messageInput.value = ''
        stopTimer()
        cleanupRecorder()
        autoExpand()
      }

      const cleanupRecorder = () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop()
        }
        mediaRecorder = null
        audioChunks = []
      }

      const startTimer = () => {
        stopTimer()
        timerInterval = setInterval(() => {
          if (!state.isPaused) {
            state.recordingDuration++
          }
        }, 1000)
      }

      const stopTimer = () => {
        if (timerInterval) {
          clearInterval(timerInterval)
          timerInterval = null
        }
      }

      const dispatchMessage = async (plaintextObj) => {
        const { sendEncryptedMessage } = await import('../utils/messageUtils.js')
        return await sendEncryptedMessage($state.activeSelectionId, plaintextObj, {
          pb,
          $localDb,
          $state
        })
      }

      const sendMessage = async (recordedBlob = null) => {
        if (state.isSending || state.isUploading) {
          return
        }

        const text = messageInput.value.trim()
        const file = recordedBlob || fileInput.files[0]

        if (!text && !file) {
          return
        }

        state.isSending = true

        try {
          if (file) {
            // Media Flow
            state.isUploading = true
            state.uploadStatus = 'Encrypting file...'
  
            const { default: sodium } = await import('libsodium-wrappers-sumo')
            await sodium.ready

            // 1. Encrypt File
            const fileBuffer = new Uint8Array(await file.arrayBuffer())
            const fileKey = sodium.randombytes_buf(32)
            const fileNonce = sodium.randombytes_buf(24)
            const encryptedFile = sodium.crypto_secretbox_easy(fileBuffer, fileNonce, fileKey)
  
            // 2. Upload to media collection
            state.uploadStatus = 'Uploading...'
            const blob = new Blob([encryptedFile], { type: 'application/octet-stream' })
            const formData = new FormData()
            formData.append('file', blob, 'encrypted.bin')
  
            const mediaRecord = await pb.collection('media').create(formData)
  
            // 3. Dispatch media message
            const mediaPlaintext = {
              type: 'media',
              content: recordedBlob ? '' : text,
              mime_type: file.type,
              media_id: mediaRecord.id,
              file_key: sodium.to_base64(fileKey, sodium.base64_variants.ORIGINAL),
              file_nonce: sodium.to_base64(fileNonce, sodium.base64_variants.ORIGINAL),
              timestamp: Date.now()
            }
  
            await dispatchMessage(mediaPlaintext)
          } else {
            // Standard Text Flow
            await dispatchMessage({
              type: 'text',
              content: text,
              timestamp: Date.now()
            })
          }

          resetUI()
        } catch (err) {
          console.error('[chat-input] Failed to send:', err)
          alert('Failed to send: ' + err.message)
          state.isSending = false
          state.isUploading = false
        }
      }

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
          mediaRecorder = new MediaRecorder(stream)
          audioChunks = []

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              audioChunks.push(e.data)
            }
          }

          mediaRecorder.onstop = () => {
            const tracks = stream.getTracks()
            tracks.forEach(track => track.stop())
  
            if (shouldSendVoice && audioChunks.length > 0) {
              const blob = new Blob(audioChunks, { type: 'audio/webm' })
              sendMessage(blob)
            }
            shouldSendVoice = false
          }

          mediaRecorder.start()
          shouldSendVoice = false
          state.isRecording = true
          state.isPaused = false
          state.recordingDuration = 0
          startTimer()
        } catch (err) {
          console.error('[chat-input] Failed to start recording:', err)
          alert('Microphone access denied or unavailable.')
        }
      }

      micButton.addEventListener('click', startRecording, { signal })

      discardButton.addEventListener('click', () => {
        resetUI()
      }, { signal })

      pauseResumeButton.addEventListener('click', () => {
        if (!mediaRecorder) {
          return
        }

        if (state.isPaused) {
          mediaRecorder.resume()
          state.isPaused = false
        } else {
          mediaRecorder.pause()
          state.isPaused = true
        }
      }, { signal })

      resumeMicButton.addEventListener('click', () => {
        if (!mediaRecorder || !state.isPaused) {
          return
        }
        mediaRecorder.resume()
        state.isPaused = false
      }, { signal })

      redoButton.addEventListener('click', () => {
        cleanupRecorder()
        startRecording()
      }, { signal })

      sendVoiceButton.addEventListener('click', () => {
        if (!mediaRecorder) {
          return
        }
        shouldSendVoice = true
        mediaRecorder.stop()
      }, { signal })

      attachButton.addEventListener('click', () => {
        fileInput.click()
      }, { signal })

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0]
        if (!file) {
          return
        }

        if (file.size > 25 * 1024 * 1024) {
          alert('File is too large. Maximum size is 25MB.')
          fileInput.value = ''
          return
        }

        state.fileName = file.name
        state.hasFile = true
        state.uploadStatus = 'Ready to send'
      }, { signal })

      // Handle Cancel button via delegation
      const container = refs('chatInputContainer')
      container.addEventListener('click', (e) => {
        const cancelBtn = e.target.closest('[ref="cancelFileButton"]')
        if (cancelBtn) {
          fileInput.value = ''
          state.hasFile = false
          state.fileName = ''
        }
      }, { signal })

      sendButton.addEventListener('click', sendMessage, { signal })

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          sendMessage()
        }
      }, { signal })
    }
  })
</script>
