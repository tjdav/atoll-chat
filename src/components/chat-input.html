<template id="chat-input">
  <div class="chat-input-container p-3 border-top bg-body">
    <!-- Attachment Preview Bar -->
    <div class="{{ attachmentPreviewClass }}">
      <chat-attachment-preview 
        ref="attachmentPreview"
        file-name="{{ fileName }}" 
        upload-status="{{ uploadStatus }}"
      ></chat-attachment-preview>
    </div>

    <!-- Link Preview Bar -->
    <div class="{{ linkPreviewClass }}" ref="linkPreviewContainer">
      <!-- link-preview-input will be mounted here -->
    </div>

    <!-- Normal Input Mode -->
    <div class="{{ inputGroupClass }}" data-testid="chat-input-wrapper">
      <chat-input-text
        ref="inputText"
        is-sending="{{ isSending }}"
        is-uploading="{{ isUploading }}"
        is-compressing="{{ isCompressing }}"
      ></chat-input-text>
    </div>

    <!-- Recording Mode -->
    <div ref="voiceRecorderContainer" class="{{ recordingUIClass }}">
      <!-- chat-voice-recorder will be mounted here -->
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isSending: false,
      isUploading: false,
      isCompressing: false,
      uploadStatus: '',
      fileName: '',
      hasFile: false,
      isRecording: false,
      selectedFile: null,
      thumbnailBlob: null,
      duration: 0,
      pendingLinkData: [],
      ignoredUrls: {}
    }),
    getters: {
      attachmentPreviewClass: (state) => (state.hasFile ? 'd-block' : 'd-none'),
      linkPreviewClass: (state) => (state.pendingLinkData.length > 0 ? 'd-block' : 'd-none'),
      inputGroupClass: (state) => (state.isRecording ? 'd-none' : 'd-block'),
      recordingUIClass: (state) => (state.isRecording ? 'd-flex' : 'd-none')
    },
    client: ({ state, globalStore, localDb, eventBus, refs, _signal, cryptoWorker, pocketbase, utils, mediaWorker }) => {
      const { $state } = globalStore
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
      const { pb } = pocketbase
      const { $func, $image } = utils
      const { $mediaWorker: $media } = mediaWorker

      const resetUI = () => {
        state.isSending = false
        state.isUploading = false
        state.uploadStatus = ''
        state.fileName = ''
        state.hasFile = false
        state.isRecording = false
        state.selectedFile = null
        state.thumbnailBlob = null
        state.duration = 0
        state.pendingLinkData = []
        state.ignoredUrls = {}
        $state.currentMessageText = ''
        const container = refs('voiceRecorderContainer')
        if (container) {
          container.innerHTML = ''
        }
        const linkContainer = refs('linkPreviewContainer')
        if (linkContainer) {
          linkContainer.innerHTML = ''
        }
      }

      const URL_REGEX = /(?:\[[^\]]+\]\((https?:\/\/[^\s)]+)\))|(?:^|\s)(https?:\/\/[^\s]+)(?=\s|$)/gi

      const checkUrl = $func.debounce(async (text) => {
        if (state.hasFile || state.isRecording) {
          return
        }

        const matches = Array.from(text.matchAll(URL_REGEX))
        if (matches.length > 0) {
          const urls = matches.map(m => m[1] || m[2]).filter(u => !state.ignoredUrls[u])
  
          // Remove previews for URLs that are no longer in the text
          const currentUrlsInText = new Set(matches.map(m => m[1] || m[2]))
          state.pendingLinkData = state.pendingLinkData.filter(d => currentUrlsInText.has(d.url))

          // Fetch metadata for new URLs
          const existingUrls = new Set(state.pendingLinkData.map(d => d.url))
          const newUrls = urls.filter(u => !existingUrls.has(u))

          for (const url of newUrls) {
            try {
              const data = await pb.send('/api/link-extraction', {
                query: { url }
              })
  
              if (data && (data.title || data.description || data.image)) {
                state.pendingLinkData = [...state.pendingLinkData, {
                  ...data,
                  url
                }]
              }
            } catch (err) {
              console.warn('[chat-input] Failed to fetch link preview for:', url, err)
            }
          }

          // Update UI
          const container = refs('linkPreviewContainer')
          if (container) {
            container.innerHTML = ''
            state.pendingLinkData.forEach(data => {
              const el = document.createElement('link-preview-input')
              el.setAttribute('title', data.title || '')
              el.setAttribute('description', data.description || '')
              el.setAttribute('image', data.image || '')
              el.setAttribute('domain', data.domain || '')
              el.setAttribute('url', data.url)
              container.appendChild(el)
            })
          }
        } else {
          state.pendingLinkData = []
          const container = refs('linkPreviewContainer')
          if (container) {
            container.innerHTML = ''
          }
        }
      }, 500)

      $state.subscribe('currentMessageText', (val) => {
        checkUrl(val || '')
      })

      const dispatchMessage = async (params) => {
        const localUuid = crypto.randomUUID()
        const room_id = $state.activeSelectionId

        // Optimistic Media Cache (Sender side)
        if (params.file) {
          const blobUrl = URL.createObjectURL(params.file)
          let thumbnailBlobUrl = null
          if (params.thumbnail_blob) {
            thumbnailBlobUrl = URL.createObjectURL(params.thumbnail_blob)
          }

          $state.decryptionCache.set(localUuid, {
            blobUrl,
            thumbnailBlobUrl,
            mimeType: params.mime_type || params.file.type,
            duration: params.duration
          })
        }

        // Optimistic Write
        const optimisticMessage = {
          local_uuid: localUuid,
          id: null,
          room_id: room_id,
          sender_id: $state.currentUser.id,
          type: params.type,
          content: params.content,
          status: 'pending',
          created_at: new Date().toISOString(),
          // Include any specific metadata for UI rendering while pending
          mime_type: params.mime_type,
          filename: params.filename,
          waveform_data: params.waveform_data,
          music_metadata: params.music_metadata,
          duration: params.duration,
          links: params.links
        }

        await $localDb.local_messages.put(optimisticMessage)
        $bus.emit('db:new_local_data', {
          room_id: room_id,
          message: optimisticMessage
        })

        // Dispatch to worker
        console.log('[chat-input] Dispatching worker:send_message to worker', { localUuid })
        const result = await $worker.execute('worker:send_message', {
          room_id,
          localUuid,
          ...params
        })
  
        $bus.emit('message:sent', result)
        return result
      }

      const sendMessage = async (recordedBlob = null, waveformData = null) => {
        if (state.isSending || state.isUploading || state.isCompressing) {
          return
        }

        console.log('[chat-input] sendMessage triggered', {
          hasText: !!$state.currentMessageText,
          hasBlob: !!recordedBlob
        })

        const text = ($state.currentMessageText || '').trim()
        const file = recordedBlob || state.selectedFile

        if (!text && !file) {
          return
        }

        state.isSending = true

        try {
          if (file) {
            console.log('[chat-input] Processing file message')
            state.isUploading = true
            state.uploadStatus = 'Processing file...'

            let musicMetadata = null
            let albumArtBlob = null
            let audioWaveformData = null

            // Extract metadata if it's an audio file and not a voice recording
            if (file.type.startsWith('audio/') && !recordedBlob) {
              state.uploadStatus = 'Extracting metadata...'
              try {
                const result = await $media.getMetadata(file)
                if (result) {
                  musicMetadata = result.metadata
                  state.duration = result.duration
                  if (result.albumArt) {
                    albumArtBlob = new Blob([result.albumArt], { type: result.albumArtMimeType || 'image/jpeg' })
                  }
                }
              } catch (metaErr) {
                console.warn('[chat-input] Failed to extract metadata:', metaErr)
              }

              // Generate waveform for regular audio files
              state.uploadStatus = 'Generating waveform...'
              try {
                audioWaveformData = await utils.$media.generateWaveform(file)
              } catch (waveErr) {
                console.warn('[chat-input] Failed to generate waveform:', waveErr)
              }
            }

            // Dispatch media message - worker handles encryption and upload
            await dispatchMessage({
              type: 'media',
              content: recordedBlob ? '' : text,
              file: file,
              filename: file.name,
              mime_type: file.type,
              waveform_data: recordedBlob ? waveformData : audioWaveformData,
              music_metadata: musicMetadata,
              album_art_blob: albumArtBlob,
              thumbnail_blob: state.thumbnailBlob,
              duration: state.duration,
              timestamp: Date.now()
            })
          } else if (state.pendingLinkData.length > 0) {
            // Link Preview Flow
            console.log('[chat-input] Processing link message')
            await dispatchMessage({
              type: 'link',
              content: text,
              links: state.pendingLinkData,
              timestamp: Date.now()
            })
          } else {
            // Standard Text Flow
            console.log('[chat-input] Processing text message')
            await dispatchMessage({
              type: 'text',
              content: text,
              timestamp: Date.now()
            })
          }

          resetUI()
          $bus.emit('ui:focus_input')
        } catch (err) {
          console.error('[chat-input] Failed to send:', err)
          alert('Failed to send: ' + err.message)
          state.isSending = false
          state.isUploading = false
        }
      }

      // Event Bus Subscriptions
      $bus.on('ui:cancel', () => {
        state.hasFile = false
        state.fileName = ''
        state.selectedFile = null
      })

      // Listen for video compression progress
      $bus.on('video:progress', (payload) => {
        state.uploadStatus = `Compressing video... ${payload.progress}%`
      })

      $bus.on('ui:file_selected', async (payload) => {
        let file = payload.file

        if (file.type.startsWith('image/')) {
          state.isCompressing = true
          state.uploadStatus = 'Compressing image...'
          try {
            const compressedBlob = await $image.compress(file, {
              maxWidth: 1200,
              maxHeight: 1200,
              quality: 0.8,
              format: 'image/webp'
            })
            // Create a new File from the Blob to keep the original name (with new extension)
            const newName = file.name.substring(0, file.name.lastIndexOf('.')) + '.webp'
            file = new File([compressedBlob], newName, { type: 'image/webp' })
          } catch (err) {
            console.warn('[chat-input] Image compression failed, using original file:', err)
          } finally {
            state.isCompressing = false
          }
        } else if (file.type.startsWith('video/')) {
          state.isCompressing = true
          state.uploadStatus = 'Processing video...'
          try {
            // Extract thumbnail and duration first
            const result = await $media.getMetadata(file)
            if (result.thumbnail) {
              const compressedThumbnail = await $image.compress(result.thumbnail, {
                maxWidth: 1200,
                maxHeight: 1200,
                quality: 0.8,
                format: 'image/webp'
              })
              state.thumbnailBlob = compressedThumbnail
            }
            state.duration = result.duration

            // Compress video if supported
            if ($media.isSupported()) {
              state.uploadStatus = 'Compressing video... 0%'
              const { buffer, mimeType, extension } = await $media.compress(file, {
                maxWidth: 1280,
                maxHeight: 720,
                bitrate: 2_000_000
              })
              const compressedBlob = new Blob([buffer], { type: mimeType })
              // Keep original name but change extension if needed
              let newName = file.name
              const lastDot = file.name.lastIndexOf('.')
              if (lastDot !== -1) {
                newName = file.name.substring(0, lastDot) + extension
              } else {
                newName = file.name + extension
              }
  
              file = new File([compressedBlob], newName, { type: mimeType })
            }
          } catch (err) {
            console.warn('[chat-input] Video processing failed, using original file:', err)
          } finally {
            state.isCompressing = false
          }
        }

        if (file.size > 100 * 1024 * 1024) {
          alert('File is too large. Maximum size is 100MB.')
          return
        }
        state.selectedFile = file
        state.fileName = file.name
        state.hasFile = true
        state.uploadStatus = 'Ready to send'
      })

      $bus.on('ui:mic_clicked', () => {
        state.isRecording = true
        const container = refs('voiceRecorderContainer')

        container.innerHTML = ''
        const el = document.createElement('chat-voice-recorder')
        container.appendChild(el)
      })

      $bus.on('ui:send_clicked', () => {
        sendMessage()
      })

      $bus.on('ui:voice_ready', (payload) => {
        sendMessage(payload.blob, payload.waveformData)
      })

      $bus.on('ui:voice_discarded', () => {
        state.isRecording = false
  
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
        $bus.emit('ui:focus_input')
      })

      $bus.on('ui:dismiss_link_preview', (payload) => {
        const url = payload.url
        state.ignoredUrls = {
          ...state.ignoredUrls,
          [url]: true
        }
        state.pendingLinkData = state.pendingLinkData.filter(d => d.url !== url)
  
        const container = refs('linkPreviewContainer')
        if (container) {
          const el = container.querySelector(`link-preview-input[url="${url}"]`)
          if (el) {
            el.remove()
          }
        }
      })
    }
  })
</script>
