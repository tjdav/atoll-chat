<template id="chat-input">
  <div class="chat-input-container p-3 border-top bg-body">
    <!-- Attachment Preview Bar -->
    <div class="{{ attachmentPreviewClass }}">
      <chat-attachment-preview 
        ref="attachmentPreview"
        file-name="{{ fileName }}" 
        upload-status="{{ uploadStatus }}"
      ></chat-attachment-preview>
    </div>

    <!-- Normal Input Mode -->
    <div class="{{ inputGroupClass }}">
      <chat-input-text
        ref="inputText"
        is-sending="{{ isSending }}"
        is-uploading="{{ isUploading }}"
      ></chat-input-text>
    </div>

    <!-- Recording Mode -->
    <div ref="voiceRecorderContainer" class="{{ recordingUIClass }}">
      <!-- chat-voice-recorder will be mounted here -->
    </div>
  </div>
</template>

<style>
  .chat-input-container {
    transition: background-color 0.2s ease;
  }
  .recording-mode-active {
    display: flex !important;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isSending: false,
      isUploading: false,
      uploadStatus: '',
      fileName: '',
      hasFile: false,
      isRecording: false,
      selectedFile: null
    }),
    getters: {
      attachmentPreviewClass: (state) => (state.hasFile ? 'd-block' : 'd-none'),
      inputGroupClass: (state) => (state.isRecording ? 'd-none' : 'd-block'),
      recordingUIClass: (state) => (state.isRecording ? 'recording-mode-active' : 'd-none')
    },
    client: ({ state, globalStore, pocketbase, localDb, eventBus, refs, signal }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $localDb } = localDb
      const { $bus } = eventBus

      const resetUI = () => {
        state.isSending = false
        state.isUploading = false
        state.uploadStatus = ''
        state.fileName = ''
        state.hasFile = false
        state.isRecording = false
        state.selectedFile = null
        $state.currentMessageText = ''
        const container = refs('voiceRecorderContainer')
        if (container) {
          container.innerHTML = ''
        }
      }

      const dispatchMessage = async (plaintextObj) => {
        const { sendEncryptedMessage } = await import('../utils/messageUtils.js')
        const result = await sendEncryptedMessage($state.activeSelectionId, plaintextObj, {
          pb,
          $localDb,
          $state
        })
  
        $bus.emit('message-sent', result)
        return result
      }

      const sendMessage = async (recordedBlob = null, waveformData = null) => {
        if (state.isSending || state.isUploading) {
          return
        }

        const text = ($state.currentMessageText || '').trim()
        const file = recordedBlob || state.selectedFile

        if (!text && !file) {
          return
        }

        state.isSending = true

        try {
          if (file) {
            // Media Flow
            state.isUploading = true
            state.uploadStatus = 'Encrypting file...'
  
            const { default: sodium } = await import('libsodium-wrappers-sumo')
            await sodium.ready

            // 1. Encrypt File
            const fileBuffer = new Uint8Array(await file.arrayBuffer())
            const fileKey = sodium.randombytes_buf(32)
            const fileNonce = sodium.randombytes_buf(24)
            const encryptedFile = sodium.crypto_secretbox_easy(fileBuffer, fileNonce, fileKey)
  
            // 2. Upload to media collection
            state.uploadStatus = 'Uploading...'
            const blob = new Blob([encryptedFile], { type: 'application/octet-stream' })
            const formData = new FormData()
            formData.append('file', blob, 'encrypted.bin')
  
            const mediaRecord = await pb.collection('media').create(formData)

            // Dispatch media message
            const mediaPlaintext = {
              type: 'media',
              content: recordedBlob ? '' : text,
              mime_type: file.type,
              media_id: mediaRecord.id,
              file_key: sodium.to_base64(fileKey, sodium.base64_variants.ORIGINAL),
              file_nonce: sodium.to_base64(fileNonce, sodium.base64_variants.ORIGINAL),
              waveform_data: waveformData,
              timestamp: Date.now()
            }
  
            await dispatchMessage(mediaPlaintext)
          } else {
            // Standard Text Flow
            await dispatchMessage({
              type: 'text',
              content: text,
              timestamp: Date.now()
            })
          }

          resetUI()
        } catch (err) {
          console.error('[chat-input] Failed to send:', err)
          alert('Failed to send: ' + err.message)
          state.isSending = false
          state.isUploading = false
        }
      }

      // Event Bus Subscriptions
      $bus.on('cancel', () => {
        state.hasFile = false
        state.fileName = ''
        state.selectedFile = null
      })

      $bus.on('file-selected', (payload) => {
        const file = payload.file
        if (file.size > 25 * 1024 * 1024) {
          alert('File is too large. Maximum size is 25MB.')
          return
        }
        state.selectedFile = file
        state.fileName = file.name
        state.hasFile = true
        state.uploadStatus = 'Ready to send'
      })

      $bus.on('mic-clicked', () => {
        state.isRecording = true
        const container = refs('voiceRecorderContainer')

        container.innerHTML = ''
        const el = document.createElement('chat-voice-recorder')
        container.appendChild(el)
      })

      $bus.on('send-clicked', () => {
        sendMessage()
      })

      $bus.on('voice-ready', (payload) => {
        sendMessage(payload.blob, payload.waveformData)
      })

      $bus.on('voice-discarded', () => {
        state.isRecording = false
  
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
      })
    }
  })
</script>
