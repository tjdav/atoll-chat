<template id="app-root">
  <div ref="container"></div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ globalStore, pocketbase, refs, eventBus, notifications, router, storage, push }) => {
      /* SHA-256 Generator Helper */
      async function sha256 (text) {
        const msgUint8 = new TextEncoder().encode(text)
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
        const hashArray = Array.from(new Uint8Array(hashBuffer))
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
      }

      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $notifications } = notifications
      const { $storage } = storage
      const { $push } = push
      const container = refs('container')

      let isDeviceTrusted = false

      router.init()

      const checkDeviceTrust = async () => {
        if (!$state.isAuthenticated) {
          isDeviceTrusted = false
          return
        }

        const user = pb.authStore.model
        if (!user) {
          isDeviceTrusted = false
          return
        }

        if (!user.totp_enabled) {
          isDeviceTrusted = true
          return
        }

        const localToken = localStorage.getItem('device_trust_token')
        if (!localToken) {
          isDeviceTrusted = false
          return
        }

        try {
          const hash = await sha256(localToken)
          const record = await pb.collection('users').getOne(user.id)
          const hashes = record.trusted_device_hashes || []
          isDeviceTrusted = hashes.includes(hash)
        } catch (err) {
          console.error('Device trust check failed:', err)
          isDeviceTrusted = false
        }
      }

      const updateUI = () => {
        console.log('[app-root] updateUI called', {
          isAuthenticated: $state.isAuthenticated,
          hasModel: !!pb.authStore.model,
          public_box_key: pb.authStore.model?.public_box_key
        })

        while (container.firstChild) {
          container.removeChild(container.firstChild)
        }

        if ($state.isAuthenticated && $state.isVaultUnlocked) {
          container.className = 'vh-100 vw-100 overflow-hidden'
          container.appendChild(document.createElement('app-layout'))
          container.appendChild(document.createElement('create-room-modal'))
        } else {
          container.className = 'vh-100 vw-100 d-flex align-items-center justify-content-center bg-body-tertiary'

          const contentWrapper = document.createElement('div')
          contentWrapper.className = 'container'

          const row = document.createElement('div')
          row.className = 'row justify-content-center'

          const col = document.createElement('div')
          col.className = 'col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4'

          row.appendChild(col)
          contentWrapper.appendChild(row)
          container.appendChild(contentWrapper)

          if (!$state.isAuthenticated) {
            if ($state.authView === 'register') {
              col.appendChild(document.createElement('auth-register'))
            } else {
              col.appendChild(document.createElement('auth-login'))
            }
          } else {
            /* User is authenticated. Check if device is trusted (2FA) */
            if (!isDeviceTrusted) {
              col.appendChild(document.createElement('totp-challenge'))
            } else {
              const user = pb.authStore.model
              if (user && user.public_box_key) {
                col.appendChild(document.createElement('vault-unlock'))
              } else {
                col.appendChild(document.createElement('vault-setup'))
              }
            }
          }
        }
      }

      // Magic link handler
      const handleMagicLink = async () => {
        const params = new URLSearchParams(window.location.search)
        const otpId = params.get('otpId')
        const code = params.get('code')

        if (otpId && code) {
          try {
            const url = new URL(window.location.href)
            url.searchParams.delete('otpId')
            url.searchParams.delete('code')
            window.history.replaceState({}, document.title, url.pathname + url.search)

            const authData = await pb.collection('users').authWithOTP(otpId, code)

            await $storage.saveConfigs([
              {
                key: 'pb_url',
                value: pb.baseUrl
              },
              {
                key: 'pb_token',
                value: pb.authStore.token
              }
            ])

            $state.currentUser = authData.record
            $state.isAuthenticated = true
          } catch (error) {
            console.error('Magic Link auth failed:', error)
            $bus.emit('ui:show_toast', {
              message: 'Magic link login failed. It may have expired or already been used.',
              type: 'danger'
            })
          }
        }
      }

      // Auth lifecycle management
      $bus.on('auth:unlocked', ({ keys, userRecord }) => {
        $state.currentUser = {
          ...userRecord,
          ...keys
        }

        if ($state.notificationsEnabled) {
          $notifications.requestPermission().catch(console.error)
        }

        $push.requestPermission()
          .then((granted) => {
            if (granted) {
              return $push.register()
            }
            throw new Error('Push permission not granted')
          })
          .then((token) => {
            if (token) {
              console.log('[app-root] Push registration successful, transmitting token to backend:', token)
              return pb.collection('users').update(userRecord.id, {
                push_subscription: token
              })
            }
          })
          .then((updatedUser) => {
            if (updatedUser) {
              console.log('[app-root] Push subscription updated on backend successfully.')
              $state.currentUser = {
                ...$state.currentUser,
                push_subscription: updatedUser.push_subscription
              }
            }
          })
          .catch((err) => {
            console.error('[app-root] Push notification registration/update failed:', err)
          })
      })

      $bus.on('auth:logout', () => {
        $state.currentUser = null
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      $bus.on('auth:totp_passed', () => {
        isDeviceTrusted = true
        updateUI()
      })

      // Authoritative initialization from PocketBase
      $state.isAuthenticated = pb.authStore.isValid
      if ($state.isAuthenticated) {
        $state.currentUser = pb.authStore.model
      }

      if (!$state.authView) {
        $state.authView = 'login'
      }

      // Execute Magic Link detection, device trust verification, and UI setup
      handleMagicLink().then(async () => {
        await checkDeviceTrust()
        updateUI()
      })

      $state.subscribe('isAuthenticated', async () => {
        await checkDeviceTrust()
        updateUI()
      })
      $state.subscribe('isVaultUnlocked', updateUI)
      $state.subscribe('authView', updateUI)
    }
  })
</script>
