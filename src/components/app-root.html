<template id="app-root">
  <div id="{{ ref_container }}" ref="container" class="app-root-container"></div>
</template>

<style>
  .app-root-container {
    height: 100vh;
    width: 100vw;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ globalStore, pocketbase, refs }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const container = refs('container')

      const updateUI = () => {
        // Clear previous content
        while (container.firstChild) {
          container.removeChild(container.firstChild)
        }

        if ($state.isAuthenticated) {
          container.className = 'app-root-container'
  
          if ($state.isVaultUnlocked) {
            // Full application view
            container.appendChild(document.createElement('app-layout'))
            container.appendChild(document.createElement('create-room-modal'))
          } else {
            // Check if vault needs setup or just unlocking
            const user = pb.authStore.model
            if (user && user.public_box_key) {
              // Vault exists, needs unlocking
              container.appendChild(document.createElement('vault-unlock'))
            } else {
              // No vault, needs setup
              container.className = 'app-root-container d-flex align-items-center justify-content-center bg-body-tertiary'
              container.appendChild(document.createElement('vault-setup'))
            }
          }
        } else {
          // Center auth components
          container.className = 'app-root-container d-flex align-items-center justify-content-center bg-body-tertiary'
          const tagName = $state.authView === 'register' ? 'auth-register' : 'auth-login'
          container.appendChild(document.createElement(tagName))
        }
      }

      // Authoritative initialization from PocketBase
      $state.isAuthenticated = pb.authStore.isValid
      if (!$state.authView) {
        $state.authView = 'login'
      }

      updateUI()

      if (typeof $state.subscribe === 'function') {
        $state.subscribe('isAuthenticated', updateUI)
        $state.subscribe('isVaultUnlocked', updateUI)
        $state.subscribe('authView', updateUI)
      }
    }
  })
</script>
