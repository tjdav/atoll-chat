<template id="app-layout">
  <div class="layout-container {{ layoutClasses }}">
    <!-- Mobile Nav Offcanvas -->
    <div class="offcanvas-sm offcanvas-start mobile-nav-offcanvas h-100" tabindex="-1" ref="mobileNav">
      <div class="d-flex h-100">
        <!-- Column 1: Navigation Sidebar -->
        <nav-sidebar></nav-sidebar>

        <!-- Column 2: Contextual List -->
        <div ref="columnTwo" class="contextual-list">
          <list-pane></list-pane>
        </div>
      </div>
    </div>

    <!-- Column 3: Main Detail View -->
    <div ref="columnThree" class="detail-view {{ layoutClasses }}">
      <div class="h-100 align-items-center justify-content-center" style="display: {{ emptyStateDisplay }};">
        <div class="text-center">
          <i class="bi bi-chat-dots fs-1 text-secondary mb-3 d-block"></i>
          <p class="text-muted mb-0">Select a conversation or item</p>
        </div>
      </div>
      <div class="h-100" style="display: {{ chatViewDisplay }};">
        <chat-view></chat-view>
      </div>
      <div class="h-100" style="display: {{ imageViewerDisplay }};">
        <image-viewer></image-viewer>
      </div>
      <div class="h-100" style="display: {{ videoPlayerDisplay }};">
        <video-player-view></video-player-view>
      </div>
      <div class="h-100" style="display: {{ audioPlayerDisplay }};">
        <audio-player-view></audio-player-view>
      </div>
      <div class="h-100" style="display: {{ documentViewerDisplay }};">
        <document-viewer></document-viewer>
      </div>
      <div class="h-100" style="display: {{ linkViewerDisplay }};">
        <link-viewer></link-viewer>
      </div>
    </div>
  </div>
  <call-overlay></call-overlay>
  <reaction-picker></reaction-picker>
  <avatar-editor></avatar-editor>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
    <div ref="globalToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          {{ toastMessage }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      activeSelectionId: null,
      activeSelectionType: null,
      currentAppView: 'chats',
      toastMessage: ''
    }),
    getters: {
      isDetailView: (state) => (state.activeSelectionId && ['chats', 'pictures', 'videos', 'music', 'documents', 'links'].includes(state.activeSelectionType)),
      layoutClasses: (state) => (state.isDetailView ? 'chat-active' : ''),
      emptyStateDisplay: (state) => (state.isDetailView ? 'none' : 'flex'),
      chatViewDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'chats' ? 'block' : 'none'),
      imageViewerDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'pictures' ? 'block' : 'none'),
      videoPlayerDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'videos' ? 'block' : 'none'),
      audioPlayerDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'music' ? 'block' : 'none'),
      documentViewerDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'documents' ? 'block' : 'none'),
      linkViewerDisplay: (state) => (state.activeSelectionId && state.activeSelectionType === 'links' ? 'block' : 'none')
    },
    client: async ({ state, globalStore, eventBus, bootstrap, refs }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { Toast, Offcanvas } = await bootstrap

      state.activeSelectionId = $state.activeSelectionId
      state.activeSelectionType = $state.activeSelectionType
      state.currentAppView = $state.currentAppView

      const toastEl = refs('globalToast')
      const toast = new Toast(toastEl)

      const mobileNavEl = refs('mobileNav')
      const mobileNav = new Offcanvas(mobileNavEl)

      $bus.on('ui:show_toast', ({ message, type = 'primary' }) => {
        state.toastMessage = message
        toastEl.className = `toast align-items-center text-white bg-${type} border-0 shadow`
        toast.show()
      })

      $bus.on('ui:open_mobile_nav', () => {
        mobileNav.show()
      })

      $bus.on('ui:selection_made', () => {
        if (window.innerWidth < 576) {
          mobileNav.hide()
        }
      })

      $state.subscribe('currentAppView', (val) => {
        state.currentAppView = val
      })
      $state.subscribe('activeSelectionId', (val) => {
        state.activeSelectionId = val
        // Close offcanvas when selection changes on mobile
        if (window.innerWidth < 576) {
          mobileNav.hide()
        }
      })
      $state.subscribe('activeSelectionType', (val) => {
        state.activeSelectionType = val
      })
    }
  })
</script>
