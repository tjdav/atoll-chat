<template id="vault-setup">
  <div class="vault-setup-container">
    <form ref="setupForm" class="auth-form">
      <h3>Secure Your Vault</h3>
      <p class="text-muted">Set a PIN to encrypt your local cryptographic keys. This PIN is never sent to the server.</p>
      <div class="form-group mb-3">
        <label for="pin">Vault PIN (min 6 characters)</label>
        <input ref="pin" id="pin" type="password" class="form-control" placeholder="Enter PIN" minlength="6" required>
      </div>
      <div class="form-group mb-3">
        <label for="pinConfirm">Confirm PIN</label>
        <input ref="pinConfirm" id="pinConfirm" type="password" class="form-control" placeholder="Confirm PIN" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Initialize Vault</button>
    </form>
    <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
    <div class="mt-3 text-center">
      <button type="button" class="btn btn-link btn-sm" ref="btnLogout">Logout</button>
    </div>
  </div>
</template>

<style>
  .vault-setup-container {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid #198754;
    border-radius: 0.5rem;
    background-color: #f8fff9;
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    script: ({ refs, pocketbase, eventBus, realtimeSync, globalStore }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const setupForm = refs('setupForm')
      const pinInput = refs('pin')
      const pinConfirmInput = refs('pinConfirm')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      btnLogout.addEventListener('click', () => {
        pb.authStore.clear()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      setupForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const pin = pinInput.value
        const pinConfirm = pinConfirmInput.value

        if (pin !== pinConfirm) {
          updateStatus('Error: PINs do not match')
          return
        }

        try {
          updateStatus('Initializing cryptographic modules...')
  
          // Dynamically import dependencies
          const [{ default: sodium }, {
            generateMasterKeys,
            generateSalt,
            deriveKeyFromPin,
            encryptVault
          }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])

          await sodium.ready

          updateStatus('Generating cryptographic keys...')
          const masterKeys = await generateMasterKeys(sodium)
          const pinSalt = generateSalt(sodium)

          updateStatus('Securing vault...')
          const KEK = await deriveKeyFromPin(pin, pinSalt, sodium)
  
          const encryptedVault = encryptVault({
            private_box_key: masterKeys.private_box_key,
            private_sign_key: masterKeys.private_sign_key
          }, KEK, sodium)

          const payload = {
            public_box_key: masterKeys.public_box_key,
            public_sign_key: masterKeys.public_sign_key,
            pin_salt: sodium.to_base64(pinSalt, sodium.base64_variants.ORIGINAL),
            encrypted_master_keys: encryptedVault
          }

          updateStatus('Saving vault to server...')
  
          // Update the user record in PocketBase with the vault data
          await pb.collection('users').update(pb.authStore.model.id, payload)

          updateStatus('Vault initialized! Starting session...')
  
          // Initialize worker with decrypted keys
          const { $worker } = await import('coralite').then(m => m.getContext().cryptoWorker())
          await $worker.execute('INIT_KEYS', {
            private_box_key: masterKeys.private_box_key,
            private_sign_key: masterKeys.private_sign_key
          })

          // Start real-time subscriptions
          await $sync.startSubscriptions()

          // Notify the application
          $bus.emit('auth:unlocked', {
            keys: {
              private_box_key: masterKeys.private_box_key,
              private_sign_key: masterKeys.private_sign_key
            },
            userRecord: pb.authStore.model
          })

          $state.isVaultUnlocked = true

        } catch (error) {
          console.error('Vault setup error:', error)
          updateStatus(`Error: ${error.message || 'Vault setup failed'}`)
        }
      })
    }
  })
</script>
