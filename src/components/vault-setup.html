<template id="vault-setup">
  <div class="card shadow">
    <div class="card-body p-4">
      
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <!-- Step 1: Password Creation -->
      <div ref="stepPassword">
        <h3 class="card-title mb-3 text-center">Secure Your Vault</h3>
        <p class="text-muted small text-center mb-4">Set a strong password to encrypt your local cryptographic keys. This password is never sent to the server.</p>
        <form ref="setupForm" class="needs-validation" novalidate>
          <input type="text" ref="vaultUsernameHidden" name="username" class="visually-hidden" autocomplete="username">
          <div class="mb-3">
            <label for="{{ ref_password }}" class="form-label">Vault Password</label>
            <div class="password-field-container">
              <input name="password" ref="password" type="password" class="form-control" placeholder="Enter Password" minlength="12" required autocomplete="new-password">
              <button type="button" class="password-toggle focus-ring" ref="passwordToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" data-testid="password-feedback"></div>
            <div class="progress mt-2" style="height: 5px;">
              <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div ref="strengthText" class="form-text small mt-1">Minimum 12 characters.</div>
          </div>
          <div class="mb-3">
            <label for="{{ ref_passwordConfirm }}" class="form-label">Confirm Password</label>
            <div class="password-field-container">
              <input name="passwordConfirm" ref="passwordConfirm" type="password" class="form-control" placeholder="Confirm Password" minlength="12" required autocomplete="new-password">
              <button type="button" class="password-toggle focus-ring" ref="passwordConfirmToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" data-testid="passwordConfirm-feedback"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100" ref="btnSubmit" disabled>Generate Vault Keys</button>
        </form>
      </div>

      <!-- Step 2: Recovery Codes Onboarding -->
      <div ref="stepRecovery" class="d-none">
        <h3 class="card-title mb-3 text-center">Save Recovery Codes</h3>
        <p class="text-muted small text-center mb-4">If you lose your password, these codes are the ONLY way to decrypt your vault. Save them securely.</p>
        
        <div class="mb-3">
          <textarea ref="codesDisplay" class="form-control text-center font-monospace bg-light p-3 fs-5" rows="6" readonly style="resize: none;"></textarea>
        </div>

        <div class="d-flex gap-2 mb-4">
          <button type="button" class="btn btn-outline-secondary w-50" ref="btnCopy">
            <i class="bi bi-clipboard me-1"></i> Copy to Clipboard
          </button>
          <button type="button" class="btn btn-outline-secondary w-50" ref="btnDownload">
            <i class="bi bi-download me-1"></i> Download .txt
          </button>
        </div>

        <button type="button" class="btn btn-primary w-100" ref="btnProceed" disabled data-testid="vaultSetupProceed">Proceed to Atoll Chat</button>
      </div>

      <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
      <div class="mt-3 text-center">
        <button type="button" class="btn btn-link btn-sm text-decoration-none" ref="btnLogout">Logout</button>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, pocketbase, eventBus, realtimeSync, globalStore, cryptoWorker, utils }) => {
      const { pb } = pocketbase
      const { $crypto } = utils
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const { $worker } = cryptoWorker

      const stepPassword = refs('stepPassword')
      const stepRecovery = refs('stepRecovery')
      const setupForm = refs('setupForm')
      const passwordInput = refs('password')
      const vaultUsernameHidden = refs('vaultUsernameHidden')
      const passwordConfirmInput = refs('passwordConfirm')
      const passwordToggle = refs('passwordToggle')
      const passwordConfirmToggle = refs('passwordConfirmToggle')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')
      const globalAlert = refs('globalAlert')

      const codesDisplay = refs('codesDisplay')
      const btnCopy = refs('btnCopy')
      const btnDownload = refs('btnDownload')
      const btnProceed = refs('btnProceed')

      let generatedCodes = []
      let encryptionPayload = null
      let decryptedKeysLocal = null
      let hasCopied = false
      let hasDownloaded = false
      let zxcvbnScore = 0

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        let sibling = input.closest('.password-field-container')?.nextElementSibling || input.nextElementSibling
        while (sibling) {
          if (sibling.classList.contains('invalid-feedback')) {
            return sibling
          }
          sibling = sibling.nextElementSibling
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target
          if (input.setCustomValidity) {
            input.setCustomValidity('')
          }
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage
          }
        })
      }

      registerInputReset(setupForm)

      if (pb.authStore.model) {
        vaultUsernameHidden.value = `${pb.authStore.model.username} - Vault`
      }

      const setupToggle = (input, toggle) => {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          const icon = toggle.querySelector('i')
          icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'
        })
      }

      setupToggle(passwordInput, passwordToggle)
      setupToggle(passwordConfirmInput, passwordConfirmToggle)

      const updateStrength = async () => {
        const password = passwordInput.value
        if (!password) {
          strengthBar.style.width = '0%'
          strengthBar.className = 'progress-bar'
          strengthText.textContent = 'Minimum 12 characters.'
          btnSubmit.disabled = true
          zxcvbnScore = 0
          return
        }

        try {
          const { default: zxcvbn } = await import('zxcvbn')
          const result = zxcvbn(password)
          zxcvbnScore = result.score
          const colors = ['bg-danger', 'bg-danger', 'bg-warning', 'bg-info', 'bg-success']
          const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong']

          strengthBar.style.width = `${(zxcvbnScore + 1) * 20}%`
          strengthBar.className = `progress-bar ${colors[zxcvbnScore]}`
          strengthText.textContent = `Strength: ${labels[zxcvbnScore]}. ${result.feedback.warning || ''}`

          btnSubmit.disabled = password.length < 12 || zxcvbnScore < 3
        } catch (err) {
          console.error('[vault-setup] zxcvbn error:', err)
          btnSubmit.disabled = password.length < 12
          zxcvbnScore = 3 // Safe fallback
        }
      }

      passwordInput.addEventListener('input', updateStrength)

      btnLogout.addEventListener('click', () => {
        pb.authStore.clear()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      const generateRecoveryCode = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
        const part = () => Array.from(crypto.getRandomValues(new Uint8Array(4)))
          .map(b => chars[b % chars.length])
          .join('')
        return `${part()}-${part()}-${part()}`
      }

      setupForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        showGlobalAlert('')

        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password.length < 12) {
          passwordInput.setCustomValidity('Password must be at least 12 characters.')
        } else if (zxcvbnScore < 3) {
          passwordInput.setCustomValidity('Password is too weak. Please use a stronger password.')
        } else {
          passwordInput.setCustomValidity('')
        }

        if (password !== passwordConfirm) {
          passwordConfirmInput.setCustomValidity('Passwords do not match')
        } else {
          passwordConfirmInput.setCustomValidity('')
        }

        updateValidationFeedback(setupForm)

        if (!setupForm.checkValidity()) {
          event.stopPropagation()
          setupForm.classList.add('was-validated')
          return
        }

        try {
          setupForm.classList.remove('was-validated')
          updateStatus('Generating secure master key...')
          const masterKeysRes = await $worker.execute('worker:generate_master_keys_v2')
          const salt = await $worker.execute('worker:randombytes_buf', { length: 16 })

          updateStatus('Deriving Vault Password key...')
          const KEK = await $worker.execute('worker:derive_key_from_password', {
            password,
            salt
          })

          updateStatus('Wrapping Master Key...')
          const passwordWrap = await $worker.execute('worker:encrypt_master_key_with_kek', {
            master_key: masterKeysRes.master_key,
            KEK
          })

          /* Generate 10 single-use recovery codes */
          generatedCodes = Array.from({ length: 10 }, () => generateRecoveryCode())
  
          updateStatus('Wrapping Master Key with Recovery Codes...')
          const recoveryWraps = []
          for (const code of generatedCodes) {
            const wrap = await $worker.execute('worker:encrypt_master_key_with_code', {
              master_key: masterKeysRes.master_key,
              code
            })
            recoveryWraps.push(wrap)
          }

          /* Prepare payload for server update */
          encryptionPayload = {
            public_box_key: masterKeysRes.public_box_key,
            public_sign_key: masterKeysRes.public_sign_key,
            vault_salt: $crypto.toBase64(salt),
            encrypted_master_keys: passwordWrap,
            recovery_wraps: recoveryWraps
          }

          /* Extract decrypted keys for worker:init_keys */
          decryptedKeysLocal = await $worker.execute('worker:decrypt_vault_v2', {
            encrypted_private_keys: masterKeysRes.encrypted_private_keys,
            master_key: masterKeysRes.master_key
          })

          /* Transition to step 2: display recovery codes */
          codesDisplay.value = generatedCodes.join('\n')
          stepPassword.classList.add('d-none')
          stepRecovery.classList.remove('d-none')
          updateStatus('')
        } catch (error) {
          console.error('Vault setup generation error:', error)
          if (error.status && error.status >= 500) {
            showGlobalAlert(error.message || 'Server error. Please try again.')
          } else {
            showGlobalAlert(`Error: ${error.message || 'Vault setup failed'}`)
          }
        }
      })

      btnCopy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(generatedCodes.join('\n'))
          hasCopied = true
          btnProceed.disabled = !(hasCopied || hasDownloaded)
          updateStatus('Recovery codes copied to clipboard!')
        } catch (err) {
          console.error('Clipboard copy failed:', err)
          updateStatus('Failed to copy. Please download the file or copy manually.')
        }
      })

      btnDownload.addEventListener('click', () => {
        try {
          const blob = new Blob([generatedCodes.join('\n')], { type: 'text/plain' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = 'atoll_recovery_codes.txt'
          document.body.appendChild(a)
          a.click()
          document.body.removeChild(a)
          URL.revokeObjectURL(url)

          hasDownloaded = true
          btnProceed.disabled = !(hasCopied || hasDownloaded)
          updateStatus('Recovery codes downloaded!')
        } catch (err) {
          console.error('Download failed:', err)
          updateStatus('Failed to download file. Please copy to clipboard.')
        }
      })

      btnProceed.addEventListener('click', async () => {
        try {
          updateStatus('Saving vault configuration to server...')
          await pb.collection('users').update(pb.authStore.model.id, encryptionPayload)
          await pb.collection('users').authRefresh()

          updateStatus('Vault active! Starting session...')
          await $worker.execute('worker:init_keys', {
            id: pb.authStore.model.id,
            private_box_key: decryptedKeysLocal.private_box_key,
            private_sign_key: decryptedKeysLocal.private_sign_key
          })

          await $sync.startSubscriptions()

          $bus.emit('auth:unlocked', {
            keys: {
              private_box_key: decryptedKeysLocal.private_box_key,
              private_sign_key: decryptedKeysLocal.private_sign_key
            },
            userRecord: pb.authStore.model
          })

          $state.isVaultUnlocked = true
        } catch (error) {
          console.error('Vault setup proceed error:', error)
          showGlobalAlert(`Error: ${error.message || 'Vault activation failed'}`)
        }
      })
    }
  })
</script>
