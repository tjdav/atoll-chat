<template id="vault-setup">
  <div class="card shadow">
    <div class="card-body p-4">
      <h3 class="card-title mb-3 text-center">Secure Your Vault</h3>
      <p class="text-muted small text-center mb-4">Set a strong password to encrypt your local cryptographic keys. This password is never sent to the server.</p>
      <form ref="setupForm">
        <input type="text" ref="vaultUsernameHidden" name="username" class="visually-hidden" autocomplete="username">
        <div class="mb-3">
          <label for="{{ ref_password }}" class="form-label">Vault Password</label>
          <div class="password-field-container">
            <input name="password" ref="password" type="password" class="form-control" placeholder="Enter Password" minlength="12" required autocomplete="new-password">
            <button type="button" class="password-toggle" ref="passwordToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="progress mt-2" style="height: 5px;">
            <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
          <div ref="strengthText" class="form-text small mt-1">Minimum 12 characters.</div>
        </div>
        <div class="mb-3">
          <label for="{{ ref_passwordConfirm }}" class="form-label">Confirm Password</label>
          <div class="password-field-container">
            <input name="passwordConfirm" ref="passwordConfirm" type="password" class="form-control" placeholder="Confirm Password" minlength="12" required autocomplete="new-password">
            <button type="button" class="password-toggle" ref="passwordConfirmToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" ref="btnSubmit" disabled>Initialize Vault with Password</button>
        <hr>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-primary" ref="btnPasskey">Setup with Passkey</button>
        </div>
      </form>
      <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
      <div class="mt-3 text-center">
        <button type="button" class="btn btn-link btn-sm text-decoration-none" ref="btnLogout">Logout</button>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, pocketbase, eventBus, realtimeSync, globalStore, cryptoWorker }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const { $worker } = cryptoWorker
      const setupForm = refs('setupForm')
      const passwordInput = refs('password')
      const vaultUsernameHidden = refs('vaultUsernameHidden')
      const passwordConfirmInput = refs('passwordConfirm')
      const passwordToggle = refs('passwordToggle')
      const passwordConfirmToggle = refs('passwordConfirmToggle')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')
      const btnPasskey = refs('btnPasskey')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      if (pb.authStore.model) {
        vaultUsernameHidden.value = `${pb.authStore.model.username} - Vault`
      }

      const setupToggle = (input, toggle) => {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          const icon = toggle.querySelector('i')
          icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'
        })
      }

      setupToggle(passwordInput, passwordToggle)
      setupToggle(passwordConfirmInput, passwordConfirmToggle)

      const updateStrength = async () => {
        const password = passwordInput.value
        if (!password) {
          strengthBar.style.width = '0%'
          strengthBar.className = 'progress-bar'
          strengthText.textContent = 'Minimum 12 characters.'
          btnSubmit.disabled = true
          return
        }

        try {
          const { default: zxcvbn } = await import('zxcvbn')
          const result = zxcvbn(password)
          const score = result.score
          const colors = ['bg-danger', 'bg-danger', 'bg-warning', 'bg-info', 'bg-success']
          const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong']

          strengthBar.style.width = `${(score + 1) * 20}%`
          strengthBar.className = `progress-bar ${colors[score]}`
          strengthText.textContent = `Strength: ${labels[score]}. ${result.feedback.warning || ''}`

          btnSubmit.disabled = password.length < 12 || score < 3
        } catch (err) {
          console.error('[vault-setup] zxcvbn error:', err)
          btnSubmit.disabled = password.length < 12
        }
      }

      passwordInput.addEventListener('input', updateStrength)

      btnLogout.addEventListener('click', () => {
        pb.authStore.clear()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      const initializeVault = async (masterKeys, encryptionPayload) => {
        try {
          updateStatus('Saving vault to server...')
          await pb.collection('users').update(pb.authStore.model.id, encryptionPayload)
  
          // Refresh auth record to ensure local authStore has the new vault fields (e.g. for unlock button logic)
          await pb.collection('users').authRefresh()

          updateStatus('Vault initialized! Starting session...')
          await $worker.execute('worker:init_keys', {
            id: pb.authStore.model.id,
            private_box_key: masterKeys.private_box_key,
            private_sign_key: masterKeys.private_sign_key
          })

          await $sync.startSubscriptions()

          $bus.emit('auth:unlocked', {
            keys: {
              private_box_key: masterKeys.private_box_key,
              private_sign_key: masterKeys.private_sign_key
            },
            userRecord: pb.authStore.model
          })

          $state.isVaultUnlocked = true
        } catch (error) {
          console.error('Vault initialization error:', error)
          updateStatus(`Error: ${error.message || 'Vault initialization failed'}`)
        }
      }

      setupForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password !== passwordConfirm) {
          updateStatus('Error: Passwords do not match')
          return
        }

        try {
          updateStatus('Initializing cryptographic modules...')
          const [{ default: sodium }, { generateMasterKeys, generateSalt, encryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          updateStatus('Generating cryptographic keys...')
          const masterKeys = await generateMasterKeys(sodium)
          const salt = generateSalt(sodium)

          updateStatus('Securing vault with Password (deriving keys)...')
          const KEK = await $worker.execute('worker:derive_key_from_password', {
            password,
            salt
          })
          const encryptedVault = encryptVault(masterKeys, KEK, sodium)

          await initializeVault(masterKeys, {
            public_box_key: masterKeys.public_box_key,
            public_sign_key: masterKeys.public_sign_key,
            vault_salt: sodium.to_base64(salt, sodium.base64_variants.ORIGINAL),
            encrypted_master_keys: encryptedVault
          })
        } catch (error) {
          console.error('Vault setup error:', error)
          updateStatus(`Error: ${error.message || 'Vault setup failed'}`)
        }
      })

      btnPasskey.addEventListener('click', async () => {
        try {
          updateStatus('Initializing cryptographic modules...')
          const [{ default: sodium }, { generateMasterKeys, createPasskey, deriveKeyFromPasskey, encryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          updateStatus('Generating cryptographic keys...')
          const masterKeys = await generateMasterKeys(sodium)

          updateStatus('Waiting for Passkey registration...')
          const challenge = crypto.getRandomValues(new Uint8Array(32))
          const passkeyPrfSalt = crypto.getRandomValues(new Uint8Array(32))
  
          let { credentialId, prfAvailable, prfResult: KEK } = await createPasskey(pb.authStore.model.username, challenge, passkeyPrfSalt)

          if (!prfAvailable) {
            throw new Error('This authenticator does not support the PRF extension required for vault encryption.')
          }

          // If the browser didn't return a PRF result during creation, fallback to assertion
          if (!KEK) {
            updateStatus('Securing vault with Passkey (verification step)...')
            KEK = await deriveKeyFromPasskey(credentialId, challenge, passkeyPrfSalt)
          } else {
            updateStatus('Securing vault with Passkey...')
          }

          const encryptedVault = encryptVault(masterKeys, KEK, sodium)

          await initializeVault(masterKeys, {
            public_box_key: masterKeys.public_box_key,
            public_sign_key: masterKeys.public_sign_key,
            passkey_credential_id: sodium.to_base64(credentialId, sodium.base64_variants.ORIGINAL),
            passkey_prf_salt: sodium.to_base64(passkeyPrfSalt, sodium.base64_variants.ORIGINAL),
            encrypted_master_keys_passkey: encryptedVault
          })
        } catch (error) {
          console.error('Passkey setup error:', error)
          updateStatus(`Error: ${error.message || 'Passkey setup failed'}`)
        }
      })
    }
  })
</script>
