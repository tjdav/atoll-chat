<template id="video-player-view">
  <div class="video-player-container d-flex flex-column h-100 bg-black position-relative">
    <viewer-header 
      title="Video Details" 
      subtitle="{{ fileName }}" 
      icon="bi-camera-video"
      theme="dark">
    </viewer-header>

    <div ref="carousel" class="carousel slide flex-grow-1 overflow-hidden" data-bs-interval="false">
      <div class="carousel-inner h-100" ref="carouselInner">
        <!-- Carousel items will be rendered here -->
      </div>
      
      <button class="carousel-control-prev" type="button" ref="btnPrev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" ref="btnNext">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="alert alert-danger m-3 position-absolute top-0 start-0 end-0" hidden="{{ isErrorHidden }}" style="z-index: 1050;">
      {{ errorMessage }}
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      fileName: ''
    }),
    client: async ({ state, signal, refs, globalStore, utils, eventBus, localDb, bootstrap }) => {
      const { $state } = globalStore
      const { $localDb } = localDb
      const { $utils } = utils
      const { $bus } = eventBus
      const { Carousel } = bootstrap
      const carouselEl = refs('carousel')
      const carouselInner = refs('carouselInner')
      const btnPrev = refs('btnPrev')
      const btnNext = refs('btnNext')

      let carouselInstance = null
      let loadedItems = []
      let hasMore = true
      let lastTimestamp = null
      const BATCH_SIZE = 24
      let isInternalChange = false

      const cleanup = () => {
        returnVideo()
        if (carouselInstance) {
          carouselInstance.dispose()
          carouselInstance = null
        }
      }

      signal.addEventListener('abort', cleanup)

      const returnVideo = () => {
        const getMasterVideo = $state.getMasterVideoElement
        if (getMasterVideo) {
          const video = getMasterVideo()
          const currentContainer = carouselInner.querySelector('.video-container:not(.d-none)')
          if (video && currentContainer && video.parentElement === currentContainer) {
            video.className = ''
            const engineContainer = document.querySelector('media-engine .d-none')
            if (engineContainer) {
              engineContainer.appendChild(video)
            }
          }
        }
      }

      const syncActiveVideo = (id, container) => {
        const isPlayingThis = ($state.currentMedia && $state.currentMedia.id === id)
        const videoPlaceholder = container.querySelector('.video-placeholder')
        const videoContainer = container.querySelector('.video-container')

        if (isPlayingThis) {
          const getMasterVideo = $state.getMasterVideoElement
          if (getMasterVideo) {
            const video = getMasterVideo()
            if (video) {
              video.className = 'w-100 h-100 object-fit-contain'
              videoContainer.appendChild(video)
              videoContainer.classList.remove('d-none')
              videoPlaceholder.classList.add('d-none')
            }
          }
        } else {
          videoContainer.classList.add('d-none')
          videoPlaceholder.classList.remove('d-none')
        }
      }

      const createCarouselItem = (item, isActive) => {
        const div = document.createElement('div')
        div.className = `carousel-item h-100 ${isActive ? 'active' : ''}`
        div.dataset.id = item.id
        div.innerHTML = `
          <div class="d-flex justify-content-center align-items-center h-100 overflow-hidden">
            <div class="video-placeholder flex-grow-1 w-100 h-100 d-flex flex-column align-items-center justify-content-center">
              <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center mb-3 btn-big-play" style="width: 120px; height: 120px;">
                <i class="bi bi-play-fill" style="font-size: 4rem;"></i>
              </button>
              <div class="text-white opacity-50">Playing on Global Media Manager</div>
            </div>
            <div class="video-container flex-grow-1 w-100 h-100 d-flex align-items-center justify-content-center d-none"></div>
          </div>
        `
        const btnPlay = div.querySelector('.btn-big-play')
        btnPlay.onclick = () => {
          if ($state.currentMedia && $state.currentMedia.id === item.id) {
            $bus.emit('media:toggle')
          } else {
            $bus.emit('media:play', {
              mediaId: item.id,
              type: 'videos'
            })
          }
        }
        return div
      }

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return []
        }
        let query = $localDb.local_assets.where('mime_type').startsWith('video/').reverse()
        const allMatching = await query.toArray()
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMatching.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawItems = allMatching.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          loadedItems = [...loadedItems, ...rawItems]
        }
        return rawItems
      }

      const renderBatch = (items, activeId) => {
        items.forEach(item => {
          const isActive = item.id === activeId
          const el = createCarouselItem(item, isActive)
          carouselInner.appendChild(el)
          if (isActive) {
            state.fileName = item.filename || 'Untitled Video'
            syncActiveVideo(item.id, el)
          }
        })
      }

      const initCarousel = async () => {
        cleanup()
        carouselInner.innerHTML = ''
        loadedItems = []
        lastTimestamp = null
        hasMore = true

        const activeId = $state.activeSelectionId
        while (!loadedItems.find(i => i.id === activeId) && hasMore) {
          await fetchNextBatch()
        }

        renderBatch(loadedItems, activeId)
  
        carouselInstance = new Carousel(carouselEl, {
          interval: false,
          touch: true,
          wrap: false
        })

        carouselEl.addEventListener('slid.bs.carousel', async (e) => {
          const activeItem = e.relatedTarget
          const id = activeItem.dataset.id
          const item = loadedItems.find(i => i.id === id)
  
          if (item) {
            isInternalChange = true
            $state.activeSelectionId = id
            state.fileName = item.filename || 'Untitled Video'
            syncActiveVideo(id, activeItem)
            isInternalChange = false
          }

          const index = loadedItems.findIndex(i => i.id === id)
          if (index >= loadedItems.length - 3 && hasMore) {
            const nextBatch = await fetchNextBatch()
            renderBatch(nextBatch, null)
          }
        })
      }

      btnPrev.onclick = () => carouselInstance?.prev()
      btnNext.onclick = async () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (!activeItem) {
          return
        }
        const id = activeItem.dataset.id
        const index = loadedItems.findIndex(i => i.id === id)
  
        if (index === loadedItems.length - 1 && hasMore) {
          const nextBatch = await fetchNextBatch()
          if (nextBatch.length > 0) {
            renderBatch(nextBatch, null)
            setTimeout(() => carouselInstance?.next(), 0)
          }
        } else {
          carouselInstance?.next()
        }
      }

      $state.subscribe('activeSelectionId', (id) => {
        if (isInternalChange || $state.activeSelectionType !== 'videos') {
          return
        }
        const index = loadedItems.findIndex(i => i.id === id)
        if (index !== -1) {
          carouselInstance?.to(index)
        } else {
          initCarousel()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type === 'videos') {
          initCarousel()
        }
      })

      $state.subscribe('playbackStatus', () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (activeItem) {
          const id = activeItem.dataset.id
          syncActiveVideo(id, activeItem)
          const icon = activeItem.querySelector('.btn-big-play i')
          if (icon) {
            const isPlayingThis = ($state.currentMedia && $state.currentMedia.id === id && $state.playbackStatus === 'playing')
            icon.className = `bi ${isPlayingThis ? 'bi-pause-fill' : 'bi-play-fill'}`
          }
        }
      })

      if ($state.activeSelectionType === 'videos') {
        initCarousel()
      }
    }
  })
</script>
