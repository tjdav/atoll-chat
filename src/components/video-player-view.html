<template id="video-player-view">
  <div class="video-player-container d-flex justify-content-center align-items-center h-100 bg-black position-relative">
    <div id="{{ ref_loader }}" class="spinner-border text-primary" ref="loader" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    
    <div class="alert alert-danger m-3 position-absolute top-0 start-0 end-0" hidden="{{ isErrorHidden }}">
      {{ errorMessage }}
    </div>

    <div id="{{ ref_videoContainer }}" ref="videoContainer" class="w-100 h-100 d-flex align-items-center justify-content-center">
       <div id="{{ ref_videoPlaceholder }}" ref="videoPlaceholder" class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
          <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center mb-3" id="{{ ref_btnBigPlay }}" ref="btnBigPlay" style="width: 120px; height: 120px;">
             <i class="bi {{ bigPlayIcon }}" style="font-size: 4rem;"></i>
          </button>
          <div class="text-white opacity-50">Playing on Global Media Bar</div>
       </div>
    </div>
  </div>
</template>

<style>
  .video-player-container {
    background-color: #000;
    width: 100%;
    height: 100%;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      bigPlayIcon: 'bi-play-fill'
    }),
    client: async ({ state, signal, refs, globalStore, utils }) => {
      const { $state } = globalStore
      const { $utils } = utils
      const loader = refs('loader')
      const btnBigPlay = refs('btnBigPlay')
      const videoContainer = refs('videoContainer')
      const videoPlaceholder = refs('videoPlaceholder')

      const syncUI = () => {
        const id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!id || type !== 'videos') {
          return
        }

        state.isErrorHidden = true
        state.errorMessage = ''
        loader.classList.add('d-none')

        if ($state.currentMedia && $state.currentMedia.id === id) {
          state.bigPlayIcon = $state.playbackStatus === 'playing' ? 'bi-pause-fill' : 'bi-play-fill'
  
          // Adopt video element
          const getMasterVideo = $state.getMasterVideoElement
          if (getMasterVideo) {
            const video = getMasterVideo()
            if (video) {
              video.className = 'w-100 h-100 object-fit-contain'
              videoContainer.appendChild(video)
              videoPlaceholder.classList.add('d-none')
            }
          }
        } else {
          state.bigPlayIcon = 'bi-play-fill'
          videoPlaceholder.classList.remove('d-none')
        }
      }

      const returnVideo = () => {
        const getMasterVideo = $state.getMasterVideoElement
        if (getMasterVideo) {
          const video = getMasterVideo()
          if (video && video.parentElement === videoContainer) {
            // Move it back to its original hidden container in global bar if we had a ref
            // But usually just removing it is enough if global-media-bar keeps its own ref
            video.className = ''
            // To be safe, we can move it back to the hidden div in global-media-bar
            const barHiddenDiv = document.querySelector('global-media-bar .visually-hidden')
            if (barHiddenDiv) {
              barHiddenDiv.appendChild(video)
            }
          }
        }
      }

      signal.addEventListener('abort', returnVideo)

      btnBigPlay.addEventListener('click', () => {
        const id = $state.activeSelectionId
        if (!id) {
          return
        }

        if ($state.currentMedia && $state.currentMedia.id === id) {
          if ($state.playbackStatus === 'playing') {
            $state.playbackStatus = 'paused'
          } else {
            $state.playbackStatus = 'playing'
          }
        } else {
          $state.currentMedia = {
            id,
            type: 'videos'
          }
          $state.playbackStatus = 'playing'
        }
      })

      const debouncedSync = $utils.debounce(syncUI, 50)
      debouncedSync()

      $state.subscribe('activeSelectionId', debouncedSync)
      $state.subscribe('activeSelectionType', debouncedSync)
      $state.subscribe('playbackStatus', () => {
        if ($state.currentMedia && $state.currentMedia.id === $state.activeSelectionId) {
          state.bigPlayIcon = $state.playbackStatus === 'playing' ? 'bi-pause-fill' : 'bi-play-fill'
          // Trigger sync again to adopt the video element if it was just started
          debouncedSync()
        }
      })
    }
  })
</script>
