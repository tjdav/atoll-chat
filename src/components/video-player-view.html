<template id="video-player-view">
  <div class="video-player-container d-flex flex-column h-100 bg-black position-relative">
    <viewer-header 
      title="Video Details" 
      subtitle="{{ fileName }}" 
      icon="bi-camera-video"
      theme="dark">
    </viewer-header>

    <div ref="carousel" class="carousel slide flex-grow-1 overflow-hidden" data-bs-interval="false">
      <div class="carousel-inner h-100" ref="carouselInner">
        <!-- Carousel items will be rendered here -->
      </div>
      
      <button class="carousel-control-prev" type="button" ref="btnPrev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" ref="btnNext">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="alert alert-danger m-3 position-absolute top-0 start-0 end-0" hidden="{{ isErrorHidden }}" style="z-index: 1050;">
      {{ errorMessage }}
    </div>
    <div class="d-none">
      <video ref="videoPlayer"></video>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      fileName: ''
    }),
    client: async ({ state, signal, refs, globalStore, utils, localDb, bootstrap }) => {
      const { $state } = globalStore
      const { $localDb } = localDb
      const { $media } = utils
      const { Carousel } = bootstrap
      const carouselEl = refs('carousel')
      const carouselInner = refs('carouselInner')
      const btnPrev = refs('btnPrev')
      const btnNext = refs('btnNext')
      const video = refs('videoPlayer')

      let carouselInstance = null
      let loadedItems = []
      let hasMore = true
      let lastTimestamp = null
      const BATCH_SIZE = 24
      let isInternalChange = false
      let initSequence = 0

      const BUFFER_SIZE = 3
      const CLEANUP_MARGIN = 2

  
      let playbackState = {
        currentId: null,
        status: 'idle',
        error: null
      }

      const cleanup = () => {
        stopLocalPlayback()
        if (carouselInstance) {
          carouselInstance.dispose()
          carouselInstance = null
        }
  
        loadedItems.forEach(item => {
          if (item.thumbnail) {
            const cacheKey = item.thumbnail.message_id || item.thumbnail.id || item.thumbnail.media_id
            const cached = $state.decryptionCache.get(cacheKey)
            if (cached && cached.blobUrl) {
              URL.revokeObjectURL(cached.blobUrl)
              $state.decryptionCache.delete(cacheKey)
            }
          }
        })
      }

      signal.addEventListener('abort', cleanup)

      const manageBuffer = async (currentIndex) => {
        if (currentIndex === -1) {
          return
        }

        const start = Math.max(0, currentIndex - BUFFER_SIZE)
        const end = Math.min(loadedItems.length - 1, currentIndex + BUFFER_SIZE)

  
        for (let i = start; i <= end; i++) {
          const item = loadedItems[i]
          const container = carouselInner.children[i]
          if (container) {
            decryptThumbnail(item, container)
          }
        }

  
        const cleanupThreshold = BUFFER_SIZE + CLEANUP_MARGIN
        for (let i = 0; i < loadedItems.length; i++) {
          if (i < currentIndex - cleanupThreshold || i > currentIndex + cleanupThreshold) {
            const item = loadedItems[i]
            if (item.thumbnail) {
              const cacheKey = item.thumbnail.message_id || item.thumbnail.id || item.thumbnail.media_id
              if ($state.decryptionCache.has(cacheKey)) {
                const cached = $state.decryptionCache.get(cacheKey)
                if (cached && cached.blobUrl) {
                  URL.revokeObjectURL(cached.blobUrl)
                  $state.decryptionCache.delete(cacheKey)

                  const container = carouselInner.children[i]
                  if (container) {
                    const img = container.querySelector('.thumbnail-img')
                    if (img) {
                      img.removeAttribute('src')
                    }
                  }
                }
              }
            }
          }
        }
      }

      const decryptThumbnail = async (item, container) => {
        const img = container.querySelector('.thumbnail-img')
        if (img && img.src) {
          return
        }

        try {
          let objectUrl
          if (item.thumbnail) {
            objectUrl = await $media.decrypt(item.thumbnail, signal)
          } else {
  
            const cached = $state.decryptionCache.get(item.message_id || item.id)
            if (cached?.thumbnailBlobUrl) {
              objectUrl = cached.thumbnailBlobUrl
            }
          }

          if (objectUrl && !signal.aborted && img) {
            img.src = objectUrl
          }
        } catch (err) {
          console.warn('[video-player-view] Thumbnail load failed:', err)
        }
      }

      const stopLocalPlayback = () => {
        if (video) {
          video.pause()
          video.removeAttribute('src')
          video.load()
        }
        playbackState = {
          currentId: null,
          status: 'idle',
          error: null
        }
        syncAll()
      }

      const syncActiveVideo = (id, container) => {
        const isSelectedThis = playbackState.currentId === id
        const videoPlaceholder = container.querySelector('.video-placeholder')
        const videoContainer = container.querySelector('.video-container')
        const loadingIndicator = container.querySelector('.video-loading')
        const errorDisplay = container.querySelector('.video-error')
        const errorMessage = container.querySelector('.error-text')

        if (isSelectedThis) {
          if (playbackState.status === 'loading') {
            loadingIndicator.classList.remove('d-none')
            videoPlaceholder.classList.remove('d-none')
            const bigPlay = videoPlaceholder.querySelector('.btn-big-play')
            if (bigPlay) {
              bigPlay.classList.add('d-none')
            }
            const playText = videoPlaceholder.querySelector('.play-text')
            if (playText) {
              playText.classList.add('d-none')
            }

            videoContainer.classList.add('d-none')
            errorDisplay.classList.add('d-none')
          } else if (playbackState.error) {
            errorDisplay.classList.remove('d-none')
            errorMessage.textContent = playbackState.error
            loadingIndicator.classList.add('d-none')
            videoPlaceholder.classList.add('d-none')
            videoContainer.classList.add('d-none')
          } else {
            video.className = 'w-100 h-100 object-fit-contain'
            videoContainer.appendChild(video)
            videoContainer.classList.remove('d-none')
            videoPlaceholder.classList.add('d-none')
            loadingIndicator.classList.add('d-none')
            errorDisplay.classList.add('d-none')
          }
        } else {
          videoContainer.classList.add('d-none')
          videoPlaceholder.classList.remove('d-none')
          const bigPlay = videoPlaceholder.querySelector('.btn-big-play')
          if (bigPlay) {
            bigPlay.classList.remove('d-none')
          }
          const playText = videoPlaceholder.querySelector('.play-text')
          if (playText) {
            playText.classList.remove('d-none')
          }
          loadingIndicator.classList.add('d-none')
          errorDisplay.classList.add('d-none')
        }
      }

      const playLocalMedia = async (item) => {
        if (playbackState.currentId === item.id) {
          if (playbackState.status === 'playing') {
            video.pause()
            playbackState.status = 'paused'
          } else {
            try {
              await video.play()
              playbackState.status = 'playing'
            } catch (e) {
              console.warn('[video-player-view] Play failed:', e)
            }
          }
          syncAll()
          return
        }

        stopLocalPlayback()
        playbackState.currentId = item.id
        playbackState.status = 'loading'
        syncAll()

        try {
          const objectUrl = await $media.decrypt(item, signal)
          video.src = objectUrl
          video.volume = $state.mediaVolume
          video.controls = true
          await video.play()
          playbackState.status = 'playing'
        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[video-player-view] Playback error:', err)
          playbackState.error = err.message
          playbackState.status = 'idle'
        }
        syncAll()
      }

      const createCarouselItem = (item, isActive) => {
        const div = document.createElement('div')
        div.className = `carousel-item h-100 ${isActive ? 'active' : ''}`
        div.dataset.id = item.id
        div.innerHTML = `
          <div class="d-flex justify-content-center align-items-center h-100 overflow-hidden position-relative">
            <div class="video-placeholder flex-grow-1 w-100 h-100 d-flex flex-column align-items-center justify-content-center position-relative">
              <img class="thumbnail-img position-absolute top-0 start-0 w-100 h-100 object-fit-contain opacity-50" style="z-index: 1;">
              <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center mb-3 btn-big-play position-relative" style="width: 120px; height: 120px; z-index: 2;">
                <i class="bi bi-play-fill" style="font-size: 4rem;"></i>
              </button>
              <div class="text-white opacity-50 position-relative play-text" style="z-index: 2;">Click to Play</div>
            </div>
            <div class="video-loading position-absolute top-50 start-50 translate-middle d-flex flex-column align-items-center justify-content-center d-none" style="z-index: 3;">
              <div class="spinner-border text-primary mb-3" style="width: 4rem; height: 4rem;" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="text-white fw-bold shadow-sm">Decrypting Video...</div>
            </div>
            <div class="video-error flex-grow-1 w-100 h-100 d-flex flex-column align-items-center justify-content-center d-none p-4 text-center" style="z-index: 4; background: rgba(0,0,0,0.7);">
              <i class="bi bi-exclamation-triangle text-danger mb-3" style="font-size: 3rem;"></i>
              <div class="text-white mb-3 error-text"></div>
              <button class="btn btn-outline-light btn-retry">Retry</button>
            </div>
            <div class="video-container flex-grow-1 w-100 h-100 d-flex align-items-center justify-content-center d-none"></div>
          </div>
        `
        div.querySelector('.btn-big-play').onclick = () => playLocalMedia(item)
        div.querySelector('.btn-retry').onclick = () => playLocalMedia(item)

        return div
      }

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return []
        }
        let query = $localDb.local_assets.where('mime_type').startsWith('video/').reverse()
        const allMatching = await query.toArray()
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMatching.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawItems = allMatching.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          loadedItems = [...loadedItems, ...rawItems]
        }
        return rawItems
      }

      const renderBatch = (items, activeId) => {
        items.forEach(item => {
          const isActive = item.id === activeId
          const el = createCarouselItem(item, isActive)
          carouselInner.appendChild(el)
          if (isActive) {
            state.fileName = item.filename || 'Untitled Video'
            syncActiveVideo(item.id, el)
          }
        })
      }

      const initCarousel = async () => {
        const seq = ++initSequence
        cleanup()
        carouselInner.innerHTML = ''
        loadedItems = []
        lastTimestamp = null
        hasMore = true

        const activeId = $state.activeSelectionId
        const activeAsset = activeId ? await $localDb.local_assets.get(activeId) : null
        if (seq !== initSequence) {
          return
        }
        const isValidActive = activeAsset && (activeAsset.mime_type || '').startsWith('video/')

        if (isValidActive) {
          while (!loadedItems.find(i => i.id === activeId) && hasMore) {
            await fetchNextBatch()
            if (seq !== initSequence) {
              return
            }
          }
        } else {
          await fetchNextBatch()
          if (seq !== initSequence) {
            return
          }
        }

        const actualActiveId = isValidActive ? activeId : (loadedItems[0]?.id || null)

        renderBatch(loadedItems, actualActiveId)

        const activeIndex = loadedItems.findIndex(i => i.id === actualActiveId)
        manageBuffer(activeIndex)
  
        carouselInstance = new Carousel(carouselEl, {
          interval: false,
          touch: true,
          wrap: false
        })

        carouselEl.addEventListener('slid.bs.carousel', async (e) => {
          const activeItem = e.relatedTarget
          const id = activeItem.dataset.id
          const index = loadedItems.findIndex(i => i.id === id)
          const item = loadedItems[index]
  
          if (item) {
            isInternalChange = true
            $state.activeSelectionId = id
            state.fileName = item.filename || 'Untitled Video'
  
            syncActiveVideo(id, activeItem)
            isInternalChange = false
            manageBuffer(index)
          }

          if (index >= loadedItems.length - 3 && hasMore) {
            const nextBatch = await fetchNextBatch()
            renderBatch(nextBatch, null)
          }
        })
      }

      btnPrev.onclick = () => carouselInstance?.prev()
      btnNext.onclick = async () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (!activeItem) {
          return
        }
        const id = activeItem.dataset.id
        const index = loadedItems.findIndex(i => i.id === id)
  
        if (index === loadedItems.length - 1 && hasMore) {
          const nextBatch = await fetchNextBatch()
          if (nextBatch.length > 0) {
            renderBatch(nextBatch, null)
            setTimeout(() => carouselInstance?.next(), 0)
          }
        } else {
          carouselInstance?.next()
        }
      }

      $state.subscribe('activeSelectionId', (id) => {
        if (isInternalChange || $state.activeSelectionType !== 'videos') {
          return
        }

        if (playbackState.currentId !== id) {
          stopLocalPlayback()
        }

        const index = loadedItems.findIndex(i => i.id === id)
        if (index !== -1) {
          carouselInstance?.to(index)
        } else {
          initCarousel()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type === 'videos') {
          initCarousel()
        }
      })

      const syncAll = () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (activeItem) {
          const id = activeItem.dataset.id
          syncActiveVideo(id, activeItem)
        }
      }

      $state.subscribe('mediaVolume', (vol) => {
        if (video) {
          video.volume = vol
        }
      })

      video.onplay = () => {
        playbackState.status = 'playing'
        syncAll()
      }

      video.onpause = () => {
        if (playbackState.status === 'playing') {
          playbackState.status = 'paused'
          syncAll()
        }
      }

      video.onended = () => {
        playbackState.status = 'idle'
        syncAll()
      }

      if ($state.activeSelectionType === 'videos') {
        initCarousel()
      }
    }
  })
</script>
