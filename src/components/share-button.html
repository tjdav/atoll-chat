<template id="share-button">
  <button ref="btnOpenShare" class="btn btn-primary btn-sm rounded-pill px-3 ms-2">
    <i class="bi bi-share me-1"></i> Share
  </button>

  <div ref="shareModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Share to...</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <div class="list-group list-group-flush overflow-y-auto" style="max-height: 400px;" ref="roomList">
            <!-- Rooms will be rendered here -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" ref="btnSend" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, storage, globalStore, eventBus, bootstrap, pocketbase, cryptoWorker, signal }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $worker } = cryptoWorker
      const { pb } = pocketbase
      const { Modal } = bootstrap

      const btnOpenShare = refs('btnOpenShare')
      const shareModalEl = refs('shareModal')
      const roomList = refs('roomList')
      const btnSend = refs('btnSend')

      let modal = null
      let selectedRoomIds = new Set()
      let loadedRooms = []

      if (shareModalEl) {
        modal = new Modal(shareModalEl)
      }

      const getInitials = (name) => {
        if (!name) {
          return '?'
        }
        return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
      }

      const createAvatarEl = (room) => {
        const div = document.createElement('div')
        div.className = 'avatar-circle d-flex align-items-center justify-content-center w-40px h-40px flex-shrink-0'
  

        // Simplified avatar logic for the modal
        if (!room.is_group) {
          const participants = room.participants || []
          const otherUser = participants.find(p => p && (p.id ? p.id !== $state.currentUser?.id : p !== $state.currentUser?.id))
  
          if (otherUser && typeof otherUser === 'object' && otherUser.avatar) {
            const avatarUrl = pb.files.getURL(otherUser, otherUser.avatar, { thumb: '40x40' })
            const img = document.createElement('img')
            img.src = avatarUrl
            img.className = 'w-100 h-100 object-fit-cover rounded-circle'
            div.appendChild(img)
            return div
          }
        }
  
        const name = room.name || (!room.is_group ? (room.participants?.find(p => p.id !== $state.currentUser?.id)?.name || room.participants?.find(p => p.id !== $state.currentUser?.id)?.username) : '')
        div.textContent = getInitials(name || 'Room')
        div.classList.add('bg-primary-subtle', 'text-primary', 'rounded-circle')
        return div
      }

      const renderRooms = () => {
        roomList.innerHTML = ''
        if (loadedRooms.length === 0) {
          roomList.innerHTML = '<div class="p-4 text-center text-muted">No rooms found</div>'
          return
        }

        loadedRooms.forEach(room => {
          const label = document.createElement('label')
          label.className = 'list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 cursor-pointer'
  
          const checkbox = document.createElement('input')
          checkbox.type = 'checkbox'
          checkbox.className = 'form-check-input flex-shrink-0'
          checkbox.checked = selectedRoomIds.has(room.id)
          checkbox.onchange = () => {
            if (checkbox.checked) {
              selectedRoomIds.add(room.id)
            } else {
              selectedRoomIds.delete(room.id)
            }
            btnSend.disabled = selectedRoomIds.size === 0
          }

          const avatar = createAvatarEl(room)
  
          let roomName = room.name
          if (!room.is_group) {
            const otherUser = (room.participants || []).find(p => p.id !== $state.currentUser?.id)
            roomName = otherUser ? (otherUser.name || otherUser.username) : 'Direct Message'
          }

          const nameSpan = document.createElement('span')
          nameSpan.className = 'text-truncate fw-medium'
          nameSpan.textContent = roomName || 'Unnamed Room'

          label.appendChild(checkbox)
          label.appendChild(avatar)
          label.appendChild(nameSpan)
          roomList.appendChild(label)
        })
      }

      btnOpenShare.onclick = async () => {
        selectedRoomIds.clear()
        btnSend.disabled = true
  
        // Fetch rooms sorted by most recent
        loadedRooms = await $storage.getAllRoomsSorted()
  
        renderRooms()
        modal.show()
      }

      btnSend.onclick = async () => {
        const id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!id || !type || selectedRoomIds.size === 0) {
          return
        }

        btnSend.disabled = true
        btnSend.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...'

        try {
          let shareParams = null

          if (type === 'links') {
            const msg = await $storage.getMessage(id)
            if (msg) {
              shareParams = {
                type: 'link',
                content: msg.content,
                links: msg.links
              }
            }
          } else {
            const asset = await $storage.getAsset(id)
            if (asset) {
              shareParams = {
                type: 'media',
                content: '',
                filename: asset.filename,
                mime_type: asset.mime_type,
                media_id: asset.id,
                file_key: asset.file_key,
                file_nonce: asset.file_nonce,
                music_metadata: asset.music_metadata,
                album_art: asset.album_art
              }
            }
          }

          if (!shareParams) {
            throw new Error('Could not resolve item to share')
          }

          if (shareParams.type === 'media') {
            const mime = shareParams.mime_type || ''
            if (mime.startsWith('image/')) {
              shareParams.media_types = ['image']
            } else if (mime.startsWith('video/')) {
              shareParams.media_types = ['video']
            } else if (mime.startsWith('audio/')) {
              shareParams.media_types = ['audio']
            }
          }

          const sendPromises = Array.from(selectedRoomIds).map(room_id => {
            return $worker.execute('worker:send_message', {
              room_id,
              localUuid: crypto.randomUUID(),
              ...shareParams,
              timestamp: Date.now()
            })
          })

          await Promise.all(sendPromises)

          $bus.emit('ui:show_toast', {
            message: `Shared with ${selectedRoomIds.size} room${selectedRoomIds.size > 1 ? 's' : ''}`,
            type: 'success'
          })

          modal.hide()
        } catch (err) {
          console.error('[share-button] Failed to share:', err)
          $bus.emit('ui:show_toast', {
            message: 'Failed to share: ' + err.message,
            type: 'danger'
          })
        } finally {
          btnSend.disabled = selectedRoomIds.size === 0
          btnSend.innerHTML = 'Send'
        }
      }

      signal.addEventListener('abort', () => {
        if (modal) {
          modal.dispose()
        }
      })
    }
  })
</script>

<style>
  .cursor-pointer {
    cursor: pointer;
  }
  .w-40px { width: 40px; }
  .h-40px { height: 40px; }
</style>
