<template id="jump-to-chat">
  <button ref="btnJump" class="btn btn-primary btn-sm rounded-pill px-3">
    <i class="bi bi-chat-left-text me-1"></i> Jump to Chat
  </button>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, localDb, globalStore, eventBus }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const btnJump = refs('btnJump')

      if (btnJump) {
        btnJump.onclick = async () => {
          const id = $state.activeSelectionId
          const type = $state.activeSelectionType
  
          if (!id || !type) {
            return
          }

          let roomId = null
          let messageId = null

          try {
            if (type === 'links') {
              const msg = await $localDb.local_messages.get(id)
              if (msg) {
                roomId = msg.room_id
                messageId = id
              }
            } else {
              // For pictures, videos, music, documents
              const asset = await $localDb.local_assets.get(id)
              if (asset) {
                roomId = asset.room_id
                messageId = asset.message_id
              }

              // Fallback for older assets without message_id
              if (!messageId && roomId) {
                const msg = await $localDb.local_messages
                  .where('room_id').equals(roomId)
                  .filter(m => m.media_id === id)
                  .first()
                if (msg) {
                  messageId = msg.local_uuid
                }
              }
            }

            if (roomId && messageId) {
              $state.currentAppView = 'chats'
              $state.activeSelectionId = roomId
              $state.activeSelectionType = 'chats'
  
              // Wait for timeline to mount and then emit scroll
              setTimeout(() => {
                $bus.emit('message:scroll_to', { messageId })
              }, 100)
            } else {
              console.warn('[jump-to-chat] Could not resolve room or message for', {
                id,
                type
              })
            }
          } catch (err) {
            console.error('[jump-to-chat] Error jumping to chat:', err)
          }
        }
      }
    }
  })
</script>
