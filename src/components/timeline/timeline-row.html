<template id="timeline-row">
  <div class="w-100 {{ marginClass }}" ref="container">
    <!-- Sender Name (Received First in Block only) -->
    <div class="sender-name {{ senderNameDisplayClass }}">
      {{ senderName }}
    </div>

    <div class="timeline-row-container {{ rowClass }}" ref="rowContainer">
      <!-- Avatar Column (Received only) -->
      <div class="avatar-col d-flex align-items-end {{ avatarColDisplayClass }}">
        <div ref="avatarContainer">
          <!-- Rendered in client block if showAvatar is true -->
        </div>
      </div>

      <div class="message-bubble-column d-flex flex-column {{ alignmentClass }}" ref="bubbleColumn">
        <div class="position-relative d-flex flex-column {{ alignmentClass }}" ref="bubbleWrapper">
          <slot></slot>
          <div ref="reactionIcon" class="reaction-trigger-icon position-absolute d-none" style="cursor: pointer; z-index: 10;">
            <i class="bi bi-emoji-smile text-muted"></i>
          </div>
        </div>
        <div ref="reactionsContainer"></div>
      </div>
    </div>

    <!-- Seen Indicators -->
    <div ref="seenContainer" class="seen-indicators px-2">
      <!-- Rendered in client block -->
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSent: String,
      isFirstInBlock: String,
      isLastInBlock: String,
      senderName: String,
      avatarUrl: String,
      avatarInitials: String,
      seenAvatars: String,
      messageId: String,
      localUuid: String
    },
    getters: {
      rowClass: (state) => {
        const isSent = state.isSent === 'true' || state.isSent === true
        return isSent ? 'sent' : 'received'
      },
      alignmentClass: (state) => {
        const isSent = state.isSent === 'true' || state.isSent === true
        return isSent ? 'align-items-end' : 'align-items-start'
      },
      senderNameDisplayClass: (state) => {
        return state.senderName ? 'd-block' : 'd-none'
      },
      avatarColDisplayClass: (state) => {
        const isSent = state.isSent === 'true' || state.isSent === true
        return isSent ? 'd-none' : 'd-flex'
      },
      marginClass: (state) => {
        const isLastInBlock = state.isLastInBlock === 'true' || state.isLastInBlock === true
        return isLastInBlock ? 'mb-3' : 'mb-1'
      }
    },
    client: ({ refs, state, globalStore, eventBus, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const container = refs('container')
      const avatarContainer = refs('avatarContainer')
      const seenContainer = refs('seenContainer')
      const bubbleWrapper = refs('bubbleWrapper')
      const reactionIcon = refs('reactionIcon')
      const reactionsContainer = refs('reactionsContainer')

      const updateAvatar = () => {
        avatarContainer.innerHTML = ''
        const isSent = state.isSent === 'true' || state.isSent === true
        const isLastInBlock = state.isLastInBlock === 'true' || state.isLastInBlock === true
  
        // In received blocks, we only show the avatar for the last message in the block
        if (isLastInBlock && !isSent) {
          if (state.avatarUrl) {
            const img = document.createElement('img')
            img.src = state.avatarUrl
            img.className = 'timeline-avatar'
            avatarContainer.appendChild(img)
          } else if (state.avatarInitials) {
            const initials = document.createElement('div')
            initials.className = 'timeline-avatar d-flex align-items-center justify-content-center bg-secondary text-white x-small'
            initials.textContent = state.avatarInitials
            avatarContainer.appendChild(initials)
          }
        }
      }

      const updateSeen = () => {
        seenContainer.innerHTML = ''
        if (!state.seenAvatars) {
          return
        }
  
        const parts = state.seenAvatars.split(',').filter(p => p.trim() !== '')
        parts.forEach(p => {
          const trimmed = p.trim()
          if (trimmed.includes('.') || trimmed.includes('/') || trimmed.startsWith('data:')) {
            const img = document.createElement('img')
            img.src = trimmed
            img.className = 'seen-avatar'
            seenContainer.appendChild(img)
          } else {
            const initials = document.createElement('div')
            initials.className = 'seen-avatar d-flex align-items-center justify-content-center bg-secondary text-white'
            initials.style.fontSize = '8px'
            initials.textContent = trimmed.substring(0, 1).toUpperCase()
            seenContainer.appendChild(initials)
          }
        })
      }

      $state.subscribe('isSent', updateAvatar)
      $state.subscribe('isLastInBlock', updateAvatar)
      $state.subscribe('avatarUrl', updateAvatar)
      $state.subscribe('avatarInitials', updateAvatar)
      $state.subscribe('seenAvatars', updateSeen)

      updateAvatar()
      updateSeen()

      // Reactions Integration
      const updateReactions = () => {
        const msgId = state.messageId
        const localUuid = state.localUuid
  
        // Update data-local-uuid for E2E
        if (localUuid) {
          container.setAttribute('data-local-uuid', localUuid)
        }
  
        if (msgId || localUuid) {
          reactionsContainer.innerHTML = ''
          const reactions = document.createElement('message-reactions')
          if (msgId) {
            reactions.setAttribute('message-id', msgId)
          }
          if (localUuid) {
            reactions.setAttribute('local-uuid', localUuid)
          }
          reactionsContainer.appendChild(reactions)
        }
      }

      $state.subscribe('messageId', updateReactions)
      $state.subscribe('localUuid', updateReactions)
      updateReactions()

      const getMsgId = () => state.messageId || state.localUuid

      // Hover is handled by CSS, but we need click for picker
      reactionIcon.onclick = (e) => {
        e.stopPropagation()
        const rect = reactionIcon.getBoundingClientRect()
        $bus.emit('ui:show_reaction_picker', {
          x: rect.left,
          y: rect.bottom + 5,
          targetId: getMsgId()
        })
      }

      // Long-press for mobile
      let pressTimer
      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          const touch = e.touches ? (e.touches[0] || e.changedTouches[0]) : e
          $bus.emit('ui:show_reaction_picker', {
            x: touch.clientX,
            y: touch.clientY,
            targetId: getMsgId()
          })
        }, 600)
      }
      const cancelPress = () => clearTimeout(pressTimer)

      bubbleWrapper.addEventListener('touchstart', startPress, { passive: true })
      bubbleWrapper.addEventListener('touchend', cancelPress)
      bubbleWrapper.addEventListener('touchmove', cancelPress)
      bubbleWrapper.addEventListener('mousedown', startPress)
      bubbleWrapper.addEventListener('mouseup', cancelPress)
      bubbleWrapper.addEventListener('mouseleave', cancelPress)

      signal.addEventListener('abort', () => {
        bubbleWrapper.removeEventListener('touchstart', startPress)
        bubbleWrapper.removeEventListener('touchend', cancelPress)
        bubbleWrapper.removeEventListener('touchmove', cancelPress)
        bubbleWrapper.removeEventListener('mousedown', startPress)
        bubbleWrapper.removeEventListener('mouseup', cancelPress)
        bubbleWrapper.removeEventListener('mouseleave', cancelPress)
      })
    }
  })
</script>
