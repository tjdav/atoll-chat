<template id="message-reactions">
  <div ref="container" class="message-reactions-wrapper">
    <!-- Messenger style consolidated pill -->
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      messageId: String,
      localUuid: String
    },
    client: (ctx) => {
      const { refs, state, globalStore, storage, eventBus, signal, utils } = ctx
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $func } = utils
      const container = refs('container')
  
      const tooltips = new Map()
      const cleanupTooltips = () => {
        tooltips.forEach(t => t?.dispose?.())
        tooltips.clear()
      }
      signal.addEventListener('abort', cleanupTooltips)

      const updateHasReactionsAttribute = (hasReactions) => {
        const host = container.getRootNode().host || container.closest('message-reactions')
        if (host) {
          if (hasReactions) {
            host.setAttribute('has-reactions', 'true')
          } else {
            host.removeAttribute('has-reactions')
          }

          let parentRow = host.closest('timeline-row')
          if (!parentRow) {
            let current = host
            while (current) {
              const root = current.getRootNode()
              if (root && root.host) {
                current = root.host
                if (current.tagName.toLowerCase() === 'timeline-row') {
                  parentRow = current
                  break
                }
              } else {
                break
              }
            }
          }

          if (parentRow) {
            if (hasReactions) {
              parentRow.setAttribute('has-reactions', 'true')
            } else {
              parentRow.removeAttribute('has-reactions')
            }
          }
        }
      }

      const loadReactions = async () => {
        const host = container.getRootNode().host || container.closest('message-reactions')
        const msgId = state.messageId || host?.getAttribute('message-id')
        const localUuid = state.localUuid || host?.getAttribute('local-uuid')
  
        if (!msgId && !localUuid) {
          container.innerHTML = ''
          updateHasReactionsAttribute(false)
          return
        }
  
        const ids = [msgId, localUuid].filter(Boolean)
        const reactions = await $storage.getMessageReactions(ids)
  
        const userReactions = {}
        reactions.sort((a, b) => {
          const timeA = new Date(a.created_at || a.timestamp || 0).getTime()
          const timeB = new Date(b.created_at || b.timestamp || 0).getTime()
          if (timeA !== timeB) {
            return timeA - timeB
          }
          return (a.local_uuid || '').localeCompare(b.local_uuid || '')
        }).forEach(r => {
          if (!userReactions[r.sender_id]) {
            userReactions[r.sender_id] = {}
          }

          // Handle both old (string) and new (object) content format
          let emoji = null
          if (typeof r.content === 'string') {
            emoji = r.content
          } else if (r.content && r.content.type === 'emoji') {
            emoji = r.content.value
          }

          if (!emoji) {
            return
          }

          if (!userReactions[r.sender_id][emoji]) {
            userReactions[r.sender_id][emoji] = { isSet: true }
          } else {
            userReactions[r.sender_id][emoji].isSet = !userReactions[r.sender_id][emoji].isSet
          }
        })
  
        const aggregated = {}
        let totalCount = 0
        Object.entries(userReactions).forEach(([userId, emojis]) => {
          Object.entries(emojis).forEach(([emoji, data]) => {
            if (data.isSet) {
              if (!aggregated[emoji]) {
                aggregated[emoji] = []
              }
              aggregated[emoji].push(userId)
              totalCount++
            }
          })
        })
  
        renderReactions(aggregated, totalCount)
      }
  
      const renderReactions = async (aggregated, totalCount) => {
        cleanupTooltips()
        container.innerHTML = ''
  
        const emojiEntries = Object.entries(aggregated).filter(([_, ids]) => ids.length > 0)
        if (emojiEntries.length === 0) {
          updateHasReactionsAttribute(false)
          return
        }

        updateHasReactionsAttribute(true)
  
        const pill = document.createElement('div')
        pill.className = 'reaction-consolidated-pill'
  
        const emojiList = document.createElement('div')
        emojiList.className = 'reaction-emoji-list'
  
        emojiEntries.forEach(([emoji]) => {
          const span = document.createElement('span')
          span.className = 'reaction-emoji-item'
          span.textContent = emoji
          emojiList.appendChild(span)
        })
  
        pill.appendChild(emojiList)
  
        if (totalCount > 1) {
          const countSpan = document.createElement('span')
          countSpan.className = 'reaction-count'
          countSpan.textContent = totalCount
          pill.appendChild(countSpan)
        }
  
        const room_id = $state.activeSelectionId
        const room = await $storage.getRoom(room_id)
        const participants = room?.participants || []
  
        const attributionLines = emojiEntries.map(([emoji, userIds]) => {
          const names = userIds.map(uid => {
            if (uid === $state.currentUser?.id) {
              return 'You'
            }
            const p = participants.find(part => part.id === uid)
            return p ? (p.name || p.username) : 'Unknown'
          }).join(', ')
          return `${emoji} ${names}`
        })
  
        pill.title = attributionLines.join('\n')
        pill.dataset.bsToggle = 'tooltip'
  
        if (window.bootstrap?.Tooltip) {
          const t = new window.bootstrap.Tooltip(pill, {
            trigger: 'hover focus',
            placement: 'bottom'
          })
          tooltips.set(pill, t)
        }

        pill.onclick = (e) => {
          e.stopPropagation()
          const host = container.getRootNode().host || container.closest('message-reactions')
          const currentId = state.messageId || host?.getAttribute('message-id') || state.localUuid || host?.getAttribute('local-uuid')
  
          if (emojiEntries.length === 1) {
            $bus.emit('message:send_reaction', {
              targetId: currentId,
              content: {
                type: 'emoji',
                value: emojiEntries[0][0]
              }
            })
          } else {
            const rect = pill.getBoundingClientRect()
            $bus.emit('ui:show_reaction_picker', {
              x: rect.left,
              y: rect.bottom + 5,
              targetId: currentId
            })
          }
        }

        // Mobile long-press
        let pressTimer
        const startPress = () => {
          pressTimer = setTimeout(() => tooltips.get(pill)?.show(), 600)
        }
        const cancelPress = () => clearTimeout(pressTimer)
        pill.addEventListener('touchstart', startPress, { passive: true })
        pill.addEventListener('touchend', cancelPress)
        pill.addEventListener('touchmove', cancelPress)
  
        container.appendChild(pill)
      }
  
      const debouncedLoad = $func.debounce(loadReactions, 100)
  
      $bus.on('db:new_local_data', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          const host = container.getRootNode().host || container.closest('message-reactions')
          const currentMsgId = state.messageId || host?.getAttribute('message-id')
          const currentLocalUuid = state.localUuid || host?.getAttribute('local-uuid')
  
          if (payload.message && payload.message.type === 'reaction') {
            const targetId = payload.message.target_id
            if (targetId === currentMsgId || targetId === currentLocalUuid) {
              debouncedLoad()
            }
          } else if (!payload.message) {
            debouncedLoad()
          } else if (payload.message.local_uuid === currentLocalUuid || payload.message.id === currentMsgId) {
            debouncedLoad()
          }
        }
      })
  
      const host = container.getRootNode().host || container.closest('message-reactions')
      if (host instanceof Node) {
        const observer = new MutationObserver(() => debouncedLoad())
        observer.observe(host, { attributes: true })
        signal.addEventListener('abort', () => observer.disconnect())
      }

      debouncedLoad()
    }
  })
</script>
