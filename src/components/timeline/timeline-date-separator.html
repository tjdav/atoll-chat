<template id="timeline-date-separator">
  <div class="date-separator">
    {{ formattedDate }}
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      timestamp: String
    },
    getters: {
      formattedDate: (state) => {
        if (!state.timestamp) {
          return ''
        }
        try {
          const d = new Date(state.timestamp)
          const options = {
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }
          return d.toLocaleDateString('en-AU', options)
        } catch (e) {
          return state.timestamp
        }
      }
    }
  })
</script>
