<template id="media-preview">
  <div ref="container" class="media-preview-container rounded-3 overflow-hidden mb-1 position-relative" style="min-height: 200px; min-width: 250px;">
    <div ref="loading" class="{{ loadingClass }} w-100 h-100 d-flex flex-column align-items-center justify-content-center p-3 text-center" style="background: var(--bs-tertiary-bg);">
      <div class="placeholder col-8 mb-2" style="height: 24px;"></div>
      <div class="placeholder col-4" style="height: 16px;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String,
      isSent: {
        type: Boolean,
        default: false
      }
    },
    getters: {
      loadingClass: (state) => (state.status === 'pending' ? 'placeholder-glow' : 'placeholder-wave')
    },
    client: async ({ refs, state, localDb, globalStore, pocketbase, eventBus, signal }) => {
      const { $localDb } = localDb
      const { pb } = pocketbase
      const { $state } = globalStore
      const { $bus } = eventBus
      const container = refs('container')
      const loading = refs('loading')

      let lastCallId = 0

      const renderMedia = (objectUrl, mimeType) => {
        if (!objectUrl) {
          return
        }

        // Deduplication check
        const existing = container.querySelectorAll('img, video')
        if (existing.length > 0) {
          const currentEl = existing[0]
          if (currentEl.src === objectUrl || currentEl.src.endsWith(objectUrl)) {
            loading.classList.add('d-none')
            container.style.minHeight = 'auto'
            return
          }
          existing.forEach(el => el.remove())
        }

        loading.classList.add('d-none')
        container.style.minHeight = 'auto'

        if (mimeType.startsWith('image/')) {
          const img = document.createElement('img')
          img.src = objectUrl
          img.className = 'img-fluid rounded-3 shadow-sm'
          img.style.maxHeight = '300px'
          img.onload = () => $bus.emit('ui:media_loaded')
          container.appendChild(img)
        } else if (mimeType.startsWith('video/')) {
          const video = document.createElement('video')
          video.src = objectUrl
          video.muted = true
          video.loop = true
          video.className = 'img-fluid rounded-3 shadow-sm'
          video.style.maxHeight = '300px'
          video.onloadeddata = () => $bus.emit('ui:media_loaded')
          video.addEventListener('mouseenter', () => video.play())
          video.addEventListener('mouseleave', () => video.pause())
          container.appendChild(video)
        }
      }

      const loadMedia = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }

          // 1. Synchronous Cache Check
          const cached = $state.decryptionCache.get(state.localUuid)
          if (cached) {
            const objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            const mimeType = (typeof cached === 'object' ? cached.mimeType : null) || 'image/webp'
            renderMedia(objectUrl, mimeType)
            // If we have both, we might be done, but Alice still needs to wait for DB to get the mediaId for clicks
          }

          // 2. Async Lifecycle: Fetch from DB and Decrypt
          const message = await $localDb.local_messages.get(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          let objectUrl = typeof cached === 'string' ? cached : cached?.blobUrl
          let mimeType = message?.mime_type || (typeof cached === 'object' ? cached.mimeType : null) || 'image/webp'

          if (!objectUrl) {
            if (!message || !message.file_key) {
              if (state.status === 'pending') {
                return
              }
              throw new Error('Message or key missing')
            }

            const { default: sodium } = await import('libsodium-wrappers-sumo')
            await sodium.ready
            if (callId !== lastCallId || signal.aborted) {
              return
            }

            const mediaRecord = await pb.collection('media').getOne(message.media_id)
            const fileUrl = pb.files.getURL(mediaRecord, mediaRecord.file)

            const response = await fetch(fileUrl, { signal })
            if (!response.ok) {
              throw new Error('Fetch failed')
            }
            const encryptedData = new Uint8Array(await response.arrayBuffer())

            const key = sodium.from_base64(message.file_key, sodium.base64_variants.ORIGINAL)
            const nonce = sodium.from_base64(message.file_nonce, sodium.base64_variants.ORIGINAL)

            const decryptedData = sodium.crypto_secretbox_open_easy(encryptedData, nonce, key)
            if (!decryptedData) {
              throw new Error('Decryption failed')
            }

            const blob = new Blob([decryptedData], { type: message.mime_type })
            objectUrl = URL.createObjectURL(blob)
            mimeType = message.mime_type
            $state.decryptionCache.set(state.localUuid, {
              blobUrl: objectUrl,
              mimeType: mimeType
            })
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderMedia(objectUrl, mimeType)

          container.onclick = async () => {
            const msg = await $localDb.local_messages.get(state.localUuid)
            if (!msg?.media_id) {
              return
            }
            const targetView = (msg.mime_type || '').startsWith('image/') ? 'pictures' : 'videos'
            $state.currentAppView = targetView
            $state.activeSelectionType = targetView
            $state.activeSelectionId = msg.media_id
          }

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[media-preview] Error:', err)
          loading.innerHTML = `
            <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
            <div class="x-small mt-1">Failed to load</div>
          `
        }
      }

      if (typeof state.subscribe === 'function') {
        state.subscribe('status', loadMedia)
        state.subscribe('localUuid', loadMedia)
      }

      loadMedia()
    }
  })
</script>
