<template id="media-preview">
  <div ref="container" class="media-preview-container rounded-3 overflow-hidden mb-1 position-relative" style="min-height: 200px; min-width: 250px;">
    <div ref="loading" class="{{ loadingClass }} w-100 h-100 d-flex flex-column align-items-center justify-content-center p-3 text-center" style="background: var(--bs-tertiary-bg);">
      <div class="placeholder col-8 mb-2" style="height: 24px;"></div>
      <div class="placeholder col-4" style="height: 16px;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String,
      isSent: {
        type: Boolean,
        default: false
      }
    },
    getters: {
      loadingClass: (state) => (state.status === 'pending' ? 'placeholder-glow' : 'placeholder-wave')
    },
    client: async ({ refs, state, localDb, globalStore, pocketbase, eventBus, signal, utils }) => {
      const { $localDb } = localDb
      const { pb } = pocketbase
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $utils } = utils
      const container = refs('container')
      const loading = refs('loading')

      let lastCallId = 0

      const renderMedia = (objectUrl, mimeType, duration = 0) => {
        if (!objectUrl) {
          return
        }

        // Deduplication check
        const existing = container.querySelector('img')
        if (existing) {
          if (existing.src === objectUrl || existing.src.endsWith(objectUrl)) {
            loading.classList.add('d-none')
            container.style.minHeight = 'auto'
            return
          }
        }
        container.innerHTML = ''
        container.appendChild(loading)

        loading.classList.add('d-none')
        container.style.minHeight = 'auto'

        const img = document.createElement('img')
        img.src = objectUrl
        img.className = 'img-fluid rounded-3 shadow-sm w-100 h-100 object-fit-cover'
        img.style.maxHeight = '300px'
        img.onload = () => $bus.emit('ui:media_loaded')
        container.appendChild(img)

        if (mimeType.startsWith('video/')) {
          const overlay = document.createElement('div')
          overlay.className = 'position-absolute bottom-0 start-0 p-2 d-flex align-items-center'
          overlay.style.background = 'linear-gradient(transparent, rgba(0,0,0,0.5))'
          overlay.style.width = '100%'

          const badge = document.createElement('div')
          badge.className = 'bg-black bg-opacity-75 text-white px-2 py-1 rounded-pill d-flex align-items-center'
          badge.style.fontSize = '0.75rem'
          badge.innerHTML = `
            <i class="bi bi-play-fill me-1"></i>
            <span>${$utils.formatDuration(duration)}</span>
          `
          overlay.appendChild(badge)
          container.appendChild(overlay)
        }
      }

      const loadMedia = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }

          // 1. Synchronous Cache Check
          const cached = $state.decryptionCache.get(state.localUuid)
          if (cached) {
            const isVideo = (cached.mimeType || '').startsWith('video/')
            const objectUrl = isVideo ? cached.thumbnailBlobUrl : (cached.blobUrl || cached)
            if (objectUrl) {
              const mimeType = (typeof cached === 'object' ? cached.mimeType : null) || 'image/webp'
              renderMedia(objectUrl, mimeType, cached.duration)
            }
          }

          // 2. Async Lifecycle: Fetch from DB and Decrypt
          const message = await $localDb.local_messages.get(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          let objectUrl = null
          let mimeType = message?.mime_type || (typeof cached === 'object' ? cached?.mimeType : null) || 'image/webp'
          let duration = message?.duration || cached?.duration || 0

          if (mimeType.startsWith('video/')) {
            objectUrl = cached?.thumbnailBlobUrl
            if (!objectUrl && message?.thumbnail) {
              objectUrl = await $utils.fetchAndDecrypt(message.thumbnail, signal)
            }
            if (!objectUrl) {
              throw new Error('Video thumbnail missing')
            }
          } else {
            objectUrl = typeof cached === 'string' ? cached : cached?.blobUrl
            if (!objectUrl) {
              if (!message || !message.file_key) {
                if (state.status === 'pending') {
                  return
                }
                throw new Error('Message or key missing')
              }

              objectUrl = await $utils.fetchAndDecrypt({
                media_id: message.media_id,
                file_key: message.file_key,
                file_nonce: message.file_nonce,
                mime_type: message.mime_type,
                message_id: state.localUuid
              }, signal)
            }
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderMedia(objectUrl, mimeType, duration)

          container.onclick = async () => {
            const msg = await $localDb.local_messages.get(state.localUuid)
            if (!msg?.media_id) {
              return
            }
            const targetView = (msg.mime_type || '').startsWith('image/') ? 'pictures' : 'videos'
            $state.currentAppView = targetView
            $state.activeSelectionType = targetView
            $state.activeSelectionId = msg.media_id
          }

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[media-preview] Error:', err)
          loading.innerHTML = `
            <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
            <div class="x-small mt-1">Failed to load</div>
          `
        }
      }

      if (typeof state.subscribe === 'function') {
        state.subscribe('status', loadMedia)
        state.subscribe('localUuid', loadMedia)
      }

      loadMedia()
    }
  })
</script>
