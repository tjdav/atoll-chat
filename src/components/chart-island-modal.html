<template id="chart-island-modal">
  <!-- Chart New Island Modal -->
  <div ref="chartIslandModal" class="modal fade" tabindex="-1" aria-hidden="true" data-testid="chartIslandModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Chart New Island</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form ref="chartIslandForm" data-testid="chartIslandForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="{{ ref_islandUrl }}" class="form-label">Island URL</label>
              <input type="url" class="form-control" ref="islandUrl" name="islandUrl" placeholder="https://corporate.my-chat.com" required data-testid="islandUrlField">
              <div class="form-text small">Enter the URL of the PocketBase server.</div>
            </div>
            <div ref="modalError" class="text-danger small" style="min-height: 1.25rem;" data-testid="modalError"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" ref="btnVerifyIsland" data-testid="btnVerifyIsland">Connect</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, eventBus, globalStore, cryptoWorker, storage, bootstrap }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $worker } = cryptoWorker
      const { $storage } = storage
      const { Modal } = await bootstrap

      const modalEl = refs('chartIslandModal')
      const chartIslandForm = refs('chartIslandForm')
      const islandUrlInput = refs('islandUrl')
      const modalError = refs('modalError')
      const btnVerifyIsland = refs('btnVerifyIsland')

      const modal = new Modal(modalEl)

      const deriveIslandFromUrl = (urlStr) => {
        try {
          const url = new URL(urlStr)
          const host = url.hostname
          const parts = host.split('.')
          let name = parts[0]
          if (name === 'www' && parts.length > 1) {
            name = parts[1]
          }
          const cleanUrl = url.origin
          const id = 'ws_' + btoa(cleanUrl).replace(/=/g, '').slice(-15)
          return {
            id,
            name,
            url: cleanUrl
          }
        } catch (_e) {
          const sanitized = urlStr.trim().replace(/\/+$/, '')
          const id = 'ws_' + btoa(sanitized).replace(/=/g, '').slice(-15)
          return {
            id,
            name: 'Island',
            url: sanitized
          }
        }
      }

      const handleSwitchIsland = async (newId, force = false) => {
        if (pb.authStore.activeWorkspaceId === newId && !force) {
          return
        }

        $state.activeSelectionId = null
        $state.activeSelectionType = null

        pb.authStore.setActiveWorkspace(newId)
        const active = pb.authStore.workspaces.find(w => w.id === newId)
        pb.baseUrl = active ? active.url : ''

        const contextRes = await $worker.execute('worker:set_workspace_context', {
          workspaceId: newId,
          baseUrl: pb.baseUrl
        })

        await $storage.initialize('AtollChatDB_' + newId)

        $state.isAuthenticated = pb.authStore.isValid
        $state.currentUser = pb.authStore.model

        if ($state.isAuthenticated) {
          if (contextRes.isInitialized) {
            $state.isVaultUnlocked = true
            $bus.emit('auth:unlocked', {
              keys: {
                private_box_key: contextRes.private_box_key,
                private_sign_key: contextRes.private_sign_key
              },
              userRecord: pb.authStore.model
            })
            $bus.emit('sync:complete')
          } else {
            $state.isVaultUnlocked = false
          }
        } else {
          $state.isVaultUnlocked = false
          $state.authView = 'login'
        }

        $state.activeIslandId = newId
        $state.islands = pb.authStore.workspaces || []

        $bus.emit('ui:show_toast', {
          message: `Switched to Island: ${active ? active.name : 'Island'}`,
          type: 'success'
        })
      }

      $bus.on('ui:open_chart_island_modal', () => {
        modalError.textContent = ''
        islandUrlInput.value = ''
        modal.show()
      })

      chartIslandForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        modalError.textContent = ''
        btnVerifyIsland.disabled = true
        btnVerifyIsland.textContent = 'Verifying...'

        let urlInput = islandUrlInput.value.trim()
        if (!/^https?:\/\//i.test(urlInput)) {
          urlInput = 'http://' + urlInput
        }
        urlInput = urlInput.replace(/\/+$/, '')

        try {
          const response = await fetch(`${urlInput}/api/health`, {
            method: 'GET',
            mode: 'cors'
          })
          if (!response.ok) {
            throw new Error(`Server returned ${response.status}`)
          }
          const data = await response.json()
          if (data.code !== 200 && !data.message) {
            throw new Error('Not a valid PocketBase server')
          }

          const islandInfo = deriveIslandFromUrl(urlInput)

          const exists = pb.authStore.workspaces.some(w => w.id === islandInfo.id)
          if (exists) {
            modalError.textContent = 'This Island has already been added.'
            btnVerifyIsland.disabled = false
            btnVerifyIsland.textContent = 'Connect'
            return
          }

          pb.authStore.addWorkspace({
            id: islandInfo.id,
            name: islandInfo.name,
            url: islandInfo.url,
            token: '',
            user: null
          })

          modal.hide()
          await handleSwitchIsland(islandInfo.id, true)
        } catch (err) {
          console.error('[chart-island] Connection failed:', err)
          modalError.textContent = 'Failed to connect. Make sure the URL points to an active Atoll Chat/PocketBase instance.'
        } finally {
          btnVerifyIsland.disabled = false
          btnVerifyIsland.textContent = 'Connect'
        }
      })
    }
  })
</script>
