<template id="p2p-reroute-modal">
  <div ref="rerouteModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select Recipient</h5>
          <button type="button" class="btn-close" ref="btnClose" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <div class="p-3 text-muted border-bottom text-center">
            Files larger than 25MB cannot be uploaded to the group chat directly. Please select a participant to transfer the file to directly.
          </div>
          <div class="list-group list-group-flush" ref="listContainer" style="max-height: 300px; overflow-y: auto;">
            <!-- Participants list will be rendered here -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link text-decoration-none" ref="btnCancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      activeFile: null,
      activeRoom: null,
      participants: []
    }),
    client: ({ state, refs, eventBus, globalStore, bootstrap, pocketbase, signal }) => {
      const { $bus } = eventBus
      const { $state } = globalStore
      const { pb } = pocketbase
      const { Modal } = bootstrap
      const modalEl = refs('rerouteModal')
      const modal = new Modal(modalEl)

      const render = () => {
        const container = refs('listContainer')
        container.innerHTML = ''

        if (state.participants.length === 0) {
          const empty = document.createElement('div')
          empty.className = 'p-4 text-center text-muted'
          empty.textContent = 'No other participants in this group.'
          container.appendChild(empty)
          return
        }

        state.participants.forEach(p => {
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 border-0'
          btn.setAttribute('data-testid', `reroute-user-${p.username}`)

          // Render avatar
          const avatar = document.createElement('ui-avatar')
          avatar.setAttribute('name', p.name || p.username)
          if (p.avatar) {
            avatar.setAttribute('url', pb.files.getURL(p, p.avatar, { thumb: '32x32' }))
          }

          const label = document.createElement('span')
          label.className = 'fw-bold'
          label.textContent = p.name || p.username

          btn.appendChild(avatar)
          btn.appendChild(label)

          btn.onclick = () => {
            modal.hide()
            $bus.emit('action:execute_p2p_transfer', {
              file: state.activeFile,
              selectedUserId: p.id,
              roomId: state.activeRoom.id
            })
          }

          container.appendChild(btn)
        })
      }

      $bus.on('ui:prompt_p2p_reroute', (payload) => {
        state.activeFile = payload.file
        state.activeRoom = payload.room
  
        // Filter out current user from participants
        const currentUserId = $state.currentUser?.id
        state.participants = (payload.room?.participants || []).filter(p => p.id !== currentUserId)

        render()
        modal.show()
      })

      const close = () => modal.hide()
      refs('btnClose').onclick = close
      refs('btnCancel').onclick = close

      signal.addEventListener('abort', () => {
        modal.dispose()
      })
    }
  })
</script>
