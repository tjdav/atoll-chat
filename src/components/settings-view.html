<template id="settings-view">
  <div class="settings-view p-4">
    <profile-settings></profile-settings>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Notifications</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <browser-notifications></browser-notifications>

          <hr class="my-4">

          <sound-notifications></sound-notifications>

        </div>
      </div>
    </section>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Security</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <passkey-settings></passkey-settings>
        </div>
      </div>
    </section>

    <section>
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Account Information</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label small text-muted text-uppercase fw-bold">Username</label>
            <div class="form-control bg-light">{{ username }}</div>
          </div>
          <div>
            <label class="form-label small text-muted text-uppercase fw-bold">Email Address</label>
            <div class="form-control bg-light">{{ userEmail }}</div>
          </div>
        </div>
      </div>
    </section>
  </div>

</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      username: 'User',
      userEmail: ''
    }),
    client: async ({ state, globalStore }) => {
      const { $state } = globalStore

      const loadUserData = () => {
        const user = $state.currentUser
        state.username = user?.username || 'User'
        state.userEmail = user?.email || ''
      }

      loadUserData()

      $state.subscribe('currentUser', loadUserData)
    }
  })
</script>
