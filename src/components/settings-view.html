<template id="settings-view">
  <div class="settings-view p-4">
    <h4 class="mb-4">Settings</h4>

    <profile-settings></profile-settings>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Notifications</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <browser-notifications></browser-notifications>

          <hr class="my-4">

          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="mb-0">Message Sounds</h6>
              <p class="text-muted small mb-0">Play a sound when a new message arrives.</p>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="messageSoundSwitch" ref="messageSoundSwitch" {{ messageSoundsChecked }}>
            </div>
          </div>
          
          <div class="mb-4 {{ messageSoundControlsClass }}">
            <div class="d-flex gap-2 align-items-center mb-2">
              <button class="btn btn-sm btn-outline-secondary" ref="btnPreviewMessage">
                <i class="bi bi-play-fill"></i> Preview
              </button>
              <label class="btn btn-sm btn-outline-primary position-relative mb-0">
                <i class="bi bi-upload"></i> Custom Sound
                <input type="file" ref="fileMessageSound" class="position-absolute start-0 top-0 w-100 h-100 opacity-0" accept="audio/mpeg,audio/wav,audio/ogg">
              </label>
              <button class="btn btn-sm btn-link text-danger p-0 ms-2 {{ resetMessageSoundClass }}" ref="btnResetMessageSound">Reset to default</button>
            </div>
            <div class="small text-muted" ref="messageSoundName">{{ messageSoundName }}</div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="mb-0">Call Sounds</h6>
              <p class="text-muted small mb-0">Play a ringtone for incoming calls.</p>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="callSoundSwitch" ref="callSoundSwitch" {{ callSoundsChecked }}>
            </div>
          </div>

          <div class="{{ callSoundControlsClass }}">
            <div class="d-flex gap-2 align-items-center mb-2">
              <button class="btn btn-sm btn-outline-secondary" ref="btnPreviewCall">
                <i class="bi bi-play-fill"></i> Preview
              </button>
              <label class="btn btn-sm btn-outline-primary position-relative mb-0">
                <i class="bi bi-upload"></i> Custom Sound
                <input type="file" ref="fileCallSound" class="position-absolute start-0 top-0 w-100 h-100 opacity-0" accept="audio/mpeg,audio/wav,audio/ogg">
              </label>
              <button class="btn btn-sm btn-link text-danger p-0 ms-2 {{ resetCallSoundClass }}" ref="btnResetCallSound">Reset to default</button>
            </div>
            <div class="small text-muted" ref="callSoundName">{{ callSoundName }}</div>
          </div>

        </div>
      </div>
    </section>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Security</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <h6 class="mb-0">Vault Passkey</h6>
              <p class="text-muted small mb-0">{{ passkeyStatus }}</p>
            </div>
            <button class="btn btn-outline-primary btn-sm" ref="btnManagePasskey">
              {{ passkeyActionLabel }}
            </button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Account Information</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label small text-muted text-uppercase fw-bold">Username</label>
            <div class="form-control bg-light">{{ username }}</div>
          </div>
          <div>
            <label class="form-label small text-muted text-uppercase fw-bold">Email Address</label>
            <div class="form-control bg-light">{{ userEmail }}</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Password Verification Modal -->

  <div class="modal fade" ref="verifyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Verify Vault Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-4">To {{ passkeyActionVerb }} your vault passkey, please enter your current vault password to confirm your identity and access your cryptographic keys.</p>
          <form ref="verifyForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Vault Password</label>
              <input type="password" class="form-control" ref="vaultPasswordInput" required placeholder="Enter Vault Password">
            </div>
            <div ref="verifyError" class="alert alert-danger d-none small p-2 mb-0"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link text-decoration-none" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" ref="btnVerifyPassword">
            <span class="spinner-border spinner-border-sm d-none" ref="verifySpinner" role="status" aria-hidden="true"></span>
            Verify & Continue
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      username: 'User',
      userEmail: '',
      messageSoundsEnabled: true,
      callSoundsEnabled: true,
      messageSoundName: 'Default',
      callSoundName: 'Default',
      hasCustomMessageSound: false,
      hasCustomCallSound: false,
      hasPasskey: false,
      passkeyActionLabel: 'Add Passkey',
      passkeyActionVerb: 'add'
    }),
    getters: {
      messageSoundsChecked: (state) => (state.messageSoundsEnabled ? 'checked' : ''),
      callSoundsChecked: (state) => (state.callSoundsEnabled ? 'checked' : ''),
      messageSoundControlsClass: (state) => (state.messageSoundsEnabled ? 'd-block' : 'd-none'),
      callSoundControlsClass: (state) => (state.callSoundsEnabled ? 'd-block' : 'd-none'),
      resetMessageSoundClass: (state) => (state.hasCustomMessageSound ? 'd-inline-block' : 'd-none'),
      resetCallSoundClass: (state) => (state.hasCustomCallSound ? 'd-inline-block' : 'd-none'),
      passkeyStatus: (state) => (state.hasPasskey ? 'Configured' : 'Not configured')
    },
    client: async ({ refs, state, globalStore, notifications, bootstrap, pocketbase, cryptoWorker, eventBus, localDb }) => {
      const { $state } = globalStore
      const { $notifications } = notifications
      const { Modal } = await bootstrap
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $localDb } = localDb

      const loadUserData = () => {
        const user = $state.currentUser
        state.username = user?.username || 'User'
        state.userEmail = user?.email || ''
      }

      loadUserData()

      $state.subscribe('currentUser', loadUserData)

      state.messageSoundsEnabled = $state.messageSoundsEnabled ?? true
      state.callSoundsEnabled = $state.callSoundsEnabled ?? true

      const refreshSoundInfo = async () => {
        const customMessage = await $localDb.local_config.get('custom_message_sound')
        state.hasCustomMessageSound = !!customMessage
        state.messageSoundName = customMessage ? (customMessage.fileName || 'Custom Sound') : 'Default (notification.mp3)'

        const customCall = await $localDb.local_config.get('custom_call_sound')
        state.hasCustomCallSound = !!customCall
        state.callSoundName = customCall ? (customCall.fileName || 'Custom Sound') : 'Default (ringtone.mp3)'
      }

      await refreshSoundInfo()
      state.hasPasskey = !!pb.authStore.model?.passkey_credential_id
      state.passkeyActionLabel = state.hasPasskey ? 'Update Passkey' : 'Add Passkey'
      state.passkeyActionVerb = state.hasPasskey ? 'update' : 'add'

      const messageSoundSwitch = refs('messageSoundSwitch')
      if (messageSoundSwitch) {
        messageSoundSwitch.addEventListener('change', () => {
          $state.messageSoundsEnabled = messageSoundSwitch.checked
          state.messageSoundsEnabled = messageSoundSwitch.checked
        })
      }

      const callSoundSwitch = refs('callSoundSwitch')
      if (callSoundSwitch) {
        callSoundSwitch.addEventListener('change', () => {
          $state.callSoundsEnabled = callSoundSwitch.checked
          state.callSoundsEnabled = callSoundSwitch.checked
        })
      }

      const playPreview = async (type) => {
        let audioSource = type === 'message' ? '/sounds/notification.mp3' : '/sounds/ringtone.mp3'
        const key = type === 'message' ? 'custom_message_sound' : 'custom_call_sound'
        const customSound = await $localDb.local_config.get(key)
  
        if (customSound && customSound.value instanceof Blob) {
          audioSource = URL.createObjectURL(customSound.value)
        }

        const audio = new Audio(audioSource)
        audio.volume = $state.mediaVolume || 1.0
        await audio.play()
  
        if (audioSource.startsWith('blob:')) {
          audio.onended = () => URL.revokeObjectURL(audioSource)
        }
      }

      refs('btnPreviewMessage').addEventListener('click', () => playPreview('message'))
      refs('btnPreviewCall').addEventListener('click', () => playPreview('call'))

      const handleFileUpload = async (e, type) => {
        const file = e.target.files[0]
        if (!file) {
          return
        }

        const key = type === 'message' ? 'custom_message_sound' : 'custom_call_sound'
        await $localDb.local_config.put({
          key,
          value: file,
          fileName: file.name
        })
        await refreshSoundInfo()
        e.target.value = ''
      }

      refs('fileMessageSound').addEventListener('change', (e) => handleFileUpload(e, 'message'))
      refs('fileCallSound').addEventListener('change', (e) => handleFileUpload(e, 'call'))

      refs('btnResetMessageSound').addEventListener('click', async () => {
        await $localDb.local_config.delete('custom_message_sound')
        await refreshSoundInfo()
      })

      refs('btnResetCallSound').addEventListener('click', async () => {
        await $localDb.local_config.delete('custom_call_sound')
        await refreshSoundInfo()
      })

      // Passkey management
      const btnManagePasskey = refs('btnManagePasskey')
      const verifyModalEl = refs('verifyModal')
      const verifyModal = new Modal(verifyModalEl)
      const verifyForm = refs('verifyForm')
      const vaultPasswordInput = refs('vaultPasswordInput')
      const verifyError = refs('verifyError')
      const btnVerifyPassword = refs('btnVerifyPassword')
      const verifySpinner = refs('verifySpinner')

      btnManagePasskey.addEventListener('click', () => {
        verifyError.classList.add('d-none')
        vaultPasswordInput.value = ''
        verifyModal.show()
      })

      btnVerifyPassword.addEventListener('click', () => verifyForm.requestSubmit())

      verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = vaultPasswordInput.value
  
        verifyError.classList.add('d-none')
        btnVerifyPassword.disabled = true
        verifySpinner.classList.remove('d-none')

        try {
          const wasConfigured = state.hasPasskey
          const [{ default: sodium }, { createPasskey, encryptVault, decryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const salt = sodium.from_base64(record.vault_salt, sodium.base64_variants.ORIGINAL)
  
          const KEK_Password = await $worker.execute('worker:derive_key_from_password', {
            password,
            salt
          })

          try {
            decryptVault(
              record.encrypted_master_keys.ciphertext,
              record.encrypted_master_keys.nonce,
              KEK_Password,
              sodium
            )
          } catch (err) {
            throw new Error('Invalid Vault Password')
          }

          const challenge = crypto.getRandomValues(new Uint8Array(32))
          const passkeyPrfSalt = crypto.getRandomValues(new Uint8Array(32))
  
          const { credentialId, prfAvailable, prfResult: KEK_Passkey } = await createPasskey(record.username, challenge, passkeyPrfSalt)

          if (!prfAvailable) {
            throw new Error('This authenticator does not support the PRF extension required for vault encryption.')
          }

          if (!KEK_Passkey) {
            throw new Error('Failed to retrieve PRF key from passkey.')
          }

          const masterKeys = {
            private_box_key: $state.currentUser.private_box_key,
            private_sign_key: $state.currentUser.private_sign_key
          }

          const encryptedVaultPasskey = encryptVault(masterKeys, KEK_Passkey, sodium)

          await pb.collection('users').update(record.id, {
            passkey_credential_id: sodium.to_base64(credentialId, sodium.base64_variants.ORIGINAL),
            passkey_prf_salt: sodium.to_base64(passkeyPrfSalt, sodium.base64_variants.ORIGINAL),
            encrypted_master_keys_passkey: encryptedVaultPasskey
          })

          await pb.collection('users').authRefresh()
  
          state.hasPasskey = true
          state.passkeyActionLabel = 'Update Passkey'
          state.passkeyActionVerb = 'update'
  
          verifyModal.hide()
          $bus.emit('ui:show_toast', {
            message: `Passkey successfully ${wasConfigured ? 'updated' : 'added'}!`,
            type: 'success'
          })
        } catch (error) {
          console.error('Passkey management error:', error)
          verifyError.textContent = error.message || 'Verification failed'
          verifyError.classList.remove('d-none')
        } finally {
          btnVerifyPassword.disabled = false
          verifySpinner.classList.add('d-none')
        }
      })
    }
  })
</script>
