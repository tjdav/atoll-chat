<template id="settings-view">
  <div class="settings-view p-4">
    <h4 class="mb-4">Settings</h4>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Notifications</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="mb-0">Browser Notifications</h6>
              <p class="text-muted small mb-0">Get alerted when new messages arrive.</p>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="notifSwitch" ref="notifSwitch" {{ notifChecked }}>
            </div>
          </div>
          <div class="alert alert-warning align-items-center {{ permissionAlertClass }}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div class="small">
              Notifications are blocked by your browser. Please enable them in your browser settings to use this feature.
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Security</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <h6 class="mb-0">Vault Passkey</h6>
              <p class="text-muted small mb-0">{{ passkeyStatus }}</p>
            </div>
            <button class="btn btn-outline-primary btn-sm" ref="btnManagePasskey">
              {{ passkeyActionLabel }}
            </button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h6 class="text-uppercase text-muted fw-bold small mb-3">Account</h6>
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center gap-3">
            <div class="avatar-placeholder bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 48px; height: 48px;">
              {{ userInitial }}
            </div>
            <div>
              <h6 class="mb-0">{{ username }}</h6>
              <p class="text-muted small mb-0">{{ userEmail }}</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Password Verification Modal -->
  <div class="modal fade" ref="verifyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Verify Vault Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-4">To {{ passkeyActionVerb }} your vault passkey, please enter your current vault password to confirm your identity and access your cryptographic keys.</p>
          <form ref="verifyForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Vault Password</label>
              <input type="password" class="form-control" ref="vaultPasswordInput" required placeholder="Enter Vault Password">
            </div>
            <div ref="verifyError" class="alert alert-danger d-none small p-2 mb-0"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link text-decoration-none" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" ref="btnVerifyPassword">
            <span class="spinner-border spinner-border-sm d-none" ref="verifySpinner" role="status" aria-hidden="true"></span>
            Verify & Continue
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      username: 'User',
      userEmail: '',
      userInitial: 'U',
      notificationsEnabled: true,
      permissionStatus: 'default',
      hasPasskey: false,
      passkeyActionLabel: 'Add Passkey',
      passkeyActionVerb: 'add'
    }),
    getters: {
      notifChecked: (state) => (state.notificationsEnabled && state.permissionStatus === 'granted' ? 'checked' : ''),
      permissionAlertClass: (state) => (state.permissionStatus === 'denied' ? 'd-flex' : 'd-none'),
      passkeyStatus: (state) => (state.hasPasskey ? 'Configured' : 'Not configured')
    },
    client: async ({ refs, state, globalStore, notifications, bootstrap, pocketbase, cryptoWorker, eventBus }) => {
      const { $state } = globalStore
      const { $notifications } = notifications
      const { Modal } = await bootstrap
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const { $bus } = eventBus

      state.username = $state.currentUser?.username || 'User'
      state.userEmail = $state.currentUser?.email || ''
      state.userInitial = state.username.charAt(0).toUpperCase()
      state.notificationsEnabled = $state.notificationsEnabled ?? true
      state.permissionStatus = Notification.permission
      state.hasPasskey = !!pb.authStore.model?.passkey_credential_id
      state.passkeyActionLabel = state.hasPasskey ? 'Update Passkey' : 'Add Passkey'
      state.passkeyActionVerb = state.hasPasskey ? 'update' : 'add'

      const notifSwitch = refs('notifSwitch')
      if (notifSwitch) {
        notifSwitch.checked = state.notificationsEnabled && state.permissionStatus === 'granted'
  
        notifSwitch.addEventListener('change', async () => {
          if (notifSwitch.checked) {
            const granted = await $notifications.requestPermission()
            if (granted) {
              $state.notificationsEnabled = true
              state.notificationsEnabled = true
            } else {
              notifSwitch.checked = false
              $state.notificationsEnabled = false
              state.notificationsEnabled = false
            }
          } else {
            $state.notificationsEnabled = false
            state.notificationsEnabled = false
          }
          state.permissionStatus = Notification.permission
        })
      }

      // Passkey management
      const btnManagePasskey = refs('btnManagePasskey')
      const verifyModalEl = refs('verifyModal')
      const verifyModal = new Modal(verifyModalEl)
      const verifyForm = refs('verifyForm')
      const vaultPasswordInput = refs('vaultPasswordInput')
      const verifyError = refs('verifyError')
      const btnVerifyPassword = refs('btnVerifyPassword')
      const verifySpinner = refs('verifySpinner')

      btnManagePasskey.addEventListener('click', () => {
        verifyError.classList.add('d-none')
        vaultPasswordInput.value = ''
        verifyModal.show()
      })

      btnVerifyPassword.addEventListener('click', () => verifyForm.requestSubmit())

      verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = vaultPasswordInput.value
  
        verifyError.classList.add('d-none')
        btnVerifyPassword.disabled = true
        verifySpinner.classList.remove('d-none')

        try {
          const wasConfigured = state.hasPasskey
          // 1. Verify password by deriving KEK and checking against existing vault
          const [{ default: sodium }, { createPasskey, encryptVault, decryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const salt = sodium.from_base64(record.vault_salt, sodium.base64_variants.ORIGINAL)
  
          const KEK_Password = await $worker.execute('deriveKeyFromPassword', {
            password,
            salt
          })

          // Attempt decryption to verify password
          try {
            decryptVault(
              record.encrypted_master_keys.ciphertext,
              record.encrypted_master_keys.nonce,
              KEK_Password,
              sodium
            )
          } catch (err) {
            throw new Error('Invalid Vault Password')
          }

          // 2. Setup Passkey
          const challenge = crypto.getRandomValues(new Uint8Array(32))
          const passkeyPrfSalt = crypto.getRandomValues(new Uint8Array(32))
  
          const { credentialId, prfAvailable, prfResult: KEK_Passkey } = await createPasskey(record.username, challenge, passkeyPrfSalt)

          if (!prfAvailable) {
            throw new Error('This authenticator does not support the PRF extension required for vault encryption.')
          }

          if (!KEK_Passkey) {
            throw new Error('Failed to retrieve PRF key from passkey.')
          }

          // 3. Encrypt master keys with new passkey KEK
          // Note: master keys are already available in $state.currentUser (as base64)
          const masterKeys = {
            private_box_key: $state.currentUser.private_box_key,
            private_sign_key: $state.currentUser.private_sign_key
          }

          const encryptedVaultPasskey = encryptVault(masterKeys, KEK_Passkey, sodium)

          // 4. Update user record
          await pb.collection('users').update(record.id, {
            passkey_credential_id: sodium.to_base64(credentialId, sodium.base64_variants.ORIGINAL),
            passkey_prf_salt: sodium.to_base64(passkeyPrfSalt, sodium.base64_variants.ORIGINAL),
            encrypted_master_keys_passkey: encryptedVaultPasskey
          })

          await pb.collection('users').authRefresh()
  
          state.hasPasskey = true
          state.passkeyActionLabel = 'Update Passkey'
          state.passkeyActionVerb = 'update'
  
          verifyModal.hide()
          $bus.emit('SHOW_TOAST', {
            message: `Passkey successfully ${wasConfigured ? 'updated' : 'added'}!`,
            type: 'success'
          })
        } catch (error) {
          console.error('Passkey management error:', error)
          verifyError.textContent = error.message || 'Verification failed'
          verifyError.classList.remove('d-none')
        } finally {
          btnVerifyPassword.disabled = false
          verifySpinner.classList.add('d-none')
        }
      })
    }
  })
</script>
