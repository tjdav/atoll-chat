<template id="music-list">
  <div class="music-list h-100 overflow-y-auto">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Music will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const listGroup = refs('listGroup')

      let currentRenderId = 0
      const render = async () => {
        if (!listGroup) {
          return
        }

        const renderId = ++currentRenderId
        try {
          const assets = await $localDb.local_assets.where('mime_type').startsWith('audio/').reverse().sortBy('created_at')
          if (renderId !== currentRenderId) {
            return
          }

          if (assets.length === 0) {
            listGroup.innerHTML = '<div class="p-4 text-center text-muted">No music found</div>'
            return
          }

          const fragment = document.createDocumentFragment()
          for (const asset of assets) {
            const room = await $localDb.local_rooms.get(asset.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const timestamp = new Date(asset.created_at).toLocaleString()
            const isActive = asset.id === $state.activeSelectionId && $state.activeSelectionType === 'music'

            const listItem = document.createElement('music-list-item')
            listItem.setAttribute('asset-id', asset.id)
            listItem.setAttribute('room-name', roomName)
            listItem.setAttribute('timestamp', timestamp)
            listItem.setAttribute('is-active', isActive)
            fragment.appendChild(listItem)
          }

          if (renderId === currentRenderId) {
            listGroup.innerHTML = ''
            listGroup.appendChild(fragment)
          }
        } catch (error) {
          console.error('[music-list] Error fetching music:', error)
        }
      }

      // Initial render
      render()

      const debouncedRender = $utils.debounce(render, 10)

      // Handle selection change
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'music') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => {
        debouncedRender()
      })

      const handleNewData = () => {
        debouncedRender()
      }

      $bus.on('NEW_LOCAL_DATA', handleNewData)
    }
  })
</script>
