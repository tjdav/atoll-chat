<template id="music-list">
  <div class="music-list h-100 overflow-y-auto" ref="scrollRoot">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Music will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'music',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          let query = $localDb.local_assets.where('mime_type').startsWith('audio/').reverse()
          const allMatching = await query.toArray()
          let startIndex = 0
          if (lastItem) {
            startIndex = allMatching.findIndex(a => a.id === lastItem.asset.id) + 1
          }
          const rawItems = allMatching.slice(startIndex, startIndex + BATCH_SIZE)
          const items = await Promise.all(rawItems.map(async (asset) => {
            const room = await $localDb.local_rooms.get(asset.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const metadata = asset.music_metadata || {}
            const searchContent = `${asset.filename || ''} ${metadata.title || ''} ${metadata.artist || ''} ${metadata.album || ''} ${roomName}`.toLowerCase()
            return {
              asset,
              roomName,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listGroup.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No music found'}</div>`
            return
          }
          const fragment = document.createDocumentFragment()
          for (const { asset, roomName, timestamp } of itemsToDisplay) {
            const isActive = asset.id === $state.activeSelectionId && $state.activeSelectionType === 'music'
            const listItem = document.createElement('music-list-item')
            listItem.setAttribute('asset-id', asset.id)
            listItem.setAttribute('room-name', roomName)
            listItem.setAttribute('timestamp', timestamp)
            listItem.setAttribute('is-active', isActive.toString())
            fragment.appendChild(listItem)
          }
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
        }
      })

      $bus.on('MUSIC:SELECT', ({ assetId }) => {
        $state.activeSelectionId = assetId
        $state.activeSelectionType = 'music'
        debouncedRender()
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'music') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', () => {
        manager.reset(); debouncedRender()
      })

      debouncedRender()
    }
  })
</script>
