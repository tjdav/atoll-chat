<template id="music-list">
  <div class="music-list h-100 overflow-y-auto" ref="scrollRoot">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Music will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const scrollRoot = refs('scrollRoot')

      let loadedEnrichedItems = []
      let lastTimestamp = null
      let hasMore = true
      let isLoading = false
      let fuseInstance = null
      let lastIndexedCount = 0
      const BATCH_SIZE = 24
      let currentRenderId = 0

      const fetchNextBatch = async () => {
        if (!hasMore || isLoading) {
          return
        }
        isLoading = true
        let query = $localDb.local_assets.where('mime_type').startsWith('audio/').reverse()
        const allMatching = await query.toArray()
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMatching.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawItems = allMatching.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          const enriched = await Promise.all(rawItems.map(async (asset) => {
            const room = await $localDb.local_rooms.get(asset.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const metadata = asset.music_metadata || {}
            const searchContent = `${asset.filename || ''} ${metadata.title || ''} ${metadata.artist || ''} ${metadata.album || ''} ${roomName}`.toLowerCase()
            return {
              asset,
              roomName,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          loadedEnrichedItems = [...loadedEnrichedItems, ...enriched]
        }
        isLoading = false
      }

      const render = async () => {
        if (!listGroup) {
          return
        }
        const renderId = ++currentRenderId
        if (loadedEnrichedItems.length === 0) {
          await fetchNextBatch()
        }
        if (renderId !== currentRenderId) {
          return
        }
        let itemsToDisplay = loadedEnrichedItems
        const query = ($state.listSearchQuery || '').trim().toLowerCase()
        if (query && $Fuse) {
          if (!fuseInstance || lastIndexedCount !== loadedEnrichedItems.length) {
            fuseInstance = new $Fuse(loadedEnrichedItems, {
              keys: ['searchContent'],
              threshold: 0.4
            })
            lastIndexedCount = loadedEnrichedItems.length
          }
          itemsToDisplay = fuseInstance.search(query).map(r => r.item)
        }
        if (itemsToDisplay.length === 0) {
          listGroup.innerHTML = `<div class="p-4 text-center text-muted">${query ? 'No matches found in loaded music' : 'No music found'}</div>`
          return
        }
        const fragment = document.createDocumentFragment()
        for (const { asset, roomName, timestamp } of itemsToDisplay) {
          const isActive = asset.id === $state.activeSelectionId && $state.activeSelectionType === 'music'
          const listItem = document.createElement('music-list-item')
          listItem.setAttribute('asset-id', asset.id); listItem.setAttribute('room-name', roomName); listItem.setAttribute('timestamp', timestamp); listItem.setAttribute('is-active', isActive)
          fragment.appendChild(listItem)
        }
        if (renderId === currentRenderId) {
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)

          // Restore scroll position after first render
          if (!state.__scrollRestored && $state.listScrollPositions?.music !== undefined) {
            setTimeout(() => {
              if (scrollRoot) {
                scrollRoot.scrollTop = $state.listScrollPositions.music
              }
            }, 50)
            state.__scrollRestored = true
          }
        }
      }

      const saveListScroll = () => {
        if (!scrollRoot || (scrollRoot.offsetWidth === 0 && scrollRoot.offsetHeight === 0)) {
          return
        }
        if (!$state.listScrollPositions) {
          $state.listScrollPositions = {}
        }
        $state.listScrollPositions.music = scrollRoot.scrollTop
      }

      const debouncedSave = $utils.debounce(saveListScroll, 100)

      if (signal) {
        signal.addEventListener('abort', saveListScroll)
      }

      const resetAndRender = async () => {
        loadedEnrichedItems = []; lastTimestamp = null; hasMore = true; fuseInstance = null; lastIndexedCount = 0; await render()
      }

      if (scrollRoot) {
        scrollRoot.onscroll = async () => {
          if (scrollRoot.scrollTop + scrollRoot.clientHeight >= scrollRoot.scrollHeight - 50 && hasMore) {
            await fetchNextBatch(); render()
          }
          debouncedSave()
        }
      }
      render()
      const debouncedRender = $utils.debounce(render, 50)
      const debouncedFullRender = $utils.debounce(resetAndRender, 50)
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'music') {
          render()
        }
      })
      $state.subscribe('activeSelectionType', () => render())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', () => debouncedFullRender())
    }
  })
</script>
