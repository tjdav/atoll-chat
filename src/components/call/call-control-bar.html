<template id="call-control-bar">
  <div class="control-bar position-absolute bottom-0 start-50 translate-middle-x mb-4 d-flex gap-3 p-3 rounded-pill shadow-lg border border-secondary align-items-center">
    
    <!-- Audio Control Button -->
    <atoll-button 
      ref="btnToggleAudio" 
      icon-only="true" 
      size="lg" 
      pill="true" 
      variant="{{ audioBtnVariant }}"
      class="atoll-call-btn {{ audioSpeakingClass }} {{ audioBtnClass }}"
      aria-label="Mute Microphone" 
      aria-pressed="{{ audioPressed }}"
    >
      <atoll-icon name="{{ audioIconName }}" size="24"></atoll-icon>
    </atoll-button>

    <!-- Video Control Button -->
    <atoll-button 
      ref="btnToggleVideo" 
      icon-only="true" 
      size="lg" 
      pill="true" 
      variant="{{ videoBtnVariant }}"
      class="atoll-call-btn {{ videoBtnClass }}"
      aria-label="Mute Video" 
      aria-pressed="{{ videoPressed }}"
    >
      <atoll-icon name="{{ videoIconName }}" size="24"></atoll-icon>
    </atoll-button>

    <!-- Picture-in-Picture Button -->
    <atoll-button 
      ref="btnPip" 
      icon-only="true" 
      variant="secondary" 
      size="lg" 
      pill="true" 
      title="Picture-in-Picture"
      aria-label="Picture-in-Picture"
      class="atoll-call-btn"
    >
      <atoll-icon name="pip" size="24"></atoll-icon>
    </atoll-button>

    <!-- Settings Button -->
    <atoll-button 
      ref="btnSettings" 
      icon-only="true" 
      variant="secondary" 
      size="lg" 
      pill="true" 
      title="Settings"
      aria-label="Settings"
      class="atoll-call-btn"
    >
      <atoll-icon name="settings" size="24"></atoll-icon>
    </atoll-button>

    <!-- End Call Button -->
    <atoll-button 
      ref="btnEndCall" 
      icon-only="true" 
      variant="danger" 
      size="lg" 
      pill="true" 
      title="End Call"
      aria-label="End Call"
      class="atoll-call-btn"
    >
      <atoll-icon name="phone" size="24"></atoll-icon>
    </atoll-button>

  </div>

  <!-- Unified Device Settings Drawer using atoll-popup wrapper -->
  <atoll-popup 
    ref="settingsPopup"
    class="atoll-call-settings-modal" 
    title="Device Settings"
    size="md"
    primary-text="Done"
    secondary-text="Cancel"
    static-backdrop="true"
  >
    <!-- Content will be appended dynamically here on client mount to bypass Coralite's static nesting slot limitations -->
  </atoll-popup>

  <!-- Pre-rendered settings content to ensure 100% correct Coralite static template compilation and hydration -->
  <div ref="settingsContent" class="d-none">
    <div class="device-settings-popup-content text-start">
      <!-- Card Section: Audio -->
      <div class="settings-card-container mb-3">
        <div class="settings-section-header">AUDIO</div>
        
        <div class="settings-section-subheader">Select a Microphone</div>
        <div class="mb-3">
          <atoll-select ref="micSelect" block="true" leading-icon="mic" placeholder="Select a Microphone"></atoll-select>
        </div>

        <div class="settings-section-subheader">Microphone Effects</div>
        <atoll-list class="device-list mb-3">
          <atoll-list-item title="Noise cancellation">
            <div slot="right" class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" role="switch" ref="toggleNoiseCancellation" id="noise-cancellation-switch">
            </div>
          </atoll-list-item>
        </atoll-list>

        <div class="settings-section-subheader">Select a Speaker</div>
        <div class="mb-3">
          <atoll-select ref="speakerSelect" block="true" leading-icon="settings" placeholder="Select a Speaker"></atoll-select>
        </div>
        <div class="speaker-fallback-box d-none mb-3" ref="speakerFallback">
          Playing via system speaker. Use your phone's control panel or bluetooth settings to switch audio devices.
        </div>
      </div>

      <!-- Card Section: Video -->
      <div class="settings-card-container">
        <div class="settings-section-header">VIDEO</div>

        <div class="settings-section-subheader">Select a Camera</div>
        <div class="mb-3">
          <atoll-select ref="camSelect" block="true" leading-icon="videocam" placeholder="Select a Camera"></atoll-select>
        </div>

        <div class="settings-section-subheader">Video Effects</div>
        <atoll-list class="device-list mb-3">
          <atoll-list-item title="Background blur">
            <div slot="right" class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" role="switch" ref="toggleBackgroundBlur" id="background-blur-switch">
            </div>
          </atoll-list-item>
        </atoll-list>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      callStatus: 'idle',
      isAudioEnabled: true,
      isVideoEnabled: true,
      isLocalSpeaking: false,
      microphones: [],
      cameras: [],
      speakers: [],
      activeMicId: 'default',
      activeCamId: 'default',
      activeSpeakerId: 'default',
      isNoiseCancellationEnabled: true,
      isBackgroundBlurEnabled: false,
      isSpeakerSelectionSupported: true
    }),
    getters: {
      audioBtnVariant: (state) => (state.isAudioEnabled ? 'secondary' : 'danger'),
      videoBtnVariant: (state) => (state.isVideoEnabled ? 'secondary' : 'danger'),
      videoBtnClass: (state) => (state.isVideoEnabled ? 'btn-light' : 'btn-danger'),
      audioBtnClass: (state) => (state.isAudioEnabled ? 'btn-light' : 'btn-danger'),
      audioIconName: (state) => (state.isAudioEnabled ? 'mic' : 'mic-off'),
      videoIconName: (state) => (state.isVideoEnabled ? 'videocam' : 'camera-off'),
      audioPressed: (state) => (!state.isAudioEnabled ? 'true' : 'false'),
      videoPressed: (state) => (!state.isVideoEnabled ? 'true' : 'false'),
      audioSpeakingClass: (state) => {
        return (state.isAudioEnabled && state.isLocalSpeaking) ? 'speaking-btn-glow atoll-call-speaking' : ''
      }
    },
    client: async ({ state, globalStore, eventBus, refs, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus

      // Reference all template refs explicitly for validation tracking
      refs('btnToggleAudio')
      refs('btnToggleVideo')
      refs('btnPip')
      refs('btnSettings')
      refs('btnEndCall')
      refs('settingsPopup')
      refs('settingsContent')
      refs('micSelect')
      refs('toggleNoiseCancellation')
      refs('speakerSelect')
      refs('speakerFallback')
      refs('camSelect')
      refs('toggleBackgroundBlur')

      const settingsPopup = refs('settingsPopup')
      const settingsContent = refs('settingsContent')

      /**
       * Relocates pre-rendered settings content into the unified Device Settings drawer.
       * @returns {void}
       */
      const moveContent = () => {
        const popupBody = settingsPopup.querySelector('.atoll-popup-body')
        if (popupBody && settingsContent.parentNode !== popupBody) {
          settingsContent.classList.remove('d-none')
          popupBody.appendChild(settingsContent)
        }
      }

      const { createCallDeviceManager } = await import('../../utils/call/callDeviceManager.js')
      const deviceManager = createCallDeviceManager({
        state,
        refs,
        globalStore,
        eventBus,
        signal
      })

      state.isAudioEnabled = Boolean($state.isAudioEnabled)
      state.isVideoEnabled = Boolean($state.isVideoEnabled)
      state.isLocalSpeaking = Boolean($state.isLocalSpeaking)

      /**
       * Synchronizes interactive control button states with their active template icons.
       * @returns {void}
       */
      const syncIcons = () => {
        const audioBtn = refs('btnToggleAudio')
        const videoBtn = refs('btnToggleVideo')
        const audioIcon = audioBtn.querySelector('atoll-icon')
        audioIcon.setAttribute('name', state.isAudioEnabled ? 'mic' : 'mic-off')
        const videoIcon = videoBtn.querySelector('atoll-icon')
        videoIcon.setAttribute('name', state.isVideoEnabled ? 'videocam' : 'camera-off')
      }

      $state.subscribe('callStatus', (val) => {
        state.callStatus = val
        if (val === 'active') {
          // Pre-emptively move content when active so enumerated devices can render
          moveContent()
          deviceManager.enumerateAndBootDevices()
        }
      })

      $state.subscribe('isAudioEnabled', (val) => {
        state.isAudioEnabled = Boolean(val)
        syncIcons()
      })

      $state.subscribe('isVideoEnabled', (val) => {
        state.isVideoEnabled = Boolean(val)
        syncIcons()
      })

      // Set initial icons correctly on boot
      syncIcons()

      $state.subscribe('isLocalSpeaking', (val) => {
        state.isLocalSpeaking = Boolean(val)
      })

      refs('btnToggleAudio').addEventListener('click', () => {
        $bus.emit('call:toggle_audio_clicked')
      }, { signal })

      refs('btnToggleVideo').addEventListener('click', () => {
        $bus.emit('call:toggle_video_clicked')
      }, { signal })

      refs('btnPip').addEventListener('click', () => {
        $bus.emit('call:pip_clicked')
      }, { signal })

      let isSettingsSaved = false

      refs('btnSettings').addEventListener('click', () => {
        isSettingsSaved = false
        moveContent()
        deviceManager.takeSnapshot()
        deviceManager.renderDeviceMenus()
        settingsPopup.show()
      }, { signal })

      settingsPopup.addEventListener('atoll-popup-primary', () => {
        isSettingsSaved = true
        settingsPopup.hide()
      }, { signal })
      settingsPopup.addEventListener('atoll-popup-secondary', () => {
        isSettingsSaved = false
        settingsPopup.hide()
      }, { signal })
      settingsPopup.addEventListener('atoll-popup-close', () => {
        if (!isSettingsSaved) {
          deviceManager.rollback()
        }
      }, { signal })

      refs('btnEndCall').addEventListener('click', () => {
        $bus.emit('call:end_clicked')
      }, { signal })
    }
  })
</script>
