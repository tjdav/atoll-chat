<template id="call-overlay">
  <div ref="modal" class="modal fade" tabindex="-1" aria-labelledby="{{ ref_modalTitle }}" aria-hidden="true" style="z-index: 9999;">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-dark text-white border-0">
        <div class="modal-body p-0 overflow-hidden position-relative">
          
          <h1 class="visually-hidden">Call Overlay</h1>

          <!-- Incoming Call View -->
          <div class="incoming-view h-100 {{ incomingClass }} flex-column align-items-center justify-content-center">
            <div class="avatar-large bg-primary rounded-circle d-flex align-items-center justify-content-center mb-4 shadow" style="width: 120px; height: 120px; font-size: 3rem;">
              {{ callerInitial }}
            </div>
            <h2 class="mb-2">{{ callerName }}</h2>
            <p class="text-light mb-5">{{ incomingCallTypeText }}</p>
            
            <div class="d-flex gap-4">
              <button ref="btnAccept" class="btn btn-success btn-lg rounded-circle p-3 shadow" title="Accept Call" aria-label="Accept Call">
                <i class="bi bi-telephone-fill fs-3"></i>
              </button>
              <button ref="btnReject" class="btn btn-danger btn-lg rounded-circle p-3 shadow" title="Reject Call" aria-label="Reject Call">
                <i class="bi bi-telephone-x-fill fs-3"></i>
              </button>
            </div>
          </div>

          <!-- Active Call View -->
          <div class="active-view h-100 position-relative {{ activeClass }}">
            <div ref="fullScreenVideoContainer" class="h-100 w-100">
              <!-- video-grid will be moved here by syncVideoGrid -->
            </div>
            
            <!-- Control Bar -->
            <div class="control-bar position-absolute bottom-0 start-50 translate-middle-x mb-4 d-flex gap-3 p-3 rounded-pill bg-dark bg-opacity-75 shadow-lg border border-secondary align-items-center">
              
              <!-- Split Button for Audio control -->
              <div class="btn-group dropup btn-group-pill {{ audioGroupClass }}" ref="audioGroup">
                <button ref="btnToggleAudio" type="button" class="btn btn-action btn-light" aria-label="Mute Microphone" aria-pressed="{{ audioPressed }}">
                  <i class="bi {{ audioIconClass }} fs-4"></i>
                </button>
                <button ref="btnAudioSettings" type="button" class="btn btn-chevron dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-haspopup="menu" aria-expanded="false" aria-label="Microphone Settings">
                  <i class="bi bi-chevron-up"></i>
                </button>
                <div class="dropdown-menu device-dropdown-menu p-3" aria-label="Microphone Settings Menu">
                  <h6 class="dropdown-header">Select a Microphone</h6>
                  <div class="device-list" ref="micList">
                    <!-- Mic items will be generated here -->
                  </div>

                  <h6 class="dropdown-header">Microphone Effects</h6>
                  <div class="effect-toggle-container">
                    <span class="effect-label">Noise cancellation</span>
                    <div class="form-check form-switch m-0">
                      <input class="form-check-input" type="checkbox" role="switch" ref="toggleNoiseCancellation" id="noise-cancellation-switch">
                    </div>
                  </div>

                  <h6 class="dropdown-header">Select a Speaker</h6>
                  <div class="device-list" ref="speakerList">
                    <!-- Speaker items will be generated here -->
                  </div>
                  <div class="speaker-fallback-box d-none" ref="speakerFallback">
                    Speaker selection isn’t available in this browser. Use your system settings to choose a different speaker.
                  </div>
                </div>
              </div>

              <!-- Split Button for Video control -->
              <div class="btn-group dropup btn-group-pill {{ videoGroupClass }}" ref="videoGroup">
                <button ref="btnToggleVideo" type="button" class="btn btn-action {{ videoBtnClass }}" aria-label="Mute Video" aria-pressed="{{ videoPressed }}">
                  <i class="bi {{ videoIconClass }} fs-4"></i>
                </button>
                <button ref="btnVideoSettings" type="button" class="btn btn-chevron dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-haspopup="menu" aria-expanded="false" aria-label="Video Settings">
                  <i class="bi bi-chevron-up"></i>
                </button>
                <div class="dropdown-menu device-dropdown-menu p-3" aria-label="Video Settings Menu">
                  <h6 class="dropdown-header">Select a Camera</h6>
                  <div class="device-list" ref="camList">
                    <!-- Cam items will be generated here -->
                  </div>

                  <h6 class="dropdown-header">Video Effects</h6>
                  <div class="effect-toggle-container">
                    <span class="effect-label">Background blur</span>
                    <div class="form-check form-switch m-0">
                      <input class="form-check-input" type="checkbox" role="switch" ref="toggleBackgroundBlur" id="background-blur-switch">
                    </div>
                  </div>
                </div>
              </div>

              <button ref="btnPip" class="btn btn-light rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;" title="Picture-in-Picture">
                <i class="bi bi-pip fs-4"></i>
              </button>
              <button ref="btnEndCall" class="btn btn-danger rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                <i class="bi bi-telephone-x-fill fs-4"></i>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- PiP Window -->
  <div class="{{ pipClass }}">
    <pip-video ref="pipVideo"></pip-video>
  </div>

  <!-- Persistent Video Grid Source (to prevent re-mounting) -->
  <div class="d-none" ref="videoGridSource">
    <video-grid ref="videoGrid"></video-grid>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      callStatus: 'idle',
      callerName: 'Unknown Caller',
      callerInitial: '?',
      isAudioEnabled: true,
      isVideoEnabled: true,
      localStream: null,
      remoteOffer: null,
      isPipMode: false,
      isLocalSpeaking: false,
      incomingMediaTypes: ['audio', 'video'],
  
      // Device state
      microphones: [],
      cameras: [],
      speakers: [],
      activeMicId: 'default',
      activeCamId: 'default',
      activeSpeakerId: 'default',
      isNoiseCancellationEnabled: true,
      isBackgroundBlurEnabled: false,
      isSpeakerSelectionSupported: true
    }),
    getters: {
      incomingClass: (state) => (state.callStatus === 'incoming' ? 'd-flex' : 'd-none'),
      activeClass: (state) => (state.callStatus === 'active' && !state.isPipMode ? 'd-block' : 'd-none'),
      pipClass: (state) => (state.callStatus === 'active' && state.isPipMode ? 'd-block' : 'd-none'),
      audioGroupClass: (state) => {
        if (!state.isAudioEnabled) {
          return 'muted-state'
        }
        return state.isLocalSpeaking ? 'speaking-state' : 'active-state'
      },
      videoGroupClass: (state) => {
        return state.isVideoEnabled ? 'active-state' : 'muted-state'
      },
      videoBtnClass: (state) => (state.isVideoEnabled ? 'btn-light' : 'btn-danger'),
      audioIconClass: (state) => (state.isAudioEnabled ? 'bi-mic-fill' : 'bi-mic-mute-fill'),
      videoIconClass: (state) => (state.isVideoEnabled ? 'bi-camera-video-fill' : 'bi-camera-video-off-fill'),
      audioPressed: (state) => (!state.isAudioEnabled ? 'true' : 'false'),
      videoPressed: (state) => (!state.isVideoEnabled ? 'true' : 'false'),
      incomingCallTypeText: (state) => {
        const hasVideo = state.incomingMediaTypes && state.incomingMediaTypes.includes('video')
        return hasVideo ? 'Incoming Video Call...' : 'Incoming Audio Call...'
      }
    },
    client: async ({ state, globalStore, eventBus, webrtc: webrtcPluginContext, storage, refs, signal, bootstrap }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $webrtc } = webrtcPluginContext
      const { $storage } = storage
      const { Modal, Dropdown } = bootstrap
      const modalEl = refs('modal')
      const modal = new Modal(modalEl, {
        backdrop: 'static',
        keyboard: false
      })

      const updateModalVisibility = (status, isPip) => {
        if (status !== 'idle' && !isPip) {
          modal.show()
        } else {
          modal.hide()
        }
      }

      const syncVideoGrid = () => {
        const videoGrid = refs('videoGrid')
        const pipVideo = refs('pipVideo')
        if (!videoGrid) {
          return
        }

        if (state.isPipMode && pipVideo) {
          const container = pipVideo.shadowRoot ? pipVideo.shadowRoot.querySelector('[ref$="container"]') : pipVideo.querySelector('[ref$="container"]')
          if (container) {
            container.appendChild(videoGrid)
          }
        } else if (state.callStatus === 'active') {
          const container = refs('fullScreenVideoContainer')
          if (container) {
            container.appendChild(videoGrid)
          }
        } else {
          const source = refs('videoGridSource')
          if (source) {
            source.appendChild(videoGrid)
          }
        }
      }

      // Sync local state with global state
      let ringtoneAudio = null

      state.callStatus = $state.callStatus
      $state.isAudioEnabled = state.isAudioEnabled
      $state.isVideoEnabled = state.isVideoEnabled

      // Initialize default toggles
      state.isNoiseCancellationEnabled = localStorage.getItem('atoll_noise_cancellation') !== 'false'
      state.isBackgroundBlurEnabled = localStorage.getItem('atoll_background_blur') === 'true'
      refs('toggleNoiseCancellation').checked = state.isNoiseCancellationEnabled
      refs('toggleBackgroundBlur').checked = state.isBackgroundBlurEnabled

      const stopRingtone = () => {
        if (ringtoneAudio) {
          ringtoneAudio.pause()
          ringtoneAudio.currentTime = 0
          if (ringtoneAudio.src.startsWith('blob:')) {
            URL.revokeObjectURL(ringtoneAudio.src)
          }
          ringtoneAudio = null
        }
      }

      const playRingtone = async () => {
        if (!$state.callSoundsEnabled || ringtoneAudio) {
          return
        }

        try {
          let audioSource = '/sounds/ringtone.mp3'
          const customSound = await $storage.getConfig('custom_call_sound')
          if (customSound && customSound instanceof Blob) {
            audioSource = URL.createObjectURL(customSound)
          }

          ringtoneAudio = new Audio(audioSource)
          ringtoneAudio.loop = true
          ringtoneAudio.volume = $state.mediaVolume || 1.0
          await ringtoneAudio.play()
        } catch (err) {
          console.error('[call-overlay] Failed to play ringtone:', err)
        }
      }

      updateModalVisibility(state.callStatus, state.isPipMode)

      const stopTracks = () => {
        if (state.localStream) {
          state.localStream.getTracks().forEach(track => track.stop())
          state.localStream = null
        }
      }

      const updateLocalSpeakingBtn = () => {
        const targetBtn = refs('btnToggleAudio')
        if (targetBtn) {
          if (state.isAudioEnabled && state.isLocalSpeaking) {
            targetBtn.className = 'btn btn-action btn-success speaking-btn-glow'
          } else if (!state.isAudioEnabled) {
            targetBtn.className = 'btn btn-action btn-danger'
          } else {
            targetBtn.className = 'btn btn-action btn-light'
          }
        }
      }

      const updateTrackStates = (stream) => {
        if (!stream) {
          return
        }
        const hasAudio = stream.getAudioTracks().some(t => t.enabled)
        const hasVideo = stream.getVideoTracks().some(t => t.enabled)
  
        state.isAudioEnabled = hasAudio
        $state.isAudioEnabled = hasAudio
        state.isVideoEnabled = hasVideo
        $state.isVideoEnabled = hasVideo
        updateLocalSpeakingBtn()
      }

      const endCall = async () => {
        if ($state.activeCallRoomId) {
          await $webrtc.endCall($state.activeCallRoomId)
        }
        stopTracks()
        $state.set('callStatus', 'idle')
        $state.activeCallRoomId = null
        $state.localStream = null
        $state.remoteStream = null
        $state.hasRemoteVideo = false
        state.remoteOffer = null
        state.isAudioEnabled = true
        $state.isAudioEnabled = true
        state.isVideoEnabled = true
        $state.isVideoEnabled = true
        updateLocalSpeakingBtn()
      }

      const toggleAudio = () => {
        if (state.localStream) {
          const tracks = state.localStream.getAudioTracks()
          if (tracks.length > 0) {
            const nextState = !tracks[0].enabled
            tracks.forEach(track => {
              track.enabled = nextState
            })
            state.isAudioEnabled = nextState
            $state.isAudioEnabled = nextState
            updateLocalSpeakingBtn()
          }
        }
      }

      const toggleVideo = () => {
        if (state.localStream) {
          const tracks = state.localStream.getVideoTracks()
          if (tracks.length > 0) {
            const nextState = !tracks[0].enabled
            tracks.forEach(track => {
              track.enabled = nextState
            })
            state.isVideoEnabled = nextState
            $state.isVideoEnabled = nextState
          }
        }
      }

      $state.subscribe('callStatus', (val) => {
        state.callStatus = val
        if (val === 'idle' || (val === 'active' && (state.remoteOffer || $state.remoteStream))) {
          stopRingtone()
        }
        if (val === 'idle') {
          state.isPipMode = false
          // Reset PiP position
          $bus.emit('pip:reset_position')
        }
        if (val === 'incoming') {
          playRingtone()
        }
        updateModalVisibility(val, state.isPipMode)
        syncVideoGrid()
  
        // Populate and validate devices on join
        if (val === 'active') {
          enumerateAndBootDevices()
        }
      })

      // Listen for incoming calls
      $bus.on('call:incoming', async ({ room_id, offer, senderId, media_types }) => {
        if (senderId === $state.currentUser?.id) {
          return
        }

        if ($state.callStatus !== 'idle') {
          console.warn('[call-overlay] Ignoring incoming call, already in a call.')
          return
        }

        // Set room ID and status IMMEDIATELY to prevent race conditions during catch-up sync
        $state.activeCallRoomId = room_id
        $state.set('callStatus', 'incoming')

        state.remoteOffer = offer
        state.incomingMediaTypes = media_types || ['audio', 'video']

        if (!room_id) {
          return
        }

        const room = await $storage.getRoom(room_id)
        if (room) {
          const participants = (room.participants || []).filter(p => p.id !== $state.currentUser?.id)
          if (!room.is_group && participants.length > 0) {
            state.callerName = participants[0].name || participants[0].username
          } else {
            state.callerName = room.name || 'Unknown Caller'
          }
        } else {
          state.callerName = 'Unknown Caller'
        }
        state.callerInitial = state.callerName.charAt(0).toUpperCase()
      }, { signal })

      $state.subscribe('isLocalSpeaking', (val) => {
        state.isLocalSpeaking = Boolean(val)
        updateLocalSpeakingBtn()
      })

      // Speaker Detection Setup
      const { createAudioSpeakerDetector } = await import('../../utils/audioSpeakerDetector.js')
      const speakerDetector = createAudioSpeakerDetector({
        onSpeakingChange: ({ isSpeaking, participantId }) => {
          if (participantId === 'local') {
            state.isLocalSpeaking = isSpeaking
            $state.isLocalSpeaking = isSpeaking
            updateLocalSpeakingBtn()
          } else {
            $state.isRemoteSpeaking = isSpeaking
          }
        }
      })

      let localStreamId = null
      let remoteStreamId = null

      $state.subscribe('localStream', (stream) => {
        if (localStreamId) {
          speakerDetector.detachStream(localStreamId)
          localStreamId = null
        }
        if (stream) {
          localStreamId = speakerDetector.attachStream(stream, 'local')
        }
      })

      $state.subscribe('remoteStream', (stream) => {
        if (remoteStreamId) {
          speakerDetector.detachStream(remoteStreamId)
          remoteStreamId = null
        }
        if (stream) {
          stopRingtone()
          remoteStreamId = speakerDetector.attachStream(stream, 'remote')
        }
      })

      $bus.on('call:remote_track_arrival', ({ stream }) => {
        if (stream) {
          if (remoteStreamId) {
            speakerDetector.detachStream(remoteStreamId)
          }
          remoteStreamId = speakerDetector.attachStream(stream, 'remote')
        }
      }, { signal })

      signal.addEventListener('abort', () => {
        speakerDetector.destroy()
      })

      // Listen for locally initiated calls to grab the stream
      $bus.on('call:initiated_locally', ({ localStream }) => {
        $state.localStream = localStream
        state.localStream = localStream
        updateTrackStates(localStream)
  
        // Re-emit for video-grid
        $bus.emit('call:local_stream_available', { stream: localStream })

        // Play calling sound for initiator
        playRingtone()
      }, { signal })

      // Listen for call ended from remote
      $bus.on('call:ended', ({ room_id }) => {
        if ($state.activeCallRoomId === room_id) {
          stopTracks()
          $state.set('callStatus', 'idle')
          $state.activeCallRoomId = null
          state.remoteOffer = null
        }
      }, { signal })

      // PiP Toggle
      refs('btnPip').addEventListener('click', () => {
        state.isPipMode = true
        updateModalVisibility(state.callStatus, true)
        syncVideoGrid()
      })

      $bus.on('pip:expand', () => {
        state.isPipMode = false
        updateModalVisibility(state.callStatus, false)
        syncVideoGrid()
      }, { signal })

      // Accept Call
      refs('btnAccept').addEventListener('click', async () => {
        console.log('[call-overlay] Accept button clicked')
        let localStream = null
        const hasVideoOffer = state.incomingMediaTypes && state.incomingMediaTypes.includes('video')

        try {
          console.log('[call-overlay] Requesting media permissions (audio and video)...')
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: hasVideoOffer
          })
          console.log('[call-overlay] Media permissions granted')
        } catch (err) {
          console.warn('[call-overlay] Failed to get audio and video, trying audio-only fallback:', err)
          if (hasVideoOffer) {
            try {
              localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
              })
              console.log('[call-overlay] Audio-only fallback media permissions granted')
            } catch (fallbackErr) {
              console.error('[call-overlay] Both audio/video and audio-only media requests failed:', fallbackErr)
              endCall()
              return
            }
          } else {
            console.error('[call-overlay] Failed to accept audio call:', err)
            endCall()
            return
          }
        }

        try {
          state.localStream = localStream
          $state.localStream = localStream
          updateTrackStates(localStream)
  
          // Set status to active before answering to ensure UI is ready for tracks
          console.log('[call-overlay] Setting call status to active')
          $state.set('callStatus', 'active')
          $bus.emit('call:local_stream_available', { stream: localStream })
  
          console.log('[call-overlay] Answering call via WebRTC plugin...')
          await $webrtc.answerCall($state.activeCallRoomId, localStream, state.remoteOffer)
          console.log('[call-overlay] answerCall initiated successfully')
        } catch (err) {
          console.error('[call-overlay] Failed to answer call:', err)
          endCall()
        }
      })

      // Reject Call
      refs('btnReject').addEventListener('click', () => {
        $state.remoteStream = null
        $state.hasRemoteVideo = false
        endCall()
      })

      refs('btnToggleAudio').addEventListener('click', toggleAudio)
      refs('btnToggleVideo').addEventListener('click', toggleVideo)

      // End Call
      refs('btnEndCall').addEventListener('click', () => {
        endCall()
      })

      /* =======================================================================
         DEVICE MANAGEMENT LOGIC
         ======================================================================= */

      // 1. Capability & Enumeration Gating
      state.isSpeakerSelectionSupported = typeof HTMLMediaElement.prototype.setSinkId !== 'undefined'
      if (!state.isSpeakerSelectionSupported) {
        refs('speakerFallback').classList.remove('d-none')
      }

      const requestTemporaryPermissions = async () => {
        if (window.__E2E_AUDIO_MOCK_INJECTED__) {
          console.log('[call-overlay] E2E audio mock detected, skipping temporary permission stream to avoid mock collision.')
          return
        }
        if (state.localStream && state.localStream.getTracks().length > 0) {
          console.log('[call-overlay] active localStream already exists, skipping temporary permission stream.')
          return
        }
        try {
          console.log('[call-overlay] Spawning temporary media stream to prompt native OS permissions...')
          const tempStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true
          })
          tempStream.getTracks().forEach(track => track.stop())
          console.log('[call-overlay] Temporary permission granted and tracks stopped.')
        } catch (err) {
          console.warn('[call-overlay] Temporary permission stream failed, attempting audio-only...', err)
          try {
            const tempAudio = await navigator.mediaDevices.getUserMedia({ audio: true })
            tempAudio.getTracks().forEach(track => track.stop())
          } catch (audioErr) {
            console.error('[call-overlay] Permanent permission failure or user denied access:', audioErr)
          }
        }
      }

      const enumerateAndBootDevices = async () => {
        await requestTemporaryPermissions()
        await fetchHardwareLists()
        await bootValidatePreferences()
        renderDeviceMenus()
        applyLocalVideoEffects()
      }

      const fetchHardwareLists = async () => {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices()
          state.microphones = devices.filter(d => d.kind === 'audioinput')
          state.cameras = devices.filter(d => d.kind === 'videoinput')
          state.speakers = devices.filter(d => d.kind === 'audiooutput')
          console.log('[call-overlay] Enumerate devices successful:', {
            mics: state.microphones.length,
            cams: state.cameras.length,
            speakers: state.speakers.length
          })
        } catch (err) {
          console.error('[call-overlay] Failed to enumerate hardware devices:', err)
        }
      }

      // 2. State Preference Preservation and Boot Validation
      const bootValidatePreferences = async () => {
        const storedMic = localStorage.getItem('atoll_active_microphone')
        const storedCam = localStorage.getItem('atoll_active_camera')
        const storedSpeaker = localStorage.getItem('atoll_active_speaker')

        if (storedMic && state.microphones.some(m => m.deviceId === storedMic)) {
          state.activeMicId = storedMic
        } else {
          state.activeMicId = state.microphones[0]?.deviceId || 'default'
          localStorage.setItem('atoll_active_microphone', state.activeMicId)
        }

        if (storedCam && state.cameras.some(c => c.deviceId === storedCam)) {
          state.activeCamId = storedCam
        } else {
          state.activeCamId = state.cameras[0]?.deviceId || 'default'
          localStorage.setItem('atoll_active_camera', state.activeCamId)
        }

        if (state.isSpeakerSelectionSupported) {
          if (storedSpeaker && state.speakers.some(s => s.deviceId === storedSpeaker)) {
            state.activeSpeakerId = storedSpeaker
          } else {
            state.activeSpeakerId = state.speakers[0]?.deviceId || 'default'
            localStorage.setItem('atoll_active_speaker', state.activeSpeakerId)
          }
        }
      }

      // 3. UI Construction & Dynamic Selection Listeners
      const renderDeviceMenus = () => {
        // Render Microphone list
        const micContainer = refs('micList')
        if (micContainer) {
          micContainer.innerHTML = ''
          if (state.microphones.length === 0) {
            micContainer.innerHTML = `<div class="p-2 text-muted" style="font-size: 0.8125rem;">No microphones found</div>`
          } else {
            state.microphones.forEach(mic => {
              const button = document.createElement('button')
              button.className = `device-item ${state.activeMicId === mic.deviceId ? 'active' : ''}`
              button.setAttribute('data-device-id', mic.deviceId)
              button.innerHTML = `
                <i class="bi bi-check2 check-icon"></i>
                <span class="device-name">${mic.label || 'Microphone (' + mic.deviceId.substring(0, 5) + ')'}</span>
              `
              button.addEventListener('click', () => selectMicrophone(mic.deviceId))
              micContainer.appendChild(button)
            })
          }
        }

        // Render Camera list
        const camContainer = refs('camList')
        if (camContainer) {
          camContainer.innerHTML = ''
          if (state.cameras.length === 0) {
            camContainer.innerHTML = `<div class="p-2 text-muted" style="font-size: 0.8125rem;">No cameras found</div>`
          } else {
            state.cameras.forEach(cam => {
              const button = document.createElement('button')
              button.className = `device-item ${state.activeCamId === cam.deviceId ? 'active' : ''}`
              button.setAttribute('data-device-id', cam.deviceId)
              button.innerHTML = `
                <i class="bi bi-check2 check-icon"></i>
                <span class="device-name">${cam.label || 'Camera (' + cam.deviceId.substring(0, 5) + ')'}</span>
              `
              button.addEventListener('click', () => selectCamera(cam.deviceId))
              camContainer.appendChild(button)
            })
          }
        }

        // Render Speaker list
        const speakerContainer = refs('speakerList')
        if (speakerContainer && state.isSpeakerSelectionSupported) {
          speakerContainer.innerHTML = ''
          if (state.speakers.length === 0) {
            speakerContainer.innerHTML = `<div class="p-2 text-muted" style="font-size: 0.8125rem;">No speakers found</div>`
          } else {
            state.speakers.forEach(speaker => {
              const button = document.createElement('button')
              button.className = `device-item ${state.activeSpeakerId === speaker.deviceId ? 'active' : ''}`
              button.setAttribute('data-device-id', speaker.deviceId)
              button.innerHTML = `
                <i class="bi bi-check2 check-icon"></i>
                <span class="device-name">${speaker.label || 'Speaker (' + speaker.deviceId.substring(0, 5) + ')'}</span>
              `
              button.addEventListener('click', () => selectSpeaker(speaker.deviceId))
              speakerContainer.appendChild(button)
            })
          }
        }
      }

      // Hot-swap microphone helper
      const selectMicrophone = async (deviceId) => {
        state.activeMicId = deviceId
        localStorage.setItem('atoll_active_microphone', deviceId)
        renderDeviceMenus()

        if (state.callStatus !== 'active' || !state.localStream) {
          return
        }

        const audioConstraints = {
          deviceId: { exact: deviceId },
          noiseSuppression: state.isNoiseCancellationEnabled,
          echoCancellation: state.isNoiseCancellationEnabled,
          autoGainControl: state.isNoiseCancellationEnabled
        }

        try {
          const newStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints })
          const newTrack = newStream.getAudioTracks()[0]

          // Mute State Preservation
          if (!state.isAudioEnabled) {
            newTrack.enabled = false
          }

          const pc = window.__E2E_PEER_CONNECTION__
          if (pc) {
            const senders = pc.getSenders()
            const audioSender = senders.find(s => s.track && s.track.kind === 'audio')
            if (audioSender) {
              await audioSender.replaceTrack(newTrack)
              console.log('[call-overlay] Active WebRTC audio track swapped successfully.')
            }
          }

          // Swap local stream track
          const oldAudioTrack = state.localStream.getAudioTracks()[0]
          if (oldAudioTrack) {
            oldAudioTrack.stop()
            state.localStream.removeTrack(oldAudioTrack)
          }
          state.localStream.addTrack(newTrack)
          $bus.emit('call:local_stream_available', { stream: state.localStream })
        } catch (err) {
          console.error('[call-overlay] Failed to swap active audio track:', err)
        }
      }

      // Hot-swap camera helper
      const selectCamera = async (deviceId) => {
        state.activeCamId = deviceId
        localStorage.setItem('atoll_active_camera', deviceId)
        renderDeviceMenus()

        if (state.callStatus !== 'active' || !state.localStream) {
          return
        }

        try {
          const newStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } })
          const newTrack = newStream.getVideoTracks()[0]

          // Mute State Preservation
          if (!state.isVideoEnabled) {
            newTrack.enabled = false
          }

          const pc = window.__E2E_PEER_CONNECTION__
          if (pc) {
            const senders = pc.getSenders()
            const videoSender = senders.find(s => s.track && s.track.kind === 'video')
            if (videoSender) {
              await videoSender.replaceTrack(newTrack)
              console.log('[call-overlay] Active WebRTC video track swapped successfully.')
            }
          }

          // Swap local stream track
          const oldVideoTrack = state.localStream.getVideoTracks()[0]
          if (oldVideoTrack) {
            oldVideoTrack.stop()
            state.localStream.removeTrack(oldVideoTrack)
          }
          state.localStream.addTrack(newTrack)
          $bus.emit('call:local_stream_available', { stream: state.localStream })
          applyLocalVideoEffects()
        } catch (err) {
          console.error('[call-overlay] Failed to swap active video track:', err)
        }
      }

      // Hot-swap speaker helper
      const selectSpeaker = async (deviceId) => {
        if (!state.isSpeakerSelectionSupported) {
          return
        }
        state.activeSpeakerId = deviceId
        localStorage.setItem('atoll_active_speaker', deviceId)
        renderDeviceMenus()

        const remoteVideos = document.querySelectorAll('video-grid video')
        remoteVideos.forEach(async (video) => {
          try {
            await video.setSinkId(deviceId)
            console.log(`[call-overlay] Speaker sink ID set successfully to: ${deviceId}`)
          } catch (err) {
            console.error('[call-overlay] Failed to set speaker sink ID:', err)
          }
        })
      }

      // Effect Toggles
      refs('toggleNoiseCancellation').addEventListener('change', (e) => {
        state.isNoiseCancellationEnabled = e.target.checked
        localStorage.setItem('atoll_noise_cancellation', state.isNoiseCancellationEnabled)
        if (state.callStatus === 'active') {
          selectMicrophone(state.activeMicId)
        }
      })

      const applyLocalVideoEffects = () => {
        const videoGrid = refs('videoGrid')
        if (!videoGrid) {
          return
        }
  
        // Find local video element and apply CSS blur
        const me = $state.currentUser || { id: 'local-user' }
        const localTile = videoGrid.querySelector(`[data-participant-id="${me.id}"]`)
        if (localTile) {
          const videoEl = localTile.querySelector('.tile-video')
          if (videoEl) {
            if (state.isBackgroundBlurEnabled) {
              videoEl.style.filter = 'blur(10px)'
            } else {
              videoEl.style.filter = ''
            }
          }
        }
      }

      refs('toggleBackgroundBlur').addEventListener('change', (e) => {
        state.isBackgroundBlurEnabled = e.target.checked
        localStorage.setItem('atoll_background_blur', state.isBackgroundBlurEnabled)
        applyLocalVideoEffects()
      })

      // Ensure effects are applied on grid updates
      $bus.on('call:local_stream_available', () => {
        setTimeout(applyLocalVideoEffects, 100)
      })

      // 4. Dynamic Hardware Events (Plug-and-Play & Loss)
      const onDeviceChange = async () => {
        console.log('[call-overlay] Global media device change event triggered.')
        const oldMics = [...state.microphones]
        await fetchHardwareLists()
        renderDeviceMenus()

        if (state.callStatus !== 'active') {
          return
        }

        // Handle Hardware Loss (Fail Safe)
        const currentActiveMicStillExists = state.microphones.some(m => m.deviceId === state.activeMicId)
        if (oldMics.length > 0 && !currentActiveMicStillExists) {
          console.warn('[call-overlay] Active microphone was unplugged mid-call! Executing fail-safe...')
  
          // Force-mute the user
          if (state.localStream) {
            const tracks = state.localStream.getAudioTracks()
            tracks.forEach(track => {
              track.enabled = false
              track.stop()
            })
            state.isAudioEnabled = false
            $state.isAudioEnabled = false
          }

          // Clear local storage preference
          localStorage.removeItem('atoll_active_microphone')
          state.activeMicId = 'default'

          // Trigger warning toast notification
          $bus.emit('ui:show_toast', {
            message: 'Microphone disconnected.',
            type: 'danger'
          })

          renderDeviceMenus()
        }
      }

      navigator.mediaDevices.addEventListener('devicechange', onDeviceChange)
      signal.addEventListener('abort', () => {
        navigator.mediaDevices.removeEventListener('devicechange', onDeviceChange)
      })

      // Initialize speaking state initially on Active transition
      if (state.callStatus === 'active') {
        updateLocalSpeakingBtn()
      }

      // Cleanup on unmount
      signal.addEventListener('abort', () => {
        stopTracks()
        stopRingtone()
        modal.dispose()
      })
    }
  })
</script>
