<template id="call-overlay">
  <div ref="modal" class="modal fade" tabindex="-1" aria-labelledby="{{ ref_modalTitle }}" aria-hidden="true" style="z-index: 9999;">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-dark text-white border-0">
        <div class="modal-body p-0 overflow-hidden position-relative">
          
          <h1 class="visually-hidden">Call Overlay</h1>

          <!-- Incoming Call Sub-View -->
          <incoming-call-view></incoming-call-view>

          <!-- Active Call Sub-View -->
          <div class="active-view h-100 position-relative {{ activeClass }}">
            <div ref="fullScreenVideoContainer" class="h-100 w-100">
              <!-- video-grid will be moved here by syncVideoGrid -->
            </div>
            
            <!-- Control Bar Sub-View -->
            <call-control-bar></call-control-bar>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- PiP Window -->
  <div class="{{ pipClass }}">
    <pip-video ref="pipVideo"></pip-video>
  </div>

  <!-- Persistent Video Grid Source (to prevent re-mounting) -->
  <div class="d-none" ref="videoGridSource">
    <video-grid ref="videoGrid"></video-grid>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      callStatus: 'idle',
      callerName: 'Unknown Caller',
      callerInitial: '?',
      isAudioEnabled: true,
      isVideoEnabled: true,
      localStream: null,
      remoteOffer: null,
      isPipMode: false,
      isLocalSpeaking: false,
      incomingMediaTypes: ['audio', 'video']
    }),
    getters: {
      activeClass: (state) => (state.callStatus === 'active' && !state.isPipMode ? 'd-block' : 'd-none'),
      pipClass: (state) => (state.callStatus === 'active' && state.isPipMode ? 'd-block' : 'd-none')
    },
    client: async ({ state, globalStore, eventBus, webrtc: webrtcPluginContext, storage, refs, signal, bootstrap }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $webrtc } = webrtcPluginContext
      const { $storage } = storage
      const { Modal } = await bootstrap
      const modalEl = refs('modal')
      const modal = new Modal(modalEl, {
        backdrop: 'static',
        keyboard: false
      })

      const { playRingtone, stopRingtone } = await import('../../utils/call/callSoundManager.js')

      const updateModalVisibility = (status, isPip) => {
        if (status !== 'idle' && !isPip) {
          modal.show()
        } else {
          modal.hide()
        }
      }

      const getElementRef = (name) => {
        const direct = refs(name)
        if (direct) {
          return direct
        }
        if (modalEl) {
          return modalEl.querySelector(`[ref="${name}"]`) || modalEl.querySelector(`[ref$="${name}"]`)
        }
        return null
      }

      const syncVideoGrid = () => {
        const videoGrid = getElementRef('videoGrid')
        const pipVideo = getElementRef('pipVideo')
        if (!videoGrid) {
          return
        }

        if (state.isPipMode && pipVideo) {
          const container = pipVideo.shadowRoot ? pipVideo.shadowRoot.querySelector('[ref$="container"]') : pipVideo.querySelector('[ref$="container"]')
          if (container) {
            container.appendChild(videoGrid)
          }
        } else if (state.callStatus === 'active') {
          const container = getElementRef('fullScreenVideoContainer')
          if (container) {
            container.appendChild(videoGrid)
          }
        } else {
          const source = getElementRef('videoGridSource')
          if (source) {
            source.appendChild(videoGrid)
          }
        }

        $bus.emit('video-grid:sync')
      }

      // Sync local state with global state
      state.callStatus = $state.callStatus
      $state.isAudioEnabled = state.isAudioEnabled
      $state.isVideoEnabled = state.isVideoEnabled

      updateModalVisibility(state.callStatus, state.isPipMode)

      const stopTracks = () => {
        if (state.localStream) {
          state.localStream.getTracks().forEach(track => track.stop())
          state.localStream = null
        }
      }

      const updateTrackStates = (stream) => {
        if (!stream) {
          return
        }
        const hasAudio = stream.getAudioTracks().some(t => t.enabled)
        const hasVideo = stream.getVideoTracks().some(t => t.enabled)

        state.isAudioEnabled = hasAudio
        $state.isAudioEnabled = hasAudio
        state.isVideoEnabled = hasVideo
        $state.isVideoEnabled = hasVideo
      }

      const endCall = async () => {
        if ($state.activeCallRoomId) {
          await $webrtc.endCall($state.activeCallRoomId)
        }
        stopTracks()
        $state.set('callStatus', 'idle')
        $state.activeCallRoomId = null
        $state.localStream = null
        $state.remoteStream = null
        $state.hasRemoteVideo = false
        state.remoteOffer = null
        state.isAudioEnabled = true
        $state.isAudioEnabled = true
        state.isVideoEnabled = true
        $state.isVideoEnabled = true
      }

      const toggleAudio = () => {
        if (state.localStream) {
          const tracks = state.localStream.getAudioTracks()
          if (tracks.length > 0) {
            const nextState = !tracks[0].enabled
            tracks.forEach(track => {
              track.enabled = nextState
            })
            state.isAudioEnabled = nextState
            $state.isAudioEnabled = nextState
          }
        }
      }

      const toggleVideo = () => {
        if (state.localStream) {
          const tracks = state.localStream.getVideoTracks()
          if (tracks.length > 0) {
            const nextState = !tracks[0].enabled
            tracks.forEach(track => {
              track.enabled = nextState
            })
            state.isVideoEnabled = nextState
            $state.isVideoEnabled = nextState
          }
        }
      }

      $state.subscribe('callStatus', (val) => {
        state.callStatus = val
        if (val === 'idle' || (val === 'active' && (state.remoteOffer || $state.remoteStream))) {
          stopRingtone()
        }
        if (val === 'idle') {
          state.isPipMode = false
          $bus.emit('pip:reset_position')
        }
        if (val === 'incoming') {
          playRingtone({
            globalStore,
            $storage
          })
        }
        updateModalVisibility(val, state.isPipMode)
        syncVideoGrid()
      })

      // Listen for incoming call event to record remote offer and media types
      $bus.on('call:incoming', async ({ room_id, offer, senderId, media_types }) => {
        if (senderId === $state.currentUser?.id) {
          return
        }

        if ($state.callStatus !== 'idle') {
          console.warn('[call-overlay] Ignoring incoming call, already in a call.')
          return
        }

        $state.activeCallRoomId = room_id
        $state.set('callStatus', 'incoming')
        state.remoteOffer = offer
        state.incomingMediaTypes = media_types || ['audio', 'video']
      }, { signal })

      // Speaker Detection Setup
      const { createAudioSpeakerDetector } = await import('../../utils/audioSpeakerDetector.js')
      const speakerDetector = createAudioSpeakerDetector({
        onSpeakingChange: ({ isSpeaking, participantId }) => {
          if (participantId === 'local') {
            state.isLocalSpeaking = isSpeaking
            $state.isLocalSpeaking = isSpeaking
          } else {
            $state.isRemoteSpeaking = isSpeaking
          }
        }
      })

      let localStreamId = null
      let remoteStreamId = null

      $state.subscribe('localStream', (stream) => {
        if (localStreamId) {
          speakerDetector.detachStream(localStreamId)
          localStreamId = null
        }
        if (stream) {
          localStreamId = speakerDetector.attachStream(stream, 'local')
        }
      })

      $state.subscribe('remoteStream', (stream) => {
        if (remoteStreamId) {
          speakerDetector.detachStream(remoteStreamId)
          remoteStreamId = null
        }
        if (stream) {
          stopRingtone()
          remoteStreamId = speakerDetector.attachStream(stream, 'remote')
        }
      })

      $bus.on('call:remote_track_arrival', ({ stream }) => {
        if (stream) {
          if (remoteStreamId) {
            speakerDetector.detachStream(remoteStreamId)
          }
          remoteStreamId = speakerDetector.attachStream(stream, 'remote')
        }
      }, { signal })

      signal.addEventListener('abort', () => {
        speakerDetector.destroy()
      })

      // Listen for locally initiated calls
      $bus.on('call:initiated_locally', ({ localStream }) => {
        $state.localStream = localStream
        state.localStream = localStream
        updateTrackStates(localStream)

        $bus.emit('call:local_stream_available', { stream: localStream })
        playRingtone({
          globalStore,
          $storage
        })
      }, { signal })

      // Listen for call ended from remote
      $bus.on('call:ended', ({ room_id }) => {
        if ($state.activeCallRoomId === room_id) {
          stopTracks()
          $state.set('callStatus', 'idle')
          $state.activeCallRoomId = null
          state.remoteOffer = null
        }
      }, { signal })

      // Subcomponent Action Event Listeners
      $bus.on('call:accept_clicked', async () => {
        console.log('[call-overlay] Accept button clicked')
        let localStream = null
        const hasVideoOffer = state.incomingMediaTypes && state.incomingMediaTypes.includes('video')

        try {
          console.log('[call-overlay] Requesting media permissions (audio and video)...')
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: hasVideoOffer
          })
          console.log('[call-overlay] Media permissions granted')
        } catch (err) {
          console.warn('[call-overlay] Failed to get audio and video, trying audio-only fallback:', err)
          if (hasVideoOffer) {
            try {
              localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
              })
              console.log('[call-overlay] Audio-only fallback media permissions granted')
            } catch (fallbackErr) {
              console.error('[call-overlay] Both audio/video and audio-only media requests failed:', fallbackErr)
              endCall()
              return
            }
          } else {
            console.error('[call-overlay] Failed to accept audio call:', err)
            endCall()
            return
          }
        }

        try {
          state.localStream = localStream
          $state.localStream = localStream
          updateTrackStates(localStream)

          console.log('[call-overlay] Setting call status to active')
          $state.set('callStatus', 'active')
          $bus.emit('call:local_stream_available', { stream: localStream })

          console.log('[call-overlay] Answering call via WebRTC plugin...')
          await $webrtc.answerCall($state.activeCallRoomId, localStream, state.remoteOffer)
          console.log('[call-overlay] answerCall initiated successfully')
        } catch (err) {
          console.error('[call-overlay] Failed to answer call:', err)
          endCall()
        }
      }, { signal })

      $bus.on('call:reject_clicked', () => {
        $state.remoteStream = null
        $state.hasRemoteVideo = false
        endCall()
      }, { signal })

      $bus.on('call:toggle_audio_clicked', () => {
        toggleAudio()
      }, { signal })

      $bus.on('call:toggle_video_clicked', () => {
        toggleVideo()
      }, { signal })

      $bus.on('call:pip_clicked', () => {
        state.isPipMode = true
        updateModalVisibility(state.callStatus, true)
        syncVideoGrid()
      }, { signal })

      $bus.on('pip:expand', () => {
        state.isPipMode = false
        updateModalVisibility(state.callStatus, false)
        syncVideoGrid()
      }, { signal })

      $bus.on('call:end_clicked', () => {
        endCall()
      }, { signal })

      // Cleanup on unmount
      signal.addEventListener('abort', () => {
        stopTracks()
        stopRingtone()
        modal.dispose()
      })
    }
  })
</script>
