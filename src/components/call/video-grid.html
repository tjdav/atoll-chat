<template id="video-grid">
  <div class="video-grid position-relative w-100 h-100 bg-dark overflow-hidden {{ pipClass }}">
    <!-- Main background video (Remote) -->
    <video ref="remoteVideo" class="remote-video w-100 h-100 object-fit-cover {{ remoteVideoSpeakingClass }}" autoplay playsinline></video>
    
    <!-- Picture-in-Picture local video -->
    <video ref="localVideo" class="local-video position-absolute top-0 end-0 m-3 rounded shadow-lg border border-2 border-light {{ localVideoClass }} {{ localVideoSpeakingClass }}" style="width: 200px; aspect-ratio: 16/9; object-fit: cover; z-index: 10;" autoplay playsinline muted></video>

    <!-- Overlay if no remote video yet -->
    <div class="remote-placeholder position-absolute top-0 start-0 w-100 h-100 {{ placeholderClass }} flex-column align-items-center justify-content-center text-white" style="background: rgba(0,0,0,0.5);">
      <!-- Video Call waiting spinner and text -->
      <div class="{{ videoWaitingClass }} flex-column align-items-center justify-content-center">
        <div class="spinner-border video-spinner text-primary mb-3" role="status">
          <span class="visually-hidden">Connecting...</span>
        </div>
        <p class="h5">Waiting for remote participant...</p>
      </div>

      <!-- Audio Call active view with avatar and name -->
      <div class="{{ audioCallClass }} flex-column align-items-center justify-content-center">
        <div ref="remoteAvatar" class="avatar-large bg-primary rounded-circle d-flex align-items-center justify-content-center mb-4 shadow {{ remoteAvatarSpeakingClass }}" style="width: 120px; height: 120px; font-size: 3rem;">
          {{ remoteInitial }}
        </div>
        <h2 class="mb-2">{{ remoteName }}</h2>
        <p class="text-light fs-5">Audio Call Active</p>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isPipMode: false,
      hasRemoteVideo: false,
      isVideoEnabled: true,
      hasRemoteConnected: false,
      remoteName: 'Remote Participant',
      remoteInitial: '?',
      isLocalSpeaking: false,
      isRemoteSpeaking: false
    }),
    getters: {
      placeholderClass: (state) => (state.hasRemoteVideo ? 'd-none' : 'd-flex'),
      pipClass: (state) => (state.isPipMode ? 'is-pip' : ''),
      localVideoClass: (state) => {
        if (state.isPipMode) {
          return 'd-none'
        }
        return state.isVideoEnabled ? 'd-block' : 'd-none'
      },
      videoWaitingClass: (state) => (!state.hasRemoteConnected ? 'd-flex' : 'd-none'),
      audioCallClass: (state) => (!state.isVideoEnabled && state.hasRemoteConnected ? 'd-flex' : 'd-none'),
      remoteAvatarSpeakingClass: (state) => (state.isRemoteSpeaking ? 'speaking-ring' : ''),
      remoteVideoSpeakingClass: (state) => (state.isRemoteSpeaking ? 'speaking-border' : ''),
      localVideoSpeakingClass: (state) => (state.isLocalSpeaking ? 'speaking-border' : '')
    },
    client: ({ refs, state, eventBus, signal, globalStore, storage }) => {
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $storage } = storage
      const remoteVideo = refs('remoteVideo')
      const localVideo = refs('localVideo')
      const remoteAvatar = refs('remoteAvatar')

      const updateSpeakingDOM = () => {
        const targetAvatar = refs('remoteAvatar') || remoteAvatar
        const targetRemoteVideo = refs('remoteVideo') || remoteVideo
        const targetLocalVideo = refs('localVideo') || localVideo

        if (targetAvatar) {
          if (state.isRemoteSpeaking) {
            targetAvatar.classList.add('speaking-ring')
          } else {
            targetAvatar.classList.remove('speaking-ring')
          }
        }
        if (targetRemoteVideo) {
          if (state.isRemoteSpeaking) {
            targetRemoteVideo.classList.add('speaking-border')
          } else {
            targetRemoteVideo.classList.remove('speaking-border')
          }
        }
        if (targetLocalVideo) {
          if (state.isLocalSpeaking) {
            targetLocalVideo.classList.add('speaking-border')
          } else {
            targetLocalVideo.classList.remove('speaking-border')
          }
        }
      }

      state.isLocalSpeaking = Boolean($state.isLocalSpeaking)
      $state.subscribe('isLocalSpeaking', (val) => {
        state.isLocalSpeaking = Boolean(val)
        updateSpeakingDOM()
      })

      state.isRemoteSpeaking = Boolean($state.isRemoteSpeaking)
      $state.subscribe('isRemoteSpeaking', (val) => {
        state.isRemoteSpeaking = Boolean(val)
        updateSpeakingDOM()
      })

      state.isVideoEnabled = $state.isVideoEnabled !== undefined ? Boolean($state.isVideoEnabled) : true
      $state.subscribe('isVideoEnabled', (val) => {
        state.isVideoEnabled = val !== undefined ? Boolean(val) : true
      })

      const updateRemoteParticipantInfo = async () => {
        const roomId = $state.activeCallRoomId
        if (!roomId) {
          return
        }

        try {
          const room = await $storage.getRoom(roomId)
          if (room) {
            const participants = (room.participants || []).filter(p => p.id !== $state.currentUser?.id)
            if (!room.is_group && participants.length > 0) {
              state.remoteName = participants[0].name || participants[0].username
            } else {
              state.remoteName = room.name || 'Remote Participant'
            }
            state.remoteInitial = state.remoteName.charAt(0).toUpperCase()
          }
        } catch (err) {
          console.error('[video-grid] Failed to fetch remote participant info:', err)
        }
      }

      // Fetch on mount if room ID is already set
      if ($state.activeCallRoomId) {
        updateRemoteParticipantInfo()
      }

      $state.subscribe('activeCallRoomId', (roomId) => {
        if (roomId) {
          updateRemoteParticipantInfo()
        }
      })

      const playVideo = (videoEl) => {
        if (!videoEl || !videoEl.srcObject) {
          return
        }
  
        videoEl.play().catch(err => {
          if (err.name === 'AbortError') {
            setTimeout(() => playVideo(videoEl), 100)
          } else if (err.name === 'NotAllowedError') {
            console.warn('[video-grid] Play not allowed, muting and retrying...', videoEl.className)
            videoEl.muted = true
            videoEl.play().catch(e => console.error('[video-grid] Play failed even when muted:', e))
          } else {
            console.error('[video-grid] Play failed:', err)
          }
        })
      }

      const checkPip = () => {
        let el = remoteVideo
        let isPip = false
        while (el) {
          if (el.tagName === 'PIP-VIDEO' || (el.classList && el.classList.contains('pip-window'))) {
            isPip = true
            break
          }
          el = el.parentElement || (el.getRootNode && el.getRootNode()?.host)
        }

        if (state.isPipMode !== isPip) {
          state.isPipMode = isPip
        }

        const resumeAll = () => {
          if (remoteVideo && remoteVideo.srcObject && remoteVideo.paused) {
            playVideo(remoteVideo)
          }
          if (localVideo && localVideo.srcObject && localVideo.paused) {
            playVideo(localVideo)
          }
        }

        resumeAll()
        // Ensure we resume after DOM re-parenting completes and settles
        setTimeout(resumeAll, 100)
        setTimeout(resumeAll, 500)
        setTimeout(resumeAll, 1000)
      }

      checkPip()
  
      const observer = new MutationObserver(checkPip)
      observer.observe(document.body, {
        childList: true,
        subtree: true
      })
      signal.addEventListener('abort', () => observer.disconnect())

      const attachLocalStream = (stream) => {
        if (localVideo) {
          if (localVideo.srcObject !== stream) {
            localVideo.srcObject = stream
          }
  
          playVideo(localVideo)
          localVideo.onloadedmetadata = () => playVideo(localVideo)
        }
      }

      const attachRemoteStream = (stream) => {
        if (remoteVideo && stream) {
          console.log('[video-grid] Attaching remote stream', { hasTracks: stream.getTracks().length > 0 })
          if (remoteVideo.srcObject !== stream) {
            remoteVideo.srcObject = stream
          }
          remoteVideo.muted = true
          if ($state.hasRemoteVideo) {
            console.log('[video-grid] Remote video detected, playing...')
            playVideo(remoteVideo)
            remoteVideo.onloadedmetadata = () => {
              console.log('[video-grid] Remote video metadata loaded')
              playVideo(remoteVideo)
            }
          }
        }
      }

      // If streams are already available in global state, attach them
      if ($state.localStream) {
        attachLocalStream($state.localStream)
      }
      if ($state.remoteStream) {
        attachRemoteStream($state.remoteStream)
      }

      $state.subscribe('localStream', (stream) => {
        if (stream) {
          attachLocalStream(stream)
        } else {
          if (localVideo) {
            localVideo.srcObject = null
          }
        }
      })

      state.hasRemoteConnected = Boolean($state.remoteStream)
      $state.subscribe('remoteStream', (stream) => {
        state.hasRemoteConnected = Boolean(stream)
        if (stream) {
          attachRemoteStream(stream)
        } else {
          if (remoteVideo) {
            remoteVideo.srcObject = null
          }
        }
      })

      // Listen for remote track arrival
      $bus.on('call:remote_track_arrival', ({ room_id, stream, track }) => {
        if (room_id && room_id !== $state.activeCallRoomId) {
          return
        }

        console.log(`[video-grid] Remote track arrival: ${track.kind} for room ${room_id}`)
        if (track.kind === 'video' && remoteVideo) {
          attachRemoteStream(stream)
        } else if (track.kind === 'audio') {
          const audio = new Audio()
          audio.autoplay = true
          audio.srcObject = stream
          audio.play().catch(err => {
            if (err.name === 'NotAllowedError') {
              console.warn('[video-grid] Autoplay blocked for audio track, enabling fallback playback...')
              audio.muted = true
              audio.play().catch(e => console.error('[video-grid] Audio play failed:', e))
            }
          })

          // Cleanup audio on call end or unmount
          const cleanup = (e) => {
            if (e?.room_id && e.room_id !== room_id) {
              return
            }
            audio.pause()
            audio.srcObject = null
            audio.remove()
            signal.removeEventListener('abort', cleanup)
          }
          $bus.on('call:ended', cleanup)
          signal.addEventListener('abort', cleanup)
        }
      }, { signal })

      // Listen for call ended to release UI resources immediately
      $bus.on('call:ended', ({ room_id }) => {
        if (room_id && room_id !== $state.activeCallRoomId) {
          return
        }
        if (remoteVideo) {
          remoteVideo.pause()
          remoteVideo.srcObject = null
          remoteVideo.load()
        }
        if (localVideo) {
          localVideo.srcObject = null
        }
      }, { signal })

      // Handle video element cleanup
      signal.addEventListener('abort', () => {
        if (remoteVideo) {
          remoteVideo.srcObject = null
        }
        if (localVideo) {
          localVideo.srcObject = null
        }
      })
    }
  })
</script>
