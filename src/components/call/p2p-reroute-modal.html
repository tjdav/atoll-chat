<template id="p2p-reroute-modal">
  <atoll-popup 
    ref="rerouteModal" 
    title="Select Recipient"
  >
    <div>
      <div class="p-2 text-muted border-bottom text-center small mb-3">
        Files larger than 25MB cannot be uploaded to the group chat directly. Please select a participant to transfer the file to directly.
      </div>
      <div class="list-group list-group-flush" ref="listContainer" style="max-height: 300px; overflow-y: auto;">
        <!-- Participants list will be rendered here -->
      </div>
    </div>

    <div slot="actions" class="atoll-popup-actions atoll-popup-actions-horizontal d-flex justify-content-end">
      <button type="button" class="btn btn-link text-decoration-none" ref="btnCancel">Cancel</button>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      activeFile: null,
      activeRoom: null,
      participants: []
    }),
    client: ({ state, refs, eventBus, globalStore, pocketbase, signal }) => {
      const { $bus } = eventBus
      const { $state } = globalStore
      const { pb } = pocketbase
      const modal = refs('rerouteModal')
      const btnCancel = refs('btnCancel')

      const render = () => {
        const container = refs('listContainer')

        container.innerHTML = ''

        if (state.participants.length === 0) {
          const empty = document.createElement('div')
          empty.className = 'p-4 text-center text-muted'
          empty.textContent = 'No other participants in this group.'
          container.appendChild(empty)
          return
        }

        state.participants.forEach(p => {
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 border-0'
          btn.setAttribute('data-testid', `reroute-user-${p.username}`)

          // Render avatar
          const avatar = document.createElement('atoll-profile')
          avatar.setAttribute('size', 'xs')
          avatar.setAttribute('alt', p.name || p.username || 'User profile')
          if (p.id) {
            avatar.setAttribute('user-id', p.id)
          }
          if (p.avatar) {
            avatar.setAttribute('src', pb.files.getURL(p, p.avatar, { thumb: '32x32' }))
          }

          const label = document.createElement('span')
          label.className = 'fw-bold'
          label.textContent = p.name || p.username

          btn.appendChild(avatar)
          btn.appendChild(label)

          btn.onclick = () => {
            if (modal) {
              modal.hide()
            }
  
            $bus.emit('action:execute_p2p_transfer', {
              file: state.activeFile,
              selectedUserId: p.id,
              roomId: state.activeRoom.id
            })
          }

          container.appendChild(btn)
        })
      }

      $bus.on('ui:prompt_p2p_reroute', (payload) => {
        state.activeFile = payload.file
        state.activeRoom = payload.room
  
        // Filter out current user from participants
        const currentUserId = $state.currentUser?.id
        state.participants = (payload.room?.participants || []).filter(p => p.id !== currentUserId)

        render()
        if (modal) {
          modal.show()
        }
      })

      if (btnCancel) {
        btnCancel.onclick = () => {
          if (modal) {
            modal.hide()
          }
        }
      }
    }
  })
</script>
