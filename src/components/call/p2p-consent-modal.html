<template id="p2p-consent-modal">
  <atoll-popup 
    ref="consentModal" 
    title="Incoming File Transfer"
    variant="confirm"
    static-backdrop
  >
    <div class="text-center py-2">
      <div class="mb-3">
        <i class="bi bi-file-earmark-arrow-down fs-1 text-primary"></i>
      </div>
      <h6 class="fw-bold mb-2" ref="promptText">
        Incoming transfer...
      </h6>
      <p class="text-muted small mb-0" ref="detailsText">
        Size: --
      </p>
    </div>

    <div slot="actions" class="atoll-popup-actions atoll-popup-actions-horizontal d-flex justify-content-center gap-3">
      <button type="button" class="btn btn-danger px-4" ref="btnReject" data-testid="consent-btn-reject">Reject</button>
      <button type="button" class="btn btn-success px-4" ref="consent-btn-accept" data-testid="consent-btn-accept">Accept</button>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      senderName: '',
      filename: '',
      fileSizeStr: '',
      p2pUuid: '',
      roomId: '',
      senderId: ''
    }),
    client: ({ state, refs, root, eventBus, pocketbase, storage, signal }) => {
      const { $bus } = eventBus
      const { pb } = pocketbase
      const { $storage } = storage
      const modal = refs('consentModal')

      $bus.on('ui:prompt_p2p_consent', async (payload) => {
        console.info('[p2p-consent-modal] Bob received ui:prompt_p2p_consent payload:', payload)
        state.p2pUuid = payload.p2pUuid
        state.roomId = payload.roomId
        state.senderId = payload.senderId
        state.filename = payload.filename

        const sizeInMB = (payload.size / (1024 * 1024)).toFixed(1)
        state.fileSizeStr = `${sizeInMB} MB`

        // Resolve sender name
        let name = 'Someone'
        try {
          console.info('[p2p-consent-modal] Bob fetching room or user info...')
          const room = await $storage.getRoom(payload.roomId)
          console.info('[p2p-consent-modal] Bob room from storage:', room)
          const participant = room?.participants?.find(p => p.id === payload.senderId)
          if (participant) {
            name = participant.name || participant.username
          } else {
            const user = await pb.collection('users').getOne(payload.senderId, { requestKey: null })
            name = user.name || user.username
          }
        } catch (err) {
          console.error('[p2p-consent-modal] Failed to resolve sender name:', err)
        }

        state.senderName = name
        console.info('[p2p-consent-modal] Bob resolved senderName:', state.senderName)

        refs('promptText').textContent = `${state.senderName} wants to send you a file:`
        refs('detailsText').textContent = `${state.filename} (${state.fileSizeStr})`

        console.info('[p2p-consent-modal] Bob calling modal.show()')
        modal.show()
      })

      root.addEventListener('click', (e) => {
        const acceptTarget = e.target.closest('[data-testid$="consent-btn-accept"]') || e.target.closest('[ref$="consent-btn-accept"]')
        if (acceptTarget) {
          modal.hide()

          $bus.emit('action:execute_p2p_accept', {
            p2pUuid: state.p2pUuid,
            roomId: state.roomId,
            senderId: state.senderId
          })
          return
        }

        const rejectTarget = e.target.closest('[data-testid$="consent-btn-reject"]') || e.target.closest('[ref$="btnReject"]')
        if (rejectTarget) {
          modal.hide()
  
          $bus.emit('action:execute_p2p_reject', {
            p2pUuid: state.p2pUuid,
            roomId: state.roomId,
            senderId: state.senderId
          })
        }
      }, { signal })
    }
  })
</script>
