<template id="auth-register">
  <div class="auth-register-container">
    <form ref="registerForm" class="auth-form">
      <h3>Create Account</h3>
      <div class="form-group mb-3">
        <label for="username">Username</label>
        <input ref="username" id="username" type="text" class="form-control" placeholder="Choose a username" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password (min 8 characters)</label>
        <input ref="password" id="password" type="password" class="form-control" placeholder="Enter Password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <div class="mt-3 text-center">
      <small>Already have an account? <a href="#" ref="linkLogin">Login here</a></small>
    </div>
    <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
  </div>
</template>

<style>
  .auth-register-container {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid #dee2e6;
    border-radius: 0.5rem;
    background-color: #f8f9fa;
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    script: ({ refs, pocketbase, globalStore }) => {
      const { pb } = pocketbase
      const { $state } = globalStore
      const registerForm = refs('registerForm')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const passwordInput = refs('password')
      const statusMsg = refs('statusMsg')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const username = usernameInput.value
        const password = passwordInput.value

        try {
          updateStatus('Creating account...')

          const payload = {
            username,
            password,
            passwordConfirm: password
          }

          // Create the user record in PocketBase
          await pb.collection('users').create(payload)

          updateStatus('Account created! Logging in...')

          // Perform PocketBase authentication after registration
          await pb.collection('users').authWithPassword(username, password)

          // Persist PB config for Service Worker access
          const db = await $localDb()
          await db.local_config.bulkPut([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Login successful! Proceeding to vault setup...')

          // Notify the application that authentication was successful.
          // app-root will handle showing vault-setup if keys are missing.
          $state.isAuthenticated = true

        } catch (error) {
          console.error('Registration error:', error)
          updateStatus(`Error: ${error.message || 'Registration failed'}`)
        }
      })
    }
  })
</script>
