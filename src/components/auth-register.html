<template id="auth-register">
  <div class="auth-register-container">
    <form ref="registerForm" class="auth-form">
      <h3>Create Account</h3>
      <div class="form-group mb-3">
        <label for="username">Username</label>
        <input ref="username" id="username" type="text" class="form-control" placeholder="Choose a username" required>
      </div>
      <div class="form-group mb-3">
        <label for="email">Email</label>
        <input ref="email" id="email" type="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password (min 8 characters)</label>
        <input ref="password" id="password" type="password" class="form-control" placeholder="Enter Password" minlength="8" required>
      </div>
      <div class="form-group mb-3">
        <label for="passwordConfirm">Confirm Password</label>
        <input ref="passwordConfirm" id="passwordConfirm" type="password" class="form-control" placeholder="Confirm Password" minlength="8" required>
      </div>

      <hr>
      <div ref="vaultSection">
        <h5>Secure Your Vault</h5>
        <p class="text-muted small">Choose how to encrypt your local cryptographic keys. These keys never leave your device unencrypted.</p>
        
        <div ref="pinSection">
          <div class="form-group mb-3">
            <label for="pin">Vault PIN (6 characters)</label>
            <input ref="pin" id="pin" type="password" class="form-control" placeholder="Enter 6-digit PIN" minlength="6" maxlength="6">
          </div>
          <div class="form-group mb-3">
            <label for="pinConfirm">Confirm PIN</label>
            <input ref="pinConfirm" id="pinConfirm" type="password" class="form-control" placeholder="Confirm PIN" minlength="6" maxlength="6">
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-3" ref="btnTogglePasskey">Use Passkey instead</button>
        </div>

        <div ref="passkeySection" class="d-none">
          <div class="alert alert-info small">
            You will be prompted to create a Passkey when you click "Create Account".
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-3" ref="btnTogglePin">Use PIN instead</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <div class="mt-3 text-center">
      <small>Already have an account? <a href="#" ref="linkLogin">Login here</a></small>
    </div>
    <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
  </div>
</template>

<style>
  .auth-register-container {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid #dee2e6;
    border-radius: 0.5rem;
    background-color: #f8f9fa;
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    script: ({ refs, pocketbase, globalStore, eventBus, realtimeSync }) => {
      const { pb } = pocketbase
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync

      const registerForm = refs('registerForm')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const emailInput = refs('email')
      const passwordInput = refs('password')
      const passwordConfirmInput = refs('passwordConfirm')
      const statusMsg = refs('statusMsg')

      // Vault Refs
      const pinSection = refs('pinSection')
      const passkeySection = refs('passkeySection')
      const pinInput = refs('pin')
      const pinConfirmInput = refs('pinConfirm')
      const btnTogglePasskey = refs('btnTogglePasskey')
      const btnTogglePin = refs('btnTogglePin')

      let vaultMode = 'pin' // 'pin' or 'passkey'

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      btnTogglePasskey.addEventListener('click', () => {
        vaultMode = 'passkey'
        pinSection.classList.add('d-none')
        passkeySection.classList.remove('d-none')
        pinInput.removeAttribute('required')
        pinConfirmInput.removeAttribute('required')
      })

      btnTogglePin.addEventListener('click', () => {
        vaultMode = 'pin'
        passkeySection.classList.add('d-none')
        pinSection.classList.remove('d-none')
        pinInput.setAttribute('required', '')
        pinConfirmInput.setAttribute('required', '')
      })

      // Ensure required attributes are correct on mount
      pinInput.setAttribute('required', '')
      pinConfirmInput.setAttribute('required', '')

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const username = usernameInput.value
        const email = emailInput.value
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password !== passwordConfirm) {
          updateStatus('Error: Passwords do not match')
          return
        }

        let pin = ''
        if (vaultMode === 'pin') {
          pin = pinInput.value
          const pinConfirm = pinConfirmInput.value
          if (pin !== pinConfirm) {
            updateStatus('Error: Vault PINs do not match')
            return
          }
          if (pin.length !== 6) {
             updateStatus('Error: Vault PIN must be 6 characters')
             return
          }
        }

        try {
          updateStatus('Initializing cryptographic modules...')
          const [{ default: sodium }, { generateMasterKeys, generateSalt, deriveKeyFromPin, createPasskey, deriveKeyFromPasskey, encryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          updateStatus('Generating cryptographic keys...')
          const masterKeys = await generateMasterKeys(sodium)
          
          let encryptionPayload = {
            public_box_key: masterKeys.public_box_key,
            public_sign_key: masterKeys.public_sign_key
          }

          if (vaultMode === 'pin') {
            updateStatus('Securing vault with PIN...')
            const pinSalt = generateSalt(sodium)
            const KEK = await deriveKeyFromPin(pin, pinSalt, sodium)
            const encryptedVault = encryptVault(masterKeys, KEK, sodium)

            encryptionPayload.pin_salt = sodium.to_base64(pinSalt, sodium.base64_variants.ORIGINAL)
            encryptionPayload.encrypted_master_keys = encryptedVault
          } else {
            updateStatus('Waiting for Passkey registration...')
            const challenge = crypto.getRandomValues(new Uint8Array(32))
            const passkeyPrfSalt = crypto.getRandomValues(new Uint8Array(32))
            
            let { credentialId, prfAvailable, prfResult: KEK } = await createPasskey(username, challenge, passkeyPrfSalt)

            if (!prfAvailable) {
              throw new Error('This authenticator does not support the PRF extension required for vault encryption.')
            }

            if (!KEK) {
              updateStatus('Securing vault with Passkey (verification step)...')
              KEK = await deriveKeyFromPasskey(credentialId, challenge, passkeyPrfSalt)
            }

            const encryptedVault = encryptVault(masterKeys, KEK, sodium)

            encryptionPayload.passkey_credential_id = sodium.to_base64(credentialId, sodium.base64_variants.ORIGINAL)
            encryptionPayload.passkey_prf_salt = sodium.to_base64(passkeyPrfSalt, sodium.base64_variants.ORIGINAL)
            encryptionPayload.encrypted_master_keys_passkey = encryptedVault
          }

          updateStatus('Creating account...')

          const payload = {
            username,
            email,
            password,
            passwordConfirm,
            ...encryptionPayload
          }

          // Create the user record in PocketBase
          await pb.collection('users').create(payload)

          updateStatus('Account created! Logging in...')

          // Perform PocketBase authentication after registration
          await pb.collection('users').authWithPassword(username, password)

          // Persist PB config for Service Worker access
          const db = await $localDb()
          await db.local_config.bulkPut([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Login successful! Initializing session...')

          // Initialize the crypto worker with the new private keys
          const { $worker } = await import('coralite').then(m => m.getContext().cryptoWorker())
          await $worker.execute('INIT_KEYS', {
            private_box_key: masterKeys.private_box_key,
            private_sign_key: masterKeys.private_sign_key
          })

          // Start subscriptions
          await $sync.startSubscriptions()

          // Emit unlocked event for any listening components
          $bus.emit('auth:unlocked', {
            keys: {
              private_box_key: masterKeys.private_box_key,
              private_sign_key: masterKeys.private_sign_key
            },
            userRecord: pb.authStore.model
          })

          // Update global state to transition to the app
          $state.isVaultUnlocked = true
          $state.isAuthenticated = true

        } catch (error) {
          console.error('Registration error:', error)
          updateStatus(`Error: ${error.message || 'Registration failed'}`)
        }
      })
    }
  })
</script>
