<template id="auth-register">
  <div class="card shadow">
    <div class="card-body p-4">
      <form ref="registerForm">
        <div ref="step1">
          <h3 class="card-title mb-4 text-center">Create Account</h3>
          <div class="mb-3">
            <label for="{{ ref_username }}" class="form-label">Username</label>
            <input name="username" ref="username" type="text" class="form-control" placeholder="Choose a username" minlength="3" maxlength="20" pattern="^[a-zA-Z0-9_]+$" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="{{ ref_email }}" class="form-label">Email</label>
            <input name="email" ref="email" type="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary w-100" ref="btnSubmit" data-testid="registerSubmit">Register & Send Magic Link</button>
        </div>

        <div ref="step2" class="d-none">
          <h3 class="card-title mb-3 text-center">Verify Account</h3>
          <p class="text-muted small text-center mb-4">We sent a Magic Link to your email. Click it to log in and set up your secure vault, or enter the 8-digit code manually below:</p>
          <div class="mb-3">
            <label for="{{ ref_otpCode }}" class="form-label">8-digit Verification Code</label>
            <input ref="otpCode" name="otpCode" type="text" class="form-control text-center fs-4" placeholder="00000000" maxlength="8" pattern="\d{8}">
          </div>
          <button type="button" class="btn btn-success w-100 mb-2" ref="btnSubmitOtp">Verify & Log In</button>
        </div>
      </form>
      <div class="mt-3 text-center" ref="loginLinkContainer">
        <small class="text-muted">Already have an account? <a href="#" ref="linkLogin" data-testid="linkLogin" class="text-decoration-none">Login here</a></small>
      </div>
      <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, pocketbase, globalStore, localDb }) => {
      const { pb } = pocketbase
      const { $localDb } = localDb
      const { $state } = globalStore

      const registerForm = refs('registerForm')
      const step1 = refs('step1')
      const step2 = refs('step2')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const emailInput = refs('email')
      const otpCodeInput = refs('otpCode')
      const btnSubmitOtp = refs('btnSubmitOtp')
      const loginLinkContainer = refs('loginLinkContainer')
      const statusMsg = refs('statusMsg')

      let currentOtpId = null

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      const handleSuccessfulLogin = async () => {
        const db = $localDb
        await db.local_config.bulkPut([
          {
            key: 'pb_url',
            value: pb.baseUrl
          },
          {
            key: 'pb_token',
            value: pb.authStore.token
          }
        ])

        updateStatus('Login successful! Loading secure vault setup...')
        $state.isAuthenticated = true
      }

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const username = usernameInput.value
        const email = emailInput.value

        if (!username || !email) {
          updateStatus('Error: Please fill in all fields')
          return
        }

        if (username.length < 3) {
          updateStatus('Error: Username must be at least 3 characters')
          return
        }

        if (username.length > 20) {
          updateStatus('Error: Username must be at most 20 characters')
          return
        }

        if (!/^[a-zA-Z0-9_]+$/.test(username)) {
          updateStatus('Error: Username can only contain alphanumeric characters and underscores')
          return
        }

        try {
          updateStatus('Checking availability...')
  
          const params = new URLSearchParams({
            username,
            email
          })
  
          const availabilityRes = await fetch(`${pb.baseUrl}/api/check-availability?${params}`).then(r => r.json())

          if (availabilityRes.usernameExists) {
            updateStatus('Error: Username is already taken')
            return
          }

          if (availabilityRes.emailExists) {
            updateStatus('Error: Email is already taken')
            return
          }

          updateStatus('Creating account...')

          const payload = {
            username,
            name: username,
            email,
            password: 'Password123!',
            passwordConfirm: 'Password123!',
            public_box_key: '',
            public_sign_key: '',
            encrypted_master_keys: '',
            vault_salt: ''
          }

          await pb.collection('users').create(payload)

          updateStatus('Account created! Sending Magic Link...')

          const result = await pb.collection('users').requestOTP(email)
          currentOtpId = result.otpId

          step1.classList.add('d-none')
          step2.classList.remove('d-none')
          loginLinkContainer.classList.add('d-none')

          updateStatus('Magic Link sent!')
        } catch (error) {
          console.error('Registration error:', error)
          updateStatus(`Error: ${error.message || 'Registration failed'}`)
        }
      })

      btnSubmitOtp.addEventListener('click', async () => {
        const code = otpCodeInput.value
        if (!code || code.length !== 8) {
          updateStatus('Please enter a valid 8-digit code')
          return
        }

        try {
          updateStatus('Verifying code...')
          await pb.collection('users').authWithOTP(currentOtpId, code)
          await handleSuccessfulLogin()
        } catch (error) {
          console.error('OTP registration login error:', error)
          updateStatus(error.message || 'Verification failed')
        }
      })
    }
  })
</script>
