<template id="room-details-sidebar">
  <div class="room-details d-flex flex-column h-100 bg-body">
    <div class="sidebar-header p-3 border-bottom d-flex justify-content-between align-items-center bg-body">
      <h6 class="mb-0 fw-bold">Room Details</h6>
      <button type="button" class="btn-close" ref="btnClose" aria-label="Close"></button>
    </div>

    <div class="sidebar-content flex-grow-1 overflow-y-auto p-3">
      <div class="section-title text-uppercase text-muted small fw-bold mb-3">Members ({{ memberCount }})</div>
      <div class="member-list list-group list-group-flush" ref="memberList">
        <!-- Members will be rendered here -->
      </div>
    </div>

    <div ref="loadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 bg-body bg-opacity-75 {{ loadingClass }} align-items-center justify-content-center" style="z-index: 1060;">
      <div class="text-center">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="small fw-bold" ref="loadingText">{{ loadingMessage }}</div>
      </div>
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      members: [],
      isAdmin: false,
      isKicking: false,
      isLoading: false,
      loadingMessage: 'Loading...'
    }),
    getters: {
      memberCount: (state) => (state.members || []).length,
      loadingClass: (state) => (state.isLoading ? 'd-flex' : 'd-none')
    },
    client: ({ refs, state, pocketbase, eventBus, globalStore, storage, cryptoWorker, utils }) => {
      const { pb } = pocketbase
      const { $crypto } = utils
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $storage } = storage
      const memberListContainer = refs('memberList')

      const showLoading = (text) => {
        state.loadingMessage = text || 'Loading...'
        state.isLoading = true
      }

      const hideLoading = () => {
        state.isLoading = false
      }

      const fetchMembers = async () => {
        const room_id = $state.activeSelectionId
        if (!room_id) {
          return
        }

        showLoading('Fetching members...')
        try {
          const members = await pb.collection('room_members').getFullList({
            filter: pb.filter('room_id = {:room_id}', { room_id }),
            expand: 'user_id'
          })

          state.members = members
  
          // Check if current user is admin
          const currentUser = $state.currentUser
          const currentMember = members.find(m => m.user_id === currentUser.id)
          state.isAdmin = currentMember && currentMember.role === 'admin'

          renderMembers()
        } catch (err) {
          console.error('[room-details-sidebar] Failed to fetch members:', err)
        } finally {
          hideLoading()
        }
      }

      const renderMembers = () => {
        if (!memberListContainer) {
          return
        }
        memberListContainer.innerHTML = ''

        state.members.forEach(member => {
          const user = member.expand.user_id
          const isCurrentUser = user.id === $state.currentUser.id

          const item = document.createElement('div')
          item.className = 'member-item d-flex align-items-center justify-content-between px-2'

          const info = document.createElement('div')
          info.className = 'd-flex align-items-center'

          const avatar = document.createElement('div')
          avatar.className = 'member-avatar bg-primary-subtle text-primary overflow-hidden'
          if (user.avatar) {
            const url = pb.files.getURL(user, user.avatar, { thumb: '32x32' })
            avatar.innerHTML = ''
            const img = document.createElement('img')
            img.src = url
            img.className = 'w-100 h-100 object-fit-cover'
            avatar.appendChild(img)
          } else {
            avatar.textContent = (user.name || user.username).charAt(0).toUpperCase()
          }

          const nameWrapper = document.createElement('div')
          const name = document.createElement('div')
          name.className = 'fw-bold'
          name.textContent = (user.name || user.username) + (isCurrentUser ? ' (You)' : '')

          const role = document.createElement('span')
          role.className = 'badge bg-light text-dark border ms-2 small'
          role.style.fontSize = '0.7rem'
          role.textContent = member.role === 'admin' ? 'Admin' : 'Member'

          name.appendChild(role)
          nameWrapper.appendChild(name)
          info.appendChild(avatar)
          info.appendChild(nameWrapper)
          item.appendChild(info)

          // Show Remove button if current user is admin and the member is not themselves
          if (state.isAdmin && !isCurrentUser) {
            const removeBtn = document.createElement('button')
            removeBtn.className = 'btn btn-sm btn-outline-danger border-0'
            removeBtn.innerHTML = '<i class="bi bi-person-x"></i>'
            removeBtn.title = 'Remove member'
            removeBtn.onclick = () => handleKickUser(member)
            item.appendChild(removeBtn)
          }

          memberListContainer.appendChild(item)
        })
      }

      const handleKickUser = async (member) => {
        const user = member.expand.user_id
        const userName = user.name || user.username
        if (!confirm(`Are you sure you want to remove ${userName} from the room? This will rotate all cryptographic keys.`)) {
          return
        }

        $bus.emit('ui:trigger_kick_user', {
          kickedMemberId: member.id,
          kickedUserId: user.id,
          kickedUsername: userName,
          room_id: $state.activeSelectionId
        })
      }

      // Initial fetch
      fetchMembers()

      // Listen for global kick events (we'll handle the logic here)
      $bus.on('ui:trigger_kick_user', async (data) => {
        const { kickedMemberId, kickedUsername, room_id } = data
  
        try {
          showLoading(`Rotating keys and removing ${kickedUsername}...`)
  
          const currentUser = $state.currentUser

          // identify survivors & generate new key
          const allMembers = await pb.collection('room_members').getFullList({
            filter: pb.filter('room_id = {:room_id}', { room_id }),
            expand: 'user_id'
          })

          const survivors = allMembers.filter(m => m.id !== kickedMemberId)
          const newEpochKey = await $worker.execute('worker:randombytes_buf', { length: 32 })

          // wrap the new key for survivors
          const wrapPromises = survivors.map(async (survivor) => {
            const user = survivor.expand.user_id
            const nonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
            const encryptedKey = await $worker.execute('worker:crypto_box_easy', {
              message: newEpochKey,
              nonce,
              publicKey: user.public_box_key,
              privateKey: currentUser.private_box_key
            })

            return pb.collection('room_members').update(survivor.id, {
              wrapped_by: currentUser.id,
              encrypted_room_key: $crypto.toBase64(encryptedKey),
              key_nonce: $crypto.toBase64(nonce)
            })
          })

          // update all survivors and delete the kicked user
          await Promise.all([
            ...wrapPromises,
            pb.collection('room_members').delete(kickedMemberId)
          ])

          // update the local cache
          const localRoom = await $storage.getRoom(room_id)
          const nextEpochId = (localRoom.key_history || []).length + 1
  
          if (!localRoom.key_history) {
            localRoom.key_history = []
          }
  
          localRoom.key_history.push({
            epoch_id: nextEpochId,
            key: $crypto.toBase64(newEpochKey)
          })
  
          await $storage.saveRoom(localRoom)

          // send a system message
          const systemContent = `${kickedUsername} was removed from the chat.`
          const plaintextObj = JSON.stringify({
            type: 'system',
            content: systemContent,
            timestamp: Date.now()
          })

          const msgNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
          const ciphertext = await $worker.execute('worker:crypto_secretbox_easy', {
            message: plaintextObj,
            nonce: msgNonce,
            key: newEpochKey
          })
  
          const ciphertextB64 = $crypto.toBase64(ciphertext)
          const validationString = `${room_id}|${nextEpochId}|${localRoom.last_msg_id || ''}|${ciphertextB64}`
  
          const signature = await $worker.execute('worker:crypto_sign_detached', {
            message: validationString,
            privateKey: currentUser.private_sign_key
          })

          await pb.collection('messages').create({
            room_id: room_id,
            sender_id: currentUser.id,
            epoch_id: nextEpochId,
            previous_msg_uuid: localRoom.last_msg_id || '',
            payload: ciphertextB64,
            nonce: $crypto.toBase64(msgNonce),
            signature: $crypto.toBase64(signature)
          })

          // Refresh the member list UI
          await fetchMembers()
  
          // Notify the app of new local data to refresh timeline if needed
          $bus.emit('db:new_local_data', { room_id: room_id })
  
        } catch (err) {
          console.error('[room-details-sidebar] Kick flow failed:', err)
          alert('Failed to remove user: ' + (err.message || 'Unknown error'))
        } finally {
          hideLoading()
        }
      })

      refs('btnClose').onclick = () => {
        $bus.emit('ui:close_room_details')
      }

      // Re-fetch when room changes
      $state.subscribe('activeSelectionId', () => {
        fetchMembers()
      })

      // Listen for member updates
      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          fetchMembers()
        }
      })
    }
  })
</script>
