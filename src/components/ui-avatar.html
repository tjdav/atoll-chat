<template id="ui-avatar">
  <div ref="container" class="avatar-container d-flex align-items-center justify-content-center overflow-hidden rounded-circle w-100 h-100">
    <span class="avatar-initials" style="display: {{ initialsDisplay }}; font-size: {{ fontSize }}px;">{{ initials }}</span>
    <img ref="img" class="avatar-img w-100 h-100 object-fit-cover" style="display: {{ imgDisplay }};" />
  </div>
</template>

<style>
  :host {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
  }

  .avatar-container {
    background-color: var(--bs-primary);
    color: var(--bs-white);
    font-weight: var(--bs-font-weight-bold);
    width: 100%;
    height: 100%;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      name: String,
      url: String,
      mediaId: String,
      mediaKey: String,
      mediaNonce: String,
      size: {
        type: Number,
        default: 40
      }
    },
    server: () => ({
      hasImage: false,
      initials: '?'
    }),
    getters: {
      fontSize: (state) => state.size * 0.4,
      initialsDisplay: (state) => (state.hasImage ? 'none' : 'block'),
      imgDisplay: (state) => (state.hasImage ? 'block' : 'none')
    },
    client: ({ state, refs, utils, signal, root, observe }) => {
      const { $media } = utils
      const img = refs('img')

      const updateSize = () => {
        root.style.setProperty('display', 'flex', 'important')
        root.style.setProperty('width', `${state.size}px`, 'important')
        root.style.setProperty('height', `${state.size}px`, 'important')
        root.style.setProperty('min-width', `${state.size}px`, 'important')
        root.style.setProperty('min-height', `${state.size}px`, 'important')
        root.style.setProperty('flex-shrink', '0', 'important')
      }

      const updateInitials = () => {
        if (!state.name) {
          state.initials = '?'
          return
        }
        state.initials = state.name
          .split(' ')
          .map(n => n[0])
          .join('')
          .toUpperCase()
          .slice(0, 2)
      }

      const loadAvatar = async () => {
        state.hasImage = false
        if (img) {
          img.src = ''
        }

        if (state.url) {
          if (img) {
            img.onload = () => {
              state.hasImage = true
            }
            img.onerror = () => {
              state.hasImage = false
            }
            img.src = state.url
          }
          return
        }

        if (!state.mediaId || !state.mediaKey || !state.mediaNonce) {
          return
        }

        try {
          const asset = {
            media_id: state.mediaId,
            file_key: state.mediaKey,
            file_nonce: state.mediaNonce,
            mime_type: 'image/jpeg',
            id: state.mediaId
          }

          const url = await $media.decrypt(asset, signal)
          if (img) {
            img.onload = () => {
              state.hasImage = true
            }
            img.onerror = () => {
              state.hasImage = false
            }
            img.src = url
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('[ui-avatar] Failed to load avatar:', err)
          }
          state.hasImage = false
        }
      }

      updateSize()
      updateInitials()
      loadAvatar()

      observe('size', updateSize)
      observe('name', updateInitials)
      observe('url', loadAvatar)
      observe('mediaId', loadAvatar)
      observe('mediaKey', loadAvatar)
      observe('mediaNonce', loadAvatar)
    }
  })
</script>
