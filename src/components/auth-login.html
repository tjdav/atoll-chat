<template id="auth-login">
  <div class="auth-login-container">
    <form id="{{ ref_loginForm }}" ref="loginForm" class="auth-form">
      <h3 class="mb-4 text-center">Login</h3>
      <div class="form-group mb-3">
        <label for="{{ ref_username }}">Username or Email</label>
        <input id="{{ ref_username }}" ref="username" type="text" class="form-control" placeholder="Enter username or email" required>
      </div>
      <div class="form-group mb-3">
        <label for="{{ ref_password }}">Password</label>
        <input id="{{ ref_password }}" ref="password" type="password" class="form-control" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
      <small>Don't have an account? <a id="{{ ref_linkRegister }}" href="#" ref="linkRegister">Register here</a></small>
    </div>
    <div id="{{ ref_statusMsg }}" ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
  </div>
</template>

<style>
  .auth-login-container {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2.5rem;
    border: 1px solid #dee2e6;
    border-radius: 0.75rem;
    background-color: #ffffff;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, pocketbase, globalStore, eventBus, realtimeSync, localDb, cryptoWorker }) => {
      const { pb } = pocketbase
      const { $localDb } = localDb
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const loginForm = refs('loginForm')
      const linkRegister = refs('linkRegister')
      const usernameInput = refs('username')
      const passwordInput = refs('password')
      const statusMsg = refs('statusMsg')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const identity = usernameInput.value
        const password = passwordInput.value

        try {
          updateStatus('Logging in...')

          // Perform PocketBase authentication
          await pb.collection('users').authWithPassword(identity, password)

          // Persist PB config for Service Worker access
          const db = $localDb
          await db.local_config.bulkPut([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Login successful! Unlocking vault...')

          // Attempt to unlock the vault automatically with the password
          try {
            const record = pb.authStore.model
            const { pin_salt: pinSaltBase64, encrypted_master_keys: encryptedMasterKeys } = record

            if (encryptedMasterKeys && pinSaltBase64) {
              const [{ default: sodium }, { deriveKeyFromPin, decryptVault }] = await Promise.all([
                import('libsodium-wrappers-sumo'),
                import('../utils/cryptoUtils.js')
              ])
              await sodium.ready

              const pinSalt = sodium.from_base64(pinSaltBase64, sodium.base64_variants.ORIGINAL)
              const KEK = await deriveKeyFromPin(password, pinSalt, sodium)

              const decryptedKeys = decryptVault(
                encryptedMasterKeys.ciphertext,
                encryptedMasterKeys.nonce,
                KEK,
                sodium
              )

              // Initialize worker with decrypted keys
              const { $worker } = cryptoWorker
              await $worker.execute('INIT_KEYS', decryptedKeys)

              // Start real-time subscriptions
              await $sync.startSubscriptions()

              // Emit successful unlock event
              $bus.emit('auth:unlocked', {
                keys: decryptedKeys,
                userRecord: record
              })

              $state.isVaultUnlocked = true
            }
          } catch (unlockErr) {
            console.warn('Auto-unlock failed (might be a legacy PIN-based vault):', unlockErr)
            // We don't block login if auto-unlock fails, app-root will show the manual unlock screen
          }

          $state.isAuthenticated = true

        } catch (error) {
          console.error('Login error:', error)
          let errorMessage = 'Login failed'

          if (error.status === 404) {
            errorMessage = 'User not found'
          } else if (error.message) {
            errorMessage = error.message
          }

          updateStatus(errorMessage)
        }
      })
    }
  })
</script>
