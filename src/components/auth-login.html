<template id="auth-login">
  <div class="card shadow">
    <div class="card-body p-4">
      <h3 class="card-title mb-4 text-center">Login</h3>
      
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <form ref="loginForm" class="needs-validation" novalidate>
        <div ref="emailSection">
          <div class="mb-3">
            <label for="{{ ref_email }}" class="form-label">Email Address</label>
            <input ref="email" name="email" id="{{ ref_email }}" type="email" class="form-control" placeholder="Enter email" required autocomplete="email" data-testid="username">
            <div class="invalid-feedback" data-testid="email-feedback"></div>
          </div>
          <div class="mb-3 d-flex justify-content-center" ref="altchaContainer"></div>
          <button type="submit" class="btn btn-primary w-100" ref="loginSubmit" data-testid="loginSubmit">Send Magic Link</button>
        </div>
      </form>

      <form ref="otpForm" class="d-none mt-3 needs-validation" novalidate>
        <p class="text-muted small text-center mb-3">We sent a Magic Link to your email. Click it to log in, or enter the 8-digit code manually below:</p>
        <div class="mb-3">
          <label for="{{ ref_otpCode }}" class="form-label">8-digit Verification Code</label>
          <input ref="otpCode" name="otpCode" type="text" class="form-control text-center fs-4" placeholder="00000000" maxlength="8" pattern="\d{8}" required>
          <div class="invalid-feedback" data-testid="otp-feedback"></div>
        </div>
        <button type="submit" class="btn btn-success w-100 mb-2" ref="btnSubmitOtp">Verify & Log In</button>
        <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none" ref="btnBackToEmail">Change Email</button>
      </form>

      <div class="mt-3 text-center" ref="registerLinkContainer">
        <small class="text-muted">Don't have an account? <a href="#" ref="linkRegister" data-testid="linkRegister" class="text-decoration-none">Register here</a></small>
      </div>
      <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>

      <!-- Island Switcher Dropdown (visible if Islands mode is active) -->
      <div class="mt-4 border-top pt-3 text-center" ref="islandSwitcherContainer" data-testid="islandSwitcherContainer" hidden>
        <div class="dropdown">
          <button class="btn btn-link btn-sm text-secondary text-decoration-none dropdown-toggle d-inline-flex align-items-center gap-1"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  ref="islandSelectBtn"
                  data-testid="islandSelectBtn">
            <span ref="currentIslandLabel">Current Island: Loading...</span>
          </button>
          <ul class="dropdown-menu shadow dropdown-menu-dark p-0 overflow-hidden" style="min-width: 240px;" ref="islandsDropdownMenu" data-testid="islandsDropdownMenu">
            <li class="dropdown-header px-3 py-2">Your Islands</li>
            <div ref="islandsList" data-testid="islandsList"></div>
            <li><hr class="dropdown-divider m-0"></li>
            <li>
              <button class="dropdown-item d-flex align-items-center gap-2 py-2 px-3" ref="btnChartNewIsland" data-testid="btnChartNewIsland">
                <i class="bi bi-compass"></i>
                <span>Chart New Island</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, config, bootstrap, cryptoWorker, eventBus }) => {
      const { pb } = pocketbase
      const { $storage } = storage
      const { $state } = globalStore
      const { $config } = config
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { Dropdown } = await bootstrap

      const loginForm = refs('loginForm')
      const btnSubmitOtp = refs('btnSubmitOtp')
      const otpForm = refs('otpForm')
      const altchaContainer = refs('altchaContainer')
      const linkRegister = refs('linkRegister')
      const emailInput = refs('email')
      const otpCodeInput = refs('otpCode')
      const btnBackToEmail = refs('btnBackToEmail')
      const statusMsg = refs('statusMsg')
      const globalAlert = refs('globalAlert')

      const emailSection = refs('emailSection')
      const registerLinkContainer = refs('registerLinkContainer')

      const islandSwitcherContainer = refs('islandSwitcherContainer')
      const islandSelectBtn = refs('islandSelectBtn')
      const currentIslandLabel = refs('currentIslandLabel')
      const islandsListContainer = refs('islandsList')
      const btnChartNewIsland = refs('btnChartNewIsland')

      let currentOtpId = null
      let dropdownInstance = null

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        let sibling = input.nextElementSibling
        while (sibling) {
          if (sibling.classList.contains('invalid-feedback')) {
            return sibling
          }
          sibling = sibling.nextElementSibling
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target
          if (input.setCustomValidity) {
            input.setCustomValidity('')
          }
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage
          }
        })
      }

      registerInputReset(loginForm)
      registerInputReset(otpForm)

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      let altchaWidget = null
      if (altchaContainer) {
        const isTesting = typeof window !== 'undefined' && window.__coralite__?.mode === 'testing'
        altchaWidget = document.createElement('altcha-widget')
        altchaWidget.setAttribute('display', 'floating')
        altchaWidget.setAttribute('floating', 'bottom')
        altchaWidget.style.width = '100%'
        altchaWidget.style.maxWidth = '100%'
  
        const configObj = {}
        if (isTesting) {
          altchaWidget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          altchaWidget.setAttribute('challenge', pb.buildURL('/api/altcha/challenge'))
          configObj.challenge = pb.buildURL('/api/altcha/challenge')
        }
        altchaWidget.setAttribute('configuration', JSON.stringify(configObj))

        altchaContainer.appendChild(altchaWidget)
      }

      const isIslandsEnabled = $config?.get('enableWorkspaces') || window.__coralite_workspaces_override__ || false
  
      const handleSwitchIsland = async (newId, force = false) => {
        if (pb.authStore.activeWorkspaceId === newId && !force) {
          return
        }

        $state.activeSelectionId = null
        $state.activeSelectionType = null

        pb.authStore.setActiveWorkspace(newId)
        const active = pb.authStore.workspaces.find(w => w.id === newId)
        pb.baseUrl = active ? active.url : ''

        const contextRes = await $worker.execute('worker:set_workspace_context', {
          workspaceId: newId,
          baseUrl: pb.baseUrl
        })

        await $storage.initialize('AtollChatDB_' + newId)

        $state.isAuthenticated = pb.authStore.isValid
        $state.currentUser = pb.authStore.model

        if ($state.isAuthenticated) {
          if (contextRes.isInitialized) {
            $state.isVaultUnlocked = true
            $bus.emit('auth:unlocked', {
              keys: {
                private_box_key: contextRes.private_box_key,
                private_sign_key: contextRes.private_sign_key
              },
              userRecord: pb.authStore.model
            })
            $bus.emit('sync:complete')
          } else {
            $state.isVaultUnlocked = false
          }
        } else {
          $state.isVaultUnlocked = false
          $state.authView = 'login'
        }

        $state.activeIslandId = newId
        $state.islands = pb.authStore.workspaces || []

        renderIslandsDropdownList()

        $bus.emit('ui:show_toast', {
          message: `Switched to Island: ${active ? active.name : 'Island'}`,
          type: 'success'
        })
      }

      const renderIslandsDropdownList = () => {
        if (!islandsListContainer) {
          return
        }
        islandsListContainer.innerHTML = ''
        if (!isIslandsEnabled) {
          return
        }

        const activeId = pb.authStore.activeWorkspaceId
        const list = pb.authStore.workspaces || []
        const active = list.find(w => w.id === activeId)
  
        currentIslandLabel.textContent = `Current Island: ${active ? active.name : 'Unknown'}`

        list.forEach(w => {
          const isActive = w.id === activeId
          const initials = w.name ? w.name.slice(0, 2).toUpperCase() : 'IS'

          const li = document.createElement('li')
          const btn = document.createElement('button')
          btn.className = `dropdown-item d-flex align-items-center justify-content-between gap-3 py-2 px-3 ${isActive ? 'active' : ''}`
          btn.setAttribute('data-id', w.id)
          btn.setAttribute('data-testid', `workspace-btn-${w.id}`)
          if (isActive) {
            btn.style.fontWeight = 'bold'
          }

          const leftContainer = document.createElement('div')
          leftContainer.className = 'd-flex align-items-center gap-2'

          const badge = document.createElement('div')
          badge.className = 'rounded-circle d-flex align-items-center justify-content-center text-white font-weight-bold'
          badge.style.width = '24px'
          badge.style.height = '24px'
          badge.style.fontSize = '10px'
          badge.style.backgroundColor = isActive ? 'var(--bs-primary)' : 'var(--bs-secondary)'
          badge.textContent = initials

          const nameSpan = document.createElement('span')
          nameSpan.textContent = w.name || 'Island'

          leftContainer.appendChild(badge)
          leftContainer.appendChild(nameSpan)
          btn.appendChild(leftContainer)

          if (isActive) {
            const check = document.createElement('i')
            check.className = 'bi bi-check-lg'
            btn.appendChild(check)
          }

          btn.addEventListener('click', async (e) => {
            e.stopPropagation()
            if (dropdownInstance) {
              dropdownInstance.hide()
            }
            await handleSwitchIsland(w.id)
          })

          li.appendChild(btn)
          islandsListContainer.appendChild(li)
        })
      }

      if (isIslandsEnabled) {
        islandSwitcherContainer.removeAttribute('hidden')
        if (islandSelectBtn) {
          dropdownInstance = new Dropdown(islandSelectBtn)
        }
        renderIslandsDropdownList()

        if (btnChartNewIsland) {
          btnChartNewIsland.addEventListener('click', () => {
            if (dropdownInstance) {
              dropdownInstance.hide()
            }
            $bus.emit('ui:open_chart_island_modal')
          })
        }
  
        $state.subscribe('activeIslandId', () => {
          renderIslandsDropdownList()
        })
      }

      btnBackToEmail.addEventListener('click', () => {
        emailSection.classList.remove('d-none')
        otpForm.classList.add('d-none')
        registerLinkContainer.classList.remove('d-none')
        updateStatus('')
        showGlobalAlert('')
        loginForm.classList.remove('was-validated')
        otpForm.classList.remove('was-validated')
        emailInput.setCustomValidity('')
        otpCodeInput.setCustomValidity('')
      })

      const handleSuccessfulLogin = async () => {
        await $storage.saveConfigs([
          {
            key: 'pb_url',
            value: pb.baseUrl
          },
          {
            key: 'pb_token',
            value: pb.authStore.token
          }
        ])

        updateStatus('Login successful! Checking vault...')

        /*
           We won't auto-unlock because we use the new double-wrapped vault flow.
           Instead, we set isAuthenticated = true.
           app-root.html will check if user.public_box_key exists.
           If yes, it mounts vault-unlock. If not, it mounts vault-setup.
        */
        $state.isAuthenticated = true
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(loginForm)

        if (!loginForm.checkValidity()) {
          event.stopPropagation()
          loginForm.classList.add('was-validated')
          return
        }

        const email = emailInput.value
        const isTesting = typeof window !== 'undefined' && window.__coralite__?.mode === 'testing'
        let altchaPayload = altchaWidget ? altchaWidget.value : null
        if (isTesting) {
          altchaPayload = 'atoll-mock-bypass-token'
        }

        if (!altchaPayload) {
          emailInput.setCustomValidity('Please complete the security challenge')
          updateValidationFeedback(loginForm)
          loginForm.classList.add('was-validated')
          return
        }

        try {
          loginForm.classList.remove('was-validated')
          updateStatus('Sending Magic Link...')
          const result = await pb.collection('users').requestOTP(email, {
            body: {
              email,
              altcha: altchaPayload
            }
          })
          currentOtpId = result.otpId

          emailSection.classList.add('d-none')
          otpForm.classList.remove('d-none')
          registerLinkContainer.classList.add('d-none')
  
          updateStatus('Magic Link sent!')
        } catch (error) {
          console.error('Request OTP error:', error)
          if (error.status && error.status >= 500) {
            showGlobalAlert(error.message || 'Server error. Please try again.')
          } else {
            emailInput.setCustomValidity(error.message || 'Failed to send Magic Link')
            updateValidationFeedback(loginForm)
            loginForm.classList.add('was-validated')
          }
          if (altchaWidget && typeof altchaWidget.reset === 'function') {
            altchaWidget.reset()
          }
        }
      })

      otpForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(otpForm)

        if (!otpForm.checkValidity()) {
          event.stopPropagation()
          otpForm.classList.add('was-validated')
          return
        }

        const code = otpCodeInput.value
        try {
          otpForm.classList.remove('was-validated')
          updateStatus('Verifying code...')
          const authData = await pb.collection('users').authWithOTP(currentOtpId, code)
          await handleSuccessfulLogin(authData)
        } catch (error) {
          console.error('OTP login error:', error)
          if (error.status && error.status >= 500) {
            showGlobalAlert(error.message || 'Server error. Please try again.')
          } else {
            otpCodeInput.setCustomValidity(error.message || 'Verification failed')
            updateValidationFeedback(otpForm)
            otpForm.classList.add('was-validated')
          }
        }
      })
    }
  })
</script>
