<template id="auth-login">
  <div class="auth-login-container">
    <form ref="loginForm" class="auth-form">
      <h3>Login</h3>
      <div class="form-group mb-3">
        <label for="username">Username</label>
        <input ref="username" id="username" type="text" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password</label>
        <input ref="password" id="password" type="password" class="form-control" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
      <small>Don't have an account? <a href="#" ref="linkRegister">Register here</a></small>
    </div>
    <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
  </div>
</template>

<style>
  .auth-login-container {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid #dee2e6;
    border-radius: 0.5rem;
    background-color: #f8f9fa;
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    script: ({ refs, pocketbase, globalStore }) => {
      const { pb } = pocketbase
      const { $state } = globalStore
      const loginForm = refs('loginForm')
      const linkRegister = refs('linkRegister')
      const usernameInput = refs('username')
      const passwordInput = refs('password')
      const statusMsg = refs('statusMsg')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const username = usernameInput.value
        const password = passwordInput.value

        try {
          updateStatus('Logging in...')

          // Perform PocketBase authentication
          await pb.collection('users').authWithPassword(username, password)

          // Persist PB config for Service Worker access
          const db = await $localDb()
          await db.local_config.bulkPut([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Login successful!')

          // Notify the application that authentication was successful.
          // app-root will handle showing vault-unlock or vault-setup.
          $state.isAuthenticated = true

        } catch (error) {
          console.error('Login error:', error)
          let errorMessage = 'Login failed'

          if (error.status === 404) {
            errorMessage = 'User not found'
          } else if (error.message) {
            errorMessage = error.message
          }

          updateStatus(errorMessage)
        }
      })
    }
  })
</script>
