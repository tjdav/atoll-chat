<template id="auth-login">
  <div class="card shadow">
    <div class="card-body p-4">
      <h3 class="card-title mb-4 text-center">Login</h3>
      <form ref="loginForm">
        <div class="mb-3">
          <label for="{{ ref_username }}" class="form-label">Username or Email</label>
          <input ref="username" name="username" type="text" class="form-control" placeholder="Enter username or email" required>
        </div>
        <div class="mb-3">
          <label for="{{ ref_password }}" class="form-label">Password</label>
          <input ref="password" name="password" type="password" class="form-control" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="mt-3 text-center">
        <small class="text-muted">Don't have an account? <a href="#" ref="linkRegister" class="text-decoration-none">Register here</a></small>
      </div>
      <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, pocketbase, globalStore, eventBus, realtimeSync, localDb, cryptoWorker }) => {
      const { pb } = pocketbase
      const { $localDb } = localDb
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const loginForm = refs('loginForm')
      const linkRegister = refs('linkRegister')
      const usernameInput = refs('username')
      const passwordInput = refs('password')
      const statusMsg = refs('statusMsg')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        const identity = usernameInput.value
        const password = passwordInput.value

        try {
          updateStatus('Logging in...')

          // Perform PocketBase authentication
          await pb.collection('users').authWithPassword(identity, password)

          // Persist PB config for Service Worker access
          const db = $localDb
          await db.local_config.bulkPut([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Login successful! Unlocking vault...')

          // Attempt to unlock the vault automatically with the password
          try {
            const record = pb.authStore.model
            const { pin_salt: pinSaltBase64, encrypted_master_keys: encryptedMasterKeys } = record

            if (encryptedMasterKeys && pinSaltBase64) {
              const [{ default: sodium }, { deriveKeyFromPin, decryptVault }] = await Promise.all([
                import('libsodium-wrappers-sumo'),
                import('../utils/cryptoUtils.js')
              ])
              await sodium.ready

              const pinSalt = sodium.from_base64(pinSaltBase64, sodium.base64_variants.ORIGINAL)
              const KEK = await deriveKeyFromPin(password, pinSalt, sodium)

              const decryptedKeys = decryptVault(
                encryptedMasterKeys.ciphertext,
                encryptedMasterKeys.nonce,
                KEK,
                sodium
              )

              // Initialize worker with decrypted keys and token
              const { $worker } = cryptoWorker
              await $worker.execute('SET_TOKEN', { token: pb.authStore.token })
              await $worker.execute('INIT_KEYS', {
                ...decryptedKeys,
                id: record.id
              })

              // Start real-time subscriptions
              await $sync.startSubscriptions()

              // Emit successful unlock event
              $bus.emit('auth:unlocked', {
                keys: decryptedKeys,
                userRecord: record
              })

              $state.isVaultUnlocked = true
            }
          } catch (unlockErr) {
            if (!unlockErr.message?.includes('wrong secret key')) {
              console.warn('Auto-unlock failed:', unlockErr)
            }
          }

          $state.isAuthenticated = true

        } catch (error) {
          console.error('Login error:', error)
          let errorMessage = 'Login failed'

          if (error.status === 404) {
            errorMessage = 'User not found'
          } else if (error.message) {
            errorMessage = error.message
          }

          updateStatus(errorMessage)
        }
      })
    }
  })
</script>
