<template id="document-list">
  <div class="document-list h-100 overflow-y-auto" ref="scrollRoot">
    <div ref="listContainer" data-testid="document-list-group">
      <!-- Documents will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ state, storage, eventBus, globalStore, refs, utils, fuse }) => {
      const { groupItemsByRoom } = await import('../../utils/room-grouping.js')
      const { resolveRoomName } = await import('../../utils/room-name.js')
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listContainer = refs('listContainer')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'documents',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const rawItems = await $storage.getAssetsByCategory('document', lastItem?.item || lastItem, BATCH_SIZE)
          const items = await Promise.all(rawItems.map(async (asset) => {
            const room = await $storage.getRoom(asset.room_id)
            const roomName = resolveRoomName(room, { currentUser: $state.currentUser })
            const searchContent = `${asset.filename || ''} ${roomName}`.toLowerCase()
            return {
              id: asset.id,
              item: asset,
              roomId: asset.room_id,
              room,
              roomName,
              createdAt: asset.created_at,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listContainer.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No documents found'}</div>`
            return
          }

          const grouped = groupItemsByRoom(itemsToDisplay)
          const fragment = document.createDocumentFragment()

          for (const group of grouped) {
            const groupSection = document.createElement('div')
            groupSection.className = 'media-room-group mb-3'

            const header = document.createElement('media-room-header')
            header.setAttribute('room-id', group.roomId)
            header.setAttribute('room-name', group.roomName)
            header.setAttribute('item-count', group.items.length)
            groupSection.appendChild(header)

            const listEl = document.createElement('atoll-list')
            listEl.setAttribute('divided', 'true')

            group.items.forEach(({ item, roomName, timestamp }) => {
              const isActive = item.id === $state.activeSelectionId && $state.activeSelectionType === 'documents'
              const filename = item.filename || 'Unnamed File'

              const listItem = document.createElement('atoll-list-item')
              listItem.setAttribute('title', filename)
              listItem.setAttribute('description', `${roomName} • ${timestamp}`)
              listItem.setAttribute('selected', isActive.toString())
              listItem.setAttribute('clickable', 'true')
              listItem.setAttribute('size', 'md')

              // Create circular avatar/profile slot using optional palette attribute and explicit projection binding
              const profile = document.createElement('atoll-profile')
              profile.setAttribute('slot', 'leading')
              profile.setAttribute('size', 'md')
              profile.setAttribute('palette', 'true')
              profile.setAttribute('name', filename)
              profile.setAttribute('has-projected-image', 'true')

              const iconContainer = document.createElement('div')
              iconContainer.setAttribute('slot', 'image')
              iconContainer.className = 'w-100 h-100 d-flex align-items-center justify-content-center'

              const icon = document.createElement('atoll-icon')
              icon.setAttribute('name', 'document')
              icon.setAttribute('size', '24')
              icon.setAttribute('color', '#FFFFFF')

              iconContainer.appendChild(icon)
              profile.appendChild(iconContainer)
              listItem.appendChild(profile)

              listItem.setAttribute('chevron', 'true')

              listItem.addEventListener('atoll-item-click', () => {
                $state.activeSelectionId = item.id
                $state.activeSelectionType = 'documents'
                $bus.emit('ui:selection_made')
                debouncedRender()
              })

              listEl.appendChild(listItem)
            })

            groupSection.appendChild(listEl)
            fragment.appendChild(groupSection)
          }

          listContainer.innerHTML = ''
          listContainer.appendChild(fragment)
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'documents') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', (payload) => {
        const msg = payload?.message
        const isMediaMime = (mime) => mime?.startsWith('image/') || mime?.startsWith('video/') || mime?.startsWith('audio/')
        const hasDocMime = msg?.mime_type && !isMediaMime(msg.mime_type)
        const hasDocAttachment = msg?.attachments?.some(a => a.mime_type && !isMediaMime(a.mime_type))
        const isDocType = msg?.type === 'file' || msg?.type === 'document' || payload?.type === 'file' || payload?.type === 'document'
        if (hasDocMime || hasDocAttachment || isDocType) {
          manager.reset()
          debouncedRender()
        }
      })

      debouncedRender()
    }
  })
</script>
