<template id="music-list-item">
  <atoll-list-item
    ref="container"
    title="{{ filename }}"
    description="{{ descriptionText }}"
    selected="{{ isSelected }}"
    clickable
    size="md"
  >
    <!-- Circular Profile icon inside leading/left slot using optional palette attribute -->
    <atoll-profile slot="leading" size="md" palette="true" name="{{ filename }}" has-projected-image="true">
      <div slot="image" class="w-100 h-100 d-flex align-items-center justify-content-center">
        <atoll-icon name="music" size="24" color="#FFFFFF"></atoll-icon>
      </div>
    </atoll-profile>

    <!-- Custom Right Action (bi-play-circle matched standard) -->
    <div slot="right" class="d-flex align-items-center">
      <atoll-icon name="more" size="20" color="var(--atoll-text-secondary, #777777)"></atoll-icon>
    </div>
  </atoll-list-item>
</template>

<style>
  :host {
    display: block;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      assetId: String,
      filename: String,
      roomName: String,
      timestamp: String,
      isActive: String
    },
    getters: {
      isSelected: (state) => (state.isActive === 'true' || state.isActive === true),
      descriptionText: (state) => `${state.roomName} • ${state.timestamp}`
    },
    client: ({ refs, state, eventBus, signal }) => {
      const { $bus } = eventBus
      const container = refs('container')

      container.addEventListener('atoll-item-click', () => {
        $bus.emit('media:select', {
          assetId: state.assetId,
          type: 'music'
        })
        $bus.emit('ui:selection_made')
      }, { signal })
    }
  })
</script>
