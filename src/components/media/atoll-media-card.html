<template id="atoll-media-card">
  <div ref="card" class="atoll-media-card {{ aspectClass }} {{ selectedClass }}" tabindex="0" role="button" aria-pressed="{{ selected }}">
    
    <!-- Image Preview Area -->
    <div ref="mediaContainer" class="w-100 h-100 d-flex align-items-center justify-content-center overflow-hidden position-relative">
      <div ref="placeholder" class="w-100 h-100 d-flex align-items-center justify-content-center bg-body-secondary text-body-secondary opacity-50">
        <atoll-icon name="{{ placeholderIcon }}" size="40"></atoll-icon>
      </div>
    </div>

  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      src: String,
      title: String,
      subtitle: String,
      mediaType: {
        type: String,
        // image, album, video, gif
        default: 'image'
      },
      selected: {
        type: String,
        default: 'false'
      },
      aspectRatio: {
        type: String,
        // square, rectangular
        default: 'square'
      },
      assetId: String,
      mediaId: String,
      mimeType: String,
      type: String,
      fileKey: String,
      fileNonce: String
    },
    getters: {
      aspectClass: (state) => `aspect-${state.aspectRatio || 'square'}`,
      selectedClass: (state) => (state.selected === 'true' || state.selected === true ? 'selected' : ''),
      placeholderIcon: (state) => {
        if (state.mediaType === 'video') {
          return 'videocam'
        }
        return 'gallery'
      }
    },
    client: ({ refs, state, storage, eventBus, signal, utils, observe }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $media } = utils
      const card = refs('card')
      const mediaContainer = refs('mediaContainer')
      const placeholder = refs('placeholder')

      const objectUrls = new Map()
      const cleanupUrls = () => {
        objectUrls.clear()
      }
      signal.addEventListener('abort', cleanupUrls)

      // Handle selection click / key down
      const triggerSelect = () => {
        // Dispatch the custom event atoll-media-select
        const customEvent = new CustomEvent('atoll-media-select', {
          bubbles: true,
          composed: true,
          detail: {
            id: state.assetId,
            mediaId: state.mediaId,
            src: state.src,
            title: state.title,
            subtitle: state.subtitle,
            mediaType: state.mediaType
          }
        })
        card.dispatchEvent(customEvent)

        // For backward compatibility and immediate router sync
        if (state.assetId && state.type) {
          $bus.emit('media:select', {
            assetId: state.assetId,
            type: state.type
          })
          $bus.emit('ui:selection_made')
        }
      }

      card.onclick = (e) => {
        e.preventDefault()
        triggerSelect()
      }

      card.onkeydown = (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault()
          triggerSelect()
        }
      }

      const renderPreview = async () => {
        if (state.src) {
          // If a static src URL is provided, display it directly
          if (placeholder) {
            placeholder.classList.add('d-none')
          }
          const img = document.createElement('img')
          img.src = state.src
          img.className = 'w-100 h-100'
          img.style.objectFit = 'cover'
          mediaContainer.innerHTML = ''
          mediaContainer.appendChild(img)
          return
        }

        if (!state.mediaId || !state.fileKey || !state.fileNonce || !mediaContainer) {
          return
        }

        try {
          const isVideoType = state.mediaType === 'video' || (state.mimeType || '').startsWith('video/')
          const asset = await $storage.getAsset(state.assetId)
          let objectUrl = null

          if (isVideoType) {
            if (asset?.thumbnail) {
              objectUrl = await $media.decrypt(asset.thumbnail, {
                isThumbnail: true,
                signal
              })
            } else {
              throw new Error('Video thumbnail missing')
            }
          } else {
            objectUrl = await $media.decrypt({
              media_id: state.mediaId,
              file_key: state.fileKey,
              file_nonce: state.fileNonce,
              mime_type: state.mimeType,
              id: state.assetId
            }, { signal })
          }

          if (signal.aborted) {
            return
          }

          objectUrls.set(state.assetId, objectUrl)

          if (placeholder) {
            placeholder.classList.add('d-none')
          }
          mediaContainer.innerHTML = ''
          const img = document.createElement('img')
          img.src = objectUrl
          img.className = 'w-100 h-100'
          img.style.objectFit = 'cover'
          mediaContainer.appendChild(img)
        } catch (err) {
          console.error('[atoll-media-card] Decryption & Preview error:', err)
        }
      }

      // Dynamic Overlay and Badge Management with Self-Healing DOM Cleanups
      let badgeElement = null
      let overlayElement = null

      const updateBadge = () => {
        if (card) {
          const existing = card.querySelectorAll('.atoll-media-badge')
          existing.forEach(el => el.remove())
        }
        badgeElement = null

        const mediaType = state.mediaType
        if (mediaType === 'album' || mediaType === 'video' || mediaType === 'gif') {
          badgeElement = document.createElement('div')
          badgeElement.className = 'atoll-media-badge'

          if (mediaType === 'album') {
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'copy')
            icon.setAttribute('size', '18')
            badgeElement.appendChild(icon)
          } else if (mediaType === 'video') {
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'videocam')
            icon.setAttribute('size', '18')
            badgeElement.appendChild(icon)
          } else if (mediaType === 'gif') {
            const span = document.createElement('span')
            span.className = 'gif-pill'
            span.textContent = 'GIF'
            badgeElement.appendChild(span)
          }

          if (card) {
            card.appendChild(badgeElement)
          }
        }
      }

      const updateOverlay = () => {
        if (card) {
          const existing = card.querySelectorAll('.atoll-media-overlay')
          existing.forEach(el => el.remove())
        }
        overlayElement = null

        const title = state.title
        const subtitle = state.subtitle

        if (title || subtitle) {
          overlayElement = document.createElement('div')
          overlayElement.className = 'atoll-media-overlay'

          if (title) {
            const titleEl = document.createElement('div')
            titleEl.className = 'atoll-media-title'
            titleEl.setAttribute('title', title)
            titleEl.textContent = title
            overlayElement.appendChild(titleEl)
          }

          if (subtitle) {
            const subtitleEl = document.createElement('div')
            subtitleEl.className = 'atoll-media-subtitle'
            subtitleEl.setAttribute('title', subtitle)
            subtitleEl.textContent = subtitle
            overlayElement.appendChild(subtitleEl)
          }

          if (card) {
            card.appendChild(overlayElement)
          }
        }
      }

      // Set up dynamic observers
      if (observe) {
        observe('mediaType', () => {
          updateBadge()
        })
        observe('title', () => {
          updateOverlay()
        })
        observe('subtitle', () => {
          updateOverlay()
        })
      }

      // Initial layout creation
      updateBadge()
      updateOverlay()
      renderPreview()
    }
  })
</script>
