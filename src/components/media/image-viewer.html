<template id="image-viewer">
  <div class="image-viewer-container d-flex flex-column h-100 bg-black position-relative w-100">
    <viewer-header 
      title="Image Details" 
      subtitle="{{ fileName }}" 
      icon="gallery" 
      theme="dark">
    </viewer-header>

    <atoll-slideshow ref="slideshow" class="flex-grow-1 overflow-hidden">
    </atoll-slideshow>

    <div class="alert alert-danger m-3 position-absolute top-0 start-0 end-0" hidden="{{ isErrorHidden }}" style="z-index: 1050;">
      {{ errorMessage }}
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      fileName: ''
    }),
    client: async ({ state, signal, refs, storage, globalStore, utils }) => {
      const { $storage } = storage
      const { $state } = globalStore
      const { $media } = utils
      const slideshow = refs('slideshow')

      let loadedItems = []
      let hasMore = true
      let lastTimestamp = null
      const BATCH_SIZE = 24
      let isInternalChange = false
      let initSequence = 0

      const BUFFER_SIZE = 3
      const CLEANUP_MARGIN = 2

      const manageBuffer = async (currentIndex) => {
        if (currentIndex === -1) {
          return
        }

        const container = slideshow.getContainer()
        if (!container) return

        const start = Math.max(0, currentIndex - BUFFER_SIZE)
        const end = Math.min(loadedItems.length - 1, currentIndex + BUFFER_SIZE)

        for (let i = start; i <= end; i++) {
          const item = loadedItems[i]
          const child = container.children[i]
          if (child) {
            decryptImage(item, child, i === currentIndex)
          }
        }

        const cleanupThreshold = BUFFER_SIZE + CLEANUP_MARGIN
        for (let i = 0; i < loadedItems.length; i++) {
          if (i < currentIndex - cleanupThreshold || i > currentIndex + cleanupThreshold) {
            const child = container.children[i]
            if (child) {
              const img = child.querySelector('img')
              if (img) {
                img.removeAttribute('src')
                img.classList.add('d-none')
              }
            }
          }
        }
      }

      const decryptImage = async (item, container, isImmediate = false) => {
        const img = container.querySelector('img')
        if (img && img.src) {
          return
        }

        const loader = container.querySelector('.spinner-border')
        if (loader && isImmediate) {
          loader.classList.remove('d-none')
        }

        try {
          const objectUrl = await $media.decrypt(item, signal)

          if (!signal.aborted) {
            if (img) {
              img.src = objectUrl
              img.classList.remove('d-none')
            }
            if (loader) {
              loader.classList.add('d-none')
            }
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[image-viewer] Decryption error:', err)
          if (loader) {
            loader.classList.add('d-none')
          }
        }
      }

      const createCarouselItem = (item, isActive) => {
        const carouselItem = document.createElement('div')
        carouselItem.className = `carousel-item atoll-slideshow-slide h-100 ${isActive ? 'active' : ''}`
        carouselItem.dataset.id = item.id

        const wrapper = document.createElement('div')
        wrapper.className = 'd-flex justify-content-center align-items-center h-100 overflow-hidden'

        const spinner = document.createElement('div')
        spinner.className = 'spinner-border text-primary d-none'
        spinner.setAttribute('role', 'status')

        const spinnerText = document.createElement('span')
        spinnerText.className = 'visually-hidden'
        spinnerText.textContent = 'Loading...'
        spinner.appendChild(spinnerText)
        wrapper.appendChild(spinner)

        const img = document.createElement('img')
        img.className = 'mw-100 mh-100 d-none'
        img.alt = item.filename || ''
        wrapper.appendChild(img)

        carouselItem.appendChild(wrapper)

        return carouselItem
      }

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return []
        }
        const rawItems = await $storage.getAssetsByCategory('image', lastTimestamp ? {
          created_at: lastTimestamp,
          id: loadedItems[loadedItems.length - 1]?.id
        } : null, BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          loadedItems = [...loadedItems, ...rawItems]
        }
        return rawItems
      }

      const renderBatch = (items, activeId) => {
        const container = slideshow.getContainer()
        if (!container) return
        items.forEach(item => {
          const isActive = item.id === activeId
          const el = createCarouselItem(item, isActive)
          container.appendChild(el)
          if (isActive) {
            state.fileName = item.filename || 'Untitled Image'
          }
        })
      }

      const initCarousel = async () => {
        const seq = ++initSequence
        const container = slideshow.getContainer()
        if (container) {
          container.innerHTML = ''
        }
        loadedItems = []
        lastTimestamp = null
        hasMore = true

        const activeId = $state.activeSelectionId
        const activeAsset = activeId ? await $storage.getAsset(activeId) : null
        if (seq !== initSequence) {
          return
        }
        const isValidActive = activeAsset && (activeAsset.mime_type || '').startsWith('image/')

        if (isValidActive) {
          while (!loadedItems.find(i => i.id === activeId) && hasMore) {
            await fetchNextBatch()
            if (seq !== initSequence) {
              return
            }
          }
        } else {
          await fetchNextBatch()
          if (seq !== initSequence) {
            return
          }
        }

        const actualActiveId = isValidActive ? activeId : (loadedItems[0]?.id || null)

        renderBatch(loadedItems, actualActiveId)

        const activeIndex = loadedItems.findIndex(i => i.id === actualActiveId)
        if (activeIndex !== -1) {
          slideshow.to(activeIndex, true)
          manageBuffer(activeIndex)
        }
      }

      slideshow.addEventListener('atoll-slideshow-select', (e) => {
        const index = e.detail.index
        const item = loadedItems[index]
        if (item) {
          isInternalChange = true
          $state.activeSelectionId = item.id
          state.fileName = item.filename || 'Untitled Image'
          isInternalChange = false

          const container = slideshow.getContainer()
          if (container) {
            Array.from(container.children).forEach((child, i) => {
              if (i === index) {
                child.classList.add('active')
              } else {
                child.classList.remove('active')
              }
            })
          }
        }
      }, { signal })

      slideshow.addEventListener('atoll-slideshow-settle', async (e) => {
        const index = e.detail.index
        manageBuffer(index)

        if (index >= loadedItems.length - 3 && hasMore) {
          const nextBatch = await fetchNextBatch()
          renderBatch(nextBatch, null)
        }
      }, { signal })

      $state.subscribe('activeSelectionId', (id) => {
        if (isInternalChange || $state.activeSelectionType !== 'pictures') {
          return
        }
        const index = loadedItems.findIndex(i => i.id === id)
        if (index !== -1) {
          slideshow.to(index)
        } else {
          initCarousel()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type === 'pictures') {
          initCarousel()
        }
      })

      if ($state.activeSelectionType === 'pictures') {
        initCarousel()
      }
    }
  })
</script>
