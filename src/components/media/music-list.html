<template id="music-list">
  <div class="music-list h-100 overflow-y-auto" ref="scrollRoot">
    <div ref="listContainer" data-testid="music-list-group">
      <!-- Music will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ state, storage, eventBus, globalStore, refs, utils, fuse }) => {
      const { groupItemsByRoom } = await import('../../utils/room-grouping.js')
      const { resolveRoomName } = await import('../../utils/room-name.js')
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listContainer = refs('listContainer')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'music',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const rawItems = await $storage.getAssetsByCategory('audio', lastItem?.item || lastItem?.asset || null, BATCH_SIZE)
          const items = await Promise.all(rawItems.map(async (asset) => {
            const room = await $storage.getRoom(asset.room_id)
            const roomName = resolveRoomName(room, { currentUser: $state.currentUser })
            const metadata = asset.music_metadata || {}
            const searchContent = `${asset.filename || ''} ${metadata.title || ''} ${metadata.artist || ''} ${metadata.album || ''} ${roomName}`.toLowerCase()
            return {
              id: asset.id,
              item: asset,
              asset,
              roomId: asset.room_id,
              room,
              roomName,
              createdAt: asset.created_at,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listContainer.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No music found'}</div>`
            return
          }

          const grouped = groupItemsByRoom(itemsToDisplay)
          const fragment = document.createDocumentFragment()

          for (const group of grouped) {
            const groupSection = document.createElement('div')
            groupSection.className = 'media-room-group mb-3'

            const header = document.createElement('media-room-header')
            header.setAttribute('room-id', group.roomId)
            header.setAttribute('room-name', group.roomName)
            header.setAttribute('item-count', group.items.length)
            groupSection.appendChild(header)

            const listEl = document.createElement('atoll-list')
            listEl.setAttribute('divided', 'true')

            for (const { asset, roomName, timestamp } of group.items) {
              const isActive = asset.id === $state.activeSelectionId && $state.activeSelectionType === 'music'
              const listItem = document.createElement('music-list-item')
              listItem.setAttribute('asset-id', asset.id)
              listItem.setAttribute('room-name', roomName)
              listItem.setAttribute('filename', asset.filename || 'Unnamed Audio')
              listItem.setAttribute('timestamp', timestamp)
              listItem.setAttribute('is-active', isActive.toString())
              listEl.appendChild(listItem)
            }

            groupSection.appendChild(listEl)
            fragment.appendChild(groupSection)
          }

          listContainer.innerHTML = ''
          listContainer.appendChild(fragment)
        }
      })

      $bus.on('media:select', ({ assetId, type }) => {
        if (type === 'music') {
          $state.activeSelectionId = assetId
          $state.activeSelectionType = 'music'
          debouncedRender()
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'music') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', (payload) => {
        const msg = payload?.message
        const isMatch = msg?.mime_type?.startsWith('audio/') ||
          msg?.attachments?.some(a => a.mime_type?.startsWith('audio/')) ||
          payload?.mime_type?.startsWith('audio/')
        if (isMatch) {
          manager.reset(); debouncedRender()
        }
      })

      debouncedRender()
    }
  })
</script>
