<template id="picture-list">
  <div class="picture-list h-100 overflow-y-auto p-3" ref="scrollRoot">
    <atoll-media-grid columns="3" aspect-ratio="square" gap="xs" ref="gridContainer">
      <!-- Pictures will be rendered here -->
    </atoll-media-grid>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, storage, eventBus, globalStore, refs, utils, fuse }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const gridContainer = refs('gridContainer')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'pictures',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        searchKeys: ['filename'],
        fetchNextBatch: async (lastItem) => {
          const items = await $storage.getAssetsByCategory('image', lastItem, BATCH_SIZE)
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          const gridWrapper = gridContainer.querySelector('.atoll-media-grid') || gridContainer
          if (itemsToDisplay.length === 0) {
            gridWrapper.innerHTML = `<div class="p-4 text-center text-body-secondary w-100" style="grid-column: span 3;">${query ? 'No matches found' : 'No pictures found'}</div>`
            return
          }
  
          const fragment = document.createDocumentFragment()
          itemsToDisplay.forEach((item) => {
            const isActive = (item.id === $state.activeSelectionId && $state.activeSelectionType === 'pictures').toString()
            const dt = new Date(item.created_at)
            const card = document.createElement('atoll-media-card')
            card.setAttribute('asset-id', item.id)
            card.setAttribute('media-id', item.media_id)
            card.setAttribute('mime-type', item.mime_type)
            card.setAttribute('selected', isActive)
            card.setAttribute('type', 'pictures')
            card.setAttribute('media-type', 'image')
            card.setAttribute('title', dt.toLocaleDateString())
            card.setAttribute('subtitle', dt.toLocaleTimeString([], {
              hour: '2-digit',
              minute: '2-digit'
            }))
            card.setAttribute('file-key', item.file_key)
            card.setAttribute('file-nonce', item.file_nonce)
            fragment.appendChild(card)
          })
          gridWrapper.innerHTML = ''; gridWrapper.appendChild(fragment)
        }
      })

      $bus.on('media:select', ({ assetId, type }) => {
        if (type === 'pictures') {
          $state.activeSelectionId = assetId
          $state.activeSelectionType = 'pictures'
          debouncedRender()
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'pictures') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', (payload) => {
        const msg = payload?.message
        const isMatch = msg?.mime_type?.startsWith('image/') ||
          msg?.attachments?.some(a => a.mime_type?.startsWith('image/')) ||
          payload?.mime_type?.startsWith('image/')
        if (isMatch) {
          manager.reset(); debouncedRender()
        }
      })

      debouncedRender()
    }
  })
</script>
