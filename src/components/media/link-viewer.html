<template id="link-viewer">
  <div class="link-viewer-container d-flex flex-column h-100 bg-body position-relative">
    <viewer-header 
      title="Link Details" 
      subtitle="{{ domain }}" 
      icon="link"
      theme="light">
    </viewer-header>

    <div ref="carousel" class="carousel slide flex-grow-1 overflow-hidden" data-bs-interval="false">
      <div class="carousel-inner h-100" ref="carouselInner">
        <!-- Carousel items will be rendered here -->
      </div>
      
      <button class="carousel-control-prev" type="button" ref="btnPrev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" ref="btnNext">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      domain: ''
    }),
    client: async ({ state, signal, refs, storage, globalStore, utils, bootstrap }) => {
      const { resolveRoomName } = await import('../../utils/room-name.js')
      const { $storage } = storage
      const { $state } = globalStore
      const { $media } = utils
      const { Carousel } = bootstrap
      const carouselEl = refs('carousel')
      const carouselInner = refs('carouselInner')
      const btnPrev = refs('btnPrev')
      const btnNext = refs('btnNext')

      let carouselInstance = null
      let loadedItems = []
      let hasMore = true
      let lastTimestamp = null
      const BATCH_SIZE = 24
      let isInternalChange = false
      let initSequence = 0

      const cleanup = () => {
        if (carouselInstance) {
          carouselInstance.dispose()
          carouselInstance = null
        }
      }
      signal.addEventListener('abort', cleanup)

      const updateItemUI = async (item, container) => {
        const { message: msg, link, linkIndex } = item
        const room = await $storage.getRoom(msg.room_id)
        const roomName = resolveRoomName(room, { currentUser: $state.currentUser })
        let senderName = 'Unknown'
        if (room && room.participants) {
          const sender = room.participants.find(p => p.id === msg.sender_id)
          if (sender) {
            senderName = sender.name || sender.username || 'Unknown'
          }
        }

        container.querySelector('.link-title').textContent = link.title || 'Untitled Link'
        container.querySelector('.link-summary').textContent = link.description || ''
        container.querySelector('.link-url-text').textContent = link.url
        container.querySelector('.link-visit-btn').href = link.url
        container.querySelector('.link-sender').textContent = senderName
        container.querySelector('.link-room').textContent = roomName
        container.querySelector('.link-date').textContent = new Date(msg.created_at).toLocaleString()

        const imgContainer = container.querySelector('.link-image-container')
        const thumbKey = `thumb:${msg.media_id || `${msg.local_uuid}:${linkIndex}`}`

        if (msg.media_id && msg.file_key && msg.file_nonce && linkIndex === 0) {
          // Decrypt if it's the primary (first) link which might have an encrypted image
          try {
            const blobUrl = await $media.decrypt({
              media_id: msg.media_id,
              file_key: msg.file_key,
              file_nonce: msg.file_nonce,
              mime_type: 'image/jpeg',
              isThumbnail: true,
              cacheKey: thumbKey
            }, { signal })

            const img = document.createElement('img')
            img.src = blobUrl
            img.className = 'w-100 h-100 object-fit-cover'
            img.alt = 'Preview'
            imgContainer.replaceChildren(img)
          } catch {
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'link')
            icon.setAttribute('size', '48')
            icon.className = 'text-secondary opacity-25'
            imgContainer.replaceChildren(icon)
          }
        } else if (link.image) {
          // Use standard image URL if provided (for secondary links or non-encrypted previews)
          const img = document.createElement('img')
          img.src = link.image
          img.className = 'w-100 h-100 object-fit-cover'
          img.alt = 'Preview'
          imgContainer.replaceChildren(img)
        } else {
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'link')
          icon.setAttribute('size', '48')
          icon.className = 'text-secondary opacity-25'
          imgContainer.replaceChildren(icon)
        }
      }

      const createCarouselItem = (item, isActive) => {
        const div = document.createElement('div')
        div.className = `carousel-item h-100 ${isActive ? 'active' : ''}`
        div.dataset.id = item.id
        div.innerHTML = `
          <div class="link-viewer h-100 overflow-y-auto p-4">
            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
              <div class="link-image-container bg-light d-flex align-items-center justify-content-center" style="min-height: 200px; max-height: 400px;"></div>
              <div class="card-body">
                <h4 class="card-title fw-bold mb-2 link-title"></h4>
                <p class="text-muted mb-4 link-summary"></p>
                <div class="d-grid">
                  <atoll-button variant="primary" leading-icon="link" class="link-visit-btn">Visit Website</atoll-button>
                </div>
              </div>
            </div>
            <div class="card shadow-sm border-0">
              <div class="card-body">
                <h6 class="text-uppercase text-muted small fw-bold mb-3">Information</h6>
                <div class="d-flex flex-column gap-3">
                  <div class="d-flex justify-content-between">
                    <span class="text-muted">Shared by</span>
                    <span class="fw-bold link-sender"></span>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span class="text-muted">Chat</span>
                    <span class="fw-bold link-room"></span>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span class="text-muted">Date</span>
                    <span class="fw-bold link-date"></span>
                  </div>
                  <div class="d-flex justify-content-between overflow-hidden">
                    <span class="text-muted flex-shrink-0 me-3">URL</span>
                    <span class="text-primary text-truncate link-url-text"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `
        return div
      }

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return []
        }
        const allMessages = await $storage.getLinkMessages()
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMessages.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawMessages = allMessages.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawMessages.length < BATCH_SIZE) {
          hasMore = false
        }
  
        const explodedItems = []
        rawMessages.forEach(msg => {
          const links = msg.links || [{
            title: msg.link_title,
            description: msg.link_summary,
            domain: msg.link_domain,
            url: msg.content
          }]
          links.forEach((link, idx) => {
            explodedItems.push({
              id: links.length > 1 ? `${msg.local_uuid}:${idx}` : msg.local_uuid,
              message: msg,
              link,
              linkIndex: idx
            })
          })
        })

        if (rawMessages.length > 0) {
          lastTimestamp = rawMessages[rawMessages.length - 1].created_at
          loadedItems = [...loadedItems, ...explodedItems]
        }
        return explodedItems
      }

      const renderBatch = (items, activeId) => {
        items.forEach(item => {
          const isActive = item.id === activeId
          const el = createCarouselItem(item, isActive)
          carouselInner.appendChild(el)
          if (isActive) {
            state.domain = item.link.domain || ''
            updateItemUI(item, el)
          }
        })
      }

      const initCarousel = async () => {
        const seq = ++initSequence
        cleanup()
        carouselInner.innerHTML = ''
        loadedItems = []
        lastTimestamp = null
        hasMore = true

        const activeId = $state.activeSelectionId
        const baseId = activeId ? activeId.split(':')[0] : null
        const activeMsg = baseId ? await $storage.getMessage(baseId) : null
        if (seq !== initSequence) {
          return
        }
        const isValidActive = activeMsg && activeMsg.type === 'link'

        if (isValidActive) {
          while (!loadedItems.find(i => i.id === activeId) && hasMore) {
            await fetchNextBatch()
            if (seq !== initSequence) {
              return
            }
          }
        } else {
          await fetchNextBatch()
          if (seq !== initSequence) {
            return
          }
        }

        const actualActiveId = isValidActive ? activeId : (loadedItems[0]?.id || null)

        renderBatch(loadedItems, actualActiveId)
  
        carouselInstance = new Carousel(carouselEl, {
          interval: false,
          touch: true,
          wrap: false
        })

        carouselEl.addEventListener('slid.bs.carousel', (e) => {
          const activeItem = e.relatedTarget
          const id = activeItem.dataset.id
          const item = loadedItems.find(i => i.id === id)
          if (item) {
            isInternalChange = true
            $state.activeSelectionId = id
            state.domain = item.link.domain || ''
            updateItemUI(item, activeItem)
            isInternalChange = false
          }
          const index = loadedItems.findIndex(i => i.id === id)
          if (index >= loadedItems.length - 3 && hasMore) {
            fetchNextBatch().then(batch => renderBatch(batch, null))
          }
        })
      }

      btnPrev.onclick = () => carouselInstance?.prev()
      btnNext.onclick = async () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (!activeItem) {
          return
        }
        const id = activeItem.dataset.id
        const index = loadedItems.findIndex(i => i.id === id)
  
        if (index === loadedItems.length - 1 && hasMore) {
          const nextBatch = await fetchNextBatch()
          if (nextBatch.length > 0) {
            renderBatch(nextBatch, null)
            setTimeout(() => carouselInstance?.next(), 0)
          }
        } else {
          carouselInstance?.next()
        }
      }

      $state.subscribe('activeSelectionId', (id) => {
        if (isInternalChange || $state.activeSelectionType !== 'links') {
          return
        }
        const index = loadedItems.findIndex(i => i.id === id)
        if (index !== -1) {
          carouselInstance?.to(index)
        } else {
          initCarousel()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type === 'links') {
          initCarousel()
        }
      })

      if ($state.activeSelectionType === 'links') {
        initCarousel()
      }
    }
  })
</script>
