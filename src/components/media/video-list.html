<template id="video-list">
  <div class="video-list h-100 overflow-y-auto p-3" ref="scrollRoot">
    <div ref="listContainer">
      <!-- Room groups containing media headers and grids will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ state, storage, eventBus, globalStore, refs, utils, fuse }) => {
      const { groupItemsByRoom } = await import('../../utils/room-grouping.js')
      const { resolveRoomName } = await import('../../utils/room-name.js')
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listContainer = refs('listContainer')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'videos',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const rawItems = await $storage.getAssetsByCategory('video', lastItem?.item || lastItem, BATCH_SIZE)
          const items = await Promise.all(rawItems.map(async (asset) => {
            const room = await $storage.getRoom(asset.room_id)
            const roomName = resolveRoomName(room, { currentUser: $state.currentUser })
            const searchContent = `${asset.filename || ''} ${roomName}`.toLowerCase()
            const dt = new Date(asset.created_at)
            return {
              id: asset.id,
              item: asset,
              roomId: asset.room_id,
              room,
              roomName,
              createdAt: asset.created_at,
              timestamp: `${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
              })}`,
              searchContent
            }
          }))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listContainer.innerHTML = `<div class="p-4 text-center text-body-secondary w-100">${query ? 'No matches found' : 'No videos found'}</div>`
            return
          }

          const grouped = groupItemsByRoom(itemsToDisplay)
          const fragment = document.createDocumentFragment()

          for (const group of grouped) {
            const groupSection = document.createElement('div')
            groupSection.className = 'media-room-group mb-3'

            const header = document.createElement('media-room-header')
            header.setAttribute('room-id', group.roomId)
            header.setAttribute('room-name', group.roomName)
            header.setAttribute('item-count', group.items.length)
            groupSection.appendChild(header)

            const grid = document.createElement('atoll-media-grid')
            grid.setAttribute('columns', '3')
            grid.setAttribute('aspect-ratio', 'square')
            grid.setAttribute('gap', 'xs')

            const gridWrapper = grid.querySelector('.atoll-media-grid') || grid

            group.items.forEach((entry) => {
              const item = entry.item || entry
              const isActive = (item.id === $state.activeSelectionId && $state.activeSelectionType === 'videos').toString()
              const dt = new Date(item.created_at)
              const card = document.createElement('atoll-media-card')
              card.setAttribute('asset-id', item.id)
              card.setAttribute('media-id', item.media_id)
              card.setAttribute('mime-type', item.mime_type)
              card.setAttribute('selected', isActive)
              card.setAttribute('type', 'videos')
              card.setAttribute('media-type', 'video')
              card.setAttribute('title', dt.toLocaleDateString())
              card.setAttribute('subtitle', dt.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
              }))
              card.setAttribute('file-key', item.file_key)
              card.setAttribute('file-nonce', item.file_nonce)
              gridWrapper.appendChild(card)
            })

            groupSection.appendChild(grid)
            fragment.appendChild(groupSection)
          }

          listContainer.innerHTML = ''
          listContainer.appendChild(fragment)
        }
      })

      $bus.on('media:select', ({ assetId, type }) => {
        if (type === 'videos') {
          $state.activeSelectionId = assetId
          $state.activeSelectionType = 'videos'
          debouncedRender()
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'videos') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', (payload) => {
        const msg = payload?.message
        const isMatch = msg?.mime_type?.startsWith('video/') ||
          msg?.attachments?.some(a => a.mime_type?.startsWith('video/')) ||
          payload?.mime_type?.startsWith('video/')
        if (isMatch) {
          manager.reset(); debouncedRender()
        }
      })

      debouncedRender()
    }
  })
</script>
