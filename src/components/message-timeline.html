<template id="message-timeline">
  <div ref="timelineContainer" class="flex-grow-1 overflow-auto p-3 d-flex flex-column h-100">
    <div class="mt-auto text-center text-muted p-5" ref="emptyState">
      <i class="bi bi-shield-lock fs-1 mb-3 d-block"></i>
      <p>Messages are end-to-end encrypted. No one outside of this chat, not even Atoll, can read them.</p>
    </div>
    <div ref="statusContainer" class="message-status-container d-none text-end px-2 py-1">
      <span ref="statusText" class="x-small text-muted me-1"></span>
      <i ref="statusIcon" class="bi bi-check text-muted" style="font-size: 1rem; line-height: 1;"></i>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, globalStore, localDb, eventBus, signal, utils, pocketbase, cryptoWorker }) => {
      const { $state } = globalStore
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $func } = utils
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const container = refs('timelineContainer')
      const emptyState = refs('emptyState')
      const statusContainer = refs('statusContainer')
      const statusText = refs('statusText')
      const statusIcon = refs('statusIcon')

      let last_room_id = null
      let lastView = null
      let seenTimeout = null
      let lastRenderedMessageId = null
      let forceScrollToBottom = false

      const scrollToBottom = (smooth = false) => {
        if (container) {
          if (smooth) {
            container.scrollTo({
              top: container.scrollHeight,
              behavior: 'smooth'
            })
          } else {
            container.scrollTop = container.scrollHeight
          }
        }
      }

      const saveScrollPosition = (idOrEvent) => {
        const room_id = typeof idOrEvent === 'string' ? idOrEvent : $state.activeSelectionId
        if (!room_id || typeof room_id !== 'string' || !container || container.scrollHeight === 0) {
          return
        }

        if (!$state.scrollPositions) {
          $state.scrollPositions = {}
        }

        const isNearBottom = container.clientHeight > 0 && (container.scrollHeight - container.scrollTop - container.clientHeight < 50)
        const pos = isNearBottom ? -1 : container.scrollTop
  
        // Only save if it's the current room OR if we are explicitly told which room to save for
        if (typeof idOrEvent === 'string' || room_id === $state.activeSelectionId) {
          $state.scrollPositions[room_id] = pos
        }
      }

      container.addEventListener('scroll', $func.debounce(() => saveScrollPosition(), 150))

      const updateSeenStatus = (messageId) => {
        const room_id = $state.activeSelectionId
        if (!room_id || !messageId) {
          return
        }

        if (seenTimeout) {
          clearTimeout(seenTimeout)
        }
        seenTimeout = setTimeout(async () => {
          try {
            const members = await pb.collection('room_members').getList(1, 1, {
              filter: `room_id = "${room_id}" && user_id = "${$state.currentUser.id}"`
            })
            if (members.items.length > 0) {
              const member = members.items[0]
              if (member.last_read_message_id !== messageId) {
                await pb.collection('room_members').update(member.id, {
                  last_read_message_id: messageId
                })
              }
            }
          } catch (err) {
            console.error('Failed to update seen status:', err)
          }
        }, 1000)
      }

      const intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const messageId = entry.target.dataset.messageId
            const isSent = entry.target.dataset.isSent === 'true'
            if (!isSent) {
              updateSeenStatus(messageId)
            }
          }
        })
      }, {
        root: container,
        threshold: 0.7
      })

      const renderTimeline = async () => {
        const room_id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!room_id || type !== 'chats') {
          lastView = type
          return
        }

        const isNewRoom = room_id !== last_room_id || lastView !== 'chats'
        if (isNewRoom) {
          last_room_id = room_id
          lastView = type
          lastRenderedMessageId = null
          container.innerHTML = ''
          intersectionObserver.disconnect()
        }

        try {
          if (!room_id) {
            return
          }
          let [messages, room] = await Promise.all([
            $localDb.local_messages.where('room_id').equals(room_id).sortBy('created_at'),
            $localDb.local_rooms.get(room_id)
          ])

          if ($state.activeSelectionId !== room_id) {
            return
          }
          const participants = room?.participants || []
  
          if (messages.length === 0) {
            if (isNewRoom) {
              container.appendChild(emptyState)
            }
            return
          }

          // If we have messages, remove empty state if present
          if (emptyState.parentNode === container) {
            container.removeChild(emptyState)
          }

          // Update status of already rendered messages
          messages.forEach(m => {
            const row = container.querySelector(`timeline-row[data-local-uuid="${m.local_uuid}"]`)
            if (row) {
              if (m.id && !row.dataset.messageId) {
                row.dataset.messageId = m.id
                row.setAttribute('message-id', m.id)
              }

              // Propagate status to children
              row.querySelectorAll('text-message, media-preview, voice-player, file-attachment, link-preview').forEach(child => {
                if (child.getAttribute('status') !== m.status) {
                  child.setAttribute('status', m.status)
                }
              })

              if (m.status !== 'pending' && row.classList.contains('placeholder-wave')) {
                row.classList.remove('placeholder-wave')
              }
            }
          })

          // Identify new messages to render
          // To support robust chronological sorting and handle potential out-of-order arrivals,
          // we no longer rely on lastRenderedMessageId for slicing.
          // The deduplication logic below will ensure we don't append duplicates.
          let messagesToRender = messages

          // Double check to prevent duplicate appending if multiple calls overlapping
          // Check BOTH timeline-row and timeline-system-message
          const existingElements = Array.from(container.querySelectorAll('timeline-row, timeline-system-message'))
          const existingIds = new Set()
          existingElements.forEach(el => {
            if (el.dataset.messageId) {
              existingIds.add(el.dataset.messageId)
            }
            if (el.dataset.localUuid) {
              existingIds.add(el.dataset.localUuid)
            }
          })

          messagesToRender = messagesToRender.filter(m => {
            if (m.type === 'ice_candidate' || m.type === 'reaction') {
              return false
            }
            const hasId = m.id && existingIds.has(m.id)
            const hasUuid = m.local_uuid && existingIds.has(m.local_uuid)
            return !hasId && !hasUuid
          })

          // Before appending, update the previously last message's styling
          if (lastRenderedMessageId && messagesToRender.length > 0) {
            const prevLastRow = container.querySelector(`timeline-row[data-message-id="${lastRenderedMessageId}"], timeline-row[data-local-uuid="${lastRenderedMessageId}"]`)
            if (prevLastRow) {
              const firstNew = messagesToRender[0]
              const prevMsg = messages.find(m => (m.id && m.id === lastRenderedMessageId) || (m.local_uuid && m.local_uuid === lastRenderedMessageId))
  
              if (prevMsg && prevMsg.created_at && firstNew.created_at) {
                // 1. Date Separator logic (> 1 hour)
                const prevTime = new Date(prevMsg.created_at).getTime()
                const currTime = new Date(firstNew.created_at).getTime()
                const showSeparator = currTime - prevTime > 3600000

                if (!showSeparator && firstNew.sender_id === prevLastRow.dataset.senderId) {
                  // It's no longer the last in block
                  prevLastRow.setAttribute('is-last-in-block', 'false')
                  // Remove avatar if it had one
                  prevLastRow.removeAttribute('avatar-url')
                  prevLastRow.removeAttribute('avatar-initials')
                }
              }
            }
          }

          messagesToRender.forEach((message) => {
            const index = messages.findIndex(m => m.local_uuid === message.local_uuid)
            const isSent = message.sender_id === $state.currentUser?.id
            const nextMessage = messages[index + 1]
            const prevMessage = messages[index - 1]
  
            // 1. Date Separator logic (> 1 hour)
            let showSeparator = false
            if (prevMessage) {
              const prevTime = new Date(prevMessage.created_at).getTime()
              const currTime = new Date(message.created_at).getTime()
              if (currTime - prevTime > 3600000) {
                showSeparator = true
              }
            } else {
              showSeparator = true
            }

            if (showSeparator) {
              const sep = document.createElement('timeline-date-separator')
              sep.setAttribute('timestamp', message.created_at)
              container.appendChild(sep)
            }

            const isLastInBlock = !nextMessage || nextMessage.sender_id !== message.sender_id
            const isFirstInBlock = !prevMessage || prevMessage.sender_id !== message.sender_id || showSeparator
  
            const row = document.createElement('timeline-row')
            row.setAttribute('is-sent', isSent)
            row.setAttribute('is-first-in-block', isFirstInBlock)
            row.setAttribute('is-last-in-block', isLastInBlock)
            if (message.id) {
              row.dataset.messageId = message.id
              row.setAttribute('message-id', message.id)
            }
            row.setAttribute('local-uuid', message.local_uuid)
            row.setAttribute('data-local-uuid', message.local_uuid)
            row.dataset.localUuid = message.local_uuid
            row.dataset.isSent = isSent
            row.dataset.senderId = message.sender_id

            const sender = participants.find(p => p.id === message.sender_id)
            if (!isSent && isFirstInBlock && sender) {
              row.setAttribute('sender-name', sender.name || sender.username || 'Unknown')
            }

            if (!isSent && isLastInBlock && sender) {
              if (sender.avatar) {
                row.setAttribute('avatar-url', pb.files.getURL(sender, sender.avatar, { thumb: '32x32' }))
              } else {
                row.setAttribute('avatar-initials', (sender.name || sender.username || '?').substring(0, 2).toUpperCase())
              }
            }

            // Seen Indicators
            const seenBy = participants.filter(p => p.id !== $state.currentUser?.id && p.last_read_message_id === message.id)
            if (seenBy.length > 0) {
              const seenAvatars = seenBy.map(p => {
                if (p.avatar) {
                  return pb.files.getURL(p, p.avatar, { thumb: '16x16' })
                }
                return (p.username || '?').substring(0, 1).toUpperCase()
              }).join(',')
              row.setAttribute('seen-avatars', seenAvatars)
            }

            // Determine bubble position for Messenger-style corners
            let position = 'single'
            if (isFirstInBlock && isLastInBlock) {
              position = 'single'
            } else if (isFirstInBlock) {
              position = 'start'
            } else if (isLastInBlock) {
              position = 'end'
            } else {
              position = 'middle'
            }

            // Project content into slot
            if (message.type === 'media' && (message.file_key || message.status === 'pending')) {
              if (message.mime_type?.startsWith('audio/')) {
                const player = document.createElement('voice-player')
                player.setAttribute('local-uuid', message.local_uuid)
                player.setAttribute('status', message.status)
                player.setAttribute('is-sent', isSent)
                row.appendChild(player)

                if (message.content) {
                  const text = document.createElement('text-message')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('position', position)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              } else if (message.mime_type?.startsWith('image/') || message.mime_type?.startsWith('video/')) {
                const preview = document.createElement('media-preview')
                preview.setAttribute('local-uuid', message.local_uuid)
                preview.setAttribute('status', message.status)
                preview.setAttribute('is-sent', isSent)
                row.appendChild(preview)
  
                if (message.content) {
                  const text = document.createElement('text-message')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('position', position)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              } else {
                // Generic file
                const fileComp = document.createElement('file-attachment')
                fileComp.setAttribute('local-uuid', message.local_uuid)
                fileComp.setAttribute('status', message.status)
                fileComp.setAttribute('is-sent', isSent)
                row.appendChild(fileComp)

                if (message.content) {
                  const text = document.createElement('text-message')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('position', position)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              }
            } else if (message.type === 'media') {
              // Encrypted but key missing placeholder
              const text = document.createElement('text-message')
              text.setAttribute('local-uuid', message.local_uuid)
              text.setAttribute('content', '🔒 Encrypted Attachment')
              text.setAttribute('is-sent', isSent)
              text.setAttribute('position', position)
              row.appendChild(text)
            } else if (['call_offer', 'call_answer', 'call_end'].includes(message.type)) {
              const systemMsg = document.createElement('timeline-system-message')
              systemMsg.setAttribute('type', message.type)
              if (message.id) {
                systemMsg.setAttribute('message-id', message.id)
                systemMsg.setAttribute('data-message-id', message.id)
              }
              systemMsg.setAttribute('local-uuid', message.local_uuid)
              systemMsg.setAttribute('data-local-uuid', message.local_uuid)
              systemMsg.dataset.localUuid = message.local_uuid
              // Don't append to row, signaling messages are centered
              container.appendChild(systemMsg)
              lastRenderedMessageId = message.id || message.local_uuid
              return
            } else if (message.type === 'link') {
              if (message.links && Array.from(message.links).length > 0) {
                message.links.forEach((link, idx) => {
                  const preview = document.createElement('link-preview')
                  // Use unique identifier if multiple links exist
                  preview.setAttribute('local-uuid', message.local_uuid)
                  preview.setAttribute('link-index', idx)
                  preview.setAttribute('url', link.url)
                  preview.setAttribute('title', link.title || '')
                  preview.setAttribute('summary', link.description || '')
                  preview.setAttribute('domain', link.domain || '')
                  preview.setAttribute('image-url', link.image || '')
                  preview.setAttribute('status', message.status)
                  row.appendChild(preview)
                })
              } else if (message.link_title) {
                // Fallback for old single-link messages
                const preview = document.createElement('link-preview')
                preview.setAttribute('local-uuid', message.local_uuid)
                preview.setAttribute('url', message.content)
                preview.setAttribute('title', message.link_title || '')
                preview.setAttribute('summary', message.link_summary || '')
                preview.setAttribute('domain', message.link_domain || '')
                preview.setAttribute('status', message.status)
                row.appendChild(preview)
              }

              if (message.content) {
                const text = document.createElement('text-message')
                text.setAttribute('local-uuid', message.local_uuid)
                text.setAttribute('content', message.content)
                text.setAttribute('is-sent', isSent)
                text.setAttribute('position', position)
                text.setAttribute('status', message.status)
                row.appendChild(text)
              }
            } else {
              const text = document.createElement('text-message')
              text.setAttribute('local-uuid', message.local_uuid)
              text.setAttribute('content', message.content || '')
              text.setAttribute('is-sent', isSent)
              text.setAttribute('position', position)
              text.setAttribute('status', message.status)
              row.appendChild(text)
            }

            container.appendChild(row)
            intersectionObserver.observe(row)
            lastRenderedMessageId = message.id || message.local_uuid
          })

          // Update and re-append global status indicator
          const lastMessage = messages[messages.length - 1]
          if (lastMessage && lastMessage.sender_id === $state.currentUser?.id) {
            statusContainer.classList.remove('d-none')
            statusText.textContent = lastMessage.status === 'pending' ? 'Sending...' : 'Sent'
            statusIcon.className = lastMessage.status === 'pending' ? 'bi bi-circle text-muted' : 'bi bi-check text-muted'
  
            // Always move to end, making sure it is the absolute last element
            container.appendChild(statusContainer)
          } else {
            statusContainer.classList.add('d-none')
          }

          // FINAL SORT CHECK: In case messages arrived out of order, we ensure chronological order
          // But only if we actually added something new.
          if (messagesToRender.length > 0) {
            const children = Array.from(container.children).filter(el => el.tagName === 'TIMELINE-ROW' ||
              el.tagName === 'TIMELINE-SYSTEM-MESSAGE' ||
              el.tagName === 'TIMELINE-DATE-SEPARATOR'
            )
  
            // Create a lookup map for message timestamps to optimize sorting
            const timestampMap = new Map()
            messages.forEach(m => {
              const ts = new Date(m.created_at).getTime()
              if (m.local_uuid) {
                timestampMap.set(m.local_uuid, ts)
              }
              if (m.id) {
                timestampMap.set(m.id, ts)
              }
            })

            // Map elements to their timestamps for sorting
            const elementData = children.map(el => {
              let timestamp = 0
              if (el.tagName === 'TIMELINE-DATE-SEPARATOR') {
                timestamp = new Date(el.getAttribute('timestamp')).getTime()
              } else {
                timestamp = timestampMap.get(el.dataset.localUuid) || timestampMap.get(el.dataset.messageId) || 0
              }
              return {
                el,
                timestamp
              }
            })

            // Check if they are already sorted
            let sorted = true
            for (let i = 0; i < elementData.length - 1; i++) {
              if (elementData[i].timestamp > elementData[i + 1].timestamp) {
                sorted = false
                break
              }
            }

            if (!sorted) {
              elementData.sort((a, b) => a.timestamp - b.timestamp)
              elementData.forEach(item => {
                // re-append in order
                container.insertBefore(item.el, statusContainer.parentNode === container ? statusContainer : null)
              })
            }
          }

          if (isNewRoom) {
            const savedPos = $state.scrollPositions?.[room_id]
            if (savedPos !== undefined && savedPos !== -1) {
              // Ensure content is rendered before restoring scroll
              setTimeout(() => {
                if (container && room_id === $state.activeSelectionId) {
                  container.scrollTop = savedPos
                }
              }, 100)
            } else {
              requestAnimationFrame(() => scrollToBottom())
              // Extra safety for media that might load instantly from cache
              setTimeout(() => scrollToBottom(), 100)
            }
          } else if (forceScrollToBottom) {
            scrollToBottom(true)
            forceScrollToBottom = false
          } else {
            // New messages arrived, smooth scroll if we are already near bottom
            const isNearBottom = container.scrollHeight > container.clientHeight &&
                                 container.scrollHeight - container.scrollTop - container.clientHeight < 100
            if (isNearBottom) {
              scrollToBottom(true)
            }
          }
        } catch (err) {
          console.error('[message-timeline] Failed to render timeline:', err)
        }
      }

      const debouncedRender = $func.debounce(renderTimeline, 50)
      debouncedRender()

      $bus.on('ui:media_loaded', () => {
        const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 250
        if (isNearBottom) {
          requestAnimationFrame(() => scrollToBottom(true))
        }
      })

      let prevSelectionId = $state.activeSelectionId
      $state.subscribe('activeSelectionId', (val) => {
        if (prevSelectionId && prevSelectionId !== val) {
          saveScrollPosition(prevSelectionId)
        }
        prevSelectionId = val
        debouncedRender()
      })
      $state.subscribe('activeSelectionType', (val) => {
        saveScrollPosition()
        debouncedRender()
      })

      if (signal) {
        signal.addEventListener('abort', () => saveScrollPosition())
      }

      $bus.on('db:new_local_data', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          // If it's a reaction, we don't need to re-render the whole timeline
          // but we might need to update the reactions component.
          // message-reactions already listens for db:new_local_data.
          // However, if a new message arrives, we DO need to re-render.
          if (payload.message && payload.message.type === 'reaction') {
            return
          }

          if (payload.message && payload.message.sender_id === $state.currentUser?.id) {
            forceScrollToBottom = true
          }

          debouncedRender()
        }
      })

      $bus.on('message:send_reaction', async (payload) => {
        const room_id = $state.activeSelectionId
        if (!room_id) {
          return
        }

        // Normalize payload for backward compatibility
        const targetId = payload.targetId || payload.messageId
        let content = payload.content

        if (!content) {
          const emoji = payload.emoji || payload.reaction
          if (emoji) {
            content = {
              type: 'emoji',
              value: emoji
            }
          }
        }

        if (!targetId || !content) {
          console.warn('[message-timeline] Invalid reaction payload:', payload)
          return
        }

        const localUuid = crypto.randomUUID()
        const params = {
          type: 'reaction',
          content: content,
          target_id: targetId,
          timestamp: Date.now()
        }

        // We don't do an optimistic write for reactions in the timeline,
        // but we do send it to the worker which will save it and emit db:new_local_data
        await $worker.execute('worker:send_message', {
          room_id,
          localUuid,
          ...params
        })
      })
  
      // Update participants seen status in real-time
      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          debouncedRender()
        }
      })

      $bus.on('message:scroll_to', async (payload) => {
        const { messageId } = payload
        if (!messageId) {
          return
        }

        // 1. Check if it's already rendered
        let row = container.querySelector(`timeline-row[data-message-id="${messageId}"]`) ||
                  container.querySelector(`timeline-row[data-local-uuid="${messageId}"]`)
  
        if (!row) {
          // If not rendered, we might need to wait for renderTimeline
          await renderTimeline()
          row = container.querySelector(`timeline-row[data-message-id="${messageId}"]`) ||
                container.querySelector(`timeline-row[data-local-uuid="${messageId}"]`)
        }

        if (row) {
          row.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          })
        }
      })
    }
  })
</script>
