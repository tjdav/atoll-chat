<template id="welcome-setup">
  <div class="atoll-auth-card">
    <!-- Zone 2: Hero Greeting -->
    <div class="atoll-auth-hero-zone bg-primary text-white p-4 rounded-3 mb-4">
      <h3 class="text-white mb-1">Welcome to Atoll Chat!</h3>
      <p class="opacity-75 mb-0">Let's set up your secure environment.</p>
    </div>

    <form ref="setupForm" class="atoll-auth-form-zone" novalidate>
      <!-- STEP 1: ADMINISTRATOR ACCOUNT -->
      <div ref="step1" class="d-flex flex-column gap-3">
        <h4 class="mb-1">1. Administrator Account</h4>
        <p class="text-muted small mb-3">Create your primary account. This account will also have administrative access to the PocketBase dashboard.</p>
        
        <atoll-input 
          ref="username" 
          label="Username" 
          placeholder="Choose a username" 
          required="true" 
          autocomplete="username"
          minlength="3"
          maxlength="20"
          pattern="^[a-zA-Z0-9_]+$"
        ></atoll-input>

        <atoll-input 
          ref="email" 
          type="email"
          label="Email" 
          placeholder="Enter your email" 
          required="true" 
          autocomplete="email"
        ></atoll-input>

        <atoll-input 
          ref="password" 
          type="password"
          label="Password (min 8 characters)" 
          placeholder="Enter Password" 
          required="true" 
          autocomplete="new-password"
          minlength="8"
        ></atoll-input>

        <atoll-input 
          ref="passwordConfirm" 
          type="password"
          label="Confirm Password" 
          placeholder="Confirm Password" 
          required="true" 
          autocomplete="new-password"
          minlength="8"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone for Step 1 -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="button" variant="primary" block="true" ref="btnNext">Next: Secure Your Vault</atoll-button>
        </div>
      </div>

      <!-- STEP 2: SECURE YOUR VAULT -->
      <div ref="step2" class="d-none flex-column gap-3">
        <h4 class="mb-1">2. Secure Your Vault</h4>
        <p class="text-muted small mb-3">Atoll Chat uses end-to-end encryption. Your private keys will be stored in an encrypted vault. Choose a password to protect them.</p>
        
        <!-- PASSWORD VAULT MODE -->
        <div ref="passwordSection" class="d-flex flex-column gap-3">
          <input type="text" ref="vaultUsernameHidden" name="vaultUsername" class="visually-hidden" autocomplete="username" tabindex="-1" aria-hidden="true">
          
          <div>
            <atoll-input 
              ref="vaultPassword" 
              type="password"
              label="Vault Password" 
              placeholder="Enter Vault Password" 
              minlength="12" 
              autocomplete="new-password"
            ></atoll-input>
            <div class="progress mt-2" style="height: 5px;">
              <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div ref="strengthText" class="form-text small mt-1">Minimum 12 characters.</div>
          </div>

          <atoll-input 
            ref="vaultPasswordConfirm" 
            type="password"
            label="Confirm Vault Password" 
            placeholder="Confirm Vault Password" 
            minlength="12" 
            autocomplete="new-password"
          ></atoll-input>

          <atoll-button type="button" variant="ghost" block="true" ref="btnTogglePasskey">Use Passkey instead</atoll-button>
        </div>

        <!-- PASSKEY VAULT MODE -->
        <div ref="passkeySection" class="d-none flex-column gap-3">
          <div class="alert alert-info small">
            You will be prompted to create a Passkey when you click "Complete Setup".
          </div>
          <atoll-button type="button" variant="ghost" block="true" ref="btnTogglePassword">Use Password instead</atoll-button>
        </div>
        
        <!-- Zone 4: Bottom Action Zone for Step 2 -->
        <div class="atoll-auth-bottom-zone d-flex gap-2">
          <atoll-button type="button" variant="ghost" class="w-50" ref="btnBack">Back</atoll-button>
          <atoll-button type="submit" variant="primary" class="w-50" ref="btnSubmit">Complete Setup</atoll-button>
        </div>
      </div>
    </form>

    <div ref="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: (context) => {
      const { refs, pocketbase, globalStore, eventBus, realtimeSync, storage, cryptoWorker, utils } = context
      const { pb } = pocketbase
      const { $url } = utils
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $worker } = cryptoWorker

      const setupForm = refs('setupForm')
      const step1 = refs('step1')
      const step2 = refs('step2')
      const btnNext = refs('btnNext')
      const btnBack = refs('btnBack')
      const usernameInput = refs('username')
      const emailInput = refs('email')
      const passwordInput = refs('password')
      const passwordConfirmInput = refs('passwordConfirm')
      const statusMsg = refs('statusMsg')
      const btnSubmit = refs('btnSubmit')

      // Vault Refs
      const passwordSection = refs('passwordSection')
      const passkeySection = refs('passkeySection')
      const vaultPasswordInput = refs('vaultPassword')
      const vaultUsernameHidden = refs('vaultUsernameHidden')
      const vaultPasswordConfirmInput = refs('vaultPasswordConfirm')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')
      const btnTogglePasskey = refs('btnTogglePasskey')
      const btnTogglePassword = refs('btnTogglePassword')

      let vaultMode = 'password'

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const updateStrength = async () => {
        const password = vaultPasswordInput.value
        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score, width, colorClass, text } = await evaluatePasswordStrength(password, 12)
        strengthBar.style.width = width
        strengthBar.className = colorClass
        strengthText.textContent = text
        if (password.length < 12 || score < 3) {
          btnSubmit.setAttribute('disabled', 'true')
        } else {
          btnSubmit.removeAttribute('disabled')
        }
      }

      vaultPasswordInput.addEventListener('input', updateStrength)

      const goToStep2 = async () => {
        const username = usernameInput.value
        if (vaultUsernameHidden) {
          vaultUsernameHidden.value = `${username} - Vault`
        }
        const email = emailInput.value
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (!username || !email || !password || !passwordConfirm) {
          updateStatus('Error: Please fill in all fields')
          return
        }

        if (username.length < 3) {
          updateStatus('Error: Username must be at least 3 characters')
          return
        }

        if (password.length < 8) {
          updateStatus('Error: Password must be at least 8 characters')
          return
        }

        if (password !== passwordConfirm) {
          updateStatus('Error: Passwords do not match')
          return
        }

        try {
          updateStatus('')
          step1.classList.add('d-none')
          step2.classList.remove('d-none')
          step2.classList.add('d-flex')
        } catch (error) {
          console.error('Validation error:', error)
          updateStatus(`Error: ${error.message || 'Validation failed'}`)
        }
      }

      btnNext.addEventListener('click', goToStep2)

      btnBack.addEventListener('click', () => {
        step2.classList.add('d-none')
        step2.classList.remove('d-flex')
        step1.classList.remove('d-none')
      })

      btnTogglePasskey.addEventListener('click', () => {
        vaultMode = 'passkey'
        passwordSection.classList.add('d-none')
        passwordSection.classList.remove('d-flex')
        passkeySection.classList.remove('d-none')
        passkeySection.classList.add('d-flex')
        vaultPasswordInput.removeAttribute('required')
        vaultPasswordConfirmInput.removeAttribute('required')
        btnSubmit.removeAttribute('disabled')
      })

      btnTogglePassword.addEventListener('click', () => {
        vaultMode = 'password'
        passkeySection.classList.add('d-none')
        passkeySection.classList.remove('d-flex')
        passwordSection.classList.remove('d-none')
        passwordSection.classList.add('d-flex')
        vaultPasswordInput.setAttribute('required', '')
        vaultPasswordConfirmInput.setAttribute('required', '')
        updateStrength()
      })

      // Ensure required attributes are correct on mount
      vaultPasswordInput.setAttribute('required', '')
      vaultPasswordConfirmInput.setAttribute('required', '')

      setupForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        if (!step1.classList.contains('d-none')) {
          await goToStep2()
          return
        }

        const username = usernameInput.value
        const email = emailInput.value
        const password = passwordInput.value

        let vaultPassword = ''
        if (vaultMode === 'password') {
          vaultPassword = vaultPasswordInput.value
          const vaultPasswordConfirm = vaultPasswordConfirmInput.value
          if (vaultPassword !== vaultPasswordConfirm) {
            updateStatus('Error: Vault Passwords do not match')
            return
          }
        }

        try {
          updateStatus('Generating cryptographic keys...')
          btnSubmit.setAttribute('loading', 'true')
          const masterKeys = await $worker.execute('worker:generate_master_keys')
  
          let encryptionPayload = {
            public_box_key: masterKeys.public_box_key,
            public_sign_key: masterKeys.public_sign_key
          }

          if (vaultMode === 'password') {
            updateStatus('Securing vault with Password (deriving keys)...')
            const salt = await $worker.execute('worker:randombytes_buf', { length: 16 })
            const KEK = await $worker.execute('worker:derive_key_from_password', {
              password: vaultPassword,
              salt
            })
            const encryptedVault = await $worker.execute('worker:encrypt_vault', {
              privateKeys: masterKeys,
              KEK
            })

            encryptionPayload.vault_salt = context.utils.$crypto.toBase64(salt)
            encryptionPayload.encrypted_master_keys = encryptedVault
          } else {
            updateStatus('Waiting for Passkey registration...')
            const { createPasskey, deriveKeyFromPasskey } = await import('../utils/cryptoUtils.js')
            const challenge = crypto.getRandomValues(new Uint8Array(32))
            const passkeyPrfSalt = crypto.getRandomValues(new Uint8Array(32))
  
            let { credentialId, prfAvailable, prfResult: KEK } = await createPasskey(username, challenge, passkeyPrfSalt)

            if (!prfAvailable) {
              throw new Error('This authenticator does not support the PRF extension required for vault encryption.')
            }

            if (!KEK) {
              updateStatus('Securing vault with Passkey (verification step)...')
              KEK = await deriveKeyFromPasskey(credentialId, challenge, passkeyPrfSalt)
            }

            const encryptedVault = await $worker.execute('worker:encrypt_vault', {
              privateKeys: masterKeys,
              KEK
            })

            encryptionPayload.passkey_credential_id = context.utils.$crypto.toBase64(credentialId)
            encryptionPayload.passkey_prf_salt = context.utils.$crypto.toBase64(passkeyPrfSalt)
            encryptionPayload.encrypted_master_keys_passkey = encryptedVault
          }

          updateStatus('Finalizing setup...')

          const payload = {
            username,
            email,
            password,
            ...encryptionPayload
          }

          // Use the custom setup hook
          const setupRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/setup`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })

          if (!setupRes.ok) {
            const errData = await setupRes.json()
            throw new Error(errData.message || 'Setup failed')
          }

          updateStatus('Setup successful! Logging in...')

          // Perform PocketBase authentication
          await pb.collection('users').authWithPassword(email, password)

          // Persist PB config for Service Worker access
          await $storage.saveConfigs([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          updateStatus('Initializing session...')

          // Initialize the crypto worker
          await $worker.execute('worker:set_token', { token: pb.authStore.token })
          await $worker.execute('worker:init_keys', {
            id: pb.authStore.model.id,
            private_box_key: masterKeys.private_box_key,
            private_sign_key: masterKeys.private_sign_key
          })

          // Start subscriptions
          await $sync.startSubscriptions()

          // Emit unlocked event
          $bus.emit('auth:unlocked', {
            keys: {
              private_box_key: masterKeys.private_box_key,
              private_sign_key: masterKeys.private_sign_key
            },
            userRecord: pb.authStore.model
          })

          // Transition to app
          $state.isFirstRun = false
          $state.isVaultUnlocked = true
          $state.isAuthenticated = true
          btnSubmit.removeAttribute('loading')
        } catch (error) {
          console.error('Setup error:', error)
          btnSubmit.removeAttribute('loading')
          updateStatus(`Error: ${error.message || 'Setup failed'}`)
        }
      })
    }
  })
</script>
