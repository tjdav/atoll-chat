<template id="vault-unlock">
  <div class="atoll-auth-card">
    
    <!-- VIEW 1: PASSWORD UNLOCK -->
    <div ref="viewPassword" class="d-flex flex-column h-100">
      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <atoll-profile ref="avatarProfile" size="3xl" class="d-inline-block mb-3"></atoll-profile>
        <h3 class="mb-1">Unlock Your Vault</h3>
        <p class="text-muted small">Your session is active, but your cryptographic keys are locked. Please enter your vault password to unlock them.</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="unlockForm" class="atoll-auth-form-zone" novalidate>
        <input type="text" ref="vaultUsernameHidden" name="username" class="visually-hidden" autocomplete="username" tabindex="-1" aria-hidden="true">
        
        <atoll-input 
          id="vaultUnlockPasswordInput"
          ref="password" 
          name="password"
          type="password"
          label="Vault Password" 
          placeholder="Enter Vault Password" 
          required="true" 
          autocomplete="current-password"
          test-id="password"
          feedback-test-id="password-feedback"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true" ref="btnUnlockSubmit" test-id="unlockSubmit">Unlock with Password</atoll-button>
          <atoll-button type="button" variant="outline" block="true" class="d-none" ref="btnPasskey">Unlock with Passkey</atoll-button>
          <atoll-button type="button" variant="ghost" block="true" ref="btnShowRecovery">Use Recovery Code</atoll-button>
          <atoll-button type="button" variant="ghost" block="true" ref="btnLogout">Logout</atoll-button>
        </div>
      </form>
    </div>

    <!-- VIEW 2: RECOVERY CODE ENTRY -->
    <div ref="viewRecovery" class="d-none flex-column h-100">
      <!-- Zone 1: Header (Top Navigation) -->
      <div class="atoll-auth-header-zone">
        <atoll-list-header variant="list" title="Recover Vault">
          <div slot="leading">
            <atoll-button type="button" variant="ghost" icon-only="true" ref="btnCancelRecovery">
              <atoll-icon name="chevron-right" style="transform: rotate(180deg); display: inline-block;"></atoll-icon>
            </atoll-button>
          </div>
        </atoll-list-header>
      </div>

      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <h3 class="mb-1">Use Recovery Code</h3>
        <p class="text-muted small">Enter one of your single-use recovery codes to recover your vault and set a new password.</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="recoveryForm" class="atoll-auth-form-zone" novalidate>
        <atoll-input 
          ref="recoveryCodeInput" 
          name="recoveryCodeInput"
          label="Recovery Code" 
          placeholder="XXXX-XXXX-XXXX" 
          required="true"
          class="text-center font-monospace fs-5"
          test-id="recoveryCodeInput"
          feedback-test-id="recoveryCodeInput-feedback"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true">Verify Recovery Code</atoll-button>
        </div>
      </form>
    </div>

    <!-- VIEW 3: FORCE NEW PASSWORD CREATION -->
    <div ref="viewNewPassword" class="d-none flex-column h-100">
      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <h3 class="mb-1">Set New Vault Password</h3>
        <p class="text-muted small">Recovery successful! Please choose a new Vault Password. This will re-encrypt your Master Key.</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="newPasswordForm" class="atoll-auth-form-zone" novalidate>
        <div>
          <atoll-input 
            ref="newPassword" 
            name="newPassword"
            type="password"
            label="New Vault Password" 
            placeholder="Enter New Password" 
            required="true"
            minlength="12"
            autocomplete="new-password"
            test-id="newPassword"
            feedback-test-id="newPassword-feedback"
          ></atoll-input>
          <div class="progress mt-2" style="height: 5px;">
            <div ref="newStrengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
          <div ref="newStrengthText" class="form-text small mt-1">Minimum 12 characters.</div>
        </div>

        <atoll-input 
          ref="newPasswordConfirm" 
          name="newPasswordConfirm"
          type="password"
          label="Confirm New Password" 
          placeholder="Confirm New Password" 
          required="true"
          minlength="12"
          autocomplete="new-password"
          test-id="newPasswordConfirm"
          feedback-test-id="newPasswordConfirm-feedback"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true" ref="btnSaveNewPassword" disabled="true">Save & Unlock Vault</atoll-button>
        </div>
      </form>
    </div>

    <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, eventBus, realtimeSync, globalStore, cryptoWorker, utils, biometric, root }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const { $worker } = cryptoWorker
      const { $crypto } = utils

      const viewPassword = refs('viewPassword')
      const viewRecovery = refs('viewRecovery')
      const viewNewPassword = refs('viewNewPassword')

      const unlockForm = refs('unlockForm')
      const passwordInput = refs('password')
      const vaultUsernameHidden = refs('vaultUsernameHidden')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout') || root.querySelector('[ref*="btnLogout"]')
      const btnPasskey = refs('btnPasskey') || root.querySelector('[ref*="btnPasskey"]')
      const avatarProfile = refs('avatarProfile')

      const btnShowRecovery = refs('btnShowRecovery') || root.querySelector('[ref*="btnShowRecovery"]')
      const btnCancelRecovery = refs('btnCancelRecovery') || root.querySelector('[ref*="btnCancelRecovery"]')
      const recoveryForm = refs('recoveryForm')
      const recoveryCodeInput = refs('recoveryCodeInput')

      const newPasswordForm = refs('newPasswordForm')
      const newPasswordInput = refs('newPassword')
      const newPasswordConfirmInput = refs('newPasswordConfirm')
      const newStrengthBar = refs('newStrengthBar')
      const newStrengthText = refs('newStrengthText')
      const btnSaveNewPassword = refs('btnSaveNewPassword') || root.querySelector('[ref*="btnSaveNewPassword"]')
      const btnUnlockSubmit = refs('btnUnlockSubmit') || root.querySelector('[ref*="btnUnlockSubmit"]')

      let decryptedMasterKeyHex = null
      let matchedWrapIndex = -1
      let fetchedRecord = null
      let decryptedKeysLocal = null
      let zxcvbnScore = 0

      // Hydrate user profile avatar if available
      const user = pb.authStore.model
      if (user && avatarProfile) {
        let avatarUrl = ''
        if (user.avatar) {
          avatarUrl = pb.files.getUrl(user, user.avatar)
        }
        avatarProfile.setAttribute('src', avatarUrl)
        if (user.id) {
          avatarProfile.setAttribute('user-id', user.id)
        }
      }

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const showGlobalAlert = (msg) => {
        if (msg) {
          $bus.emit('ui:show_toast', {
            message: msg,
            variant: 'danger'
          })
        }
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('atoll-input')
        inputs.forEach(input => {
          const isValid = input.checkValidity()
          if (!isValid) {
            input.setAttribute('invalid', 'true')
            const innerInput = input.querySelector('input')
            const validationMsg = innerInput ? innerInput.validationMessage : 'Invalid value.'
            input.setAttribute('error-message', validationMsg)
          } else {
            input.removeAttribute('invalid')
            input.removeAttribute('error-message')
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target.closest('atoll-input')
  
          if (!input) {
            return
          }
  
          if (typeof input.setCustomValidity === 'function') {
            input.setCustomValidity('')
          }
          input.removeAttribute('invalid')
          input.removeAttribute('error-message')
        })
      }

      registerInputReset(unlockForm)
      registerInputReset(recoveryForm)
      registerInputReset(newPasswordForm)

      if (btnLogout) {
        btnLogout.addEventListener('click', () => {
          pb.authStore.clear()
          $state.isAuthenticated = false
          $state.isVaultUnlocked = false
        })
      }

      const checkBiometricSupport = async () => {
        const record = pb.authStore.model
        if (record && await biometric.isAvailable()) {
          const storedKey = localStorage.getItem(`atoll_vault_wrap_${record.id}`)
          if (storedKey || record.passkey_credential_id || record.encrypted_master_keys_passkey) {
            btnPasskey?.classList.remove('d-none')
          } else {
            btnPasskey?.classList.add('d-none')
          }
        } else {
          btnPasskey?.classList.add('d-none')
        }
      }

      checkBiometricSupport()
      setTimeout(() => passwordInput?.focus(), 50)

      if (btnPasskey) {
        btnPasskey.addEventListener('click', async () => {
          try {
            showGlobalAlert('')
            updateStatus('Authenticating via passkey/biometrics...')
            const record = pb.authStore.model
            if (!record) {
              throw new Error('User not logged in.')
            }

            const masterKey = await biometric.retrieveMasterKey(record.id, record)
            if (!masterKey) {
              throw new Error('Passkey authentication failed to retrieve Master Key.')
            }

            updateStatus('Decrypting private keys...')
            const fetchedRecord = await pb.collection('users').getOne(record.id)
            const encryptedVault = fetchedRecord.encrypted_master_keys_passkey || fetchedRecord.encrypted_private_keys

            if (!encryptedVault) {
              throw new Error('Secure vault not found on server.')
            }

            const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
              encrypted_private_keys: encryptedVault,
              master_key: masterKey
            })

            await completeUnlock(decryptedKeys, fetchedRecord)
          } catch (error) {
            console.error('Biometric unlock error:', error)
            let errorMessage = 'Biometric unlock failed'
            if (error.message) {
              errorMessage = error.message
            }
            showGlobalAlert(errorMessage)
            updateStatus('')
          }
        })
      }

      if (pb.authStore.model && vaultUsernameHidden) {
        vaultUsernameHidden.value = `${pb.authStore.model.username} - Vault`
      }

      const completeUnlock = async (decryptedKeys, record) => {
        updateStatus('Vault unlocked!')

        await $worker.execute('worker:set_token', { token: pb.authStore.token })
        await $worker.execute('worker:init_keys', {
          ...decryptedKeys,
          id: record.id
        })

        $bus.emit('auth:unlocked', {
          keys: decryptedKeys,
          userRecord: record
        })

        try {
          await $sync.startSubscriptions()
          $state.isVaultUnlocked = true
        } catch (err) {
          console.error('[vault-unlock] Subscription/Sync failed:', err)
          showGlobalAlert('Error: Failed to synchronize data. Please try again.')
          updateStatus('')
        }
      }

      unlockForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(unlockForm)

        if (!unlockForm.checkValidity()) {
          event.stopPropagation()
          unlockForm.classList.add('was-validated')
          return
        }

        const password = passwordInput.value

        try {
          unlockForm.classList.remove('was-validated')
          updateStatus('Locating vault...')
          btnUnlockSubmit?.setAttribute('loading', 'true')
          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const { vault_salt: saltBase64, encrypted_master_keys: encryptedMasterKeys, encrypted_private_keys: encryptedPrivateKeys } = record

          if (!encryptedMasterKeys) {
            passwordInput.setCustomValidity('Error: Secure vault not found on server.')
            updateValidationFeedback(unlockForm)
            unlockForm.classList.add('was-validated')
            updateStatus('')
            btnUnlockSubmit?.removeAttribute('loading')
            return
          }

          /* We enforce a strict clean break: V2 vault is required */
          if (!encryptedPrivateKeys) {
            throw new Error('This account is using an outdated vault scheme. Please register a new account.')
          }

          updateStatus('Deriving KEK...')
          const KEK = await $worker.execute('worker:derive_key_from_password', {
            password,
            salt: saltBase64
          })

          updateStatus('Decrypting Master Key...')
          const masterKey = await $worker.execute('worker:crypto_secretbox_open_easy', {
            ciphertext: encryptedMasterKeys.ciphertext,
            nonce: encryptedMasterKeys.nonce,
            key: KEK
          })

          if (!masterKey) {
            throw new Error('Invalid Vault Password')
          }

          updateStatus('Decrypting private keys...')
          const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
            encrypted_private_keys: encryptedPrivateKeys,
            master_key: masterKey
          })

          await completeUnlock(decryptedKeys, record)
          btnUnlockSubmit?.removeAttribute('loading')
        } catch (error) {
          console.error('Unlock error:', error)
          btnUnlockSubmit?.removeAttribute('loading')
          let errorMessage = 'Unlock failed'
  
          if (error.message && error.message.includes('decrypt')) {
            errorMessage = 'Invalid Password or Corrupt Vault'
          } else if (error.message) {
            errorMessage = error.message
          }
  
          if (error.status && error.status >= 500) {
            showGlobalAlert(errorMessage)
          } else {
            passwordInput.setAttribute('invalid', 'true')
            passwordInput.setAttribute('error-message', errorMessage)
            passwordInput.setCustomValidity(errorMessage)
            updateValidationFeedback(unlockForm)
            unlockForm.classList.add('was-validated')
          }
          updateStatus('')
        }
      })

      if (btnShowRecovery) {
        btnShowRecovery.addEventListener('click', () => {
          viewPassword.classList.add('d-none')
          viewPassword.classList.remove('d-flex')
          viewRecovery.classList.remove('d-none')
          viewRecovery.classList.add('d-flex')
          updateStatus('')
          showGlobalAlert('')
          recoveryForm.classList.remove('was-validated')
          recoveryCodeInput.setCustomValidity('')
          recoveryCodeInput.removeAttribute('invalid')
          recoveryCodeInput.removeAttribute('error-message')
        })
      }

      if (btnCancelRecovery) {
        btnCancelRecovery.addEventListener('click', () => {
          viewRecovery.classList.add('d-none')
          viewRecovery.classList.remove('d-flex')
          viewPassword.classList.remove('d-none')
          viewPassword.classList.add('d-flex')
          updateStatus('')
          showGlobalAlert('')
          unlockForm.classList.remove('was-validated')
          passwordInput.setCustomValidity('')
          passwordInput.removeAttribute('invalid')
          passwordInput.removeAttribute('error-message')
        })
      }

      recoveryForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(recoveryForm)

        if (!recoveryForm.checkValidity()) {
          e.stopPropagation()
          recoveryForm.classList.add('was-validated')
          return
        }

        const code = recoveryCodeInput.value.trim()

        try {
          recoveryForm.classList.remove('was-validated')
          updateStatus('Fetching account details...')
          fetchedRecord = await pb.collection('users').getOne(pb.authStore.model.id)
          const { recovery_wraps: recoveryWraps, encrypted_private_keys: encryptedPrivateKeys } = fetchedRecord

          if (!recoveryWraps || recoveryWraps.length === 0) {
            throw new Error('No recovery codes configured for this account.')
          }

          updateStatus('Verifying recovery code...')
          let decryptedMasterKey = null
          matchedWrapIndex = -1

          /* Find matching recovery wrap by attempting decryption on all of them */
          for (let i = 0; i < recoveryWraps.length; i++) {
            try {
              decryptedMasterKey = await $worker.execute('worker:decrypt_master_key_with_code', {
                code,
                wrap: recoveryWraps[i]
              })
              if (decryptedMasterKey) {
                matchedWrapIndex = i
                break
              }
            } catch {
              /* Keep searching */
            }
          }

          if (!decryptedMasterKey) {
            throw new Error('Invalid or expired recovery code.')
          }

          if (!encryptedPrivateKeys) {
            throw new Error('This account is missing vault key data. Please re-initialize your vault.')
          }

          decryptedMasterKeyHex = decryptedMasterKey

          updateStatus('Decrypting private keys...')
          decryptedKeysLocal = await $worker.execute('worker:decrypt_vault', {
            encrypted_private_keys: encryptedPrivateKeys,
            master_key: decryptedMasterKeyHex
          })

          /* Transition to new password setup */
          viewRecovery.classList.add('d-none')
          viewRecovery.classList.remove('d-flex')
          viewNewPassword.classList.remove('d-none')
          viewNewPassword.classList.add('d-flex')
          updateStatus('Code verified! Please set a new password.')
          newPasswordForm.classList.remove('was-validated')
          newPasswordInput.setCustomValidity('')
          newPasswordConfirmInput.setCustomValidity('')
          newPasswordInput.removeAttribute('invalid')
          newPasswordInput.removeAttribute('error-message')
          newPasswordConfirmInput.removeAttribute('invalid')
          newPasswordConfirmInput.removeAttribute('error-message')
        } catch (err) {
          console.error('Recovery failed:', err)
          if (err.status && err.status >= 500) {
            showGlobalAlert(err.message || 'Recovery failed.')
          } else {
            recoveryCodeInput.setAttribute('invalid', 'true')
            recoveryCodeInput.setAttribute('error-message', err.message || 'Recovery failed.')
            recoveryCodeInput.setCustomValidity(err.message || 'Recovery failed.')
            updateValidationFeedback(recoveryForm)
            recoveryForm.classList.add('was-validated')
          }
          updateStatus('')
        }
      })

      const updateNewStrength = async () => {
        const password = newPasswordInput.value
        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score, width, colorClass, text } = await evaluatePasswordStrength(password, 12)
        zxcvbnScore = score
        newStrengthBar.style.width = width
        newStrengthBar.className = colorClass
        newStrengthText.textContent = text
        if (password.length < 12 || zxcvbnScore < 3) {
          btnSaveNewPassword?.setAttribute('disabled', 'true')
        } else {
          btnSaveNewPassword?.removeAttribute('disabled')
        }
      }

      newPasswordInput.addEventListener('input', updateNewStrength)

      newPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')

        const newPassword = newPasswordInput.value
        const newPasswordConfirm = newPasswordConfirmInput.value

        if (newPassword.length < 12) {
          newPasswordInput.setCustomValidity('Password must be at least 12 characters.')
        } else if (zxcvbnScore < 3) {
          newPasswordInput.setCustomValidity('Password is too weak. Please use a stronger password.')
        } else {
          newPasswordInput.setCustomValidity('')
        }

        if (newPassword !== newPasswordConfirm) {
          newPasswordConfirmInput.setCustomValidity('Passwords do not match.')
        } else {
          newPasswordConfirmInput.setCustomValidity('')
        }

        updateValidationFeedback(newPasswordForm)

        if (!newPasswordForm.checkValidity()) {
          e.stopPropagation()
          newPasswordForm.classList.add('was-validated')
          return
        }

        try {
          newPasswordForm.classList.remove('was-validated')
          updateStatus('Deriving new vault password KEK...')
          btnSaveNewPassword?.setAttribute('loading', 'true')
          const newSalt = await $worker.execute('worker:randombytes_buf', { length: 16 })
          const KEK = await $worker.execute('worker:derive_key_from_password', {
            password: newPassword,
            salt: newSalt
          })

          updateStatus('Re-encrypting Master Key...')
          const newPasswordWrap = await $worker.execute('worker:encrypt_master_key_with_kek', {
            master_key: decryptedMasterKeyHex,
            KEK
          })

          /* Client-Side Purge of the matched recovery code wrap */
          const remainingWraps = [...fetchedRecord.recovery_wraps]
          if (matchedWrapIndex !== -1) {
            remainingWraps.splice(matchedWrapIndex, 1)
          }

          updateStatus('Updating vault configuration on server...')
          await pb.collection('users').update(fetchedRecord.id, {
            vault_salt: $crypto.toBase64(newSalt),
            encrypted_master_keys: newPasswordWrap,
            recovery_wraps: remainingWraps
          })

          /* Perform auth refresh to sync changes */
          const refreshedRecord = await pb.collection('users').authRefresh()

          await completeUnlock(decryptedKeysLocal, refreshedRecord.record)
          btnSaveNewPassword?.removeAttribute('loading')
        } catch (err) {
          console.error('Password rotation failed:', err)
          btnSaveNewPassword?.removeAttribute('loading')
          showGlobalAlert(err.message || 'Password rotation failed.')
          updateStatus('')
        }
      })
    }
  })
</script>
