<template id="totp-challenge">
  <div class="atoll-auth-card">
    <!-- Zone 2: Hero Greeting -->
    <div class="atoll-auth-hero-zone">
      <atoll-profile size="3xl" class="d-inline-block mb-3"></atoll-profile>
      <h3 class="mb-1">Two-Step Verification</h3>
      <p class="text-muted small">This device is unrecognized. Please enter the 6-digit code from your authenticator app to authorize this session.</p>
    </div>

    <!-- Zone 3: Form Input Zone -->
    <form ref="challengeForm" class="atoll-auth-form-zone" novalidate>
      <atoll-input 
        ref="otpInput" 
        name="otpInput"
        label="Verification Code" 
        placeholder="000000" 
        required="true" 
        maxlength="6"
        pattern="\d{6}"
        test-id="totpChallengeInput"
        feedback-test-id="totpChallenge-feedback"
      ></atoll-input>

      <!-- Zone 4: Bottom Action Zone -->
      <div class="atoll-auth-bottom-zone">
        <atoll-button type="submit" variant="primary" block="true" ref="btnVerify" test-id="totpChallengeSubmit">Verify Code</atoll-button>
        <atoll-button type="button" variant="ghost" block="true" ref="btnLogout">Logout</atoll-button>
      </div>
    </form>

    <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, eventBus, globalStore, totp, root }) => {
      /* SHA-256 Generator Helper */
      async function sha256 (text) {
        const msgUint8 = new TextEncoder().encode(text)
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
        const hashArray = Array.from(new Uint8Array(hashBuffer))
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
      }

      const { pb, auth } = pocketbase
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $totp } = await totp

      const challengeForm = refs('challengeForm')
      const otpInput = refs('otpInput')
      const btnVerify = refs('btnVerify') || root.querySelector('[ref*="btnVerify"]')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout') || root.querySelector('[ref*="btnLogout"]')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const showGlobalAlert = (msg) => {
        if (msg) {
          $bus.emit('ui:show_toast', {
            message: msg,
            variant: 'danger'
          })
        }
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('atoll-input')
        inputs.forEach(input => {
          const isValid = input.checkValidity()
          if (!isValid) {
            input.setAttribute('invalid', 'true')
            const innerInput = input.shadowRoot ? input.shadowRoot.querySelector('input') : null
            const validationMsg = innerInput ? innerInput.validationMessage : 'Invalid value.'
            input.setAttribute('error-message', validationMsg)
          } else {
            input.removeAttribute('invalid')
            input.removeAttribute('error-message')
          }
        })
      }

      challengeForm.addEventListener('input', (e) => {
        const input = e.target.closest('atoll-input')
  
        if (!input) {
          return
        }

        input.removeAttribute('invalid')
        input.removeAttribute('error-message')
        updateStatus('')
      })

      if (btnLogout) {
        btnLogout.addEventListener('click', () => {
          if (auth) {
            auth.logout()
          } else {
            pb.authStore.clear()
          }
          $state.isAuthenticated = false
          $state.isVaultUnlocked = false
        })
      }

      challengeForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(challengeForm)

        if (!challengeForm.checkValidity()) {
          e.stopPropagation()
          challengeForm.classList.add('was-validated')
          return
        }

        const code = otpInput.value.trim()

        challengeForm.classList.remove('was-validated')
        updateStatus('Verifying code...')
        btnVerify?.setAttribute('loading', 'true')

        try {
          const user = await pb.collection('users').getOne(pb.authStore.model.id)
          const isValid = await $totp.verify(code, user.totp_secret)

          if (!isValid) {
            throw new Error('Invalid verification code. Please try again.')
          }

          updateStatus('Authorizing device...')

          /* Generate device trust token and register its hash */
          const deviceToken = crypto.randomUUID()
          const hashHex = await sha256(deviceToken)
  
          const currentHashes = user.trusted_device_hashes || []
          const updatedHashes = [...currentHashes, hashHex]

          await pb.collection('users').update(user.id, {
            trusted_device_hashes: updatedHashes
          })

          /* Save trust token locally */
          localStorage.setItem('device_trust_token', deviceToken)

          await pb.collection('users').authRefresh()

          updateStatus('Device authorized!')
          $bus.emit('auth:totp_passed')
        } catch (err) {
          console.error('TOTP challenge verification failed:', err)
          showGlobalAlert(err.message || 'Verification failed.')
          otpInput.setAttribute('invalid', 'true')
          otpInput.setAttribute('error-message', err.message || 'Invalid verification code.')
          btnVerify?.removeAttribute('loading')
          updateStatus('')
        }
      })
    }
  })
</script>
