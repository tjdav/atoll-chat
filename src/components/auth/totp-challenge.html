<template id="totp-challenge">
  <div class="card shadow">
    <div class="card-body p-4 text-center">
      <h3 class="card-title mb-3">Two-Step Verification</h3>
      <p class="text-muted small mb-4">This device is unrecognized. Please enter the 6-digit code from your authenticator app to authorize this session.</p>
      
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <form ref="challengeForm" class="text-start needs-validation" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-bold">Verification Code</label>
          <input type="text" class="form-control text-center fs-4 font-monospace" ref="otpInput" id="{{ ref_otpInput }}" required placeholder="000000" maxlength="6" pattern="\d{6}" data-testid="totpChallengeInput" aria-describedby="{{ ref_totpChallengeFeedback }}" aria-invalid="false">
          <div id="{{ ref_totpChallengeFeedback }}" class="invalid-feedback" data-testid="totpChallenge-feedback" aria-live="polite"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100" ref="btnVerify" data-testid="totpChallengeSubmit">Verify Code</button>
      </form>

      <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
      <div class="mt-3">
        <button type="button" class="btn btn-link btn-sm text-decoration-none" ref="btnLogout">Logout</button>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, eventBus, globalStore, totp }) => {
      /* SHA-256 Generator Helper */
      async function sha256 (text) {
        const msgUint8 = new TextEncoder().encode(text)
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
        const hashArray = Array.from(new Uint8Array(hashBuffer))
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
      }

      const { pb, auth } = pocketbase
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $totp } = await totp

      const challengeForm = refs('challengeForm')
      const otpInput = refs('otpInput')
      const btnVerify = refs('btnVerify')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')
      const globalAlert = refs('globalAlert')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        const ariaDescribedBy = input.getAttribute('aria-describedby')
        if (ariaDescribedBy) {
          const target = document.getElementById(ariaDescribedBy)
          if (target) {
            return target
          }
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      challengeForm.addEventListener('input', (e) => {
        const input = e.target
        if (input.setCustomValidity) {
          input.setCustomValidity('')
        }
        const feedback = getFeedbackElement(input)
        if (feedback) {
          feedback.textContent = input.validationMessage
        }
      })

      btnLogout.addEventListener('click', () => {
        auth.logout()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      challengeForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(challengeForm)

        if (!challengeForm.checkValidity()) {
          e.stopPropagation()
          challengeForm.classList.add('was-validated')
          return
        }

        const code = otpInput.value.trim()

        challengeForm.classList.remove('was-validated')
        updateStatus('Verifying code...')
        btnVerify.disabled = true

        try {
          const user = await pb.collection('users').getOne(pb.authStore.model.id)
          const isValid = await $totp.verify(code, user.totp_secret)

          if (!isValid) {
            throw new Error('Invalid verification code. Please try again.')
          }

          updateStatus('Authorizing device...')

          /* Generate device trust token and register its hash */
          const deviceToken = crypto.randomUUID()
          const hashHex = await sha256(deviceToken)
  
          const currentHashes = user.trusted_device_hashes || []
          const updatedHashes = [...currentHashes, hashHex]

          await pb.collection('users').update(user.id, {
            trusted_device_hashes: updatedHashes
          })

          /* Save trust token locally */
          localStorage.setItem('device_trust_token', deviceToken)

          await pb.collection('users').authRefresh()

          updateStatus('Device authorized!')
          $bus.emit('auth:totp_passed')
        } catch (err) {
          console.error('TOTP challenge verification failed:', err)
          if (err.status && err.status >= 500) {
            showGlobalAlert(err.message || 'Verification failed.')
          } else {
            otpInput.setCustomValidity(err.message || 'Invalid verification code.')
            updateValidationFeedback(challengeForm)
            challengeForm.classList.add('was-validated')
          }
          btnVerify.disabled = false
          updateStatus('')
        }
      })
    }
  })
</script>
