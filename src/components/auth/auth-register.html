<template id="auth-register">
  <div class="card shadow">
    <div class="card-body p-4">
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <form ref="registerForm" class="needs-validation" novalidate>
        <h3 class="card-title mb-4 text-center">Create Account</h3>
        <div class="mb-3">
          <label for="{{ ref_username }}" class="form-label">Username</label>
          <input name="username" ref="username" id="{{ ref_username }}" type="text" class="form-control" placeholder="Choose a username" minlength="3" maxlength="20" pattern="^[a-zA-Z0-9_]+$" required autocomplete="username" aria-describedby="{{ ref_usernameFeedback }}" aria-invalid="false">
          <div id="{{ ref_usernameFeedback }}" class="invalid-feedback" data-testid="username-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3">
          <label for="{{ ref_email }}" class="form-label">Email</label>
          <input name="email" ref="email" id="{{ ref_email }}" type="email" class="form-control" placeholder="Enter your email" required autocomplete="email" aria-describedby="{{ ref_emailFeedback }}" aria-invalid="false">
          <div id="{{ ref_emailFeedback }}" class="invalid-feedback" data-testid="email-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3">
          <label for="{{ ref_password }}" class="form-label">Password</label>
          <div class="password-field-container">
            <input name="password" ref="password" id="{{ ref_password }}" type="password" class="form-control" placeholder="Enter Password" minlength="8" required autocomplete="new-password" data-testid="password" aria-describedby="{{ ref_passwordFeedback }}" aria-invalid="false">
            <button type="button" class="password-toggle focus-ring" ref="passwordToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div id="{{ ref_passwordFeedback }}" class="invalid-feedback" data-testid="password-feedback" aria-live="polite"></div>
          <div class="progress mt-2" style="height: 5px;">
            <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
          <div ref="strengthText" class="form-text small mt-1">Minimum 8 characters.</div>
        </div>
        <div class="mb-3">
          <label for="{{ ref_passwordConfirm }}" class="form-label">Confirm Password</label>
          <div class="password-field-container">
            <input name="passwordConfirm" ref="passwordConfirm" id="{{ ref_passwordConfirm }}" type="password" class="form-control" placeholder="Confirm Password" minlength="8" required autocomplete="new-password" aria-describedby="{{ ref_passwordConfirmFeedback }}" aria-invalid="false">
            <button type="button" class="password-toggle focus-ring" ref="passwordConfirmToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div id="{{ ref_passwordConfirmFeedback }}" class="invalid-feedback" data-testid="password-confirm-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3 d-flex justify-content-center" ref="altchaContainer"></div>
        <atoll-button type="submit" variant="primary" block="true" ref="btnSubmit" data-testid="registerSubmit">Register & Log In</atoll-button>
      </form>
      <div class="mt-3 text-center">
        <small class="text-muted">Already have an account? <a href="#" ref="linkLogin" data-testid="linkLogin" class="text-decoration-none">Login here</a></small>
      </div>
      <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, config, bootstrap, cryptoWorker, eventBus, utils }) => {
      const { pb } = pocketbase
      const { $url } = utils
      const { $storage } = storage
      const { $state } = globalStore
      const { $config } = config
      const { $worker } = cryptoWorker
      const { $bus } = eventBus

      const registerForm = refs('registerForm')
      const altchaContainer = refs('altchaContainer')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const emailInput = refs('email')
      const passwordInput = refs('password')
      const passwordConfirmInput = refs('passwordConfirm')
      const passwordToggle = refs('passwordToggle')
      const passwordConfirmToggle = refs('passwordConfirmToggle')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const globalAlert = refs('globalAlert')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')
      // eslint-disable-next-line no-unused-vars
      let zxcvbnScore = 0

      let altchaWidget = null
      let registerSubmitPending = false
      let altchaPayload = null

      const isTesting = import.meta.env.MODE === 'testing'

      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        const ariaDescribedBy = input.getAttribute('aria-describedby')
        if (ariaDescribedBy) {
          const target = document.getElementById(ariaDescribedBy)
          if (target) {
            return target
          }
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          const isValid = input.checkValidity()
          input.setAttribute('aria-invalid', isValid ? 'false' : 'true')
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target
          if (input.setCustomValidity) {
            input.setCustomValidity('')
          }
          const isValid = input.checkValidity()
          input.setAttribute('aria-invalid', isValid ? 'false' : 'true')
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage
          }
          updateStatus('')
        })
      }

      registerInputReset(registerForm)

      const updateStrength = async () => {
        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score, width, colorClass, text } = await evaluatePasswordStrength(passwordInput.value, 8)
        zxcvbnScore = score
        strengthBar.style.width = width
        strengthBar.className = colorClass
        strengthText.textContent = text
      }

      passwordInput.addEventListener('input', updateStrength)

      const setupToggle = (input, toggle) => {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          const icon = toggle.querySelector('i')
          icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'
        })
      }
      setupToggle(passwordInput, passwordToggle)
      setupToggle(passwordConfirmInput, passwordConfirmToggle)

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      if (altchaContainer) {
  
        btnSubmit.removeAttribute('loading')
        btnSubmit.removeAttribute('disabled')

        altchaWidget = document.createElement('altcha-widget')
        altchaWidget.setAttribute('display', 'invisible')
        altchaWidget.setAttribute('auto', 'off')
        altchaWidget.style.width = '100%'
        altchaWidget.style.maxWidth = '100%'
  
        const configObj = {}
        if (isTesting) {
          altchaWidget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          altchaWidget.setAttribute('challenge', pb.buildURL('/api/altcha/challenge'))
          configObj.challenge = pb.buildURL('/api/altcha/challenge')
        }
        altchaWidget.setAttribute('configuration', JSON.stringify(configObj))

        altchaWidget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || null
          console.log('[ALTCHA REGISTER DEBUG] verified event payload:', altchaPayload)
        })

        altchaWidget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          console.log('[ALTCHA REGISTER DEBUG]', 'state:', state, 'value:', altchaWidget.value, 'payload:', ev.detail?.payload)
          if (state === 'verifying') {
            altchaPayload = null
            btnSubmit.setAttribute('loading', 'true')
          } else if (state === 'verified') {
            if (ev.detail?.payload) {
              altchaPayload = ev.detail.payload
            }
            btnSubmit.removeAttribute('loading')
            if (registerSubmitPending) {
              registerSubmitPending = false
              if (typeof registerForm.requestSubmit === 'function') {
                registerForm.requestSubmit()
              } else {
                registerForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            btnSubmit.removeAttribute('loading')
          } else if (state === 'error') {
            altchaPayload = null
            btnSubmit.removeAttribute('loading')
            updateStatus('Security challenge failed. Please try again.', true)
            registerSubmitPending = false
          }
        })

        altchaContainer.appendChild(altchaWidget)
      }

      const handleSuccessfulLogin = async () => {
        await $storage.saveConfigs([
          {
            key: 'pb_url',
            value: pb.baseUrl
          },
          {
            key: 'pb_token',
            value: pb.authStore.token
          }
        ])

        updateStatus('Login successful! Loading secure vault setup...')
        $state.isAuthenticated = true
      }

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        // Clear all custom validities first
        usernameInput.setCustomValidity('')
        emailInput.setCustomValidity('')
        passwordInput.setCustomValidity('')
        passwordConfirmInput.setCustomValidity('')
        updateStatus('')

        const inputs = [usernameInput, emailInput, passwordInput, passwordConfirmInput]
        let isValid = true
        inputs.forEach(input => {
          if (!input.checkValidity()) {
            isValid = false
          }
        })

        updateValidationFeedback(registerForm)

        if (!isValid) {
          event.stopPropagation()
          registerForm.classList.add('was-validated')
          return
        }

        const username = usernameInput.value
        const email = emailInput.value
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password !== passwordConfirm) {
          passwordConfirmInput.setCustomValidity('Passwords do not match')
          updateValidationFeedback(registerForm)
          registerForm.classList.add('was-validated')
          return
        }

        let currentPayload = altchaPayload
        if (altchaWidget && altchaWidget.value) {
          currentPayload = altchaWidget.value
        }
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        if (!currentPayload) {
          if (altchaWidget) {
            registerSubmitPending = true
            altchaWidget.verify()
          }
          return
        }

        try {
          registerForm.classList.remove('was-validated')
          updateStatus('Checking availability...')
  
          const params = new URLSearchParams({
            username,
            email
          })
  
          const availabilityRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/check-availability?${params}`)).then(r => r.json())

          if (availabilityRes.usernameExists) {
            usernameInput.setCustomValidity('Username is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          if (availabilityRes.emailExists) {
            emailInput.setCustomValidity('Email is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          updateStatus('Creating account...')

          const regRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/register`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username,
              email,
              password,
              passwordConfirm,
              altcha: currentPayload
            })
          })

          if (!regRes.ok) {
            const errData = await regRes.json()
            throw new Error(errData.error || 'Registration failed')
          }

          updateStatus('Logging you in...')
          const authData = await regRes.json()

          pb.authStore.save(authData.token, authData.record)
          await handleSuccessfulLogin()
        } catch (error) {
          console.error('Registration error:', error)
          updateStatus(error.message || 'Registration failed', true)
          if (altchaWidget && typeof altchaWidget.reset === 'function') {
            altchaWidget.reset()
          }
        }
      })
    }
  })
</script>
