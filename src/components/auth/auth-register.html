<template id="auth-register">
  <div class="card shadow">
    <div class="card-body p-4">
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <form ref="registerForm" class="needs-validation" novalidate>
        <div ref="step1">
          <h3 class="card-title mb-4 text-center">Create Account</h3>
          <div class="mb-3">
            <label for="{{ ref_username }}" class="form-label">Username</label>
            <input name="username" ref="username" id="{{ ref_username }}" type="text" class="form-control" placeholder="Choose a username" minlength="3" maxlength="20" pattern="^[a-zA-Z0-9_]+$" required autocomplete="username">
            <div class="invalid-feedback" data-testid="username-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="{{ ref_email }}" class="form-label">Email</label>
            <input name="email" ref="email" id="{{ ref_email }}" type="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
            <div class="invalid-feedback" data-testid="email-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="{{ ref_password }}" class="form-label">Password</label>
            <div class="password-field-container">
              <input name="password" ref="password" id="{{ ref_password }}" type="password" class="form-control" placeholder="Enter Password" minlength="8" required autocomplete="new-password" data-testid="password">
              <button type="button" class="password-toggle focus-ring" ref="passwordToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" data-testid="password-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="{{ ref_passwordConfirm }}" class="form-label">Confirm Password</label>
            <div class="password-field-container">
              <input name="passwordConfirm" ref="passwordConfirm" id="{{ ref_passwordConfirm }}" type="password" class="form-control" placeholder="Confirm Password" minlength="8" required autocomplete="new-password">
              <button type="button" class="password-toggle focus-ring" ref="passwordConfirmToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" data-testid="password-confirm-feedback"></div>
          </div>
          <div class="mb-3 d-flex justify-content-center" ref="altchaContainer"></div>
          <button type="submit" class="btn btn-primary w-100" ref="btnSubmit" data-testid="registerSubmit">Register & Log In</button>
        </div>
      </form>
      <div class="mt-3 text-center" ref="loginLinkContainer">
        <small class="text-muted">Already have an account? <a href="#" ref="linkLogin" data-testid="linkLogin" class="text-decoration-none">Login here</a></small>
      </div>
      <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>

      <!-- Island Switcher Dropdown (visible if Islands mode is active) -->
      <div class="mt-4 border-top pt-3 text-center" ref="islandSwitcherContainer" data-testid="islandSwitcherContainer" hidden>
        <div class="dropdown">
          <button class="btn btn-link btn-sm text-secondary text-decoration-none dropdown-toggle d-inline-flex align-items-center gap-1"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  ref="islandSelectBtn"
                  data-testid="islandSelectBtn">
            <span ref="currentIslandLabel">Current Island: Loading...</span>
          </button>
          <ul class="dropdown-menu shadow dropdown-menu-dark p-0 overflow-hidden" style="min-width: 240px;" ref="islandsDropdownMenu" data-testid="islandsDropdownMenu">
            <li class="dropdown-header px-3 py-2">Your Islands</li>
            <div ref="islandsList" data-testid="islandsList"></div>
            <li><hr class="dropdown-divider m-0"></li>
            <li>
              <button class="dropdown-item d-flex align-items-center gap-2 py-2 px-3" ref="btnChartNewIsland" data-testid="btnChartNewIsland">
                <i class="bi bi-compass"></i>
                <span>Chart New Island</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, config, bootstrap, cryptoWorker, eventBus, utils }) => {
      const { pb } = pocketbase
      const { $url } = utils
      const { $storage } = storage
      const { $state } = globalStore
      const { $config } = config
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { Dropdown } = await bootstrap

      const registerForm = refs('registerForm')
      const altchaContainer = refs('altchaContainer')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const emailInput = refs('email')
      const passwordInput = refs('password')
      const passwordConfirmInput = refs('passwordConfirm')
      const passwordToggle = refs('passwordToggle')
      const passwordConfirmToggle = refs('passwordConfirmToggle')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const globalAlert = refs('globalAlert')

      const islandSwitcherContainer = refs('islandSwitcherContainer')
      const islandSelectBtn = refs('islandSelectBtn')
      const currentIslandLabel = refs('currentIslandLabel')
      const islandsListContainer = refs('islandsList')
      const btnChartNewIsland = refs('btnChartNewIsland')

      let dropdownInstance = null
      let altchaWidget = null
      let registerSubmitPending = false
      let altchaPayload = null

      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        let sibling = input.nextElementSibling
        while (sibling) {
          if (sibling.classList.contains('invalid-feedback')) {
            return sibling
          }
          sibling = sibling.nextElementSibling
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target
          if (input.setCustomValidity) {
            input.setCustomValidity('')
          }
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage
          }
          updateStatus('')
        })
      }

      registerInputReset(registerForm)

      const setupToggle = (input, toggle) => {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          const icon = toggle.querySelector('i')
          icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'
        })
      }
      setupToggle(passwordInput, passwordToggle)
      setupToggle(passwordConfirmInput, passwordConfirmToggle)

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      if (altchaContainer) {
        const isTesting = typeof window !== 'undefined' && (window.__coralite__?.mode === 'testing' || (window.__playwright_test_id__ && window.__coralite__?.mode !== 'production'))
  
        if (!btnSubmit._originalHtml) {
          btnSubmit._originalHtml = btnSubmit.innerHTML
        }
        btnSubmit.disabled = false

        altchaWidget = document.createElement('altcha-widget')
        altchaWidget.setAttribute('display', 'invisible')
        altchaWidget.setAttribute('auto', 'off')
        altchaWidget.style.width = '100%'
        altchaWidget.style.maxWidth = '100%'
  
        const configObj = {}
        if (isTesting) {
          altchaWidget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          altchaWidget.setAttribute('challenge', pb.buildURL('/api/altcha/challenge'))
          configObj.challenge = pb.buildURL('/api/altcha/challenge')
        }
        altchaWidget.setAttribute('configuration', JSON.stringify(configObj))

        altchaWidget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || null
          console.log('[ALTCHA REGISTER DEBUG] verified event payload:', altchaPayload)
        })

        altchaWidget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          console.log('[ALTCHA REGISTER DEBUG]', 'state:', state, 'value:', altchaWidget.value, 'payload:', ev.detail?.payload)
          if (state === 'verifying') {
            altchaPayload = null
            btnSubmit.disabled = true
            btnSubmit.innerHTML = `
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              <span role="status">Verifying security challenge...</span>
            `
          } else if (state === 'verified') {
            if (ev.detail?.payload) {
              altchaPayload = ev.detail.payload
            }
            btnSubmit.disabled = false
            btnSubmit.innerHTML = btnSubmit._originalHtml
            if (registerSubmitPending) {
              registerSubmitPending = false
              if (typeof registerForm.requestSubmit === 'function') {
                registerForm.requestSubmit()
              } else {
                registerForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            btnSubmit.disabled = false
            btnSubmit.innerHTML = btnSubmit._originalHtml
          } else if (state === 'error') {
            altchaPayload = null
            btnSubmit.disabled = false
            btnSubmit.innerHTML = btnSubmit._originalHtml
            updateStatus('Security challenge failed. Please try again.', true)
            registerSubmitPending = false
          }
        })

        altchaContainer.appendChild(altchaWidget)
      }

      const isIslandsEnabled = $config?.get('enableWorkspaces') || window.__coralite_workspaces_override__ || false
  
      const handleSwitchIsland = async (newId, force = false) => {
        if (pb.authStore.activeWorkspaceId === newId && !force) {
          return
        }

        $state.activeSelectionId = null
        $state.activeSelectionType = null

        pb.authStore.setActiveWorkspace(newId)
        const active = pb.authStore.workspaces.find(w => w.id === newId)
        pb.baseUrl = active ? active.url : ''

        const contextRes = await $worker.execute('worker:set_workspace_context', {
          workspaceId: newId,
          baseUrl: pb.baseUrl
        })

        await $storage.initialize('AtollChatDB_' + newId)

        $state.isAuthenticated = pb.authStore.isValid
        $state.currentUser = pb.authStore.model

        if ($state.isAuthenticated) {
          if (contextRes.isInitialized) {
            $state.isVaultUnlocked = true
            $bus.emit('auth:unlocked', {
              keys: {
                private_box_key: contextRes.private_box_key,
                private_sign_key: contextRes.private_sign_key
              },
              userRecord: pb.authStore.model
            })
            $bus.emit('sync:complete')
          } else {
            $state.isVaultUnlocked = false
          }
        } else {
          $state.isVaultUnlocked = false
          $state.authView = 'login'
        }

        $state.activeIslandId = newId
        $state.islands = pb.authStore.workspaces || []

        renderIslandsDropdownList()

        $bus.emit('ui:show_toast', {
          message: `Switched to Island: ${active ? active.name : 'Island'}`,
          type: 'success'
        })
      }

      const renderIslandsDropdownList = () => {
        if (!islandsListContainer) {
          return
        }
        islandsListContainer.innerHTML = ''
        if (!isIslandsEnabled) {
          return
        }

        const activeId = pb.authStore.activeWorkspaceId
        const list = pb.authStore.workspaces || []
        const active = list.find(w => w.id === activeId)
  
        currentIslandLabel.textContent = `Current Island: ${active ? active.name : 'Unknown'}`

        list.forEach(w => {
          const isActive = w.id === activeId
          const initials = w.name ? w.name.slice(0, 2).toUpperCase() : 'IS'

          const li = document.createElement('li')
          const btn = document.createElement('button')
          btn.className = `dropdown-item d-flex align-items-center justify-content-between gap-3 py-2 px-3 ${isActive ? 'active' : ''}`
          btn.setAttribute('data-id', w.id)
          btn.setAttribute('data-testid', `workspace-btn-${w.id}`)
          if (isActive) {
            btn.style.fontWeight = 'bold'
          }

          const leftContainer = document.createElement('div')
          leftContainer.className = 'd-flex align-items-center gap-2'

          const badge = document.createElement('div')
          badge.className = 'rounded-circle d-flex align-items-center justify-content-center text-white font-weight-bold'
          badge.style.width = '24px'
          badge.style.height = '24px'
          badge.style.fontSize = '10px'
          badge.style.backgroundColor = isActive ? 'var(--bs-primary)' : 'var(--bs-secondary)'
          badge.textContent = initials

          const nameSpan = document.createElement('span')
          nameSpan.textContent = w.name || 'Island'

          leftContainer.appendChild(badge)
          leftContainer.appendChild(nameSpan)
          btn.appendChild(leftContainer)

          if (isActive) {
            const check = document.createElement('i')
            check.className = 'bi bi-check-lg'
            btn.appendChild(check)
          }

          btn.addEventListener('click', async (e) => {
            e.stopPropagation()
            if (dropdownInstance) {
              dropdownInstance.hide()
            }
            await handleSwitchIsland(w.id)
          })

          li.appendChild(btn)
          islandsListContainer.appendChild(li)
        })
      }

      if (isIslandsEnabled) {
        islandSwitcherContainer.removeAttribute('hidden')
        if (islandSelectBtn) {
          dropdownInstance = new Dropdown(islandSelectBtn)
        }
        renderIslandsDropdownList()

        if (btnChartNewIsland) {
          btnChartNewIsland.addEventListener('click', () => {
            if (dropdownInstance) {
              dropdownInstance.hide()
            }
            $bus.emit('ui:open_chart_island_modal')
          })
        }
  
        $state.subscribe('activeIslandId', () => {
          renderIslandsDropdownList()
        })
      }

      const handleSuccessfulLogin = async () => {
        await $storage.saveConfigs([
          {
            key: 'pb_url',
            value: pb.baseUrl
          },
          {
            key: 'pb_token',
            value: pb.authStore.token
          }
        ])

        updateStatus('Login successful! Loading secure vault setup...')
        $state.isAuthenticated = true
      }

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        // Clear all custom validities first
        usernameInput.setCustomValidity('')
        emailInput.setCustomValidity('')
        passwordInput.setCustomValidity('')
        passwordConfirmInput.setCustomValidity('')
        updateStatus('')

        const inputs = [usernameInput, emailInput, passwordInput, passwordConfirmInput]
        let isValid = true
        inputs.forEach(input => {
          if (!input.checkValidity()) {
            isValid = false
          }
        })

        updateValidationFeedback(registerForm)

        if (!isValid) {
          event.stopPropagation()
          registerForm.classList.add('was-validated')
          return
        }

        const username = usernameInput.value
        const email = emailInput.value
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password !== passwordConfirm) {
          passwordConfirmInput.setCustomValidity('Passwords do not match')
          updateValidationFeedback(registerForm)
          registerForm.classList.add('was-validated')
          return
        }

        const isTesting = typeof window !== 'undefined' && (window.__coralite__?.mode === 'testing' || (window.__playwright_test_id__ && window.__coralite__?.mode !== 'production'))
        let currentPayload = altchaPayload
        if (altchaWidget && altchaWidget.value) {
          currentPayload = altchaWidget.value
        }
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        if (!currentPayload) {
          if (altchaWidget) {
            registerSubmitPending = true
            altchaWidget.verify()
          }
          return
        }

        try {
          registerForm.classList.remove('was-validated')
          updateStatus('Checking availability...')
  
          const params = new URLSearchParams({
            username,
            email
          })
  
          const availabilityRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/check-availability?${params}`)).then(r => r.json())

          if (availabilityRes.usernameExists) {
            usernameInput.setCustomValidity('Username is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          if (availabilityRes.emailExists) {
            emailInput.setCustomValidity('Email is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          updateStatus('Creating account...')

          const regRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/register`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username,
              email,
              password,
              passwordConfirm,
              altcha: currentPayload
            })
          })

          if (!regRes.ok) {
            const errData = await regRes.json()
            throw new Error(errData.error || 'Registration failed')
          }

          updateStatus('Logging you in...')
          const authData = await regRes.json()

          pb.authStore.save(authData.token, authData.record)
          await handleSuccessfulLogin()
        } catch (error) {
          console.error('Registration error:', error)
          updateStatus(error.message || 'Registration failed', true)
          if (altchaWidget && typeof altchaWidget.reset === 'function') {
            altchaWidget.reset()
          }
        }
      })
    }
  })
</script>
