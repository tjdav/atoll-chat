<template id="auth-register">
  <div class="atoll-auth-card">
    <!-- Zone 1: Header (Top Navigation) -->
    <div class="atoll-auth-header-zone">
      <atoll-list-header variant="list">
        <div slot="leading">
          <atoll-button type="button" variant="ghost" icon-only="true" ref="linkLogin" test-id="linkLogin">
            <atoll-icon name="chevron-left"></atoll-icon>
          </atoll-button>
        </div>
      </atoll-list-header>
    </div>

    <!-- Zone 2: Hero Greeting -->
    <div class="atoll-auth-hero-zone">
      <h3 class="mb-1">Create Account</h3>
      <p class="text-muted small">Enter your details to join Atoll</p>
      <div class="text-start small p-3 mb-0 mt-3 rounded" style="background-color: var(--atoll-warning-bg-subtle, #FFF8E1); border: 1px solid var(--atoll-warning-border, #FFE082); color: var(--atoll-text-primary, #212121);">
        <div class="fw-bold mb-1">⚠️ No Email Recovery</div>
        <div class="text-muted small mb-1" style="color: var(--atoll-text-secondary, #616161) !important;">Your account has no email attached for privacy.</div>
        <div class="text-muted small" style="color: var(--atoll-text-secondary, #616161) !important;">Lost credentials cannot be recovered by admins.</div>
      </div>
    </div>

    <!-- Zone 3: Form Input Zone -->
    <form ref="registerForm" class="atoll-auth-form-zone" novalidate>
      <atoll-input 
        ref="username" 
        name="username"
        label="Username" 
        placeholder="Choose a username" 
        required="true" 
        autocomplete="username" 
        test-id="username"
        feedback-test-id="username-feedback"
      ></atoll-input>

      <atoll-input 
        ref="invitationCode" 
        name="invitation_code"
        label="Invitation Code" 
        placeholder="Enter invitation code (e.g. INV-XXXX-XXXX)" 
        required="true" 
        test-id="invitationCode"
        feedback-test-id="invitation-code-feedback"
      ></atoll-input>

      <div>
        <atoll-input 
          ref="password" 
          name="password"
          type="password"
          label="Password" 
          placeholder="Enter Password" 
          required="true" 
          autocomplete="new-password" 
          test-id="password"
          feedback-test-id="password-feedback"
          minlength="8"
        ></atoll-input>
        <div class="progress mt-2" style="height: 5px;">
          <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div ref="strengthText" class="form-text small mt-1">Minimum 8 characters.</div>
      </div>

      <atoll-input 
        ref="passwordConfirm" 
        name="passwordConfirm"
        type="password"
        label="Confirm Password" 
        placeholder="Confirm Password" 
        required="true" 
        autocomplete="new-password" 
        test-id="passwordConfirm"
        feedback-test-id="password-confirm-feedback"
        minlength="8"
      ></atoll-input>

      <div class="d-flex justify-content-center" ref="altchaContainer"></div>

      <!-- Zone 4: Bottom Action Zone -->
      <div class="atoll-auth-bottom-zone">
        <atoll-button type="submit" variant="primary" block="true" ref="btnSubmit" test-id="registerSubmit">Register & Log In</atoll-button>
      </div>
    </form>

    <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>

    <!-- POST-REGISTRATION RECOVERY POPUP (lg atoll-popup) -->
    <atoll-popup
      ref="recoveryModal"
      data-testid="recoveryModal"
      size="lg"
      title="Save Your Emergency Recovery Code"
      description="If you forget your Master Password, this code is the ONLY way to regain access to your encrypted vault."
      static-backdrop="true"
      primary-text=""
      secondary-text=""
    >
      <!-- Custom top icon/badge inside slots to bypass basic outline styling and render green-tint badge -->
      <div slot="hero" class="atoll-icon-badge-green">
        <atoll-icon name="permissions" size="32"></atoll-icon>
      </div>
    </atoll-popup>

    <!-- Pre-rendered recovery modal content -->
    <div ref="recoveryContent" class="d-none w-100">
      <!-- Recovery Code Box (Generic ADSM primitive) -->
      <div class="atoll-code-block atoll-code-block-lg mb-3" ref="recoveryCodeBox">
        RC-9K2F-8M11-3P7Q-4L90
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-3 mb-4 w-100 px-2 justify-content-center">
        <atoll-button variant="secondary" size="md" class="flex-grow-1" ref="btnCopyCode" test-id="btnCopyCode">
          <atoll-icon slot="leading" name="copy" size="18"></atoll-icon>
          Copy Code
        </atoll-button>
        <atoll-button variant="secondary" size="md" class="flex-grow-1" ref="btnDownloadCode" test-id="btnDownloadCode">
          <atoll-icon slot="leading" name="download" size="18"></atoll-icon>
          Download
        </atoll-button>
      </div>

      <!-- Confirmation Checkbox -->
      <div class="d-flex align-items-center text-start mb-4 w-100 px-3 py-2 rounded" style="background-color: var(--atoll-tertiary-bg, #f8f9fa);">
        <atoll-checkbox class="me-2" ref="chkStored" data-testid="chkStored" size="20"></atoll-checkbox>
        <span class="small fw-bold text-muted cursor-pointer" style="user-select: none;" ref="chkStoredLabel">
          I have stored this code in a safe place.
        </span>
      </div>

      <!-- Continue Action -->
      <div class="w-100 mt-3">
        <atoll-button variant="primary" size="lg" block="true" ref="btnContinueToChat" test-id="btnContinueToChat" disabled="true">Continue to Chat</atoll-button>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, eventBus, realtimeSync, cryptoWorker, utils, root, signal }) => {
      const { pb } = pocketbase
      const { $url } = utils
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $worker } = cryptoWorker

      const registerForm = refs('registerForm')
      const altchaContainer = refs('altchaContainer')
      const linkLogin = refs('linkLogin')
      const usernameInput = refs('username')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')

      const btnCopyCode = refs('btnCopyCode')
      const btnDownloadCode = refs('btnDownloadCode')
      const chkStored = refs('chkStored')
      const btnContinueToChat = refs('btnContinueToChat')
      const recoveryModal = refs('recoveryModal')
      const recoveryCodeBox = refs('recoveryCodeBox')
      const recoveryContent = refs('recoveryContent')

      /**
       * Dynamically shifts the pre-rendered recovery code modal content into the active popup layout body.
       *
       * @returns {void}
       */
      const moveRecoveryContent = () => {
        const popupBody = recoveryModal.querySelector('.atoll-popup-body')
        if (popupBody && recoveryContent.parentNode !== popupBody) {
          recoveryContent.classList.remove('d-none')
          popupBody.appendChild(recoveryContent)
        }
      }
      moveRecoveryContent()

      let savedCode = ''
      let isCheckboxChecked = false
      let hasCopiedOrDownloaded = false
      let pendingAuthData = null
      let pendingDecryptedKeys = null
      let pendingRecord = null

      let altchaWidget = null
      let registerSubmitPending = false
      let altchaPayload = null

      const isTesting = import.meta.env.MODE === 'testing' || (typeof window !== 'undefined' && (window.__playwright_test_id__ || window.PLAYWRIGHT_TEST))

      /**
       * Updates the visual and text status message in the register card.
       *
       * @param {string} message - The status message to display.
       * @param {boolean} [isError=false] - Whether the status is an error state.
       * @returns {void}
       */
      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      /**
       * Shows a global error alert toast if a non-empty message is provided.
       *
       * @param {string} msg - The message to display.
       * @returns {void}
       */
      const showGlobalAlert = (msg) => {
        if (msg) {
          $bus.emit('ui:show_toast', {
            message: msg,
            variant: 'danger'
          })
        }
      }

      /**
       * Validates all inputs in the form and updates validation error styling and messages.
       *
       * @param {HTMLFormElement} form - The form element containing atoll-inputs.
       * @returns {void}
       */
      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('atoll-input')
        inputs.forEach(input => {
          const isValid = input.checkValidity()
          if (!isValid) {
            input.setAttribute('invalid', 'true')
            const innerInput = input.querySelector('input')
            const validationMsg = innerInput ? innerInput.validationMessage : 'Invalid value.'
            input.setAttribute('error-message', validationMsg)
          } else {
            input.removeAttribute('invalid')
            input.removeAttribute('error-message')
          }
        })
      }

      const passwordInputEl = refs('password')
      const passwordConfirmInputEl = refs('passwordConfirm')
      const invitationCodeInput = refs('invitationCode')

      /**
       * Sets up event listeners on inputs within a form to reset validation states.
       *
       * @param {HTMLFormElement} form - The form element to register listeners on.
       * @returns {void}
       */
      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target.closest('atoll-input')
          if (!input) {
            return
          }
          input.removeAttribute('invalid')
          input.removeAttribute('error-message')
          updateStatus('')
        })
      }

      registerInputReset(registerForm)

      /**
       * Evaluates password complexity and updates the visual strength meter bar synchronously.
       *
       * @returns {Promise<void>}
       */
      const updateStrength = async () => {
        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { width, colorClass, text } = await evaluatePasswordStrength(passwordInputEl.value, 8)
        strengthBar.style.width = width
        strengthBar.className = colorClass
        strengthText.textContent = text
      }

      passwordInputEl.addEventListener('input', updateStrength)

      linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'login'
      })

      /**
       * Updates the disabled/enabled states of the "Continue to Chat" button based on compliance requirements.
       *
       * @returns {void}
       */
      const updateContinueButtonState = () => {
        const canContinue = isCheckboxChecked || hasCopiedOrDownloaded
        if (canContinue) {
          btnContinueToChat.removeAttribute('disabled')
          btnContinueToChat.disabled = false
        } else {
          btnContinueToChat.setAttribute('disabled', 'true')
          btnContinueToChat.disabled = true
        }
      }

      btnCopyCode.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(savedCode)
          $bus.emit('ui:show_toast', {
            message: 'Recovery code copied to clipboard!',
            type: 'success'
          })
          hasCopiedOrDownloaded = true
          updateContinueButtonState()
        } catch {
          return
        }
      })

      btnDownloadCode.addEventListener('click', () => {
        const creationDate = new Date().toISOString().replace('T', ' ').substring(0, 19)
        const fileContent = `============================================================
ATOLL CHAT - EMERGENCY RECOVERY CODE
============================================================
Username: @${usernameInput.value.trim().toLowerCase()}
Created: ${creationDate} UTC
Recovery Code: ${savedCode}

WARNING: This emergency recovery code is the ONLY way to regain
access to your encrypted vault if you forget your Master Password.
Atoll administrators cannot recover your credentials or vault.
============================================================`

        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' })
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        link.href = url
        link.download = 'atoll-recovery-code.txt'
        document.body.appendChild(link)
        link.click()
        document.body.removeChild(link)
        URL.revokeObjectURL(url)

        hasCopiedOrDownloaded = true
        updateContinueButtonState()
      })

      const chkStoredLabel = refs('chkStoredLabel')
      chkStored.addEventListener('change', (e) => {
        isCheckboxChecked = e.detail ? e.detail.checked : chkStored.checked
        updateContinueButtonState()
      })
      chkStoredLabel.addEventListener('click', () => {
        chkStored.checked = !chkStored.checked
        isCheckboxChecked = chkStored.checked
        updateContinueButtonState()
      })

      btnContinueToChat.addEventListener('click', async () => {
        if (pendingDecryptedKeys && pendingRecord && pendingAuthData) {
          $state.currentUser = {
            ...pendingRecord,
            ...pendingDecryptedKeys
          }
          $bus.emit('auth:unlocked', {
            keys: pendingDecryptedKeys,
            userRecord: pendingRecord
          })
          $state.isVaultUnlocked = true
          pb.authStore.save(pendingAuthData.token, pendingRecord)
        }

        $state.isAuthenticated = true
        $state.pendingRegistrationInvite = null
        if ($state.isVaultUnlocked) {
          try {
            await $sync.startSubscriptions()
          } catch (err) {
            // Verify if error is subscription related and should be gracefully bypassed
            if (err && err.message && !err.message.includes('subscription')) {
              throw err
            }
          }
        }

        recoveryModal.removeAttribute('open')
      })

      usernameInput.addEventListener('input', () => {
        const val = usernameInput.value || ''
        const canonical = val.trim().toLowerCase()
        if (canonical) {
          usernameInput.helperText = `Your unique username is permanently unique and immutable once created. It will be @${canonical}`
        } else {
          usernameInput.helperText = ''
        }
      })

      /**
       * Formats a raw invite code into standard INV-XXXX-XXXX representation.
       *
       * @param {string} val - The input invite code string.
       * @returns {string} The formatted invitation code.
       */
      const formatInviteCode = (val) => {
        if (!val) {
          return ''
        }
        const clean = val.replace(/[^A-Za-z0-9]/g, '').toUpperCase()
        let raw = clean
        if (raw.startsWith('INV')) {
          raw = raw.slice(3)
        }
        let formatted = 'INV'
        if (raw.length > 0) {
          formatted += '-' + raw.substring(0, 4)
        }
        if (raw.length > 4) {
          formatted += '-' + raw.substring(4, 8)
        }
        return formatted
      }

      /**
       * Pre-fills and formats the invitation code input field.
       *
       * @param {string} rawCode - The raw invite code.
       * @returns {void}
       */
      const applyInviteCode = (rawCode) => {
        if (rawCode && invitationCodeInput) {
          const formatted = formatInviteCode(rawCode)
  
          invitationCodeInput.value = formatted
          invitationCodeInput.setAttribute('value', formatted)
          invitationCodeInput.dispatchEvent(new Event('input', {
            bubbles: true,
            composed: true
          }))
          invitationCodeInput.dispatchEvent(new Event('change', {
            bubbles: true,
            composed: true
          }))
        }
      }

      invitationCodeInput.addEventListener('input', () => {
        invitationCodeInput.value = formatInviteCode(invitationCodeInput.value || '')
      })

      // Check global state or URL query parameters on mount
      let initialInvite = $state.pendingRegistrationInvite
      if (!initialInvite && typeof window !== 'undefined') {
        try {
          if (window.location.search) {
            const params = new URLSearchParams(window.location.search)
            initialInvite = params.get('invite_code') || params.get('code') || params.get('invite')
          }
  
          if (!initialInvite && window.location.pathname && window.location.pathname.startsWith('/invite/')) {
            const pathCode = window.location.pathname.split('/invite/')[1]?.split('?')[0]?.trim()
            if (pathCode) {
              initialInvite = pathCode
            }
          }
        } catch {
        }
      }
      if (initialInvite) {
        applyInviteCode(initialInvite)
      }

      $bus.on('auth:invite_code_received', ({ code }) => {
        applyInviteCode(code)
      }, { signal })

      /**
       * Extracts the ALTCHA security verification payload from a widget.
       *
       * @param {HTMLElement} widget - The Altcha widget element.
       * @returns {string|null} The payload or null if unavailable.
       */
      const getAltchaPayload = (widget) => {
        if (altchaPayload) {
          return altchaPayload
        }

        if (widget.value) {
          return widget.value
        }
  
        const attrVal = widget.getAttribute('value')
        if (attrVal) {
          return attrVal
        }
        const hiddenInput = widget.querySelector('input[name="altcha"]')
        if (hiddenInput && hiddenInput.value) {
          return hiddenInput.value
        }
        return null
      }

      /**
       * Renders the ALTCHA challenge widget inside the registration container.
       *
       * @returns {HTMLElement} The initialized Altcha widget.
       */
      const renderAltcha = () => {
        altchaContainer.innerHTML = ''
        altchaPayload = null

        btnSubmit.removeAttribute('loading')
        btnSubmit.removeAttribute('disabled')

        const widget = document.createElement('altcha-widget')
        const challengeUrl = pb.buildURL('/api/altcha/challenge')
        const configObj = {}

        if (isTesting) {
          widget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          widget.setAttribute('challenge', challengeUrl)
          configObj.challenge = challengeUrl
        }
        widget.setAttribute('display', 'invisible')
        widget.setAttribute('auto', 'onload')
        widget.style.width = '100%'
        widget.style.maxWidth = '100%'
        widget.setAttribute('configuration', JSON.stringify(configObj))

        widget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || widget.value || null
        })

        widget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          const resolvedPayload = ev.detail?.payload || widget.value || null
          if (resolvedPayload) {
            altchaPayload = resolvedPayload
          }
          if (state === 'verifying') {
            if (registerSubmitPending) {
              btnSubmit.setAttribute('loading', 'true')
            }
          } else if (state === 'verified') {
            if (registerSubmitPending) {
              btnSubmit.removeAttribute('loading')
              registerSubmitPending = false
              if (typeof registerForm.requestSubmit === 'function') {
                registerForm.requestSubmit()
              } else {
                registerForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            if (!registerSubmitPending) {
              btnSubmit.removeAttribute('loading')
            }
          } else if (state === 'error') {
            altchaPayload = null
            btnSubmit.removeAttribute('loading')
            updateStatus('Security challenge failed. Please try again.', true)
            registerSubmitPending = false
          }
        })

        altchaContainer.appendChild(widget)
        return widget
      }

      // Initialize Altcha on Register Form
      altchaWidget = renderAltcha()

      $bus.on('app:reconnected', () => {
        altchaWidget = renderAltcha()
      })

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        // Clear all custom validities first
        usernameInput.setCustomValidity('')
        invitationCodeInput.setCustomValidity('')
        passwordInputEl.setCustomValidity('')
        passwordConfirmInputEl.setCustomValidity('')
        updateStatus('')

        const inputs = [usernameInput, invitationCodeInput, passwordInputEl, passwordConfirmInputEl]
        let isValid = true
        inputs.forEach(input => {
          if (!input.checkValidity()) {
            isValid = false
          }
        })

        updateValidationFeedback(registerForm)

        if (!isValid) {
          event.stopPropagation()
          registerForm.classList.add('was-validated')
          return
        }

        const username = usernameInput.value
        const invitation_code = invitationCodeInput.value.trim()
        const password = passwordInputEl.value
        const passwordConfirm = passwordConfirmInputEl.value

        if (password !== passwordConfirm) {
          passwordConfirmInputEl.setCustomValidity('Passwords do not match')
          updateValidationFeedback(registerForm)
          registerForm.classList.add('was-validated')
          return
        }

        let currentPayload = getAltchaPayload(altchaWidget)
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        // Immediately set loading and disable inputs/links
        btnSubmit.setAttribute('loading', 'true')
        usernameInput.setAttribute('disabled', 'true')
        invitationCodeInput.setAttribute('disabled', 'true')
        passwordInputEl.setAttribute('disabled', 'true')
        passwordConfirmInputEl.setAttribute('disabled', 'true')
        linkLogin.setAttribute('disabled', 'true')

        if (!currentPayload) {
          registerSubmitPending = true
          updateStatus('Verifying security challenge...')
          return
        }

        try {
          registerForm.classList.remove('was-validated')
          updateStatus('Checking availability...')
  
          const { deriveAuthAndVaultKeys } = await import('../../utils/keys.js')
          const { keyA, keyB, canonicalUsername } = await deriveAuthAndVaultKeys(username, password)

          const params = new URLSearchParams({
            username: canonicalUsername
          })
  
          const availabilityRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/check-availability?${params}`)).then(r => r.json())

          if (availabilityRes.usernameExists) {
            usernameInput.setCustomValidity('Username is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          updateStatus('Creating account...')

          const sodiumModule = await import('libsodium-wrappers-sumo')
          const sodium = sodiumModule.default || sodiumModule
          await sodium.ready

          const { publicKey: pubBox, privateKey: privBox } = sodium.crypto_box_keypair()
          const { publicKey: pubSign, privateKey: privSign } = sodium.crypto_sign_keypair()

          const public_box_key = sodium.to_base64(pubBox, sodium.base64_variants.ORIGINAL)
          const public_sign_key = sodium.to_base64(pubSign, sodium.base64_variants.ORIGINAL)
          const private_box_key = sodium.to_base64(privBox, sodium.base64_variants.ORIGINAL)
          const private_sign_key = sodium.to_base64(privSign, sodium.base64_variants.ORIGINAL)

          const masterKeyBytes = sodium.randombytes_buf(32)

          const masterKeyNonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES)
          const keyABytes = keyA
          const encryptedMasterKeyBytes = sodium.crypto_secretbox_easy(masterKeyBytes, masterKeyNonce, keyABytes)
          const encrypted_master_keys = {
            ciphertext: sodium.to_base64(encryptedMasterKeyBytes, sodium.base64_variants.ORIGINAL),
            nonce: sodium.to_base64(masterKeyNonce, sodium.base64_variants.ORIGINAL)
          }

          const privKeyPlaintext = JSON.stringify({
            private_box_key,
            private_sign_key
          })
          const privKeyNonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES)
          const encryptedPrivKeyBytes = sodium.crypto_secretbox_easy(privKeyPlaintext, privKeyNonce, masterKeyBytes)
          const encrypted_private_keys = {
            ciphertext: sodium.to_base64(encryptedPrivKeyBytes, sodium.base64_variants.ORIGINAL),
            nonce: sodium.to_base64(privKeyNonce, sodium.base64_variants.ORIGINAL)
          }

          const vault_salt = sodium.to_base64(sodium.randombytes_buf(16), sodium.base64_variants.ORIGINAL)

          // Generate single emergency recovery code
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
          const part = () => Array.from(crypto.getRandomValues(new Uint8Array(4)))
            .map(b => chars[b % chars.length])
            .join('')
          const singleCode = `RC-${part()}-${part()}-${part()}-${part()}`

          const codeHash = sodium.crypto_generichash(32, singleCode)
          const authProofBytes = sodium.crypto_hash_sha256(sodium.from_string('atoll-recovery-auth:' + singleCode))
          const authProof = sodium.to_base64(authProofBytes, sodium.base64_variants.ORIGINAL)
          const verifierBytes = sodium.crypto_hash_sha256(sodium.from_string('atoll-recovery-verifier:' + authProof))
          const verifier = sodium.to_base64(verifierBytes, sodium.base64_variants.ORIGINAL)

          const recoveryNonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES)
          const recoveryCiphertext = sodium.crypto_secretbox_easy(masterKeyBytes, recoveryNonce, codeHash)
          const singleWrap = {
            verifier,
            ciphertext: sodium.to_base64(recoveryCiphertext, sodium.base64_variants.ORIGINAL),
            nonce: sodium.to_base64(recoveryNonce, sodium.base64_variants.ORIGINAL)
          }

          const regRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/register`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username: canonicalUsername,
              password: keyB,
              passwordConfirm: keyB,
              invitation_code,
              altcha: currentPayload,
              public_box_key,
              public_sign_key,
              encrypted_master_keys,
              encrypted_private_keys,
              recovery_wraps: [singleWrap],
              vault_salt
            })
          })

          if (!regRes.ok) {
            const errData = await regRes.json()
            throw new Error(errData.error || 'Registration failed')
          }

          updateStatus('Logging you in...')
          const authData = await regRes.json()
          const record = authData.record

          // If record has vault keys, initialize crypto worker session immediately
          if (record.encrypted_master_keys && record.encrypted_private_keys) {
            const masterKey = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: record.encrypted_master_keys.ciphertext,
              nonce: record.encrypted_master_keys.nonce,
              key: keyA
            })

            if (masterKey) {
              const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
                encrypted_private_keys: record.encrypted_private_keys,
                master_key: masterKey
              })
              await $worker.execute('worker:set_token', { token: authData.token })
              await $worker.execute('worker:init_keys', {
                ...decryptedKeys,
                id: record.id
              })
  
              // Populate pending variables to apply after they confirm
              pendingAuthData = authData
              pendingDecryptedKeys = decryptedKeys
              pendingRecord = record
            }
          }

          await $storage.saveConfigs([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: authData.token
            }
          ])

          const { purgeVaultKey } = await import('../../utils/keys.js')
          purgeVaultKey()

          // Show the Recovery Modal Overlay and do NOT set isAuthenticated yet!
          savedCode = singleCode
          recoveryCodeBox.textContent = singleCode
          moveRecoveryContent()
          recoveryModal.setAttribute('open', 'true')
          updateStatus('Account created! Please save your recovery code.')
        } catch (error) {
          pb.authStore.clear()
          $state.isAuthenticated = false
          $state.isVaultUnlocked = false

          // Re-enable elements on error
          btnSubmit.removeAttribute('loading')
          usernameInput.removeAttribute('disabled')
          invitationCodeInput.removeAttribute('disabled')
          passwordInputEl.removeAttribute('disabled')
          passwordConfirmInputEl.removeAttribute('disabled')
          linkLogin.removeAttribute('disabled')

          updateStatus(error.message || 'Registration failed', true)
          showGlobalAlert(error.message || 'Registration failed')
          altchaWidget.reset()
        }
      })
    }
  })
</script>
