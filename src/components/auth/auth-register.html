<template id="auth-register">
  <div class="atoll-auth-card">
    <!-- Zone 1: Header (Top Navigation) -->
    <div class="atoll-auth-header-zone">
      <atoll-list-header variant="list">
        <div slot="leading">
          <atoll-button type="button" variant="ghost" icon-only="true" ref="linkLogin">
            <atoll-icon name="chevron-left"></atoll-icon>
          </atoll-button>
        </div>
      </atoll-list-header>
    </div>

    <!-- Zone 2: Hero Greeting -->
    <div class="atoll-auth-hero-zone">
      <h3 class="mb-1">Create Account</h3>
      <p class="text-muted small">Enter your details to join Atoll</p>
      <div class="alert alert-warning text-start small p-2 mb-0 mt-2">
        <strong>Zero-PII Warning:</strong> Your account has no email attached for privacy. If you lose your Master Password or Recovery Keys, your vault data cannot be recovered.
      </div>
    </div>

    <!-- Zone 3: Form Input Zone -->
    <form ref="registerForm" class="atoll-auth-form-zone" novalidate>
      <atoll-input 
        ref="username" 
        name="username"
        label="Username" 
        placeholder="Choose a username" 
        required="true" 
        autocomplete="username" 
        test-id="username"
        feedback-test-id="username-feedback"
      ></atoll-input>

      <atoll-input 
        ref="invitationCode" 
        name="invitation_code"
        label="Invitation Code" 
        placeholder="Enter invitation code (e.g. INV-XXXX-XXXX)" 
        required="true" 
        test-id="invitationCode"
        feedback-test-id="invitation-code-feedback"
      ></atoll-input>

      <div>
        <atoll-input 
          ref="password" 
          name="password"
          type="password"
          label="Password" 
          placeholder="Enter Password" 
          required="true" 
          autocomplete="new-password" 
          test-id="password"
          feedback-test-id="password-feedback"
          minlength="8"
        ></atoll-input>
        <div class="progress mt-2" style="height: 5px;">
          <div ref="strengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div ref="strengthText" class="form-text small mt-1">Minimum 8 characters.</div>
      </div>

      <atoll-input 
        ref="passwordConfirm" 
        name="passwordConfirm"
        type="password"
        label="Confirm Password" 
        placeholder="Confirm Password" 
        required="true" 
        autocomplete="new-password" 
        test-id="passwordConfirm"
        feedback-test-id="password-confirm-feedback"
        minlength="8"
      ></atoll-input>

      <div class="d-flex justify-content-center" ref="altchaContainer"></div>

      <!-- Zone 4: Bottom Action Zone -->
      <div class="atoll-auth-bottom-zone">
        <atoll-button type="submit" variant="primary" block="true" ref="btnSubmit" test-id="registerSubmit">Register & Log In</atoll-button>
      </div>
    </form>

    <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, eventBus, realtimeSync, cryptoWorker, utils, root }) => {
      const { pb } = pocketbase
      const { $url } = utils
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $worker } = cryptoWorker

      const registerForm = refs('registerForm')
      const altchaContainer = refs('altchaContainer')
      const linkLogin = refs('linkLogin') || root.querySelector('[ref*="linkLogin"]')
      const usernameInput = refs('username')
      const btnSubmit = refs('btnSubmit')
      const statusMsg = refs('statusMsg')
      const strengthBar = refs('strengthBar')
      const strengthText = refs('strengthText')
      // eslint-disable-next-line no-unused-vars
      let zxcvbnScore = 0

      let altchaWidget = null
      let registerSubmitPending = false
      let altchaPayload = null

      const isTesting = import.meta.env.MODE === 'testing'

      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      const showGlobalAlert = (msg) => {
        if (msg) {
          $bus.emit('ui:show_toast', {
            message: msg,
            variant: 'danger'
          })
        }
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('atoll-input')
        inputs.forEach(input => {
          const isValid = input.checkValidity()
          if (!isValid) {
            input.setAttribute('invalid', 'true')
            const innerInput = input.querySelector('input')
            const validationMsg = innerInput ? innerInput.validationMessage : 'Invalid value.'
            input.setAttribute('error-message', validationMsg)
          } else {
            input.removeAttribute('invalid')
            input.removeAttribute('error-message')
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target.closest('atoll-input')
          if (!input) {
            return
          }
          input.removeAttribute('invalid')
          input.removeAttribute('error-message')
          updateStatus('')
        })
      }

      registerInputReset(registerForm)

      const updateStrength = async () => {
        const passwordInput = refs('password')
        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score, width, colorClass, text } = await evaluatePasswordStrength(passwordInput.value, 8)
        zxcvbnScore = score
        strengthBar.style.width = width
        strengthBar.className = colorClass
        strengthText.textContent = text
      }

      const passwordInputEl = refs('password')
      if (passwordInputEl) {
        passwordInputEl.addEventListener('input', updateStrength)
      }

      if (linkLogin) {
        linkLogin.addEventListener('click', (e) => {
          e.preventDefault()
          $state.authView = 'login'
        })
      }

      if (altchaContainer) {
  
        btnSubmit.removeAttribute('loading')
        btnSubmit.removeAttribute('disabled')

        altchaWidget = document.createElement('altcha-widget')
        altchaWidget.setAttribute('display', 'invisible')
        altchaWidget.setAttribute('auto', 'off')
        altchaWidget.style.width = '100%'
        altchaWidget.style.maxWidth = '100%'
  
        const configObj = {}
        if (isTesting) {
          altchaWidget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          altchaWidget.setAttribute('challenge', pb.buildURL('/api/altcha/challenge'))
          configObj.challenge = pb.buildURL('/api/altcha/challenge')
        }
        altchaWidget.setAttribute('configuration', JSON.stringify(configObj))

        altchaWidget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || null
          console.log('[ALTCHA REGISTER DEBUG] verified event payload:', altchaPayload)
        })

        altchaWidget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          console.log('[ALTCHA REGISTER DEBUG]', 'state:', state, 'value:', altchaWidget.value, 'payload:', ev.detail?.payload)
          if (state === 'verifying') {
            altchaPayload = null
            btnSubmit.setAttribute('loading', 'true')
          } else if (state === 'verified') {
            if (ev.detail?.payload) {
              altchaPayload = ev.detail.payload
            }
            btnSubmit.removeAttribute('loading')
            if (registerSubmitPending) {
              registerSubmitPending = false
              if (typeof registerForm.requestSubmit === 'function') {
                registerForm.requestSubmit()
              } else {
                registerForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            btnSubmit.removeAttribute('loading')
          } else if (state === 'error') {
            altchaPayload = null
            btnSubmit.removeAttribute('loading')
            updateStatus('Security challenge failed. Please try again.', true)
            registerSubmitPending = false
          }
        })

        altchaContainer.appendChild(altchaWidget)
      }

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        const passwordInput = refs('password')
        const passwordConfirmInput = refs('passwordConfirm')

        // Clear all custom validities first
        usernameInput.setCustomValidity('')
        const actualInvitationCodeInput = refs('invitationCode') || root.querySelector('[ref="invitationCode"]')
        if (actualInvitationCodeInput) {
          actualInvitationCodeInput.setCustomValidity('')
        }
        passwordInput.setCustomValidity('')
        passwordConfirmInput.setCustomValidity('')
        updateStatus('')

        const inputs = [usernameInput, actualInvitationCodeInput, passwordInput, passwordConfirmInput].filter(Boolean)
        let isValid = true
        inputs.forEach(input => {
          if (!input.checkValidity()) {
            isValid = false
          }
        })

        updateValidationFeedback(registerForm)

        if (!isValid) {
          event.stopPropagation()
          registerForm.classList.add('was-validated')
          return
        }

        const username = usernameInput.value
        const invitation_code = actualInvitationCodeInput ? actualInvitationCodeInput.value.trim() : ''
        const password = passwordInput.value
        const passwordConfirm = passwordConfirmInput.value

        if (password !== passwordConfirm) {
          passwordConfirmInput.setCustomValidity('Passwords do not match')
          updateValidationFeedback(registerForm)
          registerForm.classList.add('was-validated')
          return
        }

        let currentPayload = altchaPayload
        if (altchaWidget && altchaWidget.value) {
          currentPayload = altchaWidget.value
        }
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        if (!currentPayload) {
          if (altchaWidget) {
            registerSubmitPending = true
            altchaWidget.verify()
          }
          return
        }

        try {
          registerForm.classList.remove('was-validated')
          updateStatus('Checking availability...')
  
          const { deriveAuthAndVaultKeys } = await import('../../utils/keys.js')
          const { keyA, keyB, canonicalUsername } = await deriveAuthAndVaultKeys(username, password)

          const params = new URLSearchParams({
            username: canonicalUsername
          })
  
          const availabilityRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/check-availability?${params}`)).then(r => r.json())

          if (availabilityRes.usernameExists) {
            usernameInput.setCustomValidity('Username is already taken')
            updateValidationFeedback(registerForm)
            registerForm.classList.add('was-validated')
            updateStatus('')
            return
          }

          updateStatus('Creating account...')

          const sodiumModule = await import('libsodium-wrappers-sumo')
          const sodium = sodiumModule.default || sodiumModule
          await sodium.ready

          const { publicKey: pubBox, privateKey: privBox } = sodium.crypto_box_keypair()
          const { publicKey: pubSign, privateKey: privSign } = sodium.crypto_sign_keypair()

          const public_box_key = sodium.to_base64(pubBox, sodium.base64_variants.ORIGINAL)
          const public_sign_key = sodium.to_base64(pubSign, sodium.base64_variants.ORIGINAL)
          const private_box_key = sodium.to_base64(privBox, sodium.base64_variants.ORIGINAL)
          const private_sign_key = sodium.to_base64(privSign, sodium.base64_variants.ORIGINAL)

          const masterKeyBytes = sodium.randombytes_buf(32)

          const masterKeyNonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES)
          const keyABytes = keyA
          const encryptedMasterKeyBytes = sodium.crypto_secretbox_easy(masterKeyBytes, masterKeyNonce, keyABytes)
          const encrypted_master_keys = {
            ciphertext: sodium.to_base64(encryptedMasterKeyBytes, sodium.base64_variants.ORIGINAL),
            nonce: sodium.to_base64(masterKeyNonce, sodium.base64_variants.ORIGINAL)
          }

          const privKeyPlaintext = JSON.stringify({
            private_box_key,
            private_sign_key
          })
          const privKeyNonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES)
          const encryptedPrivKeyBytes = sodium.crypto_secretbox_easy(privKeyPlaintext, privKeyNonce, masterKeyBytes)
          const encrypted_private_keys = {
            ciphertext: sodium.to_base64(encryptedPrivKeyBytes, sodium.base64_variants.ORIGINAL),
            nonce: sodium.to_base64(privKeyNonce, sodium.base64_variants.ORIGINAL)
          }

          const vault_salt = sodium.to_base64(sodium.randombytes_buf(16), sodium.base64_variants.ORIGINAL)

          const regRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/register`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username: canonicalUsername,
              password: keyB,
              passwordConfirm: keyB,
              invitation_code,
              altcha: currentPayload,
              public_box_key,
              public_sign_key,
              encrypted_master_keys,
              encrypted_private_keys,
              vault_salt
            })
          })

          if (!regRes.ok) {
            const errData = await regRes.json()
            throw new Error(errData.error || 'Registration failed')
          }

          updateStatus('Logging you in...')
          const authData = await regRes.json()
          const record = authData.record

          // If record has vault keys, initialize crypto worker session immediately
          if (record.encrypted_master_keys && record.encrypted_private_keys) {
            const masterKey = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: record.encrypted_master_keys.ciphertext,
              nonce: record.encrypted_master_keys.nonce,
              key: keyA
            })

            if (masterKey) {
              const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
                encrypted_private_keys: record.encrypted_private_keys,
                master_key: masterKey
              })
              await $worker.execute('worker:set_token', { token: authData.token })
              await $worker.execute('worker:init_keys', {
                ...decryptedKeys,
                id: record.id
              })
              $state.isVaultUnlocked = true
            }
          }

          pb.authStore.save(authData.token, record)
          await $storage.saveConfigs([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          const { purgeVaultKey } = await import('../../utils/keys.js')
          purgeVaultKey()

          $state.isAuthenticated = true
          if ($state.isVaultUnlocked) {
            try {
              await $sync.startSubscriptions()
            } catch (syncErr) {
              console.error('[auth-register] Subscription sync warning:', syncErr)
            }
          }
        } catch (error) {
          console.error('Registration error:', error)
          pb.authStore.clear()
          $state.isAuthenticated = false
          $state.isVaultUnlocked = false

          updateStatus(error.message || 'Registration failed', true)
          showGlobalAlert(error.message || 'Registration failed')
          if (altchaWidget && typeof altchaWidget.reset === 'function') {
            altchaWidget.reset()
          }
        }
      })
    }
  })
</script>
