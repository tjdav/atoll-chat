<template id="auth-login">
  <div class="atoll-auth-card">
    
    <!-- LOGIN VIEW -->
    <div ref="viewLogin" data-testid="viewLogin" class="d-flex flex-column h-100">
      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <atoll-profile size="3xl" class="d-inline-block mb-3" src="/icon-192x192.png"></atoll-profile>
        <h3 class="mb-1">Welcome Back</h3>
        <p class="text-muted small">Enter your credentials to continue</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="loginForm" class="atoll-auth-form-zone" novalidate>
        <atoll-input 
          ref="identity" 
          name="identity"
          label="Username" 
          placeholder="Enter username" 
          required="true" 
          autocomplete="username" 
          test-id="username"
          feedback-test-id="identity-feedback"
        ></atoll-input>

        <atoll-input 
          ref="password" 
          name="password"
          type="password"
          label="Password" 
          placeholder="Enter password" 
          required="true" 
          autocomplete="current-password" 
          test-id="password"
          feedback-test-id="password-feedback"
        ></atoll-input>

        <div class="d-flex justify-content-center" ref="altchaContainer"></div>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true" ref="loginSubmit" test-id="loginSubmit">Log In</atoll-button>
          
          <!-- Biometric Login Section -->
          <div ref="biometricSection" data-testid="biometricSection" class="d-none flex-column w-100 mt-3 mb-2">
            <div class="d-flex align-items-center my-2 text-muted">
              <hr class="flex-grow-1 m-0">
              <span class="px-2 small fw-bold text-uppercase" style="letter-spacing: 0.5px; font-size: 0.75rem;">Biometric Sign In</span>
              <hr class="flex-grow-1 m-0">
            </div>
            <div ref="biometricContainer" data-testid="biometricContainer" class="d-flex flex-column gap-2"></div>
          </div>

          <div class="mt-2 mb-2">
            <atoll-button type="button" variant="ghost" block="true" ref="btnShowRecovery" test-id="btnShowRecovery" text="Forgot password? Recover with code">Forgot password? Recover with code</atoll-button>
          </div>

          <atoll-button type="button" variant="ghost" block="true" ref="linkRegister" test-id="linkRegister">Don't have an account? Register</atoll-button>
        </div>
      </form>
    </div>

    <!-- VIEW 2: RECOVERY CODE ENTRY -->
    <div ref="viewRecovery" data-testid="viewRecovery" class="d-none flex-column h-100">
      <!-- Zone 1: Header (Top Navigation) -->
      <div class="atoll-auth-header-zone">
        <atoll-list-header variant="list" title="Recover Account">
          <div slot="leading">
            <atoll-button type="button" variant="ghost" leading-icon="chevron-left" icon-only="true" ref="btnCancelRecovery" test-id="btnCancelRecovery"></atoll-button>
          </div>
        </atoll-list-header>
      </div>

      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <h3 class="mb-1">Use Recovery Code</h3>
        <p class="text-muted small">Enter your username and single-use recovery code to recover your account and set a new password.</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="recoveryForm" class="atoll-auth-form-zone" novalidate>
        <atoll-input 
          ref="recoveryUsername" 
          name="recoveryUsername"
          label="Username" 
          placeholder="Enter username" 
          required="true"
          autocomplete="username"
          test-id="recoveryUsername"
          feedback-test-id="recoveryUsername-feedback"
        ></atoll-input>

        <atoll-input 
          ref="recoveryCodeInput" 
          name="recoveryCodeInput"
          label="Recovery Code" 
          placeholder="RC-XXXX-XXXX-XXXX-XXXX" 
          required="true"
          class="text-center font-monospace fs-5"
          test-id="recoveryCodeInput"
          feedback-test-id="recoveryCodeInput-feedback"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true" ref="btnVerifyRecovery" test-id="btnVerifyRecovery">Verify Recovery Code</atoll-button>
        </div>
      </form>
    </div>

    <!-- VIEW 3: FORCE NEW PASSWORD CREATION -->
    <div ref="viewNewPassword" data-testid="viewNewPassword" class="d-none flex-column h-100">
      <!-- Zone 2: Hero Greeting -->
      <div class="atoll-auth-hero-zone">
        <h3 class="mb-1">Set New Password</h3>
        <p class="text-muted small">Recovery successful! Please choose a new password. This will re-encrypt your Master Key and restore full access.</p>
      </div>

      <!-- Zone 3: Form Input Zone -->
      <form ref="newPasswordForm" class="atoll-auth-form-zone" novalidate>
        <div>
          <atoll-input 
            ref="newPassword" 
            name="newPassword"
            type="password"
            label="New Password" 
            placeholder="Enter New Password" 
            required="true"
            minlength="12"
            autocomplete="new-password"
            test-id="newPassword"
            feedback-test-id="newPassword-feedback"
          ></atoll-input>
          <div class="progress mt-2" style="height: 5px;">
            <div ref="newStrengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
          <div ref="newStrengthText" class="form-text small mt-1">Minimum 12 characters.</div>
        </div>

        <atoll-input 
          ref="newPasswordConfirm" 
          name="newPasswordConfirm"
          type="password"
          label="Confirm New Password" 
          placeholder="Confirm New Password" 
          required="true"
          minlength="12"
          autocomplete="new-password"
          test-id="newPasswordConfirm"
          feedback-test-id="newPasswordConfirm-feedback"
        ></atoll-input>

        <!-- Zone 4: Bottom Action Zone -->
        <div class="atoll-auth-bottom-zone">
          <atoll-button type="submit" variant="primary" block="true" ref="btnSaveNewPassword" test-id="btnSaveNewPassword" disabled="true">Save Password & Log In</atoll-button>
        </div>
      </form>
    </div>

    <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, eventBus, realtimeSync, cryptoWorker, utils, biometric, _root }) => {
      const { pb, auth: authApi } = pocketbase
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $worker } = cryptoWorker
      const { $url } = utils

      const viewLogin = refs('viewLogin')
      const viewRecovery = refs('viewRecovery')
      const viewNewPassword = refs('viewNewPassword')

      const loginForm = refs('loginForm')
      const loginSubmit = refs('loginSubmit')
      const altchaContainer = refs('altchaContainer')
      const identityInput = refs('identity')
      const passwordInput = refs('password')

      const btnShowRecovery = refs('btnShowRecovery')
      const linkRegister = refs('linkRegister')
      const statusMsg = refs('statusMsg')
      const biometricSection = refs('biometricSection')
      const biometricContainer = refs('biometricContainer')

      const btnCancelRecovery = refs('btnCancelRecovery')
      const recoveryForm = refs('recoveryForm')
      const recoveryUsernameInput = refs('recoveryUsername')
      const recoveryCodeInput = refs('recoveryCodeInput')
      const btnVerifyRecovery = refs('btnVerifyRecovery')

      const newPasswordForm = refs('newPasswordForm')
      const newPasswordInput = refs('newPassword')
      const newPasswordConfirmInput = refs('newPasswordConfirm')
      const newStrengthBar = refs('newStrengthBar')
      const newStrengthText = refs('newStrengthText')
      const btnSaveNewPassword = refs('btnSaveNewPassword')

      let activeAltchaWidget = null
      let loginSubmitPending = false
      let altchaPayload = null

      let decryptedMasterKeyHex = null
      let matchedWrapIndex = -1
      let fetchedUserPayload = null
      let decryptedKeysLocal = null
      let zxcvbnScore = 0
      let currentRecoveryAuthProof = null

      const isTesting = import.meta.env.MODE === 'testing' || (typeof window !== 'undefined' && (window.__playwright_test_id__ || window.PLAYWRIGHT_TEST))

      /**
       * Updates the visual and text status message in the login card.
       *
       * @param {string} message - The status message to display.
       * @param {boolean} [isError=false] - Whether the status is an error state.
       * @returns {void}
       */
      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      /**
       * Shows a global error alert toast if a non-empty message is provided.
       *
       * @param {string} msg - The message to display.
       * @returns {void}
       */
      const showGlobalAlert = (msg) => {
        if (msg) {
          $bus.emit('ui:show_toast', {
            message: msg,
            variant: 'danger'
          })
        }
      }

      /**
       * Validates all inputs in the form and updates validation error styling and messages.
       *
       * @param {HTMLFormElement} form - The form element containing atoll-inputs.
       * @returns {void}
       */
      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('atoll-input')
        inputs.forEach(input => {
          const isValid = input.checkValidity()
          if (!isValid) {
            input.setAttribute('invalid', 'true')
            const existingMsg = input.getAttribute('error-message') || input.errorMessage
            const innerInput = input.shadowRoot ? input.shadowRoot.querySelector('input') : input.querySelector('input')
            const validationMsg = existingMsg || (innerInput ? innerInput.validationMessage : 'Invalid value.')
            input.setAttribute('error-message', validationMsg)
          } else {
            input.removeAttribute('invalid')
            input.removeAttribute('error-message')
          }
        })
      }

      /**
       * Sets up event listeners on inputs within a form to reset validation states.
       *
       * @param {HTMLFormElement} form - The form element to register listeners on.
       * @returns {void}
       */
      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target.closest('atoll-input')
  
          if (!input) {
            return
          }
  
          input.setCustomValidity('')
          input.removeAttribute('invalid')
          input.removeAttribute('error-message')
          updateStatus('')
        })
      }

      registerInputReset(loginForm)
      registerInputReset(recoveryForm)
      registerInputReset(newPasswordForm)

      recoveryCodeInput.addEventListener('input', () => {
        const val = recoveryCodeInput.value || ''
        const clean = val.replace(/[^A-Za-z0-9]/g, '').toUpperCase()
        let raw = clean
        if (raw.startsWith('RC')) {
          raw = raw.slice(2)
        }
        let formatted = 'RC'
        if (raw.length > 0) {
          formatted += '-' + raw.substring(0, 4)
        }
        if (raw.length > 4) {
          formatted += '-' + raw.substring(4, 8)
        }
        if (raw.length > 8) {
          formatted += '-' + raw.substring(8, 12)
        }
        if (raw.length > 12) {
          formatted += '-' + raw.substring(12, 16)
        }
        recoveryCodeInput.value = formatted
      })

      btnShowRecovery.addEventListener('click', (e) => {
        e.preventDefault()
        viewLogin.classList.add('d-none')
        viewLogin.classList.remove('d-flex')
        viewRecovery.classList.remove('d-none')
        viewRecovery.classList.add('d-flex')
        if (identityInput.value) {
          recoveryUsernameInput.value = identityInput.value
        }
        updateStatus('')
        showGlobalAlert('')
        recoveryForm.classList.remove('was-validated')
        recoveryUsernameInput.setCustomValidity('')
        recoveryUsernameInput.removeAttribute('invalid')
        recoveryUsernameInput.removeAttribute('error-message')
        recoveryCodeInput.setCustomValidity('')
        recoveryCodeInput.removeAttribute('invalid')
        recoveryCodeInput.removeAttribute('error-message')
      })

      btnCancelRecovery.addEventListener('click', () => {
        viewRecovery.classList.add('d-none')
        viewRecovery.classList.remove('d-flex')
        viewLogin.classList.remove('d-none')
        viewLogin.classList.add('d-flex')
        recoveryCodeInput.value = ''
        updateStatus('')
        showGlobalAlert('')
        recoveryForm.classList.remove('was-validated')
        recoveryUsernameInput.setCustomValidity('')
        recoveryUsernameInput.removeAttribute('invalid')
        recoveryUsernameInput.removeAttribute('error-message')
        recoveryCodeInput.setCustomValidity('')
        recoveryCodeInput.removeAttribute('invalid')
        recoveryCodeInput.removeAttribute('error-message')
      })

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      /**
       * Extracts the ALTCHA security verification payload from a widget.
       *
       * @param {HTMLElement} widget - The Altcha widget element.
       * @returns {string|null} The payload or null if unavailable.
       */
      const getAltchaPayload = (widget) => {
        if (altchaPayload) {
          return altchaPayload
        }
        if (widget.value) {
          return widget.value
        }
        const attrVal = widget.getAttribute('value')
        if (attrVal) {
          return attrVal
        }
        const hiddenInput = widget.querySelector('input[name="altcha"]')
        if (hiddenInput && hiddenInput.value) {
          return hiddenInput.value
        }
        return null
      }

      /**
       * Renders the ALTCHA challenge widget inside the provided container.
       *
       * @param {HTMLElement} container - The container element for the widget.
       * @param {HTMLElement} submitBtn - The form submit button.
       * @returns {HTMLElement} The initialized Altcha widget.
       */
      const renderAltcha = (container, submitBtn) => {
        container.innerHTML = ''
        altchaPayload = null

        submitBtn.removeAttribute('loading')
        submitBtn.removeAttribute('disabled')

        const widget = document.createElement('altcha-widget')
        const challengeUrl = pb.buildURL('/api/altcha/challenge')
        const configObj = {}

        if (isTesting) {
          widget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          widget.setAttribute('challenge', challengeUrl)
          configObj.challenge = challengeUrl
        }
        widget.setAttribute('display', 'invisible')
        widget.setAttribute('auto', 'onload')
        widget.style.width = '100%'
        widget.style.maxWidth = '100%'
        widget.setAttribute('configuration', JSON.stringify(configObj))

        widget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || widget.value || null
        })

        widget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          const resolvedPayload = ev.detail?.payload || widget.value || null
          if (resolvedPayload) {
            altchaPayload = resolvedPayload
          }
          if (state === 'verifying') {
            if (loginSubmitPending) {
              submitBtn.setAttribute('loading', 'true')
            }
          } else if (state === 'verified') {
            if (submitBtn === loginSubmit && loginSubmitPending) {
              submitBtn.removeAttribute('loading')
              loginSubmitPending = false
              if (typeof loginForm.requestSubmit === 'function') {
                loginForm.requestSubmit()
              } else {
                loginForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            if (!loginSubmitPending) {
              submitBtn.removeAttribute('loading')
            }
          } else if (state === 'error') {
            altchaPayload = null
            submitBtn.removeAttribute('loading')
            updateStatus('Security challenge failed. Please try again.', true)
            loginSubmitPending = false
          }
        })

        container.appendChild(widget)
        return widget
      }

      // Initialize Altcha on Login Form
      activeAltchaWidget = renderAltcha(altchaContainer, loginSubmit)

      $bus.on('app:reconnected', () => {
        activeAltchaWidget = renderAltcha(altchaContainer, loginSubmit)
      })

      /**
       * Checks if biometric capabilities are available and renders
       * enrolled accounts from the registry if any are present.
       */
      const initBiometricLogin = async () => {
        if (!biometric || !await biometric.isAvailable()) {
          return
        }

        const enrolledUsers = JSON.parse(localStorage.getItem('atoll_biometric_users') || '[]')
        if (enrolledUsers.length === 0) {
          return
        }

        // Show the biometric section
        biometricSection.classList.remove('d-none')
        biometricSection.classList.add('d-flex')

        biometricContainer.innerHTML = ''

        for (const user of enrolledUsers) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('type', 'button')
          btn.setAttribute('variant', 'outline')
          btn.setAttribute('block', 'true')
          btn.setAttribute('test-id', `biometric-login-${user.username}`)
          btn.setAttribute('text', `Log in as @${user.username}`)

          btn.addEventListener('click', async () => {
            // Disable other login inputs & buttons to prevent concurrent submissions
            btn.setAttribute('loading', 'true')
            identityInput.setAttribute('disabled', 'true')
            passwordInput.setAttribute('disabled', 'true')
            loginSubmit.setAttribute('disabled', 'true')
            linkRegister.setAttribute('disabled', 'true')
            btnShowRecovery.setAttribute('disabled', 'true')
            showGlobalAlert('')
            updateStatus('')

            try {
              updateStatus('Scan your fingerprint/biometric to authenticate...')
              const masterKey = await biometric.retrieveMasterKey(user.id)
              if (!masterKey) {
                throw new Error('Biometric verification failed or was canceled.')
              }

              updateStatus('Decrypting credentials...')
              const credsRaw = localStorage.getItem(`atoll_biometric_credentials_${user.id}`)
              if (!credsRaw) {
                throw new Error('Biometric credentials not found.')
              }

              const creds = JSON.parse(credsRaw)
              const decryptedBuffer = await $worker.execute('worker:crypto_secretbox_open_easy', {
                ciphertext: creds.ciphertext,
                nonce: creds.nonce,
                key: masterKey
              })

              if (!decryptedBuffer) {
                throw new Error('Failed to decrypt credentials with master key.')
              }

              const credentials = JSON.parse(new TextDecoder().decode(decryptedBuffer))
              const { keyB, username } = credentials

              let currentPayload = getAltchaPayload(activeAltchaWidget)
              if (isTesting && !currentPayload) {
                currentPayload = 'atoll-mock-bypass-token'
              }

              if (!currentPayload) {
                btn.removeAttribute('loading')
                identityInput.removeAttribute('disabled')
                passwordInput.removeAttribute('disabled')
                loginSubmit.removeAttribute('disabled')
                linkRegister.removeAttribute('disabled')
                btnShowRecovery.removeAttribute('disabled')
                updateStatus('Security challenge is required. Please wait for it to load.', true)
                return
              }

              updateStatus('Logging in...')
              const loginRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/login`), {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  identity: username,
                  password: keyB,
                  altcha: currentPayload
                })
              })

              if (!loginRes.ok) {
                const errData = await loginRes.json()
                throw new Error(errData.error || 'Login failed')
              }

              const authData = await loginRes.json()
              const record = authData.record

              // Check if TOTP is enabled and device is untrusted
              let isDeviceTrusted = false
              if (record.totp_enabled) {
                const localToken = localStorage.getItem('device_trust_token')
                if (localToken) {
                  const msgUint8 = new TextEncoder().encode(localToken)
                  const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
                  const hashArray = Array.from(new Uint8Array(hashBuffer))
                  const hash = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
                  const hashes = record.trusted_device_hashes || []
                  isDeviceTrusted = hashes.includes(hash)
                }
              } else {
                isDeviceTrusted = true
              }

              if (record.totp_enabled && !isDeviceTrusted) {
                // Save authentication without unlocking the vault yet
                pb.authStore.save(authData.token, record)
                await $storage.saveConfigs([
                  {
                    key: 'pb_url',
                    value: pb.baseUrl
                  },
                  {
                    key: 'pb_token',
                    value: pb.authStore.token
                  }
                ])

                const { purgeVaultKey } = await import('../../utils/keys.js')
                purgeVaultKey()

                $state.currentUser = record
                $state.isAuthenticated = true
                $state.isVaultUnlocked = false
                updateStatus('Please complete Two-Step Verification.')
                return
              }

              // Decrypt private keypair with masterKey (VMK)
              updateStatus('Decrypting private keys...')
              const encryptedPrivateKeys = record.encrypted_private_keys
              if (!encryptedPrivateKeys) {
                throw new Error('Vault metadata missing from user account.')
              }

              const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
                encrypted_private_keys: encryptedPrivateKeys,
                master_key: masterKey
              })

              // Initialize Crypto Worker session
              updateStatus('Initializing session...')
              await $worker.execute('worker:set_token', { token: authData.token })
              await $worker.execute('worker:init_keys', {
                ...decryptedKeys,
                id: record.id
              })

              // Authenticate SDK instance & persist config
              pb.authStore.save(authData.token, record)
              await $storage.saveConfigs([
                {
                  key: 'pb_url',
                  value: pb.baseUrl
                },
                {
                  key: 'pb_token',
                  value: pb.authStore.token
                }
              ])

              const { purgeVaultKey } = await import('../../utils/keys.js')
              purgeVaultKey()

              // Flip UI State & Start Sync
              $state.currentUser = {
                ...record,
                ...decryptedKeys
              }
              $bus.emit('auth:unlocked', {
                keys: decryptedKeys,
                userRecord: record
              })
              $state.isAuthenticated = true
              $state.isVaultUnlocked = true
              $state.pendingRegistrationInvite = null

              try {
                await $sync.startSubscriptions()
              } catch (err) {
                if (err && err.message && !err.message.includes('subscription')) {
                  throw err
                }
              }

              updateStatus('Login complete!')
            } catch (error) {
              pb.authStore.clear()
              const { purgeVaultKey } = await import('../../utils/keys.js')
              purgeVaultKey()
              $state.isAuthenticated = false
              $state.isVaultUnlocked = false

              btn.removeAttribute('loading')
              identityInput.removeAttribute('disabled')
              passwordInput.removeAttribute('disabled')
              loginSubmit.removeAttribute('disabled')
              linkRegister.removeAttribute('disabled')
              btnShowRecovery.removeAttribute('disabled')

              updateStatus(error.message || 'Failed to log in', true)
              showGlobalAlert(error.message || 'Failed to log in')
              activeAltchaWidget.reset()
            }
          })

          biometricContainer.appendChild(btn)
        }
      }

      await initBiometricLogin()

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        identityInput.setCustomValidity('')
        passwordInput.setCustomValidity('')
        updateStatus('')

        updateValidationFeedback(loginForm)

        if (!identityInput.checkValidity() || !passwordInput.checkValidity()) {
          event.stopPropagation()
          loginForm.classList.add('was-validated')
          return
        }

        const rawIdentity = identityInput.value
        const rawPassword = passwordInput.value

        let currentPayload = getAltchaPayload(activeAltchaWidget)
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        // Immediately set loading and disable inputs/links
        loginSubmit.setAttribute('loading', 'true')
        identityInput.setAttribute('disabled', 'true')
        passwordInput.setAttribute('disabled', 'true')
        linkRegister.setAttribute('disabled', 'true')
        btnShowRecovery.setAttribute('disabled', 'true')

        if (!currentPayload) {
          loginSubmitPending = true
          updateStatus('Verifying security challenge...')
          return
        }

        const { deriveAuthAndVaultKeys, purgeVaultKey } = await import('../../utils/keys.js')

        try {
          loginForm.classList.remove('was-validated')
          updateStatus('Deriving encryption keys...')

          const { keyA, keyB, canonicalUsername } = await deriveAuthAndVaultKeys(rawIdentity, rawPassword)

          updateStatus('Logging in...')
          const loginRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/login`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              identity: canonicalUsername,
              password: keyB,
              altcha: currentPayload
            })
          })

          if (!loginRes.ok) {
            const errData = await loginRes.json()
            throw new Error(errData.error || 'Login failed')
          }

          const authData = await loginRes.json()
          const record = authData.record

          // Check if TOTP is enabled and device is untrusted
          let isDeviceTrusted = false
          if (record.totp_enabled) {
            const localToken = localStorage.getItem('device_trust_token')
            if (localToken) {
              const msgUint8 = new TextEncoder().encode(localToken)
              const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
              const hashArray = Array.from(new Uint8Array(hashBuffer))
              const hash = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
              const hashes = record.trusted_device_hashes || []
              isDeviceTrusted = hashes.includes(hash)
            }
          } else {
            isDeviceTrusted = true
          }

          if (record.totp_enabled && !isDeviceTrusted) {
            // Save authentication without unlocking the vault yet
            pb.authStore.save(authData.token, record)
            await $storage.saveConfigs([
              {
                key: 'pb_url',
                value: pb.baseUrl
              },
              {
                key: 'pb_token',
                value: pb.authStore.token
              }
            ])
            purgeVaultKey()

            $state.currentUser = record
            $state.isAuthenticated = true
            $state.isVaultUnlocked = false
            updateStatus('Please complete Two-Step Verification.')
            return
          }

          // Step 1: Decrypt Vault Master Key (VMK) using Key A
          updateStatus('Unlocking vault...')
          const encryptedMasterKeys = record.encrypted_master_keys
          const encryptedPrivateKeys = record.encrypted_private_keys

          if (!encryptedMasterKeys || !encryptedPrivateKeys) {
            throw new Error('Vault metadata missing from user account.')
          }

          const masterKey = await $worker.execute('worker:crypto_secretbox_open_easy', {
            ciphertext: encryptedMasterKeys.ciphertext,
            nonce: encryptedMasterKeys.nonce,
            key: keyA
          })

          if (!masterKey) {
            throw new Error('Failed to decrypt vault with derived key.')
          }

          // Step 2: Decrypt private keypair with VMK
          updateStatus('Decrypting private keys...')
          const decryptedKeys = await $worker.execute('worker:decrypt_vault', {
            encrypted_private_keys: encryptedPrivateKeys,
            master_key: masterKey
          })

          // Step 3: Strict Async Sequencing - Initialize Crypto Worker session
          updateStatus('Initializing session...')
          await $worker.execute('worker:set_token', { token: authData.token })
          await $worker.execute('worker:init_keys', {
            ...decryptedKeys,
            id: record.id
          })

          // Authenticate SDK instance & persist config
          pb.authStore.save(authData.token, record)
          await $storage.saveConfigs([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          // Purge Key A & Key B from memory
          purgeVaultKey()

          // Step 4: Flip UI State & Start Sync
          $state.currentUser = {
            ...record,
            ...decryptedKeys
          }
          $bus.emit('auth:unlocked', {
            keys: decryptedKeys,
            userRecord: record
          })
          $state.isAuthenticated = true
          $state.isVaultUnlocked = true
          $state.pendingRegistrationInvite = null

          try {
            await $sync.startSubscriptions()
          } catch (err) {
            // Verify if error is subscription related and should be gracefully bypassed
            if (err && err.message && !err.message.includes('subscription')) {
              throw err
            }
          }

          updateStatus('Login complete!')
        } catch (error) {
          // Zombie State Guard: Reset session on any vault decryption failure
          pb.authStore.clear()
          purgeVaultKey()
          $state.isAuthenticated = false
          $state.isVaultUnlocked = false

          // Re-enable elements on error
          loginSubmit.removeAttribute('loading')
          identityInput.removeAttribute('disabled')
          passwordInput.removeAttribute('disabled')
          linkRegister.removeAttribute('disabled')
          btnShowRecovery.removeAttribute('disabled')

          updateStatus(error.message || 'Failed to log in', true)
          showGlobalAlert(error.message || 'Failed to log in')
          activeAltchaWidget.reset()
        }
      })

      recoveryForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')
        updateValidationFeedback(recoveryForm)

        if (!recoveryForm.checkValidity()) {
          e.stopPropagation()
          recoveryForm.classList.add('was-validated')
          return
        }

        const username = recoveryUsernameInput.value.trim()
        const code = recoveryCodeInput.value.trim()

        try {
          recoveryForm.classList.remove('was-validated')
          updateStatus('Verifying recovery limit...')
          btnVerifyRecovery.setAttribute('loading', 'true')
          recoveryUsernameInput.setAttribute('disabled', 'true')
          recoveryCodeInput.setAttribute('disabled', 'true')
          btnCancelRecovery.setAttribute('disabled', 'true')

          let recoverRes
          try {
            const recoverFn = authApi && typeof authApi.recoverAccount === 'function' ? authApi.recoverAccount : (u) => pb.send('/api/custom/recover_account', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: u })
            })
            recoverRes = await recoverFn(username)
          } catch (err) {
            if (err.status === 429) {
              throw new Error(err.message || 'Too many recovery attempts. Please try again later.')
            }
            throw new Error('Invalid or expired recovery code.')
          }

          if (!recoverRes || !recoverRes.user || !recoverRes.user.recovery_wraps) {
            throw new Error('Invalid or expired recovery code.')
          }

          fetchedUserPayload = recoverRes.user
          const { recovery_wraps: recoveryWraps, encrypted_private_keys: encryptedPrivateKeys } = fetchedUserPayload

          if (!recoveryWraps || recoveryWraps.length === 0) {
            throw new Error('Invalid or expired recovery code.')
          }

          updateStatus('Verifying recovery code...')
          let decryptedMasterKey = null
          matchedWrapIndex = -1
          currentRecoveryAuthProof = null

          for (let i = 0; i < recoveryWraps.length; i++) {
            try {
              const decryptedResult = await $worker.execute('worker:decrypt_master_key_with_code', {
                code,
                wrap: recoveryWraps[i]
              })
              if (decryptedResult) {
                decryptedMasterKey = typeof decryptedResult === 'object' && decryptedResult !== null ? decryptedResult.master_key : decryptedResult
                if (typeof decryptedResult === 'object' && decryptedResult !== null && decryptedResult.auth_proof) {
                  currentRecoveryAuthProof = decryptedResult.auth_proof
                }
                matchedWrapIndex = i
                break
              }
            } catch {
              /* Keep searching */
            }
          }

          if (!decryptedMasterKey) {
            throw new Error('Invalid or expired recovery code.')
          }

          if (!encryptedPrivateKeys) {
            throw new Error('This account is missing vault key data.')
          }

          decryptedMasterKeyHex = decryptedMasterKey

          updateStatus('Decrypting private keys...')
          decryptedKeysLocal = await $worker.execute('worker:decrypt_vault', {
            encrypted_private_keys: encryptedPrivateKeys,
            master_key: decryptedMasterKeyHex
          })

          btnVerifyRecovery.removeAttribute('loading')
          recoveryUsernameInput.removeAttribute('disabled')
          recoveryCodeInput.removeAttribute('disabled')
          btnCancelRecovery.removeAttribute('disabled')

          viewRecovery.classList.add('d-none')
          viewRecovery.classList.remove('d-flex')
          viewNewPassword.classList.remove('d-none')
          viewNewPassword.classList.add('d-flex')
          updateStatus('Code verified! Please set a new password.')
          newPasswordForm.classList.remove('was-validated')
          newPasswordInput.setCustomValidity('')
          newPasswordConfirmInput.setCustomValidity('')
          newPasswordInput.removeAttribute('invalid')
          newPasswordInput.removeAttribute('error-message')
          newPasswordConfirmInput.removeAttribute('invalid')
          newPasswordConfirmInput.removeAttribute('error-message')
        } catch (err) {
          btnVerifyRecovery.removeAttribute('loading')
          recoveryUsernameInput.removeAttribute('disabled')
          recoveryCodeInput.removeAttribute('disabled')
          btnCancelRecovery.removeAttribute('disabled')

          if (err.status && err.status >= 500) {
            showGlobalAlert(err.message || 'Recovery failed.')
          } else {
            const errorMsg = err.message || 'Invalid or expired recovery code.'
            recoveryCodeInput.errorMessage = errorMsg
            recoveryCodeInput.invalid = true
            recoveryCodeInput.setCustomValidity(errorMsg)
            recoveryCodeInput.setAttribute('error-message', errorMsg)
            recoveryCodeInput.setAttribute('invalid', 'true')
            recoveryForm.classList.add('was-validated')
          }
          updateStatus('')
        }
      })

      /**
       * Evaluates password complexity and updates the visual strength meter bar synchronously.
       *
       * @returns {Promise<void>}
       */
      const updateNewStrength = async () => {
        const password = newPasswordInput.value
        const confirmPassword = newPasswordConfirmInput.value

        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score, width, colorClass, text } = await evaluatePasswordStrength(password, 12)
        zxcvbnScore = score
        newStrengthBar.style.width = width
        newStrengthBar.className = colorClass
        newStrengthText.textContent = text

        if (password.length >= 12 && zxcvbnScore >= 3 && password === confirmPassword) {
          btnSaveNewPassword.removeAttribute('disabled')
        } else {
          btnSaveNewPassword.setAttribute('disabled', 'true')
        }
      }

      newPasswordInput.addEventListener('input', updateNewStrength)
      newPasswordConfirmInput.addEventListener('input', updateNewStrength)

      newPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        showGlobalAlert('')

        const newPassword = newPasswordInput.value
        const newPasswordConfirm = newPasswordConfirmInput.value

        const { evaluatePasswordStrength } = await import('../../utils/passwordUtils.js')
        const { score } = await evaluatePasswordStrength(newPassword, 12)

        if (newPassword.length < 12) {
          newPasswordInput.setCustomValidity('Password must be at least 12 characters.')
        } else if (score < 3) {
          newPasswordInput.setCustomValidity('Password is too weak. Please use a stronger password.')
        } else {
          newPasswordInput.setCustomValidity('')
        }

        if (newPassword !== newPasswordConfirm) {
          newPasswordConfirmInput.setCustomValidity('Passwords do not match.')
        } else {
          newPasswordConfirmInput.setCustomValidity('')
        }

        updateValidationFeedback(newPasswordForm)

        if (!newPasswordForm.checkValidity()) {
          e.stopPropagation()
          newPasswordForm.classList.add('was-validated')
          return
        }

        try {
          newPasswordForm.classList.remove('was-validated')
          updateStatus('Deriving new vault password...')
          btnSaveNewPassword.setAttribute('loading', 'true')
          newPasswordInput.setAttribute('disabled', 'true')
          newPasswordConfirmInput.setAttribute('disabled', 'true')

          const { deriveAuthAndVaultKeys, purgeVaultKey } = await import('../../utils/keys.js')
          const { keyA: newKeyA, keyB: newKeyB } = await deriveAuthAndVaultKeys(fetchedUserPayload.username, newPassword)

          updateStatus('Re-encrypting Master Key...')
          const newPasswordWrap = await $worker.execute('worker:encrypt_master_key_with_kek', {
            master_key: decryptedMasterKeyHex,
            KEK: newKeyA
          })

          /* Client-Side Purge of the matched recovery code wrap */
          const remainingWraps = [...fetchedUserPayload.recovery_wraps]
          if (matchedWrapIndex !== -1) {
            remainingWraps.splice(matchedWrapIndex, 1)
          }

          updateStatus('Updating password and vault on server...')
          const rotateFn = authApi && typeof authApi.rotatePassword === 'function' ? authApi.rotatePassword : (kb, vmk, rw, uid, proof) => pb.send('/api/custom/rotate_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              newKeyBHash: kb,
              newWrappedVMK: vmk,
              remainingWraps: rw,
              userId: uid,
              recoveryAuthProof: proof
            })
          })
          const rotateRes = await rotateFn(newKeyB, newPasswordWrap, remainingWraps, fetchedUserPayload.id, currentRecoveryAuthProof)

          if (!rotateRes || !rotateRes.token || !rotateRes.record) {
            throw new Error('Password rotation failed.')
          }

          if (rotateRes.record.id !== fetchedUserPayload.id) {
            throw new Error('User mismatch after password rotation.')
          }

          const authRecord = rotateRes.record
          const token = rotateRes.token

          updateStatus('Initializing session...')
          await $worker.execute('worker:set_token', { token })
          await $worker.execute('worker:init_keys', {
            ...decryptedKeysLocal,
            id: authRecord.id
          })

          pb.authStore.save(token, authRecord)
          await $storage.saveConfigs([
            {
              key: 'pb_url',
              value: pb.baseUrl
            },
            {
              key: 'pb_token',
              value: pb.authStore.token
            }
          ])

          purgeVaultKey()

          $state.currentUser = {
            ...authRecord,
            ...decryptedKeysLocal
          }
          $bus.emit('auth:unlocked', {
            keys: decryptedKeysLocal,
            userRecord: authRecord
          })
          $state.isAuthenticated = true
          $state.isVaultUnlocked = true
          $state.pendingRegistrationInvite = null

          try {
            await $sync.startSubscriptions()
          } catch (err) {
            if (err && err.message && !err.message.includes('subscription')) {
              throw err
            }
          }

          updateStatus('Recovery and password reset complete!')
        } catch (err) {
          btnSaveNewPassword.removeAttribute('loading')
          newPasswordInput.removeAttribute('disabled')
          newPasswordConfirmInput.removeAttribute('disabled')
          showGlobalAlert(err.message || 'Password rotation failed.')
          updateStatus('')
        }
      })
    }
  })
</script>
