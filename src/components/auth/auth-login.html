<template id="auth-login">
  <div class="card shadow">
    <div class="card-body p-4">
      <!-- Centralized Error Alert Box for system errors -->
      <div ref="globalAlert" class="alert alert-danger d-none mb-3" role="alert" data-testid="globalAlert"></div>

      <!-- Login Form -->
      <form ref="loginForm" class="needs-validation" novalidate>
        <h3 class="card-title mb-4 text-center">Login</h3>
        <div class="mb-3">
          <label for="{{ ref_identity }}" class="form-label">Username or Email</label>
          <input ref="identity" name="identity" id="{{ ref_identity }}" type="text" class="form-control" placeholder="Enter username or email" required autocomplete="username" data-testid="username" aria-describedby="{{ ref_identityFeedback }}" aria-invalid="false">
          <div id="{{ ref_identityFeedback }}" class="invalid-feedback" data-testid="identity-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3">
          <label for="{{ ref_password }}" class="form-label">Password</label>
          <div class="password-field-container">
            <input ref="password" name="password" id="{{ ref_password }}" type="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" data-testid="password" aria-describedby="{{ ref_passwordFeedback }}" aria-invalid="false">
            <button type="button" class="password-toggle focus-ring" ref="passwordToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div id="{{ ref_passwordFeedback }}" class="invalid-feedback" data-testid="password-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3 d-flex justify-content-center" ref="altchaContainer"></div>
        <button type="submit" class="btn btn-primary w-100 mb-2" ref="loginSubmit" data-testid="loginSubmit">Log In</button>
        
        <div class="text-end">
          <a href="#" ref="linkForgotPassword" class="text-decoration-none small">Forgot Password?</a>
        </div>
      </form>

      <!-- Forgot Password Form -->
      <form ref="forgotPasswordForm" class="d-none needs-validation" novalidate>
        <h3 class="card-title mb-3 text-center">Reset Password</h3>
        <p class="text-muted small text-center mb-4">Enter your email address and solve the security challenge to request a password reset link.</p>
        <div class="mb-3">
          <label for="{{ ref_forgotEmail }}" class="form-label">Email Address</label>
          <input ref="forgotEmail" name="forgotEmail" id="{{ ref_forgotEmail }}" type="email" class="form-control" placeholder="Enter email" required autocomplete="email" aria-describedby="{{ ref_forgotEmailFeedback }}" aria-invalid="false">
          <div id="{{ ref_forgotEmailFeedback }}" class="invalid-feedback" data-testid="forgot-email-feedback" aria-live="polite"></div>
        </div>
        <div class="mb-3 d-flex justify-content-center" ref="forgotAltchaContainer"></div>
        <button type="submit" class="btn btn-primary w-100 mb-2" ref="forgotSubmit">Send Reset Link</button>
        <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none" ref="btnBackToLogin">Back to Login</button>
      </form>

      <div class="mt-3 text-center" ref="registerLinkContainer">
        <small class="text-muted">Don't have an account? <a href="#" ref="linkRegister" data-testid="linkRegister" class="text-decoration-none">Register here</a></small>
      </div>
      <div ref="statusMsg" data-testid="statusMsg" class="mt-3 text-muted text-center small" style="min-height: 1.25rem;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, globalStore, storage, config, bootstrap, cryptoWorker, eventBus, utils }) => {
      const { pb } = pocketbase
      const { $storage } = storage
      const { $state } = globalStore
      const { $config } = config
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $url } = utils

      const loginForm = refs('loginForm')
      const loginSubmit = refs('loginSubmit')
      const altchaContainer = refs('altchaContainer')
      const identityInput = refs('identity')
      const passwordInput = refs('password')
      const passwordToggle = refs('passwordToggle')
      const linkForgotPassword = refs('linkForgotPassword')

      const forgotPasswordForm = refs('forgotPasswordForm')
      const forgotEmailInput = refs('forgotEmail')
      const forgotAltchaContainer = refs('forgotAltchaContainer')
      const forgotSubmit = refs('forgotSubmit')
      const btnBackToLogin = refs('btnBackToLogin')

      const linkRegister = refs('linkRegister')
      const registerLinkContainer = refs('registerLinkContainer')
      const statusMsg = refs('statusMsg')
      const globalAlert = refs('globalAlert')

      let dropdownInstance = null
      let activeAltchaWidget = null
      let loginSubmitPending = false
      let forgotSubmitPending = false
      let altchaPayload = null

      const isTesting = import.meta.env.MODE === 'testing'

      const updateStatus = (message, isError = false) => {
        statusMsg.textContent = message
        if (isError) {
          statusMsg.classList.remove('text-muted')
          statusMsg.classList.add('text-danger')
        } else {
          statusMsg.classList.remove('text-danger')
          statusMsg.classList.add('text-muted')
        }
      }

      const showGlobalAlert = (msg) => {
        if (globalAlert) {
          if (msg) {
            globalAlert.textContent = msg
            globalAlert.classList.remove('d-none')
          } else {
            globalAlert.classList.add('d-none')
          }
        }
      }

      const getFeedbackElement = (input) => {
        const ariaDescribedBy = input.getAttribute('aria-describedby')
        if (ariaDescribedBy) {
          const target = document.getElementById(ariaDescribedBy)
          if (target) {
            return target
          }
        }
        const container = input.closest('.mb-3') || input.parentNode
        if (container) {
          return container.querySelector('.invalid-feedback')
        }
        return null
      }

      const updateValidationFeedback = (form) => {
        const inputs = form.querySelectorAll('input, select, textarea')
        inputs.forEach(input => {
          const feedback = getFeedbackElement(input)
          const isValid = input.checkValidity()
          input.setAttribute('aria-invalid', isValid ? 'false' : 'true')
          if (feedback) {
            feedback.textContent = input.validationMessage || 'Invalid value.'
          }
        })
      }

      const registerInputReset = (form) => {
        form.addEventListener('input', (e) => {
          const input = e.target
          if (input.setCustomValidity) {
            input.setCustomValidity('')
          }
          const isValid = input.checkValidity()
          input.setAttribute('aria-invalid', isValid ? 'false' : 'true')
          const feedback = getFeedbackElement(input)
          if (feedback) {
            feedback.textContent = input.validationMessage
          }
          updateStatus('')
        })
      }

      registerInputReset(loginForm)
      registerInputReset(forgotPasswordForm)

      const setupToggle = (input, toggle) => {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          const icon = toggle.querySelector('i')
          icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash'
        })
      }
      setupToggle(passwordInput, passwordToggle)

      linkRegister.addEventListener('click', (e) => {
        e.preventDefault()
        $state.authView = 'register'
      })

      const renderAltcha = (container, submitBtn) => {
        container.innerHTML = ''
        altchaPayload = null
  
        if (!submitBtn._originalHtml) {
          submitBtn._originalHtml = submitBtn.innerHTML
        }
        submitBtn.disabled = false

        const widget = document.createElement('altcha-widget')
        widget.setAttribute('display', 'invisible')
        widget.setAttribute('auto', 'off')
        widget.style.width = '100%'
        widget.style.maxWidth = '100%'
  
        const configObj = {}
        if (isTesting) {
          widget.setAttribute('test', 'true')
          configObj.test = true
        } else {
          widget.setAttribute('challenge', pb.buildURL('/api/altcha/challenge'))
          configObj.challenge = pb.buildURL('/api/altcha/challenge')
        }
        widget.setAttribute('configuration', JSON.stringify(configObj))

        widget.addEventListener('verified', (ev) => {
          altchaPayload = ev.detail?.payload || null
          console.log('[ALTCHA DEBUG] verified event payload:', altchaPayload)
        })

        widget.addEventListener('statechange', (ev) => {
          const state = ev.detail?.state
          console.log('[ALTCHA DEBUG]', 'state:', state, 'value:', widget.value, 'payload:', ev.detail?.payload)
          if (state === 'verifying') {
            altchaPayload = null
            submitBtn.disabled = true
            submitBtn.innerHTML = `
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              <span role="status">Verifying security challenge...</span>
            `
          } else if (state === 'verified') {
            if (ev.detail?.payload) {
              altchaPayload = ev.detail.payload
            }
            submitBtn.disabled = false
            submitBtn.innerHTML = submitBtn._originalHtml
            if (submitBtn === loginSubmit && loginSubmitPending) {
              loginSubmitPending = false
              if (typeof loginForm.requestSubmit === 'function') {
                loginForm.requestSubmit()
              } else {
                loginForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            } else if (submitBtn === forgotSubmit && forgotSubmitPending) {
              forgotSubmitPending = false
              if (typeof forgotPasswordForm.requestSubmit === 'function') {
                forgotPasswordForm.requestSubmit()
              } else {
                forgotPasswordForm.dispatchEvent(new Event('submit', {
                  cancelable: true,
                  bubbles: true
                }))
              }
            }
          } else if (state === 'unverified') {
            altchaPayload = null
            submitBtn.disabled = false
            submitBtn.innerHTML = submitBtn._originalHtml
          } else if (state === 'error') {
            altchaPayload = null
            submitBtn.disabled = false
            submitBtn.innerHTML = submitBtn._originalHtml
            updateStatus('Security challenge failed. Please try again.', true)
            loginSubmitPending = false
            forgotSubmitPending = false
          }
        })

        container.appendChild(widget)
        return widget
      }

      // Initialize Altcha on Login Form
      activeAltchaWidget = renderAltcha(altchaContainer, loginSubmit)

      linkForgotPassword.addEventListener('click', (e) => {
        e.preventDefault()
        loginForm.classList.add('d-none')
        forgotPasswordForm.classList.remove('d-none')
        registerLinkContainer.classList.add('d-none')
        showGlobalAlert('')
        updateStatus('')
        activeAltchaWidget = renderAltcha(forgotAltchaContainer, forgotSubmit)
      })

      btnBackToLogin.addEventListener('click', (e) => {
        e.preventDefault()
        forgotPasswordForm.classList.add('d-none')
        loginForm.classList.remove('d-none')
        registerLinkContainer.classList.remove('d-none')
        showGlobalAlert('')
        updateStatus('')
        activeAltchaWidget = renderAltcha(altchaContainer, loginSubmit)
      })

      const handleSuccessfulLogin = async () => {
        await $storage.saveConfigs([
          {
            key: 'pb_url',
            value: pb.baseUrl
          },
          {
            key: 'pb_token',
            value: pb.authStore.token
          }
        ])

        updateStatus('Login successful! Checking vault...')
        $state.isAuthenticated = true
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        identityInput.setCustomValidity('')
        passwordInput.setCustomValidity('')
        updateStatus('')

        updateValidationFeedback(loginForm)

        if (!identityInput.checkValidity() || !passwordInput.checkValidity()) {
          event.stopPropagation()
          loginForm.classList.add('was-validated')
          return
        }

        const identity = identityInput.value
        const password = passwordInput.value

        let currentPayload = altchaPayload
        if (activeAltchaWidget && activeAltchaWidget.value) {
          currentPayload = activeAltchaWidget.value
        }
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        if (!currentPayload) {
          if (activeAltchaWidget) {
            loginSubmitPending = true
            activeAltchaWidget.verify()
          }
          return
        }

        try {
          loginForm.classList.remove('was-validated')
          updateStatus('Logging in...')

          const loginRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/login`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              identity,
              password,
              altcha: currentPayload
            })
          })

          if (!loginRes.ok) {
            const errData = await loginRes.json()
            throw new Error(errData.error || 'Login failed')
          }

          const authData = await loginRes.json()
  
          // Authenticate SDK instance
          pb.authStore.save(authData.token, authData.record)

          await handleSuccessfulLogin()
        } catch (error) {
          console.error('Login error:', error)
          updateStatus(error.message || 'Failed to log in', true)
          if (activeAltchaWidget && typeof activeAltchaWidget.reset === 'function') {
            activeAltchaWidget.reset()
          }
        }
      })

      forgotPasswordForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        event.stopImmediatePropagation()
        showGlobalAlert('')

        forgotEmailInput.setCustomValidity('')
        updateStatus('')

        updateValidationFeedback(forgotPasswordForm)

        if (!forgotEmailInput.checkValidity()) {
          event.stopPropagation()
          forgotPasswordForm.classList.add('was-validated')
          return
        }

        const email = forgotEmailInput.value

        let currentPayload = altchaPayload
        if (activeAltchaWidget && activeAltchaWidget.value) {
          currentPayload = activeAltchaWidget.value
        }
        if (isTesting && !currentPayload) {
          currentPayload = 'atoll-mock-bypass-token'
        }

        if (!currentPayload) {
          if (activeAltchaWidget) {
            forgotSubmitPending = true
            activeAltchaWidget.verify()
          }
          return
        }

        try {
          forgotPasswordForm.classList.remove('was-validated')
          updateStatus('Sending password reset request...')

          const resetRes = await fetch($url.normalizeUrl(`${pb.baseUrl}/api/custom/password-reset`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email,
              altcha: currentPayload
            })
          })

          if (!resetRes.ok) {
            const errData = await resetRes.json()
            throw new Error(errData.error || 'Failed to send reset link')
          }

          updateStatus('If an account exists, a password reset link has been sent!')
          forgotEmailInput.value = ''
          if (activeAltchaWidget && typeof activeAltchaWidget.reset === 'function') {
            activeAltchaWidget.reset()
          }
        } catch (error) {
          console.error('Reset error:', error)
          updateStatus(error.message || 'Failed to send reset link', true)
          if (activeAltchaWidget && typeof activeAltchaWidget.reset === 'function') {
            activeAltchaWidget.reset()
          }
        }
      })
    }
  })
</script>
