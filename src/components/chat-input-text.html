<template id="chat-input-text">
  <div class="d-flex align-items-end chat-input-text">
    <input type="file" ref="fileInput" class="d-none">
    
    <button class="btn btn-ghost btn-circle" type="button" ref="attachButton" title="Attach file" disabled="{{ isDisabled }}">
      <i class="bi bi-paperclip fs-5"></i>
    </button>
    
    <button class="btn btn-ghost btn-circle" type="button" ref="micButton" title="Voice message" disabled="{{ isDisabled }}">
      <i class="bi bi-mic fs-5"></i>
    </button>

    <div class="input-wrapper">
      <textarea
        id="{{ ref_messageInput }}"
        ref="messageInput"
        class="form-control"
        placeholder="Type a message..."
        rows="1"
        disabled="{{ isDisabled }}"
      >{{ currentMessageText }}</textarea>
      
      <button class="btn btn-ghost emoji-button" type="button" ref="emojiButton" title="Emojis" disabled="{{ isDisabled }}">
        <i class="bi bi-emoji-smile fs-5"></i>
      </button>
    </div>

    <button class="btn btn-primary btn-circle" type="button" ref="sendButton" disabled="{{ isDisabled }}">
      <i class="bi bi-send-fill"></i>
      <div class="spinner-border spinner-border-sm d-none" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </button>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSending: Boolean,
      isUploading: Boolean
    },
    server: ({ state }) => ({
      currentMessageText: ''
    }),
    getters: {
      isDisabled: (state) => (state.isSending || state.isUploading ? true : false)
    },
    client: ({ refs, state, globalStore, eventBus, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const messageInput = refs('messageInput')
      const emojiButton = refs('emojiButton')
      const fileInput = refs('fileInput')

      // Sync initial global state
      state.currentMessageText = $state.currentMessageText || ''
      if (messageInput) {
        messageInput.value = state.currentMessageText
      }

      const autoExpand = () => {
        messageInput.style.height = 'auto'
        messageInput.style.height = messageInput.scrollHeight + 'px'
      }

      messageInput.addEventListener('input', () => {
        $state.currentMessageText = messageInput.value
        state.currentMessageText = messageInput.value
        autoExpand()
      }, { signal })

      // Watch for programmatic changes to currentMessageText
      if (typeof $state.subscribe === 'function') {
        $state.subscribe('currentMessageText', (val) => {
          if (messageInput.value !== val) {
            messageInput.value = val || ''
            state.currentMessageText = val || ''
            autoExpand()
          }
        })
      }

      // Initial expand
      autoExpand()

      refs('attachButton').addEventListener('click', () => {
        fileInput.click()
      }, { signal })

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0]
        if (file) {
          $bus.emit('file-selected', { file })
          fileInput.value = ''
        }
      }, { signal })

      refs('micButton').addEventListener('click', () => {
        $bus.emit('mic-clicked')
      }, { signal })

      refs('sendButton').addEventListener('click', () => {
        $bus.emit('send-clicked')
      }, { signal })

      emojiButton.addEventListener('click', (e) => {
        const rect = emojiButton.getBoundingClientRect()
        $bus.emit('SHOW_REACTION_PICKER', {
          x: rect.left - 300,
          y: rect.top - 410,
          targetId: 'CHAT_INPUT'
        })
      }, { signal })

      $bus.on('EMOJI_SELECTED', (payload) => {
        const emoji = payload.emoji
        const start = messageInput.selectionStart
        const end = messageInput.selectionEnd
        const text = messageInput.value
        const before = text.substring(0, start)
        const after = text.substring(end)
  
        const newValue = before + emoji + after
        messageInput.value = newValue
        $state.currentMessageText = newValue
        state.currentMessageText = newValue
  
        // Restore focus and set caret position
        messageInput.focus()
        const newPos = start + emoji.length
        messageInput.setSelectionRange(newPos, newPos)
  
        autoExpand()
      })

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $bus.emit('send-clicked')
        }
      }, { signal })
    }
  })
</script>
