<template id="chat-input-text">
  <div class="input-group d-flex">
    <input type="file" ref="fileInput" class="d-none" accept="image/*, video/*, audio/*">
    <button class="btn btn-outline-secondary" type="button" ref="attachButton" title="Attach file" disabled="{{ isDisabled }}">
      <i class="bi bi-paperclip"></i>
    </button>
    <button class="btn btn-outline-secondary" type="button" ref="micButton" title="Voice message" disabled="{{ isDisabled }}">
      <i class="bi bi-mic"></i>
    </button>
    <textarea
      id="{{ ref_messageInput }}"
      ref="messageInput"
      class="form-control"
      placeholder="Type a message..."
      rows="1"
      style="resize: none; max-height: 200px;"
      disabled="{{ isDisabled }}"
    >{{ currentMessageText }}</textarea>
    <button class="btn btn-primary d-flex align-items-center" type="button" ref="sendButton" disabled="{{ isDisabled }}">
      <span class="me-1 d-none d-sm-inline">Send</span>
      <i class="bi bi-send"></i>
      <div class="spinner-border spinner-border-sm d-none" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </button>
  </div>
</template>

<style>
  textarea {
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .btn {
    align-self: flex-end;
    height: 38px;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSending: Boolean,
      isUploading: Boolean
    },
    server: ({ state }) => ({
      currentMessageText: ''
    }),
    getters: {
      isDisabled: (state) => (state.isSending || state.isUploading ? true : false)
    },
    client: ({ refs, state, globalStore, eventBus, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const messageInput = refs('messageInput')
      const fileInput = refs('fileInput')

      // Sync initial global state
      state.currentMessageText = $state.currentMessageText || ''
      if (messageInput) {
        messageInput.value = state.currentMessageText
      }

      const autoExpand = () => {
        messageInput.style.height = 'auto'
        messageInput.style.height = messageInput.scrollHeight + 'px'
      }

      messageInput.addEventListener('input', () => {
        $state.currentMessageText = messageInput.value
        state.currentMessageText = messageInput.value
        autoExpand()
      }, { signal })

      // Watch for programmatic changes to currentMessageText
      if (typeof $state.subscribe === 'function') {
        $state.subscribe('currentMessageText', (val) => {
          if (messageInput.value !== val) {
            messageInput.value = val || ''
            state.currentMessageText = val || ''
            autoExpand()
          }
        })
      }

      // Initial expand
      autoExpand()

      refs('attachButton').addEventListener('click', () => {
        fileInput.click()
      }, { signal })

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0]
        if (file) {
          $bus.emit('file-selected', { file })
          fileInput.value = ''
        }
      }, { signal })

      refs('micButton').addEventListener('click', () => {
        $bus.emit('mic-clicked')
      }, { signal })

      refs('sendButton').addEventListener('click', () => {
        $bus.emit('send-clicked')
      }, { signal })

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $bus.emit('send-clicked')
        }
      }, { signal })
    }
  })
</script>
