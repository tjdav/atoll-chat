<template id="atoll-chip">
  <div 
    ref="chipElement" 
    class="{{ chipClasses }}" 
    role="{{ chipRole }}" 
    tabindex="{{ chipTabindex }}"
    aria-selected="{{ isAriaSelected }}"
  >
    <span class="atoll-chip-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([disabled]),
  :host(.disabled) {
    opacity: 0.45;
    pointer-events: none;
  }

  /* Base Chip Modifier */
  .atoll-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    background-color: var(--atoll-chip-custom-bg, var(--atoll-chip-bg, var(--atoll-bg-surface-secondary, #F5F5F5)));
    color: var(--atoll-chip-custom-color, var(--atoll-chip-color, var(--atoll-text-primary, #111111)));
    border: 1px solid var(--atoll-chip-border, transparent);
    border-radius: 9999px;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    box-sizing: border-box;
  }

  .atoll-chip:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.35);
  }

  .atoll-chip.disabled,
  .atoll-chip[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Slotted Avatar / Thumbnail Images */
  .atoll-chip img[slot="leading"],
  .atoll-chip [slot="leading"] img,
  .atoll-chip .atoll-chip-avatar {
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }

  /* Content Container & Slots */
  .atoll-chip-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }

  .atoll-chip-label {
    display: inline-block;
    line-height: 1;
  }

  /* Removable Close Button Trigger */
  .atoll-chip-remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    margin-left: 2px;
    color: currentColor;
    opacity: 0.65;
    cursor: pointer;
    border-radius: 50%;
    transition: opacity 0.15s ease-in-out, background-color 0.15s ease-in-out;
    position: relative;
    z-index: 2;
  }

  .atoll-chip-remove:hover {
    opacity: 1;
    background-color: rgba(0, 0, 0, 0.1);
  }

  .atoll-chip-remove:focus-visible {
    outline: none;
    opacity: 1;
  }

  /* Variant Modifiers (Default: secondary) */
  :host .atoll-chip,
  :host([variant="secondary"]) .atoll-chip {
    --atoll-chip-bg: var(--atoll-bg-surface-secondary, #F5F5F5);
    --atoll-chip-color: var(--atoll-text-primary, #111111);
    --atoll-chip-border: transparent;
  }

  :host .atoll-chip:hover:not(.disabled),
  :host([variant="secondary"]) .atoll-chip:hover:not(.disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-secondary, #F5F5F5) 92%, #000000);
  }

  :host([variant="outline"]) .atoll-chip {
    --atoll-chip-bg: transparent;
    --atoll-chip-color: var(--atoll-text-primary, #111111);
    --atoll-chip-border: var(--atoll-border-subtle, #E8E8E8);
  }

  :host([variant="outline"]) .atoll-chip:hover:not(.disabled) {
    background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
  }

  :host([variant="primary"]) .atoll-chip {
    --atoll-chip-bg: var(--atoll-brand-primary, #06C755);
    --atoll-chip-color: #FFFFFF;
    --atoll-chip-border: transparent;
  }

  :host([variant="primary"]) .atoll-chip:hover:not(.disabled) {
    background-color: color-mix(in srgb, var(--atoll-brand-primary, #06C755) 90%, #000000);
  }

  :host([variant="ghost"]) .atoll-chip {
    --atoll-chip-bg: transparent;
    --atoll-chip-color: var(--atoll-text-primary, #111111);
    --atoll-chip-border: transparent;
  }

  :host([variant="ghost"]) .atoll-chip:hover:not(.disabled) {
    background-color: var(--atoll-brand-subtle, rgba(6, 199, 85, 0.12));
  }

  :host([variant="info"]) .atoll-chip {
    --atoll-chip-bg: rgba(66, 112, 237, 0.12);
    --atoll-chip-color: var(--atoll-rainbow-blue, #4270ED);
    --atoll-chip-border: transparent;
  }

  :host([variant="info"]) .atoll-chip:hover:not(.disabled) {
    background-color: rgba(66, 112, 237, 0.2);
  }

  :host([variant="danger"]) .atoll-chip {
    --atoll-chip-bg: rgba(255, 51, 75, 0.12);
    --atoll-chip-color: var(--atoll-rainbow-red, #FF334B);
    --atoll-chip-border: transparent;
  }

  :host([variant="danger"]) .atoll-chip:hover:not(.disabled) {
    background-color: rgba(255, 51, 75, 0.2);
  }

  /* Selected State Modifier */
  :host([selected]) .atoll-chip {
    --atoll-chip-bg: var(--atoll-brand-primary, #06C755) !important;
    --atoll-chip-color: #FFFFFF !important;
    --atoll-chip-border: transparent !important;
    font-weight: var(--atoll-font-weight-semibold, 600);
  }

  :host([selected]) .atoll-chip .atoll-chip-remove:hover {
    background-color: rgba(255, 255, 255, 0.2);
  }

  /* Size Modifiers (Default: md) */
  :host .atoll-chip,
  :host([size="md"]) .atoll-chip {
    height: var(--atoll-chip-height-md, 32px);
    padding: 0 12px;
    font-size: var(--atoll-font-size-body-2, 14px);
    font-weight: var(--atoll-font-weight-medium, 500);
  }

  :host .atoll-chip img[slot="leading"],
  :host .atoll-chip [slot="leading"] img,
  :host .atoll-chip .atoll-chip-avatar,
  :host([size="md"]) .atoll-chip img[slot="leading"],
  :host([size="md"]) .atoll-chip [slot="leading"] img,
  :host([size="md"]) .atoll-chip .atoll-chip-avatar {
    width: 24px;
    height: 24px;
  }

  :host .atoll-chip::before,
  :host([size="md"]) .atoll-chip::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 44px;
    width: 44px;
    z-index: 0;
  }

  :host([size="sm"]) .atoll-chip {
    height: var(--atoll-chip-height-sm, 24px);
    padding: 0 8px;
    font-size: var(--atoll-font-size-caption-1, 12px);
    font-weight: var(--atoll-font-weight-medium, 500);
  }

  :host([size="sm"]) .atoll-chip img[slot="leading"],
  :host([size="sm"]) .atoll-chip [slot="leading"] img,
  :host([size="sm"]) .atoll-chip .atoll-chip-avatar {
    width: 20px;
    height: 20px;
  }

  :host([size="sm"]) .atoll-chip::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 44px;
    width: 44px;
    z-index: 0;
  }

  :host([size="lg"]) .atoll-chip {
    height: var(--atoll-chip-height-lg, 40px);
    padding: 0 16px;
    font-size: var(--atoll-font-size-body-1, 16px);
    font-weight: var(--atoll-font-weight-medium, 500);
  }

  :host([size="lg"]) .atoll-chip img[slot="leading"],
  :host([size="lg"]) .atoll-chip [slot="leading"] img,
  :host([size="lg"]) .atoll-chip .atoll-chip-avatar {
    width: 28px;
    height: 28px;
  }

  /* Dark Mode Overrides */
  :host-context([data-atoll-theme="dark"]) .atoll-chip-secondary,
  :host-context([data-bs-theme="dark"]) .atoll-chip-secondary {
    --atoll-chip-bg: var(--atoll-bg-surface-tertiary, #1F1F1F);
    --atoll-chip-color: var(--atoll-text-primary, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-chip-secondary:hover:not(.disabled),
  :host-context([data-bs-theme="dark"]) .atoll-chip-secondary:hover:not(.disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #1F1F1F) 88%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-chip-outline,
  :host-context([data-bs-theme="dark"]) .atoll-chip-outline {
    --atoll-chip-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-chip-border: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.15));
  }

  :host-context([data-atoll-theme="dark"]) .atoll-chip-outline:hover:not(.disabled),
  :host-context([data-bs-theme="dark"]) .atoll-chip-outline:hover:not(.disabled) {
    background-color: var(--atoll-bg-surface-secondary, #161616);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      variant: {
        type: String,
        default: 'secondary',
        values: ['primary', 'secondary', 'outline', 'ghost', 'info', 'danger']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      selected: Boolean,
      removable: Boolean,
      disabled: Boolean,
      value: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      },
      bgColor: {
        type: String,
        default: ''
      },
      textColor: {
        type: String,
        default: ''
      }
    },

    style: {
      '--atoll-chip-custom-bg': (s) => s.bgColor || null,
      '--atoll-chip-custom-color': (s) => s.textColor || null
    },

    slots: {
      leading (nodes) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-leading'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      },

      trailing (nodes) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-trailing'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-label'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      }
    },

    getters: {
      chipClasses: (state) => {
        const classes = ['atoll-chip']
        if (state.removable) {
          classes.push('atoll-chip-removable')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        return classes.join(' ')
      },

      chipRole: (state) => (state.selected !== undefined && state.selected !== false ? 'option' : 'button'),
      isAriaSelected: (state) => (state.selected ? 'true' : 'false'),
      chipTabindex: (state) => (state.disabled ? '-1' : '0')
    },

    client: ({ state, refs, root, observe, signal }) => {
      const chip = refs('chipElement')
      let removeBtnEl = null

      // Imperatively sync the close/remove button when removable="true"
      const syncRemoveButton = () => {
        if (state.removable) {
          if (!removeBtnEl) {
            removeBtnEl = document.createElement('button')
            removeBtnEl.type = 'button'
            removeBtnEl.className = 'atoll-chip-remove'
            removeBtnEl.setAttribute('aria-label', 'Remove filter')

            // Imperative Web Component creation for remove icon
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'close')
            icon.setAttribute('size', state.size === 'sm' ? '14' : '16')

            removeBtnEl.appendChild(icon)

            removeBtnEl.addEventListener('click', (event) => {
              event.stopPropagation()
              event.preventDefault()

              // Dispatch custom remove event with payload
              root.dispatchEvent(
                new CustomEvent('atoll-chip-remove', {
                  bubbles: true,
                  composed: true,
                  detail: { value: state.value }
                })
              )
            }, { signal })
          } else {
            // Update the icon size dynamically if size changes
            const icon = removeBtnEl.querySelector('atoll-icon')
            if (icon) {
              icon.setAttribute('size', state.size === 'sm' ? '14' : '16')
            }
          }

          if (!chip.contains(removeBtnEl)) {
            chip.appendChild(removeBtnEl)
          }
        } else if (removeBtnEl && removeBtnEl.parentNode) {
          removeBtnEl.parentNode.removeChild(removeBtnEl)
        }
      }

      // Intercept and prevent click events in capture phase when disabled to block host listeners
      const preventClickWhenDisabled = (event) => {
        if (state.disabled) {
          event.preventDefault()
          event.stopPropagation()
          event.stopImmediatePropagation()
        }
      }

      root.addEventListener('click', preventClickWhenDisabled, {
        capture: true,
        signal
      })

      // Handle keyboard navigation (Enter / Space toggles or activates chip)
      chip.addEventListener('keydown', (event) => {
        if (state.disabled) {
          return
        }

        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          chip.click()
        } else if ((event.key === 'Backspace' || event.key === 'Delete') && state.removable) {
          event.preventDefault()
          if (removeBtnEl) {
            removeBtnEl.click()
          }
        }
      }, { signal })

      // Also add click listener to the inner chip element for consistency
      chip.addEventListener('click', preventClickWhenDisabled, { signal })

      // Observe reactive attribute updates
      observe('removable', syncRemoveButton)
      observe('size', syncRemoveButton)

      syncRemoveButton()
    }
  })
</script>
