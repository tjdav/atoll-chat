<template id="atoll-chip">
  <div 
    ref="chipElement" 
    class="atoll-chip" 
    role="{{ chipRole }}" 
    tabindex="{{ chipTabindex }}"
    aria-selected="{{ ariaSelectedAttr }}"
    aria-disabled="{{ ariaDisabledAttr }}"
  >
    <span class="atoll-chip-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    color-scheme: inherit;

    --chip-height: 32px;
    --chip-padding: 0 12px;
    --chip-font-size: var(--atoll-font-size-body-2, 14px);
    --chip-font-weight: 500;
    --chip-bg: var(--atoll-bg-surface-secondary, #F5F5F5);
    --chip-color: var(--atoll-text-primary, #111111);
    --chip-border: transparent;
    --chip-avatar-size: 24px;
    --chip-avatar-padding: 4px;
    --chip-focus-ring: rgba(4, 120, 53, 0.35);
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([disabled]),
  :host(.disabled) {
    opacity: 0.45;
    pointer-events: none;
  }

  /* Size Modifiers */
  :host([size="sm"]) {
    --chip-height: 28px;
    --chip-padding: 0 10px;
    --chip-font-size: var(--atoll-font-size-caption-1, 12px);
    --chip-avatar-size: 20px;
    --chip-avatar-padding: 4px;
  }

  :host([size="lg"]) {
    --chip-height: 38px;
    --chip-padding: 0 16px;
    --chip-font-size: var(--atoll-font-size-body-1, 16px);
    --chip-avatar-size: 28px;
    --chip-avatar-padding: 6px;
  }

  /* Variant Modifiers */
  :host([variant="secondary"]),
  :host(:not([variant])) {
    --chip-bg: var(--atoll-bg-surface-secondary, #F5F5F5);
    --chip-color: var(--atoll-text-primary, #111111);
  }

  :host([variant="outline"]) {
    --chip-bg: transparent;
    --chip-color: var(--atoll-text-primary, #111111);
    --chip-border: var(--atoll-border-subtle, #E8E8E8);
  }

  :host([variant="primary"]) {
    --chip-bg: var(--atoll-primary, var(--atoll-brand-primary, #047835));
    --chip-color: #FFFFFF;
    --chip-border: transparent;
  }

  :host([variant="ghost"]) {
    --chip-bg: transparent;
    --chip-border: transparent;
  }

  :host([variant="info"]) {
    --chip-bg: light-dark(rgba(42, 84, 209, 0.12), rgba(145, 179, 255, 0.16));
    --chip-color: light-dark(var(--atoll-info, #2A54D1), #91B3FF);
    --chip-border: transparent;
  }

  :host([variant="danger"]) {
    --chip-bg: light-dark(rgba(206, 17, 38, 0.12), rgba(255, 153, 165, 0.16));
    --chip-color: light-dark(var(--atoll-danger, #CE1126), #FF99A5);
    --chip-border: transparent;
  }

  /* Selected State Modifier */
  :host([selected]) {
    --chip-bg: var(--atoll-primary, var(--atoll-brand-primary, #047835)) !important;
    --chip-color: #FFFFFF !important;
    --chip-border: transparent !important;
    --chip-font-weight: 600;
  }

  /* Base Chip Wrapper */
  .atoll-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--chip-font-size);
    font-weight: var(--chip-font-weight);
    height: var(--chip-height);
    padding: var(--chip-padding);
    background-color: var(--atoll-chip-custom-bg, var(--chip-bg));
    color: var(--atoll-chip-custom-color, var(--chip-color));
    border: 1px solid var(--chip-border);
    border-radius: 9999px;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    box-sizing: border-box;
  }

  .atoll-chip:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--chip-focus-ring);
  }

  .atoll-chip.disabled,
  .atoll-chip[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Slotted Avatar / Thumbnail Images & Icons */
  slot[name="leading"],
  slot[name="trailing"] {
    display: contents !important;
  }

  ::slotted(img[slot="leading"]),
  ::slotted([slot="leading"] img),
  ::slotted(.atoll-chip-avatar) {
    border-radius: 50%;
    object-fit: cover;
    width: var(--chip-avatar-size, 20px);
    height: var(--chip-avatar-size, 20px);
    flex-shrink: 0;
    display: block;
  }

  ::slotted(atoll-icon[slot="leading"]),
  ::slotted(atoll-icon[slot="trailing"]) {
    --atoll-icon-size: var(--chip-icon-size, 16px);
    --icon-size: var(--chip-icon-size, 16px);
  }

  .atoll-chip:has(img[slot="leading"]),
  .atoll-chip:has([slot="leading"] img),
  .atoll-chip:has(.atoll-chip-avatar),
  :host(:has(img[slot="leading"])) .atoll-chip,
  :host(:has([slot="leading"] img)) .atoll-chip,
  :host(:has(.atoll-chip-avatar)) .atoll-chip {
    padding-left: var(--chip-avatar-padding);
  }

  /* Mobile Touch Target Expansion (sm and md sizes) */
  :host([size="sm"]) .atoll-chip::before,
  :host([size="md"]) .atoll-chip::before,
  :host(:not([size])) .atoll-chip::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 44px;
    width: 44px;
    z-index: 0;
  }

  /* Content Container & Slots */
  .atoll-chip-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }

  .atoll-chip-label {
    display: inline-block;
    line-height: 1;
  }

  /* Removable Close Button Trigger (Minimum 24px touch target) */
  .atoll-chip-remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    min-width: 24px;
    min-height: 24px;
    background: transparent;
    border: none;
    padding: 0;
    margin-left: 2px;
    margin-right: -4px;
    color: currentColor;
    opacity: 0.75;
    cursor: pointer;
    border-radius: 50%;
    transition: opacity 0.15s ease-in-out, background-color 0.15s ease-in-out;
    position: relative;
    z-index: 2;
    box-sizing: border-box;
  }

  .atoll-chip-remove:hover {
    opacity: 1;
    background-color: rgba(0, 0, 0, 0.1);
  }

  :host([selected]) .atoll-chip-remove:hover {
    background-color: rgba(255, 255, 255, 0.2);
  }

  .atoll-chip-remove:focus-visible {
    outline: none;
    opacity: 1;
    box-shadow: 0 0 0 2px var(--chip-focus-ring);
  }

  /* Hover States */
  :host([variant="secondary"]:not([selected])) .atoll-chip:hover:not(.disabled),
  :host(:not([variant]):not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-secondary, #F5F5F5) 92%, #000000);
  }

  :host([variant="outline"]:not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
  }

  :host([variant="primary"]:not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: color-mix(in srgb, var(--atoll-brand-primary, #047835) 90%, #000000);
  }

  :host([variant="ghost"]:not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: var(--atoll-brand-subtle, rgba(4, 120, 53, 0.12));
  }

  :host([variant="info"]:not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: rgba(42, 84, 209, 0.2);
  }

  :host([variant="danger"]:not([selected])) .atoll-chip:hover:not(.disabled) {
    background-color: rgba(206, 17, 38, 0.2);
  }

</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      variant: {
        type: String,
        default: 'secondary',
        values: ['primary', 'secondary', 'outline', 'ghost', 'info', 'danger']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      selected: Boolean,
      removable: Boolean,
      disabled: Boolean,
      value: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      },
      bgColor: {
        type: String,
        default: ''
      },
      textColor: {
        type: String,
        default: ''
      }
    },

    style: {
      '--atoll-chip-custom-bg': (s) => s.bgColor || null,
      '--atoll-chip-custom-color': (s) => s.textColor || null
    },

    slots: {
      leading (nodes) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          return nodes
        }

        return null
      },

      trailing (nodes) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          return nodes
        }

        return null
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-chip-label'
          nodes.forEach(node => span.appendChild(node))
          return [span]
        }

        return null
      }
    },

    getters: {
      chipRole: (state) => {
        if (state.selected !== undefined && state.selected !== false) return 'option'
        if (state.removable) return 'group'
        return 'button'
      },
      ariaSelectedAttr: (state) => (state.selected ? 'true' : null),
      ariaDisabledAttr: (state) => (state.disabled ? 'true' : null),
      chipTabindex: (state) => {
        if (state.disabled) return '-1'
        if (state.removable) return '-1'
        return '0'
      }
    },

    client: ({ state, refs, root, observe, signal }) => {
      const chip = refs('chipElement')
      let removeBtnEl = null

      const syncHostAttributes = () => {
        if (state.selected) {
          root.setAttribute('role', 'listbox')
          const labelText = state.text || root.textContent?.trim() || 'Filter option'
          root.setAttribute('aria-label', labelText)
        } else {
          root.removeAttribute('role')
          root.removeAttribute('aria-label')
        }

        if (state.disabled) {
          root.setAttribute('aria-disabled', 'true')
        } else {
          root.removeAttribute('aria-disabled')
        }
      }

      const syncRemoveButton = () => {
        if (state.removable) {
          if (!removeBtnEl) {
            removeBtnEl = document.createElement('button')
            removeBtnEl.type = 'button'
            removeBtnEl.className = 'atoll-chip-remove'
            removeBtnEl.setAttribute('aria-label', 'Remove filter')

            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'close')
            icon.setAttribute('size', state.size === 'sm' ? '14' : '16')

            removeBtnEl.appendChild(icon)

            removeBtnEl.addEventListener('click', (event) => {
              event.stopPropagation()
              event.preventDefault()

              root.dispatchEvent(
                new CustomEvent('atoll-chip-remove', {
                  bubbles: true,
                  composed: true,
                  detail: { value: state.value }
                })
              )
            }, { signal })
          } else {
            const icon = removeBtnEl.querySelector('atoll-icon')
            if (icon) {
              icon.setAttribute('size', state.size === 'sm' ? '14' : '16')
            }
          }

          if (!chip.contains(removeBtnEl)) {
            chip.appendChild(removeBtnEl)
          }
        } else if (removeBtnEl && removeBtnEl.parentNode) {
          removeBtnEl.parentNode.removeChild(removeBtnEl)
        }
      }

      const preventClickWhenDisabled = (event) => {
        if (state.disabled) {
          event.preventDefault()
          event.stopPropagation()
          event.stopImmediatePropagation()
        }
      }

      root.addEventListener('click', preventClickWhenDisabled, {
        capture: true,
        signal
      })

      root.addEventListener('keydown', (event) => {
        if (state.disabled) {
          return
        }

        if ((event.key === 'Backspace' || event.key === 'Delete') && state.removable) {
          event.preventDefault()
          if (removeBtnEl) {
            removeBtnEl.click()
          }
        } else if ((event.key === 'Enter' || event.key === ' ') && !state.removable) {
          event.preventDefault()
          chip.click()
        }
      }, { signal })

      chip.addEventListener('click', preventClickWhenDisabled, { signal })

      syncHostAttributes()
      syncRemoveButton()

      observe('selected', syncHostAttributes)
      observe('disabled', syncHostAttributes)
      observe('removable', syncRemoveButton)
      observe('size', syncRemoveButton)
    }
  })
</script>
