<template id="atoll-dropdown">
  <details ref="details" open="{{ open }}">
    <summary
      ref="summary"
      class="{{ toggleClass }}"
      aria-haspopup="menu"
      data-testid="dropdown-toggle"
    >
      <slot name="label">{{ label }}</slot>
      <span class="atoll-caret" aria-hidden="true"></span>
    </summary>
    <ul ref="menu" class="{{ menuClass }}" role="menu" data-testid="dropdown-menu">
      <slot></slot>
    </ul>
  </details>
</template>

<style>
  :host {
    display: inline-block;
    position: relative;
  }

  summary.atoll-dropdown-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: var(--atoll-btn-padding-y, 0.375rem) var(--atoll-btn-padding-x, 0.75rem);
    font-family: inherit;
    font-size: var(--atoll-btn-font-size, 1rem);
    font-weight: 400;
    line-height: 1.5;
    color: var(--atoll-btn-fg, #fff);
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    background-color: var(--atoll-btn-bg, #0d6efd);
    border: 1px solid var(--atoll-btn-border-color, #0d6efd);
    border-radius: 0.375rem;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
    list-style: none;
  }

  summary.atoll-dropdown-toggle::-webkit-details-marker { display: none; }
  summary.atoll-dropdown-toggle::marker { content: ''; }

  summary.atoll-dropdown-toggle:hover {
    background-color: var(--atoll-btn-hover-bg, #0b5ed7);
    border-color: var(--atoll-btn-hover-bg, #0b5ed7);
  }

  summary.atoll-dropdown-toggle:focus-visible {
    outline: 2px solid var(--atoll-btn-bg, #0d6efd);
    outline-offset: 2px;
  }

  .atoll-caret {
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 0.3em solid;
    border-right: 0.3em solid transparent;
    border-bottom: 0;
    border-left: 0.3em solid transparent;
    transition: transform 0.15s ease-in-out;
  }

  :host([placement="up"])    .atoll-caret { transform: rotate(180deg); }
  :host([placement="start"]) .atoll-caret { transform: rotate(90deg); }
  :host([placement="end"])   .atoll-caret { transform: rotate(-90deg); }

  .atoll-dropdown-menu {
    position: absolute;
    z-index: 1000;
    display: none;
    min-width: 10rem;
    padding: 0.5rem 0;
    margin: 0.125rem 0 0;
    font-size: 1rem;
    color: #212529;
    text-align: left;
    list-style: none;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 0.375rem;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.175);
    top: 100%;
    left: 0;
  }

  details[open] > .atoll-dropdown-menu { display: block; }

  .atoll-dropdown-menu.atoll-drop-up {
    top: auto;
    bottom: 100%;
    margin: 0 0 0.125rem;
  }

  .atoll-dropdown-menu.atoll-drop-start {
    top: 0;
    right: 100%;
    left: auto;
    margin: 0 0.125rem 0 0;
  }

  .atoll-dropdown-menu.atoll-drop-end {
    top: 0;
    left: 100%;
    margin: 0 0 0 0.125rem;
  }

  /* Slotted menu content — styles reach through the default slot */
  ::slotted(.atoll-dropdown-item),
  ::slotted(li) .atoll-dropdown-item,
  .atoll-dropdown-item {
    display: block;
    width: 100%;
    padding: 0.25rem 1rem;
    clear: both;
    font-weight: 400;
    color: #212529;
    text-align: inherit;
    text-decoration: none;
    white-space: nowrap;
    background-color: transparent;
    border: 0;
    cursor: pointer;
  }

  ::slotted(.atoll-dropdown-item:hover),
  ::slotted(.atoll-dropdown-item:focus),
  ::slotted(li) .atoll-dropdown-item:hover,
  ::slotted(li) .atoll-dropdown-item:focus,
  .atoll-dropdown-item:hover,
  .atoll-dropdown-item:focus {
    color: #1e2125;
    background-color: #e9ecef;
  }

  ::slotted(.atoll-dropdown-item:focus-visible),
  ::slotted(li) .atoll-dropdown-item:focus-visible,
  .atoll-dropdown-item:focus-visible {
    outline: 2px solid #0d6efd;
    outline-offset: -2px;
  }

  ::slotted(.atoll-dropdown-divider),
  ::slotted(li) .atoll-dropdown-divider,
  .atoll-dropdown-divider {
    height: 0;
    margin: 0.5rem 0;
    border-top: 1px solid rgba(0, 0, 0, 0.15);
  }

  ::slotted(.atoll-dropdown-header),
  ::slotted(li) .atoll-dropdown-header,
  .atoll-dropdown-header {
    display: block;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    color: #6c757d;
    white-space: nowrap;
  }

  :host([disabled]) summary.atoll-dropdown-toggle {
    opacity: 0.65;
    pointer-events: none;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      variant: {
        type: String,
        default: 'primary',
        // Validate runs before server() merge — enums are inlined on purpose.
        validate: (v) => (
          ['primary', 'secondary', 'success', 'danger', 'warning', 'info', 'light', 'dark'].includes(v)
            ? true
            : `Unknown variant "${v}"`
        )
      },
      size: {
        type: String,
        default: 'md',
        validate: (v) => (
          ['sm', 'md', 'lg'].includes(v) ? true : `Unknown size "${v}"`
        )
      },
      placement: {
        type: String,
        default: 'down',
        reflect: true,
        validate: (v) => (
          ['down', 'up', 'start', 'end'].includes(v) ? true : `Unknown placement "${v}"`
        )
      },
      label: { type: String, default: '' },
      open: Boolean,
      disabled: Boolean
    },

    // Return maps into reactive state. Available on both server and client
    // via `state.variants` / `state.sizes` — no module-scope references needed
    // in getters or style functions (see llms.txt §2 serialization boundary).
    server () {
      return {
        variants: {
          primary:   { bg: '#0d6efd', fg: '#fff', hover: '#0b5ed7', border: '#0d6efd' },
          secondary: { bg: '#6c757d', fg: '#fff', hover: '#5c636a', border: '#6c757d' },
          success:   { bg: '#198754', fg: '#fff', hover: '#157347', border: '#198754' },
          danger:    { bg: '#dc3545', fg: '#fff', hover: '#bb2d3b', border: '#dc3545' },
          warning:   { bg: '#ffc107', fg: '#000', hover: '#ffca2c', border: '#ffc107' },
          info:      { bg: '#0dcaf0', fg: '#000', hover: '#31d2f2', border: '#0dcaf0' },
          light:     { bg: '#f8f9fa', fg: '#000', hover: '#f9fafb', border: '#f8f9fa' },
          dark:      { bg: '#212529', fg: '#fff', hover: '#1c1f23', border: '#212529' }
        },
        sizes: {
          sm: { py: '0.25rem', px: '0.5rem',  fs: '0.875rem' },
          md: { py: '0.375rem', px: '0.75rem', fs: '1rem' },
          lg: { py: '0.5rem',  px: '1rem',    fs: '1.25rem' }
        }
      }
    },

    // Getter context is destructured — required (CORALITE-E105)
    getters: {
      toggleClass: ({ state }) => {
        const parts = ['atoll-dropdown-toggle']
        if (state.size && state.size !== 'md') parts.push(`atoll-btn-${state.size}`)
        return parts.join(' ')
      },
      menuClass: ({ state }) => {
        const parts = ['atoll-dropdown-menu']
        if (state.placement && state.placement !== 'down') {
          parts.push(`atoll-drop-${state.placement}`)
        }
        return parts.join(' ')
      }
    },

    // Style getters receive `state` directly — sync only (CORALITE-E303)
    style: {
      '--atoll-btn-bg':           (state) => state.variants?.[state.variant]?.bg     ?? state.variants?.primary?.bg ?? '#0d6efd',
      '--atoll-btn-fg':           (state) => state.variants?.[state.variant]?.fg     ?? state.variants?.primary?.fg ?? '#fff',
      '--atoll-btn-hover-bg':     (state) => state.variants?.[state.variant]?.hover  ?? state.variants?.primary?.hover ?? '#0b5ed7',
      '--atoll-btn-border-color': (state) => state.variants?.[state.variant]?.border ?? state.variants?.primary?.border ?? '#0d6efd',
      '--atoll-btn-padding-y':    (state) => (state.sizes?.[state.size] ?? state.sizes?.md ?? { py: '0.375rem' }).py,
      '--atoll-btn-padding-x':    (state) => (state.sizes?.[state.size] ?? state.sizes?.md ?? { px: '0.75rem' }).px,
      '--atoll-btn-font-size':    (state) => (state.sizes?.[state.size] ?? state.sizes?.md ?? { fs: '1rem' }).fs
    },

    async client ({ state, root, refs, signal, emit, observe, updateComplete }) {
      const details = refs('details')
      const summary = refs('summary')
      const menu = refs('menu')

      const updateAriaRoles = () => {
        const items = menu.querySelectorAll('.atoll-dropdown-item')
        items.forEach((item) => {
          if (!item.hasAttribute('role')) {
            item.setAttribute('role', 'menuitem')
          }
        })

        const dividers = menu.querySelectorAll('.atoll-dropdown-divider')
        dividers.forEach((divider) => {
          if (!divider.hasAttribute('role')) {
            divider.setAttribute('role', 'separator')
          }
        })

        const lis = menu.querySelectorAll('li')
        lis.forEach((li) => {
          if (!li.hasAttribute('role')) {
            li.setAttribute('role', 'presentation')
          }
        })
      }

      updateAriaRoles()

      const observer = new MutationObserver(() => {
        updateAriaRoles()
      })
      observer.observe(menu, { childList: true, subtree: true })

      // 1. Native <details> toggle → mirror into state
      details.addEventListener('toggle', () => {
        if (state.disabled) {
          // Force-close: keyboard Enter/Space can still toggle a disabled summary
          if (details.open) details.open = false
          if (state.open) state.open = false
          return
        }
        if (state.open !== details.open) {
          state.open = details.open
        }
        emit('toggle', { open: details.open })
      }, { signal })

      // 2. Programmatic state.open → native details.open
      if (observe) {
        observe('open', (isOpen) => {
          if (details.open !== isOpen) {
            details.open = isOpen
          }
        })
      }

      // 3. Click outside → close
      document.addEventListener('click', (event) => {
        if (state.open && !root.contains(event.target)) {
          state.open = false
        }
      }, { signal })

      // 4. Escape → close and return focus to the toggle
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.open) {
          state.open = false
          summary.focus()
        }
      }, { signal })

      // 5. Click inside the menu on an item → close (event delegation)
      details.addEventListener('click', (event) => {
        if (event.target.closest('.atoll-dropdown-item')) {
          state.open = false
        }
      }, { signal })

      signal.addEventListener('abort', () => observer.disconnect())

      await updateComplete
    }
  })
</script>
