<template id="atoll-popup">
  <dialog 
    ref="modalElement"
    class="modal atoll-popup-dialog-native {{ dialogClasses }}" 
    aria-labelledby="{{ ref_modalTitle }}"
    aria-describedby="{{ ref_modalDesc }}"
  >
    <div class="modal-dialog modal-dialog-centered atoll-popup-dialog {{ dialogClasses }}">
      <div class="modal-content">
        <!-- Optional Hero Graphic / Illustration Slot -->
        <slot name="hero"></slot>

        <!-- Modal Header -->
        <div class="atoll-popup-header d-flex align-items-center justify-content-between mb-3" hidden="{{ hideHeader }}">
          <h3 ref="modalTitle" id="{{ ref_modalTitle }}" class="atoll-popup-title modal-title mb-0">
            {{ title }}
          </h3>
        </div>

        <!-- Popup Text Body -->
        <div class="atoll-popup-body">
          <p 
            ref="modalDesc" 
            id="{{ ref_modalDesc }}" 
            class="atoll-popup-description" 
            hidden="{{ hideDescription }}"
          >
            {{ description }}
          </p>

          <!-- Custom Content Slot (Forms, Checkboxes, Inputs) -->
          <slot></slot>
        </div>

        <!-- Action Button Bar -->
        <slot name="actions"></slot>
      </div>
    </div>
  </dialog>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      open: Boolean,
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      heroIcon: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        // 'alert' | 'confirm' | 'danger' | 'graphic'
        default: 'confirm'
      },
      size: {
        type: String,
        // 'sm' | 'md' | 'lg'
        default: 'md'
      },
      primaryText: {
        type: String,
        default: 'OK'
      },
      primaryDisabled: {
        type: Boolean,
        default: false
      },
      primaryLoading: {
        type: Boolean,
        default: false
      },
      secondaryText: {
        type: String,
        default: 'Cancel'
      },
      stackedActions: Boolean,
      actionsLayout: {
        type: String,
        default: 'horizontal'
      },
      tertiaryText: {
        type: String,
        default: ''
      },
      staticBackdrop: Boolean,
      disableBackdrop: Boolean,
      disableKeyboard: Boolean,
      disableFocus: Boolean
    },

    slots: {
      /**
       * Slot transformer for hero section.
       * @param {Node[]} nodes Slotted DOM nodes
       * @param {Object} state Component reactive state
       * @returns {HTMLElement[]|undefined} Transformed hero container nodes
       */
      hero (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.heroIcon) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.heroIcon)
          icon.setAttribute('size', '48')
          wrapper.appendChild(icon)
          return [wrapper]
        }

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        return undefined
      },

      /**
       * Slot transformer for action buttons.
       * @param {Node[]} nodes Slotted DOM nodes
       * @param {Object} state Component reactive state
       * @returns {HTMLElement[]|undefined} Transformed actions container nodes
       */
      actions (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        const isVertical = Boolean(state.tertiaryText || state.stackedActions || state.actionsLayout === 'vertical')
        const actionClasses = isVertical
          ? 'atoll-popup-actions atoll-popup-actions-vertical atoll-popup-actions-stacked'
          : 'atoll-popup-actions atoll-popup-actions-horizontal'

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = actionClasses
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        const hidePrimary = !state.primaryText
        const hideSecondary = state.variant === 'alert' || !state.secondaryText
        const hideTertiary = !state.tertiaryText

        if (hidePrimary && hideSecondary && hideTertiary) {
          return undefined
        }

        const wrapper = document.createElement('div')
        wrapper.className = actionClasses

        const createPrimaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'primaryBtn')
          const primaryVariant = state.variant === 'danger' ? 'danger' : 'primary'
          btn.setAttribute('variant', primaryVariant)
          btn.setAttribute('size', 'md')
          if (isVertical) {
            btn.setAttribute('block', 'true')
          }
          if (state.primaryDisabled) {
            btn.setAttribute('disabled', 'true')
          }
          if (state.primaryLoading) {
            btn.setAttribute('loading', 'true')
          }
          btn.textContent = state.primaryText
          return btn
        }

        const createSecondaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'secondaryBtn')
          btn.setAttribute('variant', 'secondary')
          btn.setAttribute('size', 'md')
          if (isVertical) {
            btn.setAttribute('block', 'true')
          }
          btn.textContent = state.secondaryText
          return btn
        }

        const createTertiaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'tertiaryBtn')
          btn.setAttribute('variant', 'outline')
          btn.setAttribute('size', 'md')
          if (isVertical) {
            btn.setAttribute('block', 'true')
          }
          btn.textContent = state.tertiaryText
          return btn
        }

        if (isVertical) {
          // Visual Order: Affirmative (Top) -> Tertiary (Mid) -> Dismissive (Bottom)
          if (!hidePrimary) {
            wrapper.appendChild(createPrimaryBtn())
          }
          if (!hideTertiary) {
            wrapper.appendChild(createTertiaryBtn())
          }
          if (!hideSecondary) {
            wrapper.appendChild(createSecondaryBtn())
          }
        } else {
          // Visual Order: Dismissive (Left) -> Affirmative (Right)
          if (!hideSecondary) {
            wrapper.appendChild(createSecondaryBtn())
          }
          if (!hidePrimary) {
            wrapper.appendChild(createPrimaryBtn())
          }
        }

        return [wrapper]
      }
    },

    getters: {
      primaryVariant: (state) => (state.variant === 'danger' ? 'danger' : 'primary'),
      hideDescription: (state) => !state.description,
      hideHeader: (state) => !state.title,
      ref_modalTitle: (_state, { instanceId }) => (instanceId ? `${instanceId}-title` : 'atoll-popup-title'),
      ref_modalDesc: (_state, { instanceId }) => (instanceId ? `${instanceId}-desc` : 'atoll-popup-desc'),
      dialogClasses: (state) => {
        const classes = []
        if (state.size) {
          classes.push(`atoll-popup-${state.size}`)
        } else {
          classes.push('atoll-popup-md')
        }
        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe, signal }) => {
      const dialogEl = refs('modalElement')

      /**
       * Opens the modal dialog and adds body locks.
       */
      const showModal = () => {
        if (!dialogEl.open) {
          dialogEl.classList.remove('atoll-popup-closing')
          dialogEl.classList.add('show')
          try {
            dialogEl.showModal()
          } catch {
            // Native showModal throw fallback if element state is already open
          }

          document.body.classList.add('modal-open')
          state.open = true
          root.dispatchEvent(
            new CustomEvent('atoll-popup-open', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        }
      }

      /**
       * Closes the modal dialog and removes body locks.
       */
      const hideModal = () => {
        if (!dialogEl.open && !state.open) {
          return
        }

        dialogEl.classList.remove('atoll-popup-closing')
        dialogEl.classList.remove('show')
        document.body.classList.remove('modal-open')
        if (dialogEl.open) {
          dialogEl.close()
        }
        state.open = false
        root.dispatchEvent(
          new CustomEvent('atoll-popup-close', {
            bubbles: true,
            composed: true,
            detail: {
              variant: state.variant,
              size: state.size,
              title: state.title
            }
          })
        )
      }

      /**
       * Triggers CSS shake animation feedback when static backdrop is clicked or Esc is pressed.
       */
      const triggerShake = () => {
        const dialogBox = dialogEl.querySelector('.modal-dialog')
        dialogBox.classList.remove('atoll-popup-static-shake')
        void dialogBox.offsetWidth
        dialogBox.classList.add('atoll-popup-static-shake')
      }

      // Cleanup on component disconnect
      signal.addEventListener('abort', () => {
        document.body.classList.remove('modal-open')
      })

      // Handle native Escape key (cancel event)
      dialogEl.addEventListener('cancel', (e) => {
        if (state.staticBackdrop || state.disableKeyboard) {
          e.preventDefault()
          if (state.staticBackdrop) {
            triggerShake()
          }
        } else {
          e.preventDefault()
          hideModal()
        }
      }, { signal })

      // Handle backdrop click detection and event delegation
      dialogEl.addEventListener('click', (e) => {
        // If click target is dialogEl itself (backdrop click)
        if (e.target === dialogEl) {
          if (state.staticBackdrop) {
            triggerShake()
          } else if (!state.disableBackdrop) {
            hideModal()
          }
          return
        }

        // Event delegation for primary, secondary, tertiary buttons
        const target = e.target.closest('atoll-button') || e.target.closest('.atoll-btn')
        if (!target) {
          return
        }

        const refAttr = target.getAttribute('ref') || ''
        const isPrimary = refAttr === 'primaryBtn' || refAttr.endsWith('__primaryBtn')
        const isSecondary = refAttr === 'secondaryBtn' || refAttr.endsWith('__secondaryBtn')
        const isTertiary = refAttr === 'tertiaryBtn' || refAttr.endsWith('__tertiaryBtn')

        if (isPrimary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-primary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        } else if (isSecondary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-secondary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
          hideModal()
        } else if (isTertiary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-tertiary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        }
      }, { signal })

      // Reactive observer for [open] attribute
      observe('open', (isOpen) => {
        if (isOpen) {
          showModal()
        } else {
          hideModal()
        }
      })

      // Expose public DOM interface methods on component host
      root.show = showModal
      root.hide = hideModal

      // Initial Sync if open attribute is set on mount
      if (state.open) {
        showModal()
      }
    }
  })
</script>
