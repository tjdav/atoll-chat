<template id="atoll-popup">
  <dialog 
    ref="modalElement"
    class="modal atoll-popup-dialog-native {{ dialogClasses }}" 
    aria-labelledby="{{ ref_modalTitle }}"
    aria-describedby="{{ ref_modalDesc }}"
  >
    <div class="modal-dialog modal-dialog-centered atoll-popup-dialog {{ dialogClasses }}">
      <div class="modal-content">
        <!-- Optional Hero Graphic / Illustration Slot -->
        <slot name="hero"></slot>

        <!-- Modal Header -->
        <div class="atoll-popup-header d-flex align-items-center justify-content-between mb-3" hidden="{{ hideHeader }}">
          <h3 ref="modalTitle" id="{{ ref_modalTitle }}" class="atoll-popup-title modal-title mb-0">
            {{ title }}
          </h3>
        </div>

        <!-- Popup Text Body -->
        <div class="atoll-popup-body">
          <p 
            ref="modalDesc" 
            id="{{ ref_modalDesc }}" 
            class="atoll-popup-description" 
            hidden="{{ hideDescription }}"
          >
            {{ description }}
          </p>

          <!-- Custom Content Slot (Forms, Checkboxes, Inputs) -->
          <slot></slot>
        </div>

        <!-- Action Button Bar -->
        <slot name="actions"></slot>
      </div>
    </div>
  </dialog>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      open: Boolean,
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      heroIcon: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        // 'alert' | 'confirm' | 'danger' | 'graphic'
        default: 'confirm'
      },
      size: {
        type: String,
        // 'sm' | 'md' | 'lg'
        default: 'md'
      },
      primaryText: {
        type: String,
        default: 'OK'
      },
      secondaryText: {
        type: String,
        default: 'Cancel'
      },
      stackedActions: Boolean,
      actionsLayout: {
        type: String,
        default: 'horizontal'
      },
      tertiaryText: {
        type: String,
        default: ''
      },
      staticBackdrop: Boolean,
      disableBackdrop: Boolean,
      disableKeyboard: Boolean,
      disableFocus: Boolean
    },

    slots: {
      hero (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.heroIcon) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.heroIcon)
          icon.setAttribute('size', '48')
          wrapper.appendChild(icon)
          return [wrapper]
        }

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        return undefined
      },

      actions (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        const isVertical = !!state.tertiaryText || state.stackedActions || state.actionsLayout === 'vertical'
        const actionClasses = isVertical
          ? 'atoll-popup-actions atoll-popup-actions-vertical atoll-popup-actions-stacked'
          : 'atoll-popup-actions atoll-popup-actions-horizontal'

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = actionClasses
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        const hidePrimary = !state.primaryText
        const hideSecondary = state.variant === 'alert' || !state.secondaryText
        const hideTertiary = !state.tertiaryText

        if (hidePrimary && hideSecondary && hideTertiary) {
          return undefined
        }

        const wrapper = document.createElement('div')
        wrapper.className = actionClasses

        if (isVertical) {
          // Visual Order: Affirmative (Top) -> Tertiary (Mid) -> Dismissive (Bot)
          if (!hidePrimary) {
            const btn = document.createElement('atoll-button')
            btn.setAttribute('ref', 'primaryBtn')
            const primaryVariant = state.variant === 'danger' ? 'danger' : 'primary'
            btn.setAttribute('variant', primaryVariant)
            btn.setAttribute('size', 'md')
            btn.setAttribute('block', 'true')
            btn.textContent = state.primaryText
            wrapper.appendChild(btn)
          }

          if (!hideTertiary) {
            const btn = document.createElement('atoll-button')
            btn.setAttribute('ref', 'tertiaryBtn')
            btn.setAttribute('variant', 'outline')
            btn.setAttribute('size', 'md')
            btn.setAttribute('block', 'true')
            btn.textContent = state.tertiaryText
            wrapper.appendChild(btn)
          }

          if (!hideSecondary) {
            const btn = document.createElement('atoll-button')
            btn.setAttribute('ref', 'secondaryBtn')
            btn.setAttribute('variant', 'secondary')
            btn.setAttribute('size', 'md')
            btn.setAttribute('block', 'true')
            btn.textContent = state.secondaryText
            wrapper.appendChild(btn)
          }
        } else {
          // Visual Order: Dismissive (Left) -> Affirmative (Right)
          if (!hideSecondary) {
            const btn = document.createElement('atoll-button')
            btn.setAttribute('ref', 'secondaryBtn')
            btn.setAttribute('variant', 'secondary')
            btn.setAttribute('size', 'md')
            btn.setAttribute('block', 'true')
            btn.textContent = state.secondaryText
            wrapper.appendChild(btn)
          }

          if (!hidePrimary) {
            const btn = document.createElement('atoll-button')
            btn.setAttribute('ref', 'primaryBtn')
            const primaryVariant = state.variant === 'danger' ? 'danger' : 'primary'
            btn.setAttribute('variant', primaryVariant)
            btn.setAttribute('size', 'md')
            btn.setAttribute('block', 'true')
            btn.textContent = state.primaryText
            wrapper.appendChild(btn)
          }
        }

        return [wrapper]
      }
    },

    getters: {
      primaryVariant: (state) => (state.variant === 'danger' ? 'danger' : 'primary'),

      hideDescription: (state) => !state.description,

      hideHeader: (state) => !state.title,

      dialogClasses: (state) => {
        const classes = []

        if (state.size) {
          classes.push(`atoll-popup-${state.size}`)
        } else {
          classes.push('atoll-popup-md')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe, signal }) => {
      const dialogEl = refs('modalElement')

      if (!dialogEl) return

      let isClosing = false

      const showModal = () => {
        if (!dialogEl.open) {
          isClosing = false
          dialogEl.classList.remove('atoll-popup-closing')
          try {
            dialogEl.showModal()
          } catch (e) {
            // fallback if showModal is already open
          }
          document.body.classList.add('modal-open')
          state.open = true
          root.dispatchEvent(
            new CustomEvent('atoll-popup-open', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size
              }
            })
          )
        }
      }

      const hideModal = () => {
        if (!dialogEl.open || isClosing) return
        isClosing = true
        dialogEl.classList.add('atoll-popup-closing')

        const finalizeClose = () => {
          dialogEl.removeEventListener('animationend', finalizeClose)
          dialogEl.classList.remove('atoll-popup-closing')
          if (dialogEl.open) {
            dialogEl.close()
          }
          document.body.classList.remove('modal-open')
          state.open = false
          isClosing = false
          root.dispatchEvent(
            new CustomEvent('atoll-popup-close', {
              bubbles: true,
              composed: true,
              detail: { variant: state.variant }
            })
          )
        }

        dialogEl.addEventListener('animationend', finalizeClose, { once: true })
        setTimeout(finalizeClose, 250)
      }

      // Handle native Escape key (cancel event)
      dialogEl.addEventListener('cancel', (e) => {
        if (state.staticBackdrop || state.disableKeyboard) {
          e.preventDefault()
        } else {
          e.preventDefault()
          hideModal()
        }
      }, { signal })

      // Handle backdrop click detection and event delegation
      dialogEl.addEventListener('click', (e) => {
        // If click target is dialogEl itself (backdrop click)
        if (e.target === dialogEl) {
          if (!state.staticBackdrop && !state.disableBackdrop) {
            hideModal()
          }
          return
        }

        // Event delegation for primary, secondary, tertiary buttons
        const target = e.target.closest('atoll-button') || e.target.closest('.atoll-btn')
        if (!target) return

        const refAttr = target.getAttribute('ref') || ''
        const isPrimary = refAttr === 'primaryBtn' || refAttr.endsWith('__primaryBtn')
        const isSecondary = refAttr === 'secondaryBtn' || refAttr.endsWith('__secondaryBtn')
        const isTertiary = refAttr === 'tertiaryBtn' || refAttr.endsWith('__tertiaryBtn')

        if (isPrimary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-primary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size
              }
            })
          )
        } else if (isSecondary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-secondary', {
              bubbles: true,
              composed: true,
              detail: { variant: state.variant }
            })
          )
          hideModal()
        } else if (isTertiary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-tertiary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size
              }
            })
          )
        }
      }, { signal })

      // Reactive observer for [open] attribute
      observe('open', (isOpen) => {
        if (isOpen) {
          showModal()
        } else {
          hideModal()
        }
      })

      // Expose public DOM interface methods on component host
      root.show = showModal
      root.hide = hideModal

      // Initial Sync if open attribute is set on mount
      if (state.open) {
        showModal()
      }
    }
  })
</script>
