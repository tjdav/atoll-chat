<template id="atoll-popup">
  <div 
    ref="modalElement"
    class="modal fade" 
    tabindex="-1" 
    role="dialog"
    aria-modal="true"
    aria-labelledby="{{ ref_modalTitle }}"
    aria-describedby="{{ ref_modalDesc }}"
  >
    <div class="modal-dialog atoll-popup-dialog {{ dialogClasses }}">
      <atoll-button 
          ref="btnClose" 
          icon-only="true" 
          variant="ghost" 
          size="md"
          aria-label="Close"
          hidden="{{ hideCloseBtn }}"
          class="d-block position-absolute top-0 end-0"
        >
        <atoll-icon name="close" size="24"></atoll-icon>
      </atoll-button>
      <div class="modal-content">
        <!-- Optional Hero Graphic / Illustration Slot -->
        <slot name="hero"></slot>

        <!-- Modal Header -->
        <div class="atoll-popup-header d-flex align-items-center justify-content-between mb-3" hidden="{{ hideHeader }}">
          <h3 ref="modalTitle" id="{{ ref_modalTitle }}" class="atoll-popup-title mb-0">
            {{ title }}
          </h3>
        </div>

        <!-- Popup Text Body -->
        <div class="atoll-popup-body">
          <p 
            ref="modalDesc" 
            id="{{ ref_modalDesc }}" 
            class="atoll-popup-description" 
            hidden="{{ hideDescription }}"
          >
            {{ description }}
          </p>

          <!-- Custom Content Slot (Forms, Checkboxes, Inputs) -->
          <slot></slot>
        </div>

        <!-- Action Button Bar -->
        <slot name="actions"></slot>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      open: Boolean,
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      heroIcon: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        // 'alert' | 'confirm' | 'danger' | 'graphic'
        default: 'confirm'
      },
      size: {
        type: String,
        // 'sm' | 'md' | 'lg'
        default: 'md'
      },
      primaryText: {
        type: String,
        default: 'OK'
      },
      secondaryText: {
        type: String,
        default: 'Cancel'
      },
      stackedActions: Boolean,
      staticBackdrop: Boolean,
      closeable: Boolean
    },

    slots: {
      hero (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.heroIcon) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.heroIcon)
          icon.setAttribute('size', '48')
          wrapper.appendChild(icon)
          return [wrapper]
        }

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        return null
      },

      actions (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        const actionClasses = state.stackedActions ? 'atoll-popup-actions atoll-popup-actions-stacked' : 'atoll-popup-actions'

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = actionClasses
          nodes.forEach(node => {
            wrapper.appendChild(node)
          })
          return [wrapper]
        }

        const hidePrimary = !state.primaryText
        const hideSecondary = state.variant === 'alert' || !state.secondaryText

        if (hidePrimary && hideSecondary) {
          return null
        }

        const wrapper = document.createElement('div')
        wrapper.className = actionClasses

        if (!hideSecondary) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'secondaryBtn')
          btn.setAttribute('variant', 'secondary')
          btn.setAttribute('size', 'md')
          btn.textContent = state.secondaryText
          wrapper.appendChild(btn)
        }

        if (!hidePrimary) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'primaryBtn')
          const primaryVariant = state.variant === 'danger' ? 'danger' : 'primary'
          btn.setAttribute('variant', primaryVariant)
          btn.setAttribute('size', 'md')
          btn.textContent = state.primaryText
          wrapper.appendChild(btn)
        }

        return [wrapper]
      }
    },

    getters: {
      primaryVariant: (state) => (state.variant === 'danger' ? 'danger' : 'primary'),

      hideDescription: (state) => !state.description,

      hideCloseBtn: (state) => !state.closeable,

      hideHeader: (state) => !state.title,

      dialogClasses: (state) => {
        const classes = []

        if (state.size) {
          classes.push(`atoll-popup-${state.size}`)
        } else {
          classes.push('atoll-popup-md')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe, bootstrap }) => {
      const { Modal } = bootstrap
      const modalEl = refs('modalElement')

      let bsModalInstance = null

      const applyBackdropClass = () => {
        const backdrops = document.querySelectorAll('.modal-backdrop')
        backdrops.forEach(backdrop => {
          backdrop.classList.add('atoll-popup-backdrop')
        })
      }

      if (modalEl) {
        // Initialize Bootstrap Modal Engine
        bsModalInstance = Modal.getOrCreateInstance(modalEl, {
          backdrop: state.staticBackdrop ? 'static' : true,
          keyboard: !state.staticBackdrop
        })

        modalEl.addEventListener('show.bs.modal', () => {
          state.open = true
          setTimeout(applyBackdropClass, 0)
        })

        // Synchronize state when closed via backdrop click or Escape key
        modalEl.addEventListener('hidden.bs.modal', () => {
          state.open = false
          root.dispatchEvent(
            new CustomEvent('atoll-popup-close', {
              bubbles: true,
              composed: true,
              detail: { variant: state.variant }
            })
          )
        })

        modalEl.addEventListener('shown.bs.modal', () => {
          applyBackdropClass()
          root.dispatchEvent(
            new CustomEvent('atoll-popup-open', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size
              }
            })
          )
        })

        // Event delegation for primary, secondary, and close button clicks
        modalEl.addEventListener('click', (e) => {
          const target = e.target.closest('atoll-button') || e.target.closest('.atoll-btn')
          if (!target) {
            return
          }

          const refAttr = target.getAttribute('ref') || ''
          const isPrimary = refAttr === 'primaryBtn' || refAttr.endsWith('__primaryBtn')
          const isSecondary = refAttr === 'secondaryBtn' || refAttr.endsWith('__secondaryBtn')
          const isClose = refAttr === 'btnClose' || refAttr.endsWith('__btnClose')

          if (isPrimary) {
            root.dispatchEvent(
              new CustomEvent('atoll-popup-primary', {
                bubbles: true,
                composed: true,
                detail: {
                  variant: state.variant,
                  size: state.size
                }
              })
            )
          } else if (isSecondary) {
            root.dispatchEvent(
              new CustomEvent('atoll-popup-secondary', {
                bubbles: true,
                composed: true,
                detail: { variant: state.variant }
              })
            )
            if (bsModalInstance) {
              bsModalInstance.hide()
            }
          } else if (isClose) {
            if (bsModalInstance) {
              bsModalInstance.hide()
            }
          }
        })
      }

      // Reactive observer for [open] attribute
      observe('open', (isOpen) => {
        if (!bsModalInstance) {
          return
        }

        if (isOpen) {
          bsModalInstance.show()
        } else {
          bsModalInstance.hide()
        }
      })

      // Expose public DOM interface methods on component host
      root.show = () => {
        state.open = true
      }
      root.hide = () => {
        state.open = false
      }

      // Initial Sync if open attribute is set on mount
      if (state.open && bsModalInstance) {
        bsModalInstance.show()
      }
    }
  })
</script>
