<template id="atoll-popup">
  <dialog 
    ref="modalElement"
    class="modal atoll-popup-dialog-native" 
    aria-labelledby="{{ ref_modalTitle }}"
    aria-describedby="{{ ref_modalDesc }}"
  >
    <div class="modal-dialog modal-dialog-centered atoll-popup-dialog">
      <div class="modal-content">
        <!-- Optional Hero Graphic / Illustration Slot -->
        <slot name="hero"></slot>

        <!-- Modal Header -->
        <div class="atoll-popup-header d-flex align-items-center justify-content-between mb-3" hidden="{{ hideHeader }}">
          <h3 ref="modalTitle" id="{{ ref_modalTitle }}" class="atoll-popup-title modal-title mb-0">
            {{ title }}
          </h3>
        </div>

        <!-- Popup Text Body -->
        <div class="atoll-popup-body">
          <p 
            ref="modalDesc" 
            id="{{ ref_modalDesc }}" 
            class="atoll-popup-description" 
            hidden="{{ hideDescription }}"
          >
            {{ description }}
          </p>

          <!-- Custom Content Slot (Forms, Checkboxes, Inputs) -->
          <slot></slot>
        </div>

        <!-- Action Button Bar -->
        <slot name="actions"></slot>
      </div>
    </div>
  </dialog>
</template>

<style>

    --popup-padding: 24px;
    --popup-max-width: 360px;

  }

    --popup-max-width: 480px;
    --popup-padding: 32px;

  dialog.atoll-popup-dialog-native {

    background: transparent;
    padding: 0;
    margin: auto;
    overflow: visible;
    max-width: 90vw;
    box-shadow: none;
  }

  dialog.atoll-popup-dialog-native::backdrop {
    background-color: var(--atoll-backdrop-bg, rgba(0, 0, 0, 0.45));
    -webkit-backdrop-filter: var(--atoll-backdrop-filter, blur(8px));

  dialog.atoll-popup-dialog-native[open] {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: atollPopupScaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  dialog.atoll-popup-dialog-native[open]::backdrop {
    animation: atollPopupFadeIn 0.2s ease-out forwards;
  }

  dialog.atoll-popup-dialog-native.atoll-popup-closing {
    pointer-events: none !important;
    animation: atollPopupScaleOut 0.2s ease-in forwards !important;
  }

  dialog.atoll-popup-dialog-native.atoll-popup-closing::backdrop {
    pointer-events: none !important;
    animation: atollPopupFadeOut 0.2s ease-in forwards !important;
  }

  @media (prefers-reduced-motion: reduce) {
    dialog.atoll-popup-dialog-native[open],
    dialog.atoll-popup-dialog-native.atoll-popup-closing {

  }

  @keyframes atollPopupScaleIn {

      transform: scale(1);
    }
  }

  @keyframes atollPopupScaleOut {
    from {
      opacity: 1;
      transform: scale(1);
    }

    }
  }

  @keyframes atollPopupFadeIn {

    max-height: 85vh;
    margin: auto;

    border: none;
    border-radius: var(--popup-radius);
    padding: var(--popup-padding);
    box-shadow: var(--popup-shadow);
    box-sizing: border-box;

    overflow: hidden;

    flex-direction: column;

  .atoll-popup-hero img,

    scrollbar-width: thin;
    scrollbar-color: var(--popup-scrollbar-thumb) transparent;
  }

  .atoll-popup-body::-webkit-scrollbar {
    width: 6px;
  }

  .atoll-popup-body::-webkit-scrollbar-track {
    background: transparent;
  }

  .atoll-popup-body::-webkit-scrollbar-thumb {

  }

  .atoll-popup-body::-webkit-scrollbar-thumb:hover {
    background-color: var(--popup-scrollbar-thumb-hover);
  }

  .atoll-popup-body:focus {

  }

  .atoll-popup-body:focus-visible {

  :host([size="lg"]) .atoll-popup-title {

  .atoll-popup-description {
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-2, 14px);

  .atoll-popup-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;

  .atoll-popup-actions > atoll-button {
    flex: 1;
    width: 100%;
  }

  .atoll-popup-actions > atoll-button .atoll-btn {
    width: 100%;
  }

  .atoll-popup-actions > .atoll-btn {
    flex: 1;
    width: 100%;
  }

  .atoll-popup-actions.atoll-popup-actions-horizontal {
    flex-direction: row;
    gap: 8px;
  }

  .atoll-popup-actions.atoll-popup-actions-horizontal > atoll-button {
    flex: 1 1 0%;
    width: 100%;
  }

  .atoll-popup-actions.atoll-popup-actions-horizontal > .atoll-btn {
    flex: 1 1 0%;
    width: 100%;
  }

  .atoll-popup-actions.atoll-popup-actions-vertical,
  .atoll-popup-actions.atoll-popup-actions-stacked {
    flex-direction: column;

  }

  .atoll-popup-actions.atoll-popup-actions-vertical > atoll-button,
  .atoll-popup-actions.atoll-popup-actions-stacked > atoll-button {

  .atoll-popup-actions.atoll-popup-actions-vertical > .atoll-btn,
  .atoll-popup-actions.atoll-popup-actions-stacked > .atoll-btn {
    flex: 0 0 auto;

  }

  /* Dark Mode Overrides */
  :host-context([data-atoll-theme="dark"]),
  :host-context([data-bs-theme="dark"]),
  [data-atoll-theme="dark"] atoll-popup,
  [data-bs-theme="dark"] atoll-popup {
    --popup-bg: var(--atoll-bg-surface-primary, #1F1F1F);
    --popup-title-color: var(--atoll-text-primary, #FFFFFF);
    --popup-desc-color: var(--atoll-text-secondary, #A0A0A0);
    --popup-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    --popup-scrollbar-thumb: rgba(255, 255, 255, 0.15);
    --popup-scrollbar-thumb-hover: rgba(255, 255, 255, 0.3);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-popup-hero .atoll-icon-badge-green,
  :host-context([data-bs-theme="dark"]) .atoll-popup-hero .atoll-icon-badge-green,
  [data-atoll-theme="dark"] .atoll-popup-hero .atoll-icon-badge-green,
  [data-bs-theme="dark"] .atoll-popup-hero .atoll-icon-badge-green {

</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      open: Boolean,
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      heroIcon: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        default: 'confirm',
        values: ['alert', 'confirm', 'danger', 'graphic']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      primaryText: {
        type: String,
        default: 'OK'
      },
      primaryDisabled: {
        type: Boolean,
        default: false
      },
      primaryLoading: {
        type: Boolean,
        default: false
      },
      secondaryText: {
        type: String,
        default: 'Cancel'
      },
      stackedActions: Boolean,
      actionsLayout: {
        type: String,
        default: 'horizontal',
        values: ['horizontal', 'vertical', 'stacked']
      },
      tertiaryText: {
        type: String,
        default: ''
      },
      staticBackdrop: Boolean,
      disableBackdrop: Boolean,
      disableKeyboard: Boolean
    },

    slots: {
      hero (nodes, state) {
        if (typeof document === 'undefined') return undefined

        if (state.heroIcon) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.heroIcon)
          icon.setAttribute('size', '48')
          wrapper.appendChild(icon)
          return [wrapper]
        }

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-popup-hero'
          nodes.forEach(node => wrapper.appendChild(node))
          return [wrapper]
        }

        return undefined
      },

      actions (nodes, state) {
        if (typeof document === 'undefined') return undefined

        const isVertical = Boolean(state.tertiaryText || state.stackedActions || state.actionsLayout === 'vertical' || state.actionsLayout === 'stacked')
        const actionClasses = isVertical
          ? 'atoll-popup-actions atoll-popup-actions-vertical atoll-popup-actions-stacked'
          : 'atoll-popup-actions atoll-popup-actions-horizontal'

        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = actionClasses
          nodes.forEach(node => wrapper.appendChild(node))
          return [wrapper]
        }

        const hidePrimary = !state.primaryText
        const hideSecondary = state.variant === 'alert' || !state.secondaryText
        const hideTertiary = !state.tertiaryText

        if (hidePrimary && hideSecondary && hideTertiary) return undefined

        const wrapper = document.createElement('div')
        wrapper.className = actionClasses

        const createPrimaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'primaryBtn')
          const primaryVariant = state.variant === 'danger' ? 'danger' : 'primary'
          btn.setAttribute('variant', primaryVariant)
          btn.setAttribute('size', 'md')
          if (isVertical) btn.setAttribute('block', 'true')
          if (state.primaryDisabled) btn.setAttribute('disabled', 'true')
          if (state.primaryLoading) btn.setAttribute('loading', 'true')
          btn.textContent = state.primaryText
          return btn
        }

        const createSecondaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'secondaryBtn')
          btn.setAttribute('variant', 'secondary')
          btn.setAttribute('size', 'md')
          if (isVertical) btn.setAttribute('block', 'true')
          btn.textContent = state.secondaryText
          return btn
        }

        const createTertiaryBtn = () => {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('ref', 'tertiaryBtn')
          btn.setAttribute('variant', 'outline')
          btn.setAttribute('size', 'md')
          if (isVertical) btn.setAttribute('block', 'true')
          btn.textContent = state.tertiaryText
          return btn
        }

        if (isVertical) {
          if (!hidePrimary) wrapper.appendChild(createPrimaryBtn())
          if (!hideTertiary) wrapper.appendChild(createTertiaryBtn())
          if (!hideSecondary) wrapper.appendChild(createSecondaryBtn())
        } else {
          if (!hideSecondary) wrapper.appendChild(createSecondaryBtn())
          if (!hidePrimary) wrapper.appendChild(createPrimaryBtn())
        }

        return [wrapper]
      }
    },

    getters: {
      hideDescription: (state) => !state.description,
      hideHeader: (state) => !state.title,
      ref_modalTitle: (_state, { instanceId }) => (instanceId ? `${instanceId}-title` : 'atoll-popup-title'),
      ref_modalDesc: (_state, { instanceId }) => (instanceId ? `${instanceId}-desc` : 'atoll-popup-desc')
    },

    client: ({ state, refs, root, observe, signal }) => {
      const dialogEl = refs('modalElement')

      const showModal = () => {
        if (!dialogEl.open) {
          dialogEl.classList.remove('atoll-popup-closing')
          dialogEl.classList.add('show')
          try {
            dialogEl.showModal()
          } catch {
            // Native showModal throw fallback if element state is already open
          }

          document.body.classList.add('modal-open')
          state.open = true
          root.dispatchEvent(
            new CustomEvent('atoll-popup-open', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        }
      }

      const hideModal = () => {
        if (!dialogEl.open && !state.open) return

        dialogEl.classList.remove('atoll-popup-closing')
        dialogEl.classList.remove('show')
        document.body.classList.remove('modal-open')
        if (dialogEl.open) dialogEl.close()
        state.open = false
        root.dispatchEvent(
          new CustomEvent('atoll-popup-close', {
            bubbles: true,
            composed: true,
            detail: {
              variant: state.variant,
              size: state.size,
              title: state.title
            }
          })
        )
      }

      const triggerShake = () => {
        const dialogBox = dialogEl.querySelector('.modal-dialog')
        if (dialogBox) {
          dialogBox.classList.remove('atoll-popup-static-shake')
          void dialogBox.offsetWidth
          dialogBox.classList.add('atoll-popup-static-shake')
        }
      }

      signal.addEventListener('abort', () => {
        document.body.classList.remove('modal-open')
      })

      dialogEl.addEventListener('cancel', (e) => {
        if (state.staticBackdrop || state.disableKeyboard) {
          e.preventDefault()
          if (state.staticBackdrop) triggerShake()
        } else {
          e.preventDefault()
          hideModal()
        }
      }, { signal })

      dialogEl.addEventListener('click', (e) => {
        if (e.target === dialogEl) {
          if (state.staticBackdrop) {
            triggerShake()
          } else if (!state.disableBackdrop) {
            hideModal()
          }
          return
        }

        const target = e.target.closest('atoll-button') || e.target.closest('.atoll-btn')
        if (!target) return

        const refAttr = target.getAttribute('ref') || ''
        const isPrimary = refAttr === 'primaryBtn' || refAttr.endsWith('__primaryBtn')
        const isSecondary = refAttr === 'secondaryBtn' || refAttr.endsWith('__secondaryBtn')
        const isTertiary = refAttr === 'tertiaryBtn' || refAttr.endsWith('__tertiaryBtn')

        if (isPrimary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-primary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        } else if (isSecondary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-secondary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
          hideModal()
        } else if (isTertiary) {
          root.dispatchEvent(
            new CustomEvent('atoll-popup-tertiary', {
              bubbles: true,
              composed: true,
              detail: {
                variant: state.variant,
                size: state.size,
                title: state.title
              }
            })
          )
        }
      }, { signal })

      observe('open', (isOpen) => {
        if (isOpen) {
          showModal()
        } else {
          hideModal()
        }
      })

      root.show = showModal
      root.hide = hideModal

      if (state.open) {
        showModal()
      }
    }
  })
</script>
