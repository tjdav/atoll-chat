<template id="atoll-list"><slot></slot></template>

<style>
  :host {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 0;
    margin: 0;
    list-style: none;
    box-sizing: border-box;

    --list-divider: var(--atoll-border-subtle, #DFDFDF);
  }

  /* Separator Lines Option */
  :host([divided]) ::slotted(atoll-list-item:not(:last-child)),
  :host([divided]) ::slotted(*:not(:last-child)) {
    border-bottom: 1px solid var(--list-divider);
  }

  /* Dark Theme Overrides */
  :host-context([data-atoll-theme="dark"]),
  :host-context([data-bs-theme="dark"]) {
    --list-divider: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.1));
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      divided: Boolean,
      mode: {
        type: String,
        default: 'default',
        values: ['default', 'selection', 'edit', 'reorder']
      }
    },

    client: ({ state, root, observe, signal }) => {
      if (!root.hasAttribute('role')) {
        root.setAttribute('role', 'list')
      }

      // Sync list mode down to all child atoll-list-item components
      const syncModeToChildren = (mode) => {
        const items = root.querySelectorAll('atoll-list-item')
        items.forEach(item => {
          if (!item.hasAttribute('role')) {
            item.setAttribute('role', 'listitem')
          }
          const m = mode && mode !== 'default' ? mode : 'default'
          if (m !== 'default') {
            item.setAttribute('mode', m)
          } else {
            item.removeAttribute('mode')
          }
          if (typeof item.mode !== 'undefined') {
            item.mode = m
          }
        })
      }

      // Initial sync
      syncModeToChildren(state.mode)

      // Observe mode attribute changes dynamically
      if (observe) {
        observe('mode', (newMode) => {
          const prevMode = state.mode
          const resolvedMode = newMode || state.mode || 'default'
          syncModeToChildren(resolvedMode)

          root.dispatchEvent(
            new CustomEvent('atoll-list-mode-change', {
              bubbles: true,
              composed: true,
              detail: {
                mode: resolvedMode,
                previousMode: prevMode
              }
            })
          )
        })
      }

      // Observe DOM child additions to automatically sync mode for dynamically added items
      const mutObserver = new MutationObserver(() => {
        syncModeToChildren(state.mode)
      })

      mutObserver.observe(root, {
        childList: true,
        subtree: true
      })

      if (signal) {
        signal.addEventListener('abort', () => {
          mutObserver.disconnect()
        })
      }

      // Public instance API methods on component root DOM element
      root.setMode = (newMode) => {
        state.mode = newMode || 'default'
        if (state.mode !== 'default') {
          root.setAttribute('mode', state.mode)
        } else {
          root.removeAttribute('mode')
        }
        syncModeToChildren(state.mode)
      }

      root.selectAll = () => {
        const items = root.querySelectorAll('atoll-list-item')
        items.forEach(item => {
          item.setAttribute('checked', 'true')
          if (typeof item.checked !== 'undefined') {
            item.checked = true
          }
        })
      }

      root.clearSelection = () => {
        const items = root.querySelectorAll('atoll-list-item')
        items.forEach(item => {
          item.removeAttribute('checked')
          if (typeof item.checked !== 'undefined') {
            item.checked = false
          }
        })
      }

      root.getSelectedItems = () => {
        const items = Array.from(root.querySelectorAll('atoll-list-item'))
        return items.filter(item => item.hasAttribute('checked') || item.checked)
      }
    }
  })
</script>
