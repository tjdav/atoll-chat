<template id="atoll-badge">
  <span class="atoll-badge" hidden="{{ isHidden }}">
    {{ displayText }}
  </span>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;

    --badge-height: 20px;
    --badge-min-width: 20px;
    --badge-padding: 0 6px;
    --badge-font-size: var(--atoll-font-size-caption-1, 12px);
    --badge-font-weight: 600;
    --badge-bg: var(--atoll-danger, var(--atoll-rainbow-red, #FF334B));
    --badge-color: #FFFFFF;
    --badge-dot-size: 8px;
  }

  :host([hidden]) {
    display: none !important;
    opacity: 0 !important;
    transform: scale(0.6) !important;
    pointer-events: none !important;
  }

  /* Size Modifiers */
  :host([size="sm"]) {
    --badge-height: 16px;
    --badge-min-width: 16px;
    --badge-padding: 0 4px;
    --badge-font-size: var(--atoll-font-size-caption-2, 10px);
    --badge-font-weight: 500;
  }

  :host([size="lg"]) {
    --badge-height: 24px;
    --badge-min-width: 24px;
    --badge-padding: 0 8px;
    --badge-font-size: var(--atoll-font-size-body-2, 14px);
    --badge-font-weight: 600;
  }

  /* Dot Mode Modifier */
  :host([dot]) {
    --badge-height: var(--badge-dot-size);
    --badge-min-width: var(--badge-dot-size);
    --badge-padding: 0;
  }

  /* Variant Modifiers */
  :host([variant="primary"]),
  :host([variant="success"]) {
    --badge-bg: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    --badge-color: #FFFFFF;
  }

  :host([variant="secondary"]) {
    --badge-bg: var(--atoll-bg-surface-tertiary, #E8E8E8);
    --badge-color: var(--atoll-text-secondary, #555555);
  }

  :host([variant="info"]) {
    --badge-bg: var(--atoll-rainbow-blue, #4270ED);
    --badge-color: #FFFFFF;
  }

  :host([variant="warning"]) {
    --badge-bg: var(--atoll-rainbow-yellow, #FCB321);
    --badge-color: #FFFFFF;
  }

  /* Base Badge Inner Span */
  .atoll-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    border-radius: 9999px;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--badge-font-size);
    font-weight: var(--badge-font-weight);
    height: var(--badge-height);
    min-width: var(--badge-min-width);
    padding: var(--badge-padding);
    background-color: var(--badge-bg);
    color: var(--badge-color);
    white-space: nowrap;
    user-select: none;
    box-sizing: border-box;
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease-in-out;
  }

  .atoll-badge[hidden] {
    display: none !important;
    opacity: 0 !important;
    transform: scale(0.6) !important;
    pointer-events: none !important;
  }

  /* Relative Positioning Wrapper Helpers */
  .atoll-badge-container {
    position: relative;
    display: inline-flex;
    overflow: visible !important;
  }

  .atoll-badge-positioned {
    position: absolute;
    top: 0;
    right: 0;
    transform: translate(35%, -35%);
    z-index: 2;
    box-shadow: 0 0 0 2px var(--atoll-body-bg, #FFFFFF);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      count: {
        type: Number,
        default: null
      },
      maxCount: {
        type: Number,
        default: 99
      },
      dot: Boolean,
      variant: {
        type: String,
        default: 'danger',
        values: ['danger', 'primary', 'secondary', 'info', 'success', 'warning']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      label: {
        type: String,
        default: ''
      },
      showZero: Boolean
    },

    getters: {
      isHidden: (state) => {
        if (state.dot) return false
        if (state.label && state.label.trim() !== '') return false
        if (state.count === null || state.count === undefined) return true
        if (state.count === 0 && !state.showZero) return true
        return false
      },

      displayText: (state) => {
        if (state.dot) return ''
        if (state.label && state.label.trim() !== '') return state.label
        if (state.count === null || state.count === undefined) return ''
        if (state.count > state.maxCount) return `${state.maxCount}+`
        return String(state.count)
      }
    },

    client: ({ state, root, observe }) => {
      const updateAccessibility = () => {
        if (state.isHidden) {
          root.setAttribute('hidden', '')
          root.setAttribute('aria-hidden', 'true')
          root.removeAttribute('role')
          root.removeAttribute('aria-label')
        } else {
          root.removeAttribute('hidden')
          root.removeAttribute('aria-hidden')
          root.setAttribute('role', 'status')

          let accessibleText = ''
          if (state.dot) {
            accessibleText = 'New notification'
          } else if (state.label) {
            accessibleText = state.label
          } else if (state.count !== null && state.count !== undefined) {
            accessibleText = `${state.displayText} unread messages`
          }
          root.setAttribute('aria-label', accessibleText)
        }
      }

      observe('count', updateAccessibility)
      observe('maxCount', updateAccessibility)
      observe('dot', updateAccessibility)
      observe('label', updateAccessibility)
      observe('showZero', updateAccessibility)

      updateAccessibility()
    }
  })
</script>
