<template id="atoll-button">
  <button 
    ref="btnElement" 
    type="{{ type }}" 
    class="{{ btnClasses }}" 
    disabled="{{ isDisabled }}"
    aria-label="{{ ariaLabel }}"
    aria-pressed="{{ ariaPressed }}"
    title="{{ title }}"
  >
    <!-- Content Slot Container -->
    <span class="atoll-btn-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </button>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: {
        type: String,
        default: 'button'
      },
      variant: {
        type: String,
        default: 'primary'
      },
      size: {
        type: String,
        default: 'md'
      },
      disabled: Boolean,
      loading: Boolean,
      block: Boolean,
      pill: Boolean,
      iconOnly: Boolean,
      ariaLabel: {
        type: String,
        default: ''
      },
      ariaPressed: {
        type: String,
        default: ''
      },
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      },
      title: {
        type: String,
        default: ''
      },
      spinnerVariant: {
        type: String,
        default: ''
      },
      spinnerPlacement: {
        type: String,
        default: 'center'
      }
    },

    slots: {
      leading (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      trailing (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.trailingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.trailingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      }
    },

    getters: {
      btnClasses: (state) => {
        const classes = ['atoll-btn']

        // Variant modifier
        if (state.variant) {
          classes.push(`atoll-btn-${state.variant}`)
        } else {
          classes.push('atoll-btn-primary')
        }

        // Size modifier
        if (state.size) {
          classes.push(`atoll-btn-${state.size}`)
        } else {
          classes.push('atoll-btn-md')
        }

        // Layout modifiers
        if (state.iconOnly) {
          classes.push('atoll-btn-icon')
        }
        if (state.block) {
          classes.push('atoll-btn-block')
        }
        if (state.pill) {
          classes.push('atoll-btn-pill')
        }
        if (state.loading && state.spinnerPlacement === 'center') {
          classes.push('atoll-btn-loading')
        }

        return classes.join(' ')
      },

      isDisabled: (state) => Boolean(state.disabled || state.loading)
    },

    client: ({ state, refs, root, observe, signal }) => {
      const btn = refs('btnElement')
      let spinnerEl = null

      // Forward test-id / data-testid to inner button
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
      if (testId && btn) {
        root.__testId = testId
        btn.setAttribute('data-testid', testId)
        root.removeAttribute('test-id')
        requestAnimationFrame(() => {
          root.removeAttribute('data-testid')
        })
      }

      // Intercept clicks on the root custom element host during capture phase if disabled/loading
      root.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, { capture: true, signal })

      btn.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, { signal })

      // Focus, blur, and click forwarding
      root.focus = () => btn?.focus()
      root.blur = () => btn?.blur()
      root.click = () => btn?.click()

      // Imperatively create/destroy the spinner container using Bootstrap spinner component
      const syncLoadingState = () => {
        if (spinnerEl && spinnerEl.parentNode) {
          spinnerEl.parentNode.removeChild(spinnerEl)
        }

        if (state.loading) {
          spinnerEl = document.createElement('span')
          
          const placement = state.spinnerPlacement || 'center'
          if (placement === 'center') {
            spinnerEl.className = 'atoll-btn-spinner'
          } else {
            spinnerEl.className = `atoll-btn-spinner-inline atoll-btn-spinner-${placement}`
          }

          // Create Bootstrap spinner-border
          const borderEl = document.createElement('span')
          borderEl.className = 'spinner-border spinner-border-sm'

          // Add variant class if spinnerVariant is set (e.g. text-light, text-dark, text-primary)
          if (state.spinnerVariant) {
            borderEl.classList.add(`text-${state.spinnerVariant}`)
          }

          borderEl.setAttribute('role', 'status')
          borderEl.setAttribute('aria-hidden', 'true')

          spinnerEl.appendChild(borderEl)

          // Insert spinner at appropriate location
          if (placement === 'center') {
            if (!btn.contains(spinnerEl)) {
              btn.insertBefore(spinnerEl, btn.firstChild)
            }
          } else if (placement === 'leading') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.insertBefore(spinnerEl, contentContainer.firstChild)
            }
          } else if (placement === 'trailing') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.appendChild(spinnerEl)
            }
          }

          btn.setAttribute('aria-busy', 'true')
          btn.setAttribute('aria-disabled', 'true')
        } else {
          btn.removeAttribute('aria-busy')
          btn.removeAttribute('aria-disabled')
        }
      }

      // Icon-only buttons should expose an accessible name — dev-time a11y warning
      // (a side effect that a getter/template binding can't express).
      const warnMissingAriaLabel = () => {
        if (state.iconOnly && !state.ariaLabel) {
          console.warn('[atoll-button] icon-only buttons require an aria-label attribute for accessibility.')
        }
      }
      observe('iconOnly', warnMissingAriaLabel)
      warnMissingAriaLabel()

      // The loading spinner is imperative DOM (created/destroyed/positioned inside the
      // <button>), so it can't be a template binding or getter and must be observed.
      observe('loading', syncLoadingState)
      observe('spinnerPlacement', syncLoadingState)
      observe('spinnerVariant', syncLoadingState)
      observe('size', syncLoadingState)

      // Initial execution
      syncLoadingState()
    }
  })
</script>
