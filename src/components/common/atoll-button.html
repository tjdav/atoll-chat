<template id="atoll-button">
  <button 
    ref="btnElement" 
    type="{{ type }}" 
    class="{{ btnClasses }}" 
    disabled="{{ isDisabled }}"
    aria-label="{{ ariaLabel }}"
    aria-pressed="{{ ariaPressed }}"
    title="{{ title }}"
  >
    <!-- Content Slot Container -->
    <span class="atoll-btn-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </button>
</template>

<style>
  :host {
    display: inline-block;
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([disabled]),
  :host([loading]) {
    opacity: 0.45;
    pointer-events: none;
  }

  :host([block]) {
    display: block;
    width: 100%;
  }

  /* Base Button Styling */
  .atoll-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    border: 1px solid transparent;
    white-space: nowrap;
    user-select: none;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, opacity 0.15s ease-in-out;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
  }

  .atoll-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.35);
  }

  .atoll-btn:disabled,
  .atoll-btn.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Internal Layout Elements */
  .atoll-btn-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s ease-in-out;
  }

  .atoll-btn-label {
    display: inline-block;
    line-height: 1;
  }

  /* Loading Spinner Overlay */
  .atoll-btn-spinner {
    position: absolute;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: atoll-spin 0.8s linear infinite;
  }

  @keyframes atoll-spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* Variant Modifiers */
  .atoll-btn-primary,
  :host([variant="primary"]) .atoll-btn {
    background-color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    color: var(--atoll-text-on-brand, #FFFFFF);
    border-color: transparent;
  }

  .atoll-btn-primary:hover:not(:disabled),
  :host([variant="primary"]) .atoll-btn:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-primary, var(--atoll-brand-primary, #06C755)) 88%, #000000);
  }

  .atoll-btn-primary:active:not(:disabled),
  :host([variant="primary"]) .atoll-btn:active:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-primary, var(--atoll-brand-primary, #06C755)) 80%, #000000);
  }

  .atoll-btn-secondary,
  :host([variant="secondary"]) .atoll-btn {
    background-color: var(--atoll-bg-surface-tertiary, #E8E8E8);
    color: var(--atoll-text-primary, #111111);
    border-color: transparent;
  }

  .atoll-btn-secondary:hover:not(:disabled),
  :host([variant="secondary"]) .atoll-btn:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #E8E8E8) 92%, #000000);
  }

  .atoll-btn-secondary:active:not(:disabled),
  :host([variant="secondary"]) .atoll-btn:active:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #E8E8E8) 84%, #000000);
  }

  .atoll-btn-outline,
  :host([variant="outline"]) .atoll-btn {
    background-color: transparent;
    color: var(--atoll-text-primary, #111111);
    border-color: var(--atoll-border-strong, #D4D4D4);
  }

  .atoll-btn-outline:hover:not(:disabled),
  :host([variant="outline"]) .atoll-btn:hover:not(:disabled) {
    background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
  }

  .atoll-btn-outline:active:not(:disabled),
  :host([variant="outline"]) .atoll-btn:active:not(:disabled) {
    background-color: var(--atoll-bg-surface-tertiary, #E8E8E8);
  }

  .atoll-btn-ghost,
  :host([variant="ghost"]) .atoll-btn {
    background-color: transparent;
    color: var(--atoll-text-primary, #111111);
    border-color: transparent;
  }

  .atoll-btn-ghost:hover:not(:disabled),
  :host([variant="ghost"]) .atoll-btn:hover:not(:disabled) {
    background-color: var(--atoll-brand-subtle, rgba(6, 199, 85, 0.12));
  }

  .atoll-btn-ghost:active:not(:disabled),
  :host([variant="ghost"]) .atoll-btn:active:not(:disabled) {
    background-color: var(--atoll-bg-surface-tertiary, #E8E8E8);
  }

  .atoll-btn-danger,
  :host([variant="danger"]) .atoll-btn {
    background-color: var(--atoll-rainbow-red, #FF334B);
    color: #FFFFFF;
    border-color: transparent;
  }

  .atoll-btn-danger:hover:not(:disabled),
  :host([variant="danger"]) .atoll-btn:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-rainbow-red, #FF334B) 90%, #000000);
  }

  .atoll-btn-danger:active:not(:disabled),
  :host([variant="danger"]) .atoll-btn:active:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-rainbow-red, #FF334B) 80%, #000000);
  }

  /* Size Modifiers */
  .atoll-btn-sm,
  :host([size="sm"]) .atoll-btn {
    height: var(--atoll-btn-height-sm, 32px);
    padding: 0 12px;
    border-radius: 8px;
    font-size: var(--atoll-font-size-caption-1, 12px);
    font-weight: var(--atoll-font-weight-semibold, 600);
  }

  .atoll-btn-md,
  :host([size="md"]) .atoll-btn {
    height: var(--atoll-btn-height-md, 44px);
    padding: 0 16px;
    border-radius: 10px;
    font-size: var(--atoll-font-size-body-2, 14px);
    font-weight: var(--atoll-font-weight-semibold, 600);
  }

  .atoll-btn-lg,
  :host([size="lg"]) .atoll-btn {
    height: var(--atoll-btn-height-lg, 52px);
    padding: 0 24px;
    border-radius: 12px;
    font-size: var(--atoll-font-size-body-1, 16px);
    font-weight: var(--atoll-font-weight-semibold, 600);
  }

  /* Shape & Layout Modifiers */
  .atoll-btn-block,
  :host([block]) .atoll-btn {
    width: 100%;
  }

  .atoll-btn-pill,
  :host([pill]) .atoll-btn {
    border-radius: 9999px !important;
  }

  .atoll-btn-pill.atoll-btn-sm,
  :host([pill][size="sm"]) .atoll-btn {
    height: 28px;
    padding: 0 12px;
    font-size: var(--atoll-font-size-caption-1, 12px);
    position: relative;
  }

  .atoll-btn-pill.atoll-btn-sm::before,
  :host([pill][size="sm"]) .atoll-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 44px;
    width: 44px;
  }

  .atoll-btn-pill.atoll-btn-md,
  :host([pill][size="md"]) .atoll-btn {
    height: 36px;
    padding: 0 16px;
    font-size: var(--atoll-font-size-body-2, 14px);
  }

  .atoll-btn-pill.atoll-btn-lg,
  :host([pill][size="lg"]) .atoll-btn {
    height: 44px;
    padding: 0 20px;
    font-size: var(--atoll-font-size-body-1, 16px);
  }

  /* Dark Mode Overrides */
  :host-context([data-atoll-theme="dark"]) .atoll-btn-secondary,
  :host-context([data-bs-theme="dark"]) .atoll-btn-secondary {
    background-color: var(--atoll-bg-surface-tertiary, #1F1F1F);
    color: var(--atoll-text-primary, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-secondary:hover:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-secondary:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #1F1F1F) 88%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-secondary:active:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-secondary:active:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #1F1F1F) 78%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-outline,
  :host-context([data-bs-theme="dark"]) .atoll-btn-outline {
    background-color: transparent;
    color: var(--atoll-text-primary, #FFFFFF);
    border-color: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.15));
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-outline:hover:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-outline:hover:not(:disabled) {
    background-color: var(--atoll-bg-surface-secondary, #161616);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-outline:active:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-outline:active:not(:disabled) {
    background-color: var(--atoll-bg-surface-tertiary, #1F1F1F);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-ghost,
  :host-context([data-bs-theme="dark"]) .atoll-btn-ghost {
    color: var(--atoll-text-primary, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-ghost:hover:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-ghost:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-primary, #161616) 90%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-ghost:active:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-ghost:active:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-bg-surface-primary, #161616) 80%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-primary:hover:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-primary:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-primary, var(--atoll-brand-primary, #06C755)) 90%, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-btn-danger:hover:not(:disabled),
  :host-context([data-bs-theme="dark"]) .atoll-btn-danger:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--atoll-rainbow-red, #FF334B) 90%, #FFFFFF);
  }

  .atoll-btn-loading .atoll-btn-content {
    opacity: 0;
  }

  /* Icon-Only Button Modifiers */
  .atoll-btn-icon,
  :host([icon-only]) .atoll-btn {
    padding: 0 !important;
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
  }

  .atoll-btn-icon .atoll-btn-content,
  :host([icon-only]) .atoll-btn .atoll-btn-content {
    gap: 0;
    width: 100%;
    height: 100%;
  }

  .atoll-btn-icon .atoll-btn-label,
  :host([icon-only]) .atoll-btn .atoll-btn-label {
    display: contents;
  }

  .atoll-btn-icon .atoll-btn-text,
  :host([icon-only]) .atoll-btn .atoll-btn-text {
    display: none !important;
  }

  .atoll-btn-icon.atoll-btn-sm,
  :host([icon-only][size="sm"]) .atoll-btn {
    width: var(--atoll-btn-height-sm, 32px);
    height: var(--atoll-btn-height-sm, 32px);
    position: relative;
  }

  .atoll-btn-icon.atoll-btn-sm::before,
  :host([icon-only][size="sm"]) .atoll-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 44px;
    min-height: 44px;
    width: 44px;
    height: 44px;
  }

  .atoll-btn-icon.atoll-btn-md,
  :host([icon-only][size="md"]) .atoll-btn {
    width: var(--atoll-btn-height-md, 44px);
    height: var(--atoll-btn-height-md, 44px);
  }

  .atoll-btn-icon.atoll-btn-lg,
  :host([icon-only][size="lg"]) .atoll-btn {
    width: var(--atoll-btn-height-lg, 52px);
    height: var(--atoll-btn-height-lg, 52px);
  }

  .atoll-btn-icon.atoll-btn-pill,
  :host([icon-only][pill]) .atoll-btn {
    border-radius: 50% !important;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: {
        type: String,
        default: 'button'
      },
      variant: {
        type: String,
        default: 'primary'
      },
      size: {
        type: String,
        default: 'md'
      },
      disabled: Boolean,
      loading: Boolean,
      block: Boolean,
      pill: Boolean,
      iconOnly: Boolean,
      ariaLabel: {
        type: String,
        default: ''
      },
      ariaPressed: {
        type: String,
        default: ''
      },
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      },
      title: {
        type: String,
        default: ''
      },
      spinnerVariant: {
        type: String,
        default: ''
      },
      spinnerPlacement: {
        type: String,
        default: 'center'
      }
    },

    slots: {
      leading (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      trailing (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.trailingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.trailingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      }
    },

    getters: {
      btnClasses: (state) => {
        const classes = ['atoll-btn']

        // Variant modifier
        if (state.variant) {
          classes.push(`atoll-btn-${state.variant}`)
        } else {
          classes.push('atoll-btn-primary')
        }

        // Size modifier
        if (state.size) {
          classes.push(`atoll-btn-${state.size}`)
        } else {
          classes.push('atoll-btn-md')
        }

        // Layout modifiers
        if (state.iconOnly) {
          classes.push('atoll-btn-icon')
        }
        if (state.block) {
          classes.push('atoll-btn-block')
        }
        if (state.pill) {
          classes.push('atoll-btn-pill')
        }
        if (state.loading && state.spinnerPlacement === 'center') {
          classes.push('atoll-btn-loading')
        }

        return classes.join(' ')
      },

      isDisabled: (state) => Boolean(state.disabled || state.loading)
    },

    client: ({ state, refs, root, observe, signal }) => {
      const btn = refs('btnElement')
      let spinnerEl = null

      // Forward test-id / data-testid to inner button
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
      if (testId) {
        root.__testId = testId
        btn.setAttribute('data-testid', testId)
        root.removeAttribute('test-id')
        requestAnimationFrame(() => {
          root.removeAttribute('data-testid')
        })
      }

      // Intercept clicks on the root custom element host during capture phase if disabled/loading
      root.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, {
        capture: true,
        signal
      })

      btn.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, { signal })

      // Focus, blur, and click forwarding
      root.focus = () => btn?.focus()
      root.blur = () => btn?.blur()
      root.click = () => btn?.click()

      // Imperatively create/destroy the spinner container using Bootstrap spinner component
      const syncLoadingState = () => {
        if (spinnerEl && spinnerEl.parentNode) {
          spinnerEl.parentNode.removeChild(spinnerEl)
        }

        if (state.loading) {
          spinnerEl = document.createElement('span')
  
          const placement = state.spinnerPlacement || 'center'
          if (placement === 'center') {
            spinnerEl.className = 'atoll-btn-spinner'
          } else {
            spinnerEl.className = `atoll-btn-spinner-inline atoll-btn-spinner-${placement}`
          }

          // Create Bootstrap spinner-border
          const borderEl = document.createElement('span')
          borderEl.className = 'spinner-border spinner-border-sm'

          // Add variant class if spinnerVariant is set (e.g. text-light, text-dark, text-primary)
          if (state.spinnerVariant) {
            borderEl.classList.add(`text-${state.spinnerVariant}`)
          }

          borderEl.setAttribute('role', 'status')
          borderEl.setAttribute('aria-hidden', 'true')

          spinnerEl.appendChild(borderEl)

          // Insert spinner at appropriate location
          if (placement === 'center') {
            if (!btn.contains(spinnerEl)) {
              btn.insertBefore(spinnerEl, btn.firstChild)
            }
          } else if (placement === 'leading') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.insertBefore(spinnerEl, contentContainer.firstChild)
            }
          } else if (placement === 'trailing') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.appendChild(spinnerEl)
            }
          }

          btn.setAttribute('aria-busy', 'true')
          btn.setAttribute('aria-disabled', 'true')
        } else {
          btn.removeAttribute('aria-busy')
          btn.removeAttribute('aria-disabled')
        }
      }

      // The loading spinner is imperative DOM (created/destroyed/positioned inside the
      // <button>), so it can't be a template binding or getter and must be observed.
      observe('loading', syncLoadingState)
      observe('spinnerPlacement', syncLoadingState)
      observe('spinnerVariant', syncLoadingState)
      observe('size', syncLoadingState)

      // Initial execution
      syncLoadingState()
    }
  })
</script>
