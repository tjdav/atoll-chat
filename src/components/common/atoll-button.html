<template id="atoll-button">
  <button 
    ref="btnElement" 
    type="{{ type }}" 
    class="{{ btnClasses }}" 
    disabled="{{ isDisabled }}"
  >
    <!-- Content Slot Container -->
    <span class="atoll-btn-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </button>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: {
        type: String,
        default: 'button'
      },
      variant: {
        type: String,
        default: 'primary'
      },
      size: {
        type: String,
        default: 'md'
      },
      disabled: Boolean,
      loading: Boolean,
      block: Boolean,
      pill: Boolean,
      iconOnly: Boolean,
      ariaLabel: {
        type: String,
        default: ''
      },
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      }
    },

    slots: {
      leading (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      },

      trailing (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.trailingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.trailingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return null
      }
    },

    getters: {
      btnClasses: (state) => {
        const classes = ['atoll-btn']

        // Variant modifier
        if (state.variant) {
          classes.push(`atoll-btn-${state.variant}`)
        } else {
          classes.push('atoll-btn-primary')
        }

        // Size modifier
        if (state.size) {
          classes.push(`atoll-btn-${state.size}`)
        } else {
          classes.push('atoll-btn-md')
        }

        // Layout modifiers
        if (state.iconOnly) {
          classes.push('atoll-btn-icon')
        }
        if (state.block) {
          classes.push('atoll-btn-block')
        }
        if (state.pill) {
          classes.push('atoll-btn-pill')
        }
        if (state.loading) {
          classes.push('atoll-btn-loading')
        }

        return classes.join(' ')
      },

      isDisabled: (state) => Boolean(state.disabled || state.loading)
    },

    client: ({ state, refs, root, observe, signal }) => {
      if (root.__initialized) {
        root._updateBtn(refs('btnElement'))
        return
      }
      root.__initialized = true
      let btn = refs('btnElement')
      let spinnerEl = null

      root._updateBtn = (newBtn) => {
        btn = newBtn
        if (btn) {
          const testId = root.__testId
          if (testId) {
            btn.setAttribute('data-testid', testId)
          }
          btn.addEventListener('click', (event) => {
            if (state.disabled || state.loading) {
              event.preventDefault()
              event.stopImmediatePropagation()
            }
          }, { signal })
          syncLoadingState()
          syncAriaLabel()
          syncAriaPressed()
        }
      }

      // Forward test-id / data-testid from host to the nested native button, preserving across reconnects
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
  
      if (testId) {
        root.__testId = testId
        if (btn) {
          btn.setAttribute('data-testid', testId)
        }
        root.removeAttribute('data-testid')
        root.removeAttribute('test-id')
      }

      // Focus, blur, and click forwarding
      root.focus = () => btn?.focus()
      root.blur = () => btn?.blur()
      root.click = () => btn?.click()

      const syncDisabledState = () => {
        if (btn) {
          const isD = Boolean(state.disabled || state.loading)
          btn.disabled = isD
          if (isD) {
            btn.setAttribute('disabled', 'true')
          } else {
            btn.removeAttribute('disabled')
          }
        }
      }

      // Imperatively create/destroy the spinner container and icon
      const syncLoadingState = () => {
        if (state.loading) {
          if (!spinnerEl) {
            spinnerEl = document.createElement('span')
            spinnerEl.className = 'atoll-btn-spinner'

            // Create icon imperatively using string literal with hyphen
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', 'settings')
  
            // Determined by Resolved Spinner Sizing Scale: sm: 16, md: 20, lg: 24
            const spinnerSizes = {
              sm: '16',
              md: '20',
              lg: '24'
            }
            const iconSize = spinnerSizes[state.size] || '20'
            icon.setAttribute('size', iconSize)

            spinnerEl.appendChild(icon)
          }

          if (!btn.contains(spinnerEl)) {
            btn.insertBefore(spinnerEl, btn.firstChild)
          }

          // Set accessibility attributes for loading
          btn.setAttribute('aria-busy', 'true')
          btn.setAttribute('aria-disabled', 'true')
        } else {
          if (spinnerEl && spinnerEl.parentNode) {
            spinnerEl.parentNode.removeChild(spinnerEl)
          }
          // Remove or reset accessibility attributes
          btn.removeAttribute('aria-busy')
          btn.removeAttribute('aria-disabled')
        }
        syncDisabledState()
      }

      // Sync custom aria-label from host to the inner button
      const syncAriaLabel = () => {
        // Check for host aria-label attribute or component ariaLabel attribute
        const labelVal = state.ariaLabel || root.getAttribute('aria-label')
        if (labelVal) {
          btn.setAttribute('aria-label', labelVal)
        } else {
          btn.removeAttribute('aria-label')
          if (state.iconOnly) {
            console.warn('[atoll-button] icon-only buttons require an aria-label attribute for accessibility.')
          }
        }
      }

      // Sync custom aria-pressed from host to the inner button
      const syncAriaPressed = () => {
        const pressedVal = root.getAttribute('aria-pressed')
        if (pressedVal !== null) {
          btn.setAttribute('aria-pressed', pressedVal)
        } else {
          btn.removeAttribute('aria-pressed')
        }
      }

      // Synchronize native click events
      if (btn) {
        btn.addEventListener('click', (event) => {
          if (state.disabled || state.loading) {
            event.preventDefault()
            event.stopImmediatePropagation()
          }
        }, { signal })
      }

      // Observe loading and disabled state mutations
      observe('loading', syncLoadingState)
      observe('ariaLabel', syncAriaLabel)
      if (observe) {
        observe('disabled', (val) => {
          state.disabled = val === 'true' || val === true || val === ''
          syncDisabledState()
        })
      }

      Object.defineProperty(root, 'disabled', {
        get () {
          return state.disabled
        },
        set (val) {
          const isD = val === 'true' || val === true || val === ''
          state.disabled = isD
          if (isD) {
            root.setAttribute('disabled', 'true')
          } else {
            root.removeAttribute('disabled')
          }
          syncDisabledState()
        },
        configurable: true
      })

      // Initial execution
      syncLoadingState()
      syncAriaLabel()
      syncAriaPressed()

      const observer = new MutationObserver(() => {
        syncAriaLabel()
        syncAriaPressed()
      })
      observer.observe(root, {
        attributes: true,
        attributeFilter: ['aria-label', 'aria-pressed']
      })

      return () => {
        observer.disconnect()
      }
    }
  })
</script>
