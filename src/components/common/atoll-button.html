<template id="atoll-button">
  <button 
    ref="btnElement" 
    type="{{ type }}" 
    class="atoll-btn" 
    disabled="{{ isDisabled }}"
    aria-label="{{ ariaLabel }}"
    aria-pressed="{{ ariaPressed }}"
    title="{{ title }}"
  >
    <!-- Content Slot Container -->
    <span class="atoll-btn-content">
      <slot name="leading"></slot>
      <slot></slot>
      <slot name="trailing"></slot>
    </span>
  </button>
</template>

<style>
  :host {
    display: inline-block;
    vertical-align: middle;
    color-scheme: inherit;

    /* Default Host Tokens (variant: primary, size: md) */
    --btn-bg: var(--atoll-primary, var(--atoll-brand-primary, #047835));
    --btn-color: var(--atoll-text-on-brand, #FFFFFF);
    --btn-border: transparent;
    --btn-hover-bg: color-mix(in srgb, var(--atoll-primary, #047835) 88%, #000000);
    --btn-active-bg: color-mix(in srgb, var(--atoll-primary, #047835) 80%, #000000);
    --btn-hover-color: var(--btn-color);
    --btn-height: var(--atoll-btn-height-md, 44px);
    --btn-padding: 0 16px;
    --btn-radius: 10px;
    --btn-font-size: var(--atoll-font-size-body-2, 14px);
    --btn-font-weight: var(--atoll-font-weight-semibold, 600);
    --btn-icon-size: 18px;
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([disabled]),
  :host([loading]) {
    opacity: 0.45;
    pointer-events: none;
  }

  :host([block]) {
    display: block;
    width: 100%;
  }

  /* -------------------------------------------------------------------------- */
  /* Variant Modifiers (Attribute Selectors)                                    */
  /* -------------------------------------------------------------------------- */

  :host([variant="secondary"]) {
    --btn-bg: var(--atoll-bg-surface-tertiary, #E8E8E8);
    --btn-color: var(--atoll-text-primary, #111111);
    --btn-border: transparent;
    --btn-hover-bg: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #E8E8E8) 92%, #000000);
    --btn-active-bg: color-mix(in srgb, var(--atoll-bg-surface-tertiary, #E8E8E8) 84%, #000000);
  }

  :host([variant="outline"]) {
    --btn-bg: transparent;
    --btn-color: var(--atoll-text-primary, #111111);
    --btn-border: var(--atoll-border-strong, #D4D4D4);
    --btn-hover-bg: var(--atoll-bg-surface-secondary, #F5F5F5);
    --btn-active-bg: var(--atoll-bg-surface-tertiary, #E8E8E8);
  }

  :host([variant="ghost"]) {
    --btn-bg: transparent;
    --btn-color: var(--atoll-text-primary, #111111);
    --btn-border: transparent;
    --btn-hover-bg: var(--atoll-brand-subtle, rgba(6, 199, 85, 0.12));
    --btn-active-bg: var(--atoll-bg-surface-tertiary, #E8E8E8);
  }

  :host([variant="danger"]) {
    --btn-bg: var(--atoll-danger, #CE1126);
    --btn-color: #FFFFFF;
    --btn-border: transparent;
    --btn-hover-bg: color-mix(in srgb, var(--atoll-danger, #CE1126) 90%, #000000);
    --btn-active-bg: color-mix(in srgb, var(--atoll-danger, #CE1126) 80%, #000000);
  }

  :host([variant="info"]) {
    --btn-bg: var(--atoll-info, #2A54D1);
    --btn-color: #FFFFFF;
    --btn-border: transparent;
    --btn-hover-bg: color-mix(in srgb, var(--atoll-info, #2A54D1) 90%, #000000);
    --btn-active-bg: color-mix(in srgb, var(--atoll-info, #2A54D1) 80%, #000000);
  }

  :host([variant="link"]) {
    --btn-bg: transparent;
    --btn-color: var(--atoll-brand-secondary, #00A843);
    --btn-hover-color: color-mix(in srgb, var(--btn-color) 85%, currentColor);
    --btn-border: transparent;
    --btn-padding: 0;
  }

  /* -------------------------------------------------------------------------- */
  /* Size Modifiers (Attribute Selectors)                                       */
  /* -------------------------------------------------------------------------- */

  :host([size="sm"]) {
    --btn-height: var(--atoll-btn-height-sm, 32px);
    --btn-padding: 0 12px;
    --btn-radius: 8px;
    --btn-font-size: var(--atoll-font-size-caption-1, 12px);
    --btn-icon-size: 16px;
  }

  :host([size="lg"]) {
    --btn-height: var(--atoll-btn-height-lg, 52px);
    --btn-padding: 0 24px;
    --btn-radius: 12px;
    --btn-font-size: var(--atoll-font-size-body-1, 16px);
    --btn-icon-size: 22px;
  }

  /* -------------------------------------------------------------------------- */
  /* Shape Modifiers: Pill & Icon-Only (Declared after sizes to override radius)*/
  /* -------------------------------------------------------------------------- */

  :host([pill]) {
    --btn-radius: 9999px;
  }

  :host([pill][size="sm"]) {
    --btn-height: 28px;
    --btn-padding: 0 12px;
  }

  :host([pill][size="md"]) {
    --btn-height: 36px;
    --btn-padding: 0 16px;
  }

  :host([pill][size="lg"]) {
    --btn-height: 44px;
    --btn-padding: 0 20px;
  }

  :host([icon-only]) {
    --btn-padding: 0;
    width: var(--btn-height);
    height: var(--btn-height);
  }

  :host([icon-only][pill]) {
    --btn-radius: 50%;
  }

  /* -------------------------------------------------------------------------- */
  /* Base Internal Button & Layout Elements (Declared ONCE)                     */
  /* -------------------------------------------------------------------------- */

  .atoll-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--btn-font-size);
    font-weight: var(--btn-font-weight);
    height: var(--btn-height);
    padding: var(--btn-padding);
    border-radius: var(--btn-radius);
    background-color: var(--btn-bg);
    color: var(--btn-color);
    border: 1px solid var(--btn-border);
    white-space: nowrap;
    user-select: none;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
    width: 100%;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, opacity 0.15s ease-in-out, color 0.15s ease-in-out;
  }

  .atoll-btn:hover:not(:disabled) {
    background-color: var(--btn-hover-bg, var(--btn-bg));
    color: var(--btn-hover-color, var(--btn-color));
  }

  .atoll-btn:active:not(:disabled) {
    background-color: var(--btn-active-bg, var(--btn-hover-bg, var(--btn-bg)));
  }

  .atoll-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.35);
  }

  .atoll-btn:disabled,
  .atoll-btn.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Link Variant Text Decoration */
  :host([variant="link"]) .atoll-btn {
    text-decoration: underline;
  }

  /* Touch Target Expansions (44px min hit box) */
  :host([pill][size="sm"]) .atoll-btn::before,
  :host([icon-only][size="sm"]) .atoll-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 44px;
    min-height: 44px;
    width: 44px;
    height: 44px;
  }

  /* Slotted Elements Sizing & Layout Rules */
  slot[name="leading"],
  slot[name="trailing"] {
    display: contents !important;
  }

  ::slotted(atoll-icon[slot="leading"]),
  ::slotted(atoll-icon[slot="trailing"]) {
    --atoll-icon-size: var(--btn-icon-size, 18px);
    --icon-size: var(--btn-icon-size, 18px);
  }

  ::slotted(svg[slot="leading"]),
  ::slotted(svg[slot="trailing"]) {
    width: var(--btn-icon-size, 18px);
    height: var(--btn-icon-size, 18px);
  }

  ::slotted(atoll-badge[slot="trailing"]) {
    margin-left: 2px;
  }

  /* Content Wrapper */
  .atoll-btn-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s ease-in-out;
  }

  .atoll-btn-label {
    display: inline-block;
    line-height: 1;
  }

  :host([icon-only]) .atoll-btn-content {
    gap: 0;
    width: 100%;
    height: 100%;
  }

  :host([icon-only]) .atoll-btn-label {
    display: contents;
  }

  /* Loading State: Content hidden natively via host attribute */
  :host([loading]) .atoll-btn-content {
    opacity: 0;
  }

  .atoll-btn-spinner {
    position: absolute;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: atoll-spin 0.8s linear infinite;
  }

  .atoll-btn-spinner-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  @keyframes atoll-spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: {
        type: String,
        default: 'button',
        values: ['button', 'submit', 'reset']
      },
      variant: {
        type: String,
        default: 'primary',
        values: ['primary', 'secondary', 'ghost', 'danger', 'outline', 'info', 'link']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      disabled: Boolean,
      loading: Boolean,
      block: Boolean,
      pill: Boolean,
      iconOnly: Boolean,
      ariaLabel: {
        type: String,
        default: ''
      },
      ariaPressed: {
        type: String,
        default: ''
      },
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      text: {
        type: String,
        default: ''
      },
      title: {
        type: String,
        default: ''
      },
      spinnerVariant: {
        type: String,
        default: ''
      },
      spinnerPlacement: {
        type: String,
        default: 'center',
        values: ['center', 'leading', 'trailing']
      }
    },

    slots: {
      leading (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-leading'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      trailing (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.trailingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.trailingIcon)
          const spinnerSizes = {
            sm: '16',
            md: '20',
            lg: '24'
          }
          const iconSize = spinnerSizes[state.size] || '20'
          icon.setAttribute('size', iconSize)
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-trailing'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      },

      default (nodes, state) {
        if (typeof document === 'undefined') {
          return undefined
        }

        if (state.text) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          span.textContent = state.text
          return [span]
        }

        const hasContent = nodes && nodes.some(node => {
          if (node.nodeType === 3) {
            return node.nodeValue.trim().length > 0
          }
          return true
        })

        if (hasContent) {
          const span = document.createElement('span')
          span.className = 'atoll-btn-label'
          nodes.forEach(node => {
            span.appendChild(node)
          })
          return [span]
        }

        return undefined
      }
    },

    getters: {
      isDisabled: (state) => Boolean(state.disabled || state.loading)
    },

    client: ({ state, refs, root, observe, signal }) => {
      const btn = refs('btnElement')
      let spinnerEl = null

      // Forward test-id / data-testid to inner button
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
      if (testId) {
        root.__testId = testId
        btn.setAttribute('data-testid', testId)
        root.removeAttribute('test-id')
        requestAnimationFrame(() => {
          root.removeAttribute('data-testid')
        })
      }

      // Intercept clicks on the root custom element host during capture phase if disabled/loading
      root.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, {
        capture: true,
        signal
      })

      btn.addEventListener('click', (event) => {
        if (state.disabled || state.loading) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, { signal })

      // Focus, blur, and click forwarding
      root.focus = () => btn?.focus()
      root.blur = () => btn?.blur()
      root.click = () => btn?.click()

      // Imperatively create/destroy the spinner container using Bootstrap spinner component
      const syncLoadingState = () => {
        if (spinnerEl && spinnerEl.parentNode) {
          spinnerEl.parentNode.removeChild(spinnerEl)
        }

        if (state.loading) {
          spinnerEl = document.createElement('span')
  
          const placement = state.spinnerPlacement || 'center'
          if (placement === 'center') {
            spinnerEl.className = 'atoll-btn-spinner'
          } else {
            spinnerEl.className = `atoll-btn-spinner-inline atoll-btn-spinner-${placement}`
          }

          // Create Bootstrap spinner-border
          const borderEl = document.createElement('span')
          borderEl.className = 'spinner-border spinner-border-sm'

          // Add variant class if spinnerVariant is set (e.g. text-light, text-dark, text-primary)
          if (state.spinnerVariant) {
            borderEl.classList.add(`text-${state.spinnerVariant}`)
          }

          borderEl.setAttribute('role', 'status')
          borderEl.setAttribute('aria-hidden', 'true')

          spinnerEl.appendChild(borderEl)

          // Insert spinner at appropriate location
          if (placement === 'center') {
            if (!btn.contains(spinnerEl)) {
              btn.insertBefore(spinnerEl, btn.firstChild)
            }
          } else if (placement === 'leading') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.insertBefore(spinnerEl, contentContainer.firstChild)
            }
          } else if (placement === 'trailing') {
            const contentContainer = btn.querySelector('.atoll-btn-content')
            if (contentContainer) {
              contentContainer.appendChild(spinnerEl)
            }
          }

          btn.setAttribute('aria-busy', 'true')
          btn.setAttribute('aria-disabled', 'true')
        } else {
          btn.removeAttribute('aria-busy')
          btn.removeAttribute('aria-disabled')
        }
      }

      // The loading spinner is imperative DOM (created/destroyed/positioned inside the
      // <button>), so it can't be a template binding or getter and must be observed.
      observe('loading', syncLoadingState)
      observe('spinnerPlacement', syncLoadingState)
      observe('spinnerVariant', syncLoadingState)
      observe('size', syncLoadingState)

      // Initial execution
      syncLoadingState()
    }
  })
</script>
