<template id="atoll-profile">
  <div class="{{ profileClasses }}" role="img" aria-label="{{ computedAlt }}">
    <div class="atoll-profile-circle {{ gridClass }}" style="{{ circleStyle }}">
      <slot name="image">
        <img 
          ref="avatarImage" 
          alt="{{ computedAlt }}" 
          hidden="{{ hideImage }}" 
        />
        <span class="atoll-profile-fallback" hidden="{{ hideFallback }}" style="{{ fallbackStyle }}">
          <span hidden="{{ hideInitials }}" class="atoll-profile-initials">{{ initials }}</span>
          <atoll-icon hidden="{{ showInitials }}" name="user" size="{{ iconSize }}"></atoll-icon>
        </span>
      </slot>
    </div>

    <div class="atoll-profile-badge" hidden="{{ hideBadge }}">
      <slot name="badge">
        <atoll-badge size="sm" count="{{ badge }}"></atoll-badge>
      </slot>
    </div>

    <div class="atoll-profile-icon" hidden="{{ hideOverlayIcon }}">
      <slot name="icon">
        <atoll-icon name="{{ iconName }}" size="{{ overlayIconSize }}"></atoll-icon>
      </slot>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'
  export default defineComponent({
    attributes: {
      userId: {
        type: String,
        default: ''
      },
      src: {
        type: String,
        default: ''
      },
      name: {
        type: String,
        default: ''
      },
      alt: {
        type: String,
        default: 'User profile'
      },
      size: {
        type: String,
        default: 'md'
      },
      type: {
        type: String,
        default: 'single'
      },
      badge: {
        type: String,
        default: ''
      },
      iconName: {
        type: String,
        default: ''
      },
      splitCount: {
        type: Number,
        default: 1
      },
      ring: {
        type: Boolean,
        default: false
      },
      hasError: {
        type: Boolean,
        default: false
      },
      palette: {
        type: String,
        default: ''
      },
      hasProjectedImage: {
        type: Boolean,
        default: false
      }
    },

    slots: {
      /**
       * Dynamic slot evaluation for profile badge.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      badge (originalNodes, state) {
        if (!state.badge) {
          return null
        }
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }
  
        if (document) {
          const atollBadgeElement = document.createElement('atoll-badge')

          atollBadgeElement.setAttribute('size', 'sm')
          atollBadgeElement.setAttribute('count', state.badge)

          return [atollBadgeElement]
        }
  
        return `<atoll-badge size="sm" count="${state.badge}"></atoll-badge>`
      },

      /**
       * Dynamic slot evaluation for overlay icon.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      icon (originalNodes, state) {
        if (!state.iconName) {
          return null
        }
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }

        if (document) {
          const atollIconElement = document.createElement('atoll-badge')

          atollIconElement.setAttribute('size', state.overlayIconSize)
          atollIconElement.setAttribute('name', state.iconName)

          return [atollIconElement]
        }

        return `<atoll-icon name="${state.iconName}" size="${state.overlayIconSize}"></atoll-icon>`
      }
    },

    getters: {
      computedAlt: (state) => state.alt || state.name || 'User profile',

      initials: (state) => {
        const str = state.name || state.alt
        if (!str || str === 'User profile') {
          return ''
        }
        const clean = str.trim()
        const words = clean.split(/\s+/)
        if (words.length >= 2 && words[0][0] && words[1][0]) {
          return (words[0][0] + words[1][0]).toUpperCase()
        }
        return clean.slice(0, 2).toUpperCase()
      },

      showInitials: (state) => {
        const str = state.name || state.alt
        if (!str || str === 'User profile') {
          return false
        }
        const clean = str.trim()
        return clean.length > 0
      },

      hideInitials: (state) => {
        const str = state.name || state.alt
        if (!str || str === 'User profile') {
          return 'true'
        }
        const clean = str.trim()
        return clean.length === 0 ? 'true' : null
      },

      fallbackStyle: (state) => {
        const seedStr = state.name || state.alt
        if (seedStr && seedStr !== 'User profile') {
          const palette = [
            '#06C755',
            '#15BD66',
            '#19BFA1',
            '#1CB8B8',
            '#0093C4',
            '#0279D4',
            '#2F59CC',
            '#4545D1',
            '#6B3CC9',
            '#AF36C7',
            '#DE2C7F',
            '#E5172F',
            '#FF5E1F',
            '#FCB321'
          ]
          let hash = 0
          for (let i = 0; i < seedStr.length; i++) {
            hash = seedStr.charCodeAt(i) + ((hash << 5) - hash)
          }
          const color = palette[Math.abs(hash) % palette.length]
          return `background-color: ${color}; color: #FFFFFF;`
        }
        return ''
      },

      hideImage: (state) => (state.palette || state.hasProjectedImage === 'true' || state.hasProjectedImage === true || !state.src || state.hasError ? 'true' : null),

      hideFallback: (state) => (state.palette || state.hasProjectedImage === 'true' || state.hasProjectedImage === true || (Boolean(state.src) && !state.hasError) || state.type === 'multiparty' ? 'true' : null),

      hideBadge: (state) => (!state.badge ? 'true' : null),

      hideOverlayIcon: (state) => (!state.iconName ? 'true' : null),

      iconSize: (state) => {
        if (state.size === '2xs' || state.size === 'xs') {
          return '16'
        }
        if (state.size === 'sm' || state.size === 'md') {
          return '24'
        }
        if (state.size === 'lg' || state.size === 'xl') {
          return '32'
        }
        return '48'
      },

      overlayIconSize: (state) => {
        if (state.size === '2xs' || state.size === 'xs') {
          return '10'
        }
        if (state.size === 'sm' || state.size === 'md') {
          return '14'
        }
        return '18'
      },

      gridClass: (state) => {
        if (state.type === 'multiparty') {
          const count = Math.min(Math.max(state.splitCount, 2), 4)
          return `multiparty-${count}`
        }
        return ''
      },

      profileClasses: (state) => {
        const classes = ['atoll-profile']

        if (state.size) {
          classes.push(`atoll-profile-${state.size}`)
        } else {
          classes.push('atoll-profile-md')
        }

        if (state.type) {
          classes.push(`atoll-profile-${state.type}`)
        }

        if (state.ring) {
          classes.push('atoll-profile-ring')
        }

        return classes.join(' ')
      },

      circleStyle: (state) => {
        const hasPalette = state.palette === 'true' || state.palette === true || (typeof state.palette === 'string' && state.palette.length > 0)
        if (hasPalette) {
          let seedStr = ''
          if (typeof state.palette === 'string' && state.palette !== 'true') {
            seedStr = state.palette
          } else {
            seedStr = state.name || state.alt || ''
          }
          if (seedStr && seedStr !== 'User profile') {
            const palette = [
              '#06C755',
              '#15BD66',
              '#19BFA1',
              '#1CB8B8',
              '#0093C4',
              '#0279D4',
              '#2F59CC',
              '#4545D1',
              '#6B3CC9',
              '#AF36C7',
              '#DE2C7F',
              '#E5172F',
              '#FF5E1F',
              '#FCB321'
            ]
            let hash = 0
            for (let i = 0; i < seedStr.length; i++) {
              hash = seedStr.charCodeAt(i) + ((hash << 5) - hash)
            }
            const color = palette[Math.abs(hash) % palette.length]
            return `--atoll-profile-placeholder-bg: ${color}; background-color: ${color}; color: #FFFFFF;`
          }
        }
        return ''
      }
    },

    client: ({ state, refs, root, observe, globalStore, pocketbase, storage }) => {
      const { $state } = globalStore || {}
      const { pb } = pocketbase || {}
      const { $storage } = storage || {}

      const img = refs('avatarImage')

      if (img) {
        img.addEventListener('error', () => {
          state.hasError = true
        })

        img.addEventListener('load', () => {
          state.hasError = false
        })
      }

      const updateSrc = (newSrc) => {
        if (!img) {
          return
        }
        if (newSrc) {
          state.hasError = false
          img.src = newSrc
        } else {
          state.hasError = true
          img.removeAttribute('src')
        }
      }

      if (state.src) {
        updateSrc(state.src)
      }
      observe('src', updateSrc)

      // Self-cleaning slot default contents: completely remove standard img and fallback span when a custom slot="image" node is projected
      const cleanDefaultSlot = () => {
        const hasImageSlot = root.querySelector('[slot="image"]') !== null
        if (hasImageSlot) {
          state.hasProjectedImage = true

          const circle = root.querySelector('.atoll-profile-circle')
          if (circle) {
            const defaultImg = circle.querySelector('img[ref="avatarImage"]') || circle.querySelector('img')
            if (defaultImg && !defaultImg.getAttribute('slot')) {
              defaultImg.style.setProperty('display', 'none', 'important')
              defaultImg.setAttribute('hidden', 'true')
            }
            const defaultFallback = circle.querySelector('.atoll-profile-fallback')
            if (defaultFallback) {
              defaultFallback.style.setProperty('display', 'none', 'important')
              defaultFallback.setAttribute('hidden', 'true')
            }
          }
        }
      }
      cleanDefaultSlot()
      requestAnimationFrame(cleanDefaultSlot)
      setTimeout(cleanDefaultSlot, 50)

      if (observe) {
        observe('palette', (val) => {
          state.palette = val
        })
        observe('hasProjectedImage', (val) => {
          state.hasProjectedImage = val === 'true' || val === true
        })
      }

      // Real-time user profile state synchronization
      const fetchingUserIds = new Set()

      const fetchAndCacheUser = async (uid) => {
        if (!uid || fetchingUserIds.has(uid)) {
          return
        }
        fetchingUserIds.add(uid)

        try {
          let userRecord = null

          // try local storage database rooms
          if ($storage && typeof $storage.getAllRoomsSorted === 'function') {
            const rooms = await $storage.getAllRoomsSorted()
            for (const r of rooms) {
              const found = r.participants?.find(p => p.id === uid)
              if (found) {
                userRecord = found
                break
              }
            }
          }

          // try PocketBase fetch
          if (!userRecord && pb) {
            userRecord = await pb.collection('users').getOne(uid)
          }

          if (userRecord && $state) {
            $state.users = {
              ...$state.users,
              [uid]: {
                ...($state.users?.[uid] || {}),
                ...userRecord
              }
            }
          }
        } catch (err) {
          console.error('[atoll-profile] Failed to fetch and cache user on-demand:', uid, err)
        } finally {
          fetchingUserIds.delete(uid)
        }
      }

      const syncFromUserStore = (uid) => {
        if (!uid || !$state) {
          return
        }

        let user = $state.users?.[uid]
        if (!user && $state.currentUser?.id === uid) {
          user = $state.currentUser
        }

        if (user) {
          let avatarUrl = ''
          if (user.avatar) {
            const filesService = pocketbase?.files || pb?.files
            if (filesService) {
              const getUrlFn = filesService.getUrl || filesService.getURL
              if (typeof getUrlFn === 'function') {
                avatarUrl = getUrlFn.call(filesService, user, user.avatar, { thumb: '100x100' })
              }
            }
          }
          const displayName = user.name || user.username || ''
          state.src = avatarUrl
          state.name = displayName
          state.alt = displayName || 'User profile'
        } else {
          fetchAndCacheUser(uid).catch(console.error)
        }
      }

      let unsubUsers = null
      let unsubCurrentUser = null

      if (state.userId) {
        syncFromUserStore(state.userId)

        if ($state) {
          unsubUsers = $state.subscribe('users', (newUsers) => {
            if (state.userId && newUsers?.[state.userId]) {
              syncFromUserStore(state.userId)
            }
          })

          unsubCurrentUser = $state.subscribe('currentUser', (newUser) => {
            if (state.userId && newUser?.id === state.userId) {
              syncFromUserStore(state.userId)
            }
          })
        }
      }

      observe('userId', (newUserId) => {
        if (newUserId) {
          syncFromUserStore(newUserId)

          if ($state) {
            if (!unsubUsers) {
              unsubUsers = $state.subscribe('users', (newUsers) => {
                if (state.userId && newUsers?.[state.userId]) {
                  syncFromUserStore(state.userId)
                }
              })
            }
            if (!unsubCurrentUser) {
              unsubCurrentUser = $state.subscribe('currentUser', (newUser) => {
                if (state.userId && newUser?.id === state.userId) {
                  syncFromUserStore(state.userId)
                }
              })
            }
          }
        } else {
          if (unsubUsers) {
            unsubUsers()
            unsubUsers = null
          }
          if (unsubCurrentUser) {
            unsubCurrentUser()
            unsubCurrentUser = null
          }
        }
      })

      let disconnectMultiparty = null

      const handleMultiparty = () => {
        if (state.type !== 'multiparty') {
          return
        }

        const container = root.querySelector('[slot="image"]')
        if (!container) {
          return
        }

        const targetCount = Math.min(Math.max(state.splitCount, 2), 4)

        const syncImages = () => {
          const defaultImg = container.querySelector('[ref="avatarImage"]')
          if (defaultImg && !defaultImg.getAttribute('src')) {
            defaultImg.remove()
          }

          const children = Array.from(container.children)

          children.forEach((child) => {
            if (child.tagName === 'IMG' && !child.dataset.fallbackBound) {
              child.dataset.fallbackBound = 'true'

              const getInitials = (str) => {
                if (!str || str === 'User profile') {
                  return ''
                }
                const clean = str.trim()
                const words = clean.split(/\s+/)
                if (words.length >= 2 && words[0][0] && words[1][0]) {
                  return (words[0][0] + words[1][0]).toUpperCase()
                }
                return clean.slice(0, 2).toUpperCase()
              }

              const getDeterministicColor = (str) => {
                const palette = [
                  '#06C755',
                  '#15BD66',
                  '#19BFA1',
                  '#1CB8B8',
                  '#0093C4',
                  '#0279D4',
                  '#2F59CC',
                  '#4545D1',
                  '#6B3CC9',
                  '#AF36C7',
                  '#DE2C7F',
                  '#E5172F',
                  '#FF5E1F',
                  '#FCB321'
                ]
                if (!str) {
                  return palette[0]
                }
                let hash = 0
                for (let i = 0; i < str.length; i++) {
                  hash = str.charCodeAt(i) + ((hash << 5) - hash)
                }
                return palette[Math.abs(hash) % palette.length]
              }

              const replaceWithFallback = () => {
                const fallback = document.createElement('span')
                fallback.className = 'atoll-profile-fallback'
                const altText = child.alt || child.getAttribute('alt') || ''
                const inits = getInitials(altText)
                if (inits) {
                  fallback.style.backgroundColor = getDeterministicColor(altText)
                  fallback.style.color = '#FFFFFF'
                  const initSpan = document.createElement('span')
                  initSpan.className = 'atoll-profile-initials'
                  initSpan.textContent = inits
                  fallback.appendChild(initSpan)
                } else {
                  const icon = document.createElement('atoll-icon')
                  icon.setAttribute('name', 'user')
                  icon.setAttribute('size', state.iconSize)
                  fallback.appendChild(icon)
                }
                child.replaceWith(fallback)
              }

              child.addEventListener('error', replaceWithFallback)
            }
          })

          const defaultFallbacks = Array.from(container.querySelectorAll('.atoll-profile-fallback[data-default-fallback="true"]'))
          const defaultCount = defaultFallbacks.length

          const nonDefaultChildren = Array.from(container.children).filter(child => {
            return child.dataset.defaultFallback !== 'true'
          })
          const nonDefaultCount = nonDefaultChildren.length

          const neededDefaultCount = Math.max(0, targetCount - nonDefaultCount)

          if (defaultCount > neededDefaultCount) {
            const excessCount = defaultCount - neededDefaultCount
            for (let i = 0; i < excessCount; i++) {
              defaultFallbacks[i].remove()
            }
          } else if (defaultCount < neededDefaultCount) {
            const missingCount = neededDefaultCount - defaultCount
            for (let i = 0; i < missingCount; i++) {
              const fallback = document.createElement('span')
              fallback.className = 'atoll-profile-fallback'
              fallback.dataset.defaultFallback = 'true'

              const icon = document.createElement('atoll-icon')
              icon.setAttribute('name', 'user')
              icon.setAttribute('size', state.iconSize)

              fallback.appendChild(icon)
              container.appendChild(fallback)
            }
          }
        }

        syncImages()

        const mutObserver = new MutationObserver(syncImages)
        mutObserver.observe(container, { childList: true })

        disconnectMultiparty = () => {
          mutObserver.disconnect()
        }
      }

      handleMultiparty()

      observe('type', () => {
        if (disconnectMultiparty) {
          disconnectMultiparty()
          disconnectMultiparty = null
        }
        handleMultiparty()
      })

      observe('splitCount', () => {
        if (disconnectMultiparty) {
          disconnectMultiparty()
          disconnectMultiparty = null
        }
        handleMultiparty()
      })

      return () => {
        if (disconnectMultiparty) {
          disconnectMultiparty()
        }
        if (unsubUsers) {
          unsubUsers()
        }
        if (unsubCurrentUser) {
          unsubCurrentUser()
        }
      }
    }
  })
</script>
