<template id="atoll-icon">
  <span ref="iconWrapper" class="atoll-icon {{ iconClasses }}"></span>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  :host([hidden]) {
    display: none !important;
  }

  /* Base Icon Class */
  .atoll-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    width: var(--atoll-icon-size, 24px);
    height: var(--atoll-icon-size, 24px);
    flex-shrink: 0;
  }

  .atoll-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Size Modifier Classes */
  .atoll-icon-xs {
    --atoll-icon-size: var(--atoll-icon-size-xs, 16px);
  }

  .atoll-icon-sm {
    --atoll-icon-size: var(--atoll-icon-size-sm, 20px);
  }

  .atoll-icon-md {
    --atoll-icon-size: var(--atoll-icon-size-md, 24px);
  }

  .atoll-icon-lg {
    --atoll-icon-size: var(--atoll-icon-size-lg, 32px);
  }

  .atoll-icon-xl {
    --atoll-icon-size: var(--atoll-icon-size-xl, 48px);
  }

  .atoll-icon-hangup {
    display: inline-block;
    transform: rotate(135deg);
  }

  /* Contrast Adjustments for Solid Buttons */
  .atoll-btn-primary .atoll-icon,
  .btn-primary .atoll-icon,
  .atoll-btn-danger .atoll-icon,
  .btn-danger .atoll-icon {
    --atoll-icon-out-stroke: #FFFFFF;
    --atoll-icon-out-fill: rgba(255, 255, 255, 0.25);
    --atoll-icon-inner-stroke: #FFFFFF;
    --atoll-icon-inner-fill: #FFFFFF;
    --solar-secondary-color: currentColor;
    --solar-secondary-opacity: 0.6;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      name: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      color: {
        type: String,
        default: ''
      },
      secondaryColor: {
        type: String,
        default: ''
      },
      ariaLabel: {
        type: String,
        default: ''
      },
      active: {
        type: Boolean,
        default: false
      }
    },

    style: {
      '--atoll-icon-size': (s) => {
        const presets = { xs: '16px', sm: '20px', md: '24px', lg: '32px', xl: '48px' }
        if (s.size && presets[s.size]) return presets[s.size]
        if (s.size && !isNaN(s.size)) return `${s.size}px`
        return '24px'
      },
      '--atoll-icon-primary-color': (s) => s.color || 'currentColor',
      '--atoll-icon-secondary-color': (s) => s.secondaryColor || null,
      '--atoll-icon-out-stroke': (s) => s.color || 'currentColor',
      '--atoll-icon-out-fill': (s) => s.secondaryColor || null
    },

    getters: {
      iconClasses: (state) => {
        const classes = []

        // Size modifier class
        if (state.size) {
          if (['xs', 'sm', 'md', 'lg', 'xl'].includes(state.size)) {
            classes.push(`atoll-icon-${state.size}`)
          }
        } else {
          classes.push('atoll-icon-md')
        }

        return classes.join(' ')
      }
    },

    client: async ({ state, refs, root, observe }) => {
      const { renderIcon } = await import('../../utils/icon-registry.js')

      const render = () => {
        const wrapper = refs('iconWrapper')
        if (!wrapper) return

        let numericSize = 24
        if (state.size) {
          if (state.size === 'xs') {
            numericSize = 16
          } else if (state.size === 'sm') {
            numericSize = 20
          } else if (state.size === 'md') {
            numericSize = 24
          } else if (state.size === 'lg') {
            numericSize = 32
          } else if (state.size === 'xl') {
            numericSize = 48
          } else if (!isNaN(state.size)) {
            numericSize = Number(state.size)
          }
        }

        renderIcon(wrapper, {
          name: state.name,
          size: numericSize,
          primaryColor: state.color,
          secondaryColor: state.secondaryColor,
          active: state.active
        })

        // Apply style variables to inner wrapper
        if (state.size && !['xs', 'sm', 'md', 'lg', 'xl'].includes(state.size) && !isNaN(state.size)) {
          wrapper.style.setProperty('--atoll-icon-size', `${state.size}px`)
        } else {
          wrapper.style.removeProperty('--atoll-icon-size')
        }

        if (state.color) {
          wrapper.style.setProperty('--atoll-icon-out-stroke', state.color)
          wrapper.style.setProperty('--atoll-icon-primary-color', state.color)
        } else {
          wrapper.style.removeProperty('--atoll-icon-out-stroke')
          wrapper.style.removeProperty('--atoll-icon-primary-color')
        }

        if (state.secondaryColor) {
          wrapper.style.setProperty('--atoll-icon-out-fill', state.secondaryColor)
          wrapper.style.setProperty('--atoll-icon-secondary-color', state.secondaryColor)
        } else {
          wrapper.style.removeProperty('--atoll-icon-out-fill')
          wrapper.style.removeProperty('--atoll-icon-secondary-color')
        }

        // Accessibility handling
        if (state.ariaLabel) {
          root.setAttribute('role', 'img')
          root.setAttribute('aria-label', state.ariaLabel)
          root.removeAttribute('aria-hidden')
        } else {
          root.setAttribute('aria-hidden', 'true')
          root.removeAttribute('role')
          root.removeAttribute('aria-label')
        }
      }

      // Re-render when attributes update
      observe('name', render)
      observe('size', render)
      observe('color', render)
      observe('secondaryColor', render)
      observe('ariaLabel', render)
      observe('active', render)

      render()
    }
  })
</script>
