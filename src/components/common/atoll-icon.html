<template id="atoll-icon">
  <span ref="iconWrapper" class="atoll-icon {{ iconClasses }}"></span>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      name: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      color: {
        type: String,
        default: ''
      },
      secondaryColor: {
        type: String,
        default: ''
      },
      ariaLabel: {
        type: String,
        default: ''
      }
    },

    getters: {
      iconClasses: (state) => {
        const classes = []

        // Size modifier class
        if (state.size) {
          if (['xs', 'sm', 'md', 'lg', 'xl'].includes(state.size)) {
            classes.push(`atoll-icon-${state.size}`)
          }
        } else {
          classes.push('atoll-icon-md')
        }

        return classes.join(' ')
      }
    },

    client: async ({ state, refs, root, observe }) => {
      // Dynamic import inside client block
      const { getIconSvg } = await import('../../utils/icon-registry.js')

      const render = () => {
        const wrapper = refs('iconWrapper')
        if (!wrapper) {
          return
        }

        // Map token sizes to numeric values for IconPark function
        let numericSize = 24
        if (state.size) {
          if (state.size === 'xs') {
            numericSize = 16
          } else if (state.size === 'sm') {
            numericSize = 20
          } else if (state.size === 'md') {
            numericSize = 24
          } else if (state.size === 'lg') {
            numericSize = 32
          } else if (state.size === 'xl') {
            numericSize = 48
          } else if (!isNaN(state.size)) {
            numericSize = Number(state.size)
          }
        }

        // Fetch SVG from IconPark Registry
        const svgContent = getIconSvg(state.name, {
          size: numericSize,
          primaryColor: state.color || 'currentColor',
          secondaryColor: state.secondaryColor || 'currentColor'
        })

        wrapper.innerHTML = svgContent || ''

        // Handle explicit numeric size (e.g., size="28") if not a token name
        if (state.size && !['xs', 'sm', 'md', 'lg', 'xl'].includes(state.size) && !isNaN(state.size)) {
          wrapper.style.setProperty('--atoll-icon-size', `${state.size}px`)
        } else {
          wrapper.style.removeProperty('--atoll-icon-size')
        }

        // Apply inline color overrides if explicitly passed
        if (state.color) {
          wrapper.style.setProperty('--atoll-icon-out-stroke', state.color)
          wrapper.style.setProperty('--atoll-icon-primary-color', state.color)
        } else {
          wrapper.style.removeProperty('--atoll-icon-out-stroke')
          wrapper.style.removeProperty('--atoll-icon-primary-color')
        }

        if (state.secondaryColor) {
          wrapper.style.setProperty('--atoll-icon-out-fill', state.secondaryColor)
          wrapper.style.setProperty('--atoll-icon-secondary-color', state.secondaryColor)
        } else {
          wrapper.style.removeProperty('--atoll-icon-out-fill')
          wrapper.style.removeProperty('--atoll-icon-secondary-color')
        }

        // Accessibility handling
        if (state.ariaLabel) {
          root.setAttribute('role', 'img')
          root.setAttribute('aria-label', state.ariaLabel)
          root.removeAttribute('aria-hidden')
        } else {
          root.setAttribute('aria-hidden', 'true')
          root.removeAttribute('role')
          root.removeAttribute('aria-label')
        }
      }

      // Re-render when attributes update
      observe('name', render)
      observe('size', render)
      observe('color', render)
      observe('secondaryColor', render)
      observe('ariaLabel', render)

      render()
    }
  })
</script>
