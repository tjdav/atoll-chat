<template id="atoll-icon">
  <span ref="iconWrapper" class="atoll-icon"></span>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;

    --icon-size: 24px;
    --icon-primary-color: currentColor;
    --icon-secondary-color: currentColor;
  }

  :host([hidden]) {
    display: none !important;
  }

  /* Preset Sizes */
  :host([size="xs"]) { --icon-size: 16px; }
  :host([size="sm"]) { --icon-size: 20px; }
  :host([size="md"]) { --icon-size: 24px; }
  :host([size="lg"]) { --icon-size: 32px; }
  :host([size="xl"]) { --icon-size: 48px; }

  /* Hangup rotation modifier */
  :host([name="hangup"]),
  :host([name="phone-hangup"]),
  :host([variant="hangup"]) {
    transform: rotate(135deg);
  }

  .atoll-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    width: var(--icon-size, 24px);
    height: var(--icon-size, 24px);
    color: var(--icon-primary-color, currentColor);
    flex-shrink: 0;
  }

  .atoll-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      name: {
        type: String,
        required: true
      },
      size: {
        type: String,
        default: 'md'
      },
      color: {
        type: String,
        default: ''
      },
      secondaryColor: {
        type: String,
        default: ''
      },
      ariaLabel: {
        type: String,
        default: ''
      },
      active: {
        type: Boolean,
        default: false
      }
    },

    style: {
      '--icon-size': (s) => {
        const presets = {
          xs: '16px',
          sm: '20px',
          md: '24px',
          lg: '32px',
          xl: '48px'
        }

        if (s.size && presets[s.size]) {
          return presets[s.size]
        }

        if (s.size && !isNaN(s.size)) {
          return `${s.size}px`
        }

        return '24px'
      },
      '--icon-primary-color': (s) => s.color || 'currentColor',
      '--icon-secondary-color': (s) => s.secondaryColor || null,
      '--atoll-icon-size': (s) => {
        const presets = {
          xs: '16px',
          sm: '20px',
          md: '24px',
          lg: '32px',
          xl: '48px'
        }

        if (s.size && presets[s.size]) {
          return presets[s.size]
        }

        if (s.size && !isNaN(s.size)) {
          return `${s.size}px`
        }

        return '24px'
      },
      '--atoll-icon-primary-color': (s) => s.color || 'currentColor',
      '--atoll-icon-secondary-color': (s) => s.secondaryColor || null
    },

    client: async ({ state, refs, root, observe }) => {
      const { renderIcon } = await import('../../utils/icon-registry.js')
      const wrapper = refs('iconWrapper')

      const render = () => {
        if (!wrapper) {
          return
        }

        let numericSize = 24
        if (state.size) {
          if (state.size === 'xs') {
            numericSize = 16
          } else if (state.size === 'sm') {
            numericSize = 20
          } else if (state.size === 'md') {
            numericSize = 24
          } else if (state.size === 'lg') {
            numericSize = 32
          } else if (state.size === 'xl') {
            numericSize = 48
          } else if (!isNaN(state.size)) {
            numericSize = Number(state.size)
          }
        }

        renderIcon(wrapper, {
          name: state.name,
          size: numericSize,
          primaryColor: state.color,
          secondaryColor: state.secondaryColor,
          active: state.active
        })

        if (state.ariaLabel) {
          root.setAttribute('role', 'img')
          root.setAttribute('aria-label', state.ariaLabel)
          root.removeAttribute('aria-hidden')
        } else {
          root.setAttribute('aria-hidden', 'true')
          root.removeAttribute('role')
          root.removeAttribute('aria-label')
        }
      }

      observe('name', render)
      observe('size', render)
      observe('color', render)
      observe('secondaryColor', render)
      observe('ariaLabel', render)
      observe('active', render)

      render()
    }
  })
</script>
