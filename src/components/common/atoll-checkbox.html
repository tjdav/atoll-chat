<template id="atoll-checkbox">
  <div class="{{ wrapperClasses }}" ref="checkboxRoot">
    <input 
      type="checkbox" 
      class="atoll-checkbox-input visually-hidden" 
      ref="nativeInput" 
      checked="{{ isChecked }}"
      disabled="{{ isDisabled }}"
      aria-label="{{ checkboxAriaLabel }}"
      tabindex="-1"
    />
    <atoll-icon 
      name="{{ iconName }}" 
      active="{{ isChecked }}" 
      size="{{ iconSize }}" 
      color="{{ iconColor }}"
      class="atoll-checkbox-icon"
    ></atoll-icon>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      checked: Boolean,
      disabled: Boolean,
      size: {
        type: Number,
        default: 22
      },
      name: {
        type: String,
        default: 'check'
      },
      label: {
        type: String,
        default: 'Toggle selection'
      }
    },

    getters: {
      isChecked: (state) => Boolean(state.checked),
      isDisabled: (state) => Boolean(state.disabled),
      ariaChecked: (state) => (state.checked ? 'true' : 'false'),
      tabIndex: (state) => (state.disabled ? '-1' : '0'),
      iconSize: (state) => state.size || 22,
      iconName: (state) => state.name || 'check',
      checkboxAriaLabel: (state) => state.label || 'Toggle selection',
      iconColor: (state) => (state.checked ? '#FFFFFF' : 'transparent'),
      wrapperClasses: (state) => {
        const classes = ['atoll-checkbox']
        if (state.checked) {
          classes.push('checked')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      if (root.__initialized) {
        return
      }
      root.__initialized = true
      const checkboxRoot = refs('checkboxRoot')
      const nativeInput = refs('nativeInput')

      root.setAttribute('role', 'checkbox')
      root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
      root.setAttribute('tabindex', state.disabled ? '-1' : '0')

      const toggle = () => {
        if (state.disabled) {
          return
        }
        state.checked = !state.checked
        root.setAttribute('aria-checked', state.checked ? 'true' : 'false')

        if (nativeInput) {
          nativeInput.checked = state.checked
        }

        root.dispatchEvent(new CustomEvent('change', {
          bubbles: true,
          composed: true,
          detail: { checked: state.checked }
        }))
        root.dispatchEvent(new CustomEvent('input', {
          bubbles: true,
          composed: true,
          detail: { checked: state.checked }
        }))
      }

      if (root.__listenersBound) {
        // Safe-guard for reconnects
      } else {
        root.__listenersBound = true

        root.addEventListener('click', (e) => {
          // If clicked on the label or input or icon, let the label click handle it or prevent default to avoid double-toggle
          if (e.target !== root) {
            // let nested elements bubble up
            return
          }
          e.preventDefault()
          e.stopPropagation()
          toggle()
        })

        if (checkboxRoot) {
          checkboxRoot.addEventListener('click', (e) => {
            e.preventDefault()
            e.stopPropagation()
            toggle()
          })
        }

        root.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault()
            e.stopPropagation()
            toggle()
          }
        })
      }

      // Expose property on host element
      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
          root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
          if (nativeInput) {
            nativeInput.checked = state.checked
          }
        },
        configurable: true
      })

      Object.defineProperty(root, 'disabled', {
        get () {
          return state.disabled
        },
        set (val) {
          state.disabled = Boolean(val)
          root.setAttribute('tabindex', state.disabled ? '-1' : '0')
        },
        configurable: true
      })

      if (observe) {
        observe('checked', (val) => {
          state.checked = val === 'true' || val === true || val === ''
          root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
          if (nativeInput) {
            nativeInput.checked = state.checked
          }
        })
        observe('disabled', (val) => {
          state.disabled = val === 'true' || val === true || val === ''
          root.setAttribute('tabindex', state.disabled ? '-1' : '0')
        })
      }
    }
  })
</script>
