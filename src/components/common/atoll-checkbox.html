<template id="atoll-checkbox">
  <div class="{{ wrapperClasses }}" ref="checkboxRoot">
    <input 
      type="checkbox" 
      class="atoll-checkbox-input visually-hidden" 
      ref="nativeInput" 
      checked="{{ isChecked }}"
      disabled="{{ isDisabled }}"
      aria-label="{{ checkboxAriaLabel }}"
      tabindex="-1"
    />
    <atoll-icon 
      name="{{ iconName }}" 
      active="{{ isChecked }}" 
      size="{{ iconSize }}" 
      color="{{ iconColor }}"
      class="atoll-checkbox-icon"
    ></atoll-icon>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  :host([hidden]) {
    display: none !important;
  }

  .atoll-checkbox {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--atoll-checkbox-size, 22px);
    height: var(--atoll-checkbox-size, 22px);
    cursor: pointer;
    box-sizing: border-box;
    user-select: none;
    flex-shrink: 0;
    border: 1.5px solid var(--atoll-border-subtle, var(--atoll-gray-300, #D0D5DD));
    border-radius: 4px;
    background-color: transparent;
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-checkbox,
  :host-context([data-bs-theme="dark"]) .atoll-checkbox,
  [data-atoll-theme="dark"] .atoll-checkbox,
  [data-bs-theme="dark"] .atoll-checkbox {
    border: 1.5px solid var(--atoll-border-subtle, var(--atoll-gray-700, #344054));
  }

  .atoll-checkbox:focus-visible,
  :host(:focus-visible) .atoll-checkbox {
    outline: none;
    border-color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    box-shadow: 0 0 0 0.25rem color-mix(in srgb, var(--atoll-primary, #06C755) 20%, transparent);
  }

  .atoll-checkbox.checked {
    background-color: var(--atoll-primary, var(--atoll-brand-primary, #06C755)) !important;
    border-color: var(--atoll-primary, var(--atoll-brand-primary, #06C755)) !important;
  }

  .atoll-checkbox .atoll-checkbox-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .atoll-checkbox:hover .atoll-checkbox-icon {
    transform: scale(1.05);
  }

  .atoll-checkbox.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      checked: Boolean,
      disabled: Boolean,
      size: {
        type: Number,
        default: 22
      },
      name: {
        type: String,
        default: 'check'
      },
      label: {
        type: String,
        default: 'Toggle selection'
      }
    },

    getters: {
      isChecked: (state) => Boolean(state.checked),
      isDisabled: (state) => Boolean(state.disabled),
      ariaChecked: (state) => (state.checked ? 'true' : 'false'),
      iconSize: (state) => state.size || 22,
      iconName: (state) => state.name || 'check',
      checkboxAriaLabel: (state) => state.label || 'Toggle selection',
      iconColor: (state) => (state.checked ? '#FFFFFF' : 'transparent'),
      wrapperClasses: (state) => {
        const classes = ['atoll-checkbox']
        if (state.checked) {
          classes.push('checked')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      if (root.__initialized) {
        return
      }
      root.__initialized = true
      const checkboxRoot = refs('checkboxRoot')
      const nativeInput = refs('nativeInput')

      root.setAttribute('role', 'checkbox')
      root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
      root.setAttribute('tabindex', state.disabled ? '-1' : '0')

      const toggle = () => {
        if (state.disabled) {
          return
        }
        state.checked = !state.checked
        root.setAttribute('aria-checked', state.checked ? 'true' : 'false')

        if (nativeInput) {
          nativeInput.checked = state.checked
        }

        root.dispatchEvent(new CustomEvent('change', {
          bubbles: true,
          composed: true,
          detail: { checked: state.checked }
        }))
        root.dispatchEvent(new CustomEvent('input', {
          bubbles: true,
          composed: true,
          detail: { checked: state.checked }
        }))
      }

      if (root.__listenersBound) {
        // Safe-guard for reconnects
      } else {
        root.__listenersBound = true

        root.addEventListener('click', (e) => {
          // If clicked on the label or input or icon, let the label click handle it or prevent default to avoid double-toggle
          if (e.target !== root) {
            // let nested elements bubble up
            return
          }
          e.preventDefault()
          e.stopPropagation()
          toggle()
        })

        checkboxRoot.addEventListener('click', (e) => {
          e.preventDefault()
          e.stopPropagation()
          toggle()
        })

        root.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault()
            e.stopPropagation()
            toggle()
          }
        })
      }

      // Expose property on host element
      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
          root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
          if (nativeInput) {
            nativeInput.checked = state.checked
          }
        },
        configurable: true
      })

      Object.defineProperty(root, 'disabled', {
        get () {
          return state.disabled
        },
        set (val) {
          state.disabled = Boolean(val)
          root.setAttribute('tabindex', state.disabled ? '-1' : '0')
        },
        configurable: true
      })

      if (observe) {
        observe('checked', (val) => {
          const isChecked = val === 'true' || val === true || val === ''
          root.setAttribute('aria-checked', isChecked ? 'true' : 'false')
          if (nativeInput) {
            nativeInput.checked = isChecked
          }
        })
        observe('disabled', (val) => {
          const isDisabled = val === 'true' || val === true || val === ''
          root.setAttribute('tabindex', isDisabled ? '-1' : '0')
        })
      }
    }
  })
</script>
