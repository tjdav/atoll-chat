<template id="atoll-checkbox">
  <div class="atoll-checkbox" ref="checkboxRoot">
    <input 
      type="checkbox" 
      class="atoll-checkbox-input visually-hidden" 
      ref="nativeInput" 
      checked="{{ isChecked }}"
      disabled="{{ isDisabled }}"
      aria-label="{{ checkboxAriaLabel }}"
      aria-hidden="true"
      tabindex="-1"
    />
    <atoll-icon 
      name="{{ iconName }}" 
      active="{{ isChecked }}" 
      size="{{ iconSize }}" 
      color="{{ iconColor }}"
      class="atoll-checkbox-icon"
    ></atoll-icon>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    --checkbox-size: 24px;
    --checkbox-border-radius: 4px;
    --checkbox-border: var(--atoll-border-subtle, var(--atoll-gray-300, #D0D5DD));
    --checkbox-bg: transparent;
    --checkbox-checked-bg: var(--atoll-primary, var(--atoll-brand-primary, #047835));
    --checkbox-checked-border: var(--atoll-primary, var(--atoll-brand-primary, #047835));
    --checkbox-focus-ring: color-mix(in srgb, var(--atoll-primary, #047835) 20%, transparent);
  }

  .atoll-checkbox-input {
    display: none !important;
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([disabled]),
  :host(.disabled) {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Checked Host Modifier */
  :host([checked]) {
    --checkbox-bg: var(--checkbox-checked-bg);
    --checkbox-border: var(--checkbox-checked-border);
  }

  .atoll-checkbox {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--atoll-checkbox-size, var(--checkbox-size));
    height: var(--atoll-checkbox-size, var(--checkbox-size));
    cursor: pointer;
    box-sizing: border-box;
    user-select: none;
    flex-shrink: 0;
    border: 1.5px solid var(--checkbox-border);
    border-radius: var(--checkbox-border-radius);
    background-color: var(--checkbox-bg);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  :host(:focus-visible) .atoll-checkbox,
  .atoll-checkbox:focus-visible {
    outline: none;
    border-color: var(--checkbox-checked-border);
    box-shadow: 0 0 0 0.25rem var(--checkbox-focus-ring);
  }

  .atoll-checkbox .atoll-checkbox-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  :host(:hover:not([disabled])) .atoll-checkbox .atoll-checkbox-icon,
  .atoll-checkbox:hover .atoll-checkbox-icon {
    transform: scale(1.05);
  }

  /* Dark Mode Overrides */
  :host-context([data-atoll-theme="dark"]),
  :host-context([data-bs-theme="dark"]),
  [data-atoll-theme="dark"] atoll-checkbox,
  [data-bs-theme="dark"] atoll-checkbox {
    --checkbox-border: var(--atoll-border-subtle, var(--atoll-gray-700, #344054));
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      checked: Boolean,
      disabled: Boolean,
      size: {
        type: Number,
        default: 22
      },
      name: {
        type: String,
        default: 'check'
      },
      label: {
        type: String,
        default: 'Toggle selection'
      }
    },

    style: {
      '--checkbox-size': (s) => (s.size ? `${s.size}px` : '22px'),
      '--atoll-checkbox-size': (s) => (s.size ? `${s.size}px` : '22px')
    },

    getters: {
      isChecked: (state) => Boolean(state.checked),
      isDisabled: (state) => Boolean(state.disabled),
      iconSize: (state) => state.size || 22,
      iconName: (state) => state.name || 'check',
      checkboxAriaLabel: (state) => state.label || 'Toggle selection',
      iconColor: (state) => (state.checked ? '#FFFFFF' : 'transparent')
    },

    client: ({ state, refs, root, observe, signal }) => {
      const checkboxRoot = refs('checkboxRoot')
      const nativeInput = refs('nativeInput')

      root.setAttribute('role', 'checkbox')
      root.setAttribute('aria-checked', state.checked ? 'true' : 'false')
      root.setAttribute('tabindex', state.disabled ? '-1' : '0')
      root.setAttribute('aria-label', state.label || 'Toggle selection')
      if (state.checked) {
        root.setAttribute('checked', '')
      } else {
        root.removeAttribute('checked')
      }
      if (state.disabled) {
        root.setAttribute('aria-disabled', 'true')
        root.setAttribute('disabled', '')
      } else {
        root.removeAttribute('aria-disabled')
        root.removeAttribute('disabled')
      }

      const toggle = () => {
        if (state.disabled) {
          return
        }

        const nextChecked = !Boolean(state.checked)
        state.checked = nextChecked
        root.setAttribute('aria-checked', nextChecked ? 'true' : 'false')
        if (nextChecked) {
          root.setAttribute('checked', '')
        } else {
          root.removeAttribute('checked')
        }

        if (nativeInput) {
          nativeInput.checked = nextChecked
        }

        root.dispatchEvent(new CustomEvent('change', {
          bubbles: true,
          composed: true,
          detail: { checked: nextChecked }
        }))
        root.dispatchEvent(new CustomEvent('input', {
          bubbles: true,
          composed: true,
          detail: { checked: nextChecked }
        }))
      }

      root.addEventListener('click', (e) => {
        if (e.target !== root) {
          return
        }
        e.preventDefault()
        e.stopPropagation()
        toggle()
      }, { signal })

      checkboxRoot.addEventListener('click', (e) => {
        e.preventDefault()
        e.stopPropagation()
        toggle()
      }, { signal })

      root.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault()
          e.stopPropagation()
          toggle()
        }
      }, { signal })

      Object.defineProperty(root, 'checked', {
        get () {
          return Boolean(state.checked)
        },
        set (val) {
          const isChecked = Boolean(val)
          state.checked = isChecked
          root.setAttribute('aria-checked', isChecked ? 'true' : 'false')
          if (isChecked) {
            root.setAttribute('checked', '')
          } else {
            root.removeAttribute('checked')
          }
          if (nativeInput) {
            nativeInput.checked = isChecked
          }
        },
        configurable: true
      })

      Object.defineProperty(root, 'disabled', {
        get () {
          return Boolean(state.disabled)
        },
        set (val) {
          const isDisabled = Boolean(val)
          state.disabled = isDisabled
          root.setAttribute('tabindex', isDisabled ? '-1' : '0')
          if (isDisabled) {
            root.setAttribute('aria-disabled', 'true')
            root.setAttribute('disabled', '')
          } else {
            root.removeAttribute('aria-disabled')
            root.removeAttribute('disabled')
          }
        },
        configurable: true
      })

      root.toggle = toggle

      observe('checked', (val) => {
        const isChecked = val === 'true' || val === true || val === ''
        root.setAttribute('aria-checked', isChecked ? 'true' : 'false')
        if (isChecked) {
          root.setAttribute('checked', '')
        } else {
          root.removeAttribute('checked')
        }
        if (nativeInput) {
          nativeInput.checked = isChecked
        }
      })

      observe('disabled', (val) => {
        const isDisabled = val === 'true' || val === true || val === ''
        root.setAttribute('tabindex', isDisabled ? '-1' : '0')
        if (isDisabled) {
          root.setAttribute('aria-disabled', 'true')
          root.setAttribute('disabled', '')
        } else {
          root.removeAttribute('aria-disabled')
          root.removeAttribute('disabled')
        }
      })

      observe('label', (val) => {
        root.setAttribute('aria-label', val || 'Toggle selection')
      })
    }
  })
</script>
