<template id="atoll-accordion-item">
  <div class="atoll-accordion-item">
    <!-- Accordion Header -->
    <div 
      ref="headerElement"
      class="atoll-accordion-item-header d-flex align-items-center justify-content-between"
      role="button"
      tabindex="0"
      aria-expanded="{{ isAriaExpanded }}"
    >
      <div class="atoll-accordion-item-header-left d-flex align-items-center">
        <!-- Optional Left Icon Slot -->
        <slot name="icon"></slot>

        <!-- Title & Count Badge -->
        <span class="atoll-accordion-item-title-text fw-bold">{{ title }}</span>
        
        <!-- Accordion adjacent badge count Slot -->
        <slot name="badge"></slot>
      </div>

      <div class="atoll-accordion-item-header-right d-flex align-items-center">
        <!-- Right side extra actions / text slots if any -->
        <slot name="trailing"></slot>

        <!-- Dynamic Chevron -->
        <span class="atoll-accordion-item-chevron d-flex align-items-center justify-content-center">
          <atoll-icon name="chevron-down" size="18"></atoll-icon>
        </span>
      </div>
    </div>

    <!-- Accordion Body Content Wrapper -->
    <div class="atoll-accordion-item-body collapse {{ showBodyClass }}">
      <div class="atoll-accordion-item-content">
        <slot></slot>
      </div>
    </div>
  </div>
</template>

<style>
  :host {
    display: block;
    --atoll-accordion-border: var(--atoll-border-subtle, #EFEFEF);
    --atoll-accordion-bg: var(--atoll-bg-surface-primary, #FFFFFF);
    --atoll-accordion-header-hover-bg: var(--atoll-bg-surface-secondary, #F5F5F5);
    --atoll-accordion-title-color: var(--atoll-text-primary, #111111);
    --atoll-accordion-badge-color: var(--atoll-badge-success, #047835);
  }

  [data-atoll-theme="dark"] :host,
  [data-bs-theme="dark"] :host {
    --atoll-accordion-border: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.1));
    --atoll-accordion-bg: var(--atoll-bg-surface-primary, #161616);
    --atoll-accordion-header-hover-bg: var(--atoll-bg-surface-secondary, #1F1F1F);
    --atoll-accordion-title-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-accordion-badge-color: var(--atoll-badge-success-dark, #22C55E);
  }

  .atoll-accordion-item {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--atoll-accordion-border);
    background-color: var(--atoll-accordion-bg);

    &:last-child {
      border-bottom: none;
    }
  }

  .atoll-accordion-item-header {
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s ease-in-out;

    &:hover {
      background-color: var(--atoll-accordion-header-hover-bg);
    }

    &:focus-visible {
      outline: 2px solid var(--atoll-brand-primary, #06C755);
      outline-offset: -2px;
    }
  }

  ::slotted([slot="icon"]),
  .atoll-accordion-item-icon-wrapper {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    color: var(--atoll-text-secondary, #111111);
  }

  .atoll-accordion-item-title-text {
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-accordion-title-color);
  }

  ::slotted([slot="badge"]),
  .atoll-accordion-item-badge {
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-accordion-badge-color);
    margin-left: 8px;
  }

  ::slotted([slot="trailing"]) {
    display: inline-flex;
    align-items: center;
    margin-right: 8px;
  }

  .atoll-accordion-item-chevron {
    color: var(--atoll-text-secondary, #B0B0B0);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .atoll-accordion-item-header[aria-expanded="true"] .atoll-accordion-item-chevron {
    transform: rotate(180deg);
  }

  .atoll-accordion-item-body {
    transition: height 0.2s ease-in-out;

    &.collapse:not(.show) {
      display: none;
    }
  }

  .atoll-accordion-item-content {
    background-color: var(--atoll-accordion-bg);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      icon: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      expanded: {
        type: Boolean,
        default: false
      }
    },

    slots: {
      icon (nodes, { state, observe }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }

        const renderIcon = () => {
          if (state.icon) {
            const wrapper = document.createElement('span')
            wrapper.className = 'atoll-accordion-item-icon-wrapper'

            const iconEl = document.createElement('atoll-icon')
            iconEl.setAttribute('name', state.icon)
            iconEl.setAttribute('size', '20')
            wrapper.appendChild(iconEl)

            return [wrapper]
          }
          return null
        }

        if (observe) {
          observe('icon', renderIcon)
        }

        return renderIcon()
      },

      badge (nodes, { state, observe }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }

        const renderBadge = () => {
          if (state.badge) {
            const badgeEl = document.createElement('span')
            badgeEl.className = 'atoll-accordion-item-badge fw-bold ms-2'
            badgeEl.textContent = state.badge
            return [badgeEl]
          }
          return null
        }

        if (observe) {
          observe('badge', renderBadge)
        }

        return renderBadge()
      }
    },

    getters: {
      isAriaExpanded: ({ state }) => (state.expanded ? 'true' : 'false'),
      showBodyClass: ({ state }) => (state.expanded ? 'show' : '')
    },

    client: ({ state, refs, root, emit, signal }) => {
      const header = refs('headerElement')

      const toggle = () => {
        state.expanded = !state.expanded

        // Dispatch events for coordinate triggers or E2E assertions
        emit('atoll-accordion-item-toggle', { expanded: state.expanded })

        // Compatibility event to match old room-details-sidebar/atoll-header-toggle expectations
        emit('atoll-header-toggle', { expanded: state.expanded })
      }

      header?.addEventListener('click', toggle, { signal })

      header?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          toggle()
        }
      }, { signal })

      // Host delegation methods
      root.toggle = toggle
      root.click = () => header?.click()
      root.focus = () => header?.focus()
      root.blur = () => header?.blur()
    }
  })
</script>
