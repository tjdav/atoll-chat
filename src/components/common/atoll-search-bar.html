<template id="atoll-search-bar">
  <div class="{{ containerClasses }}" role="search">
    <!-- Pill Field Box -->
    <div class="atoll-search-bar-field">
      <!-- Leading Search Icon -->
      <span class="atoll-search-bar-icon">
        <atoll-icon name="search" size="{{ iconSize }}"></atoll-icon>
      </span>

      <!-- Native Search Input -->
      <input 
        ref="input"
        id="{{ ref_input }}"
        type="search" 
        value="{{ value }}"
        placeholder="{{ placeholder }}"
        disabled="{{ disabled }}"
        readonly="{{ readonly }}"
        aria-label="{{ computedAriaLabel }}"
        class="atoll-search-bar-input"
      />

      <!-- Action Area: Clear (X) Button -->
      <div class="atoll-search-bar-actions">
        <button 
          ref="clearBtn"
          type="button" 
          class="atoll-search-bar-clear" 
          aria-label="Clear search"
          hidden="{{ hideClearBtn }}"
          tabindex="{{ clearBtnTabIndex }}"
          disabled="{{ disabled }}"
        >
          <atoll-icon name="close" size="16"></atoll-icon>
        </button>
      </div>
    </div>

    <!-- Optional Cancel CTA Trigger -->
    <div class="atoll-search-bar-cancel" hidden="{{ hideCancelBtn }}">
      <atoll-button 
        ref="cancelBtn" 
        variant="ghost" 
        size="sm"
        disabled="{{ disabled }}"
        tabindex="{{ cancelBtnTabIndex }}"
      >
        {{ cancelText }}
      </atoll-button>
    </div>
  </div>
</template>

<style>

    display: block;
    width: 100%;
  }

  :host([hidden]) {
    display: none !important;
  }

  .atoll-search-bar-container {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    box-sizing: border-box;

    --atoll-search-height-sm: 32px;
    --atoll-search-height-md: 38px;
    --atoll-search-height-lg: 44px;
    --atoll-search-height: var(--atoll-search-height-md);

    --atoll-search-bg: var(--atoll-input-bg, var(--atoll-bg-surface-secondary, #F5F5F5));
    --atoll-search-bg-focus: var(--atoll-input-bg, var(--atoll-bg-surface-primary, #FFFFFF));
    --atoll-search-text: var(--atoll-text-primary, #111111);
    --atoll-search-placeholder: var(--atoll-text-tertiary, #949494);
    --atoll-search-border: var(--atoll-border-subtle, transparent);
    --atoll-search-border-focus: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
  }

  .atoll-search-bar-container.disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  .atoll-search-bar-field {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 8px;
    height: var(--atoll-search-height);
    padding: 0 14px;
    background-color: var(--atoll-search-bg);
    border: 1px solid var(--atoll-search-border);
    border-radius: 9999px;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }

  .atoll-search-bar-field:focus-within {
    background-color: var(--atoll-search-bg-focus);
    border-color: var(--atoll-search-border-focus);
    box-shadow: 0 0 0 0.25rem color-mix(in srgb, var(--atoll-primary, #06C755) 20%, transparent);
  }

  .atoll-search-bar-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--atoll-text-secondary, #666666);
    flex-shrink: 0;
  }

  .atoll-search-bar-input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;

    font-family: inherit;

  .atoll-search-bar-input::placeholder {

  .atoll-search-bar-input::-webkit-search-decoration,
  .atoll-search-bar-input::-webkit-search-cancel-button,
  .atoll-search-bar-input::-webkit-search-results-button,
  .atoll-search-bar-input::-webkit-search-results-decoration {

  .atoll-search-bar-sm .atoll-search-bar-field {

  :host-context([data-atoll-theme="dark"]) .atoll-search-bar-container,
  :host-context([data-bs-theme="dark"]) .atoll-search-bar-container,
  [data-atoll-theme="dark"] .atoll-search-bar-container,
  [data-bs-theme="dark"] .atoll-search-bar-container {
    --atoll-search-bg: var(--atoll-input-bg, var(--atoll-bg-surface-tertiary, #1F1F1F));
    --atoll-search-bg-focus: var(--atoll-input-bg, var(--atoll-bg-surface-secondary, #161616));
    --atoll-search-text: var(--atoll-text-primary, #FFFFFF);
    --atoll-search-placeholder: var(--atoll-text-tertiary, #949494);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-search-bar-clear:hover,
  :host-context([data-bs-theme="dark"]) .atoll-search-bar-clear:hover,
  [data-atoll-theme="dark"] .atoll-search-bar-clear:hover,
  [data-bs-theme="dark"] .atoll-search-bar-clear:hover {
    color: var(--atoll-text-primary, #FFFFFF);
    background-color: rgba(255, 255, 255, 0.12);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      value: {
        type: String,
        default: ''
      },
      placeholder: {
        type: String,
        default: 'Search'
      },
      cancelText: {
        type: String,
        default: 'Cancel'
      },
      size: {
        type: String,
        // 'sm' | 'md' | 'lg'
        default: 'md'
      },
      disabled: Boolean,
      readonly: Boolean,
      showCancel: Boolean,
      isFocused: Boolean
    },

    getters: {
      computedAriaLabel: (state) => state.placeholder || 'Search',

      iconSize: (state) => {
        if (state.size === 'sm') {
          return '16'
        }
        if (state.size === 'lg') {
          return '24'
        }
        return '20'
      },

      hideClearBtn: (state) => !state.value || state.disabled || state.readonly,

      hideCancelBtn: (state) => {
        if (!state.showCancel || state.disabled) {
          return true
        }
        return !state.isFocused && !state.value
      },

      clearBtnTabIndex: (state) => {
        return state.disabled ? '-1' : '0'
      },

      cancelBtnTabIndex: (state) => {
        return state.disabled ? '-1' : '0'
      },

      containerClasses: (state) => {
        const classes = ['atoll-search-bar-container']

        if (state.size) {
          classes.push(`atoll-search-bar-${state.size}`)
        } else {
          classes.push('atoll-search-bar-md')
        }

        if (state.isFocused) {
          classes.push('atoll-search-bar-active')
        }
        if (state.disabled) {
          classes.push('disabled')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe, signal }) => {
      const input = refs('input')
      const clearBtn = refs('clearBtn')
      const cancelBtn = refs('cancelBtn')

      // Forward data-testid from host to the nested native input, preserving across reconnects
      const testId = root.getAttribute('data-testid') || root.__testId
      if (testId) {
        root.__testId = testId
        input.setAttribute('data-testid', testId)
        root.removeAttribute('data-testid')
      }

      const dispatchEvents = (eventName) => {
        root.dispatchEvent(new Event(eventName, {
          bubbles: true,
          composed: true
        }))
      }

      // Input Focus and Blur Observers
      input.addEventListener('focus', () => {
        state.isFocused = true
      }, { signal })

      input.addEventListener('blur', () => {
        state.isFocused = false
      }, { signal })

      input.addEventListener('input', () => {
        state.value = input.value
        dispatchEvents('input')
        dispatchEvents('change')
      }, { signal })

      // Prevent native search event from bubbling and conflicting
      input.addEventListener('search', (event) => {
        event.stopPropagation()
      }, { signal })

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault()
          root.dispatchEvent(
            new CustomEvent('search', {
              bubbles: true,
              composed: true,
              detail: { value: state.value }
            })
          )
        } else if (event.key === 'Escape') {
          if (state.value) {
            state.value = ''
            input.value = ''
            dispatchEvents('input')
            dispatchEvents('change')
          } else {
            input.blur()
          }
        }
      }, { signal })

      // Clear Button Trigger Handler (Touch-safe using pointerdown/mousedown with preventDefault)
      const handleClear = (event) => {
        // Prevents input blur on tap
        event.preventDefault()
        state.value = ''
        if (input) {
          input.value = ''
          input.focus()
        }
        dispatchEvents('input')
        dispatchEvents('change')
      }
      clearBtn.addEventListener('pointerdown', handleClear, { signal })
      clearBtn.addEventListener('mousedown', handleClear, { signal })

      // Cancel Button Handler
      cancelBtn.addEventListener('click', () => {
        state.value = ''
        state.isFocused = false
        if (input) {
          input.value = ''
          input.blur()
        }

        dispatchEvents('input')
        dispatchEvents('change')

        root.dispatchEvent(
          new CustomEvent('cancel', {
            bubbles: true,
            composed: true
          })
        )
      }, { signal })

      // Programmatic External Sync for value property/attribute
      observe('value', (newVal) => {
        if (input && input.value !== (newVal || '')) {
          input.value = newVal || ''
        }
      })

      // Expose helper methods directly on host element
      root.focus = () => input?.focus()
      root.blur = () => input?.blur()
      root.clear = () => {
        state.value = ''
        if (input) {
          input.value = ''
        }
        dispatchEvents('input')
        dispatchEvents('change')
      }

      // Define property descriptor for bidirectional sync
      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (newVal) {
          state.value = newVal || ''
        },
        configurable: true
      })
    }
  })
</script>
