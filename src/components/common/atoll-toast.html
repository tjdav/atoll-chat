<template id="atoll-toast">
  <div 
    ref="popoverContainer" 
    popover="manual" 
    class="atoll-toast-container"
    data-has-toasts="{{ hasActiveToasts }}"
  >
    <!-- Dynamic Toast Cards Stack Container -->
    <div ref="stackHost" class="atoll-toast-stack"></div>
  </div>
</template>

<style>
  :host {
    display: contents !important;
  }

  .atoll-toast-container {
    position: fixed;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    overflow: visible;
    z-index: 1200;
    pointer-events: none;
  }

  .atoll-toast-container:popover-open {
    display: block;
  }

  /* Placement Anchors */
  :host([placement="bottom-start"]) .atoll-toast-container,
  :host .atoll-toast-container {
    bottom: 24px;
    left: 24px;
    right: auto;
    top: auto;
  }

  :host([placement="bottom-center"]) .atoll-toast-container {
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    top: auto;
  }

  :host([placement="bottom-end"]) .atoll-toast-container {
    bottom: 24px;
    right: 24px;
    left: auto;
    top: auto;
  }

  :host([placement="top-center"]) .atoll-toast-container {
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    bottom: auto;
    right: auto;
  }

  :host([placement="top-end"]) .atoll-toast-container {
    top: 24px;
    right: 24px;
    left: auto;
    bottom: auto;
  }

  @media (max-width: 767.98px) {
    :host([placement="bottom-start"]) .atoll-toast-container,
    :host([placement="bottom-center"]) .atoll-toast-container,
    :host([placement="bottom-end"]) .atoll-toast-container,
    :host .atoll-toast-container {
      bottom: calc(var(--atoll-bottom-nav-height, 64px) + 16px);
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
    }
  }

  .atoll-toast-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  /* Toast Card Surface */
  .atoll-toast-card {
    position: relative;
    pointer-events: auto;
    width: min(380px, calc(100vw - 32px));
    padding: 12px 16px;
    border-radius: var(--atoll-radius-md, 12px);
    background-color: var(--atoll-bg-surface-primary, #ffffff);
    border: 1px solid var(--atoll-border-subtle, rgba(0, 0, 0, 0.08));
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    color: var(--atoll-text-primary, #111111);
    overflow: hidden;
    outline: none;

    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }

  .atoll-toast-card.atoll-toast-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .atoll-toast-card.atoll-toast-closing {
    opacity: 0 !important;
    transform: translateY(10px) scale(0.96) !important;
    transition: opacity 150ms cubic-bezier(0.4, 0, 1, 1),
                transform 150ms cubic-bezier(0.4, 0, 1, 1) !important;
  }

  /* Variant Accent Color Mapping */
  .atoll-toast-card[data-variant="success"], .atoll-toast-card-success {
    --toast-accent: var(--atoll-success, #06C755);
  }

  .atoll-toast-card[data-variant="danger"], .atoll-toast-card-danger {
    --toast-accent: var(--atoll-danger, #FF334B);
  }

  .atoll-toast-card[data-variant="warning"], .atoll-toast-card-warning {
    --toast-accent: var(--atoll-warning, #FF9500);
  }

  .atoll-toast-card[data-variant="info"], .atoll-toast-card-info,
  .atoll-toast-card[data-variant="primary"], .atoll-toast-card-primary {
    --toast-accent: var(--atoll-info, #007AFF);
  }

  .atoll-toast-card[data-variant="secondary"], .atoll-toast-card-secondary {
    --toast-accent: var(--atoll-text-muted, #8E8E93);
  }

  .atoll-toast-body {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .atoll-toast-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--toast-accent, var(--atoll-info, #007AFF));
  }

  .atoll-toast-message {
    flex-grow: 1;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--atoll-text-primary, #111111);
    word-break: break-word;
  }

  .atoll-toast-action-btn {
    color: var(--toast-accent, var(--atoll-accent, #06C755)) !important;
  }

  /* Countdown Progress Bar */
  .atoll-toast-progress-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    overflow: hidden;
    background-color: rgba(0, 0, 0, 0.06);
    border-bottom-left-radius: var(--atoll-radius-md, 12px);
    border-bottom-right-radius: var(--atoll-radius-md, 12px);
  }

  .atoll-toast-progress-bar {
    height: 100%;
    width: 100%;
    background-color: var(--toast-accent, var(--atoll-accent, #06C755));
    transform-origin: left center;
    animation: atoll-toast-shrink linear forwards;
  }

  .atoll-toast-paused .atoll-toast-progress-bar {
    animation-play-state: paused !important;
  }

  @keyframes atoll-toast-shrink {
    from {
      transform: scaleX(1);
    }
    to {
      transform: scaleX(0);
    }
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-card,
  :host-context([data-bs-theme="dark"]) .atoll-toast-card,
  [data-atoll-theme="dark"] .atoll-toast-card,
  [data-bs-theme="dark"] .atoll-toast-card {
    background-color: #1f1f1f;
    border-color: rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.2);
    color: #ffffff;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-message,
  :host-context([data-bs-theme="dark"]) .atoll-toast-message,
  [data-atoll-theme="dark"] .atoll-toast-message,
  [data-bs-theme="dark"] .atoll-toast-message {
    color: #ffffff;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-progress-wrapper,
  :host-context([data-bs-theme="dark"]) .atoll-toast-progress-wrapper,
  [data-atoll-theme="dark"] .atoll-toast-progress-wrapper,
  [data-bs-theme="dark"] .atoll-toast-progress-wrapper {
    background-color: rgba(255, 255, 255, 0.1);
  }

  @media (prefers-reduced-motion: reduce) {
    .atoll-toast-card {
      transition: none !important;
      transform: none !important;
      opacity: 1 !important;
    }

    .atoll-toast-progress-bar {
      animation: none !important;
    }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      placement: {
        type: String,
        default: 'bottom-start',
        values: ['bottom-start', 'bottom-center', 'bottom-end', 'top-center', 'top-end']
      },
      maxToasts: {
        type: Number,
        default: 3
      },
      duration: {
        type: Number,
        default: 4000
      }
    },

    getters: {
      hasActiveToasts: (state) => Boolean(state.toasts && state.toasts.length > 0)
    },

    client: ({ state, refs, root, signal, eventBus }) => {
      const popoverContainer = refs('popoverContainer')
      const stackHost = refs('stackHost')
      const { $bus } = eventBus || {}

      state.toasts = []
      const toastEntries = new Map()
      let nextId = 1

      const resolveIconName = (variant, customIcon) => {
        if (customIcon) return customIcon
        switch (variant) {
          case 'success': return 'check-circle'
          case 'danger': return 'alert-circle'
          case 'warning': return 'alert-triangle'
          case 'info':
          case 'primary':
          case 'secondary':
          default: return 'info'
        }
      }

      const ensurePopoverVisible = () => {
        if (popoverContainer && typeof popoverContainer.showPopover === 'function') {
          try { popoverContainer.showPopover() } catch {}
        }
      }

      const ensurePopoverHidden = () => {
        if (state.toasts.length === 0 && popoverContainer && typeof popoverContainer.hidePopover === 'function') {
          try { popoverContainer.hidePopover() } catch {}
        }
      }

      const hideToast = (id) => {
        state.toasts = state.toasts.filter(t => t.id !== id)
        const entry = toastEntries.get(id)
        if (!entry || entry.isClosing) {
          ensurePopoverHidden()
          return
        }

        entry.isClosing = true
        if (entry.timerId) {
          clearTimeout(entry.timerId)
          entry.timerId = null
        }

        const { cardEl } = entry
        cardEl.classList.remove('atoll-toast-visible')
        cardEl.classList.add('atoll-toast-closing')

        const removeCard = () => {
          if (cardEl.parentNode) {
            cardEl.parentNode.removeChild(cardEl)
          }
          toastEntries.delete(id)
          ensurePopoverHidden()
        }

        let transitioned = false
        const handleTransitionEnd = (e) => {
          if (e.target === cardEl) {
            transitioned = true
            cardEl.removeEventListener('transitionend', handleTransitionEnd)
            removeCard()
          }
        }
        cardEl.addEventListener('transitionend', handleTransitionEnd, { signal })
        setTimeout(() => {
          if (!transitioned) removeCard()
        }, 180)
      }

      const clearAll = () => {
        toastEntries.forEach((entry) => {
          if (entry.timerId) clearTimeout(entry.timerId)
          if (entry.cardEl.parentNode) entry.cardEl.parentNode.removeChild(entry.cardEl)
        })
        toastEntries.clear()
        state.toasts = []
        ensurePopoverHidden()
      }

      const pauseTimer = (entry) => {
        if (!entry || entry.remainingTime <= 0 || entry.isPaused) return
        if (entry.timerId) {
          clearTimeout(entry.timerId)
          entry.timerId = null
        }
        const elapsed = Date.now() - entry.startTime
        entry.remainingTime = Math.max(0, entry.remainingTime - elapsed)
        entry.isPaused = true
        entry.cardEl.classList.add('atoll-toast-paused')
        if (entry.progressBarEl) entry.progressBarEl.style.animationPlayState = 'paused'
      }

      const resumeTimer = (entry) => {
        if (!entry || entry.remainingTime <= 0 || !entry.isPaused) return
        entry.isPaused = false
        entry.startTime = Date.now()
        entry.cardEl.classList.remove('atoll-toast-paused')
        if (entry.progressBarEl) entry.progressBarEl.style.animationPlayState = 'running'
        entry.timerId = setTimeout(() => hideToast(entry.toast.id), entry.remainingTime)
      }

      const showToast = (options) => {
        const toastObj = typeof options === 'string' ? { message: options } : { ...options }
        const id = toastObj.id || `toast-${nextId++}`
        const variant = toastObj.variant || toastObj.type || 'primary'
        const duration = typeof toastObj.duration === 'number' ? toastObj.duration : state.duration
        const message = toastObj.message || ''
        const action = toastObj.action || null
        const dismissible = toastObj.dismissible !== false
        const iconName = resolveIconName(variant, toastObj.icon)

        const toast = { id, variant, duration, message, action, icon: iconName, dismissible }

        const maxCapacity = state.maxToasts || 3
        while (state.toasts.length >= maxCapacity) {
          const oldest = state.toasts[0]
          hideToast(oldest.id)
        }

        ensurePopoverVisible()

        const card = document.createElement('div')
        card.className = `atoll-toast-card atoll-toast-card-${variant}`
        card.dataset.toastId = String(id)
        card.dataset.variant = variant

        if (variant === 'danger' || variant === 'warning') {
          card.setAttribute('role', 'alert')
          card.setAttribute('aria-live', 'assertive')
        } else {
          card.setAttribute('role', 'status')
          card.setAttribute('aria-live', 'polite')
        }
        card.setAttribute('aria-atomic', 'true')
        card.setAttribute('tabindex', '0')

        const bodyWrapper = document.createElement('div')
        bodyWrapper.className = 'atoll-toast-body'

        const iconWrapper = document.createElement('div')
        iconWrapper.className = 'atoll-toast-icon'
        const iconEl = document.createElement('atoll-icon')
        iconEl.setAttribute('name', iconName)
        iconEl.setAttribute('size', '20')
        iconWrapper.appendChild(iconEl)
        bodyWrapper.appendChild(iconWrapper)

        const msgEl = document.createElement('div')
        msgEl.className = 'atoll-toast-message'
        msgEl.textContent = message
        bodyWrapper.appendChild(msgEl)

        if (action && action.label) {
          const actionBtn = document.createElement('atoll-button')
          actionBtn.setAttribute('variant', 'ghost')
          actionBtn.setAttribute('size', 'sm')
          actionBtn.setAttribute('pill', 'true')
          actionBtn.className = 'atoll-toast-action-btn'
          actionBtn.textContent = action.label
          actionBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            if (typeof action.onClick === 'function') action.onClick(toast)
            hideToast(id)
          }, { signal })
          bodyWrapper.appendChild(actionBtn)
        }

        if (dismissible) {
          const closeBtn = document.createElement('atoll-button')
          closeBtn.setAttribute('variant', 'ghost')
          closeBtn.setAttribute('size', 'sm')
          closeBtn.setAttribute('icon-only', 'true')
          closeBtn.setAttribute('pill', 'true')
          closeBtn.setAttribute('aria-label', 'Dismiss notification')
          const closeIcon = document.createElement('atoll-icon')
          closeIcon.setAttribute('name', 'close')
          closeIcon.setAttribute('size', '14')
          closeBtn.appendChild(closeIcon)
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            hideToast(id)
          }, { signal })
          bodyWrapper.appendChild(closeBtn)
        }

        card.appendChild(bodyWrapper)

        let progressBarEl = null
        if (duration > 0 && Number.isFinite(duration)) {
          const progressWrapper = document.createElement('div')
          progressWrapper.className = 'atoll-toast-progress-wrapper'
          progressBarEl = document.createElement('div')
          progressBarEl.className = 'atoll-toast-progress-bar'
          progressBarEl.style.animationDuration = `${duration}ms`
          progressWrapper.appendChild(progressBarEl)
          card.appendChild(progressWrapper)
        }

        // Mouse, Focus, and Touch Pause/Resume Handlers
        card.addEventListener('mouseenter', () => {
          const entry = toastEntries.get(id)
          if (entry) pauseTimer(entry)
        }, { signal })

        card.addEventListener('mouseleave', () => {
          const entry = toastEntries.get(id)
          if (entry) resumeTimer(entry)
        }, { signal })

        card.addEventListener('focusin', () => {
          const entry = toastEntries.get(id)
          if (entry) pauseTimer(entry)
        }, { signal })

        card.addEventListener('focusout', () => {
          const entry = toastEntries.get(id)
          if (entry) resumeTimer(entry)
        }, { signal })

        card.addEventListener('touchstart', () => {
          const entry = toastEntries.get(id)
          if (entry) pauseTimer(entry)
        }, { signal, passive: true })

        card.addEventListener('touchend', () => {
          const entry = toastEntries.get(id)
          if (entry) resumeTimer(entry)
        }, { signal, passive: true })

        stackHost.appendChild(card)

        requestAnimationFrame(() => {
          card.classList.add('atoll-toast-visible')
        })

        const entry = {
          toast,
          cardEl: card,
          progressBarEl,
          timerId: null,
          startTime: Date.now(),
          remainingTime: duration > 0 && Number.isFinite(duration) ? duration : 0,
          isPaused: false,
          isClosing: false
        }

        if (duration > 0 && Number.isFinite(duration)) {
          entry.timerId = setTimeout(() => hideToast(id), duration)
        }

        toastEntries.set(id, entry)
        state.toasts = [...state.toasts, toast]

        return id
      }

      if ($bus) {
        $bus.on('ui:show_toast', (payload) => {
          showToast(payload)
        })
      }

      popoverContainer.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.toasts.length > 0) {
          const lastToast = state.toasts[state.toasts.length - 1]
          if (lastToast) hideToast(lastToast.id)
        }
      }, { signal })

      root.show = showToast
      root.toast = showToast
      root.hide = hideToast
      root.clear = clearAll

      signal.addEventListener('abort', () => {
        clearAll()
      })
    }
  })
</script>
