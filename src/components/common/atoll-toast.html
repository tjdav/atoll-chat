<template id="atoll-toast">
  <div 
    ref="popoverContainer" 
    popover="manual" 
    class="{{ popoverContainerClasses }}"
    data-has-toasts="{{ hasActiveToasts }}"
  >
    <!-- Dynamic Toast Cards Stack Container -->
    <div ref="stackHost" class="atoll-toast-stack"></div>
  </div>
</template>

<style>
  :host {
    display: contents !important;
  }

  .atoll-toast-container {
    position: fixed;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    overflow: visible;
    z-index: 1200;
    pointer-events: none;
  }

  .atoll-toast-container:popover-open {
    display: block;
  }

  .atoll-toast-container.placement-bottom-start {
    bottom: 24px;
    left: 24px;
    right: auto;
    top: auto;
  }

  .atoll-toast-container.placement-bottom-center {
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    top: auto;
  }

  .atoll-toast-container.placement-bottom-end {
    bottom: 24px;
    right: 24px;
    left: auto;
    top: auto;
  }

  .atoll-toast-container.placement-top-center {
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    bottom: auto;
    right: auto;
  }

  .atoll-toast-container.placement-top-end {
    top: 24px;
    right: 24px;
    left: auto;
    bottom: auto;
  }

  @media (max-width: 767.98px) {
    .atoll-toast-container.placement-bottom-start,
    .atoll-toast-container.placement-bottom-center,
    .atoll-toast-container.placement-bottom-end {
      bottom: calc(var(--atoll-bottom-nav-height, 64px) + 16px);
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
    }
  }

  .atoll-toast-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .atoll-toast-card {
    position: relative;
    pointer-events: auto;
    width: min(380px, calc(100vw - 32px));
    padding: 12px 16px;
    border-radius: var(--atoll-radius-md, 12px);
    background-color: var(--atoll-bg-surface-primary, #ffffff);
    border: 1px solid var(--atoll-border-subtle, rgba(0, 0, 0, 0.08));
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    color: var(--atoll-text-primary, #111111);
    overflow: hidden;
    outline: none;

    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }

  .atoll-toast-card.atoll-toast-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .atoll-toast-card.atoll-toast-closing {
    opacity: 0 !important;
    transform: translateY(10px) scale(0.96) !important;
    transition: opacity 150ms cubic-bezier(0.4, 0, 1, 1),
                transform 150ms cubic-bezier(0.4, 0, 1, 1) !important;
  }

  .atoll-toast-card-success {
    --toast-accent-color: var(--atoll-success, #06C755);
  }

  .atoll-toast-card-success .atoll-toast-icon {
    color: var(--atoll-success, #06C755);
  }

  .atoll-toast-card-danger {
    --toast-accent-color: var(--atoll-danger, #FF334B);
  }

  .atoll-toast-card-danger .atoll-toast-icon {
    color: var(--atoll-danger, #FF334B);
  }

  .atoll-toast-card-warning {
    --toast-accent-color: var(--atoll-warning, #FF9500);
  }

  .atoll-toast-card-warning .atoll-toast-icon {
    color: var(--atoll-warning, #FF9500);
  }

  .atoll-toast-card-info,
  .atoll-toast-card-primary {
    --toast-accent-color: var(--atoll-info, #007AFF);
  }

  .atoll-toast-card-info .atoll-toast-icon,
  .atoll-toast-card-primary .atoll-toast-icon {
    color: var(--atoll-info, #007AFF);
  }

  .atoll-toast-card-secondary {
    --toast-accent-color: var(--atoll-text-muted, #8E8E93);
  }

  .atoll-toast-card-secondary .atoll-toast-icon {
    color: var(--atoll-text-muted, #8E8E93);
  }

  .atoll-toast-body {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .atoll-toast-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .atoll-toast-message {
    flex-grow: 1;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--atoll-text-primary, #111111);
    word-break: break-word;
  }

  .atoll-toast-action-btn {
    background: transparent;
    border: none;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--toast-accent-color, var(--atoll-accent, #06C755));
    cursor: pointer;
    border-radius: 6px;
    flex-shrink: 0;
    transition: background-color 150ms ease;
  }

  .atoll-toast-action-btn:hover {
    background-color: rgba(0, 0, 0, 0.05);
  }

  .atoll-toast-action-btn:focus-visible {
    outline: 2px solid var(--toast-accent-color, var(--atoll-accent, #06C755));
    outline-offset: 1px;
  }

  .atoll-toast-close-btn {
    background: transparent;
    border: none;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--atoll-text-muted, #8E8E93);
    cursor: pointer;
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.7;
    transition: opacity 150ms ease, background-color 150ms ease;
  }

  .atoll-toast-close-btn:hover {
    opacity: 1;
    background-color: rgba(0, 0, 0, 0.05);
  }

  .atoll-toast-close-btn:focus-visible {
    outline: 2px solid var(--atoll-text-muted, #8E8E93);
    outline-offset: 1px;
  }

  .atoll-toast-progress-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    overflow: hidden;
    background-color: rgba(0, 0, 0, 0.06);
    border-bottom-left-radius: var(--atoll-radius-md, 12px);
    border-bottom-right-radius: var(--atoll-radius-md, 12px);
  }

  .atoll-toast-progress-bar {
    height: 100%;
    width: 100%;
    background-color: var(--toast-accent-color, var(--atoll-accent, #06C755));
    transform-origin: left center;
    animation: atoll-toast-shrink linear forwards;
  }

  .atoll-toast-paused .atoll-toast-progress-bar {
    animation-play-state: paused !important;
  }

  @keyframes atoll-toast-shrink {
    from {
      transform: scaleX(1);
    }
    to {
      transform: scaleX(0);
    }
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-card,
  :host-context([data-bs-theme="dark"]) .atoll-toast-card,
  [data-atoll-theme="dark"] .atoll-toast-card,
  [data-bs-theme="dark"] .atoll-toast-card {
    background-color: #1f1f1f;
    border-color: rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.2);
    color: #ffffff;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-message,
  :host-context([data-bs-theme="dark"]) .atoll-toast-message,
  [data-atoll-theme="dark"] .atoll-toast-message,
  [data-bs-theme="dark"] .atoll-toast-message {
    color: #ffffff;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-action-btn:hover,
  :host-context([data-bs-theme="dark"]) .atoll-toast-action-btn:hover,
  [data-atoll-theme="dark"] .atoll-toast-action-btn:hover,
  [data-bs-theme="dark"] .atoll-toast-action-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-close-btn,
  :host-context([data-bs-theme="dark"]) .atoll-toast-close-btn,
  [data-atoll-theme="dark"] .atoll-toast-close-btn,
  [data-bs-theme="dark"] .atoll-toast-close-btn {
    color: rgba(255, 255, 255, 0.6);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-close-btn:hover,
  :host-context([data-bs-theme="dark"]) .atoll-toast-close-btn:hover,
  [data-atoll-theme="dark"] .atoll-toast-close-btn:hover,
  [data-bs-theme="dark"] .atoll-toast-close-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-toast-progress-wrapper,
  :host-context([data-bs-theme="dark"]) .atoll-toast-progress-wrapper,
  [data-atoll-theme="dark"] .atoll-toast-progress-wrapper,
  [data-bs-theme="dark"] .atoll-toast-progress-wrapper {
    background-color: rgba(255, 255, 255, 0.1);
  }

  @media (prefers-reduced-motion: reduce) {
    .atoll-toast-card {
      transition: none !important;
      transform: none !important;
      opacity: 1 !important;
    }

    .atoll-toast-progress-bar {
      animation: none !important;
    }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      placement: {
        type: String,
        default: 'bottom-start'
      },
      maxToasts: {
        type: Number,
        default: 3
      },
      duration: {
        type: Number,
        default: 4000
      }
    },

    getters: {
      popoverContainerClasses: (state) => {
        const classes = ['atoll-toast-container']
        const placement = state.placement || 'bottom-start'
        classes.push(`placement-${placement}`)
        return classes.join(' ')
      },
      hasActiveToasts: (state) => Boolean(state.toasts && state.toasts.length > 0)
    },

    client: ({ state, refs, root, signal, eventBus }) => {
      const popoverContainer = refs('popoverContainer')
      const stackHost = refs('stackHost')
      const { $bus } = eventBus || {}

      state.toasts = []
      const toastEntries = new Map()
      let nextId = 1

      /**
       * Resolves icon name per toast variant or explicit override.
       * @param {string} variant
       * @param {string} [customIcon]
       * @returns {string}
       */
      const resolveIconName = (variant, customIcon) => {
        if (customIcon) {
          return customIcon
        }
  
        switch (variant) {
          case 'success': return 'check-circle'
          case 'danger': return 'alert-circle'
          case 'warning': return 'alert-triangle'
          case 'info':
          case 'primary':
          case 'secondary':
          default: return 'info'
        }
      }

      /**
       * Shows the top layer popover container if not currently shown.
       */
      const ensurePopoverVisible = () => {
        if (popoverContainer && typeof popoverContainer.showPopover === 'function') {
          try {
            popoverContainer.showPopover()
          } catch {
            // Safe recovery if popover state is already open or manual fallback
          }
        }
      }

      /**
       * Hides the top layer popover container if stack is empty.
       */
      const ensurePopoverHidden = () => {
        if (state.toasts.length === 0 && popoverContainer && typeof popoverContainer.hidePopover === 'function') {
          try {
            popoverContainer.hidePopover()
          } catch {
            // Safe recovery
          }
        }
      }

      /**
       * Dismisses and removes a toast by ID with a 150ms exit transition.
       * @param {string|number} id
       */
      const hideToast = (id) => {
        state.toasts = state.toasts.filter(t => t.id !== id)
        const entry = toastEntries.get(id)
        if (!entry || entry.isClosing) {
          ensurePopoverHidden()
          return
        }

        entry.isClosing = true
        if (entry.timerId) {
          clearTimeout(entry.timerId)
          entry.timerId = null
        }

        const { cardEl } = entry
        cardEl.classList.remove('atoll-toast-visible')
        cardEl.classList.add('atoll-toast-closing')

        const removeCard = () => {
          if (cardEl.parentNode) {
            cardEl.parentNode.removeChild(cardEl)
          }
          toastEntries.delete(id)
          ensurePopoverHidden()
        }

        // Wait for 150ms transition
        let transitioned = false
        const handleTransitionEnd = (e) => {
          if (e.target === cardEl) {
            transitioned = true
            cardEl.removeEventListener('transitionend', handleTransitionEnd)
            removeCard()
          }
        }
        cardEl.addEventListener('transitionend', handleTransitionEnd, { signal })
        setTimeout(() => {
          if (!transitioned) {
            removeCard()
          }
        }, 180)
      }

      /**
       * Clears all active toasts immediately.
       */
      const clearAll = () => {
        toastEntries.forEach((entry) => {
          if (entry.timerId) {
            clearTimeout(entry.timerId)
          }
          if (entry.cardEl.parentNode) {
            entry.cardEl.parentNode.removeChild(entry.cardEl)
          }
        })
        toastEntries.clear()
        state.toasts = []
        ensurePopoverHidden()
      }

      /**
       * Pauses auto-dismiss countdown for a toast entry.
       * @param {object} entry
       */
      const pauseTimer = (entry) => {
        if (!entry || entry.remainingTime <= 0 || entry.isPaused) {
          return
        }
        if (entry.timerId) {
          clearTimeout(entry.timerId)
          entry.timerId = null
        }
        const elapsed = Date.now() - entry.startTime
        entry.remainingTime = Math.max(0, entry.remainingTime - elapsed)
        entry.isPaused = true
        entry.cardEl.classList.add('atoll-toast-paused')
        if (entry.progressBarEl) {
          entry.progressBarEl.style.animationPlayState = 'paused'
        }
      }

      /**
       * Resumes auto-dismiss countdown for a toast entry.
       * @param {object} entry
       */
      const resumeTimer = (entry) => {
        if (!entry || entry.remainingTime <= 0 || !entry.isPaused) {
          return
        }
        entry.isPaused = false
        entry.startTime = Date.now()
        entry.cardEl.classList.remove('atoll-toast-paused')
        if (entry.progressBarEl) {
          entry.progressBarEl.style.animationPlayState = 'running'
        }
        entry.timerId = setTimeout(() => {
          hideToast(entry.toast.id)
        }, entry.remainingTime)
      }

      /**
       * Adds and displays a new toast notification.
       * @param {object|string} options
       * @returns {string|number} Toast ID
       */
      const showToast = (options) => {
        let toastObj = typeof options === 'string' ? { message: options } : { ...options }

        const id = toastObj.id || `toast-${nextId++}`
        const variant = toastObj.variant || toastObj.type || 'primary'
        const duration = typeof toastObj.duration === 'number' ? toastObj.duration : state.duration
        const message = toastObj.message || ''
        const action = toastObj.action || null
        const iconName = resolveIconName(variant, toastObj.icon)

        const toast = {
          id,
          variant,
          duration,
          message,
          action,
          icon: iconName
        }

        // Enforce max capacity limit (default 3)
        const maxCapacity = state.maxToasts || 3
        while (state.toasts.length >= maxCapacity) {
          const oldest = state.toasts[0]
          hideToast(oldest.id)
        }

        // Ensure Top-Layer Popover container is active
        ensurePopoverVisible()

        // Create Card DOM element
        const card = document.createElement('div')
        card.className = `atoll-toast-card atoll-toast-card-${variant}`
        card.dataset.toastId = String(id)

        // WCAG Live Region & ARIA attributes
        if (variant === 'danger' || variant === 'warning') {
          card.setAttribute('role', 'alert')
          card.setAttribute('aria-live', 'assertive')
        } else {
          card.setAttribute('role', 'status')
          card.setAttribute('aria-live', 'polite')
        }
        card.setAttribute('aria-atomic', 'true')
        card.setAttribute('tabindex', '0')

        // Inner Card HTML Layout
        const bodyWrapper = document.createElement('div')
        bodyWrapper.className = 'atoll-toast-body'

        // Icon
        const iconWrapper = document.createElement('div')
        iconWrapper.className = 'atoll-toast-icon'
        const iconEl = document.createElement('atoll-icon')
        iconEl.setAttribute('name', iconName)
        iconEl.setAttribute('size', '20')
        iconWrapper.appendChild(iconEl)
        bodyWrapper.appendChild(iconWrapper)

        // Message
        const msgEl = document.createElement('div')
        msgEl.className = 'atoll-toast-message'
        msgEl.textContent = message
        bodyWrapper.appendChild(msgEl)

        // Action Button (if present)
        if (action && action.label) {
          const actionBtn = document.createElement('button')
          actionBtn.type = 'button'
          actionBtn.className = 'atoll-toast-action-btn'
          actionBtn.textContent = action.label
          actionBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            if (typeof action.onClick === 'function') {
              action.onClick(toast)
            }
            hideToast(id)
          }, { signal })
          bodyWrapper.appendChild(actionBtn)
        }

        // Close / Dismiss Button
        const closeBtn = document.createElement('button')
        closeBtn.type = 'button'
        closeBtn.className = 'atoll-toast-close-btn'
        closeBtn.setAttribute('aria-label', 'Dismiss notification')
        const closeIcon = document.createElement('atoll-icon')
        closeIcon.setAttribute('name', 'close')
        closeIcon.setAttribute('size', '16')
        closeBtn.appendChild(closeIcon)
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation()
          hideToast(id)
        }, { signal })
        bodyWrapper.appendChild(closeBtn)

        card.appendChild(bodyWrapper)

        // Progress Timer Bar (if duration > 0 and finite)
        let progressBarEl = null
        if (duration > 0 && Number.isFinite(duration)) {
          const progressWrapper = document.createElement('div')
          progressWrapper.className = 'atoll-toast-progress-wrapper'
          progressBarEl = document.createElement('div')
          progressBarEl.className = 'atoll-toast-progress-bar'
          progressBarEl.style.animationDuration = `${duration}ms`
          progressWrapper.appendChild(progressBarEl)
          card.appendChild(progressWrapper)
        }

        // Mouse & Focus Pause / Resume Handlers
        card.addEventListener('mouseenter', () => {
          const entry = toastEntries.get(id)
          if (entry) {
            pauseTimer(entry)
          }
        }, { signal })

        card.addEventListener('mouseleave', () => {
          const entry = toastEntries.get(id)
          if (entry) {
            resumeTimer(entry)
          }
        }, { signal })

        card.addEventListener('focusin', () => {
          const entry = toastEntries.get(id)
          if (entry) {
            pauseTimer(entry)
          }
        }, { signal })

        card.addEventListener('focusout', () => {
          const entry = toastEntries.get(id)
          if (entry) {
            resumeTimer(entry)
          }
        }, { signal })

        // Mount Card in Stack Host
        stackHost.appendChild(card)

        // Trigger 200ms spring enter animation
        requestAnimationFrame(() => {
          card.classList.add('atoll-toast-visible')
        })

        // Timer entry
        const entry = {
          toast,
          cardEl: card,
          progressBarEl,
          timerId: null,
          startTime: Date.now(),
          remainingTime: duration > 0 && Number.isFinite(duration) ? duration : 0,
          isPaused: false,
          isClosing: false
        }

        if (duration > 0 && Number.isFinite(duration)) {
          entry.timerId = setTimeout(() => {
            hideToast(id)
          }, duration)
        }

        toastEntries.set(id, entry)
        state.toasts = [...state.toasts, toast]

        return id
      }

      // EventBus listener
      if ($bus) {
        $bus.on('ui:show_toast', (payload) => {
          showToast(payload)
        })
      }

      // Keyboard Esc handler to close active toast
      popoverContainer.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.toasts.length > 0) {
          const lastToast = state.toasts[state.toasts.length - 1]
          if (lastToast) {
            hideToast(lastToast.id)
          }
        }
      }, { signal })

      // Public Imperative API exposed on component host
      root.show = showToast
      root.toast = showToast
      root.hide = hideToast
      root.clear = clearAll

      // Cleanup on component abort
      signal.addEventListener('abort', () => {
        clearAll()
      })
    }
  })
</script>
