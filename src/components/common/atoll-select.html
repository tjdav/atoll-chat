<template id="atoll-select">
  <details 
    ref="detailsElement"
    open="{{ isOpen }}"
    class="atoll-select {{ dropupClass }}"
  >
    <!-- Hidden Input for Form Submission Integration -->
    <input 
      ref="hiddenInput"
      type="hidden" 
      name="{{ name }}" 
      value="{{ value }}"
    />

    <!-- Summary Toggle Button (role="combobox") -->
    <summary 
      ref="toggleElement"
      class="atoll-select-toggle {{ toggleClasses }}"
      role="combobox"
      aria-haspopup="listbox"
      aria-expanded="{{ isExpanded }}"
      aria-controls="{{ ref_menuElement }}"
      aria-disabled="{{ isDisabled }}"
      aria-label="{{ computedAriaLabel }}"
      tabindex="{{ summaryTabIndex }}"
      data-variant="{{ variant }}"
    >
      <span class="atoll-select-label-group">
        <slot name="leading"></slot>
        <span class="atoll-select-label">{{ selectedLabel }}</span>
      </span>
      <slot name="trailing"></slot>
    </summary>

    <!-- Dropdown / Dropup Options Menu (role="listbox") -->
    <ul 
      ref="menuElement" 
      id="{{ ref_menuElement }}"
      class="atoll-select-menu"
      role="listbox"
      aria-orientation="vertical"
    >
      <slot></slot>
    </ul>
  </details>
</template>

<style>
  :host {
    display: inline-block;
    position: relative;
    width: 100%;
    vertical-align: middle;

    --select-padding-y: 0.5rem;
    --select-padding-x: 0.75rem;
    --select-font-size: var(--atoll-font-size-body-2, 14px);
    --select-radius: var(--atoll-radius-md, 12px);
    --select-bg: var(--atoll-input-bg, var(--atoll-bg-surface-secondary, #F5F5F5));
    --select-color: var(--atoll-text-primary, #111111);
    --select-border: var(--atoll-border-subtle, #E8E8E8);
    --select-focus-border: var(--atoll-primary, #06C755);
    --select-focus-ring: color-mix(in srgb, var(--atoll-primary, #06C755) 20%, transparent);
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([block]) {
    display: block;
    width: 100%;
  }

  /* Size Modifiers */
  :host([size="sm"]) {
    --select-padding-y: 0.25rem;
    --select-padding-x: 0.5rem;
    --select-font-size: 12px;
    --select-radius: var(--atoll-radius-sm, 8px);
  }

  :host([size="lg"]) {
    --select-padding-y: 0.75rem;
    --select-padding-x: 1rem;
    --select-font-size: 16px;
    --select-radius: var(--atoll-radius-lg, 14px);
  }

  .atoll-select {
    display: inline-block;
    position: relative;
    width: 100%;
  }

  /* Strips native <summary> disclosure triangles */
  .atoll-select summary {
    list-style: none;
  }

  .atoll-select summary::-webkit-details-marker {
    display: none;
  }

  /* Variants */
  :host([variant="primary"]) {
    --select-bg: var(--atoll-primary, #06C755);
    --select-color: #FFFFFF;
    --select-border: var(--atoll-primary, #06C755);
  }

  :host([variant="outline"]) {
    --select-bg: transparent;
    --select-border: var(--atoll-border-subtle, #E8E8E8);
  }

  :host([variant="ghost"]) {
    --select-bg: transparent;
    --select-border: transparent;
  }

  :host([variant="danger"]) {
    --select-bg: var(--atoll-danger, #FF3B30);
    --select-color: #FFFFFF;
    --select-border: var(--atoll-danger, #FF3B30);
  }

  /* Summary Toggle Button */
  .atoll-select-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: var(--select-padding-y) var(--select-padding-x);
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--select-font-size);
    color: var(--select-color);
    background-color: var(--select-bg);
    border: 1px solid var(--select-border);
    border-radius: var(--select-radius);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out, background-color 0.15s ease-in-out;
  }

  .atoll-select-toggle::after {
    display: none !important;
  }

  .atoll-select-toggle:focus,
  .atoll-select-toggle:focus-visible {
    background-color: var(--atoll-bg-surface-primary, #FFFFFF);
    border-color: var(--select-focus-border);
    box-shadow: 0 0 0 0.25rem var(--select-focus-ring);
    outline: none;
  }

  :host([disabled]) .atoll-select-toggle,
  :host([aria-disabled="true"]) .atoll-select-toggle,
  .atoll-select-toggle.disabled,
  .atoll-select-toggle[aria-disabled="true"] {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Chevron animation inside summary */
  details[open] .atoll-select-trailing atoll-icon {
    transform: rotate(180deg);
  }

  .atoll-select-trailing atoll-icon {
    transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Options Menu Listbox Container */
  .atoll-select-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 100%;
    z-index: 1050;
    padding: 0.375rem;
    margin: 0;
    background-color: var(--atoll-bg-surface-primary, #FFFFFF);
    border: 1px solid var(--atoll-border-subtle, #E8E8E8);
    border-radius: var(--atoll-radius-md, 12px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    list-style: none;
    max-height: 280px;
    overflow-y: auto;

    opacity: 0;
    transform: translateY(-8px) scale(0.96);
    transform-origin: top center;
    transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }

  ::slotted(.dropdown-item),
  ::slotted(li) .dropdown-item,
  ::slotted(option) {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0.5rem 0.75rem;
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-text-primary, #111111);
    border-radius: var(--atoll-radius-sm, 8px);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  ::slotted(.dropdown-item:hover),
  ::slotted(.dropdown-item:focus),
  ::slotted(.dropdown-item:focus-visible),
  ::slotted(li) .dropdown-item:hover,
  ::slotted(option:hover) {
    background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
    color: var(--atoll-text-primary, #111111);
    outline: none;
  }

  ::slotted(.dropdown-item.active),
  ::slotted(.dropdown-item[aria-selected="true"]),
  ::slotted(li) .dropdown-item.active,
  ::slotted(option[selected]),
  ::slotted(option:checked) {
    background-color: var(--atoll-brand-green-tint, rgba(6, 199, 85, 0.12));
    color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    font-weight: 600;
  }

  ::slotted(.dropdown-item.disabled),
  ::slotted(.dropdown-item[disabled]),
  ::slotted(li) .dropdown-item.disabled,
  ::slotted(option[disabled]),
  ::slotted(option:disabled) {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  details[open] > .atoll-select-menu {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Dropup Placement */
  :host([placement="up"]) .atoll-select-menu,
  .atoll-select.atoll-select-dropup .atoll-select-menu {
    top: auto;
    bottom: calc(100% + 4px);
    transform: translateY(8px) scale(0.96);
    transform-origin: bottom center;
  }

  :host([placement="up"]) details[open] > .atoll-select-menu,
  .atoll-select.atoll-select-dropup details[open] > .atoll-select-menu {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Alignment Modifiers */
  :host([align="end"]) .atoll-select-menu {
    left: auto;
    right: 0;
  }

  .atoll-select-label-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .atoll-select-leading,
  .atoll-select-trailing {
    display: inline-flex;
    align-items: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .atoll-select-menu,
    .atoll-select-trailing atoll-icon {
      transition: none !important;
    }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      value: {
        type: String,
        default: ''
      },
      placeholder: {
        type: String,
        default: 'Select an option...'
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg'],
        reflect: true
      },
      variant: {
        type: String,
        default: 'secondary',
        values: ['primary', 'secondary', 'outline', 'ghost', 'danger', 'info', 'link']
      },
      placement: {
        type: String,
        default: 'down',
        values: ['down', 'up']
      },
      align: {
        type: String,
        default: 'start',
        values: ['start', 'end']
      },
      disabled: Boolean,
      block: Boolean,
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      name: {
        type: String,
        default: ''
      },
      autoFlip: {
        type: Boolean,
        default: true
      },
      closeOnSelect: {
        type: Boolean,
        default: true
      },
      open: Boolean
    },

    provide: {
      'atoll-select-context': ({ state }) => ({
        value: state.value,
        size: state.size,
        disabled: state.disabled,
        variant: state.variant
      })
    },

    slots: {
      leading (nodes, { state }) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-select-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          icon.setAttribute('size', state.size === 'sm' ? '16' : '18')
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-select-leading'
          nodes.forEach(node => span.appendChild(node))
          return [span]
        }

        return null
      },

      trailing (nodes, { state }) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-select-trailing'
          nodes.forEach(node => span.appendChild(node))
          return [span]
        }

        const span = document.createElement('span')
        span.className = 'atoll-select-trailing'
        const icon = document.createElement('atoll-icon')
        icon.setAttribute('name', state.trailingIcon || 'chevron-down')
        icon.setAttribute('size', state.size === 'sm' ? '14' : '16')
        span.appendChild(icon)
        return [span]
      }
    },

    getters: {
      isOpen: ({ state }) => Boolean(state.open),
      isDisabled: ({ state }) => Boolean(state.disabled),
      isExpanded: ({ state }) => Boolean(state.open),
      summaryTabIndex: ({ state }) => (state.disabled ? -1 : 0),
      toggleClasses: ({ state }) => (state.disabled ? 'disabled' : ''),
      dropupClass: ({ state }) => (state.isDropup ? 'atoll-select-dropup' : ''),
      selectedLabel: ({ state, root }) => {
        if (state.value) {
          const item = root?.querySelector?.(`[data-value="${state.value}"], option[value="${state.value}"]`)
          const txt = item?.textContent?.trim()
          if (txt) {
            return txt
          }
        }
        const selectedItem = root?.querySelector?.('[data-value][selected], option[selected]')
        if (selectedItem) {
          const txt = selectedItem.textContent?.trim()
          if (txt) {
            return txt
          }
        }
        return state.placeholder
      },
      computedAriaLabel: ({ state, root }) => {
        const hostAria = root?.getAttribute?.('aria-label') || root?.ariaLabel
        if (hostAria) {
          return hostAria
        }

        const hostLabel = root?.getAttribute?.('label')
        if (hostLabel) {
          return hostLabel
        }

        if (state.value) {
          const item = root?.querySelector?.(`[data-value="${state.value}"], option[value="${state.value}"]`)
          const txt = item?.textContent?.trim()
          if (txt) {
            return txt
          }
        }

        const selectedItem = root?.querySelector?.('[data-value][selected], option[selected]')
        if (selectedItem) {
          const txt = selectedItem.textContent?.trim()
          if (txt) {
            return txt
          }
        }

        return state.placeholder || 'Select an option'
      }
    },

    client: ({ state, refs, root, observe, signal, emit }) => {
      const detailsEl = refs('detailsElement')
      const toggleEl = refs('toggleElement')
      const menuEl = refs('menuElement')
      const hiddenInput = refs('hiddenInput')

      const checkAutoFlip = () => {
        if (state.autoFlip === false || state.placement === 'up') {
          state.isDropup = state.placement === 'up'
          return
        }
        const rect = detailsEl.getBoundingClientRect()
        const spaceBelow = window.innerHeight - rect.bottom
        const spaceAbove = rect.top
        const menuEstimatedHeight = 260
        state.isDropup = spaceBelow < menuEstimatedHeight && spaceAbove > spaceBelow
      }

      const show = () => {
        if (state.disabled || (state.open && detailsEl.hasAttribute('open'))) {
          return
        }
        state.open = true
        detailsEl.setAttribute('open', '')
        checkAutoFlip()
      }

      const hide = () => {
        if (!state.open) {
          return
        }
        state.open = false
        state.isDropup = false
        detailsEl.removeAttribute('open')
      }

      const toggle = () => {
        if (state.open) {
          hide()
        } else {
          show()
        }
      }

      const updateSelectedLabel = () => {
        const items = menuEl.querySelectorAll('.dropdown-item, [data-value], option')

        items.forEach((item) => {
          if (item.tagName !== 'OPTION' && !item.hasAttribute('role')) {
            item.setAttribute('role', 'option')
          }
          if (item.parentElement && item.parentElement.tagName === 'LI') {
            item.parentElement.setAttribute('role', 'presentation')
          }

          const itemVal = item.getAttribute('data-value') ?? item.getAttribute('value') ?? item.value ?? item.textContent.trim()
          const isSelected = Boolean(itemVal === state.value || (!state.value && item.hasAttribute('selected')))
          if (isSelected) {
            item.classList.add('active')
            item.setAttribute('aria-selected', 'true')
          } else {
            item.classList.remove('active')
            item.removeAttribute('aria-selected')
          }
        })
      }

      const handleMenuClick = (event) => {
        const item = event.target.closest('.dropdown-item:not([disabled]), [data-value]:not([disabled]), option:not([disabled])')
        if (!item || state.disabled) {
          return
        }

        const selectedValue = item.getAttribute('data-value') ?? item.getAttribute('value') ?? item.value ?? item.textContent.trim()
        const selectedLabel = item.textContent.trim()

        state.value = selectedValue
        if (hiddenInput) {
          hiddenInput.value = selectedValue
          hiddenInput.dispatchEvent(new Event('input', { bubbles: true }))
          hiddenInput.dispatchEvent(new Event('change', { bubbles: true }))
        }
        updateSelectedLabel()

        if (state.closeOnSelect !== false) {
          hide()
        }

        emit('atoll-change', {
          value: selectedValue,
          label: selectedLabel
        })
      }

      menuEl.addEventListener('click', handleMenuClick, { signal })

      toggleEl.addEventListener('click', (e) => {
        e.preventDefault()
        if (state.disabled) {
          return
        }
        toggle()
      }, { signal })

      detailsEl.addEventListener('toggle', () => {
        const isDetailsOpen = detailsEl.hasAttribute('open')
        if (isDetailsOpen && !state.open) {
          show()
        } else if (!isDetailsOpen && state.open) {
          hide()
        }
      }, { signal })

      const handleOutsideClick = (e) => {
        const isOutside = !root.contains(e.target) && e.target !== root
        if (state.open && isOutside) {
          hide()
        }
      }
      document.addEventListener('pointerdown', handleOutsideClick, { signal })

      let typeaheadQuery = ''
      let typeaheadTimer = null

      const getOptions = () => Array.from(menuEl.querySelectorAll('.dropdown-item:not([disabled]), [data-value]:not([disabled]), option:not([disabled])'))

      const handleKeyDown = (e) => {
        if (state.disabled) {
          return
        }

        const options = getOptions()
        const activeEl = document.activeElement
        const currentIndex = options.indexOf(activeEl)

        // Typeahead character query search
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
          typeaheadQuery += e.key.toLowerCase()
          clearTimeout(typeaheadTimer)
          typeaheadTimer = setTimeout(() => {
            typeaheadQuery = ''
          }, 500)

          const match = options.find(opt => opt.textContent.trim().toLowerCase().startsWith(typeaheadQuery))
          if (match) {
            if (!state.open) {
              show()
            }
            match.focus()
          }
          return
        }

        switch (e.key) {
          case 'Enter':
          case ' ':
            if (activeEl === toggleEl || !state.open) {
              e.preventDefault()
              toggle()
            } else if (currentIndex !== -1) {
              e.preventDefault()
              activeEl.click()
            }
            break

          case 'ArrowDown':
            e.preventDefault()
            if (!state.open) {
              show()
              requestAnimationFrame(() => {
                const opts = getOptions()
                if (opts.length > 0) {
                  opts[0].focus()
                }
              })
            } else if (currentIndex === -1) {
              if (options.length > 0) {
                options[0].focus()
              }
            } else {
              const nextIndex = (currentIndex + 1) % options.length
              options[nextIndex].focus()
            }
            break

          case 'ArrowUp':
            e.preventDefault()
            if (!state.open) {
              show()
              requestAnimationFrame(() => {
                const opts = getOptions()
                if (opts.length > 0) {
                  opts[opts.length - 1].focus()
                }
              })
            } else if (currentIndex === -1) {
              if (options.length > 0) {
                options[options.length - 1].focus()
              }
            } else {
              const prevIndex = (currentIndex - 1 + options.length) % options.length
              options[prevIndex].focus()
            }
            break

          case 'Home':
            if (state.open && options.length > 0) {
              e.preventDefault()
              options[0].focus()
            }
            break

          case 'End':
            if (state.open && options.length > 0) {
              e.preventDefault()
              options[options.length - 1].focus()
            }
            break

          case 'Escape':
            if (state.open) {
              e.preventDefault()
              hide()
              toggleEl.focus()
            }
            break

          case 'Tab':
            if (state.open) {
              hide()
            }
            break
        }
      }

      detailsEl.addEventListener('keydown', handleKeyDown, { signal })

      const observer = new MutationObserver(() => {
        updateSelectedLabel()
      })
      observer.observe(menuEl, {
        childList: true,
        subtree: true,
        characterData: true
      })
      signal.addEventListener('abort', () => observer.disconnect())

      const form = root.closest('form')
      if (form) {
        form.addEventListener('reset', () => {
          setTimeout(() => {
            const resetVal = root.getAttribute('value') ?? hiddenInput?.getAttribute('value') ?? ''
            state.value = resetVal
            if (hiddenInput) {
              hiddenInput.value = resetVal
            }
            updateSelectedLabel()
          }, 0)
        }, { signal })
      }

      if (observe) {
        observe('value', () => {
          if (hiddenInput && hiddenInput.value !== state.value) {
            hiddenInput.value = state.value || ''
          }
          updateSelectedLabel()
        })

        observe('open', () => {
          if (state.open) {
            show()
          } else {
            hide()
          }
        })
      }

      updateSelectedLabel()
      if (state.open) {
        show()
      }

      root.show = show
      root.hide = hide
      root.toggle = toggle
      root.focus = () => toggleEl?.focus()
      root.blur = () => toggleEl?.blur()

      signal.addEventListener('abort', () => {
        clearTimeout(typeaheadTimer)
        typeaheadQuery = ''
      })
    }
  })
</script>
