<template id="atoll-select">
  <details 
    ref="detailsElement"
    class="{{ selectContainerClasses }}"
  >
    <!-- Hidden Input for Form Submission Integration -->
    <input 
      ref="hiddenInput"
      type="hidden" 
      name="{{ name }}" 
      value="{{ value }}"
    />

    <!-- Summary Toggle Button (role="combobox") -->
    <summary 
      ref="toggleElement"
      class="{{ toggleClasses }}"
      role="combobox"
      aria-haspopup="listbox"
      aria-expanded="{{ isExpanded }}"
      aria-controls="{{ ref_menuList }}"
      aria-disabled="{{ isDisabled }}"
      tabindex="{{ summaryTabIndex }}"
    >
      <span class="atoll-select-label-group">
        <slot name="leading"></slot>
        <span ref="labelElement" class="atoll-select-label">{{ selectedLabel }}</span>
      </span>
      <slot name="trailing"></slot>
    </summary>

    <!-- Dropdown / Dropup Options Menu (role="listbox") -->
    <ul 
      ref="menuElement" 
      id="{{ ref_menuList }}"
      class="atoll-select-menu"
      role="listbox"
      aria-orientation="vertical"
    >
      <slot></slot>
    </ul>
  </details>
</template>

<style>
  :host {
    display: inline-block;
    position: relative;
    width: 100%;
  }

  :host([hidden]) {
    display: none !important;
  }

  :host([block]) {
    display: block;
    width: 100%;
  }

  .atoll-select {
    display: inline-block;
    position: relative;
    width: 100%;
  }

  /* Strips native <summary> disclosure triangles */
  .atoll-select summary {
    list-style: none;
  }

  .atoll-select summary::-webkit-details-marker {
    display: none;
  }

  /* Summary Toggle Button */
  .atoll-select-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0.5rem 0.75rem;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-text-primary, #111111);
    background-color: var(--atoll-input-bg, var(--atoll-bg-surface-secondary, #F5F5F5));
    border: 1px solid var(--atoll-border-subtle, #E8E8E8);
    border-radius: var(--atoll-radius-md, 12px);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out, background-color 0.15s ease-in-out;
  }

  .atoll-select-toggle::after {
    display: none !important;
  }

  .atoll-select-toggle:focus,
  .atoll-select-toggle:focus-visible {
    background-color: var(--atoll-bg-surface-primary, #FFFFFF);
    border-color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    box-shadow: 0 0 0 0.25rem color-mix(in srgb, var(--atoll-primary, #06C755) 20%, transparent);
    outline: none;
  }

  .atoll-select-toggle.disabled,
  .atoll-select-toggle[aria-disabled="true"] {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Chevron animation inside summary */
  details[open] .atoll-select-trailing atoll-icon {
    transform: rotate(180deg);
  }

  .atoll-select-trailing atoll-icon {
    transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Options Menu Listbox Container */
  .atoll-select-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 100%;
    z-index: 1050;
    padding: 0.375rem;
    margin: 0;
    background-color: var(--atoll-bg-surface-primary, #FFFFFF);
    border: 1px solid var(--atoll-border-subtle, #E8E8E8);
    border-radius: var(--atoll-radius-md, 12px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    list-style: none;
    max-height: 280px;
    overflow-y: auto;

    opacity: 0;
    transform: translateY(-8px) scale(0.96);
    transform-origin: top center;
    transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }

  .atoll-select-menu .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0.5rem 0.75rem;
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-text-primary, #111111);
    border-radius: var(--atoll-radius-sm, 8px);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .atoll-select-menu .dropdown-item:hover,
  .atoll-select-menu .dropdown-item:focus,
  .atoll-select-menu .dropdown-item:focus-visible {
    background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
    color: var(--atoll-text-primary, #111111);
    outline: none;
  }

  .atoll-select-menu .dropdown-item.active,
  .atoll-select-menu .dropdown-item[aria-selected="true"] {
    background-color: var(--atoll-brand-green-tint, rgba(6, 199, 85, 0.12));
    color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    font-weight: 600;
  }

  .atoll-select-menu .dropdown-item.disabled,
  .atoll-select-menu .dropdown-item[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  details[open] > .atoll-select-menu {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .atoll-select.atoll-select-dropup .atoll-select-menu {
    top: auto;
    bottom: calc(100% + 4px);
    transform: translateY(8px) scale(0.96);
    transform-origin: bottom center;
  }

  .atoll-select.atoll-select-dropup details[open] > .atoll-select-menu {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .atoll-select.atoll-select-align-end .atoll-select-menu {
    left: auto;
    right: 0;
  }

  .atoll-select.atoll-select-closing > .atoll-select-menu {
    opacity: 0 !important;
    transform: translateY(-6px) scale(0.98) !important;
    transition: opacity 140ms cubic-bezier(0.4, 0, 1, 1),
                transform 140ms cubic-bezier(0.4, 0, 1, 1) !important;
  }

  .atoll-select.atoll-select-dropup.atoll-select-closing > .atoll-select-menu {
    transform: translateY(6px) scale(0.98) !important;
  }

  .atoll-select-label-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .atoll-select-leading,
  .atoll-select-trailing {
    display: inline-flex;
    align-items: center;
  }

  .atoll-select.atoll-select-sm .atoll-select-toggle {
    padding: 0.25rem 0.5rem;
    font-size: 12px;
  }

  .atoll-select.atoll-select-lg .atoll-select-toggle {
    padding: 0.75rem 1rem;
    font-size: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .atoll-select .atoll-select-menu,
    .atoll-select .atoll-select-trailing atoll-icon {
      transition: none !important;
    }
  }

  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-toggle,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-toggle,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-toggle,
  [data-bs-theme="dark"] .atoll-select .atoll-select-toggle {
    color: var(--atoll-text-primary, #FFFFFF);
    background-color: var(--atoll-input-bg, var(--atoll-bg-surface-tertiary, #1F1F1F));
    border-color: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.12));
  }

  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-toggle:focus,
  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-toggle:focus-visible,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-toggle:focus,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-toggle:focus-visible,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-toggle:focus,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-toggle:focus-visible,
  [data-bs-theme="dark"] .atoll-select .atoll-select-toggle:focus,
  [data-bs-theme="dark"] .atoll-select .atoll-select-toggle:focus-visible {
    background-color: var(--atoll-bg-surface-secondary, #161616);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-menu,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-menu,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-menu,
  [data-bs-theme="dark"] .atoll-select .atoll-select-menu {
    background-color: var(--atoll-bg-surface-secondary, #161616);
    border-color: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.15));
  }

  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item,
  [data-bs-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item {
    color: var(--atoll-text-primary, #FFFFFF);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:hover,
  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:focus,
  :host-context([data-atoll-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:focus-visible,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:hover,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:focus,
  :host-context([data-bs-theme="dark"]) .atoll-select .atoll-select-menu .dropdown-item:focus-visible,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:hover,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:focus,
  [data-atoll-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:focus-visible,
  [data-bs-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:hover,
  [data-bs-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:focus,
  [data-bs-theme="dark"] .atoll-select .atoll-select-menu .dropdown-item:focus-visible {
    background-color: var(--atoll-bg-surface-tertiary, #2A2A2A);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      value: {
        type: String,
        default: ''
      },
      placeholder: {
        type: String,
        default: 'Select an option...'
      },
      size: {
        type: String,
        // 'sm' | 'md' | 'lg'
        default: 'md'
      },
      variant: {
        type: String,
        default: 'secondary'
      },
      placement: {
        type: String,
        // 'down' | 'up'
        default: 'down'
      },
      align: {
        type: String,
        // 'start' | 'end'
        default: 'start'
      },
      disabled: Boolean,
      block: Boolean,
      leadingIcon: {
        type: String,
        default: ''
      },
      trailingIcon: {
        type: String,
        default: ''
      },
      name: {
        type: String,
        default: ''
      },
      autoFlip: {
        type: Boolean,
        default: true
      },
      closeOnSelect: {
        type: Boolean,
        default: true
      },
      open: Boolean
    },

    slots: {
      leading (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (state.leadingIcon) {
          const span = document.createElement('span')
          span.className = 'atoll-select-leading'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', state.leadingIcon)
          icon.setAttribute('size', state.size === 'sm' ? '16' : '18')
          span.appendChild(icon)
          return [span]
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-select-leading'
          nodes.forEach(node => span.appendChild(node))
          return [span]
        }

        return null
      },

      trailing (nodes, state) {
        if (typeof document === 'undefined') {
          return null
        }

        if (nodes && nodes.length > 0) {
          const span = document.createElement('span')
          span.className = 'atoll-select-trailing'
          nodes.forEach(node => span.appendChild(node))
          return [span]
        }

        const span = document.createElement('span')
        span.className = 'atoll-select-trailing'
        const icon = document.createElement('atoll-icon')
        icon.setAttribute('name', state.trailingIcon || 'chevron-down')
        icon.setAttribute('size', state.size === 'sm' ? '14' : '16')
        span.appendChild(icon)
        return [span]
      }
    },

    getters: {
      selectContainerClasses: (state) => {
        const classes = ['atoll-select']
        if (state.size) {
          classes.push(`atoll-select-${state.size}`)
        }
        if (state.block) {
          classes.push('w-100')
        }
        if (state.placement === 'up' || state.isFlipped) {
          classes.push('atoll-select-dropup')
        }
        if (state.align === 'end') {
          classes.push('atoll-select-align-end')
        }
        return classes.join(' ')
      },

      toggleClasses: (state) => {
        const classes = ['atoll-select-toggle']
        if (state.variant) {
          classes.push(`btn-${state.variant}`)
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        return classes.join(' ')
      },

      isDisabled: (state) => Boolean(state.disabled),

      isExpanded: (state) => Boolean(state.open),

      summaryTabIndex: (state) => (state.disabled ? -1 : 0),

      selectedLabel: (state) => state.selectedLabelText || state.placeholder,

      ref_menuList: (_state, { instanceId }) => (instanceId ? `${instanceId}-menu` : 'atoll-select-menu')
    },

    client: ({ state, refs, root, observe, signal }) => {
      if (root.__initialized) {
        return
      }
      root.__initialized = true

      const detailsEl = refs('detailsElement')
      const toggleEl = refs('toggleElement')
      const menuEl = refs('menuElement')
      const hiddenInput = refs('hiddenInput')
      const labelEl = refs('labelElement')

      // Self-healing pre-hydration attributes
      const preExistingValue = root.value !== undefined ? root.value : root.getAttribute('value')
      if (preExistingValue !== undefined && preExistingValue !== null) {
        state.value = String(preExistingValue)
      }

      const preExistingDisabled = root.disabled !== undefined ? root.disabled : root.hasAttribute('disabled')
      if (preExistingDisabled !== undefined && preExistingDisabled !== null) {
        state.disabled = Boolean(preExistingDisabled)
      }

      const preExistingOpen = root.open !== undefined ? root.open : root.hasAttribute('open')
      if (preExistingOpen !== undefined && preExistingOpen !== null) {
        state.open = Boolean(preExistingOpen)
      }

      // Forward test-id / data-testid to inner toggle button summary
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
      if (testId) {
        root.__testId = testId
        toggleEl.setAttribute('data-testid', testId)
        root.removeAttribute('test-id')
        requestAnimationFrame(() => {
          root.removeAttribute('data-testid')
        })
      }

      let isClosing = false
      let closeTimeout = null

      const checkAutoFlip = () => {
        if (state.autoFlip === false || state.placement === 'up') {
          if (state.placement === 'up') {
            state.isFlipped = true
          }
          return
        }
        const rect = detailsEl.getBoundingClientRect()
        const spaceBelow = window.innerHeight - rect.bottom
        const spaceAbove = rect.top
        const menuEstimatedHeight = 260
        state.isFlipped = spaceBelow < menuEstimatedHeight && spaceAbove > spaceBelow
      }

      const syncDisabledState = () => {
        if (toggleEl) {
          toggleEl.setAttribute('aria-disabled', state.disabled ? 'true' : 'false')
          toggleEl.setAttribute('tabindex', state.disabled ? '-1' : '0')
          if (state.disabled) {
            toggleEl.classList.add('disabled')
          } else {
            toggleEl.classList.remove('disabled')
          }
        }
      }

      const show = () => {
        if (state.disabled || state.open) {
          return
        }
        if (closeTimeout) {
          clearTimeout(closeTimeout)
        }
        isClosing = false
        detailsEl.classList.remove('atoll-select-closing')
        state.open = true
        root.setAttribute('open', '')
        detailsEl.setAttribute('open', '')
        checkAutoFlip()
      }

      const hide = () => {
        if (!state.open || isClosing) {
          return
        }
        isClosing = true
        detailsEl.classList.add('atoll-select-closing')

        let transitionHandled = false
        const handleEnd = () => {
          if (transitionHandled) {
            return
          }
          transitionHandled = true
          if (closeTimeout) {
            clearTimeout(closeTimeout)
          }
          state.open = false
          state.isFlipped = false
          detailsEl.classList.remove('atoll-select-closing')
          detailsEl.removeAttribute('open')
          root.removeAttribute('open')
          isClosing = false
        }

        const onTransitionEnd = (e) => {
          if (e.target === menuEl || e.target?.classList?.contains('atoll-select-menu')) {
            menuEl.removeEventListener('transitionend', onTransitionEnd)
            handleEnd()
          }
        }

        menuEl.addEventListener('transitionend', onTransitionEnd, { signal })
        closeTimeout = setTimeout(handleEnd, 160)
      }

      const toggle = () => {
        if (state.open) {
          hide()
        } else {
          show()
        }
      }

      // Sync active state and selected label text from options in default slot
      const updateSelectedLabel = () => {
        const items = menuEl.querySelectorAll('.dropdown-item, [data-value], option')
        let foundLabel = ''

        items.forEach((item) => {
          const itemVal = item.getAttribute('data-value') ?? item.getAttribute('value') ?? item.value ?? item.textContent.trim()
          if (itemVal === state.value || (!state.value && item.hasAttribute('selected'))) {
            item.classList.add('active')
            item.setAttribute('aria-selected', 'true')
            foundLabel = item.textContent.trim()
            if (!state.value) {
              state.value = itemVal
            }
          } else {
            item.classList.remove('active')
            item.removeAttribute('aria-selected')
          }
        })

        state.selectedLabelText = foundLabel || ''
        if (labelEl) {
          labelEl.textContent = state.selectedLabelText || state.placeholder
        }
      }

      // Option selection handler
      const handleMenuClick = (event) => {
        const item = event.target.closest('.dropdown-item:not([disabled]), [data-value]:not([disabled]), option:not([disabled])')
        if (!item || state.disabled) {
          return
        }

        const selectedValue = item.getAttribute('data-value') ?? item.getAttribute('value') ?? item.value ?? item.textContent.trim()
        const selectedLabel = item.textContent.trim()

        state.value = selectedValue
        if (hiddenInput) {
          hiddenInput.value = selectedValue
          hiddenInput.dispatchEvent(new Event('input', { bubbles: true }))
          hiddenInput.dispatchEvent(new Event('change', { bubbles: true }))
        }
        updateSelectedLabel()

        if (state.closeOnSelect !== false) {
          hide()
        }

        root.dispatchEvent(
          new CustomEvent('atoll-change', {
            bubbles: true,
            composed: true,
            detail: {
              value: selectedValue,
              label: selectedLabel
            }
          })
        )
      }

      menuEl.addEventListener('click', handleMenuClick, { signal })

      // Toggle click handler on summary
      toggleEl.addEventListener('click', (e) => {
        e.preventDefault()
        if (state.disabled) {
          return
        }
        toggle()
      }, { signal })

      // Prevent details native toggle from firing out of order
      detailsEl.addEventListener('toggle', () => {
        if (isClosing) {
          return
        }
        const isDetailsOpen = detailsEl.hasAttribute('open')
        if (isDetailsOpen && !state.open) {
          show()
        } else if (!isDetailsOpen && state.open) {
          hide()
        }
      }, { signal })

      // Outside click handler
      const handleOutsideClick = (e) => {
        const isOutside = !root.contains(e.target) && e.target !== root
        if (state.open && isOutside) {
          hide()
        }
      }
      document.addEventListener('pointerdown', handleOutsideClick, { signal })
      document.addEventListener('mousedown', handleOutsideClick, { signal })

      // Keyboard navigation handler (WAI-ARIA APG pattern)
      let typeaheadQuery = ''
      let typeaheadTimer = null

      const getOptions = () => Array.from(menuEl.querySelectorAll('.dropdown-item:not([disabled]), [data-value]:not([disabled]), option:not([disabled])'))

      const handleKeyDown = (e) => {
        if (state.disabled) {
          return
        }

        const options = getOptions()
        const activeEl = document.activeElement
        const currentIndex = options.indexOf(activeEl)

        switch (e.key) {
          case 'Enter':
          case ' ':
            if (activeEl === toggleEl || !state.open) {
              e.preventDefault()
              toggle()
            } else if (currentIndex !== -1) {
              e.preventDefault()
              activeEl.click()
            }
            break

          case 'ArrowDown':
            e.preventDefault()
            if (!state.open) {
              show()
              requestAnimationFrame(() => {
                const opts = getOptions()
                if (opts.length > 0) {
                  opts[0].focus()
                }
              })
            } else if (currentIndex === -1) {
              if (options.length > 0) {
                options[0].focus()
              }
            } else {
              const nextIndex = (currentIndex + 1) % options.length
              options[nextIndex].focus()
            }
            break

          case 'ArrowUp':
            e.preventDefault()
            if (!state.open) {
              show()
              requestAnimationFrame(() => {
                const opts = getOptions()
                if (opts.length > 0) {
                  opts[opts.length - 1].focus()
                }
              })
            } else if (currentIndex === -1) {
              if (options.length > 0) {
                options[options.length - 1].focus()
              }
            } else {
              const prevIndex = (currentIndex - 1 + options.length) % options.length
              options[prevIndex].focus()
            }
            break

          case 'Home':
            if (state.open && options.length > 0) {
              e.preventDefault()
              options[0].focus()
            }
            break

          case 'End':
            if (state.open && options.length > 0) {
              e.preventDefault()
              options[options.length - 1].focus()
            }
            break

          case 'Escape':
            if (state.open) {
              e.preventDefault()
              hide()
              toggleEl.focus()
            }
            break

          case 'Tab':
            if (state.open) {
              hide()
            }
            break

          default:
            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
              if (typeaheadTimer) {
                clearTimeout(typeaheadTimer)
              }
              typeaheadQuery += e.key.toLowerCase()
              typeaheadTimer = setTimeout(() => {
                typeaheadQuery = ''
              }, 500)

              const match = options.find(opt => opt.textContent.trim().toLowerCase().startsWith(typeaheadQuery))
              if (match) {
                if (!state.open) {
                  show()
                }
                requestAnimationFrame(() => match.focus())
              }
            }
            break
        }
      }

      root.addEventListener('keydown', handleKeyDown, { signal })

      // MutationObserver for slot changes (async options)
      const observer = new MutationObserver(() => {
        updateSelectedLabel()
      })
      observer.observe(menuEl, {
        childList: true,
        subtree: true,
        characterData: true
      })
      signal.addEventListener('abort', () => observer.disconnect())

      // Form reset handler (listens at document level to catch reset events regardless of mount order)
      document.addEventListener('reset', (e) => {
        const form = root.closest('form')
        if (form && (e.target === form || form.contains(e.target))) {
          const resetVal = root.getAttribute('value') ?? hiddenInput?.getAttribute('value') ?? ''
          state.value = resetVal
          if (hiddenInput) {
            hiddenInput.value = resetVal
          }
          updateSelectedLabel()
        }
      }, { signal })

      // Observe reactive state and attributes
      if (observe) {
        observe('value', (val) => {
          if (hiddenInput) {
            hiddenInput.value = String(val || '')
          }
          updateSelectedLabel()
        })
        observe('disabled', () => {
          syncDisabledState()
        })
        observe('open', (val) => {
          const isOpen = val === 'true' || val === true || val === ''
          if (isOpen) {
            show()
          } else {
            hide()
          }
        })
      }
      updateSelectedLabel()
      syncDisabledState()

      // Define properties directly on custom element host
      Object.defineProperty(root, 'disabled', {
        get () {
          return Boolean(state.disabled)
        },
        set (val) {
          const isD = val === 'true' || val === true || val === ''
          state.disabled = isD
          syncDisabledState()
          if (isD) {
            root.setAttribute('disabled', 'true')
          } else {
            root.removeAttribute('disabled')
          }
        },
        configurable: true
      })

      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (val) {
          state.value = String(val || '')
          if (hiddenInput) {
            hiddenInput.value = state.value
          }
          updateSelectedLabel()
        },
        configurable: true
      })

      Object.defineProperty(root, 'open', {
        get () {
          return Boolean(state.open)
        },
        set (val) {
          const isOpen = val === 'true' || val === true || val === ''
          if (isOpen) {
            show()
          } else {
            hide()
          }
        },
        configurable: true
      })

      // Public imperative API
      root.show = show
      root.hide = hide
      root.toggle = toggle
      root.focus = () => toggleEl?.focus()
      root.blur = () => toggleEl?.blur()
    }
  })
</script>
