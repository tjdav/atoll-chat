<template id="atoll-tooltip">
  <div class="atoll-tooltip-wrapper">
    <!-- Anchor Trigger Slot -->
    <div ref="trigger" aria-describedby="{{ ref_bubble }}">
      <slot></slot>
    </div>

    <!-- Floating Tooltip Bubble -->
    <div 
      ref="bubble"
      id="{{ ref_bubble }}"
      class="{{ tooltipClasses }}"
      role="{{ computedRole }}"
      aria-hidden="{{ isAriaHidden }}"
    >
      <!-- Optional Header (Title + Close Button) -->
      <div class="atoll-tooltip-header" hidden="{{ hideHeader }}">
        <span>{{ title }}</span>
        
        <button 
          ref="closeBtn" 
          type="button" 
          class="atoll-tooltip-close" 
          aria-label="Close tooltip"
          hidden="{{ hideCloseBtn }}"
        >
          <atoll-icon name="close" size="14"></atoll-icon>
        </button>
      </div>

      <!-- Content Slot / Text Message -->
      <div class="atoll-tooltip-body">
        <slot name="content">{{ text }}</slot>
      </div>
    </div>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    position: relative;
  }

  :host([hidden]) {
    display: none !important;
  }

  .atoll-tooltip-wrapper {
    display: inline-flex;
    position: relative;
  }

  .atoll-tooltip-bubble {
    position: absolute;
    z-index: var(--atoll-tooltip-z-index, 1080);
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: max-content;
    max-width: var(--atoll-tooltip-max-width, 280px);
    padding: var(--atoll-tooltip-padding-y, 8px) var(--atoll-tooltip-padding-x, 12px);
    background-color: var(--atoll-tooltip-bg, var(--atoll-bg-surface-inverse, #222222));
    color: var(--atoll-tooltip-color, #FFFFFF);
    border: 1px solid var(--atoll-tooltip-border, transparent);
    border-radius: var(--atoll-tooltip-radius, 8px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-caption-1, 12px);
    line-height: 1.35;
    box-sizing: border-box;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease-in-out, transform 0.15s ease-in-out;
  }

  .atoll-tooltip-bubble.atoll-tooltip-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .atoll-tooltip-bubble::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
  }

  .atoll-tooltip-top {
    bottom: calc(100% + var(--atoll-tooltip-arrow-size, 6px) + 4px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
  }

  .atoll-tooltip-top.atoll-tooltip-visible {
    transform: translateX(-50%) translateY(0);
  }

  .atoll-tooltip-top::after {
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-width: var(--atoll-tooltip-arrow-size, 6px) var(--atoll-tooltip-arrow-size, 6px) 0;
    border-color: var(--atoll-tooltip-bg, var(--atoll-bg-surface-inverse, #222222)) transparent transparent;
  }

  .atoll-tooltip-bottom {
    top: calc(100% + var(--atoll-tooltip-arrow-size, 6px) + 4px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
  }

  .atoll-tooltip-bottom.atoll-tooltip-visible {
    transform: translateX(-50%) translateY(0);
  }

  .atoll-tooltip-bottom::after {
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 var(--atoll-tooltip-arrow-size, 6px) var(--atoll-tooltip-arrow-size, 6px);
    border-color: transparent transparent var(--atoll-tooltip-bg, var(--atoll-bg-surface-inverse, #222222));
  }

  .atoll-tooltip-left {
    right: calc(100% + var(--atoll-tooltip-arrow-size, 6px) + 4px);
    top: 50%;
    transform: translateY(-50%) translateX(4px);
  }

  .atoll-tooltip-left.atoll-tooltip-visible {
    transform: translateY(-50%) translateX(0);
  }

  .atoll-tooltip-left::after {
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    border-width: var(--atoll-tooltip-arrow-size, 6px) 0 var(--atoll-tooltip-arrow-size, 6px) var(--atoll-tooltip-arrow-size, 6px);
    border-color: transparent transparent transparent var(--atoll-tooltip-bg, var(--atoll-bg-surface-inverse, #222222));
  }

  .atoll-tooltip-right {
    left: calc(100% + var(--atoll-tooltip-arrow-size, 6px) + 4px);
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
  }

  .atoll-tooltip-right.atoll-tooltip-visible {
    transform: translateY(-50%) translateX(0);
  }

  .atoll-tooltip-right::after {
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    border-width: var(--atoll-tooltip-arrow-size, 6px) var(--atoll-tooltip-arrow-size, 6px) var(--atoll-tooltip-arrow-size, 6px) 0;
    border-color: transparent var(--atoll-tooltip-bg, var(--atoll-bg-surface-inverse, #222222)) transparent transparent;
  }

  .atoll-tooltip-action {
    --atoll-tooltip-bg: var(--atoll-bg-surface-primary, #FFFFFF);
    --atoll-tooltip-color: var(--atoll-text-primary, #111111);
    --atoll-tooltip-border: var(--atoll-border-subtle, #EFEFEF);
    --atoll-tooltip-padding-x: 16px;
    --atoll-tooltip-padding-y: 12px;
    --atoll-tooltip-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .atoll-tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: var(--atoll-font-weight-bold, 700);
    font-size: var(--atoll-font-size-body-2, 14px);
  }

  .atoll-tooltip-close {
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    color: var(--atoll-text-tertiary, #999999);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }

  .atoll-tooltip-close:hover {
    color: var(--atoll-text-primary, #111111);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-tooltip-bubble,
  :host-context([data-bs-theme="dark"]) .atoll-tooltip-bubble,
  [data-atoll-theme="dark"] .atoll-tooltip-bubble,
  [data-bs-theme="dark"] .atoll-tooltip-bubble {
    --atoll-tooltip-bg: var(--atoll-bg-surface-tertiary, #2A2A2A);
    --atoll-tooltip-color: #FFFFFF;
  }

  :host-context([data-atoll-theme="dark"]) .atoll-tooltip-action,
  :host-context([data-bs-theme="dark"]) .atoll-tooltip-action,
  [data-atoll-theme="dark"] .atoll-tooltip-action,
  [data-bs-theme="dark"] .atoll-tooltip-action {
    --atoll-tooltip-bg: var(--atoll-bg-surface-secondary, #1F1F1F);
    --atoll-tooltip-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-tooltip-border: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.15));
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      text: {
        type: String,
        default: ''
      },
      title: {
        type: String,
        default: ''
      },
      placement: {
        type: String,
        default: 'top'
      },
      variant: {
        type: String,
        default: 'plain'
      },
      trigger: {
        type: String,
        default: 'hover'
      },
      open: Boolean,
      closeable: Boolean
    },

    getters: {
      computedRole: (state) => (state.variant === 'action' ? 'dialog' : 'tooltip'),

      isAriaHidden: (state) => (state.open ? 'false' : 'true'),

      hideHeader: (state) => !state.title && !state.closeable,

      hideCloseBtn: (state) => !state.closeable,

      tooltipClasses: (state) => {
        const classes = ['atoll-tooltip-bubble']

        if (state.placement) {
          classes.push(`atoll-tooltip-${state.placement}`)
        } else {
          classes.push('atoll-tooltip-top')
        }

        if (state.variant) {
          classes.push(`atoll-tooltip-${state.variant}`)
        } else {
          classes.push('atoll-tooltip-plain')
        }

        if (state.open) {
          classes.push('atoll-tooltip-visible')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root }) => {
      const triggerEl = refs('trigger')
      const closeBtn = refs('closeBtn')

      const show = () => {
        state.open = true
      }
      const hide = () => {
        state.open = false
      }

      // Event Listeners for Hover Trigger
      triggerEl.addEventListener('mouseenter', () => {
        if (state.trigger === 'hover') {
          show()
        }
      })

      triggerEl.addEventListener('mouseleave', () => {
        if (state.trigger === 'hover') {
          hide()
        }
      })

      triggerEl.addEventListener('focusin', () => {
        if (state.trigger === 'hover') {
          show()
        }
      })

      triggerEl.addEventListener('focusout', () => {
        if (state.trigger === 'hover') {
          hide()
        }
      })

      triggerEl.addEventListener('click', () => {
        if (state.trigger === 'click') {
          state.open = !state.open
        }
      })

      // Close Button Handler
      closeBtn.addEventListener('click', (event) => {
        event.stopPropagation()
        hide()
        root.dispatchEvent(
          new CustomEvent('atoll-tooltip-close', {
            bubbles: true,
            composed: true
          })
        )
      })

      // Escape key listener & click-outside listener helper
      const onKeyDown = (event) => {
        if (event.key === 'Escape' && state.open) {
          hide()
        }
      }

      const onClickOutside = (event) => {
        if (state.open && state.trigger === 'click') {
          // Check if clicked outside of the root component
          const isClickInside = root.contains(event.target) || (event.composedPath && event.composedPath().includes(root))
          if (!isClickInside) {
            hide()
          }
        }
      }

      document.addEventListener('keydown', onKeyDown)
      document.addEventListener('pointerdown', onClickOutside)

      // Public DOM interface
      root.show = show
      root.hide = hide

      return () => {
        document.removeEventListener('keydown', onKeyDown)
        document.removeEventListener('pointerdown', onClickOutside)
      }
    }
  })
</script>
