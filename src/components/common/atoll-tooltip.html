<template id="atoll-tooltip">
  <div class="atoll-tooltip-wrapper">
    <!-- Anchor Trigger Slot -->
    <div ref="trigger" aria-describedby="{{ ref_bubble }}">
      <slot></slot>
    </div>

    <!-- Floating Tooltip Bubble -->
    <div 
      ref="bubble"
      id="{{ ref_bubble }}"
      class="atoll-tooltip-bubble"
      role="{{ computedRole }}"
      aria-hidden="{{ isAriaHidden }}"
    >
      <!-- Optional Header (Title + Close Button) -->
      <div class="atoll-tooltip-header" hidden="{{ hideHeader }}">
        <span>{{ title }}</span>
        
        <atoll-button 
          ref="closeBtn" 
          variant="ghost"
          size="sm"
          icon-only="true"
          pill="true"
          aria-label="Close tooltip"
          hidden="{{ hideCloseBtn }}"
        >
          <atoll-icon name="close" size="14"></atoll-icon>
        </atoll-button>
      </div>

      <!-- Content Slot / Text Message -->
      <div class="atoll-tooltip-body">
        <slot name="content">{{ text }}</slot>
      </div>
    </div>
  </div>
</template>

<style>
  :host {
    display: inline-flex;
    position: relative;
    vertical-align: middle;

    /* Tooltip Geometry Tokens */
    --tooltip-radius: 8px;
    --tooltip-padding-x: 12px;
    --tooltip-padding-y: 8px;
    --tooltip-max-width: 280px;
    --tooltip-arrow-size: 6px;
    --tooltip-z-index: 1080;

    /* Plain Variant Color Tokens (Default) */
    --tooltip-bg: var(--atoll-bg-surface-inverse, #222222);
    --tooltip-color: #FFFFFF;
    --tooltip-border: transparent;
    --tooltip-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  }

  :host([hidden]) {
    display: none !important;
  }

  .atoll-tooltip-wrapper {
    display: inline-flex;
    position: relative;
  }

  /* -------------------------------------------------------------------------- */
  /* Tooltip Bubble Base (Declared ONCE)                                        */
  /* -------------------------------------------------------------------------- */

  .atoll-tooltip-bubble {
    position: absolute;
    z-index: var(--tooltip-z-index);
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: max-content;
    max-width: var(--tooltip-max-width);
    padding: var(--tooltip-padding-y) var(--tooltip-padding-x);
    background-color: var(--tooltip-bg);
    color: var(--tooltip-color);
    border: 1px solid var(--tooltip-border);
    border-radius: var(--tooltip-radius);
    box-shadow: var(--tooltip-shadow);
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-caption-1, 12px);
    line-height: 1.35;
    box-sizing: border-box;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease-in-out, transform 0.15s ease-in-out;
  }

  :host([open]) .atoll-tooltip-bubble {
    opacity: 1;
    pointer-events: auto;
  }

  .atoll-tooltip-bubble::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
  }

  /* -------------------------------------------------------------------------- */
  /* Placement Variants (Top, Bottom, Left, Right)                              */
  /* -------------------------------------------------------------------------- */

  /* TOP Placement (Default) */
  :host .atoll-tooltip-bubble,
  :host([placement="top"]) .atoll-tooltip-bubble {
    bottom: calc(100% + var(--tooltip-arrow-size) + 4px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
  }

  :host([open]) .atoll-tooltip-bubble,
  :host([placement="top"][open]) .atoll-tooltip-bubble {
    transform: translateX(-50%) translateY(0);
  }

  :host .atoll-tooltip-bubble::after,
  :host([placement="top"]) .atoll-tooltip-bubble::after {
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-width: var(--tooltip-arrow-size) var(--tooltip-arrow-size) 0;
    border-color: var(--tooltip-bg) transparent transparent;
  }

  /* BOTTOM Placement */
  :host([placement="bottom"]) .atoll-tooltip-bubble {
    top: calc(100% + var(--tooltip-arrow-size) + 4px);
    bottom: auto;
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
  }

  :host([placement="bottom"][open]) .atoll-tooltip-bubble {
    transform: translateX(-50%) translateY(0);
  }

  :host([placement="bottom"]) .atoll-tooltip-bubble::after {
    bottom: 100%;
    top: auto;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 var(--tooltip-arrow-size) var(--tooltip-arrow-size);
    border-color: transparent transparent var(--tooltip-bg);
  }

  /* LEFT Placement */
  :host([placement="left"]) .atoll-tooltip-bubble {
    right: calc(100% + var(--tooltip-arrow-size) + 4px);
    left: auto;
    top: 50%;
    bottom: auto;
    transform: translateY(-50%) translateX(4px);
  }

  :host([placement="left"][open]) .atoll-tooltip-bubble {
    transform: translateY(-50%) translateX(0);
  }

  :host([placement="left"]) .atoll-tooltip-bubble::after {
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    border-width: var(--tooltip-arrow-size) 0 var(--tooltip-arrow-size) var(--tooltip-arrow-size);
    border-color: transparent transparent transparent var(--tooltip-bg);
  }

  /* RIGHT Placement */
  :host([placement="right"]) .atoll-tooltip-bubble {
    left: calc(100% + var(--tooltip-arrow-size) + 4px);
    top: 50%;
    bottom: auto;
    transform: translateY(-50%) translateX(-4px);
  }

  :host([placement="right"][open]) .atoll-tooltip-bubble {
    transform: translateY(-50%) translateX(0);
  }

  :host([placement="right"]) .atoll-tooltip-bubble::after {
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    border-width: var(--tooltip-arrow-size) var(--tooltip-arrow-size) var(--tooltip-arrow-size) 0;
    border-color: transparent var(--tooltip-bg) transparent transparent;
  }

  /* -------------------------------------------------------------------------- */
  /* Action Variant Modifiers                                                   */
  /* -------------------------------------------------------------------------- */

  :host([variant="action"]) {
    --tooltip-bg: var(--atoll-bg-surface-primary, #FFFFFF);
    --tooltip-color: var(--atoll-text-primary, #111111);
    --tooltip-border: var(--atoll-border-subtle, #EFEFEF);
    --tooltip-padding-x: 16px;
    --tooltip-padding-y: 12px;
    --tooltip-radius: 12px;
    --tooltip-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .atoll-tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: var(--atoll-font-weight-bold, 700);
    font-size: var(--atoll-font-size-body-2, 14px);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      text: {
        type: String,
        default: ''
      },
      title: {
        type: String,
        default: ''
      },
      placement: {
        type: String,
        default: 'top',
        values: ['top', 'bottom', 'left', 'right']
      },
      variant: {
        type: String,
        default: 'plain',
        values: ['plain', 'action']
      },
      trigger: {
        type: String,
        default: 'hover',
        values: ['hover', 'click', 'manual']
      },
      open: Boolean,
      closeable: Boolean
    },

    getters: {
      computedRole: (state) => (state.variant === 'action' ? 'dialog' : 'tooltip'),
      isAriaHidden: (state) => (state.open ? 'false' : 'true'),
      hideHeader: (state) => !state.title && !state.closeable,
      hideCloseBtn: (state) => !state.closeable
    },

    client: ({ state, refs, root, observe, signal }) => {
      const triggerEl = refs('trigger')
      const closeBtn = refs('closeBtn')

      const setOpen = (isOpen) => {
        state.open = isOpen
        if (isOpen) {
          if (!root.hasAttribute('open')) {
            root.setAttribute('open', '')
          }
        } else {
          if (root.hasAttribute('open')) {
            root.removeAttribute('open')
          }
        }
      }

      const show = () => setOpen(true)
      const hide = () => setOpen(false)

      triggerEl.addEventListener('mouseenter', () => {
        if (state.trigger === 'hover') {
          show()
        }
      }, { signal })

      triggerEl.addEventListener('mouseleave', () => {
        if (state.trigger === 'hover') {
          hide()
        }
      }, { signal })

      triggerEl.addEventListener('focusin', () => {
        if (state.trigger === 'hover') {
          show()
        }
      }, { signal })

      triggerEl.addEventListener('focusout', () => {
        if (state.trigger === 'hover') {
          hide()
        }
      }, { signal })

      triggerEl.addEventListener('click', () => {
        if (state.trigger === 'click') {
          setOpen(!state.open)
        }
      }, { signal })

      closeBtn.addEventListener('click', (event) => {
        event.stopPropagation()
        hide()
        root.dispatchEvent(
          new CustomEvent('atoll-tooltip-close', {
            bubbles: true,
            composed: true
          })
        )
      }, { signal })

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.open) {
          hide()
        }
      }, { signal })

      document.addEventListener('pointerdown', (event) => {
        if (state.open && state.trigger === 'click') {
          const isClickInside = root.contains(event.target) || (event.composedPath && event.composedPath().includes(root))
          if (!isClickInside) {
            hide()
          }
        }
      }, { signal })

      if (observe) {
        observe('open', (val) => {
          const isOpen = Boolean(val === true || val === 'true' || val === '')
          setOpen(isOpen)
        })
      }

      // Initial check on mount
      if (root.hasAttribute('open') || state.open) {
        setOpen(true)
      }

      root.show = show
      root.hide = hide
    }
  })
</script>
