<template id="atoll-slideshow">
  <div class="atoll-slideshow d-flex flex-column position-relative w-100 h-100 overflow-hidden {{ layoutClasses }}">
    <slot name="header"></slot>

    <div ref="viewport" class="atoll-slideshow-viewport flex-grow-1 w-100 h-100 position-relative overflow-hidden">
      <div ref="container" class="atoll-slideshow-container d-flex h-100 w-100">
        <slot></slot>
      </div>
    </div>

    <slot name="controls"></slot>

    <slot name="overlay"></slot>
    <slot name="footer"></slot>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      loop: {
        type: Boolean,
        default: false
      },
      dragFree: {
        type: Boolean,
        default: false
      },
      align: {
        type: String,
        default: 'center'
      },
      axis: {
        type: String,
        default: 'x'
      },
      containScroll: {
        type: String,
        default: 'trimSnaps'
      },
      hideControls: {
        type: Boolean,
        default: false
      },
      watchSlides: {
        type: Boolean,
        default: true
      },
      keyboard: {
        type: Boolean,
        default: true
      },
      layoutClasses: {
        type: String,
        default: ''
      }
    },
    slots: {
      controls (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }

        if (!state.hideControls) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-slideshow-controls'

          const btnPrev = document.createElement('button')
          btnPrev.type = 'button'
          btnPrev.className = 'atoll-slideshow-nav-btn prev'
          btnPrev.setAttribute('aria-label', 'Previous slide')

          const iconPrev = document.createElement('atoll-icon')
          iconPrev.setAttribute('name', 'chevron-left')
          iconPrev.setAttribute('size', '32')
          btnPrev.appendChild(iconPrev)

          const btnNext = document.createElement('button')
          btnNext.type = 'button'
          btnNext.className = 'atoll-slideshow-nav-btn next'
          btnNext.setAttribute('aria-label', 'Next slide')
  
          const iconNext = document.createElement('atoll-icon')
          iconNext.setAttribute('name', 'chevron-right')
          iconNext.setAttribute('size', '32')
          btnNext.appendChild(iconNext)

          wrapper.appendChild(btnPrev)
          wrapper.appendChild(btnNext)
          return [wrapper]
        }

        return null
      }
    },
    client: async ({ root, refs, state, observe, signal }) => {
      const viewport = refs('viewport')
      const container = refs('container')

      let embla = null
      let mutationObserver = null
      let reInitTimeout = null

      const getOptions = () => ({
        loop: state.loop,
        dragFree: state.dragFree,
        align: state.align || 'center',
        axis: state.axis || 'x',
        containScroll: state.containScroll || 'trimSnaps',
        watchSlides: false
      })

      // Expose public methods on host immediately
      root.getContainer = () => container
      root.getViewport = () => viewport
      root.getSelectedIndex = () => (embla ? embla.selectedScrollSnap() : 0)
      root.canScrollPrev = () => (embla ? embla.canScrollPrev() : false)
      root.canScrollNext = () => (embla ? embla.canScrollNext() : false)
      root.prev = () => embla?.scrollPrev()
      root.scrollPrev = () => embla?.scrollPrev()
      root.next = () => embla?.scrollNext()
      root.scrollNext = () => embla?.scrollNext()
      root.to = (index, jump = false) => embla?.scrollTo(index, jump)
      root.scrollTo = (index, jump = false) => embla?.scrollTo(index, jump)
      root.reInit = (opts) => embla?.reInit(opts || getOptions())
      root.destroy = () => embla?.destroy()
      root.getEmbla = () => embla

      const updateNavButtons = () => {
        const btnPrev = root.querySelector('.atoll-slideshow-nav-btn.prev')
        const btnNext = root.querySelector('.atoll-slideshow-nav-btn.next')
  
        if (!embla) {
          return
        }

        const canPrev = embla.canScrollPrev()
        const canNext = embla.canScrollNext()
        if (btnPrev) {
          btnPrev.disabled = !canPrev
          btnPrev.setAttribute('aria-disabled', String(!canPrev))
        }

        if (btnNext) {
          btnNext.disabled = !canNext
          btnNext.setAttribute('aria-disabled', String(!canNext))
        }
      }

      const EmblaCarousel = (await import('embla-carousel')).default

      // Initialize Embla
      embla = EmblaCarousel(viewport, getOptions())
      let lastIndex = embla ? embla.selectedScrollSnap() : 0

      if (embla) {
        embla.on('select', () => {
          const newIndex = embla.selectedScrollSnap()
          if (newIndex !== lastIndex) {
            const prevIndex = lastIndex
            lastIndex = newIndex
            root.dispatchEvent(new CustomEvent('atoll-slideshow-select', {
              bubbles: true,
              composed: true,
              detail: {
                index: newIndex,
                previousIndex: prevIndex
              }
            }))
          }
          updateNavButtons()
        })

        embla.on('settle', () => {
          const idx = embla.selectedScrollSnap()
          root.dispatchEvent(new CustomEvent('atoll-slideshow-settle', {
            bubbles: true,
            composed: true,
            detail: { index: idx }
          }))
        })

        embla.on('scroll', () => {
          root.dispatchEvent(new CustomEvent('atoll-slideshow-scroll', {
            bubbles: true,
            composed: true,
            detail: { progress: embla.scrollProgress() }
          }))
        })
      }

      viewport.addEventListener('pointerdown', () => {
        root.dispatchEvent(new CustomEvent('atoll-slideshow-dragstart', {
          bubbles: true,
          composed: true
        }))
      }, { signal })

      viewport.addEventListener('touchstart', () => {
        root.dispatchEvent(new CustomEvent('atoll-slideshow-dragstart', {
          bubbles: true,
          composed: true
        }))
      }, { signal })

      root.addEventListener('click', (e) => {
        const btnPrev = e.target.closest('.atoll-slideshow-nav-btn.prev')
        const btnNext = e.target.closest('.atoll-slideshow-nav-btn.next')
        if (btnPrev) {
          embla?.scrollPrev()
        } else if (btnNext) {
          embla?.scrollNext()
        }
      }, { signal })

      if (state.keyboard) {
        window.addEventListener('keydown', (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase()
          if (tag === 'input' || tag === 'textarea') {
            return
          }
  
          if (e.key === 'ArrowLeft') {
            e.preventDefault()
            embla?.scrollPrev()
          } else if (e.key === 'ArrowRight') {
            e.preventDefault()
            embla?.scrollNext()
          }
        }, { signal })
      }

      mutationObserver = new MutationObserver(() => {
        if (state.watchSlides && embla) {
          clearTimeout(reInitTimeout)
          reInitTimeout = setTimeout(() => {
            if (embla) {
              embla.reInit()
              updateNavButtons()
            }
          }, 16)
        }
      })
      mutationObserver.observe(container, { childList: true })

      ;['loop', 'dragFree', 'align', 'axis', 'containScroll'].forEach(attr => {
        observe(attr, () => {
          if (embla) {
            embla.reInit(getOptions())
            updateNavButtons()
          }
        })
      })

      updateNavButtons()

      root.dispatchEvent(new CustomEvent('atoll-slideshow-init', {
        bubbles: true,
        composed: true,
        detail: {
          embla,
          index: lastIndex
        }
      }))

      // Automatic teardown on unmount
      signal.addEventListener('abort', () => {
        clearTimeout(reInitTimeout)
        mutationObserver?.disconnect()
        embla?.destroy()
        embla = null
      })
    }
  })
</script>
