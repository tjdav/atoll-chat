<template id="atoll-slideshow">
  <div class="atoll-slideshow d-flex flex-column position-relative w-100 h-100 overflow-hidden">
    <slot name="header"></slot>

    <div ref="viewport" class="atoll-slideshow-viewport flex-grow-1 flex-shrink-1 w-100 position-relative overflow-hidden">
      <div ref="container" class="atoll-slideshow-container d-flex h-100 w-100">
        <slot></slot>
      </div>
    </div>

    <slot name="controls"></slot>

    <slot name="overlay"></slot>
    <slot name="footer"></slot>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
    height: 100%;
    position: relative;

    --slideshow-nav-bg: rgba(0, 0, 0, 0.4);
    --slideshow-nav-hover-bg: rgba(0, 0, 0, 0.7);
    --slideshow-nav-color: #ffffff;
    --slideshow-nav-size: 48px;
    --slideshow-nav-offset: 1rem;
    --slideshow-z-index: 5;
  }

  .atoll-slideshow {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .atoll-slideshow-viewport {
    position: relative;
    width: 100%;
    flex: 1 1 0% !important;
    min-height: 0 !important;
    height: 0 !important;
    overflow: hidden;
    touch-action: pan-y pinch-zoom;
  }

  .atoll-slideshow-container,
  .atoll-slideshow-container slot:not([name]) {
    display: flex;
    height: 100%;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .atoll-slideshow-container > *,
  .atoll-slideshow-container slot:not([name]) > * {
    flex: 0 0 100%;
    min-width: 0;
    height: 100%;
    position: relative;
  }

  .atoll-slideshow-controls {
    pointer-events: none;
  }

  .atoll-slideshow-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: var(--slideshow-z-index);
    width: var(--slideshow-nav-size);
    height: var(--slideshow-nav-size);
    border-radius: 50%;
    background-color: var(--slideshow-nav-bg);
    color: var(--slideshow-nav-color);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
    cursor: pointer;
    pointer-events: auto;
  }

  .atoll-slideshow-nav-btn:hover {
    background-color: var(--slideshow-nav-hover-bg);
  }

  .atoll-slideshow-nav-btn:active {
    transform: translateY(-50%) scale(0.95);
  }

  .atoll-slideshow-nav-btn:disabled,
  .atoll-slideshow-nav-btn[aria-disabled="true"],
  .atoll-slideshow-nav-btn[disabled] {
    opacity: 0;
    pointer-events: none;
  }

  .atoll-slideshow-nav-btn.prev {
    left: var(--slideshow-nav-offset);
  }

  .atoll-slideshow-nav-btn.next {
    right: var(--slideshow-nav-offset);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      loop: Boolean,
      dragFree: Boolean,
      align: {
        type: String,
        default: 'center',
        values: ['start', 'center', 'end']
      },
      axis: {
        type: String,
        default: 'x',
        values: ['x', 'y']
      },
      containScroll: {
        type: String,
        default: 'trimSnaps',
        values: ['trimSnaps', 'keepSnaps', 'false']
      },
      hideControls: Boolean,
      watchSlides: {
        type: Boolean,
        default: true
      },
      keyboard: {
        type: Boolean,
        default: true
      }
    },

    slots: {
      controls (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }

        if (!state.hideControls) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-slideshow-controls'

          const btnPrev = document.createElement('atoll-button')
          btnPrev.setAttribute('variant', 'ghost')
          btnPrev.setAttribute('size', 'lg')
          btnPrev.setAttribute('icon-only', 'true')
          btnPrev.setAttribute('pill', 'true')
          btnPrev.className = 'atoll-slideshow-nav-btn prev'
          btnPrev.setAttribute('aria-label', 'Previous slide')

          const iconPrev = document.createElement('atoll-icon')
          iconPrev.setAttribute('name', 'chevron-left')
          iconPrev.setAttribute('size', '32')
          btnPrev.appendChild(iconPrev)

          const btnNext = document.createElement('atoll-button')
          btnNext.setAttribute('variant', 'ghost')
          btnNext.setAttribute('size', 'lg')
          btnNext.setAttribute('icon-only', 'true')
          btnNext.setAttribute('pill', 'true')
          btnNext.className = 'atoll-slideshow-nav-btn next'
          btnNext.setAttribute('aria-label', 'Next slide')

          const iconNext = document.createElement('atoll-icon')
          iconNext.setAttribute('name', 'chevron-right')
          iconNext.setAttribute('size', '32')
          btnNext.appendChild(iconNext)

          wrapper.appendChild(btnPrev)
          wrapper.appendChild(btnNext)
          return [wrapper]
        }

        return null
      }
    },

    client: async ({ root, refs, state, observe, signal }) => {
      const viewport = refs('viewport')
      const container = refs('container')

      let embla = null
      let mutationObserver = null
      let reInitTimeout = null

      const getSlideNodes = () => {
        const slotEl = container ? container.querySelector('slot:not([name])') : null
        if (slotEl) {
          const assigned = typeof slotEl.assignedElements === 'function' ? slotEl.assignedElements() : []
          if (assigned.length > 0) {
            return assigned
          }
          const slotChildren = Array.from(slotEl.children).filter(el => el.nodeType === 1)
          if (slotChildren.length > 0) {
            return slotChildren
          }
        }
        // Fallback to non-slotted children or direct root children
        const directChildren = Array.from(root.children).filter(el => {
          if (el.nodeType !== 1) {
            return false
          }
          const slotAttr = el.getAttribute('slot')
          return !slotAttr || (slotAttr !== 'header' && slotAttr !== 'footer' && slotAttr !== 'controls' && slotAttr !== 'overlay')
        })
        if (directChildren.length > 0) {
          return directChildren
        }

        return Array.from(container?.children || []).filter(el => el.tagName !== 'SLOT')
      }

      const getOptions = () => ({
        slides: getSlideNodes(),
        loop: state.loop,
        dragFree: state.dragFree,
        align: state.align || 'center',
        axis: state.axis || 'x',
        containScroll: state.containScroll || 'trimSnaps',
        watchSlides: false
      })

      // Expose public methods on host immediately
      root.getContainer = () => container
      root.getViewport = () => viewport
      root.getSelectedIndex = () => (embla ? embla.selectedScrollSnap() : 0)
      root.canScrollPrev = () => (embla ? embla.canScrollPrev() : false)
      root.canScrollNext = () => (embla ? embla.canScrollNext() : false)
      root.prev = () => embla?.scrollPrev()
      root.scrollPrev = () => embla?.scrollPrev()
      root.next = () => embla?.scrollNext()
      root.scrollNext = () => embla?.scrollNext()
      root.to = (index, jump = false) => embla?.scrollTo(index, jump)
      root.scrollTo = (index, jump = false) => embla?.scrollTo(index, jump)
      root.reInit = (opts) => embla?.reInit(opts || getOptions())
      root.destroy = () => embla?.destroy()
      root.getEmbla = () => embla

      const updateNavButtons = () => {
        const btnPrev = root.querySelector('.atoll-slideshow-nav-btn.prev')
        const btnNext = root.querySelector('.atoll-slideshow-nav-btn.next')

        if (!embla) {
          return
        }

        const canPrev = embla.canScrollPrev()
        const canNext = embla.canScrollNext()
        if (btnPrev) {
          if (canPrev) {
            btnPrev.removeAttribute('disabled')
            btnPrev.setAttribute('aria-disabled', 'false')
          } else {
            btnPrev.setAttribute('disabled', 'true')
            btnPrev.setAttribute('aria-disabled', 'true')
          }
        }

        if (btnNext) {
          if (canNext) {
            btnNext.removeAttribute('disabled')
            btnNext.setAttribute('aria-disabled', 'false')
          } else {
            btnNext.setAttribute('disabled', 'true')
            btnNext.setAttribute('aria-disabled', 'true')
          }
        }
      }

      const EmblaCarousel = (await import('embla-carousel')).default

      embla = EmblaCarousel(viewport, getOptions())
      let lastIndex = embla ? embla.selectedScrollSnap() : 0

      if (embla) {
        embla.on('init', updateNavButtons)
        embla.on('reInit', updateNavButtons)
        embla.on('select', () => {
          const newIndex = embla.selectedScrollSnap()
          if (newIndex !== lastIndex) {
            const prevIndex = lastIndex
            lastIndex = newIndex
            root.dispatchEvent(new CustomEvent('atoll-slideshow-select', {
              bubbles: true,
              composed: true,
              detail: {
                index: newIndex,
                previousIndex: prevIndex
              }
            }))
          }
          updateNavButtons()
        })

        embla.on('settle', () => {
          const idx = embla.selectedScrollSnap()
          root.dispatchEvent(new CustomEvent('atoll-slideshow-settle', {
            bubbles: true,
            composed: true,
            detail: { index: idx }
          }))
        })

        embla.on('scroll', () => {
          root.dispatchEvent(new CustomEvent('atoll-slideshow-scroll', {
            bubbles: true,
            composed: true,
            detail: { progress: embla.scrollProgress() }
          }))
        })
      }

      viewport.addEventListener('pointerdown', () => {
        root.dispatchEvent(new CustomEvent('atoll-slideshow-dragstart', {
          bubbles: true,
          composed: true
        }))
      }, { signal })

      viewport.addEventListener('touchstart', () => {
        root.dispatchEvent(new CustomEvent('atoll-slideshow-dragstart', {
          bubbles: true,
          composed: true
        }))
      }, {
        signal,
        passive: true
      })

      root.addEventListener('click', (e) => {
        const btnPrev = e.target.closest('.atoll-slideshow-nav-btn.prev')
        const btnNext = e.target.closest('.atoll-slideshow-nav-btn.next')
        if (btnPrev) {
          embla?.scrollPrev()
        } else if (btnNext) {
          embla?.scrollNext()
        }
      }, { signal })

      if (state.keyboard) {
        window.addEventListener('keydown', (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase()
          if (tag === 'input' || tag === 'textarea' || tag === 'select') {
            return
          }

          if (e.key === 'ArrowLeft') {
            e.preventDefault()
            embla?.scrollPrev()
          } else if (e.key === 'ArrowRight') {
            e.preventDefault()
            embla?.scrollNext()
          }
        }, { signal })
      }

      mutationObserver = new MutationObserver(() => {
        if (state.watchSlides && embla) {
          clearTimeout(reInitTimeout)
          reInitTimeout = setTimeout(() => {
            if (embla) {
              embla.reInit(getOptions())
              updateNavButtons()
            }
          }, 0)
        }
      })
      mutationObserver.observe(container, {
        childList: true,
        subtree: true
      })

      ;['loop', 'dragFree', 'align', 'axis', 'containScroll'].forEach(attr => {
        observe(attr, () => {
          if (embla) {
            embla.reInit(getOptions())
            updateNavButtons()
          }
        })
      })

      updateNavButtons()

      root.dispatchEvent(new CustomEvent('atoll-slideshow-init', {
        bubbles: true,
        composed: true,
        detail: {
          embla,
          index: lastIndex
        }
      }))

      signal.addEventListener('abort', () => {
        clearTimeout(reInitTimeout)
        mutationObserver?.disconnect()
        embla?.destroy()
        embla = null
      })
    }
  })
</script>
