<template id="atoll-back-button">
  <div class="d-inline-block me-3">
    <atoll-button 
      variant="ghost" 
      leading-icon="chevron-left" 
      icon-only="true" 
      pill="true"
      ref="btn"
      aria-label="Go back"
    ></atoll-button>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, eventBus, signal }) => {
      const { $bus } = eventBus
      const btn = refs('btn')
      const testId = root.getAttribute('data-testid')
  
      if (testId && btn) {
        btn.setAttribute('data-testid', testId)
      }

      // Dispatches a unified router:back event on button click.
      root.addEventListener('click', (event) => {
        event.preventDefault()
        event.stopPropagation()
        $bus.emit('router:back')
      }, { signal })
    }
  })
</script>
