<template id="atoll-list-header">
  <div 
    ref="headerRoot"
    class="atoll-list-header" 
    role="{{ headerRole }}"
    tabindex="{{ headerTabindex }}"
  >
    <!-- Left Main Content Area -->
    <div class="atoll-list-header-main">
      <slot name="leading"></slot>

      <div class="atoll-list-header-titles">
        <div class="atoll-list-header-title-row">
          <span>{{ title }}</span>
          <slot></slot> <!-- Default slot for custom inline title content -->

          <!-- Count Badge Slot -->
          <slot name="badge"></slot>

          <!-- Sorting Dropdown Indicator Slot -->
          <slot name="dropdown"></slot>
        </div>

        <!-- Optional Subtitle -->
        <span class="atoll-list-header-subtitle" hidden="{{ hideSubtitle }}">
          {{ subtitle }}
        </span>
      </div>
    </div>

    <!-- Right Trailing Action Area -->
    <div class="atoll-list-header-actions">
      <!-- Trailing Action Slot -->
      <slot name="action"></slot>

      <!-- Action Button Slot -->
      <slot name="actionButton"></slot>

      <!-- Accordion Chevron Trigger Slot -->
      <slot name="chevron"></slot>
    </div>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;

    --list-header-height: 44px;
    --list-header-padding: 8px 16px;
    --list-header-font-size: var(--atoll-font-size-body-2, 14px);
    --list-header-font-weight: 600;
    --list-header-bg: transparent;
    --list-header-bg-hover: var(--atoll-bg-surface-secondary, #F5F5F5);
    --list-header-title-color: var(--atoll-text-primary, #111111);
    --list-header-subtitle-color: var(--atoll-text-secondary, #555555);
    --list-header-dropdown-color: var(--atoll-text-secondary, #666666);
    --list-header-border: var(--atoll-border-subtle, #DFDFDF);
    --list-header-border-radius: 0;
  }

  :host([hidden]) {
    display: none !important;
  }

  /* Size Modifiers */
  :host([size="sm"]) {
    --list-header-height: 36px;
    --list-header-padding: 4px 16px;
    --list-header-font-size: var(--atoll-font-size-caption-1, 12px);
  }

  :host([size="lg"]) {
    --list-header-height: 52px;
    --list-header-padding: 8px 16px;
    --list-header-font-size: var(--atoll-font-size-body-1, 16px);
  }

  /* Variant Modifiers */
  :host([variant="list"]),
  :host(:not([variant])) {
    border-bottom: 1px solid var(--list-header-border);
  }

  :host([variant="card"]) {
    --list-header-padding: 12px 20px;
    --list-header-bg: var(--atoll-bg-surface-primary, #FFFFFF);
    --list-header-border-radius: var(--atoll-card-border-radius, 12px) var(--atoll-card-border-radius, 12px) 0 0;
    border-bottom: 1px solid var(--list-header-border);
  }

  :host([variant="accordion"]),
  :host([collapsible]) {
    cursor: pointer;
  }

  :host([variant="accordion"]:hover),
  :host([collapsible]:hover) {
    background-color: var(--list-header-bg-hover);
  }

  :host([expanded]) .atoll-list-header-chevron {
    transform: rotate(180deg);
  }

  /* Base Container Layout */
  .atoll-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: var(--list-header-height);
    padding: var(--list-header-padding);
    background-color: var(--list-header-bg);
    border-radius: var(--list-header-border-radius);
    box-sizing: border-box;
    user-select: none;
    transition: background-color 0.15s ease-in-out;
  }

  .atoll-list-header-main {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .atoll-list-header-titles {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .atoll-list-header-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--atoll-font-sans-serif, sans-serif);
    font-size: var(--list-header-font-size);
    font-weight: var(--list-header-font-weight);
    color: var(--list-header-title-color);
    line-height: 1.2;
  }

  .atoll-list-header-dropdown-icon {
    display: inline-flex;
    align-items: center;
    color: var(--list-header-dropdown-color);
    transition: transform 0.15s ease-in-out;
  }

  .atoll-list-header-subtitle {
    font-size: var(--atoll-font-size-caption-1, 12px);
    color: var(--list-header-subtitle-color);
    font-weight: var(--atoll-font-weight-regular, 400);
    margin-top: 2px;
  }

  .atoll-list-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .atoll-list-header-chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--list-header-dropdown-color);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Dark Theme Overrides */
  :host-context([data-atoll-theme="dark"]),
  :host-context([data-bs-theme="dark"]),
  [data-atoll-theme="dark"] atoll-list-header,
  [data-bs-theme="dark"] atoll-list-header {
    --list-header-title-color: var(--atoll-text-primary, #FFFFFF);
    --list-header-subtitle-color: var(--atoll-text-secondary, #B0B0B0);
    --list-header-border: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.1));
    --list-header-bg-hover: var(--atoll-bg-surface-secondary, #1F1F1F);
  }

  :host-context([data-atoll-theme="dark"]) :host([variant="card"]),
  :host-context([data-bs-theme="dark"]) :host([variant="card"]),
  [data-atoll-theme="dark"] atoll-list-header[variant="card"],
  [data-bs-theme="dark"] atoll-list-header[variant="card"] {
    --list-header-bg: var(--atoll-bg-surface-primary, #161616);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      subtitle: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        default: 'list',
        values: ['list', 'card', 'accordion']
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      badge: {
        type: String,
        default: ''
      },
      actionText: {
        type: String,
        default: ''
      },
      dropdown: Boolean,
      expanded: Boolean,
      collapsible: Boolean
    },

    slots: {
      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (state.badge) {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      dropdown (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (state.dropdown) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-dropdown-icon'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'down')
          icon.setAttribute('size', '14')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      actionButton (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (state.actionText) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('variant', 'ghost')
          btn.setAttribute('size', 'sm')
          btn.setAttribute('text', state.actionText)
          return [btn]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (state.variant === 'accordion' || Boolean(state.collapsible)) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-down')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      headerRole: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? 'button' : 'region'),
      headerTabindex: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? '0' : '-1'),
      isAriaExpanded: (state) => {
        if (state.variant !== 'accordion' && !state.collapsible) return null
        return state.expanded ? 'true' : 'false'
      },
      hideSubtitle: (state) => !state.subtitle
    },

    client: ({ state, refs, root, signal, observe }) => {
      const header = refs('headerRoot')

      const syncAriaExpanded = () => {
        if (state.variant === 'accordion' || state.collapsible) {
          header.setAttribute('aria-expanded', state.expanded ? 'true' : 'false')
        } else {
          header.removeAttribute('aria-expanded')
        }
      }
      syncAriaExpanded()
      if (observe) {
        observe('expanded', syncAriaExpanded)
        observe('variant', syncAriaExpanded)
        observe('collapsible', syncAriaExpanded)
      }

      const toggleAccordion = () => {
        if (state.variant === 'accordion' || state.collapsible) {
          const isExpanded = !state.expanded
          state.expanded = isExpanded
          if (isExpanded) {
            root.setAttribute('expanded', '')
          } else {
            root.removeAttribute('expanded')
          }

          root.dispatchEvent(
            new CustomEvent('atoll-header-toggle', {
              bubbles: true,
              composed: true,
              detail: { expanded: isExpanded }
            })
          )
        }
      }

      header.addEventListener('click', toggleAccordion, { signal })

      header.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          toggleAccordion()
        }
      }, { signal })
    }
  })
</script>
