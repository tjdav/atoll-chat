<template id="atoll-list-header">
  <div 
    ref="headerRoot"
    class="{{ headerClasses }}" 
    role="{{ headerRole }}"
    tabindex="{{ headerTabindex }}"
    aria-expanded="{{ isAriaExpanded }}"
  >
    <!-- Left Main Content Area -->
    <div class="atoll-list-header-main">
      <slot name="leading"></slot>

      <div class="atoll-list-header-titles">
        <div class="atoll-list-header-title-row">
          <span>{{ title }}</span>
          <slot></slot> <!-- Default slot for custom inline title content -->

          <!-- Count Badge Slot -->
          <slot name="badge"></slot>

          <!-- Sorting Dropdown Indicator Slot -->
          <slot name="dropdown"></slot>
        </div>

        <!-- Optional Subtitle -->
        <span class="atoll-list-header-subtitle" hidden="{{ hideSubtitle }}">
          {{ subtitle }}
        </span>
      </div>
    </div>

    <!-- Right Trailing Action Area -->
    <div class="atoll-list-header-actions">
      <!-- Trailing Action Slot -->
      <slot name="action"></slot>

      <!-- Action Button Slot -->
      <slot name="actionButton"></slot>

      <!-- Accordion Chevron Trigger Slot -->
      <slot name="chevron"></slot>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      subtitle: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        default: 'list'
      },
      size: {
        type: String,
        default: 'md'
      },
      badge: {
        type: String,
        default: ''
      },
      actionText: {
        type: String,
        default: ''
      },
      dropdown: Boolean,
      expanded: Boolean,
      collapsible: Boolean
    },

    slots: {
      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.badge) {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      dropdown (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.dropdown) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-dropdown-icon'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'down')
          icon.setAttribute('size', '14')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      actionButton (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.actionText) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('variant', 'ghost')
          btn.setAttribute('size', 'sm')
          btn.setAttribute('text', state.actionText)
          return [btn]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.variant === 'accordion' || Boolean(state.collapsible)) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-down')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      isAccordion: (state) => state.variant === 'accordion' || Boolean(state.collapsible),

      headerRole: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? 'button' : 'region'),

      headerTabindex: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? '0' : '-1'),

      isAriaExpanded: (state) => {
        if (!state.isAccordion) {
          return null
        }
        return state.expanded ? 'true' : 'false'
      },

      hideSubtitle: (state) => !state.subtitle,

      headerClasses: (state) => {
        const classes = ['atoll-list-header']

        if (state.variant) {
          classes.push(`atoll-list-header-${state.variant}`)
        } else {
          classes.push('atoll-list-header-list')
        }

        if (state.size) {
          classes.push(`atoll-list-header-${state.size}`)
        } else {
          classes.push('atoll-list-header-md')
        }

        if (state.expanded && (state.variant === 'accordion' || state.collapsible)) {
          classes.push('atoll-list-header-expanded')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      const header = refs('headerRoot')

      const toggleAccordion = () => {
        if (state.variant === 'accordion' || state.collapsible) {
          state.expanded = !state.expanded

          // Dispatch custom event for parent accordion containers
          root.dispatchEvent(
            new CustomEvent('atoll-header-toggle', {
              bubbles: true,
              composed: true,
              detail: { expanded: state.expanded }
            })
          )
        }
      }

      header.addEventListener('click', toggleAccordion)

      header.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          toggleAccordion()
        }
      })

      // Observe the dynamic "expanded" attribute from parent updates
      observe('expanded', (val) => {
        state.expanded = Boolean(val)
      })
    }
  })
</script>
