<template id="atoll-list-header">
  <div 
    ref="headerRoot"
    class="{{ headerClasses }}" 
    role="{{ headerRole }}"
    tabindex="{{ headerTabindex }}"
    aria-expanded="{{ isAriaExpanded }}"
  >
    <!-- Left Main Content Area -->
    <div class="atoll-list-header-main">
      <slot name="leading"></slot>

      <div class="atoll-list-header-titles">
        <div class="atoll-list-header-title-row">
          <span>{{ title }}</span>
          <slot></slot> <!-- Default slot for custom inline title content -->

          <!-- Count Badge Slot -->
          <slot name="badge"></slot>

          <!-- Sorting Dropdown Indicator Slot -->
          <slot name="dropdown"></slot>
        </div>

        <!-- Optional Subtitle -->
        <span class="atoll-list-header-subtitle" hidden="{{ hideSubtitle }}">
          {{ subtitle }}
        </span>
      </div>
    </div>

    <!-- Right Trailing Action Area -->
    <div class="atoll-list-header-actions">
      <!-- Trailing Action Slot -->
      <slot name="action"></slot>

      <!-- Action Button Slot -->
      <slot name="actionButton"></slot>

      <!-- Accordion Chevron Trigger Slot -->
      <slot name="chevron"></slot>
    </div>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .atoll-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: var(--atoll-list-header-height, 44px);
    padding: 8px 16px;
    background-color: var(--atoll-list-header-bg, transparent);
    box-sizing: border-box;
    user-select: none;
  }

  .atoll-list-header-main {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .atoll-list-header-titles {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .atoll-list-header-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--atoll-font-sans-serif, sans-serif);
    font-size: var(--atoll-font-size-body-2, 14px);
    font-weight: var(--atoll-font-weight-semibold, 600);
    color: var(--atoll-text-primary, #111111);
    line-height: 1.2;
  }

  .atoll-list-header-dropdown-icon {
    display: inline-flex;
    align-items: center;
    color: var(--atoll-text-secondary, #666666);
    transition: transform 0.15s ease-in-out;
  }

  .atoll-list-header-subtitle {
    font-size: var(--atoll-font-size-caption-1, 12px);
    color: var(--atoll-text-secondary, #555555);
    font-weight: var(--atoll-font-weight-regular, 400);
    margin-top: 2px;
  }

  .atoll-list-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .atoll-list-header-chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--atoll-text-secondary, #666666);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .atoll-list-header-list {
    border-bottom: 1px solid var(--atoll-border-subtle, #DFDFDF);
  }

  .atoll-list-header-card {
    padding: 12px 20px;
    border-bottom: 1px solid var(--atoll-border-subtle, #DFDFDF);
    background-color: var(--atoll-bg-surface-primary, #FFFFFF);
    border-top-left-radius: var(--atoll-card-border-radius, 12px);
    border-top-right-radius: var(--atoll-card-border-radius, 12px);
  }

  .atoll-list-header-accordion {
    cursor: pointer;
    transition: background-color 0.15s ease-in-out;

    &:hover {
      background-color: var(--atoll-bg-surface-secondary, #F5F5F5);
    }

    &.atoll-list-header-expanded .atoll-list-header-chevron {
      transform: rotate(180deg);
    }
  }

  .atoll-list-header-sm {
    --atoll-list-header-height: 36px;
    padding-top: 4px;
    padding-bottom: 4px;

    .atoll-list-header-title-row {
      font-size: var(--atoll-font-size-caption-1, 12px);
    }
  }

  .atoll-list-header-lg {
    --atoll-list-header-height: 52px;

    .atoll-list-header-title-row {
      font-size: var(--atoll-font-size-body-1, 16px);
    }
  }

  [data-atoll-theme="dark"] .atoll-list-header,
  [data-bs-theme="dark"] .atoll-list-header {
    --atoll-list-header-title-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-list-header-subtitle-color: var(--atoll-text-secondary, #B0B0B0);
    --atoll-list-header-border: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.1));
  }

  [data-atoll-theme="dark"] .atoll-list-header-card,
  [data-bs-theme="dark"] .atoll-list-header-card {
    background-color: var(--atoll-bg-surface-primary, #161616);
  }

  [data-atoll-theme="dark"] .atoll-list-header-accordion:hover,
  [data-bs-theme="dark"] .atoll-list-header-accordion:hover {
    background-color: var(--atoll-bg-surface-secondary, #1F1F1F);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      subtitle: {
        type: String,
        default: ''
      },
      variant: {
        type: String,
        default: 'list'
      },
      size: {
        type: String,
        default: 'md'
      },
      badge: {
        type: String,
        default: ''
      },
      actionText: {
        type: String,
        default: ''
      },
      dropdown: Boolean,
      expanded: Boolean,
      collapsible: Boolean
    },

    slots: {
      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.badge) {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      dropdown (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.dropdown) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-dropdown-icon'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'down')
          icon.setAttribute('size', '14')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      actionButton (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.actionText) {
          const btn = document.createElement('atoll-button')
          btn.setAttribute('variant', 'ghost')
          btn.setAttribute('size', 'sm')
          btn.setAttribute('text', state.actionText)
          return [btn]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (state.variant === 'accordion' || Boolean(state.collapsible)) {
          const span = document.createElement('span')
          span.className = 'atoll-list-header-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-down')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      isAccordion: (state) => state.variant === 'accordion' || Boolean(state.collapsible),

      headerRole: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? 'button' : 'region'),

      headerTabindex: (state) => (state.variant === 'accordion' || Boolean(state.collapsible) ? '0' : '-1'),

      isAriaExpanded: (state) => {
        if (!state.isAccordion) {
          return null
        }
        return state.expanded ? 'true' : 'false'
      },

      hideSubtitle: (state) => !state.subtitle,

      headerClasses: (state) => {
        const classes = ['atoll-list-header']

        if (state.variant) {
          classes.push(`atoll-list-header-${state.variant}`)
        } else {
          classes.push('atoll-list-header-list')
        }

        if (state.size) {
          classes.push(`atoll-list-header-${state.size}`)
        } else {
          classes.push('atoll-list-header-md')
        }

        if (state.expanded && (state.variant === 'accordion' || state.collapsible)) {
          classes.push('atoll-list-header-expanded')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root }) => {
      const header = refs('headerRoot')

      const toggleAccordion = () => {
        if (state.variant === 'accordion' || state.collapsible) {
          state.expanded = !state.expanded

          // Dispatch custom event for parent accordion containers
          root.dispatchEvent(
            new CustomEvent('atoll-header-toggle', {
              bubbles: true,
              composed: true,
              detail: { expanded: state.expanded }
            })
          )
        }
      }

      header.addEventListener('click', toggleAccordion)

      header.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          toggleAccordion()
        }
      })
    }
  })
</script>
