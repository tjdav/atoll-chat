<template id="atoll-list-item">
  <div 
    ref="itemRoot"
    class="{{ itemClasses }}" 
    role="{{ itemRole }}"
    tabindex="{{ itemTabindex }}"
  >
    <!-- 3-1. Left Area (Avatar, Thumbnail, Selection Control) -->
    <div class="atoll-list-item-left">
      <atoll-checkbox ref="checkbox" hidden="{{ hideCheckbox }}" checked="{{ checked }}"></atoll-checkbox>
      <atoll-icon ref="deleteIcon" name="minus-circle" size="24" color="var(--atoll-danger, #FF334B)" hidden="{{ hideDeleteIcon }}" class="atoll-list-item-delete-icon"></atoll-icon>
      <slot name="leading"></slot>
      <slot name="left"></slot>
    </div>

    <!-- 3-2. Center Text Area -->
    <div class="atoll-list-item-content">
      <div class="atoll-list-item-title-row">
        <span class="atoll-list-item-title">
          <slot>{{ title }}</slot>
        </span>

        <!-- Optional Top-Right Timestamp -->
        <span class="atoll-list-item-timestamp" hidden="{{ hideTimestamp }}">
          {{ timestamp }}
        </span>
      </div>

      <!-- Optional Subtitle / Description -->
      <span class="atoll-list-item-description" hidden="{{ hideDescription }}">
        {{ description }}
      </span>
    </div>

    <!-- 3-3. Right Area (Switch, Badge, Chevron, Custom Action) -->
    <div class="atoll-list-item-right">
      <slot name="right"></slot>

      <!-- Unread Count Badge -->
      <atoll-badge hidden="{{ hideBadge }}" count="{{ badge }}" size="sm"></atoll-badge>

      <!-- Navigation Directional Chevron -->
      <span class="atoll-list-item-chevron" hidden="{{ hideChevron }}">
        <atoll-icon name="chevron-right" size="18"></atoll-icon>
      </span>

      <!-- Reorder Drag Handle -->
      <span class="atoll-list-item-reorder" hidden="{{ hideReorderHandle }}">
        <atoll-icon name="reorder" size="24" color="var(--atoll-text-secondary, #777777)"></atoll-icon>
      </span>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    dependencies: ['atoll-checkbox', 'atoll-icon'],
    attributes: {
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      timestamp: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      chevron: Boolean,
      clickable: Boolean,
      highlighted: Boolean,
      disabled: Boolean,
      selected: Boolean,
      mode: {
        type: String,
        default: 'default'
      },
      checked: Boolean,
      value: {
        type: String,
        default: ''
      }
    },

    getters: {
      hideDescription: (state) => (!state.description ? 'true' : null),

      hideTimestamp: (state) => (!state.timestamp ? 'true' : null),

      hideBadge: (state) => (!state.badge || state.mode !== 'default' ? 'true' : null),

      hideChevron: (state) => (!state.chevron || state.mode !== 'default' ? 'true' : null),

      hideCheckbox: (state) => (state.mode === 'selection' ? null : 'true'),

      hideDeleteIcon: (state) => (state.mode === 'edit' ? null : 'true'),

      hideReorderHandle: (state) => (state.mode === 'reorder' ? null : 'true'),

      isClickable: (state) => state.clickable || state.chevron || state.mode === 'selection',

      itemRole: (state) => (state.isClickable ? 'button' : 'listitem'),

      itemTabindex: (state) => (state.isClickable && !state.disabled ? '0' : '-1'),

      itemClasses: (state) => {
        const classes = ['atoll-list-item']

        if (state.size) {
          classes.push(`atoll-list-item-${state.size}`)
        } else {
          classes.push('atoll-list-item-md')
        }

        if (state.isClickable) {
          classes.push('atoll-list-item-clickable')
        }
        if (state.highlighted) {
          classes.push('atoll-list-item-highlighted')
        }
        if (state.selected) {
          classes.push('atoll-list-item-selected')
          classes.push('active')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        if (state.mode && state.mode !== 'default') {
          classes.push(`atoll-list-item-mode-${state.mode}`)
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      const itemRoot = refs('itemRoot')
      const deleteIcon = refs('deleteIcon')
      const checkbox = refs('checkbox')

      const handleTrigger = () => {
        if (state.disabled) {
          return
        }

        if (state.mode === 'selection') {
          state.checked = !state.checked
          root.dispatchEvent(
            new CustomEvent('atoll-selection-change', {
              bubbles: true,
              composed: true,
              detail: [
                {
                  checked: state.checked,
                  value: state.value || state.title
                }
              ]
            })
          )
          return
        }

        root.dispatchEvent(
          new CustomEvent('atoll-item-click', {
            bubbles: true,
            composed: true,
            detail: {
              title: state.title,
              selected: state.selected
            }
          })
        )
      }

      if (itemRoot) {
        itemRoot.addEventListener('click', (e) => {
          handleTrigger(e)
        })

        itemRoot.addEventListener('keydown', (event) => {
          if (state.isClickable && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault()
            handleTrigger(event)
          }
        })
      }

      if (deleteIcon) {
        deleteIcon.addEventListener('click', (e) => {
          e.stopPropagation()
          e.preventDefault()
          root.dispatchEvent(
            new CustomEvent('atoll-item-action', {
              bubbles: true,
              composed: true,
              detail: {
                action: 'delete',
                value: state.value || state.title
              }
            })
          )
        })
      }

      if (checkbox) {
        checkbox.addEventListener('change', (e) => {
          e.stopPropagation()
          state.checked = e.detail.checked
          root.dispatchEvent(
            new CustomEvent('atoll-selection-change', {
              bubbles: true,
              composed: true,
              detail: [
                {
                  checked: state.checked,
                  value: state.value || state.title
                }
              ]
            })
          )
        })
      }

      // Expose properties on host element
      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
        },
        configurable: true
      })

      Object.defineProperty(root, 'mode', {
        get () {
          return state.mode
        },
        set (val) {
          state.mode = val || 'default'
        },
        configurable: true
      })

      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (val) {
          state.value = val || ''
        },
        configurable: true
      })

      // Sync attribute changes dynamically
      if (observe) {
        observe('selected', (val) => {
          state.selected = val === 'true' || val === true || val === ''
        })
        observe('disabled', (val) => {
          state.disabled = val === 'true' || val === true || val === ''
        })
        observe('highlighted', (val) => {
          state.highlighted = val === 'true' || val === true || val === ''
        })
        observe('clickable', (val) => {
          state.clickable = val === 'true' || val === true || val === ''
        })
        observe('title', (val) => {
          state.title = val
        })
        observe('description', (val) => {
          state.description = val
        })
        observe('timestamp', (val) => {
          state.timestamp = val
        })
        observe('badge', (val) => {
          state.badge = val
        })
        observe('mode', (val) => {
          state.mode = val || 'default'
        })
        observe('checked', (val) => {
          state.checked = val === 'true' || val === true || val === ''
        })
        observe('value', (val) => {
          state.value = val || ''
        })
      }
    }
  })
</script>
