<template id="atoll-list-item">
  <div 
    ref="itemRoot"
    class="{{ itemClasses }}" 
    role="{{ itemRole }}"
    tabindex="{{ itemTabindex }}"
  >
    <!-- Skeleton / Placeholder view on Loading -->
    <div class="placeholder-wave w-100 h-100 d-flex align-items-center gap-3" hidden="{{ showOnLoading }}">
      <div class="{{ avatarPlaceholderClasses }} placeholder rounded-circle flex-shrink-0"></div>
      <div class="flex-grow-1 d-flex flex-column gap-2">
        <div class="placeholder col-6" style="height: 14px; border-radius: 4px;"></div>
        <div class="placeholder col-8" style="height: 10px; border-radius: 3px;"></div>
      </div>
    </div>

    <!-- 3-1. Left Area (Avatar, Thumbnail, Selection Control) -->
    <div class="atoll-list-item-left" hidden="{{ hideOnLoading }}">
      <slot name="checkbox"></slot>
      <slot name="deleteIcon"></slot>
      <slot name="leading"></slot>
      <slot name="left"></slot>
    </div>

    <!-- 3-2. Center Text Area -->
    <div class="atoll-list-item-content" hidden="{{ hideOnLoading }}">
      <div class="atoll-list-item-title-row">
        <span class="atoll-list-item-title">
          <slot>{{ title }}</slot>
        </span>

        <!-- Optional Top-Right Timestamp -->
        <span class="atoll-list-item-timestamp" hidden="{{ hideTimestamp }}">
          {{ timestamp }}
        </span>
      </div>

      <!-- Optional Subtitle / Description -->
      <span class="atoll-list-item-description" hidden="{{ hideDescription }}">
        {{ description }}
      </span>
    </div>

    <!-- 3-3. Right Area (Switch, Badge, Chevron, Custom Action) -->
    <div class="atoll-list-item-right" hidden="{{ hideOnLoading }}">
      <slot name="right"></slot>

      <!-- Unread Count Badge -->
      <slot name="badge"></slot>

      <!-- Navigation Directional Chevron -->
      <slot name="chevron"></slot>

      <!-- Reorder Drag Handle -->
      <slot name="reorder"></slot>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      badgeVariant: {
        type: String,
        default: 'danger'
      },
      description: {
        type: String,
        default: ''
      },
      timestamp: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      chevron: Boolean,
      clickable: Boolean,
      highlighted: Boolean,
      disabled: Boolean,
      selected: Boolean,
      loading: Boolean,
      mode: {
        type: String,
        default: 'default'
      },
      checked: Boolean,
      value: {
        type: String,
        default: ''
      }
    },

    slots: {
      checkbox (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'selection') {
          const cb = document.createElement('atoll-checkbox')
          if (state.checked) {
            cb.setAttribute('checked', 'true')
          }
          cb.addEventListener('change', (e) => {
            e.stopPropagation()
            state.checked = e.detail ? e.detail.checked : cb.checked
            root.dispatchEvent(
              new CustomEvent('atoll-selection-change', {
                bubbles: true,
                composed: true,
                detail: [
                  {
                    checked: state.checked,
                    value: state.value || state.title
                  }
                ]
              })
            )
          }, { signal })
          return [cb]
        }
        return null
      },

      deleteIcon (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'edit') {
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'minus-circle')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-danger, #FF334B)')
          icon.className = 'atoll-list-item-delete-icon'
          icon.addEventListener('click', (e) => {
            e.stopPropagation()
            e.preventDefault()
            root.dispatchEvent(
              new CustomEvent('atoll-item-action', {
                bubbles: true,
                composed: true,
                detail: {
                  action: 'delete',
                  value: state.value || state.title
                }
              })
            )
          }, { signal })
          return [icon]
        }
        return null
      },

      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.badge && state.mode === 'default') {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('variant', state.badgeVariant || 'danger')
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.chevron && state.mode === 'default') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-right')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      reorder (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'reorder') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-reorder'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'reorder')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-text-secondary, #777777)')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      hideDescription: (state) => (!state.description ? 'true' : null),

      hideTimestamp: (state) => (!state.timestamp ? 'true' : null),

      isClickable: (state) => state.clickable || state.chevron || state.mode === 'selection',

      itemRole: (state) => (state.isClickable && !state.loading ? 'button' : 'listitem'),

      itemTabindex: (state) => (state.isClickable && !state.disabled && !state.loading ? '0' : '-1'),

      hideOnLoading: (state) => (state.loading ? 'true' : null),

      showOnLoading: (state) => (state.loading ? null : 'true'),

      avatarPlaceholderClasses: (state) => {
        if (state.size === 'sm') {
          return 'atoll-list-item-avatar-placeholder-sm'
        }
        if (state.size === 'lg') {
          return 'atoll-list-item-avatar-placeholder-lg'
        }
        return 'atoll-list-item-avatar-placeholder-md'
      },

      itemClasses: (state) => {
        const classes = ['atoll-list-item']

        if (state.size) {
          classes.push(`atoll-list-item-${state.size}`)
        } else {
          classes.push('atoll-list-item-md')
        }

        if (state.isClickable && !state.loading) {
          classes.push('atoll-list-item-clickable')
        }
        if (state.highlighted) {
          classes.push('atoll-list-item-highlighted')
        }
        if (state.selected) {
          classes.push('atoll-list-item-selected')
          classes.push('active')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        if (state.mode && state.mode !== 'default') {
          classes.push(`atoll-list-item-mode-${state.mode}`)
        }
        if (state.loading) {
          classes.push('atoll-list-item-loading')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      const itemRoot = refs('itemRoot')

      const handleTrigger = () => {
        if (state.disabled || state.loading) {
          return
        }

        if (state.mode === 'selection') {
          state.checked = !state.checked
          root.dispatchEvent(
            new CustomEvent('atoll-selection-change', {
              bubbles: true,
              composed: true,
              detail: [
                {
                  checked: state.checked,
                  value: state.value || state.title
                }
              ]
            })
          )
          return
        }

        root.dispatchEvent(
          new CustomEvent('atoll-item-click', {
            bubbles: true,
            composed: true,
            detail: {
              title: state.title,
              selected: state.selected
            }
          })
        )
      }

      itemRoot.addEventListener('click', (e) => {
        handleTrigger(e)
      })

      itemRoot.addEventListener('keydown', (event) => {
        if (state.isClickable && !state.loading && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault()
          handleTrigger(event)
        }
      })

      if (typeof observe === 'function') {
        observe('badgeVariant', (val) => {
          state.badgeVariant = val
        })
        observe('badge-variant', (val) => {
          state.badgeVariant = val
        })
      }

      // Expose properties on host element
      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
        },
        configurable: true
      })

      Object.defineProperty(root, 'badgeVariant', {
        get () {
          return state.badgeVariant
        },
        set (val) {
          state.badgeVariant = val || 'danger'
        },
        configurable: true
      })

      Object.defineProperty(root, 'mode', {
        get () {
          return state.mode
        },
        set (val) {
          state.mode = val || 'default'
        },
        configurable: true
      })

      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (val) {
          state.value = val || ''
        },
        configurable: true
      })
    }
  })
</script>
