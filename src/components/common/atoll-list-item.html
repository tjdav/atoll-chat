<template id="atoll-list-item">
  <div 
    ref="itemRoot"
    class="atoll-list-item" 
    role="{{ itemRole }}"
    tabindex="{{ itemTabindex }}"
  >
    <!-- Skeleton / Placeholder view on Loading -->
    <div class="placeholder-wave w-100 h-100 d-flex align-items-center gap-3" hidden="{{ showOnLoading }}">
      <div class="{{ avatarPlaceholderClasses }} placeholder rounded-circle flex-shrink-0"></div>
      <div class="flex-grow-1 d-flex flex-column gap-2">
        <div class="placeholder col-6 placeholder-title"></div>
        <div class="placeholder col-8 placeholder-desc"></div>
      </div>
    </div>

    <!-- 1. Left Area (Avatar, Thumbnail, Selection Control) -->
    <div class="atoll-list-item-left" hidden="{{ hideOnLoading }}">
      <slot name="checkbox"></slot>
      <slot name="deleteIcon"></slot>
      <slot name="leading"></slot>
      <slot name="left"></slot>
    </div>

    <!-- 2. Center Text Area -->
    <div class="atoll-list-item-content" hidden="{{ hideOnLoading }}">
      <div class="atoll-list-item-title-row">
        <span class="atoll-list-item-title">
          <slot>{{ title }}</slot>
        </span>

        <!-- Optional Top-Right Timestamp -->
        <span class="atoll-list-item-timestamp" hidden="{{ hideTimestamp }}">
          {{ timestamp }}
        </span>
      </div>

      <!-- Optional Subtitle / Description -->
      <span class="atoll-list-item-description" hidden="{{ hideDescription }}">
        {{ description }}
      </span>
    </div>

    <!-- 3. Right Area (Badge, Chevron, Reorder Handle, Custom Actions) -->
    <div class="atoll-list-item-right" hidden="{{ hideOnLoading }}">
      <slot name="right"></slot>
      <slot name="badge"></slot>
      <slot name="chevron"></slot>
      <slot name="reorder"></slot>
    </div>
  </div>
</template>

<style>
  :host,
  atoll-list-item {
    display: block;
    container-type: inline-size;
    width: 100%;

    --list-item-min-height: 60px;
    --list-item-padding-x: 16px;
    --list-item-padding-y: 10px;
    --list-item-bg: transparent;
    --list-item-bg-hover: var(--atoll-bg-surface-secondary, #F5F5F5);
    --list-item-bg-active: var(--atoll-bg-surface-tertiary, #E8E8E8);
    --list-item-bg-highlighted: rgba(6, 199, 85, 0.08);
    --list-item-title-color: var(--atoll-text-primary, #111111);
    --list-item-desc-color: var(--atoll-text-secondary, #555555);
    --list-item-timestamp-color: var(--atoll-text-tertiary, #999999);
    --list-item-accent: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
  }

  :host([hidden]),
  atoll-list-item[hidden] {
    display: none !important;
  }

  :host([size="sm"]),
  atoll-list-item[size="sm"] {
    --list-item-min-height: 48px;
    --list-item-padding-y: 6px;
  }

  :host([size="lg"]),
  atoll-list-item[size="lg"] {
    --list-item-min-height: 72px;
    --list-item-padding-y: 12px;
  }

  :host([highlighted]),
  atoll-list-item[highlighted] {
    --list-item-bg: var(--list-item-bg-highlighted);
  }

  :host([selected]),
  atoll-list-item[selected] {
    --list-item-bg: var(--list-item-bg-highlighted);
    position: relative;
  }

  :host([selected])::before,
  atoll-list-item[selected]::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background-color: var(--list-item-accent);
    z-index: 1;
  }

  :host([disabled]),
  :host(.disabled),
  atoll-list-item[disabled],
  atoll-list-item.disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  /* Base Row Layout */
  .atoll-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: var(--list-item-min-height);
    padding: var(--list-item-padding-y) var(--list-item-padding-x);
    background-color: var(--list-item-bg);
    box-sizing: border-box;
    transition: background-color 0.15s ease-in-out;
    user-select: none;
    overflow: visible !important;
  }

  :host([clickable]) .atoll-list-item,
  :host([chevron]) .atoll-list-item,
  :host([mode="selection"]) .atoll-list-item,
  atoll-list-item[clickable] .atoll-list-item,
  atoll-list-item[chevron] .atoll-list-item,
  atoll-list-item[mode="selection"] .atoll-list-item {
    cursor: pointer;
  }

  :host([clickable]:hover) .atoll-list-item,
  :host([chevron]:hover) .atoll-list-item,
  :host([mode="selection"]:hover) .atoll-list-item,
  atoll-list-item[clickable]:hover .atoll-list-item,
  atoll-list-item[chevron]:hover .atoll-list-item,
  atoll-list-item[mode="selection"]:hover .atoll-list-item {
    background-color: var(--list-item-bg-hover);
  }

  :host([clickable]:active) .atoll-list-item,
  :host([chevron]:active) .atoll-list-item,
  :host([mode="selection"]:active) .atoll-list-item,
  atoll-list-item[clickable]:active .atoll-list-item,
  atoll-list-item[chevron]:active .atoll-list-item,
  atoll-list-item[mode="selection"]:active .atoll-list-item {
    background-color: var(--list-item-bg-active);
  }

  /* Left Area */
  .atoll-list-item-left {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    gap: 12px;
  }

  /* Center Content Area */
  .atoll-list-item-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .atoll-list-item-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
  }

  .atoll-list-item-title {
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-1, 15px);
    font-weight: var(--atoll-font-weight-semibold, 600);
    color: var(--list-item-title-color);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  :host([size="sm"]) .atoll-list-item-title,
  atoll-list-item[size="sm"] .atoll-list-item-title {
    font-size: var(--atoll-font-size-body-2, 13px);
  }

  :host([size="lg"]) .atoll-list-item-title,
  atoll-list-item[size="lg"] .atoll-list-item-title {
    font-size: var(--atoll-font-size-body-1, 16px);
  }

  .atoll-list-item-timestamp {
    font-size: var(--atoll-font-size-caption-2, 11px);
    color: var(--list-item-timestamp-color);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .atoll-list-item-description {
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-2, 13px);
    color: var(--list-item-desc-color);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Right Area */
  .atoll-list-item-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 4px;
    overflow: visible !important;
  }

  .atoll-list-item-chevron {
    display: inline-flex;
    align-items: center;
    color: var(--list-item-timestamp-color);
  }

  /* Loading Placeholders */
  .atoll-list-item-avatar-placeholder-sm {
    width: var(--atoll-profile-size-sm, 42px);
    height: var(--atoll-profile-size-sm, 42px);
  }

  .atoll-list-item-avatar-placeholder-md {
    width: var(--atoll-profile-size-md, 50px);
    height: var(--atoll-profile-size-md, 50px);
  }

  .atoll-list-item-avatar-placeholder-lg {
    width: var(--atoll-profile-size-lg, 56px);
    height: var(--atoll-profile-size-lg, 56px);
  }

  .placeholder-title {
    height: 14px;
    border-radius: 4px;
  }

  .placeholder-desc {
    height: 10px;
    border-radius: 3px;
  }

  :host([loading]) .atoll-list-item,
  atoll-list-item[loading] .atoll-list-item {
    pointer-events: none;
    cursor: default;
  }

  /* Container Query: Narrow/Compact Containers */
  @container (max-width: 280px) {
    .atoll-list-item {
      padding: 8px 10px;
      gap: 8px;
    }
    .atoll-list-item-timestamp {
      display: none;
    }
  }

  /* Dark Theme Overrides */
  :host-context([data-atoll-theme="dark"]),
  :host-context([data-bs-theme="dark"]),
  [data-atoll-theme="dark"] atoll-list-item,
  [data-bs-theme="dark"] atoll-list-item {
    --list-item-bg-hover: var(--atoll-bg-surface-secondary, #161616);
    --list-item-bg-active: var(--atoll-bg-surface-tertiary, #1F1F1F);
    --list-item-title-color: var(--atoll-text-primary, #FFFFFF);
    --list-item-desc-color: var(--atoll-text-secondary, #B0B0B0);
    --list-item-timestamp-color: var(--atoll-text-tertiary, #888888);
    --list-item-bg-highlighted: rgba(6, 199, 85, 0.15);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      badgeVariant: {
        type: String,
        default: 'danger'
      },
      description: {
        type: String,
        default: ''
      },
      timestamp: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md',
        values: ['sm', 'md', 'lg']
      },
      chevron: Boolean,
      clickable: Boolean,
      highlighted: Boolean,
      disabled: Boolean,
      selected: Boolean,
      loading: Boolean,
      mode: {
        type: String,
        default: 'default',
        values: ['default', 'selection', 'edit', 'reorder']
      },
      checked: Boolean,
      value: {
        type: String,
        default: ''
      }
    },

    slots: {
      checkbox (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) return nodes

        if (!state.loading && state.mode === 'selection') {
          const cb = document.createElement('atoll-checkbox')
          if (state.checked) cb.setAttribute('checked', 'true')

          const opts = signal ? { signal } : {}
          cb.addEventListener('change', (e) => {
            e.stopPropagation()
            state.checked = e.detail ? e.detail.checked : cb.checked
            if (state.checked) {
              root.setAttribute('checked', '')
            } else {
              root.removeAttribute('checked')
            }
            root.dispatchEvent(
              new CustomEvent('atoll-selection-change', {
                bubbles: true,
                composed: true,
                detail: [
                  {
                    checked: state.checked,
                    value: state.value || state.title
                  }
                ]
              })
            )
          }, opts)
          return [cb]
        }
        return null
      },

      deleteIcon (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) return nodes

        if (!state.loading && state.mode === 'edit') {
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'minus-circle')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-danger, #FF334B)')
          icon.className = 'atoll-list-item-delete-icon'
          const opts = signal ? { signal } : {}
          icon.addEventListener('click', (e) => {
            e.stopPropagation()
            e.preventDefault()
            root.dispatchEvent(
              new CustomEvent('atoll-item-action', {
                bubbles: true,
                composed: true,
                detail: {
                  action: 'delete',
                  value: state.value || state.title
                }
              })
            )
          }, opts)
          return [icon]
        }
        return null
      },

      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (!state.loading && state.badge && state.mode === 'default') {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('variant', state.badgeVariant || 'danger')
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (!state.loading && state.chevron && state.mode === 'default') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-right')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      reorder (nodes, { state }) {
        if (nodes && nodes.length > 0) return nodes

        if (!state.loading && state.mode === 'reorder') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-reorder'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'reorder')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-text-secondary, #777777)')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      hideDescription: (state) => (!state.description ? 'true' : null),
      hideTimestamp: (state) => (!state.timestamp ? 'true' : null),
      isClickable: (state) => state.clickable || state.chevron || state.mode === 'selection',
      itemRole: (state) => (state.isClickable && !state.loading ? 'button' : 'listitem'),
      itemTabindex: (state) => (state.isClickable && !state.disabled && !state.loading ? '0' : '-1'),
      hideOnLoading: (state) => (state.loading ? 'true' : null),
      showOnLoading: (state) => (state.loading ? null : 'true'),
      avatarPlaceholderClasses: (state) => {
        if (state.size === 'sm') return 'atoll-list-item-avatar-placeholder-sm'
        if (state.size === 'lg') return 'atoll-list-item-avatar-placeholder-lg'
        return 'atoll-list-item-avatar-placeholder-md'
      }
    },

    client: ({ state, refs, root, signal, observe }) => {
      const itemRoot = refs('itemRoot')

      if (observe) {
        observe('mode', () => {})
        observe('checked', () => {})
      }

      const handleTrigger = () => {
        if (state.disabled || state.loading) return

        if (state.mode === 'selection') {
          state.checked = !state.checked
          if (state.checked) {
            root.setAttribute('checked', '')
          } else {
            root.removeAttribute('checked')
          }
          const cb = root.querySelector('atoll-checkbox')
          if (cb) cb.checked = state.checked

          root.dispatchEvent(
            new CustomEvent('atoll-selection-change', {
              bubbles: true,
              composed: true,
              detail: [
                {
                  checked: state.checked,
                  value: state.value || state.title
                }
              ]
            })
          )
          return
        }

        root.dispatchEvent(
          new CustomEvent('atoll-item-click', {
            bubbles: true,
            composed: true,
            detail: {
              title: state.title,
              selected: state.selected
            }
          })
        )
      }

      const listenerOpts = signal ? { signal } : {}

      itemRoot.addEventListener('click', (e) => {
        handleTrigger(e)
      }, listenerOpts)

      itemRoot.addEventListener('keydown', (event) => {
        if (state.isClickable && !state.loading && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault()
          handleTrigger(event)
        }
      }, listenerOpts)

      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
          if (state.checked) {
            root.setAttribute('checked', '')
          } else {
            root.removeAttribute('checked')
          }
          const cb = root.querySelector('atoll-checkbox')
          if (cb) cb.checked = state.checked
        },
        configurable: true
      })

      Object.defineProperty(root, 'badgeVariant', {
        get () {
          return state.badgeVariant
        },
        set (val) {
          state.badgeVariant = val || 'danger'
        },
        configurable: true
      })

      Object.defineProperty(root, 'mode', {
        get () {
          return state.mode
        },
        set (val) {
          state.mode = val || 'default'
        },
        configurable: true
      })

      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (val) {
          state.value = val || ''
        },
        configurable: true
      })
    }
  })
</script>
