<template id="atoll-list-item">
  <div 
    ref="itemRoot"
    class="{{ itemClasses }}" 
    role="{{ itemRole }}"
    tabindex="{{ itemTabindex }}"
  >
    <!-- 1. Contextual Action Zone (Dynamic Left) -->
    <div class="atoll-list-item-contextual-zone">
      <slot name="contextual-action">
        <input 
          type="checkbox" 
          class="atoll-list-item-checkbox" 
          ref="checkboxInput" 
          checked="{{ isChecked }}"
          aria-label="Select {{ title }}"
          tabindex="-1"
        />
        <button 
          type="button" 
          class="atoll-list-item-delete-btn" 
          ref="deleteButton"
          aria-label="Delete {{ title }}"
          tabindex="-1"
        >
          <atoll-icon name="minus-circle" size="20"></atoll-icon>
        </button>
      </slot>
    </div>

    <!-- 2. Leading Zone (Static Left) -->
    <div class="atoll-list-item-left">
      <slot name="left"></slot>
      <slot name="avatar"></slot>
    </div>

    <!-- 3. Content Body (Center Text Area) -->
    <div class="atoll-list-item-content">
      <div class="atoll-list-item-title-row">
        <span class="atoll-list-item-title">
          <slot>{{ title }}</slot>
        </span>

        <!-- Optional Top-Right Timestamp -->
        <slot name="timestamp"></slot>
      </div>

      <!-- Optional Subtitle / Description -->
      <slot name="description"></slot>
    </div>

    <!-- 4. Trailing Zone (Static Right) -->
    <div class="atoll-list-item-right">
      <slot name="right"></slot>

      <!-- Unread Count Badge -->
      <slot name="badge"></slot>

      <!-- Navigation Directional Chevron -->
      <slot name="chevron"></slot>
    </div>

    <!-- 5. Reorder Zone (Dynamic Right) -->
    <div class="atoll-list-item-reorder-zone">
      <slot name="reorder-handle">
        <span class="atoll-list-item-reorder-handle" ref="reorderHandle" aria-label="Reorder" tabindex="-1">
          <atoll-icon name="hamburger-menu" size="20"></atoll-icon>
        </span>
      </slot>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      description: {
        type: String,
        default: ''
      },
      timestamp: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md' // 'sm' | 'md' | 'lg'
      },
      mode: {
        type: String,
        default: 'default' // 'default' | 'selection' | 'edit' | 'reorder'
      },
      checked: {
        type: Boolean,
        default: false
      },
      chevron: {
        type: Boolean,
        default: false
      },
      clickable: {
        type: Boolean,
        default: false
      },
      highlighted: {
        type: Boolean,
        default: false
      },
      disabled: {
        type: Boolean,
        default: false
      },
      selected: {
        type: Boolean,
        default: false
      },
      unread: {
        type: Boolean,
        default: false
      }
    },

    slots: {
      /**
       * Dynamic slot evaluation for item unread badge.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      badge (originalNodes, state) {
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }
        if (!state.badge || state.badge === '0') {
          return null
        }
        return `<atoll-badge size="sm" count="${state.badge}"></atoll-badge>`
      },

      /**
       * Dynamic slot evaluation for item navigation chevron.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      chevron (originalNodes, state) {
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }
        if (!state.chevron || state.mode !== 'default') {
          return null
        }
        return `<span class="atoll-list-item-chevron"><atoll-icon name="chevron-right" size="18"></atoll-icon></span>`
      },

      /**
       * Dynamic slot evaluation for item timestamp.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      timestamp (originalNodes, state) {
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }
        if (!state.timestamp) {
          return null
        }
        return `<span class="atoll-list-item-timestamp">${state.timestamp}</span>`
      },

      /**
       * Dynamic slot evaluation for item description / subtitle.
       * @param {Node[]} originalNodes - Slotted light DOM nodes.
       * @param {Object} state - Component state.
       * @returns {string|Node[]|null} Evaluated slot content.
       */
      description (originalNodes, state) {
        if (originalNodes && originalNodes.length > 0) {
          return originalNodes
        }
        if (!state.description) {
          return null
        }
        const extraClass = state.unread ? ' fw-bold' : ''
        return `<small class="atoll-list-item-description text-truncate${extraClass}">${state.description}</small>`
      }
    },

    getters: {
      isChecked: (state) => (state.checked ? 'true' : null),

      isClickable: (state) => state.clickable || state.chevron || state.mode === 'selection' || state.mode === 'edit',

      itemRole: (state) => (state.mode === 'selection' || state.isClickable ? 'button' : 'listitem'),

      itemTabindex: (state) => (state.isClickable && !state.disabled ? '0' : '-1'),

      descriptionClasses: (state) => (state.unread ? 'fw-bold' : ''),

      itemClasses: (state) => {
        const classes = ['atoll-list-item']

        if (state.size) {
          classes.push(`atoll-list-item-${state.size}`)
        } else {
          classes.push('atoll-list-item-md')
        }

        if (state.mode && state.mode !== 'default') {
          classes.push(`atoll-list-item-mode-${state.mode}`)
        }

        if (state.checked) {
          classes.push('atoll-list-item-checked')
        }

        if (state.isClickable) {
          classes.push('atoll-list-item-clickable')
        }
        if (state.highlighted) {
          classes.push('atoll-list-item-highlighted')
        }
        if (state.selected) {
          classes.push('atoll-list-item-selected')
          classes.push('active')
        }
        if (state.disabled) {
          classes.push('disabled')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      const itemRoot = refs('itemRoot')
      const deleteBtn = refs('deleteButton')
      const checkboxInput = refs('checkboxInput')

      const syncCheckedAttribute = (isChecked) => {
        if (isChecked) {
          root.setAttribute('checked', 'true')
        } else {
          root.removeAttribute('checked')
        }
        if (checkboxInput) {
          checkboxInput.checked = isChecked
        }
      }

      const handleTrigger = (event) => {
        if (state.disabled) {
          return
        }

        if (state.mode === 'selection') {
          // In selection mode, tapping the row toggles the item's checked state
          state.checked = !state.checked
          syncCheckedAttribute(state.checked)

          root.dispatchEvent(
            new CustomEvent('atoll-item-selection-toggle', {
              bubbles: true,
              composed: true,
              detail: {
                title: state.title,
                checked: state.checked,
                originalEvent: event
              }
            })
          )

          root.dispatchEvent(
            new CustomEvent('atoll-item-click', {
              bubbles: true,
              composed: true,
              detail: {
                title: state.title,
                selected: state.selected,
                checked: state.checked,
                mode: state.mode,
                originalEvent: event
              }
            })
          )
          return
        }

        if (state.mode === 'edit') {
          // In edit mode, tapping minus button or row triggers delete event
          root.dispatchEvent(
            new CustomEvent('atoll-item-delete-trigger', {
              bubbles: true,
              composed: true,
              detail: {
                title: state.title,
                originalEvent: event
              }
            })
          )
          return
        }

        // Default mode trigger
        root.dispatchEvent(
          new CustomEvent('atoll-item-click', {
            bubbles: true,
            composed: true,
            detail: {
              title: state.title,
              selected: state.selected,
              checked: state.checked,
              mode: state.mode,
              originalEvent: event
            }
          })
        )
      }

      if (deleteBtn) {
        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation()
          if (state.disabled) return
          root.dispatchEvent(
            new CustomEvent('atoll-item-delete-trigger', {
              bubbles: true,
              composed: true,
              detail: {
                title: state.title,
                originalEvent: event
              }
            })
          )
        })
      }

      if (checkboxInput) {
        checkboxInput.addEventListener('change', (event) => {
          event.stopPropagation()
          state.checked = checkboxInput.checked
          syncCheckedAttribute(state.checked)

          root.dispatchEvent(
            new CustomEvent('atoll-item-selection-toggle', {
              bubbles: true,
              composed: true,
              detail: {
                title: state.title,
                checked: state.checked,
                originalEvent: event
              }
            })
          )
        })
      }

      if (itemRoot) {
        itemRoot.addEventListener('click', handleTrigger)

        itemRoot.addEventListener('keydown', (event) => {
          if (state.isClickable && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault()
            handleTrigger(event)
          }
        })
      }

      // Sync attribute changes dynamically
      if (observe) {
        observe('checked', (val) => {
          state.checked = val === 'true' || val === true || val === ''
          syncCheckedAttribute(state.checked)
        })
        observe('mode', (val) => {
          state.mode = val || 'default'
        })
        observe('selected', (val) => {
          state.selected = val === 'true' || val === true || val === ''
        })
        observe('disabled', (val) => {
          state.disabled = val === 'true' || val === true || val === ''
        })
        observe('highlighted', (val) => {
          state.highlighted = val === 'true' || val === true || val === ''
        })
        observe('clickable', (val) => {
          state.clickable = val === 'true' || val === true || val === ''
        })
        observe('title', (val) => {
          state.title = val
        })
        observe('description', (val) => {
          state.description = val
        })
        observe('timestamp', (val) => {
          state.timestamp = val
        })
        observe('badge', (val) => {
          state.badge = val
        })
        observe('chevron', (val) => {
          state.chevron = val === 'true' || val === true || val === ''
        })
        observe('unread', (val) => {
          state.unread = val === 'true' || val === true || val === ''
        })
      }
    }
  })
</script>
