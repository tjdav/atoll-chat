<template id="atoll-list-item">
  <div 
    ref="itemRoot"
    class="{{ itemClasses }}" 
    role="{{ itemRole }}"
    tabindex="{{ itemTabindex }}"
  >
    <!-- Skeleton / Placeholder view on Loading -->
    <div class="placeholder-wave w-100 h-100 d-flex align-items-center gap-3" hidden="{{ showOnLoading }}">
      <div class="{{ avatarPlaceholderClasses }} placeholder rounded-circle flex-shrink-0"></div>
      <div class="flex-grow-1 d-flex flex-column gap-2">
        <div class="placeholder col-6 placeholder-title"></div>
        <div class="placeholder col-8 placeholder-desc"></div>
      </div>
    </div>

    <!-- 3-1. Left Area (Avatar, Thumbnail, Selection Control) -->
    <div class="atoll-list-item-left" hidden="{{ hideOnLoading }}">
      <slot name="checkbox"></slot>
      <slot name="deleteIcon"></slot>
      <slot name="leading"></slot>
      <slot name="left"></slot>
    </div>

    <!-- 3-2. Center Text Area -->
    <div class="atoll-list-item-content" hidden="{{ hideOnLoading }}">
      <div class="atoll-list-item-title-row">
        <span class="atoll-list-item-title">
          <slot>{{ title }}</slot>
        </span>

        <!-- Optional Top-Right Timestamp -->
        <span class="atoll-list-item-timestamp" hidden="{{ hideTimestamp }}">
          {{ timestamp }}
        </span>
      </div>

      <!-- Optional Subtitle / Description -->
      <span class="atoll-list-item-description" hidden="{{ hideDescription }}">
        {{ description }}
      </span>
    </div>

    <!-- 3-3. Right Area (Switch, Badge, Chevron, Custom Action) -->
    <div class="atoll-list-item-right" hidden="{{ hideOnLoading }}">
      <slot name="right"></slot>

      <!-- Unread Count Badge -->
      <slot name="badge"></slot>

      <!-- Navigation Directional Chevron -->
      <slot name="chevron"></slot>

      <!-- Reorder Drag Handle -->
      <slot name="reorder"></slot>
    </div>
  </div>
</template>

<style>

    container-type: inline-size;
    width: 100%;
  }

  :host([hidden]) {
    display: none !important;
  }

    --atoll-list-item-min-height-sm: 48px;
    --atoll-list-item-min-height-md: 60px;
    --atoll-list-item-min-height-lg: 72px;

    --atoll-list-item-padding-y: 10px;

    --atoll-list-item-bg: transparent;
    --atoll-list-item-bg-hover: var(--atoll-bg-surface-secondary, #F5F5F5);
    --atoll-list-item-bg-active: var(--atoll-bg-surface-tertiary, #E8E8E8);
    --atoll-list-item-bg-highlighted: rgba(6, 199, 85, 0.08);
    --atoll-list-item-title-color: var(--atoll-text-primary, #111111);
    --atoll-list-item-desc-color: var(--atoll-text-secondary, #555555);
    --atoll-list-item-divider: var(--atoll-border-subtle, #DFDFDF);

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: var(--atoll-list-item-min-height, var(--atoll-list-item-min-height-md));
    padding: var(--atoll-list-item-padding-y) var(--atoll-list-item-padding-x);
    background-color: var(--atoll-list-item-bg);
    box-sizing: border-box;
    transition: background-color 0.15s ease-in-out;
    user-select: none;
    overflow: visible !important;
  }

  .atoll-list-item.atoll-list-item-clickable {
    cursor: pointer;
  }

  .atoll-list-item.atoll-list-item-clickable:hover {
    background-color: var(--atoll-list-item-bg-hover);
  }

  .atoll-list-item.atoll-list-item-clickable:active {
    background-color: var(--atoll-list-item-bg-active);
  }

  .atoll-list-item.disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  /* 3-1. Left Area */
  .atoll-list-item-left {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    gap: 12px;
  }

  /* 3-2. Center Text Area */
  .atoll-list-item-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .atoll-list-item-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
  }

  .atoll-list-item-title {
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-1, 15px);
    font-weight: var(--atoll-font-weight-semibold, 600);
    color: var(--atoll-list-item-title-color);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .atoll-list-item-timestamp {
    font-size: var(--atoll-font-size-caption-2, 11px);
    color: var(--atoll-text-tertiary, #999999);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .atoll-list-item-description {
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    font-size: var(--atoll-font-size-body-2, 13px);
    color: var(--atoll-list-item-desc-color);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 3-3. Right Area */
  .atoll-list-item-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 4px;
    overflow: visible !important;
  }

  .atoll-list-item-chevron {
    display: inline-flex;
    align-items: center;
    color: var(--atoll-text-tertiary, #999999);
  }

  /* State & Size Modifiers */
  .atoll-list-item-highlighted {
    background-color: var(--atoll-list-item-bg-highlighted);

  .atoll-list-item-selected {
    background-color: var(--atoll-list-item-bg-highlighted);

  .atoll-list-item-selected::before {

  .atoll-list-item-sm {
    --atoll-list-item-min-height: var(--atoll-list-item-min-height-sm);

  }

  .atoll-list-item-sm .atoll-list-item-title {
    font-size: var(--atoll-font-size-body-2, 13px);
  }

  .atoll-list-item-lg {
    --atoll-list-item-min-height: var(--atoll-list-item-min-height-lg);
    --atoll-list-item-padding-y: 12px;
  }

  .atoll-list-item-lg .atoll-list-item-title {
    font-size: var(--atoll-font-size-body-1, 16px);
  }

  /* Loading Skeleton Dimensions & Classes */
  .atoll-list-item-avatar-placeholder-sm {
    width: var(--atoll-profile-size-sm, 42px);
    height: var(--atoll-profile-size-sm, 42px);
  }

  .atoll-list-item-avatar-placeholder-md {
    width: var(--atoll-profile-size-md, 50px);
    height: var(--atoll-profile-size-md, 50px);
  }

  .atoll-list-item-avatar-placeholder-lg {
    width: var(--atoll-profile-size-lg, 56px);
    height: var(--atoll-profile-size-lg, 56px);
  }

  .placeholder-title {
    height: 14px;
    border-radius: 4px;
  }

  .placeholder-desc {
    height: 10px;
    border-radius: 3px;
  }

  .atoll-list-item-loading {
    pointer-events: none;
    cursor: default;
  }

  /* Container Query: Narrow/Compact Containers */
  @container (max-width: 280px) {
    .atoll-list-item {
      padding: 8px 10px;
      gap: 8px;
    }
    .atoll-list-item-timestamp {
      display: none;
    }
  }

  /* Dark Theme Overrides */
  [data-atoll-theme="dark"] .atoll-list-item,
  [data-bs-theme="dark"] .atoll-list-item {
    --atoll-list-item-bg-hover: var(--atoll-bg-surface-secondary, #161616);
    --atoll-list-item-bg-active: var(--atoll-bg-surface-tertiary, #1F1F1F);
    --atoll-list-item-title-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-list-item-desc-color: var(--atoll-text-secondary, #B0B0B0);
    --atoll-list-item-divider: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.1));
    --atoll-list-item-bg-highlighted: rgba(6, 199, 85, 0.15);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: {
        type: String,
        default: ''
      },
      badgeVariant: {
        type: String,
        default: 'danger'
      },
      description: {
        type: String,
        default: ''
      },
      timestamp: {
        type: String,
        default: ''
      },
      badge: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      chevron: Boolean,
      clickable: Boolean,
      highlighted: Boolean,
      disabled: Boolean,
      selected: Boolean,
      loading: Boolean,
      mode: {
        type: String,
        default: 'default'
      },
      checked: Boolean,
      value: {
        type: String,
        default: ''
      }
    },

    slots: {
      checkbox (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'selection') {
          const cb = document.createElement('atoll-checkbox')
          if (state.checked) {
            cb.setAttribute('checked', 'true')
          }
          cb.addEventListener('change', (e) => {
            e.stopPropagation()
            state.checked = e.detail ? e.detail.checked : cb.checked
            root.dispatchEvent(
              new CustomEvent('atoll-selection-change', {
                bubbles: true,
                composed: true,
                detail: [
                  {
                    checked: state.checked,
                    value: state.value || state.title
                  }
                ]
              })
            )
          }, { signal })
          return [cb]
        }
        return null
      },

      deleteIcon (nodes, { state, signal, root }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'edit') {
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'minus-circle')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-danger, #FF334B)')
          icon.className = 'atoll-list-item-delete-icon'
          icon.addEventListener('click', (e) => {
            e.stopPropagation()
            e.preventDefault()
            root.dispatchEvent(
              new CustomEvent('atoll-item-action', {
                bubbles: true,
                composed: true,
                detail: {
                  action: 'delete',
                  value: state.value || state.title
                }
              })
            )
          }, { signal })
          return [icon]
        }
        return null
      },

      badge (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.badge && state.mode === 'default') {
          const badgeEl = document.createElement('atoll-badge')
          badgeEl.setAttribute('count', state.badge)
          badgeEl.setAttribute('variant', state.badgeVariant || 'danger')
          badgeEl.setAttribute('size', 'sm')
          return [badgeEl]
        }
        return null
      },

      chevron (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.chevron && state.mode === 'default') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-chevron'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'chevron-right')
          icon.setAttribute('size', '18')
          span.appendChild(icon)
          return [span]
        }
        return null
      },

      reorder (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
        if (!state.loading && state.mode === 'reorder') {
          const span = document.createElement('span')
          span.className = 'atoll-list-item-reorder'
          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'reorder')
          icon.setAttribute('size', '24')
          icon.setAttribute('color', 'var(--atoll-text-secondary, #777777)')
          span.appendChild(icon)
          return [span]
        }
        return null
      }
    },

    getters: {
      hideDescription: (state) => (!state.description ? 'true' : null),

      hideTimestamp: (state) => (!state.timestamp ? 'true' : null),

      isClickable: (state) => state.clickable || state.chevron || state.mode === 'selection',

      itemRole: (state) => (state.isClickable && !state.loading ? 'button' : 'listitem'),

      itemTabindex: (state) => (state.isClickable && !state.disabled && !state.loading ? '0' : '-1'),

      hideOnLoading: (state) => (state.loading ? 'true' : null),

      showOnLoading: (state) => (state.loading ? null : 'true'),

      avatarPlaceholderClasses: (state) => {
        if (state.size === 'sm') {
          return 'atoll-list-item-avatar-placeholder-sm'
        }
        if (state.size === 'lg') {
          return 'atoll-list-item-avatar-placeholder-lg'
        }
        return 'atoll-list-item-avatar-placeholder-md'
      },

      itemClasses: (state) => {
        const classes = ['atoll-list-item']

        if (state.size) {
          classes.push(`atoll-list-item-${state.size}`)
        } else {
          classes.push('atoll-list-item-md')
        }

        if (state.isClickable && !state.loading) {
          classes.push('atoll-list-item-clickable')
        }
        if (state.highlighted) {
          classes.push('atoll-list-item-highlighted')
        }
        if (state.selected) {
          classes.push('atoll-list-item-selected')
          classes.push('active')
        }
        if (state.disabled) {
          classes.push('disabled')
        }
        if (state.mode && state.mode !== 'default') {
          classes.push(`atoll-list-item-mode-${state.mode}`)
        }
        if (state.loading) {
          classes.push('atoll-list-item-loading')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root }) => {
      const itemRoot = refs('itemRoot')

      const handleTrigger = () => {
        if (state.disabled || state.loading) {
          return
        }

        if (state.mode === 'selection') {
          state.checked = !state.checked
          root.dispatchEvent(
            new CustomEvent('atoll-selection-change', {
              bubbles: true,
              composed: true,
              detail: [
                {
                  checked: state.checked,
                  value: state.value || state.title
                }
              ]
            })
          )
          return
        }

        root.dispatchEvent(
          new CustomEvent('atoll-item-click', {
            bubbles: true,
            composed: true,
            detail: {
              title: state.title,
              selected: state.selected
            }
          })
        )
      }

      itemRoot.addEventListener('click', (e) => {
        handleTrigger(e)
      })

      itemRoot.addEventListener('keydown', (event) => {
        if (state.isClickable && !state.loading && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault()
          handleTrigger(event)
        }
      })

      // Expose properties on host element
      Object.defineProperty(root, 'checked', {
        get () {
          return state.checked
        },
        set (val) {
          state.checked = Boolean(val)
        },
        configurable: true
      })

      Object.defineProperty(root, 'badgeVariant', {
        get () {
          return state.badgeVariant
        },
        set (val) {
          state.badgeVariant = val || 'danger'
        },
        configurable: true
      })

      Object.defineProperty(root, 'mode', {
        get () {
          return state.mode
        },
        set (val) {
          state.mode = val || 'default'
        },
        configurable: true
      })

      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (val) {
          state.value = val || ''
        },
        configurable: true
      })
    }
  })
</script>
