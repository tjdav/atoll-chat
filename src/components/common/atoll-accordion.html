<template id="atoll-accordion">
  <div class="atoll-accordion" role="presentation">
    <slot></slot>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .atoll-accordion {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      multiple: {
        type: Boolean,
        default: false
      }
    },

    provide: {
      'atoll-accordion-context': ({ state }) => ({
        multiple: state.multiple
      })
    },

    client: ({ state, root, signal }) => {
      // Coordinate nested accordion items if single-expansion (multiple="false") is active
      const handleToggle = (event) => {
        if (state.multiple) {
          return
        }

        const toggledItem = event.target?.closest ? event.target.closest('atoll-accordion-item') : event.target
        if (toggledItem && event.detail?.expanded) {
          const items = Array.from(root.querySelectorAll('atoll-accordion-item')).filter(
            item => item.closest('atoll-accordion') === root
          )
          items.forEach(item => {
            if (item !== toggledItem) {
              item.expanded = false
            }
          })
        }
      }

      root.addEventListener('atoll-accordion-item-toggle', handleToggle, { signal })

      // Container helper methods
      root.collapseAll = () => {
        const items = Array.from(root.querySelectorAll('atoll-accordion-item')).filter(
          item => item.closest('atoll-accordion') === root
        )
        items.forEach(item => {
          item.expanded = false
        })
      }

      root.expandAll = () => {
        if (!state.multiple) return
        const items = Array.from(root.querySelectorAll('atoll-accordion-item')).filter(
          item => item.closest('atoll-accordion') === root
        )
        items.forEach(item => {
          item.expanded = true
        })
      }
    }
  })
</script>
