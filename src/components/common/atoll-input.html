<template id="atoll-input">
  <div class="{{ groupClasses }}">
    <!-- Optional Header (Label + Required Asterisk + Character Counter) -->
    <div class="atoll-input-header" hidden="{{ hideHeader }}">
      <label class="atoll-input-label" for="{{ ref_input }}">
        {{ label }}
        <span class="atoll-input-required-mark" hidden="{{ hideRequiredMark }}">*</span>
      </label>
      <span class="atoll-input-counter" hidden="{{ hideCounter }}">
        {{ currentLength }} / {{ maxlength }}
      </span>
    </div>

    <!-- Underlined Input Wrapper -->
    <div class="atoll-input-wrapper">
      <input 
        ref="input"
        id="{{ ref_input }}"
        type="{{ computedType }}"
        value="{{ value }}"
        placeholder="{{ placeholder }}"
        maxlength="{{ maxlength }}"
        disabled="{{ disabled }}"
        readonly="{{ readonly }}"
        required="{{ required }}"
        aria-invalid="{{ isAriaInvalid }}"
        aria-describedby="{{ ref_footer }}"
        class="atoll-input-field"
      />

      <!-- Action Area: Clear (X), Password Eye, Timer, Custom Slot -->
      <div class="atoll-input-actions">
        <!-- Clear Button -->
        <button 
          ref="clearBtn"
          type="button" 
          class="atoll-input-action-btn" 
          aria-label="Clear input"
          hidden="{{ hideClearBtn }}"
        >
          <atoll-icon name="close" size="16"></atoll-icon>
        </button>

        <!-- Password Visibility Toggle -->
        <button 
          ref="passwordToggleBtn"
          type="button" 
          class="atoll-input-action-btn" 
          aria-label="Toggle password visibility"
          hidden="{{ hidePasswordToggle }}"
        >
          <atoll-icon name="{{ passwordIconName }}" size="18"></atoll-icon>
        </button>

        <!-- Countdown Timer for Code Mode -->
        <span class="atoll-input-timer" hidden="{{ hideTimer }}">
          {{ timer }}
        </span>

        <!-- Trailing Action Slot (e.g. Resend Code Button) -->
        <slot name="action"></slot>
      </div>
    </div>

    <!-- Footer: Helper or Error Message -->
    <div ref="footer" id="{{ ref_footer }}" class="atoll-input-footer" hidden="{{ hideFooter }}">
      <span>{{ displayMessage }}</span>
    </div>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  :host([hidden]) {
    display: none !important;
  }

  .atoll-input-group {
    display: flex;
    flex-direction: column;
    width: 100%;
    position: relative;
    font-family: var(--atoll-font-sans-serif, system-ui, -apple-system, sans-serif);
    box-sizing: border-box;

    --atoll-input-height-sm: 36px;
    --atoll-input-height-md: 44px;
    --atoll-input-height-lg: 52px;
    --atoll-input-height: var(--atoll-input-height-md);

    --atoll-input-text-color: var(--atoll-text-primary, #111111);
    --atoll-input-placeholder-color: var(--atoll-text-tertiary, #949494);
    --atoll-input-underline-color: var(--atoll-border-subtle, #E8E8E8);
    --atoll-input-underline-focus: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    --atoll-input-underline-error: var(--atoll-rainbow-red, #FF334B);
    --atoll-input-label-color: var(--atoll-text-secondary, #555555);
  }

  .atoll-input-group.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .atoll-input-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: var(--atoll-font-size-caption-1, 12px);
    color: var(--atoll-input-label-color);
    font-weight: var(--atoll-font-weight-medium, 500);
  }

  .atoll-input-label {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .atoll-input-required-mark {
    color: var(--atoll-rainbow-red, #FF334B);
    font-weight: bold;
  }

  .atoll-input-counter {
    font-size: var(--atoll-font-size-caption-2, 11px);
    color: var(--atoll-text-tertiary, #999999);
    margin-left: auto;
  }

  .atoll-input-wrapper {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
    height: var(--atoll-input-height);
    background-color: var(--atoll-input-bg, transparent);
    border-bottom: 1px solid var(--atoll-input-underline-color);
    transition: border-color 0.15s ease-in-out, border-width 0.1s ease-in-out, box-shadow 0.15s ease-in-out;
  }

  .atoll-input-wrapper:focus-within {
    border-bottom: 2px solid var(--atoll-input-underline-focus);
    box-shadow: 0 2px 8px color-mix(in srgb, var(--atoll-primary, #06C755) 20%, transparent);
  }

  .atoll-input-field {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    font-family: inherit;
    font-size: var(--atoll-font-size-body-2, 14px);
    color: var(--atoll-input-text-color);
  }

  .atoll-input-field::placeholder {
    color: var(--atoll-input-placeholder-color);
  }

  .atoll-input-field:disabled {
    cursor: not-allowed;
  }

  .atoll-input-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 8px;

  }

  .atoll-input-action-btn {

    margin: 0;
    color: var(--atoll-text-secondary, #666666);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.15s ease-in-out;
  }

  .atoll-input-action-btn:hover {
    opacity: 1;
  }

  .atoll-input-action-btn:focus-visible {
    outline: none;
  }

  .atoll-input-timer {
    font-size: var(--atoll-font-size-caption-1, 12px);
    color: var(--atoll-primary, var(--atoll-brand-primary, #06C755));
    font-weight: var(--atoll-font-weight-semibold, 600);
    font-variant-numeric: tabular-nums;
  }

  .atoll-input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
    font-size: var(--atoll-font-size-caption-2, 11px);
    color: var(--atoll-text-secondary, #666666);
    min-height: 16px;
  }

  .atoll-input-error .atoll-input-wrapper {
    border-bottom: 2px solid var(--atoll-input-underline-error) !important;
  }

  .atoll-input-error .atoll-input-footer {
    color: var(--atoll-rainbow-red, #FF334B);
  }

  .atoll-input-sm {
    --atoll-input-height: var(--atoll-input-height-sm);
  }

  .atoll-input-sm .atoll-input-field {
    font-size: var(--atoll-font-size-caption-1, 12px);
  }

  .atoll-input-lg {
    --atoll-input-height: var(--atoll-input-height-lg);
  }

  .atoll-input-lg .atoll-input-field {
    font-size: var(--atoll-font-size-body-1, 16px);
  }

  :host-context([data-atoll-theme="dark"]) .atoll-input-group,
  :host-context([data-bs-theme="dark"]) .atoll-input-group,
  [data-atoll-theme="dark"] .atoll-input-group,
  [data-bs-theme="dark"] .atoll-input-group {
    --atoll-input-text-color: var(--atoll-text-primary, #FFFFFF);
    --atoll-input-placeholder-color: var(--atoll-text-tertiary, #949494);
    --atoll-input-underline-color: var(--atoll-border-color-translucent, rgba(255, 255, 255, 0.15));
    --atoll-input-label-color: var(--atoll-text-secondary, #B0B0B0);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: {
        type: String,
        // 'text' | 'password' | 'email' | 'tel' | 'code'
        default: 'text'
      },
      value: {
        type: String,
        default: ''
      },
      placeholder: {
        type: String,
        default: ''
      },
      label: {
        type: String,
        default: ''
      },
      helperText: {
        type: String,
        default: ''
      },
      errorMessage: {
        type: String,
        default: ''
      },
      timer: {
        type: String,
        default: ''
      },
      size: {
        type: String,
        default: 'md'
      },
      maxlength: {
        type: Number,
        default: null
      },
      required: Boolean,
      disabled: Boolean,
      readonly: Boolean,
      invalid: Boolean,
      clearable: Boolean,
      showCounter: Boolean,
      showPassword: Boolean
    },

    getters: {
      computedType: (state) => {
        if (state.type === 'password') {
          return state.showPassword ? 'text' : 'password'
        }
        return state.type === 'code' ? 'text' : state.type
      },

      passwordIconName: (state) => (state.showPassword ? 'eye-off' : 'eye'),

      currentLength: (state) => (state.value ? String(state.value).length : 0),

      isAriaInvalid: (state) => (state.invalid || Boolean(state.errorMessage) ? 'true' : 'false'),

      // Operator-free boolean getters for template attributes
      hideHeader: (state) => !state.label && !state.showCounter,

      hideRequiredMark: (state) => !state.required,

      hideCounter: (state) => !state.showCounter,

      hideClearBtn: (state) => !state.clearable || !state.value || state.disabled || state.readonly,

      hidePasswordToggle: (state) => state.type !== 'password',

      hideTimer: (state) => !state.timer,

      hideFooter: (state) => !state.errorMessage && !state.helperText,

      displayMessage: (state) => (state.invalid && state.errorMessage ? state.errorMessage : state.helperText),

      groupClasses: (state) => {
        const classes = ['atoll-input-group']

        if (state.size) {
          classes.push(`atoll-input-${state.size}`)
        } else {
          classes.push('atoll-input-md')
        }

        if (state.invalid || state.errorMessage) {
          classes.push('atoll-input-error')
        }
        if (state.disabled) {
          classes.push('disabled')
        }

        return classes.join(' ')
      }
    },

    client: ({ state, refs, root, observe }) => {
      const input = refs('input')
      const clearBtn = refs('clearBtn')
      const passBtn = refs('passwordToggleBtn')

      // Capture initial value from property or attribute if set prior to / during hydration
      const initialVal = root.value || root.getAttribute('value') || state.value || ''
      if (initialVal) {
        state.value = initialVal
        input.value = initialVal
      }

      // Forward test-id / data-testid and standard attributes
      const testId = root.getAttribute('test-id') || root.getAttribute('data-testid') || root.__testId
      if (testId) {
        root.__testId = testId
        input.setAttribute('data-testid', testId)
        root.removeAttribute('test-id')
        requestAnimationFrame(() => {
          root.removeAttribute('data-testid')
        })
      }

      const feedbackTestId = root.getAttribute('feedback-test-id')
      const footer = refs('footer')
      if (feedbackTestId) {
        footer.setAttribute('data-testid', feedbackTestId)
      }

      const attributesToForward = ['name', 'autocomplete', 'autofocus', 'minlength', 'pattern']
      attributesToForward.forEach(attrName => {
        const val = root.getAttribute(attrName)
        if (val !== null) {
          input.setAttribute(attrName, val)
        }
      })

      // Native validity and validation delegates
      root.checkValidity = () => input.checkValidity()
      root.reportValidity = () => input.reportValidity()
      root.setCustomValidity = (msg) => {
        input.setCustomValidity(msg)
        if (msg) {
          state.invalid = true
          state.errorMessage = msg
        } else {
          state.invalid = false
          state.errorMessage = ''
        }
      }
      Object.defineProperty(root, 'validity', {
        get () {
          return input.validity
        },
        configurable: true
      })

      // Expose properties on root for bidirectional data binding
      Object.defineProperty(root, 'value', {
        get () {
          return state.value
        },
        set (newVal) {
          state.value = newVal || ''
          if (input && input.value !== (newVal || '')) {
            input.value = newVal || ''
          }
        },
        configurable: true
      })

      Object.defineProperty(root, 'invalid', {
        get () {
          return state.invalid
        },
        set (val) {
          state.invalid = Boolean(val)
        },
        configurable: true
      })

      Object.defineProperty(root, 'errorMessage', {
        get () {
          return state.errorMessage
        },
        set (val) {
          state.errorMessage = val || ''
        },
        configurable: true
      })

      // Focus / blur forwarding
      root.focus = () => input.focus()
      root.blur = () => input.blur()

      const dispatchEvents = () => {
        root.dispatchEvent(new Event('input', {
          bubbles: true,
          composed: true
        }))
        root.dispatchEvent(new Event('change', {
          bubbles: true,
          composed: true
        }))
      }

      // Sync native user typing back to state and trigger form events
      input.addEventListener('input', () => {
        state.value = input.value
        dispatchEvents()
      })

      // Clear button handler
      clearBtn.addEventListener('click', () => {
        state.value = ''
        input.value = ''
        input.focus()
        dispatchEvents()
      })

      // Password visibility toggle handler
      passBtn.addEventListener('click', () => {
        state.showPassword = !state.showPassword
      })

      // Two-way sync: Update native input if value changes programmatically from outside
      observe('value', (newVal) => {
        if (input.value !== (newVal || '')) {
          input.value = newVal || ''
        }
      })
    }
  })
</script>
