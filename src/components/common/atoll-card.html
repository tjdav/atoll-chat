<template id="atoll-card">
  <slot name="header"></slot>
  <div class="atoll-card-body">
    <slot></slot>
  </div>
  <slot name="footer"></slot>
</template>

<style>
  :host {
    /* token defaults — consume existing theme vars with fallback */
    --atoll-card-bg:            var(--atoll-pane-bg,          #FFFFFF);
    --atoll-card-border:        var(--atoll-border-color,     #E0E0E0);
    --atoll-card-border-radius: var(--atoll-border-radius-xl, 16px);
    --atoll-card-shadow:        0 10px 30px #00000014;
    --atoll-card-padding:       2.5rem;
    --atoll-card-header-pad:    0 0 1rem 0;
    --atoll-card-footer-pad:    1.5rem 0 0 0;
    --atoll-card-title-color:   var(--atoll-text-primary,    #111111);
    --atoll-card-subtitle-color:var(--atoll-text-secondary,  #555555);
    --atoll-card-fullscreen-pad:
      calc(1.5rem + var(--atoll-safe-area-top, 0px)) 1.5rem 1.5rem 1.5rem;

    /* outer chrome */
    display: flex;
    flex-direction: column;
    background-color: var(--atoll-card-bg);
    border: 1px solid var(--atoll-card-border);
    border-radius: var(--atoll-card-border-radius);
    box-shadow: var(--atoll-card-shadow);
    padding: var(--atoll-card-padding);
    width: 450px;
    max-width: 100%;
    margin: 2rem auto;
    box-sizing: border-box;
  }

  /* coralite-managed native booleans */
  :host([hidden]) { display: none !important; }

  /* display utility classes toggled imperatively via classList (auth views) */
  :host(.d-none) { display: none !important; }
  :host(.d-flex) { display: flex !important; }

  /* shadow strength */
  :host([shadow="sm"])  { --atoll-card-shadow: 0 2px 8px  #0000000A; }
  :host([shadow="lg"])  { --atoll-card-shadow: 0 20px 40px #00000024; }
  :host([shadow="xl"])  { --atoll-card-shadow: 0 32px 64px #00000033; }
  :host([shadow="none"]){ --atoll-card-shadow: 0 0 0 0; }

  /* rounded */
  :host([rounded="none"]){ --atoll-card-border-radius: 0; }
  :host([rounded="sm"])  { --atoll-card-border-radius: 4px; }
  :host([rounded="default"]){ --atoll-card-border-radius: var(--atoll-border-radius-xl, 16px); }
  :host([rounded="lg"])  { --atoll-card-border-radius: 24px; }

  /* border visibility */
  :host([border="none"])  { border: 0; }
  :host([border="top"])   { border: 0; border-top: 1px solid var(--atoll-card-border); }
  :host([border="bottom"]){ border: 0; border-bottom: 1px solid var(--atoll-card-border); }

  /* body side padding */
  :host([body-padding="none"]){ --atoll-card-padding: 0; }
  :host([body-padding="sm"])  { --atoll-card-padding: 1.5rem; }
  :host([body-padding="lg"])  { --atoll-card-padding: 1.5rem; }

  /* body text alignment */
  :host([center]) .atoll-card-body { text-align: center; }

  /* ---- single fullscreen ruleset (true viewport overlay) ---- */
  :host([fullscreen="always"]),
  :host([data-fullscreen-active]) {
    position: fixed;
    inset: 0;
    z-index: var(--atoll-card-fullscreen-z-index, 9999);
    width: 100vw;
    max-width: 100vw;
    height: 100dvh;
    margin: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    padding: var(--atoll-card-fullscreen-pad);
    overflow-y: auto;
  }

  /* ---- slot zone chrome ---- */
  .atoll-card-header { padding: var(--atoll-card-header-pad); }
  .atoll-card-body  { flex: 1 1 auto; min-height: 0; width: 100%; box-sizing: border-box; }
  .atoll-card-footer{ padding: var(--atoll-card-footer-pad); }

  .atoll-card-title    { font-size: 1.25rem; font-weight: 600; color: var(--atoll-card-title-color); }
  .atoll-card-subtitle { font-size: .875rem; color: var(--atoll-card-subtitle-color); }

  /* Dark Theme Overrides */
  [data-atoll-theme="dark"] :host,
  [data-bs-theme="dark"] :host {
    --atoll-card-bg: var(--atoll-pane-bg, #1e1e1e);
    --atoll-card-border: var(--atoll-border-color, #333333);
    --atoll-card-title-color: var(--atoll-text-primary, #ffffff);
    --atoll-card-subtitle-color: var(--atoll-text-secondary, #aaaaaa);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  const BREAKPOINTS = {
    sm: '(max-width: 575.98px)',
    md: '(max-width: 767.98px)',
    lg: '(max-width: 991.98px)',
    xl: '(max-width: 1199.98px)',
    xxl: '(max-width: 1399.98px)'
  }

  export default defineComponent({
    attributes: {
      title: String,
      subtitle: String,
      fullscreen: {
        type: String,
        default: 'none',
        values: ['none', 'always', 'sm', 'md', 'lg', 'xl', 'xxl']
      },
      center: Boolean,
      hideHeader: Boolean,
      hideFooter: Boolean,
      shadow: {
        type: String,
        default: 'default',
        values: ['none', 'sm', 'default', 'lg', 'xl']
      },
      rounded: {
        type: String,
        default: 'default',
        values: ['none', 'sm', 'default', 'lg']
      },
      border: {
        type: String,
        default: 'default',
        values: ['default', 'none', 'top', 'bottom']
      },
      'body-padding': {
        type: String,
        default: 'lg',
        values: ['none', 'sm', 'lg']
      }
    },

    slots: {
      header (nodes, { state }) {
        if (state.hideHeader) {
          return null
        }
        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-card-header'
          nodes.forEach(node => wrapper.appendChild(node))
          return [wrapper]
        }
        if (state.title || state.subtitle) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-card-header'
          if (state.title) {
            const titleEl = document.createElement('div')
            titleEl.className = 'atoll-card-title'
            titleEl.textContent = state.title
            wrapper.appendChild(titleEl)
          }
          if (state.subtitle) {
            const subEl = document.createElement('div')
            subEl.className = 'atoll-card-subtitle'
            subEl.textContent = state.subtitle
            wrapper.appendChild(subEl)
          }
          return [wrapper]
        }
        return null
      },
      footer (nodes, { state }) {
        if (state.hideFooter) {
          return null
        }
        if (nodes && nodes.length > 0) {
          const wrapper = document.createElement('div')
          wrapper.className = 'atoll-card-footer'
          nodes.forEach(node => wrapper.appendChild(node))
          return [wrapper]
        }
        return null
      }
    },
    server () {
      return {
        breakpoints: {
          sm: '(max-width: 575.98px)',
          md: '(max-width: 767.98px)',
          lg: '(max-width: 991.98px)',
          xl: '(max-width: 1199.98px)',
          xxl: '(max-width: 1399.98px)'
        }
      }
    },
    client ({ root, state, signal, observe }) {
      let mql = null
      let listener = null

      const teardown = () => {
        if (mql && listener) {
          mql.removeEventListener('change', listener)
          mql = null
          listener = null
        }
      }

      const syncFullscreen = () => {
        teardown()

        const mode = state.fullscreen
        if (!mode || mode === 'none') {
          root.removeAttribute('data-fullscreen-active')
          return
        }

        if (mode === 'always') {
          root.setAttribute('data-fullscreen-active', '')
          return
        }

        const query = state.breakpoints[mode]
        if (query) {
          mql = window.matchMedia(query)
          listener = (e) => root.toggleAttribute('data-fullscreen-active', e.matches)
          mql.addEventListener('change', listener, { signal })
          root.toggleAttribute('data-fullscreen-active', mql.matches)
        } else {
          root.removeAttribute('data-fullscreen-active')
        }
      }

      syncFullscreen()
      observe('fullscreen', syncFullscreen)
    }
  })
</script>
