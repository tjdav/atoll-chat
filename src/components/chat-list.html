<template id="chat-list">
  <div class="chat-list h-100 overflow-y-auto" ref="root">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Chat items will be rendered here via script -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const rootEl = refs('root')

      let loadedEnrichedItems = []
      let lastItem = null
      let hasMore = true
      let fuseInstance = null
      let lastIndexedCount = 0
      const BATCH_SIZE = 24

      const getLatestMessage = async (roomId) => {
        const messages = await $localDb.local_messages
          .where('[room_id+created_at]')
          .between([roomId, ''], [roomId, '\uffff'])
          .reverse()
          .toArray()
        return messages.find(m => m.type !== 'reaction')
      }

      const getPreviewText = (msg, participants, isGroup) => {
        if (!msg) {
          return ''
        }
        let prefix = ''
        if (msg.sender_id === $state.currentUser?.id) {
          prefix = 'You: '
        } else if (isGroup) {
          const sender = participants.find(p => p.id === msg.sender_id)
          if (sender) {
            prefix = `${sender.username.split(' ')[0]}: `
          }
        }
        if (msg.type === 'text') {
          return `${prefix}${msg.content}`
        }
        const fallbacks = {
          image: 'Sent a photo.',
          video: 'Sent a video.',
          voice: 'Sent a voice message.',
          audio: 'Sent an audio file.',
          file: 'Sent an attachment.'
        }
        if (msg.type === 'media') {
          const mime = msg.mime_type || ''
          if (mime.startsWith('image/')) {
            return `${prefix}${fallbacks.image}`
          }
          if (mime.startsWith('video/')) {
            return `${prefix}${fallbacks.video}`
          }
          if (mime.startsWith('audio/')) {
            return msg.waveform_data ? `${prefix}${fallbacks.voice}` : `${prefix}${fallbacks.audio}`
          }
          return `${prefix}${fallbacks.file}`
        }
        return `${prefix}${msg.content || ''}`
      }

      let currentRenderId = 0
      const fetchNextBatch = async () => {
        if (!hasMore) {
          return
        }
        let query = $localDb.local_rooms.reverse()
        if (lastItem) {
          query = query.filter(item => item.updated_at < lastItem.updated_at)
        }
        const rawItems = await query.limit(BATCH_SIZE).toArray()
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastItem = rawItems[rawItems.length - 1]
          const enriched = await Promise.all(rawItems.map(async (item) => {
            const latestMsg = await getLatestMessage(item.id)
            let roomName = ''
            if (!item.is_group) {
              const otherParticipants = (item.participants || []).filter(p => p.id !== $state.currentUser?.id)
              roomName = otherParticipants.length > 0 ? otherParticipants[0].username : (item.name || 'Direct Message')
            } else {
              roomName = item.name || 'Unnamed Group'
            }
            const previewText = getPreviewText(latestMsg, item.participants || [], item.is_group)
            return {
              item,
              latestMsg,
              roomName,
              previewText,
              searchContent: `${roomName} ${item.participants?.map(p => p.username).join(' ') || ''} ${previewText}`.toLowerCase()
            }
          }))
          loadedEnrichedItems = [...loadedEnrichedItems, ...enriched]
        }
      }

      const render = async () => {
        if (!listGroup) {
          return
        }
        const renderId = ++currentRenderId
        if (loadedEnrichedItems.length === 0) {
          await fetchNextBatch()
        }
        if (renderId !== currentRenderId) {
          return
        }

        let itemsToDisplay = loadedEnrichedItems
        const query = ($state.listSearchQuery || '').trim().toLowerCase()

        if (query && $Fuse) {
          if (!fuseInstance || lastIndexedCount !== loadedEnrichedItems.length) {
            fuseInstance = new $Fuse(loadedEnrichedItems, {
              keys: ['searchContent'],
              threshold: 0.4
            })
            lastIndexedCount = loadedEnrichedItems.length
          }
          itemsToDisplay = fuseInstance.search(query).map(r => r.item)
        }

        if (itemsToDisplay.length === 0) {
          listGroup.innerHTML = `<div class="p-4 text-center text-muted">${query ? 'No matches found in loaded chats' : 'No chats found'}</div>`
          return
        }

        const fragment = document.createDocumentFragment()
        for (const { item, latestMsg, roomName, previewText } of itemsToDisplay) {
          const me = item.participants?.find(p => p.id === $state.currentUser?.id)
          const isUnread = latestMsg && latestMsg.sender_id !== $state.currentUser?.id && latestMsg.id !== me?.last_read_message_id
          let relativeTime = ''
          if (latestMsg) {
            const time = $utils.formatRelativeTime(latestMsg.created_at)
            if (time) {
              relativeTime = ` · ${time}`
            }
          }
          const isActive = item.id === $state.activeSelectionId && $state.activeSelectionType === 'chats'
          const listItem = document.createElement('chat-list-item')
          listItem.setAttribute('room-id', item.id); listItem.setAttribute('room-name', roomName); listItem.setAttribute('preview-text', previewText)
          listItem.setAttribute('relative-time', relativeTime); listItem.setAttribute('is-unread', isUnread); listItem.setAttribute('is-active', isActive)
          listItem.setAttribute('is-group', item.is_group); listItem.setAttribute('user-role', item.user_role)
          listItem.setAttribute('participants-json', JSON.stringify(item.participants || []))
          if (item.avatar) {
            listItem.setAttribute('room-avatar', item.avatar)
          }
          fragment.appendChild(listItem)
        }
        if (renderId === currentRenderId) {
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
        }
      }

      const resetAndRender = async () => {
        loadedEnrichedItems = []; lastItem = null; hasMore = true; fuseInstance = null; lastIndexedCount = 0; await render()
      }

      if (rootEl) {
        rootEl.onscroll = async () => {
          if (rootEl.scrollTop + rootEl.clientHeight >= rootEl.scrollHeight - 50 && hasMore) {
            await fetchNextBatch(); render()
          }
        }
      }
      render()
      const debouncedRender = $utils.debounce(render, 50)
      const debouncedFullRender = $utils.debounce(resetAndRender, 50)
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'chats') {
          render()
        }
      })
      $state.subscribe('activeSelectionType', () => render())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('NEW_LOCAL_DATA', () => debouncedFullRender())
      $bus.on('NEW_LOCAL_ROOM', () => debouncedFullRender())
      $bus.on('ROOM_READ_STATE_CHANGED', () => debouncedFullRender())
    }
  })
</script>
