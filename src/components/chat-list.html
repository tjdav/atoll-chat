<template id="chat-list">
  <div class="chat-list h-100 overflow-y-auto" ref="root">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Chat items will be rendered here via script -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils, fuse, pocketbase, cryptoWorker }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const { $Fuse } = fuse
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const listGroup = refs('listGroup')
      const rootEl = refs('root')

      let loadedEnrichedItems = []
      let lastItem = null
      let hasMore = true
      let fuseInstance = null
      let lastIndexedCount = 0
      let isFetchingBatch = false
      const BATCH_SIZE = 24

      const getLatestMessage = async (roomId) => {
        const messages = await $localDb.local_messages
          .where('[room_id+created_at]')
          .between([roomId, ''], [roomId, '\uffff'])
          .reverse()
          .toArray()
        return messages.find(m => m.type !== 'reaction' && m.type !== 'ice_candidate')
      }

      const getPreviewText = (msg, participants, isGroup) => {
        if (!msg) {
          return ''
        }
        let prefix = ''
        if (msg.sender_id === $state.currentUser?.id) {
          prefix = 'You: '
        } else if (isGroup) {
          const sender = participants.find(p => p.id === msg.sender_id)
          if (sender) {
            const senderName = sender.name || sender.username
            prefix = `${senderName.split(' ')[0]}: `
          }
        }
        if (msg.type === 'text') {
          return `${prefix}${msg.content}`
        }
        const fallbacks = {
          image: 'Sent a photo.',
          video: 'Sent a video.',
          voice: 'Sent a voice message.',
          audio: 'Sent an audio file.',
          file: 'Sent an attachment.',
          call_offer: 'Video Call',
          call_answer: 'Call joined',
          call_end: 'Call ended'
        }
        if (msg.type === 'call_offer' || msg.type === 'call_answer' || msg.type === 'call_end') {
          return `${prefix}${fallbacks[msg.type]}`
        }
        if (msg.type === 'media') {
          const mime = msg.mime_type || ''
          if (mime.startsWith('image/')) {
            return `${prefix}${fallbacks.image}`
          }
          if (mime.startsWith('video/')) {
            return `${prefix}${fallbacks.video}`
          }
          if (mime.startsWith('audio/')) {
            return msg.waveform_data ? `${prefix}${fallbacks.voice}` : `${prefix}${fallbacks.audio}`
          }
          return `${prefix}${fallbacks.file}`
        }
        return `${prefix}${msg.content || ''}`
      }

      const enrichItem = async (item) => {
        const latestMsg = await getLatestMessage(item.id)
        let roomName = ''
        const participants = item.participants || []
        if (!item.is_group) {
          const otherParticipants = participants.filter(p => p.id !== $state.currentUser?.id)
          roomName = otherParticipants.length > 0 ? (otherParticipants[0].name || otherParticipants[0].username) : (item.name || 'Direct Message')
        } else {
          roomName = item.name || 'Unnamed Group'
        }
        const previewText = getPreviewText(latestMsg, participants, item.is_group)
        const me = participants.find(p => p.id === $state.currentUser?.id)
  
        // If explicitly marked as unread (null), it's unread.
        // If someone else sent the message and it's not the last read, it's unread.
        // If I sent the message, it's read (unless case 1 applies).
        const isUnread = latestMsg && (
          me?.last_read_message_id === null ||
          (latestMsg.sender_id !== $state.currentUser?.id && latestMsg.id !== me?.last_read_message_id)
        )

        const isMuted = me?.is_muted === true
        let relativeTime = ''
        if (latestMsg) {
          const time = $utils.formatRelativeTime(latestMsg.created_at)
          if (time) {
            relativeTime = ` · ${time}`
          }
        }

        return {
          item,
          latestMsg,
          roomName,
          previewText,
          isUnread,
          isMuted,
          relativeTime,
          searchContent: `${roomName} ${participants.map(p => p.name || p.username).join(' ') || ''} ${previewText}`.toLowerCase()
        }
      }

      const fetchNextBatch = async () => {
        if (!hasMore || isFetchingBatch) {
          return
        }
        isFetchingBatch = true
        try {
          let query = $localDb.local_rooms.reverse()
          if (lastItem) {
            query = query.filter(item => item.updated_at < lastItem.updated_at)
          }
          const rawItems = await query.limit(BATCH_SIZE).toArray()
          if (rawItems.length < BATCH_SIZE) {
            hasMore = false
          }
          if (rawItems.length > 0) {
            lastItem = rawItems[rawItems.length - 1]
            const enriched = await Promise.all(rawItems.map(enrichItem))
            // Re-verify they don't already exist in loadedEnrichedItems (anti-race)
            const newItems = enriched.filter(e => !loadedEnrichedItems.some(existing => existing.item.id === e.item.id))
            loadedEnrichedItems = [...loadedEnrichedItems, ...newItems]
          }
        } finally {
          isFetchingBatch = false
        }
      }

      const createAvatarComponent = (item, roomName) => {
        const participants = (item.participants || []).filter(p => p.id !== $state.currentUser?.id)

        // Custom room avatar
        if (item.avatar) {
          try {
            const avatarData = typeof item.avatar === 'string' ? JSON.parse(item.avatar) : item.avatar
            const avatar = document.createElement('ui-avatar')
            avatar.setAttribute('slot', 'avatar')
            avatar.setAttribute('name', roomName)
            avatar.setAttribute('media-id', avatarData.media_id)
            avatar.setAttribute('media-key', avatarData.key)
            avatar.setAttribute('media-nonce', avatarData.nonce)
            return avatar
          } catch (err) {
            console.error('[chat-list] Failed to parse room avatar:', err)
          }
        }

        // Fallback to participants
        if (!item.is_group && participants.length > 0) {
          const otherUser = participants[0]
          const avatar = document.createElement('ui-avatar')
          avatar.setAttribute('slot', 'avatar')
          avatar.setAttribute('name', otherUser.name || otherUser.username)
          if (otherUser.avatar) {
            avatar.setAttribute('url', pb.files.getURL(otherUser, otherUser.avatar, { thumb: '40x40' }))
          }
          return avatar
        } else if (item.is_group && participants.length > 0) {
          const group = document.createElement('ui-avatar-group')
          group.setAttribute('slot', 'avatar')
          const displayCount = Math.min(participants.length, 3)
          for (let i = 0; i < displayCount; i++) {
            const p = participants[i]
            const avatar = document.createElement('ui-avatar')
            avatar.setAttribute('slot', 'avatar')
            avatar.setAttribute('size', '28')
            avatar.setAttribute('name', p.name || p.username)
            if (p.avatar) {
              avatar.setAttribute('url', pb.files.getURL(p, p.avatar, { thumb: '28x28' }))
            }
            group.appendChild(avatar)
          }
          return group
        }

        // Default icon
        const iconContainer = document.createElement('div')
        iconContainer.setAttribute('slot', 'avatar')
        iconContainer.className = 'avatar-circle d-flex align-items-center justify-content-center rounded-circle'
        iconContainer.style.width = '40px'; iconContainer.style.height = '40px'
        iconContainer.style.backgroundColor = 'var(--bs-primary)'
        iconContainer.style.color = 'var(--bs-white)'
        iconContainer.innerHTML = '<i class="bi bi-chat-left-text fs-5"></i>'
        return iconContainer
      }

      const updateItemAttributes = (el, data) => {
        el.setAttribute('room-id', data.item.id)
        el.setAttribute('room-name', data.roomName)
        el.setAttribute('preview-text', data.previewText)
        el.setAttribute('relative-time', data.relativeTime)
        el.setAttribute('is-unread', data.isUnread ? 'true' : 'false')
        el.setAttribute('is-group', data.item.is_group ? 'true' : 'false')
        el.setAttribute('user-role', data.item.user_role)
        el.setAttribute('is-muted', data.isMuted ? 'true' : 'false')

        // Update Avatar slot
        const existingAvatar = el.querySelector('[slot="avatar"]')
        const newAvatar = createAvatarComponent(data.item, data.roomName)
        
        // Anti-flicker/race: Only update if changed or missing
        if (!existingAvatar) {
          el.appendChild(newAvatar)
        } else {
          // If it's a different kind of component (ui-avatar vs ui-avatar-group)
          // or if the attributes changed significantly.
          // For simplicity, we compare their serialized state or just replace if they are different tags.
          if (existingAvatar.tagName !== newAvatar.tagName || existingAvatar.getAttribute('media-id') !== newAvatar.getAttribute('media-id') || existingAvatar.getAttribute('url') !== newAvatar.getAttribute('url')) {
            existingAvatar.replaceWith(newAvatar)
          }
        }
      }

      let currentRenderId = 0
      const render = async () => {
        if (!listGroup) {
          return
        }
        const renderId = ++currentRenderId
        if (loadedEnrichedItems.length === 0) {
          await fetchNextBatch()
        }
        if (renderId !== currentRenderId) {
          return
        }

        let itemsToDisplay = loadedEnrichedItems
        const query = ($state.listSearchQuery || '').trim().toLowerCase()

        if (query && $Fuse) {
          if (!fuseInstance || lastIndexedCount !== loadedEnrichedItems.length) {
            fuseInstance = new $Fuse(loadedEnrichedItems, {
              keys: ['searchContent'],
              threshold: 0.4
            })
            lastIndexedCount = loadedEnrichedItems.length
          }
          itemsToDisplay = fuseInstance.search(query).map(r => r.item)
        }

        if (itemsToDisplay.length === 0) {
          listGroup.innerHTML = `<div class="p-4 text-center text-muted">${query ? 'No matches found' : 'No chats found'}</div>`
          return
        }

        const fragment = document.createDocumentFragment()
        for (const data of itemsToDisplay) {
          const listItem = document.createElement('chat-list-item')
          listItem.setAttribute('room-id', data.item.id)
          updateItemAttributes(listItem, data)
          fragment.appendChild(listItem)
        }

        if (renderId === currentRenderId) {
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
          if (!state.__scrollRestored && $state.listScrollPositions?.chats !== undefined) {
            setTimeout(() => {
              if (rootEl) {
                rootEl.scrollTop = $state.listScrollPositions.chats
              }
            }, 50)
            state.__scrollRestored = true
          }
        }
      }

      const updatingRooms = new Set()
      const handleUpdateInPlace = async (roomId) => {
        if (!listGroup || updatingRooms.has(roomId)) {
          return
        }
        updatingRooms.add(roomId)
        try {
          const room = await $localDb.local_rooms.get(roomId)
  
          if (!room) {
            const existingItem = listGroup.querySelector(`chat-list-item[room-id="${roomId}"]`)
            if (existingItem) {
              existingItem.remove()
            }
            // Remove from state array
            const idx = loadedEnrichedItems.findIndex(i => i.item.id === roomId)
            if (idx !== -1) {
              loadedEnrichedItems.splice(idx, 1)
            }
            return
          }

          const data = await enrichItem(room)
          
          // Double check we still need to update after enrichment delay
          if (!updatingRooms.has(roomId)) return 

          // Update state array
          const idx = loadedEnrichedItems.findIndex(i => i.item.id === roomId)
          if (idx !== -1) {
            loadedEnrichedItems.splice(idx, 1)
          }
          loadedEnrichedItems.unshift(data)

          // Update DOM
          const existingItem = listGroup.querySelector(`chat-list-item[room-id="${roomId}"]`)
          if (existingItem) {
            updateItemAttributes(existingItem, data)
            if (listGroup.firstElementChild !== existingItem) {
               listGroup.prepend(existingItem)
            }
          } else if (!$state.listSearchQuery) {
            // Check if we need to clear "No chats found" message
            const emptyState = listGroup.querySelector('.text-muted')
            if (emptyState && emptyState.textContent.includes('No chats found')) {
              emptyState.remove()
            }

            // Check again after async enrich
            if (!listGroup.querySelector(`chat-list-item[room-id="${roomId}"]`)) {
              const newItem = document.createElement('chat-list-item')
              updateItemAttributes(newItem, data)
              listGroup.prepend(newItem)
            }
          }
        } finally {
          updatingRooms.delete(roomId)
        }
      }

      const markAsRead = async (roomId) => {
        const room = await $localDb.local_rooms.get(roomId)
        if (!room) {
          return
        }
        const latestMsg = await getLatestMessage(roomId)
        if (!latestMsg) {
          return
        }

        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (me && me.last_read_message_id !== latestMsg.id) {
          me.last_read_message_id = latestMsg.id
          await $localDb.local_rooms.put(room)
          try {
            const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${roomId}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
            if (memberRecord) {
              await pb.collection('room_members').update(memberRecord.id, { last_read_message_id: latestMsg.id }, { requestKey: null })
            }
          } catch (err) {
            console.error('[chat-list] Failed to update read status:', err)
          }
          $bus.emit('room:read_state_changed', roomId)
        }
      }

      listGroup.addEventListener('action:select-chat', async (e) => {
        const { roomId } = e.detail
        $state.activeSelectionId = roomId
        $state.activeSelectionType = 'chats'
        const item = loadedEnrichedItems.find(i => i.item.id === roomId)
        if (item?.isUnread) {
          await markAsRead(roomId)
        }
      }, { signal })

      listGroup.addEventListener('action:toggle-read', async (e) => {
        const { roomId, isUnread } = e.detail
        const room = await $localDb.local_rooms.get(roomId)
        if (!room) {
          return
        }
        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }

        let newLastReadId = null
        if (isUnread) {
          const latestMsg = await getLatestMessage(roomId)
          if (latestMsg) {
            newLastReadId = latestMsg.id
          }
        }

        me.last_read_message_id = newLastReadId
        await $localDb.local_rooms.put(room)
        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${roomId}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').update(memberRecord.id, { last_read_message_id: newLastReadId }, { requestKey: null })
          }
        } catch (err) {
          console.error('[chat-list] Failed to toggle read status:', err)
        }

        $bus.emit('room:read_state_changed', roomId)
        $bus.emit('ui:show_toast', {
          message: newLastReadId === null ? 'Marked as unread' : 'Marked as read',
          type: 'success'
        })
      }, { signal })

      listGroup.addEventListener('action:toggle-mute', async (e) => {
        const { roomId, isMuted } = e.detail
        const room = await $localDb.local_rooms.get(roomId)
        if (!room) {
          return
        }
        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }

        const newMuteStatus = !isMuted
        me.is_muted = newMuteStatus
        await $localDb.local_rooms.put(room)
        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${roomId}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').update(memberRecord.id, { is_muted: newMuteStatus }, { requestKey: null })
          }
        } catch (err) {
          console.error('[chat-list] Failed to toggle mute status:', err)
        }

        $bus.emit('room:member_updated', { room_id: roomId })
        $bus.emit('ui:show_toast', {
          message: newMuteStatus ? 'Notifications muted' : 'Notifications unmuted',
          type: 'success'
        })
      }, { signal })

      listGroup.addEventListener('action:delete-chat', async (e) => {
        const { roomId, isGroup } = e.detail
        const confirmMessage = isGroup ? 'Are you sure you want to leave this group?' : 'Are you sure you want to delete this chat?'
        if (!confirm(confirmMessage)) {
          return
        }

        try {
          const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${roomId}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
          if (memberRecord) {
            await pb.collection('room_members').delete(memberRecord.id, { requestKey: null })
          }
          const room = await $localDb.local_rooms.get(roomId)
          if (!isGroup && room?.participants?.length <= 1) {
            await pb.collection('rooms').delete(roomId, { requestKey: null })
          }
          await $worker.execute('worker:delete_local_room', { roomId })
          $bus.emit('ui:show_toast', {
            message: isGroup ? 'Left group' : 'Chat deleted',
            type: 'success'
          })
          if ($state.activeSelectionId === roomId) {
            $state.activeSelectionId = null
          }
        } catch (err) {
          console.error('[chat-list] Failed to delete chat:', err)
        }
      }, { signal })

      listGroup.addEventListener('action:edit-room', async (e) => {
        const { roomId } = e.detail
        const room = await $localDb.local_rooms.get(roomId)
        if (room) {
          $bus.emit('ui:open_edit_room', room)
        }
      }, { signal })

      const saveListScroll = () => {
        if (!rootEl || (rootEl.offsetWidth === 0 && rootEl.offsetHeight === 0)) {
          return
        }
        if (!$state.listScrollPositions) {
          $state.listScrollPositions = {}
        }
        $state.listScrollPositions.chats = rootEl.scrollTop
      }

      const debouncedSaveScroll = $utils.debounce(saveListScroll, 100)
      const debouncedRender = $utils.debounce(render, 50)

      if (rootEl) {
        rootEl.onscroll = async () => {
          if (rootEl.scrollTop + rootEl.clientHeight >= rootEl.scrollHeight - 50 && hasMore) {
            await fetchNextBatch(); render()
          }
          debouncedSaveScroll()
        }
      }

      signal.addEventListener('abort', saveListScroll)

      render()
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('db:new_local_room', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('db:room_deleted', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('room:member_updated', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('room:read_state_changed', (roomId) => handleUpdateInPlace(roomId))
      $bus.on('sync:complete', () => {
        loadedEnrichedItems = []; lastItem = null; hasMore = true; debouncedRender()
      })
      $bus.on('auth:unlocked', () => {
        loadedEnrichedItems = []; lastItem = null; hasMore = true; debouncedRender()
      })
    }
  })
</script>
