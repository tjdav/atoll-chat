<template id="document-list">
  <div class="document-list h-100 overflow-y-auto" ref="root">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Documents will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const rootEl = refs('root')

      let loadedEnrichedItems = []
      let lastTimestamp = null
      let hasMore = true
      let fuseInstance = null
      let lastIndexedCount = 0
      const BATCH_SIZE = 24
      let currentRenderId = 0

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return
        }
        const allAssets = await $localDb.local_assets.reverse().sortBy('created_at')
        const filteredAssets = allAssets.filter(a => {
          const mt = a.mime_type || ''
          return !mt.startsWith('image/') && !mt.startsWith('audio/') && !mt.startsWith('video/')
        })
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = filteredAssets.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawItems = filteredAssets.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          const enriched = await Promise.all(rawItems.map(async (asset) => {
            const room = await $localDb.local_rooms.get(asset.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const searchContent = `${asset.filename || ''} ${roomName}`.toLowerCase()
            return {
              item: asset,
              roomName,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          loadedEnrichedItems = [...loadedEnrichedItems, ...enriched]
        }
      }

      const render = async () => {
        if (!listGroup) {
          return
        }
        const renderId = ++currentRenderId
        if (loadedEnrichedItems.length === 0) {
          await fetchNextBatch()
        }
        if (renderId !== currentRenderId) {
          return
        }
        let itemsToDisplay = loadedEnrichedItems
        const query = ($state.listSearchQuery || '').trim().toLowerCase()
        if (query && $Fuse) {
          if (!fuseInstance || lastIndexedCount !== loadedEnrichedItems.length) {
            fuseInstance = new $Fuse(loadedEnrichedItems, {
              keys: ['searchContent'],
              threshold: 0.4
            })
            lastIndexedCount = loadedEnrichedItems.length
          }
          itemsToDisplay = fuseInstance.search(query).map(r => r.item)
        }
        if (itemsToDisplay.length === 0) {
          listGroup.innerHTML = `<div class="p-4 text-center text-muted">${query ? 'No matches found in loaded documents' : 'No documents found'}</div>`
          return
        }
        const fragment = document.createDocumentFragment()
        itemsToDisplay.forEach(({ item, roomName, timestamp }) => {
          const btn = document.createElement('button')
          btn.type = 'button'
          const isActive = item.id === $state.activeSelectionId && $state.activeSelectionType === 'documents'
          btn.className = `list-group-item list-group-item-action d-flex align-items-center border-0 py-3 ${isActive ? 'active' : ''}`
          btn.innerHTML = `<div class="list-item-icon"><i class="bi bi-file-earmark-fill fs-5"></i></div><div class="text-truncate"><div class="fw-bold text-truncate">${item.filename || 'Unnamed File'}</div><small class="opacity-75 d-block text-truncate">${roomName} • ${timestamp}</small></div><i class="bi bi-chevron-right ms-auto opacity-50"></i>`
          btn.onclick = () => {
            $state.activeSelectionId = item.id; $state.activeSelectionType = 'documents'
          }
          fragment.appendChild(btn)
        })
        if (renderId === currentRenderId) {
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
        }
      }

      const resetAndRender = async () => {
        loadedEnrichedItems = []; lastTimestamp = null; hasMore = true; fuseInstance = null; lastIndexedCount = 0; await render()
      }

      if (rootEl) {
        rootEl.onscroll = async () => {
          if (rootEl.scrollTop + rootEl.clientHeight >= rootEl.scrollHeight - 50 && hasMore) {
            await fetchNextBatch(); render()
          }
        }
      }
      render()
      const debouncedRender = $utils.debounce(render, 50)
      const debouncedFullRender = $utils.debounce(resetAndRender, 50)
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'documents') {
          render()
        }
      })
      $state.subscribe('activeSelectionType', () => render())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('NEW_LOCAL_DATA', () => debouncedFullRender())
    }
  })
</script>
