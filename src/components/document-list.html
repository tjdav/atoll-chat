<template id="document-list">
  <div class="document-list h-100 overflow-y-auto" ref="scrollRoot">
    <div class="list-group list-group-spaced" ref="listGroup">
      <!-- Documents will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, storage, eventBus, globalStore, refs, utils, fuse }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'documents',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const rawItems = await $storage.getAssetsByCategory('document', lastItem ? lastItem.item : null, BATCH_SIZE)
          const items = await Promise.all(rawItems.map(async (asset) => {
            const room = await $storage.getRoom(asset.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const searchContent = `${asset.filename || ''} ${roomName}`.toLowerCase()
            return {
              item: asset,
              roomName,
              timestamp: new Date(asset.created_at).toLocaleString(),
              searchContent
            }
          }))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listGroup.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No documents found'}</div>`
            return
          }
          const fragment = document.createDocumentFragment()
          itemsToDisplay.forEach(({ item, roomName, timestamp }) => {
            const btn = document.createElement('button')
            btn.type = 'button'
            const isActive = item.id === $state.activeSelectionId && $state.activeSelectionType === 'documents'
            btn.className = `list-group-item border-0 w-100 text-start bg-transparent ${isActive ? 'active' : ''}`

            const iconDiv = document.createElement('div')
            iconDiv.className = 'list-item-icon d-flex align-items-center justify-content-center'
  
            const icon = document.createElement('i')
            icon.className = 'bi bi-file-earmark-fill fs-5'
            iconDiv.appendChild(icon)
            btn.appendChild(iconDiv)

            const textDiv = document.createElement('div')
            textDiv.className = 'text-truncate flex-grow-1'

            const titleDiv = document.createElement('div')
            titleDiv.className = 'fw-bold text-truncate'
            titleDiv.textContent = item.filename || 'Unnamed File'
            textDiv.appendChild(titleDiv)

            const subDiv = document.createElement('small')
            subDiv.className = 'text-body-secondary d-block text-truncate'
            subDiv.textContent = `${roomName} • ${timestamp}`
            textDiv.appendChild(subDiv)

            btn.appendChild(textDiv)

            const chevron = document.createElement('i')
            chevron.className = 'bi bi-chevron-right ms-auto text-body-secondary opacity-50'
            btn.appendChild(chevron)

            btn.onclick = () => {
              $state.activeSelectionId = item.id; $state.activeSelectionType = 'documents'
              $bus.emit('ui:selection_made')
              debouncedRender()
            }
            fragment.appendChild(btn)
          })
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'documents') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', () => {
        manager.reset(); debouncedRender()
      })

      debouncedRender()
    }
  })
</script>
