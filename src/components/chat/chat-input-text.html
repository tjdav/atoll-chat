<template id="chat-input-text">
  <div class="d-flex align-items-end chat-input-text">
    <input type="file" ref="fileInput" class="d-none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.rtf,.zip,.rar,.7z,.tar,.gz" data-testid="fileInput">
    
    <!-- Attachment Button -->
    <atoll-button 
      icon-only="true" 
      variant="ghost" 
      size="sm" 
      ref="attachButton" 
      title="Attach File" 
      aria-label="Attach File"
      disabled="{{ isDisabled }}"
    >
      <atoll-icon name="add" size="20"></atoll-icon>
    </atoll-button>

    <div class="input-wrapper">
      <textarea
        id="{{ ref_messageInput }}"
        ref="messageInput"
        class="form-control"
        placeholder="Type a message..."
        rows="1"
        disabled="{{ isDisabled }}"
      >{{ currentMessageText }}</textarea>
      
      <atoll-button 
        icon-only="true" 
        variant="ghost" 
        size="sm" 
        class="emoji-button" 
        ref="emojiButton" 
        title="Emojis" 
        aria-label="Select Emoji"
        disabled="{{ isDisabled }}"
      >
        <atoll-icon name="globe" size="20"></atoll-icon>
      </atoll-button>
    </div>

    <atoll-button 
      icon-only="true" 
      variant="ghost" 
      size="sm" 
      ref="micButton" 
      title="Voice message" 
      aria-label="Voice message"
      disabled="{{ isDisabled }}" 
      data-testid="btn-mic-toggle"
    >
      <atoll-icon name="mic" size="20"></atoll-icon>
    </atoll-button>

    <atoll-button 
      icon-only="true" 
      variant="primary" 
      size="sm" 
      pill="true"
      ref="sendButton" 
      aria-label="Send Message"
      disabled="{{ isDisabled }}" 
      data-testid="sendButton"
    >
      <atoll-icon name="add" size="20"></atoll-icon>
    </atoll-button>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSending: Boolean,
      isUploading: Boolean,
      isCompressing: Boolean
    },
    server: () => ({
      currentMessageText: ''
    }),
    getters: {
      isDisabled: (state) => (state.isSending || state.isUploading || state.isCompressing ? true : false),
      sendIconClass: (state) => (state.isCompressing ? 'd-none' : ''),
      spinnerClass: (state) => (state.isCompressing ? '' : 'd-none')
    },
    client: ({ refs, state, globalStore, eventBus, signal, utils }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $device } = utils
      const messageInput = refs('messageInput')
      const emojiButton = refs('emojiButton')

      // Sync initial global state
      state.currentMessageText = $state.currentMessageText || ''
      if (messageInput) {
        messageInput.value = state.currentMessageText
      }

      const autoExpand = () => {
        messageInput.style.height = 'auto'
        messageInput.style.height = messageInput.scrollHeight + 'px'
      }

      messageInput.addEventListener('input', () => {
        $state.currentMessageText = messageInput.value
        state.currentMessageText = messageInput.value
        autoExpand()
      }, { signal })

      // Handle paste: convert HTML to Markdown
      messageInput.addEventListener('paste', async (e) => {
        const html = e.clipboardData.getData('text/html')
        if (html) {
          e.preventDefault()
  
          const { default: TurndownService } = await import('turndown')
          const turndownService = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced'
          })
  
          const markdown = turndownService.turndown(html)
  
          const start = messageInput.selectionStart
          const end = messageInput.selectionEnd
          const text = messageInput.value
          const newValue = text.substring(0, start) + markdown + text.substring(end)
  
          messageInput.value = newValue
          $state.currentMessageText = newValue
          state.currentMessageText = newValue
  
          const newPos = start + markdown.length
          messageInput.setSelectionRange(newPos, newPos)
  
          autoExpand()
        }
      }, { signal })

      // Watch for programmatic changes to currentMessageText
      if (typeof $state.subscribe === 'function') {
        $state.subscribe('currentMessageText', (val) => {
          if (messageInput.value !== val) {
            messageInput.value = val || ''
            state.currentMessageText = val || ''
            autoExpand()
          }
        })
      }

      // Initial expand
      autoExpand()

      const setupFileInput = (btnRef, inputRef) => {
        const btn = refs(btnRef)
        const input = refs(inputRef)

        const clickHandler = (e) => {
          if (e) {
            e.preventDefault()
          }
          input.click()
        }

        if (btn) {
          btn.addEventListener('click', clickHandler, { signal })
        }

        if (input) {
          input.addEventListener('change', () => {
            const file = input.files[0]
            if (file) {
              $bus.emit('ui:file_selected', { file })
              input.value = ''
            }
          }, { signal })
        }
      }

      setupFileInput('attachButton', 'fileInput')

      refs('micButton').addEventListener('click', () => {
        $bus.emit('ui:mic_clicked')
      }, { signal })

      refs('sendButton').addEventListener('click', () => {
        $bus.emit('ui:send_clicked')
      }, { signal })

      emojiButton.addEventListener('click', () => {
        const rect = emojiButton.getBoundingClientRect()
        $bus.emit('ui:show_reaction_picker', {
          x: rect.left - 300,
          y: rect.top - 410,
          targetId: 'CHAT_INPUT'
        })
      }, { signal })

      $bus.on('ui:emoji_selected', (payload) => {
        const emoji = payload.emoji
        const start = messageInput.selectionStart
        const end = messageInput.selectionEnd
        const text = messageInput.value
        const before = text.substring(0, start)
        const after = text.substring(end)
  
        const newValue = before + emoji + after
        messageInput.value = newValue
        $state.currentMessageText = newValue
        state.currentMessageText = newValue
  
        // Restore focus and set caret position
        messageInput.focus()
        const newPos = start + emoji.length
        messageInput.setSelectionRange(newPos, newPos)
  
        autoExpand()
      })

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $bus.emit('ui:send_clicked')
        }
      }, { signal })


      $bus.on('ui:focus_input', () => {
        if ($device.isTouch()) {
          messageInput.blur()
          setTimeout(() => {
            $bus.emit('ui:scroll_to_bottom', { smooth: true })
          }, 300)
          return
        }
        requestAnimationFrame(() => {
          messageInput.focus()
        })
      })
    }
  })
</script>
