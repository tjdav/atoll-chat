<template id="chat-view">
  <div class="chat-view d-flex flex-column h-100 bg-body">
    <!-- Chat Header -->
    <header class="app-header chat-view-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <button class="btn btn-link link-body-emphasis ps-0 pe-2 d-sm-none atoll-touch-target" ref="btnBack">
          <i class="bi bi-chevron-left fs-4"></i>
        </button>
        <atoll-profile ref="headerAvatar" size="sm" class="d-inline-block me-3" alt="{{ roomName }}"></atoll-profile>
        <div>
          <h6 class="atoll-text-title-2 mb-0">{{ roomName }}</h6>
          <small class="text-muted opacity-75">{{ roomStatus }}</small>
        </div>
      </div>
      <div class="d-flex gap-2">
        <atoll-button 
          ref="btnAudioCall" 
          icon-only="true" 
          variant="secondary" 
          size="md" 
          pill="true" 
          title="Audio Call" 
          aria-label="Audio Call" 
          data-testid="btnAudioCall"
        >
          <atoll-icon name="phone" size="24"></atoll-icon>
        </atoll-button>
        <atoll-button 
          ref="btnVideoCall" 
          icon-only="true" 
          variant="secondary" 
          size="md" 
          pill="true" 
          title="Video Call" 
          aria-label="Video Call" 
          data-testid="btnVideoCall"
        >
          <atoll-icon name="videocam" size="24"></atoll-icon>
        </atoll-button>
        <atoll-button 
          ref="btnDetails"
          variant="outline" 
          size="sm" 
          pill="true"
        >
          <span slot="leading"><atoll-icon name="settings" size="16"></atoll-icon></span>
          <span class="d-none d-sm-inline">Details</span>
        </atoll-button>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-grow-1 position-relative overflow-hidden">
      <!-- Message Timeline -->
      <message-timeline></message-timeline>

      <!-- Room Details Sidebar (Slide-over) -->
      <div class="sidebar-slide-over shadow-lg border-start bg-body" hidden="{{ hideSidebar }}">
        <room-details-sidebar></room-details-sidebar>
      </div>
    </div>

    <!-- Chat Input -->
    <chat-input></chat-input>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      roomName: 'Loading...',
      roomInitial: '?',
      roomStatus: 'Encrypted',
      isRoomDetailsOpen: false
    }),
    getters: {
      hideSidebar: (state) => !state.isRoomDetailsOpen
    },
    client: async ({ refs, state, globalStore, storage, pocketbase, utils, signal, eventBus, webrtc: webrtcPluginContext }) => {
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $webrtc } = webrtcPluginContext
      const { pb } = pocketbase || {}
      const headerAvatar = refs('headerAvatar')

      state.isRoomDetailsOpen = $state.isRoomDetailsOpen || false

      const renderHeaderAvatar = (room, participants) => {
        if (!headerAvatar || !room) {
          return
        }
        const existingSlot = headerAvatar.querySelector('[slot="image"]')
        if (existingSlot) {
          existingSlot.remove()
        }

        if (room.avatar) {
          try {
            const avatarData = typeof room.avatar === 'string' ? JSON.parse(room.avatar) : room.avatar
            headerAvatar.setAttribute('type', 'single')
            headerAvatar.setAttribute('size', 'sm')
            headerAvatar.setAttribute('name', state.roomName)
            headerAvatar.setAttribute('alt', state.roomName)

            const $media = utils?.$media
            if ($media && typeof $media.decrypt === 'function' && avatarData.media_id) {
              $media.decrypt(avatarData, signal).then((url) => {
                headerAvatar.setAttribute('src', url)
              }).catch(err => {
                console.error('[chat-view] Failed to decrypt room avatar:', err)
                headerAvatar.removeAttribute('src')
              })
            }
            return
          } catch (err) {
            console.error('[chat-view] Failed to parse room avatar:', err)
          }
        }

        if (!room.is_group && participants.length > 0) {
          const otherUser = participants[0]
          const displayName = otherUser.name || otherUser.username || state.roomName
          headerAvatar.setAttribute('type', 'single')
          headerAvatar.setAttribute('size', 'sm')
          headerAvatar.setAttribute('name', displayName)
          headerAvatar.setAttribute('alt', displayName)
          if (otherUser.avatar && pb?.files) {
            headerAvatar.setAttribute('src', pb.files.getURL(otherUser, otherUser.avatar, { thumb: '42x42' }))
          } else {
            headerAvatar.removeAttribute('src')
          }
        } else if (room.is_group && participants.length > 0) {
          headerAvatar.setAttribute('type', 'multiparty')
          headerAvatar.setAttribute('size', 'sm')
          const splitCount = Math.min(Math.max(participants.length, 2), 4)
          headerAvatar.setAttribute('split-count', splitCount)
          headerAvatar.removeAttribute('src')

          const slotDiv = document.createElement('div')
          slotDiv.setAttribute('slot', 'image')

          const displayCount = Math.min(participants.length, splitCount)
          for (let i = 0; i < displayCount; i++) {
            const p = participants[i]
            const pName = p.name || p.username || 'Member'
            if (p.avatar && pb?.files) {
              const img = document.createElement('img')
              img.src = pb.files.getURL(p, p.avatar, { thumb: '30x30' })
              img.alt = pName
              slotDiv.appendChild(img)
            } else {
              const img = document.createElement('img')
              img.alt = pName
              slotDiv.appendChild(img)
            }
          }
          headerAvatar.appendChild(slotDiv)
        } else {
          headerAvatar.setAttribute('type', 'single')
          headerAvatar.setAttribute('size', 'sm')
          headerAvatar.setAttribute('name', state.roomName)
          headerAvatar.setAttribute('alt', state.roomName)
          headerAvatar.removeAttribute('src')
        }
      }

      const updateRoomInfo = async (room_id) => {
        if (!room_id || typeof room_id !== 'string' || $state.activeSelectionType !== 'chats') {
          return
        }
  
        try {
          const room = await $storage.getRoom(room_id)

          if (room) {
            const participants = (room.participants || []).filter(p => p.id !== $state.currentUser?.id)
            if (!room.is_group && participants.length > 0) {
              state.roomName = participants[0].name || participants[0].username
            } else {
              state.roomName = room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')
            }
            state.roomInitial = state.roomName.charAt(0).toUpperCase()
  
            let baseStatus = room.is_group ? 'Group Chat' : 'Private'
            if ($state.callStatus && $state.callStatus !== 'idle' && $state.activeCallRoomId === room_id) {
              state.roomStatus = $state.callStatus === 'active' ? 'In Call' : 'Calling...'
            } else {
              state.roomStatus = baseStatus
            }

            renderHeaderAvatar(room, participants)
          }
        } catch (err) {
          console.error('[chat-view] Failed to load room info:', err)
        }
      }

      // Initial load
      updateRoomInfo($state.activeSelectionId)

      // Watch for room changes
      $state.subscribe('activeSelectionId', (val) => {
        updateRoomInfo(val)
        // Close details when switching rooms
        state.isRoomDetailsOpen = false
        $state.isRoomDetailsOpen = false
      })

      $state.subscribe('activeSelectionType', () => {
        updateRoomInfo($state.activeSelectionId)
      })

      $state.subscribe('callStatus', () => {
        updateRoomInfo($state.activeSelectionId)
      })

      $state.subscribe('activeCallRoomId', () => {
        updateRoomInfo($state.activeSelectionId)
      })

      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          updateRoomInfo($state.activeSelectionId)
        }
      })

      $state.subscribe('isRoomDetailsOpen', (val) => {
        state.isRoomDetailsOpen = val
      })

      const btnDetails = refs('btnDetails')
      if (btnDetails) {
        btnDetails.addEventListener('click', () => {
          state.isRoomDetailsOpen = !state.isRoomDetailsOpen
          $state.isRoomDetailsOpen = state.isRoomDetailsOpen
        })
      }

      $bus.on('ui:close_room_details', () => {
        state.isRoomDetailsOpen = false
        $state.isRoomDetailsOpen = false
      })

      refs('btnBack').addEventListener('click', () => {
        $bus.emit('ui:open_mobile_nav')
      })

      const initiateCall = async (video = true) => {
        if ($state.callStatus !== 'idle') {
          return
        }

        let localStream = null
        try {
          console.log('[chat-view] Requesting media permissions (audio and video)...')
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video
          })
          console.log('[chat-view] Media permissions granted')
        } catch (err) {
          console.warn('[chat-view] Failed to get audio and video, trying audio-only fallback:', err)
          if (video) {
            try {
              localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
              })
              console.log('[chat-view] Audio-only fallback media permissions granted')
            } catch (fallbackErr) {
              console.error('[chat-view] Both audio/video and audio-only media requests failed:', fallbackErr)
              return
            }
          } else {
            console.error('[chat-view] Failed to initiate audio call:', err)
            return
          }
        }

        try {
          /**
           * @todo We'll need a way to pass this stream to the call-overlay.
           * Since call-overlay is global and reacts to callStatus, we can use $bus or shared state.
           * For now, let's assume call-overlay will fetch its own stream or we pass it via a custom event.
           */
  
          $state.activeCallRoomId = $state.activeSelectionId
          $state.set('callStatus', 'active')
  
          // Emit event so call-overlay can pick up the localStream we just created
          $bus.emit('call:initiated_locally', { localStream })
  
          await $webrtc.initiateCall($state.activeCallRoomId, localStream)
        } catch (err) {
          console.error('[chat-view] Failed to initiate call:', err)
        }
      }

      refs('btnAudioCall').addEventListener('click', () => initiateCall(false))
      refs('btnVideoCall').addEventListener('click', () => initiateCall(true))
    }
  })
</script>
