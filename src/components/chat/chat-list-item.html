<template id="chat-list-item">
  <atoll-list-item
    ref="container"
    title="{{ roomName }}"
    description="{{ previewText }}"
    timestamp="{{ relativeTime }}"
    badge="{{ unreadBadgeCount }}"
    selected="{{ isActive }}"
    clickable
    size="lg"
  >
    <!-- Avatar / Profile Slot -->
    <slot name="avatar" slot="left"></slot>

    <!-- Status Indicators (Right Slot) -->
    <div slot="right" class="d-flex align-items-center gap-1">
      <slot name="muteIcon"></slot>
    </div>
  </atoll-list-item>
</template>

<style>
  :host {
    display: block;
    container-type: inline-size;
    width: 100%;
  }

  :host([hidden]) {
    display: none !important;
  }

  .chat-list-item .group-avatar-container {
    background-color: transparent !important;
    overflow: visible;
  }

  .chat-list-item .stacked-avatar-1,
  .chat-list-item .stacked-avatar-2,
  .chat-list-item .stacked-avatar-3 {
    position: absolute;
    border: 2px solid var(--atoll-body-bg, #ffffff);
    box-shadow: 0 0 0 1px rgba(var(--atoll-black-rgb, 0, 0, 0), 0.05);
  }

  .chat-list-item.active .stacked-avatar-1,
  .chat-list-item.active .stacked-avatar-2,
  .chat-list-item.active .stacked-avatar-3 {
    border-color: var(--atoll-primary, #06C755);
  }

  .chat-list-item .group-avatar-container:has(.stacked-avatar-2):not(:has(.stacked-avatar-3)) .stacked-avatar-1 {
    top: 0;
    right: 0;
    z-index: 2;
  }

  .chat-list-item .group-avatar-container:has(.stacked-avatar-2):not(:has(.stacked-avatar-3)) .stacked-avatar-2 {
    bottom: 0;
    left: 0;
    z-index: 1;
  }

  .chat-list-item .group-avatar-container:has(.stacked-avatar-3) .stacked-avatar-1 {
    top: 0;
    left: 10px;
    z-index: 3;
  }

  .chat-list-item .group-avatar-container:has(.stacked-avatar-3) .stacked-avatar-2 {
    bottom: 0;
    left: 0;
    z-index: 2;
  }

  .chat-list-item .group-avatar-container:has(.stacked-avatar-3) .stacked-avatar-3 {
    bottom: 0;
    right: 0;
    z-index: 1;
  }

  .chat-list-item:hover .group-hover-visible {
    opacity: 1 !important;
  }

  .chat-list-item .unread-dot {
    right: var(--atoll-list-item-padding-x, 16px);
    width: 10px;
    height: 10px;
  }

  /* Container Query: Narrow/Compact Containers */
  @container (max-width: 260px) {
    ::slotted(atoll-list-item),
    atoll-list-item {
      --atoll-list-item-padding-x: 10px;
    }
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      roomId: String,
      roomName: String,
      previewText: String,
      relativeTime: String,
      isUnread: Boolean,
      unreadCount: {
        type: Number,
        default: 0
      },
      isGroup: Boolean,
      userRole: String,
      isMuted: Boolean
    },

    slots: {
      muteIcon (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }
  
        const isMuted = state.isMuted === 'true' || state.isMuted === true || state.isMuted === ''

        if (isMuted) {
          const icon = document.createElement('atoll-icon')

          icon.setAttribute('name', 'bell-off')
          icon.setAttribute('size', '16')
          icon.setAttribute('color', 'var(--atoll-text-tertiary, #999999)')
  
          return [icon]
        }
        return null
      }
    },

    getters: {
      unreadBadgeCount: (state) => {
        const isUnread = state.isUnread === 'true' || state.isUnread === true || state.isUnread === ''
  
        return isUnread ? String(state.unreadCount || 1) : ''
      }
    },

    client: ({ refs, state, globalStore, eventBus, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const container = refs('container')

      // Synchronize active selection state
      const syncActiveState = () => {
        state.isActive = $state.activeSelectionId === state.roomId && $state.activeSelectionType === 'chats'
      }

      $state.subscribe('activeSelectionId', syncActiveState)
      $state.subscribe('activeSelectionType', syncActiveState)
      syncActiveState()

      // Handle item click selection
      container.addEventListener('atoll-item-click', () => {
        $bus.emit('room:select', { room_id: state.roomId })
        $bus.emit('ui:selection_made')
      }, { signal })
    }
  })
</script>
