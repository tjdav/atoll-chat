<template id="chat-list-item">
  <atoll-list-item
    ref="container"
    title="{{ roomName }}"
    description="{{ previewText }}"
    timestamp="{{ relativeTime }}"
    badge="{{ unreadBadgeCount }}"
    selected="{{ isActive }}"
    clickable
    size="lg"
  >
    <!-- Avatar / Profile Slot -->
    <slot name="avatar" slot="left"></slot>

    <!-- Status Indicators (Right Slot) -->
    <div slot="right" class="d-flex align-items-center gap-1">
      <atoll-icon 
        hidden="{{ hideMuteIcon }}" 
        name="bell-off" 
        size="16" 
        color="var(--atoll-text-tertiary, #999999)"
      ></atoll-icon>
    </div>
  </atoll-list-item>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      roomId: String,
      roomName: String,
      previewText: String,
      relativeTime: String,
      isUnread: Boolean,
      unreadCount: {
        type: Number,
        default: 0
      },
      isGroup: Boolean,
      userRole: String,
      isMuted: Boolean
    },

    getters: {
      unreadBadgeCount: (state) => {
        const isUnread = state.isUnread === 'true' || state.isUnread === true || state.isUnread === ''
        return isUnread ? String(state.unreadCount || 1) : ''
      },
      hideMuteIcon: (state) => {
        const isMuted = state.isMuted === 'true' || state.isMuted === true || state.isMuted === ''
        return !isMuted
      }
    },

    client: ({ refs, state, globalStore, eventBus, signal, root, observe }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const container = refs('container')

      observe('roomName', (val) => {
        state.roomName = val
      })
      observe('room-name', (val) => {
        state.roomName = val
      })
      observe('previewText', (val) => {
        state.previewText = val
      })
      observe('preview-text', (val) => {
        state.previewText = val
      })
      observe('relativeTime', (val) => {
        state.relativeTime = val
      })
      observe('relative-time', (val) => {
        state.relativeTime = val
      })
      observe('roomId', (val) => {
        state.roomId = val
      })
      observe('room-id', (val) => {
        state.roomId = val
      })
      observe('isUnread', (val) => {
        state.isUnread = val
      })
      observe('is-unread', (val) => {
        state.isUnread = val
      })
      observe('unreadCount', (val) => {
        state.unreadCount = val
      })
      observe('unread-count', (val) => {
        state.unreadCount = val
      })
      observe('isMuted', (val) => {
        state.isMuted = val
      })
      observe('is-muted', (val) => {
        state.isMuted = val
      })
      observe('isGroup', (val) => {
        state.isGroup = val
      })
      observe('is-group', (val) => {
        state.isGroup = val
      })
      observe('userRole', (val) => {
        state.userRole = val
      })
      observe('user-role', (val) => {
        state.userRole = val
      })

      // Synchronize active selection state
      const syncActiveState = () => {
        state.isActive = $state.activeSelectionId === state.roomId && $state.activeSelectionType === 'chats'
      }

      $state.subscribe('activeSelectionId', syncActiveState)
      $state.subscribe('activeSelectionType', syncActiveState)
      syncActiveState()

      // Handle item click selection
      container.addEventListener('atoll-item-click', () => {
        $bus.emit('room:select', { room_id: state.roomId })
        $bus.emit('ui:selection_made')
      }, { signal })
    }
  })
</script>
