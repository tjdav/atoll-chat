<template id="chat-list">
  <div class="chat-list h-100 overflow-y-auto" ref="root">
    <atoll-list divided ref="listGroup">
      <!-- Chat items will be rendered here via script -->
    </atoll-list>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, storage, eventBus, globalStore, refs, utils, fuse, pocketbase, cryptoWorker, signal }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $time, $string, $list } = utils
      const { $Fuse } = fuse
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const listGroup = refs('listGroup')
      const rootEl = refs('root')

      const BATCH_SIZE = 24

      const getLatestMessage = async (room_id) => {
        return $storage.getLatestMessage(room_id)
      }

      const getPreviewText = (msg, participants, isGroup) => {
        if (!msg) {
          return ''
        }
        let prefix = ''
        if (msg.sender_id === $state.currentUser?.id) {
          prefix = 'You: '
        } else if (isGroup) {
          const sender = participants.find(p => p.id === msg.sender_id)
          if (sender) {
            const senderName = sender.name || sender.username || 'Member'
            prefix = `${senderName.trim().split(/\s+/)[0]}: `
          }
        }
        const hasVideo = msg.media_types && msg.media_types.includes('video')
        const fallbacks = {
          image: 'Sent a photo.',
          video: 'Sent a video.',
          voice: 'Sent a voice message.',
          audio: 'Sent an audio file.',
          file: 'Sent an attachment.',
          call_offer: hasVideo ? 'Video Call' : 'Audio Call',
          call_answer: 'Call joined',
          call_end: 'Call ended'
        }
        let content = ''
        if (msg.type === 'text') {
          content = msg.content
        } else if (['call_offer', 'call_answer', 'call_end'].includes(msg.type)) {
          content = fallbacks[msg.type]
        } else if (msg.type === 'media') {
          const mime = msg.mime_type || ''
          if (mime.startsWith('image/')) {
            content = fallbacks.image
          } else if (mime.startsWith('video/')) {
            content = fallbacks.video
          } else if (mime.startsWith('audio/')) {
            content = msg.waveform_data ? fallbacks.voice : fallbacks.audio
          } else {
            content = fallbacks.file
          }
        } else {
          content = msg.content || ''
        }
  
        return $string.truncate(`${prefix}${content}`)
      }

      const enrichItem = async (item) => {
        const latestMsg = await getLatestMessage(item.id)
        let roomName = ''
        const participants = item.participants || []
        if (!item.is_group) {
          const otherParticipants = participants.filter(p => p.id !== $state.currentUser?.id)
          roomName = otherParticipants.length > 0 ? (otherParticipants[0].name || otherParticipants[0].username) : (item.name || 'Direct Message')
        } else {
          roomName = item.name || 'Unnamed Group'
        }
        const previewText = getPreviewText(latestMsg, participants, item.is_group)
        const me = participants.find(p => p.id === $state.currentUser?.id)
        let isUnread = latestMsg && (
          me?.last_read_message_id === null ||
          (latestMsg.sender_id !== $state.currentUser?.id && latestMsg.id !== me?.last_read_message_id)
        )

        if ($state.currentAppView === 'chats' && $state.activeSelectionId === item.id) {
          isUnread = false
        }
  
        let unreadCount = 0
        if (isUnread) {
          const msgs = await $storage.getMessagesByRoom(item.id, 100)
          if (me?.last_read_message_id === null || me?.last_read_message_id === undefined) {
            unreadCount = msgs.filter(m => m.sender_id !== $state.currentUser?.id).length
          } else {
            const lastReadIdx = msgs.findIndex(m => m.id === me.last_read_message_id)
            if (lastReadIdx !== -1) {
              unreadCount = msgs.slice(lastReadIdx + 1).filter(m => m.sender_id !== $state.currentUser?.id).length
            } else {
              unreadCount = msgs.filter(m => m.sender_id !== $state.currentUser?.id).length
            }
          }
          if (unreadCount === 0) {
            unreadCount = 1
          }
        }

        const isMuted = me?.is_muted === true
        const relativeTime = latestMsg ? $time.getRelative(latestMsg.created_at) : ''

        return {
          item,
          latestMsg,
          roomName,
          previewText,
          isUnread,
          unreadCount,
          isMuted,
          relativeTime,
          searchContent: `${roomName} ${participants.map(p => p.name || p.username).join(' ') || ''} ${previewText}`.toLowerCase()
        }
      }

      const setAttrIfChanged = (el, name, value) => {
        const strVal = String(value ?? '')
        if (el.getAttribute(name) !== strVal) {
          el.setAttribute(name, strVal)
        }
      }

      const computeAvatarKey = (item, roomName) => {
        const participants = (item.participants || []).filter(p => p.id !== $state.currentUser?.id)
        if (item.avatar) {
          const avatarStr = typeof item.avatar === 'string' ? item.avatar : JSON.stringify(item.avatar)
          return `encrypted_${avatarStr}`
        }
        if (!item.is_group && participants.length > 0) {
          const otherUser = participants[0]
          return `direct_${otherUser.id}_${otherUser.avatar || ''}_${roomName}`
        } else if (item.is_group) {
          const splitCount = Math.min(Math.max(participants.length, 2), 4)
          const pKeys = participants.map(p => `${p.id}_${p.avatar || ''}`).join('_')
          return `group_${pKeys}_${splitCount}`
        }
        return `default_${roomName}`
      }

      const createAvatarComponent = (item, roomName, avatarKey) => {
        const participants = (item.participants || []).filter(p => p.id !== $state.currentUser?.id)
        if (item.avatar) {
          try {
            const avatarData = typeof item.avatar === 'string' ? JSON.parse(item.avatar) : item.avatar
            const profile = document.createElement('atoll-profile')
            profile.setAttribute('slot', 'avatar')
            profile.setAttribute('size', 'md')
            profile.setAttribute('name', roomName)
            profile.setAttribute('alt', roomName)
            profile.setAttribute('data-avatar-key', avatarKey)

            const $media = utils?.$media
            if ($media && typeof $media.decrypt === 'function' && avatarData.media_id) {
              $media.decrypt(avatarData, signal).then((url) => {
                profile.setAttribute('src', url)
              }).catch(err => {
                console.error('[chat-list] Failed to decrypt room avatar:', err)
              })
            }
            return profile
          } catch (err) {
            console.error('[chat-list] Failed to parse room avatar:', err)
          }
        }
        if (!item.is_group && participants.length > 0) {
          const otherUser = participants[0]
          const displayName = otherUser.name || otherUser.username || roomName
          const profile = document.createElement('atoll-profile')
          profile.setAttribute('slot', 'avatar')
          profile.setAttribute('size', 'md')
          profile.setAttribute('name', displayName)
          profile.setAttribute('alt', displayName)
          profile.setAttribute('data-avatar-key', avatarKey)
          if (otherUser.id) {
            profile.setAttribute('user-id', otherUser.id)
          }
          if (otherUser.avatar) {
            profile.setAttribute('src', pb.files.getURL(otherUser, otherUser.avatar, { thumb: '50x50' }))
          }
          return profile
        } else if (item.is_group) {
          const profile = document.createElement('atoll-profile')
          profile.setAttribute('slot', 'avatar')
          profile.setAttribute('type', 'multiparty')
          profile.setAttribute('size', 'md')
          profile.setAttribute('data-avatar-key', avatarKey)
          const splitCount = Math.min(Math.max(participants.length, 2), 4)
          profile.setAttribute('split-count', splitCount)

          const slotDiv = document.createElement('div')
          slotDiv.setAttribute('slot', 'image')

          const displayCount = Math.min(participants.length, splitCount)
          for (let i = 0; i < displayCount; i++) {
            const p = participants[i]
            const pName = p.name || p.username || 'Member'
            if (p.avatar) {
              const img = document.createElement('img')
              img.src = pb.files.getURL(p, p.avatar, { thumb: '40x40' })
              img.alt = pName
              slotDiv.appendChild(img)
            } else {
              const img = document.createElement('img')
              img.alt = pName
              slotDiv.appendChild(img)
            }
          }

          profile.appendChild(slotDiv)
          return profile
        }
        const profile = document.createElement('atoll-profile')
        profile.setAttribute('slot', 'avatar')
        profile.setAttribute('size', 'md')
        profile.setAttribute('name', roomName)
        profile.setAttribute('alt', roomName)
        profile.setAttribute('data-avatar-key', avatarKey)
        return profile
      }

      const updateItemAttributes = (el, data) => {
        setAttrIfChanged(el, 'room-id', data.item.id)
        setAttrIfChanged(el, 'room-name', data.roomName)
        setAttrIfChanged(el, 'preview-text', data.previewText)
        setAttrIfChanged(el, 'relative-time', data.relativeTime)
        setAttrIfChanged(el, 'is-unread', data.isUnread ? 'true' : 'false')
        setAttrIfChanged(el, 'unread-count', String(data.unreadCount || 0))
        setAttrIfChanged(el, 'is-group', data.item.is_group ? 'true' : 'false')
        setAttrIfChanged(el, 'user-role', data.item.user_role || '')
        setAttrIfChanged(el, 'is-muted', data.isMuted ? 'true' : 'false')

        const avatarKey = computeAvatarKey(data.item, data.roomName)
        const existingAvatar = el.querySelector('[slot="avatar"]')

        if (!existingAvatar) {
          el.appendChild(createAvatarComponent(data.item, data.roomName, avatarKey))
        } else if (existingAvatar.getAttribute('data-avatar-key') !== avatarKey) {
          existingAvatar.replaceWith(createAvatarComponent(data.item, data.roomName, avatarKey))
        }
      }

      const { manager, debouncedRender } = $list.createManager({
        listId: 'chats',
        scrollRoot: rootEl,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const rawItems = await $storage.getAllRoomsSorted(lastItem ? lastItem.item : null, BATCH_SIZE)
          const items = await Promise.all(rawItems.map(enrichItem))
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listGroup.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No chats found'}</div>`
            return
          }

          const emptyState = listGroup.querySelector('.text-body-secondary')
          if (emptyState) {
            emptyState.remove()
          }

          const existingNodesMap = new Map()
          const currentItems = listGroup.querySelectorAll('chat-list-item')
          for (const itemNode of currentItems) {
            const rId = itemNode.getAttribute('room-id')
            if (rId) {
              existingNodesMap.set(rId, itemNode)
            }
          }

          const activeRoomIds = new Set(itemsToDisplay.map(d => d.item.id))
          for (const [rId, itemNode] of existingNodesMap.entries()) {
            if (!activeRoomIds.has(rId)) {
              itemNode.remove()
            }
          }

          for (let i = 0; i < itemsToDisplay.length; i++) {
            const data = itemsToDisplay[i]
            let listItem = existingNodesMap.get(data.item.id)

            if (!listItem) {
              listItem = document.createElement('chat-list-item')
            }

            updateItemAttributes(listItem, data)

            const currentChildAtIndex = listGroup.children[i]
            if (currentChildAtIndex !== listItem) {
              listGroup.insertBefore(listItem, currentChildAtIndex || null)
            }
          }
        }
      })

      const resyncRooms = async () => {
        const currentCount = Math.max(manager.loadedItems.length, BATCH_SIZE)
        const rawRooms = await $storage.getAllRoomsSorted(null, currentCount)
        const enriched = await Promise.all(rawRooms.map(enrichItem))
        manager.loadedItems = enriched
        debouncedRender()
      }

      const updatingRooms = new Set()
      const handleUpdateInPlace = async (room_id) => {
        if (updatingRooms.has(room_id) || !room_id) {
          return
        }
        updatingRooms.add(room_id)
        try {
          const room = await $storage.getRoom(room_id)
          if (!room) {
            const idx = manager.loadedItems.findIndex(i => i.item.id === room_id)
            if (idx !== -1) {
              manager.loadedItems.splice(idx, 1)
            }
            debouncedRender()
            return
          }
          const data = await enrichItem(room)
          if (!updatingRooms.has(room_id)) {
            return
          }

          const idx = manager.loadedItems.findIndex(i => i.item.id === room_id)
          if (idx !== -1) {
            manager.loadedItems[idx] = data
          } else {
            manager.loadedItems.push(data)
          }

          manager.loadedItems.sort((a, b) => Number(b.item.weight ?? 0) - Number(a.item.weight ?? 0))
          debouncedRender()
        } finally {
          updatingRooms.delete(room_id)
        }
      }

      const markAsRead = async (room_id) => {
        const room = await $storage.getRoom(room_id)
        if (!room) {
          return
        }
        const latestMsg = await getLatestMessage(room_id)
        if (!latestMsg) {
          return
        }
        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (me && me.last_read_message_id !== latestMsg.id) {
          me.last_read_message_id = latestMsg.id
          await $storage.saveRoom(room)
          try {
            if (pb?.collection && $state.currentUser?.id) {
              let stateRecord = null
              try {
                stateRecord = await pb.collection('room_member_states').getFirstListItem(
                  `room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null }
                )
              } catch {
              }

              if (stateRecord) {
                await pb.collection('room_member_states').update(stateRecord.id, { last_read_message_id: latestMsg.id }, { requestKey: null })
              } else {
                await pb.collection('room_member_states').create({
                  room_id,
                  user_id: $state.currentUser.id,
                  last_read_message_id: latestMsg.id,
                  is_typing: false
                }, { requestKey: null })
              }
            }
          } catch (err) {
            console.error('[chat-list] Failed to update read status:', err)
          }
          $bus.emit('room:read_state_changed', room_id)
        }
      }

      $bus.on('room:select', async ({ room_id }) => {
        $state.activeSelectionId = room_id
        $state.activeSelectionType = 'chats'
        const item = manager.loadedItems.find(i => i.item.id === room_id)
        if (item?.isUnread) {
          await markAsRead(room_id)
        }
      })

      $bus.on('room:toggle_read', async ({ room_id, isUnread }) => {
        const room = await $storage.getRoom(room_id)
        if (!room) {
          return
        }
        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }
        let newLastReadId = null
        if (isUnread) {
          const latestMsg = await getLatestMessage(room_id)
          if (latestMsg) {
            newLastReadId = latestMsg.id
          }
        }
        me.last_read_message_id = newLastReadId
        await $storage.saveRoom(room)
        try {
          if (pb?.collection && $state.currentUser?.id) {
            let stateRecord = null
            try {
              stateRecord = await pb.collection('room_member_states').getFirstListItem(
                `room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null }
              )
            } catch {
            }

            if (stateRecord) {
              await pb.collection('room_member_states').update(stateRecord.id, { last_read_message_id: newLastReadId }, { requestKey: null })
            } else {
              await pb.collection('room_member_states').create({
                room_id,
                user_id: $state.currentUser.id,
                last_read_message_id: newLastReadId,
                is_typing: false
              }, { requestKey: null })
            }
          }
        } catch (err) {
          console.error('[chat-list] Failed to toggle read status:', err)
        }
        $bus.emit('room:read_state_changed', room_id)
        $bus.emit('ui:show_toast', {
          message: newLastReadId === null ? 'Marked as unread' : 'Marked as read',
          type: 'success'
        })
      })

      $bus.on('room:toggle_mute', async ({ room_id, isMuted }) => {
        const room = await $storage.getRoom(room_id)
        if (!room) {
          return
        }
        const me = room.participants.find(p => p.id === $state.currentUser?.id)
        if (!me) {
          return
        }
        const newMuteStatus = !isMuted
        me.is_muted = newMuteStatus
        await $storage.saveRoom(room)
        try {
          if (pb?.collection && $state.currentUser?.id) {
            let settingsRecord = null
            try {
              settingsRecord = await pb.collection('room_settings').getFirstListItem(
                `room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null }
              )
            } catch {
            }

            if (settingsRecord) {
              await pb.collection('room_settings').update(settingsRecord.id, { is_muted: newMuteStatus }, { requestKey: null })
            } else {
              await pb.collection('room_settings').create({
                room_id,
                user_id: $state.currentUser.id,
                is_muted: newMuteStatus
              }, { requestKey: null })
            }
          }
        } catch (err) {
          console.error('[chat-list] Failed to toggle mute status:', err)
        }
        $bus.emit('room:member_updated', { room_id: room_id })
        $bus.emit('ui:show_toast', {
          message: newMuteStatus ? 'Notifications muted' : 'Notifications unmuted',
          type: 'success'
        })
      })

      $bus.on('room:delete', async ({ room_id, isGroup }) => {
        const confirmMessage = isGroup ? 'Are you sure you want to leave this group?' : 'Are you sure you want to delete this chat?'
        if (!confirm(confirmMessage)) {
          return
        }
        try {
          if (pb?.collection && $state.currentUser?.id) {
            try {
              const memberRecord = await pb.collection('room_members').getFirstListItem(`room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
              if (memberRecord) {
                await pb.collection('room_members').delete(memberRecord.id, { requestKey: null })
              }
            } catch (pbErr) {
              console.warn('[chat-list] PocketBase member cleanup warning:', pbErr)
            }
          }

          const room = await $storage.getRoom(room_id)
          if (!isGroup && room?.participants?.length <= 1 && pb?.collection) {
            try {
              await pb.collection('rooms').delete(room_id, { requestKey: null })
            } catch (rErr) {
              console.warn('[chat-list] PocketBase room cleanup warning:', rErr)
            }
          }

          await $worker.execute('worker:delete_local_room', { room_id })
          await handleUpdateInPlace(room_id)
          $bus.emit('ui:show_toast', {
            message: isGroup ? 'Left group' : 'Chat deleted',
            type: 'success'
          })
          if ($state.activeSelectionId === room_id) {
            $state.activeSelectionId = null
          }
        } catch (err) {
          console.error('[chat-list] Failed to delete chat:', err)
        }
      })

      $bus.on('room:edit', async ({ room_id }) => {
        const room = await $storage.getRoom(room_id)
        if (room) {
          $bus.emit('ui:open_edit_room', room)
        }
      })

      $bus.on('ui:scroll_chats_top', () => {
        if (rootEl) {
          rootEl.scrollTo({
            top: 0,
            behavior: 'smooth'
          })
        }
      })

      debouncedRender()
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $state.subscribe('activeSelectionId', (newId) => {
        if (newId && $state.currentAppView === 'chats') {
          markAsRead(newId)
        }
      })
      $bus.on('db:new_local_data', async (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId && $state.currentAppView === 'chats') {
          await markAsRead(payload.room_id)
        }
        await handleUpdateInPlace(payload.room_id)
      })
      $bus.on('db:new_local_room', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('db:room_deleted', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('room:member_updated', (payload) => handleUpdateInPlace(payload.room_id))
      $bus.on('room:read_state_changed', (room_id) => handleUpdateInPlace(room_id))
      $bus.on('sync:complete', () => resyncRooms())
      $bus.on('auth:unlocked', () => resyncRooms())
    }
  })
</script>
