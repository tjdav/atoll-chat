<template id="atoll-chat-timeline-date-separator">
  <div class="atoll-chat-date-separator text-center w-100" style="background-color: transparent !important;">
    <span class="badge rounded-pill atoll-chat-date-separator-pill px-3 py-1 text-uppercase font-monospace">
      {{ formattedDate }}
    </span>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .atoll-chat-date-separator {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--atoll-chat-text-primary) !important;
    margin: 20px 0;
    font-weight: 500;
  }

  .atoll-chat-date-separator .badge,
  .atoll-chat-date-separator .atoll-chat-date-separator-pill {
    background-color: var(--atoll-chat-surface-glass) !important;
    border: 1px solid var(--atoll-chat-border) !important;
    color: var(--atoll-chat-text-primary) !important;
    backdrop-filter: var(--atoll-chat-date-separator-backdrop-filter, blur(12px));
    -webkit-backdrop-filter: var(--atoll-chat-date-separator-backdrop-filter, blur(12px));
    font-size: 0.7rem;
    font-weight: 500;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      timestamp: String
    },
    getters: {
      formattedDate: (state) => {
        if (!state.timestamp) {
          return ''
        }
        try {
          const d = new Date(state.timestamp)
          const options = {
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }
          return d.toLocaleDateString('en-AU', options)
        } catch {
          return state.timestamp
        }
      }
    }
  })
</script>
