<template id="atoll-chat-timeline">
  <div ref="timelineContainer" class="atoll-chat-timeline-container flex-grow-1 overflow-auto p-3 d-flex flex-column h-100">
    <div class="mt-auto text-center p-5 atoll-chat-empty-state" ref="emptyState">
      <atoll-icon name="shield-lock" size="xl" class="mb-3 d-block"></atoll-icon>
      <p>Messages are end-to-end encrypted. No one outside of this chat, not even Atoll, can read them.</p>
    </div>
    <div ref="messageWrapper" class="atoll-chat-timeline-messages flex-grow-1 d-flex flex-column justify-content-end"></div>
    <div ref="statusContainer" class="container atoll-chat-message-status-container d-none text-end px-2 py-1 align-items-center justify-content-end">
      <span ref="statusText" class="x-small me-1" style="color: var(--atoll-chat-text-muted, #595959) !important;" data-testid="status-text"></span>
      <atoll-icon ref="statusIcon" name="check-circle" size="xs" color="var(--atoll-chat-text-muted)"></atoll-icon>
    </div>
    <div ref="bottomSentinel" style="height: 1px; width: 100%; pointer-events: none; opacity: 0;"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, globalStore, storage, eventBus, signal, utils, pocketbase, cryptoWorker }) => {
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $func } = utils
      const { pb } = pocketbase
      const { $worker } = cryptoWorker
      const container = refs('timelineContainer')
      const emptyState = refs('emptyState')
      const messageWrapper = refs('messageWrapper')
      const statusContainer = refs('statusContainer')
      const statusText = refs('statusText')
      const statusIcon = refs('statusIcon')
      const bottomSentinel = refs('bottomSentinel')

      let last_room_id = null
      let lastView = null
      let seenTimeout = null
      let lastRenderedMessageId = null
      let forceScrollToBottom = false
      let isRestorePending = false
      let stickToBottom = true
      let ephemeralMessages = []
      let storedMessagesCache = []
      let isFetchingOlder = false
      let hasMoreOlder = true
      const renderedRows = new Map()
      let currentTopVisibleId = null
      const roomAnchorMap = new Map()

      const pinToBottom = (force = false) => {
        if (!stickToBottom && !force) {
          return
        }
        container.scrollTop = container.scrollHeight
      }

      let convergenceFrame = 0
      const maxConvergenceFrames = 5

      const converge = () => {
        if (!stickToBottom) {
          return
        }
        const dist = container.scrollHeight - container.scrollTop - container.clientHeight
        if (dist > 1 && convergenceFrame < maxConvergenceFrames) {
          convergenceFrame++
          container.scrollTop = container.scrollHeight
          requestAnimationFrame(converge)
        }
      }

      const beginConvergence = () => {
        convergenceFrame = 0
        requestAnimationFrame(converge)
      }

      const contentObserver = typeof ResizeObserver !== 'undefined'
        ? new ResizeObserver(() => {
          if (stickToBottom) {
            pinToBottom()
          }
        })
        : null

      if (contentObserver && messageWrapper) {
        contentObserver.observe(messageWrapper)
      }

      if (typeof document !== 'undefined' && document.fonts) {
        document.fonts.ready.then(() => {
          if (stickToBottom) {
            pinToBottom()
            beginConvergence()
          }
        })
        document.fonts.addEventListener?.('loadingdone', () => {
          if (stickToBottom) {
            pinToBottom()
            beginConvergence()
          }
        })
      }

      /**
       * Checks scroll position and fetches older message batches when scrolling near top.
       *
       * @returns {Promise<void>} Resolves when scroll pagination completes.
       */
      const checkScrollPagination = async () => {
        if (isFetchingOlder || !hasMoreOlder || container.scrollTop > 200 || !last_room_id) {
          return
        }
        const oldest = storedMessagesCache?.[0]
        if (!oldest || (!oldest.created_at && !oldest.timestamp)) {
          return
        }
        const beforeTime = oldest.created_at || oldest.timestamp
        isFetchingOlder = true
        try {
          const olderBatch = await $storage.getMessagesByRoomBefore(last_room_id, beforeTime, 50)
          if (!olderBatch || olderBatch.length === 0) {
            hasMoreOlder = false
            return
          }
          if (olderBatch.length < 50) {
            hasMoreOlder = false
          }
          const prevHeight = container.scrollHeight
          const prevScrollTop = container.scrollTop

          const existingIds = new Set(storedMessagesCache.map(m => m.id || m.local_uuid))
          const newOlder = olderBatch.filter(m => !existingIds.has(m.id || m.local_uuid))
          if (newOlder.length > 0) {
            storedMessagesCache = [...newOlder, ...storedMessagesCache]
            await renderTimeline({ preserveMessages: true })
            const newHeight = container.scrollHeight
            container.scrollTop = prevScrollTop + (newHeight - prevHeight)
          }
        } finally {
          isFetchingOlder = false
        }
      }

      /**
       * Evaluates container distance from bottom and updates stickToBottom state.
       *
       * @returns {void}
       */
      const updateAutoScrollState = () => {
        const dist = container.scrollHeight - container.scrollTop - container.clientHeight
        if (dist <= 150 || container.scrollHeight <= container.clientHeight) {
          stickToBottom = true
        } else {
          stickToBottom = false
        }
      }

      container.addEventListener('scroll', $func.debounce(() => {
        updateAutoScrollState()
        checkScrollPagination()
      }, 100), { signal })

      /**
       * Debounces and updates read state for a message viewed in the room.
       *
       * @param {string} messageId - The target message ID.
       * @returns {void}
       */
      const updateSeenStatus = (messageId) => {
        const room_id = $state.activeSelectionId
        if (!room_id || !messageId) {
          return
        }

        if (seenTimeout) {
          clearTimeout(seenTimeout)
        }
        seenTimeout = setTimeout(async () => {
          try {
            let stateRecord = null
            try {
              stateRecord = await pb.collection('room_member_states').getFirstListItem(
                `room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null }
              )
            } catch (err) {
              const isNotFound = err && (err.status === 404 || err.message?.includes('404'))
              if (!isNotFound) {
                throw err
              }
            }

            if (stateRecord) {
              if (stateRecord.last_read_message_id !== messageId) {
                await pb.collection('room_member_states').update(stateRecord.id, {
                  last_read_message_id: messageId
                })
              }
            } else {
              await pb.collection('room_member_states').create({
                room_id,
                user_id: $state.currentUser.id,
                last_read_message_id: messageId,
                is_typing: false
              })
            }
          } catch (err) {
            const isExpectedNetworkError = err && (err.name === 'AbortError' || err.status === 0)
            if (!isExpectedNetworkError) {
              throw err
            }
          }
        }, 1000)
      }

      /**
       * Updates DOM seen-status attributes for messages rendered in the timeline.
       *
       * @param {Array<Object>} [precomputedParticipants=null] - Pre-fetched room participants.
       * @param {Map<string, Array<Object>>} [precomputedSeenBy=null] - Map of message ID to reader records.
       * @returns {Promise<void>} Resolves when seen indicators are synced.
       */
      const updateAllSeenIndicators = async (precomputedParticipants = null, precomputedSeenBy = null) => {
        const room_id = $state.activeSelectionId
        if (!room_id) {
          return
        }

        let participants = precomputedParticipants
        let seenByMessageId = precomputedSeenBy

        if (!participants || !seenByMessageId) {
          const room = await $storage.getRoom(room_id)
          if (!room || $state.activeSelectionId !== room_id) {
            return
          }
          participants = room.participants || []
          seenByMessageId = new Map()
          participants.forEach(p => {
            if (p.id === $state.currentUser?.id) {
              return
            }

            if (p.last_read_message_id) {
              if (!seenByMessageId.has(p.last_read_message_id)) {
                seenByMessageId.set(p.last_read_message_id, [])
              }
              seenByMessageId.get(p.last_read_message_id).push(p)
            }
          })
        }

        const activeSeenMsgIds = new Set(seenByMessageId.keys())

        const rowsShowingIndicators = container.querySelectorAll('atoll-chat-timeline-row[seen-user-ids]')
        rowsShowingIndicators.forEach(row => {
          const msgId = row.getAttribute('message-id') || row.dataset.messageId
          if (msgId && !activeSeenMsgIds.has(msgId)) {
            row.removeAttribute('seen-user-ids')
            row.removeAttribute('seen-avatars')
          }
        })

        seenByMessageId.forEach((seenBy, messageId) => {
          const row = renderedRows.get(messageId)
          if (row) {
            const seenUserIds = seenBy.map(p => p.id).join(',')
            const seenAvatars = seenBy.map(p => {
              if (p.avatar) {
                return pb.files.getURL(p, p.avatar, { thumb: '16x16' })
              }
              return (p.username || '?').substring(0, 1).toUpperCase()
            }).join(',')

            if (row.getAttribute('seen-user-ids') !== seenUserIds) {
              row.setAttribute('seen-user-ids', seenUserIds)
            }
            if (row.getAttribute('seen-avatars') !== seenAvatars) {
              row.setAttribute('seen-avatars', seenAvatars)
            }
          }
        })
      }

      /**
       * Instantiates an IntersectionObserver for timeline rows with environment fallback.
       *
       * @returns {IntersectionObserver|Object} Observer instance or mock fallback.
       */
      const createObserver = () => {
        if (typeof IntersectionObserver === 'undefined') {
          return {
            observe: () => {
            },
            unobserve: () => {
            },
            disconnect: () => {
            }
          }
        }
        return new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const messageId = entry.target.dataset.messageId
              const isSent = entry.target.dataset.isSent === 'true'
              if (!isSent) {
                updateSeenStatus(messageId)
              }
            }
          })
        }, {
          root: container,
          threshold: 0.7
        })
      }

      const intersectionObserver = createObserver()

      /**
       * Instantiates an IntersectionObserver for tracking topmost visible row for scroll anchoring.
       *
       * @returns {IntersectionObserver|Object} Observer instance or mock fallback.
       */
      const createTopObserver = () => {
        if (typeof IntersectionObserver === 'undefined') {
          return {
            observe: () => {
            },
            unobserve: () => {
            },
            disconnect: () => {
            }
          }
        }
        return new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const rowId = entry.target.dataset.messageId ||
                            entry.target.dataset.localUuid ||
                            entry.target.getAttribute('message-id') ||
                            entry.target.getAttribute('local-uuid') ||
                            entry.target.id?.replace('timeline-item-', '')
              if (rowId) {
                currentTopVisibleId = rowId
              }
            }
          })
        }, {
          root: container,
          rootMargin: '0px 0px -70% 0px'
        })
      }

      const topObserver = createTopObserver()

      /**
       * Instantiates an IntersectionObserver for the bottom sentinel element with environment fallback.
       *
       * @returns {IntersectionObserver|Object} Observer instance or mock fallback.
       */
      const createBottomObserver = () => {
        if (typeof IntersectionObserver === 'undefined') {
          return {
            observe: () => {
            },
            unobserve: () => {
            },
            disconnect: () => {
            }
          }
        }

        return new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              stickToBottom = true
            } else {
              updateAutoScrollState()
            }
          })
        }, {
          root: container,
          threshold: 0.1
        })
      }

      const bottomObserver = createBottomObserver()
      if (bottomSentinel) {
        bottomObserver.observe(bottomSentinel)
      }

      signal.addEventListener('abort', () => {
        intersectionObserver.disconnect()
        topObserver.disconnect()
        bottomObserver.disconnect()
        contentObserver?.disconnect()
      })

      let currentRenderId = 0
      const renderTimeline = async (opts = {}) => {
        const room_id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!room_id || type !== 'chats') {
          lastView = type
          return
        }

        const renderId = ++currentRenderId
        const isNewRoom = room_id !== last_room_id || lastView !== 'chats'
        if (isNewRoom) {
          if (last_room_id) {
            roomAnchorMap.set(last_room_id, {
              anchorId: currentTopVisibleId,
              stickToBottom: stickToBottom
            })
          }
          last_room_id = room_id
          lastView = type
          lastRenderedMessageId = null
          currentTopVisibleId = null
          messageWrapper.innerHTML = ''
          intersectionObserver.disconnect()
          topObserver.disconnect()
          bottomObserver.disconnect()
          renderedRows.clear()
          hasMoreOlder = true
          stickToBottom = true
          if (bottomSentinel) {
            bottomObserver.observe(bottomSentinel)
          }
        }

        try {
          if (!room_id) {
            return
          }

          let room = null
          if (isNewRoom || !opts.preserveMessages) {
            let fetchedMsgs = []
            if (isNewRoom) {
              if ($state.isJumpingToMessage && $state.jumpToMessageId) {
                fetchedMsgs = await $storage.getMessagesByRoomAround(room_id, $state.jumpToMessageId, 50)
              } else {
                fetchedMsgs = await $storage.getMessagesByRoom(room_id, 100)
              }
              storedMessagesCache = fetchedMsgs
            } else if (!opts.preserveMessages) {
              fetchedMsgs = await $storage.getMessagesByRoom(room_id, 100)
              // Merge newly fetched recent messages into cache while deduplicating
              const existingMap = new Map()
              storedMessagesCache.forEach(m => existingMap.set(m.id || m.local_uuid, m))
              fetchedMsgs.forEach(m => existingMap.set(m.id || m.local_uuid, m))
              storedMessagesCache = Array.from(existingMap.values())
            }
          }
          room = await $storage.getRoom(room_id)

          if (renderId !== currentRenderId || $state.activeSelectionId !== room_id) {
            return
          }

          let messages = [...storedMessagesCache, ...ephemeralMessages]
          messages.sort((a, b) => {
            const timeA = new Date(a.created_at || a.timestamp).getTime()
            const timeB = new Date(b.created_at || b.timestamp).getTime()
            return timeA - timeB
          })

          if (messages.length === 0) {
            if (isNewRoom) {
              if (emptyState.parentNode !== container) {
                container.insertBefore(emptyState, messageWrapper)
              }
            }
            return
          }

          // If we have messages, remove empty state if present
          if (emptyState.parentNode) {
            emptyState.remove()
          }

          const participants = room?.participants || []
          const participantsById = new Map()
          participants.forEach(p => participantsById.set(p.id, p))

          const seenByMessageId = new Map()
          participants.forEach(p => {
            if (p.id === $state.currentUser?.id) {
              return
            }
            if (p.last_read_message_id) {
              if (!seenByMessageId.has(p.last_read_message_id)) {
                seenByMessageId.set(p.last_read_message_id, [])
              }
              seenByMessageId.get(p.last_read_message_id).push(p)
            }
          })

          const reactionTargets = new Set()
          messages.forEach(m => {
            if (m.type === 'reaction' && m.target_id) {
              reactionTargets.add(m.target_id)
            }
          })

          // Update status of already rendered messages via renderedRows Map
          messages.forEach(m => {
            const row = m.local_uuid ? renderedRows.get(m.local_uuid) : null
            if (row) {
              if (m.id && !row.dataset.messageId) {
                row.dataset.messageId = m.id
                row.setAttribute('message-id', m.id)
                renderedRows.set(m.id, row)
              }

              // Propagate status to children
              row.querySelectorAll('atoll-chat-timeline-item-text, atoll-chat-timeline-item-media, atoll-chat-timeline-item-voice, atoll-chat-timeline-item-file, atoll-chat-timeline-item-link').forEach(child => {
                if (child.getAttribute('status') !== m.status) {
                  child.setAttribute('status', m.status)
                }
              })

              if (m.status !== 'pending') {
                if (row.classList.contains('placeholder-wave')) {
                  row.classList.remove('placeholder-wave')
                }
                if (row.classList.contains('opacity-75')) {
                  row.classList.remove('opacity-75')
                }
              }
            }
          })

          /* Grouping view excludes system-signaling messages, matching the original render pass:
             call_* events are still rendered as centered system messages below, but they do not
             participate in sender-block grouping / date-separator adjacency. */
          const visibleMessages = messages.filter(m => {
            if (['reaction', 'ice_candidate', 'p2p_request_offer', 'p2p_offer', 'p2p_answer', 'p2p_ice_candidate', 'call_offer', 'call_answer', 'call_end'].includes(m.type)) {
              return false
            }
            return true
          })

          // Build index lookup map for faster grouping & separator resolve (O(n))
          const messageIndexMap = new Map()
          visibleMessages.forEach((m, idx) => {
            if (m.local_uuid) {
              messageIndexMap.set(m.local_uuid, idx)
            }
            if (m.id) {
              messageIndexMap.set(m.id, idx)
            }
          })

          // identify new messages to render without relying on lastRenderedMessageId
          let messagesToRender = messages

          // prevent duplicate appending if multiple calls overlap
          messagesToRender = messagesToRender.filter(m => {
            if (m.type === 'ice_candidate' || m.type === 'reaction' || m.type === 'p2p_request_offer' || m.type === 'p2p_offer' || m.type === 'p2p_answer' || m.type === 'p2p_ice_candidate') {
              return false
            }
            const hasId = m.id && renderedRows.has(m.id)
            const hasUuid = m.local_uuid && renderedRows.has(m.local_uuid)
            return !hasId && !hasUuid
          })

          // Before appending, update the previously last message's styling
          if (lastRenderedMessageId && messagesToRender.length > 0) {
            const prevLastRow = renderedRows.get(lastRenderedMessageId)
            if (prevLastRow) {
              const firstNew = messagesToRender[0]
              const prevIndex = messageIndexMap.get(lastRenderedMessageId)
              const prevMsg = prevIndex !== undefined ? visibleMessages[prevIndex] : null

              if (prevMsg && prevMsg.created_at && firstNew.created_at) {
                // date separator logic
                const prevTime = new Date(prevMsg.created_at).getTime()
                const currTime = new Date(firstNew.created_at).getTime()
                const showSeparator = currTime - prevTime > 3600000

                if (!showSeparator && firstNew.sender_id === prevLastRow.dataset.senderId) {
                  // It's no longer the last in block
                  prevLastRow.setAttribute('is-last-in-block', 'false')
                  // Remove avatar if it had one
                  prevLastRow.removeAttribute('avatar-url')
                  prevLastRow.removeAttribute('avatar-initials')
                }
              }
            }
          }

          const fragment = document.createDocumentFragment()

          messagesToRender.forEach((message) => {
            const index = messageIndexMap.get(message.local_uuid) !== undefined ? messageIndexMap.get(message.local_uuid) : messageIndexMap.get(message.id)
            const isSent = message.sender_id === $state.currentUser?.id
            const nextMessage = (index !== undefined) ? visibleMessages[index + 1] : null
            const prevMessage = (index !== undefined) ? visibleMessages[index - 1] : null

            // date separator logic
            let showSeparator = false
            if (prevMessage) {
              const prevTime = new Date(prevMessage.created_at || prevMessage.timestamp).getTime()
              const currTime = new Date(message.created_at || message.timestamp).getTime()
              if (currTime - prevTime > 3600000) {
                showSeparator = true
              }
            } else {
              showSeparator = true
            }

            if (showSeparator) {
              const sep = document.createElement('atoll-chat-timeline-date-separator')
              sep.setAttribute('timestamp', message.created_at || message.timestamp)
              fragment.appendChild(sep)
            }

            let nextShowSeparator = false
            if (nextMessage) {
              const currTime = new Date(message.created_at || message.timestamp).getTime()
              const nextTime = new Date(nextMessage.created_at || nextMessage.timestamp).getTime()
              if (nextTime - currTime > 3600000) {
                nextShowSeparator = true
              }
            }

            const isLastInBlock = !nextMessage || nextMessage.sender_id !== message.sender_id || nextShowSeparator
            const isFirstInBlock = !prevMessage || prevMessage.sender_id !== message.sender_id || showSeparator

            const row = document.createElement('atoll-chat-timeline-row')
            row.setAttribute('is-sent', isSent)
            row.setAttribute('is-first-in-block', isFirstInBlock)
            row.setAttribute('is-last-in-block', isLastInBlock)
            const hasReactions = reactionTargets.has(message.id) || reactionTargets.has(message.local_uuid)
            row.setAttribute('has-reactions', hasReactions ? 'true' : 'false')
            if (message.status === 'pending') {
              row.classList.add('opacity-75')
            }

            if (message.id) {
              row.dataset.messageId = message.id
              row.setAttribute('message-id', message.id)
            }
            row.setAttribute('local-uuid', message.local_uuid)
            row.setAttribute('data-local-uuid', message.local_uuid)
            row.dataset.localUuid = message.local_uuid
            row.dataset.isSent = isSent
            row.dataset.senderId = message.sender_id
            if (message.sender_id) {
              row.setAttribute('sender-id', message.sender_id)
            }

            const sender = participantsById.get(message.sender_id)
            if (!isSent && isFirstInBlock && sender) {
              row.setAttribute('sender-name', sender.name || sender.username || 'Unknown')
            }

            if (!isSent && isLastInBlock && sender) {
              if (sender.avatar) {
                row.setAttribute('avatar-url', pb.files.getURL(sender, sender.avatar, { thumb: '32x32' }))
              } else {
                row.setAttribute('avatar-initials', (sender.name || sender.username || '?').substring(0, 2).toUpperCase())
              }
            }

            // Seen Indicators
            const seenBy = seenByMessageId.get(message.id) || []
            if (seenBy.length > 0) {
              const seenUserIds = seenBy.map(p => p.id).join(',')
              row.setAttribute('seen-user-ids', seenUserIds)

              const seenAvatars = seenBy.map(p => {
                if (p.avatar) {
                  return pb.files.getURL(p, p.avatar, { thumb: '16x16' })
                }
                return (p.username || '?').substring(0, 1).toUpperCase()
              }).join(',')
              row.setAttribute('seen-avatars', seenAvatars)
            }

            // Project content into slot
            if (message.type === 'media' && (message.attachments || message.file_key || message.status === 'pending')) {
              if (message.attachments && Array.isArray(message.attachments) && message.attachments.length > 0) {
                const mediaAttachments = message.attachments.filter(a => a.isImage || a.isVideo || (a.mime_type || '').startsWith('image/') || (a.mime_type || '').startsWith('video/'))
                const nonMediaAttachments = message.attachments.filter(a => !a.isImage && !a.isVideo && !(a.mime_type || '').startsWith('image/') && !(a.mime_type || '').startsWith('video/'))

                // Render media group
                if (mediaAttachments.length >= 2) {
                  const album = document.createElement('atoll-chat-timeline-item-album')
                  album.setAttribute('local-uuid', message.local_uuid)
                  album.setAttribute('status', message.status)
                  album.setAttribute('is-sent', isSent)
                  row.appendChild(album)
                } else if (mediaAttachments.length === 1) {
                  const preview = document.createElement('atoll-chat-timeline-item-media')
                  preview.setAttribute('local-uuid', message.local_uuid)
                  preview.setAttribute('status', message.status)
                  preview.setAttribute('is-sent', isSent)
                  row.appendChild(preview)
                }

                // Render non-media items
                nonMediaAttachments.forEach((att) => {
                  if (att.isAudio || (att.mime_type || '').startsWith('audio/')) {
                    const player = document.createElement('atoll-chat-timeline-item-voice')
                    player.setAttribute('local-uuid', message.local_uuid)
                    player.setAttribute('status', message.status)
                    player.setAttribute('is-sent', isSent)
                    row.appendChild(player)
                  } else {
                    const fileComp = document.createElement('atoll-chat-timeline-item-file')
                    fileComp.setAttribute('local-uuid', message.local_uuid)
                    fileComp.setAttribute('status', message.status)
                    fileComp.setAttribute('is-sent', isSent)
                    row.appendChild(fileComp)
                  }
                })

                // Caption
                if (message.content) {
                  const text = document.createElement('atoll-chat-timeline-item-text')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              } else if (message.mime_type?.startsWith('audio/')) {
                const player = document.createElement('atoll-chat-timeline-item-voice')
                player.setAttribute('local-uuid', message.local_uuid)
                player.setAttribute('status', message.status)
                player.setAttribute('is-sent', isSent)
                row.appendChild(player)

                if (message.content) {
                  const text = document.createElement('atoll-chat-timeline-item-text')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              } else if (message.mime_type?.startsWith('image/') || message.mime_type?.startsWith('video/')) {
                const preview = document.createElement('atoll-chat-timeline-item-media')
                preview.setAttribute('local-uuid', message.local_uuid)
                preview.setAttribute('status', message.status)
                preview.setAttribute('is-sent', isSent)
                row.appendChild(preview)

                if (message.content) {
                  const text = document.createElement('atoll-chat-timeline-item-text')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              } else {
                // Generic file
                const fileComp = document.createElement('atoll-chat-timeline-item-file')
                fileComp.setAttribute('local-uuid', message.local_uuid)
                fileComp.setAttribute('status', message.status)
                fileComp.setAttribute('is-sent', isSent)
                row.appendChild(fileComp)

                if (message.content) {
                  const text = document.createElement('atoll-chat-timeline-item-text')
                  text.setAttribute('local-uuid', message.local_uuid)
                  text.setAttribute('content', message.content)
                  text.setAttribute('is-sent', isSent)
                  text.setAttribute('status', message.status)
                  row.appendChild(text)
                }
              }
            } else if (message.type === 'media') {
              // Encrypted but key missing placeholder
              const text = document.createElement('atoll-chat-timeline-item-text')
              text.setAttribute('local-uuid', message.local_uuid)
              text.setAttribute('content', '🔒 Encrypted Attachment')
              text.setAttribute('is-sent', isSent)
              row.appendChild(text)
            } else if (['call_offer', 'call_answer', 'call_end'].includes(message.type)) {
              const systemMsg = document.createElement('atoll-chat-timeline-system-message')
              systemMsg.setAttribute('type', message.type)
              if (message.id) {
                systemMsg.setAttribute('message-id', message.id)
                systemMsg.setAttribute('data-message-id', message.id)
              }
              systemMsg.setAttribute('local-uuid', message.local_uuid)
              systemMsg.setAttribute('data-local-uuid', message.local_uuid)
              systemMsg.dataset.localUuid = message.local_uuid
              if (message.media_types) {
                systemMsg.setAttribute('media-types', message.media_types.join(','))
              }
              // Don't append to row, signaling messages are centered
              fragment.appendChild(systemMsg)
              if (message.local_uuid) {
                renderedRows.set(message.local_uuid, systemMsg)
              }
              if (message.id) {
                renderedRows.set(message.id, systemMsg)
              }
              lastRenderedMessageId = message.id || message.local_uuid
              return
            } else if (message.type === 'link') {
              if (message.links && Array.from(message.links).length > 0) {
                message.links.forEach((link, idx) => {
                  const preview = document.createElement('atoll-chat-timeline-item-link')
                  // Use unique identifier if multiple links exist
                  preview.setAttribute('local-uuid', message.local_uuid)
                  preview.setAttribute('link-index', idx)
                  preview.setAttribute('url', link.url)
                  preview.setAttribute('title', link.title || '')
                  preview.setAttribute('summary', link.description || '')
                  preview.setAttribute('domain', link.domain || '')
                  preview.setAttribute('image-url', link.image || '')
                  preview.setAttribute('media-id', link.media_id || '')
                  preview.setAttribute('file-key', link.file_key || '')
                  preview.setAttribute('file-nonce', link.file_nonce || '')
                  preview.setAttribute('status', message.status)
                  row.appendChild(preview)
                })
              } else if (message.link_title) {
                // Fallback for old single-link messages
                const preview = document.createElement('atoll-chat-timeline-item-link')
                preview.setAttribute('local-uuid', message.local_uuid)
                preview.setAttribute('url', message.content)
                preview.setAttribute('title', message.link_title || '')
                preview.setAttribute('summary', message.link_summary || '')
                preview.setAttribute('domain', message.link_domain || '')
                preview.setAttribute('media-id', message.media_id || '')
                preview.setAttribute('file-key', message.file_key || '')
                preview.setAttribute('file-nonce', message.file_nonce || '')
                preview.setAttribute('status', message.status)
                row.appendChild(preview)
              }

              if (message.content) {
                const text = document.createElement('atoll-chat-timeline-item-text')
                text.setAttribute('local-uuid', message.local_uuid)
                text.setAttribute('content', message.content)
                text.setAttribute('is-sent', isSent)
                text.setAttribute('status', message.status)
                row.appendChild(text)
              }
            } else {
              const text = document.createElement('atoll-chat-timeline-item-text')
              text.setAttribute('local-uuid', message.local_uuid)
              text.setAttribute('content', message.content || '')
              text.setAttribute('is-sent', isSent)
              text.setAttribute('status', message.status)
              row.appendChild(text)
            }

            fragment.appendChild(row)
            intersectionObserver.observe(row)
            topObserver.observe(row)
            if (message.local_uuid) {
              renderedRows.set(message.local_uuid, row)
            }
            if (message.id) {
              renderedRows.set(message.id, row)
            }
            lastRenderedMessageId = message.id || message.local_uuid
          })

          const distBeforeAppend = container.scrollHeight - container.scrollTop - container.clientHeight
          const wasNearBottom = stickToBottom || container.scrollHeight <= container.clientHeight || distBeforeAppend <= 150

          messageWrapper.appendChild(fragment)

          // Update and re-append global status indicator
          const lastMessage = messages[messages.length - 1]
          if (lastMessage && lastMessage.sender_id === $state.currentUser?.id) {
            statusContainer.classList.remove('d-none')
            statusText.textContent = lastMessage.status === 'pending' ? 'Sending...' : 'Sent'
            statusIcon.setAttribute('name', lastMessage.status === 'pending' ? 'clock' : 'check')

            container.appendChild(statusContainer)
          } else {
            statusContainer.classList.add('d-none')
          }

          if (bottomSentinel) {
            container.appendChild(bottomSentinel)
          }

          // sort messages chronologically if we added something new and it is NOT a new room
          if (!isNewRoom && messagesToRender.length > 0) {
            const children = Array.from(messageWrapper.children).filter(el => el.tagName === 'ATOLL-CHAT-TIMELINE-ROW' ||
              el.tagName === 'ATOLL-CHAT-TIMELINE-SYSTEM-MESSAGE' ||
              el.tagName === 'ATOLL-CHAT-TIMELINE-DATE-SEPARATOR'
            )

            // create timestamp lookup map
            const timestampMap = new Map()
            messages.forEach(m => {
              const ts = new Date(m.created_at).getTime()
              if (m.local_uuid) {
                timestampMap.set(m.local_uuid, ts)
              }
              if (m.id) {
                timestampMap.set(m.id, ts)
              }
            })

            // Map elements to their timestamps for sorting
            const elementData = children.map(el => {
              let timestamp = 0
              if (el.tagName === 'ATOLL-CHAT-TIMELINE-DATE-SEPARATOR') {
                timestamp = new Date(el.getAttribute('timestamp')).getTime()
              } else {
                timestamp = timestampMap.get(el.dataset.localUuid) || timestampMap.get(el.dataset.messageId) || 0
              }
              return {
                el,
                timestamp
              }
            })

            // Check if they are already sorted
            let sorted = true
            for (let i = 0; i < elementData.length - 1; i++) {
              if (elementData[i].timestamp > elementData[i + 1].timestamp) {
                sorted = false
                break
              }
            }

            if (!sorted) {
              elementData.sort((a, b) => a.timestamp - b.timestamp)
              elementData.forEach(item => {
                // re-append in order
                messageWrapper.appendChild(item.el)
              })
            }
          }

          await updateAllSeenIndicators(participants, seenByMessageId)

          if (isNewRoom) {
            if (!opts.skipAnchorResolution) {
              if ($state.isJumpingToMessage && $state.jumpToMessageId) {
                const jumpId = $state.jumpToMessageId
                await scrollToAnchor(jumpId, { block: 'center' })
              } else {
                const cachedAnchor = roomAnchorMap.get(room_id)
                if (cachedAnchor && !cachedAnchor.stickToBottom && cachedAnchor.anchorId) {
                  stickToBottom = false
                  await scrollToAnchor(cachedAnchor.anchorId, { block: 'start' })
                } else {
                  stickToBottom = true
                  pinToBottom()
                  beginConvergence()
                }
              }
            }
          } else if (forceScrollToBottom || wasNearBottom) {
            stickToBottom = true
            forceScrollToBottom = false
            pinToBottom()
            beginConvergence()
          }
        } catch (err) {
          throw err
        }
      }

      const debouncedRender = $func.debounce(renderTimeline, 50)
      debouncedRender()

      $bus.on('ui:media_loaded', () => {
        if (stickToBottom) {
          pinToBottom()
          beginConvergence()
        }
      })

      $bus.on('ui:input_height_changed', () => {
        if (stickToBottom) {
          pinToBottom()
        }
      })

      let prevSelectionId = $state.activeSelectionId
      $state.subscribe('activeSelectionId', (val) => {
        prevSelectionId = val
        if ($state.decryptionCache && typeof $state.decryptionCache.setActiveRoom === 'function') {
          $state.decryptionCache.setActiveRoom(val)
        }

        ephemeralMessages = []
        debouncedRender()
      })
      let prevSelectionType = $state.activeSelectionType
      $state.subscribe('activeSelectionType', (val) => {
        prevSelectionType = val
        debouncedRender()
      })

      $bus.on('db:new_local_data', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          if (payload.message && payload.message.type === 'reaction') {
            /* The reactions component only mounts for rows that actually have reactions, so a
               newly added reaction must opt its target row into mounting it. Toggle the
               attribute directly (O(1)) instead of re-rendering the whole timeline. */
            const targetId = payload.message.target_id
            if (targetId) {
              const targetRow = renderedRows.get(targetId)
              if (targetRow && targetRow.tagName.toLowerCase() === 'atoll-chat-timeline-row') {
                targetRow.setAttribute('has-reactions', 'true')
              }
            }
            return
          }

          if (payload.message && payload.message.sender_id === $state.currentUser?.id && payload.message.status === 'pending') {
            forceScrollToBottom = true
            stickToBottom = true
          }

          if (payload.message && ['call_offer', 'call_answer', 'call_end'].includes(payload.message.type)) {
            const exists = ephemeralMessages.some(m => (m.id && m.id === payload.message.id) ||
              (m.local_uuid && m.local_uuid === payload.message.local_uuid)
            )
            if (!exists) {
              ephemeralMessages.push(payload.message)
            }
          }

          debouncedRender()
        }
      })

      $bus.on('message:send_reaction', async (payload) => {
        const room_id = $state.activeSelectionId

        if (!room_id) {
          return
        }

        if (!payload) {
          return
        }

        const targetId = payload.targetId || payload.messageId
        let content = payload.content

        if (!content) {
          const emoji = payload.emoji || payload.reaction
          if (emoji) {
            content = {
              type: 'emoji',
              value: emoji
            }
          }
        }

        if (!targetId || !content) {
          return
        }

        const localUuid = crypto.randomUUID()
        const params = {
          type: 'reaction',
          content: content,
          target_id: targetId,
          timestamp: Date.now()
        }

        await $worker.execute('worker:send_message', {
          room_id,
          localUuid,
          ...params
        })
      })

      // Update participants seen status in real-time
      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          updateAllSeenIndicators()
          debouncedRender()
        }
      })

      $bus.on('ui:scroll_to_bottom', () => {
        stickToBottom = true
        pinToBottom(true)
        beginConvergence()
      })

      $bus.on('room:select', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId && !$state.isJumpingToMessage) {
          stickToBottom = true
          pinToBottom(true)
          beginConvergence()
        }
      })

      /**
       * Scrolls to target anchor element by ID, fetching context window if out of DOM batch.
       *
       * @param {string} targetId - Target message ID or local UUID.
       * @param {Object} [options={}] - Options containing block and inline positioning.
       * @returns {Promise<void>}
       */
      const scrollToAnchor = async (targetId, options = {}) => {
        if (!targetId) {
          return
        }
        const block = options.block || 'start'
        const inline = options.inline || 'start'

        let targetEl = container.querySelector(`#timeline-item-${targetId}`) ||
                       container.querySelector(`[data-message-id="${targetId}"]`) ||
                       container.querySelector(`[data-local-uuid="${targetId}"]`)

        if (!targetEl) {
          $state.isJumpingToMessage = true
          $state.jumpToMessageId = targetId
          const room_id = $state.activeSelectionId
          if (room_id) {
            const contextMsgs = await $storage.getMessagesByRoomAround(room_id, targetId, 50)
            if (contextMsgs && contextMsgs.length > 0) {
              storedMessagesCache = contextMsgs
              messageWrapper.innerHTML = ''
              renderedRows.clear()
              topObserver.disconnect()
              intersectionObserver.disconnect()
              await renderTimeline({
                preserveMessages: true,
                skipAnchorResolution: true
              })
            }
          }
          targetEl = container.querySelector(`#timeline-item-${targetId}`) ||
                     container.querySelector(`[data-message-id="${targetId}"]`) ||
                     container.querySelector(`[data-local-uuid="${targetId}"]`)
        }

        if (targetEl) {
          targetEl.scrollIntoView({
            behavior: 'auto',
            block,
            inline
          })

          let frame = 0
          const convergeAnchor = () => {
            if (frame < 3 && targetEl) {
              frame++
              targetEl.scrollIntoView({
                behavior: 'auto',
                block,
                inline
              })
              requestAnimationFrame(convergeAnchor)
            }
          }
          requestAnimationFrame(convergeAnchor)
        }

        $state.isJumpingToMessage = false
        $state.jumpToMessageId = null
      }

      $bus.on('message:scroll_to', async (payload) => {
        if (!payload || !payload.messageId) {
          $state.isJumpingToMessage = false
          return
        }

        await scrollToAnchor(payload.messageId, { block: 'center' })
      })
    }
  })
</script>
