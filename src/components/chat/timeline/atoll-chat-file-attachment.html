<template id="atoll-chat-file-attachment">
  <div class="atoll-chat-file-attachment p-2 mb-1 border rounded d-flex align-items-center" style="min-width: 250px; max-width: 350px;">
    <div ref="loading" class="{{ loadingClass }} d-flex align-items-center w-100">
      <div class="placeholder rounded me-2" style="width: 40px; height: 40px;"></div>
      <div class="flex-grow-1">
        <div class="placeholder col-8 mb-1" style="height: 14px;"></div>
        <div class="placeholder col-4" style="height: 12px;"></div>
      </div>
    </div>
    
    <div ref="content" class="d-none w-100 d-flex align-items-center">
      <div class="atoll-chat-file-icon-wrapper me-3 text-primary d-flex align-items-center justify-content-center">
        <atoll-icon ref="fileIcon" name="document" size="24"></atoll-icon>
      </div>
      <div class="flex-grow-1 overflow-hidden">
        <div ref="fileName" class="atoll-chat-file-name fw-bold small text-truncate mb-0"></div>
        <div ref="fileSize" class="atoll-chat-file-size x-small mb-0"></div>
      </div>
      <atoll-button variant="outline" size="sm" leading-icon="download" icon-only="true" ref="downloadBtn" title="Download" aria-label="Download"></atoll-button>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String
    },
    getters: {
      loadingClass: (state) => (['pending', 'pending_p2p'].includes(state.status) ? 'placeholder-glow' : 'placeholder-wave')
    },
    client: async ({ refs, state, storage, globalStore, pocketbase, eventBus, signal, cryptoWorker, observe }) => {
      const { $storage } = storage
      const { pb } = pocketbase
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
  
      const loading = refs('loading')
      const content = refs('content')
      const fileNameEl = refs('fileName')
      const fileSizeEl = refs('fileSize')
      const downloadBtn = refs('downloadBtn')
      const fileIcon = refs('fileIcon')

      let lastCallId = 0

      const renderFile = (objectUrl, mimeType, filename) => {
        if (!objectUrl) {
          return
        }

        loading.classList.add('d-none')
        content.classList.remove('d-none')
        content.classList.add('d-flex')

        fileNameEl.textContent = filename || 'Attachment'
        fileSizeEl.textContent = mimeType || 'Unknown Type'
        if (fileIcon) {
          fileIcon.setAttribute('name', 'document')
        }

        if (downloadBtn) {
          downloadBtn.onclick = (e) => {
            e.preventDefault()
            e.stopPropagation()
            const a = document.createElement('a')
            a.href = objectUrl
            a.download = filename || 'attachment'
            a.click()
          }
        }
  
        $bus.emit('ui:media_loaded')
      }

      const loadFile = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }

          // sync cache check
          const cached = $state.decryptionCache.get(state.localUuid)
          if (cached) {
            const objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            const mimeType = (typeof cached === 'object' ? cached.mimeType : null) || ''
            // still need message for filename
            const message = await $storage.getMessage(state.localUuid)
            if (callId !== lastCallId || signal.aborted) {
              return
            }
            renderFile(objectUrl, mimeType || message?.mime_type, message?.filename || message?.content)
          }

          // async lifecycle
          const message = await $storage.getMessage(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          let objectUrl = typeof cached === 'string' ? cached : cached?.blobUrl
          if (!objectUrl) {
            if (['pending', 'pending_p2p'].includes(state.status)) {
              return
            }
            if (!message || !message.file_key) {
              throw new Error('Message or key missing')
            }

            let encryptedData
            const localFile = await $storage.getFile(state.localUuid || message.media_id)
            if (localFile) {
              encryptedData = await localFile.arrayBuffer()
            } else if (message.media_id) {
              const mediaRecord = await pb.collection('media').getOne(message.media_id)
              const fileUrl = pb.files.getURL(mediaRecord, mediaRecord.file)

              const response = await fetch(fileUrl, { signal })
              if (!response.ok) {
                throw new Error('Fetch failed')
              }
              encryptedData = await response.arrayBuffer()
            } else {
              throw new Error('File not found locally or on server')
            }
            if (callId !== lastCallId || signal.aborted) {
              return
            }

            const decryptedData = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: encryptedData,
              nonce: message.file_nonce,
              key: message.file_key
            })

            if (!decryptedData) {
              throw new Error('Decryption failed')
            }

            const blob = new Blob([decryptedData], { type: message.mime_type })
            objectUrl = URL.createObjectURL(blob)
            $state.decryptionCache.set(state.localUuid, {
              blobUrl: objectUrl,
              mimeType: message.mime_type
            })
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderFile(objectUrl, message?.mime_type, message?.filename || message?.content)

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[atoll-chat-file-attachment] Error:', err)
          loading.innerHTML = `
            <atoll-icon name="warning" size="24" color="var(--bs-warning)"></atoll-icon>
            <div class="x-small ms-2">Failed to load file</div>
          `
        }
      }

      loadFile()

      observe('status', loadFile)
      observe('localUuid', loadFile)
    }
  })
</script>
