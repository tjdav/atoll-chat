<template id="atoll-chat-timeline-row">
  <div class="container mx-auto atoll-chat-timeline-row {{ marginClass }}" ref="container">
    <!-- Sender Name (Received First in Block only) -->
    <div class="atoll-chat-sender-name {{ senderNameDisplayClass }}">
      {{ senderName }}
    </div>

    <div class="atoll-chat-timeline-row-container {{ rowClass }}">
      <!-- Avatar Column (Received only) -->
      <div class="d-flex align-items-end {{ avatarColDisplayClass }}">
        <div ref="avatarContainer">
          <!-- Rendered in client block if showAvatar is true -->
        </div>
      </div>

      <div class="d-flex flex-column {{ alignmentClass }}">
        <div class="position-relative d-flex flex-column {{ alignmentClass }}" ref="bubbleWrapper">
          <slot></slot>
          <button type="button" class="btn btn-sm btn-link p-1 me-1 rounded-circle d-flex align-items-center justify-content-center border-0 reaction-trigger-icon" ref="addReactionBtn" title="Add reaction" data-testid="addReactionBtn" aria-label="Add reaction">
            <atoll-icon name="emoji" size="18"></atoll-icon>
          </button>
        </div>
        <div ref="reactionsContainer"></div>
      </div>
    </div>

    <!-- Seen Indicators -->
    <div ref="seenContainer" class="seen-indicators px-2 d-flex {{ seenJustifyClass }}">
      <!-- Rendered in client block -->
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSent: Boolean,
      isLastInBlock: Boolean,
      senderName: String,
      senderId: String,
      avatarUrl: String,
      avatarInitials: String,
      seenUserIds: String,
      seenAvatars: String,
      messageId: String,
      localUuid: String,
      hasReactions: Boolean
    },
    getters: {
      rowClass: (state) => {
        return state.isSent ? 'sent' : 'received'
      },
      alignmentClass: (state) => {
        return state.isSent ? 'align-items-end' : 'align-items-start'
      },
      senderNameDisplayClass: (state) => {
        return state.senderName ? 'd-block' : 'd-none'
      },
      avatarColDisplayClass: (state) => {
        return state.isSent ? 'd-none' : 'd-flex'
      },
      marginClass: (state) => {
        return state.isLastInBlock ? 'mb-3' : 'mb-1'
      },
      seenJustifyClass: (state) => {
        return state.isSent ? 'justify-content-end' : 'justify-content-start'
      }
    },
    client: ({ refs, state, eventBus, signal, observe }) => {
      const { $bus } = eventBus
      const container = refs('container')
      const avatarContainer = refs('avatarContainer')
      const seenContainer = refs('seenContainer')
      const bubbleWrapper = refs('bubbleWrapper')
      const reactionBtn = refs('addReactionBtn')
      const reactionsContainer = refs('reactionsContainer')

      let lastAvatarKey = null
      const updateAvatar = () => {
        const isSent = state.isSent === 'true' || state.isSent === true
        const isLastInBlock = state.isLastInBlock === 'true' || state.isLastInBlock === true
        const avatarKey = `${isSent}:${isLastInBlock}:${state.senderId}:${state.senderName}:${state.avatarUrl}`
        if (avatarKey === lastAvatarKey) {
          return
        }
        lastAvatarKey = avatarKey

        // In received blocks, we only show the avatar for the last message in the block
        if (isLastInBlock && !isSent) {
          avatarContainer.innerHTML = ''
          const profile = document.createElement('atoll-profile')

          profile.setAttribute('size', 'xs')
          profile.className = 'timeline-avatar-profile'

          if (state.senderId) {
            profile.setAttribute('user-id', state.senderId)
          }

          if (state.senderName) {
            profile.setAttribute('name', state.senderName)
            profile.setAttribute('alt', state.senderName)
          }
  
          if (state.avatarUrl) {
            profile.setAttribute('src', state.avatarUrl)
          }
          avatarContainer.appendChild(profile)
        } else {
          if (avatarContainer.innerHTML !== '') {
            avatarContainer.innerHTML = ''
          }
        }
      }

      let lastSeenKey = null
      const updateSeen = () => {
        const seenKey = `${state.seenUserIds}:${state.seenAvatars}`
        if (seenKey === lastSeenKey) {
          return
        }
        lastSeenKey = seenKey

        const seenUserIds = state.seenUserIds ? state.seenUserIds.split(',').filter(id => id.trim() !== '') : []

        if (seenUserIds.length > 0) {
          seenContainer.innerHTML = ''
          const groupRow = document.createElement('div')
          groupRow.className = 'atoll-profile-group-row'
          seenUserIds.forEach(uid => {
            const profile = document.createElement('atoll-profile')
            profile.setAttribute('user-id', uid.trim())
            profile.setAttribute('size', '2xs')
            profile.className = 'seen-avatar-profile'
            groupRow.appendChild(profile)
          })
          seenContainer.appendChild(groupRow)
          return
        }

        if (!state.seenAvatars) {
          if (seenContainer.innerHTML !== '') {
            seenContainer.innerHTML = ''
          }
          return
        }

        const parts = state.seenAvatars.split(',').filter(p => p.trim() !== '')
        if (parts.length > 0) {
          seenContainer.innerHTML = ''
          const groupRow = document.createElement('div')
          groupRow.className = 'atoll-profile-group-row'
          parts.forEach(p => {
            const trimmed = p.trim()
            const profile = document.createElement('atoll-profile')
            profile.setAttribute('size', '2xs')
            profile.className = 'seen-avatar-profile'
            if (trimmed.includes('.') || trimmed.includes('/') || trimmed.startsWith('data:')) {
              profile.setAttribute('src', trimmed)
            } else {
              profile.setAttribute('name', trimmed)
            }
            groupRow.appendChild(profile)
          })
          seenContainer.appendChild(groupRow)
        } else {
          if (seenContainer.innerHTML !== '') {
            seenContainer.innerHTML = ''
          }
        }
      }

      // Reactions Integration
      let lastReactionsKey = null
      const updateReactions = () => {
        const msgId = state.messageId
        const localUuid = state.localUuid
        const hasReactions = state.hasReactions === 'true' || state.hasReactions === true
        const reactionsKey = `${msgId}:${localUuid}:${hasReactions}`
        if (reactionsKey === lastReactionsKey) {
          return
        }
        lastReactionsKey = reactionsKey
  
        // Update data-local-uuid for E2E
        if (localUuid) {
          container.setAttribute('data-local-uuid', localUuid)
        }
  
        /* Only mount the reactions component when the message actually has reactions. The
           timeline toggles this attribute live when a reaction arrives, so newly reacted
           messages still mount the component without re-rendering the timeline. */
        if (hasReactions && (msgId || localUuid)) {
          reactionsContainer.innerHTML = ''
          const reactions = document.createElement('atoll-chat-message-reactions')
          if (msgId) {
            reactions.setAttribute('message-id', msgId)
          }
          if (localUuid) {
            reactions.setAttribute('local-uuid', localUuid)
          }
          reactionsContainer.appendChild(reactions)
        } else {
          if (reactionsContainer.innerHTML !== '') {
            reactionsContainer.innerHTML = ''
          }
        }
      }

      observe('isSent', updateAvatar)
      observe('isLastInBlock', updateAvatar)
      observe('senderId', updateAvatar)
      observe('avatarUrl', updateAvatar)
      observe('avatarInitials', updateAvatar)
      observe('seenUserIds', updateSeen)
      observe('seenAvatars', updateSeen)
      observe('messageId', updateReactions)
      observe('localUuid', updateReactions)
      observe('hasReactions', updateReactions)

      updateAvatar()
      updateSeen()
      updateReactions()

      const getMsgId = () => state.messageId || state.localUuid

      // Hover is handled by CSS, but we need click for picker
      if (reactionBtn) {
        reactionBtn.onclick = (e) => {
          e.stopPropagation()
          const rect = reactionBtn.getBoundingClientRect()
          $bus.emit('ui:show_reaction_picker', {
            x: rect.left,
            y: rect.bottom + 5,
            targetId: getMsgId()
          })
          container.classList.remove('show-reaction-btn')
        }
      }

      // Tap-to-toggle reaction button next to message bubble on mobile/touch
      const isInteractive = (target) => {
        let current = target
        while (current && current !== bubbleWrapper) {
          const tag = current.tagName?.toLowerCase()
          if (tag === 'a' || tag === 'button' || tag === 'input' || tag === 'audio' || tag === 'video') {
            return true
          }
          if (current.classList?.contains('atoll-chat-waveform-player') ||
              current.classList?.contains('media-preview-container') ||
              current.classList?.contains('file-attachment-container')) {
            return true
          }
          current = current.parentElement
        }
        return false
      }

      const handleBubbleClick = (e) => {
        if (isInteractive(e.target)) {
          return
        }
        e.stopPropagation()

        const isShown = container.classList.contains('show-reaction-btn')

        // Hide other rows' reaction buttons
        document.querySelectorAll('.show-reaction-btn').forEach(row => {
          if (row !== container) {
            row.classList.remove('show-reaction-btn')
          }
        })

        if (isShown) {
          container.classList.remove('show-reaction-btn')
        } else {
          container.classList.add('show-reaction-btn')
        }
      }

      const handleDocumentClick = (e) => {
        if (container.contains(e.target)) {
          return
        }
        container.classList.remove('show-reaction-btn')
      }

      bubbleWrapper.addEventListener('click', handleBubbleClick, { signal })
      document.addEventListener('click', handleDocumentClick, { signal })
      document.addEventListener('touchstart', handleDocumentClick, {
        signal,
        passive: true
      })

      // Long-press for mobile
      let pressTimer
      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          const touch = e.touches ? (e.touches[0] || e.changedTouches[0]) : e
          $bus.emit('ui:show_reaction_picker', {
            x: touch.clientX,
            y: touch.clientY,
            targetId: getMsgId()
          })
        }, 600)
      }
      const cancelPress = () => clearTimeout(pressTimer)

      bubbleWrapper.addEventListener('touchstart', startPress, {
        signal,
        passive: true
      })
      bubbleWrapper.addEventListener('touchend', cancelPress, { signal })
      bubbleWrapper.addEventListener('touchmove', cancelPress, { signal })
      bubbleWrapper.addEventListener('mousedown', startPress, { signal })
      bubbleWrapper.addEventListener('mouseup', cancelPress, { signal })
      bubbleWrapper.addEventListener('mouseleave', cancelPress, { signal })

      signal.addEventListener('abort', () => {
        bubbleWrapper.removeEventListener('touchstart', startPress, { signal })
        bubbleWrapper.removeEventListener('touchend', cancelPress, { signal })
        bubbleWrapper.removeEventListener('touchmove', cancelPress, { signal })
        bubbleWrapper.removeEventListener('mousedown', startPress, { signal })
        bubbleWrapper.removeEventListener('mouseup', cancelPress, { signal })
        bubbleWrapper.removeEventListener('mouseleave', cancelPress, { signal })
        bubbleWrapper.removeEventListener('click', handleBubbleClick, { signal })
        document.removeEventListener('click', handleDocumentClick, { signal })
        document.removeEventListener('touchstart', handleDocumentClick, { signal })
      })
    }
  })
</script>
