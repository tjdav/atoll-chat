<template id="atoll-chat-timeline-item-voice">
  <div id="timeline-item-{{ localUuid }}" ref="container" class="atoll-chat-voice-message-container p-1 position-relative" style="min-width: 250px;">
    <div ref="loading" class="{{ loadingClass }} d-flex align-items-center p-3 w-100">
        <div class="placeholder rounded-circle me-3" style="width: 32px; height: 32px;"></div>
        <div class="placeholder col-8" style="height: 24px;"></div>
    </div>
    <div ref="transcriptionArea" class="transcription-area mt-2 px-2 d-none"></div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String
    },
    server: () => ({
      isLoaded: false,
      isError: false
    }),
    getters: {
      loadingClass: (state) => {
        if (state.isLoaded) {
          return 'd-none'
        }
        if (state.isError) {
          return ''
        }
        return ['pending', 'pending_p2p'].includes(state.status) ? 'placeholder-glow' : 'placeholder-wave'
      }
    },
    client: async ({ refs, state, storage, pocketbase, globalStore, signal, eventBus, cryptoWorker, transcription, observe }) => {
      const { $storage } = storage
      const { pb } = pocketbase
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
      const { $transcription } = transcription || {}

      const container = refs('container')
      const loading = refs('loading')
      const transcriptionArea = refs('transcriptionArea')

      let audio = null
      let lastCallId = 0
      let lastLoadedUuid = null
      let isTranscribing = false

      const cleanup = () => {
        if (audio) {
          audio.pause()
          audio.src = ''
          audio.load()
          audio.remove()
          audio = null
        }
      }

      const renderAudio = (objectUrl, waveformData, duration = 0) => {
        if (!objectUrl) {
          return
        }

        // Deduplication check
        const existing = container.querySelectorAll('.atoll-chat-waveform-player, audio')
        if (existing.length > 0) {
          const existingAudio = container.querySelector('audio')
          if (existingAudio && (existingAudio.src === objectUrl || existingAudio.src.endsWith(objectUrl))) {
            state.isLoaded = true
            lastLoadedUuid = state.localUuid
            loading.classList.add('d-none')
            return
          }
        }

        loading.classList.add('d-none')
        cleanup()
        existing.forEach(el => el.remove())

        if (waveformData) {
          const player = document.createElement('div')
          player.className = 'atoll-chat-waveform-player'
          const playBtn = document.createElement('button')
          playBtn.className = 'play-pause-btn'
          playBtn.setAttribute('type', 'button')
          playBtn.setAttribute('aria-label', 'Play voice message')
          playBtn.innerHTML = '<atoll-icon name="play" size="18" color="#ffffff"></atoll-icon>'
          const waveContainer = document.createElement('div')
          waveContainer.className = 'waveform-container'

          let waveEl = null
          let progressEl = null

          const isSvg = waveformData && (waveformData.startsWith('<svg') || waveformData.startsWith('data:image/svg+xml'))

          if (isSvg) {
            try {
              let svgString = waveformData
              if (waveformData.startsWith('data:image/svg+xml')) {
                const headerIndex = waveformData.indexOf(',')
                if (headerIndex !== -1) {
                  const rawContent = waveformData.slice(headerIndex + 1)
                  if (waveformData.includes('base64')) {
                    svgString = atob(rawContent)
                  } else {
                    svgString = decodeURIComponent(rawContent)
                  }
                }
              }

              const parser = new DOMParser()
              const doc = parser.parseFromString(svgString, 'image/svg+xml')
              const parsedSvg = doc.querySelector('svg')
              if (parsedSvg) {
                parsedSvg.setAttribute('preserveAspectRatio', 'none')
                parsedSvg.setAttribute('class', 'waveform-image text-primary')
                parsedSvg.setAttribute('style', 'width: 100%; height: 100%; object-fit: fill; fill: var(--atoll-chat-waveform-inactive, rgba(6, 199, 85, 0.2)); color: var(--atoll-chat-waveform-inactive, rgba(6, 199, 85, 0.2));')
                waveEl = parsedSvg.cloneNode(true)

                progressEl = parsedSvg.cloneNode(true)
                progressEl.setAttribute('preserveAspectRatio', 'none')
                progressEl.setAttribute('class', 'waveform-image text-primary')
                progressEl.setAttribute('style', 'height: 100%; object-fit: fill; max-width: none; fill: var(--atoll-chat-waveform-active, var(--bs-primary)); color: var(--atoll-chat-waveform-active, var(--bs-primary));')
              }
            } catch (err) {
              console.warn('[atoll-chat-timeline-item-voice] Failed to parse inline SVG waveform, falling back to img:', err)
            }
          }

          if (!waveEl) {
            waveEl = document.createElement('img')
            waveEl.src = waveformData
            waveEl.className = 'waveform-image'
          }
          if (!progressEl) {
            progressEl = document.createElement('img')
            progressEl.src = waveformData
            progressEl.className = 'waveform-image'
          }

          const progressContainer = document.createElement('div')
          progressContainer.className = 'waveform-progress'
          const seeker = document.createElement('div')
          seeker.className = 'waveform-seeker'
          const timeDisplay = document.createElement('div')
          timeDisplay.className = 'x-small font-monospace'
          timeDisplay.textContent = '0:00'

          progressContainer.appendChild(progressEl)
          waveContainer.appendChild(waveEl)
          waveContainer.appendChild(progressContainer)
          waveContainer.appendChild(seeker)
          player.appendChild(playBtn)
          player.appendChild(waveContainer)
          player.appendChild(timeDisplay)
          container.appendChild(player)

          audio = new Audio(objectUrl)
          audio.hidden = true
          container.appendChild(audio)

          // WebM audio duration fix for Chromium (seeking forces Chromium to compute total duration)
          const fixWebMDuration = () => {
            if (audio && audio.duration === Infinity) {
              audio.currentTime = 1e101
              const resetPos = () => {
                audio.removeEventListener('timeupdate', resetPos)
                audio.currentTime = 0
              }
              audio.addEventListener('timeupdate', resetPos)
            }
          }
          audio.addEventListener('loadedmetadata', fixWebMDuration)
          audio.addEventListener('durationchange', () => {
            if (audio && audio.duration === Infinity) {
              fixWebMDuration()
            }
          })

          let updateFrameId = null

          const stopUpdateLoop = () => {
            if (updateFrameId) {
              cancelAnimationFrame(updateFrameId)
              updateFrameId = null
            }
          }

          const updateProgress = () => {
            if (!audio) {
              return
            }
            let dur = audio.duration
            if (!dur || isNaN(dur) || dur === Infinity || dur <= 0) {
              dur = duration
            }
            const current = audio.currentTime || 0
            const percent = (dur && dur > 0) ? Math.min(100, Math.max(0, (current / dur) * 100)) : 0
            progressContainer.style.width = `${percent}%`
            seeker.style.left = `${percent}%`
            const mins = Math.floor(current / 60)
            const secs = Math.floor(current % 60)
            timeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`

            const containerWidth = waveContainer.clientWidth || waveContainer.getBoundingClientRect().width
            if (containerWidth > 0 && progressEl) {
              progressEl.style.width = `${containerWidth}px`
            }
          }

          const tick = () => {
            updateProgress()
            if (audio && !audio.paused && !audio.ended) {
              updateFrameId = requestAnimationFrame(tick)
            } else {
              updateFrameId = null
            }
          }

          const startUpdateLoop = () => {
            if (!updateFrameId && audio && !audio.paused && !audio.ended) {
              updateFrameId = requestAnimationFrame(tick)
            }
          }

          audio.oncanplaythrough = () => $bus.emit('ui:media_loaded')

          audio.addEventListener('play', () => {
            playBtn.innerHTML = '<atoll-icon name="pause" size="18" color="#ffffff"></atoll-icon>'
            startUpdateLoop()
          })
          audio.addEventListener('playing', () => {
            startUpdateLoop()
          })
          audio.addEventListener('timeupdate', () => {
            updateProgress()
            startUpdateLoop()
          })
          audio.addEventListener('pause', () => {
            playBtn.innerHTML = '<atoll-icon name="play" size="18" color="#ffffff"></atoll-icon>'
            stopUpdateLoop()
          })
          audio.addEventListener('ended', () => {
            audio.currentTime = 0
            if (audio.currentTime !== 0) {
              audio.load()
            }
            updateProgress()
            playBtn.innerHTML = '<atoll-icon name="play" size="18" color="#ffffff"></atoll-icon>'
            stopUpdateLoop()
          })

          const triggerPlay = () => {
            $bus.emit('waveform_player:play', { localUuid: state.localUuid })
            audio.play().catch(err => {
              if (err.name !== 'AbortError') {
                console.warn('[atoll-chat-timeline-item-voice] Playback failed:', err)
              }
            })
          }

          const unsubscribePlay = $bus.on('waveform_player:play', ({ localUuid }) => {
            if (localUuid !== state.localUuid && audio && !audio.paused) {
              audio.pause()
            }
          })
          signal.addEventListener('abort', unsubscribePlay)

          const unsubView = $state.subscribe('currentAppView', (view) => {
            if (view !== 'chat' && audio && !audio.paused) {
              audio.pause()
            }
          })
          const unsubRoom = $state.subscribe('activeSelectionId', () => {
            if (audio && !audio.paused) {
              audio.pause()
            }
          })
          signal.addEventListener('abort', unsubView)
          signal.addEventListener('abort', unsubRoom)

          playBtn.onclick = (e) => {
            e.stopPropagation()
            if (!audio) {
              return
            }
            if (audio.ended) {
              audio.currentTime = 0
              if (audio.currentTime !== 0) {
                audio.load()
              }
            }
            if (audio.paused) {
              triggerPlay()
            } else {
              audio.pause()
            }
          }

          waveContainer.onclick = (e) => {
            e.stopPropagation()
            let dur = audio ? audio.duration : 0
            if (!dur || isNaN(dur) || dur === Infinity || dur <= 0) {
              dur = duration
            }
            if (!audio || !dur || dur <= 0) {
              return
            }
            const rect = waveContainer.getBoundingClientRect()
            if (!rect.width) {
              return
            }
            const percent = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width))
            audio.currentTime = percent * dur
            updateProgress()
          }

          const resizeObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
              if (progressEl) {
                progressEl.style.width = `${entry.contentRect.width}px`
              }
            }
          })
          resizeObserver.observe(waveContainer)
          signal.addEventListener('abort', () => resizeObserver.disconnect())
        } else {
          audio = document.createElement('audio')
          audio.src = objectUrl
          audio.controls = true
          audio.className = 'w-100'
          audio.oncanplaythrough = () => $bus.emit('ui:media_loaded')
          container.appendChild(audio)
        }
        state.isLoaded = true
        lastLoadedUuid = state.localUuid
        loadTranscription()
      }

      const loadTranscription = async () => {
        if (!state.localUuid) {
          return
        }
        try {
          const message = await $storage.getMessage(state.localUuid)
          if (message && message.transcript) {
            renderTranscript(message.transcript)
          } else {
            renderTranscribeButton()
          }
        } catch {
          renderTranscribeButton()
        }
      }

      const renderTranscribeButton = () => {
        transcriptionArea.replaceChildren()

        const btn = document.createElement('button')
        btn.className = 'btn btn-sm btn-outline-primary d-flex align-items-center gap-1 py-1 px-2 mt-2'
        btn.style.fontSize = '0.75rem'
        btn.setAttribute('data-testid', 'btn-transcribe')
        btn.innerHTML = '<atoll-icon name="Aa" size="14"></atoll-icon> Transcribe'

        btn.onclick = async (e) => {
          e.stopPropagation()
          await startTranscription()
        }

        transcriptionArea.appendChild(btn)
        transcriptionArea.classList.remove('d-none')
      }

      const startTranscription = async () => {
        isTranscribing = true
        renderProgress(0, 'Initializing...')

        try {
          const cached = $state.decryptionCache.get(state.localUuid)
          if (!cached) {
            throw new Error('Audio not loaded')
          }
          const response = await fetch(cached.blobUrl)
          const audioBlob = await response.blob()

          if ($transcription) {
            await $transcription.transcribe(audioBlob, state.localUuid)
          } else {
            throw new Error('Transcription service not available')
          }
        } catch (err) {
          isTranscribing = false
          renderError(err.message)
        }
      }

      const renderProgress = (percentage, text) => {
        transcriptionArea.replaceChildren()

        const progressContainer = document.createElement('div')
        progressContainer.className = 'w-100 mt-2 p-2 rounded border border-secondary bg-body-tertiary text-body'

        const label = document.createElement('div')
        label.className = 'text-muted x-small mb-1 text-start'
        label.textContent = text

        const progressWrapper = document.createElement('div')
        progressWrapper.className = 'progress'
        progressWrapper.style.height = '4px'

        const progressBar = document.createElement('div')
        progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated'
        progressBar.style.width = `${percentage}%`

        progressWrapper.appendChild(progressBar)
        progressContainer.appendChild(label)
        progressContainer.appendChild(progressWrapper)

        transcriptionArea.appendChild(progressContainer)
        transcriptionArea.classList.remove('d-none')
      }

      const renderTranscript = (text) => {
        transcriptionArea.replaceChildren()

        const card = document.createElement('div')
        card.className = 'transcription-card p-2 rounded border border-secondary bg-body-tertiary text-body mt-2 d-flex flex-column gap-1'
        card.style.fontSize = '0.825rem'
        card.style.lineHeight = '1.4'

        const textContainer = document.createElement('div')
        textContainer.className = 'transcription-text text-start text-break'
        textContainer.textContent = text || '(Silence)'

        const actionsContainer = document.createElement('div')
        actionsContainer.className = 'd-flex justify-content-end align-items-center gap-2 mt-1'

        const copyBtn = document.createElement('button')
        copyBtn.className = 'btn btn-link btn-sm p-0 text-muted d-flex align-items-center gap-1 text-decoration-none'
        copyBtn.style.fontSize = '0.75rem'
        copyBtn.innerHTML = '<atoll-icon name="copy" size="12"></atoll-icon> Copy'

        copyBtn.onclick = async (e) => {
          e.stopPropagation()
          try {
            await navigator.clipboard.writeText(text)
            copyBtn.innerHTML = '<atoll-icon name="check-circle" size="12" color="var(--bs-success)"></atoll-icon> Copied'
            setTimeout(() => {
              copyBtn.innerHTML = '<atoll-icon name="copy" size="12"></atoll-icon> Copy'
            }, 2000)
          } catch {
            // Ignore
          }
        }

        actionsContainer.appendChild(copyBtn)
        card.appendChild(textContainer)
        card.appendChild(actionsContainer)

        transcriptionArea.appendChild(card)
        transcriptionArea.classList.remove('d-none')
      }

      const renderError = (message) => {
        transcriptionArea.replaceChildren()

        const errContainer = document.createElement('div')
        errContainer.className = 'd-flex align-items-center gap-1 text-warning mt-2'
        errContainer.style.fontSize = '0.75rem'

        const icon = document.createElement('atoll-icon')
        icon.setAttribute('name', 'warning')
        icon.setAttribute('size', '14')
        icon.setAttribute('color', 'var(--bs-warning)')

        const msgSpan = document.createElement('span')
        msgSpan.textContent = `Failed to transcribe: ${message}`

        errContainer.appendChild(icon)
        errContainer.appendChild(msgSpan)

        const retryBtn = document.createElement('button')
        retryBtn.className = 'btn btn-link btn-sm p-0 ms-2 text-primary text-decoration-none'
        retryBtn.style.fontSize = '0.75rem'
        retryBtn.textContent = 'Retry'
        retryBtn.onclick = async (e) => {
          e.stopPropagation()
          await startTranscription()
        }

        errContainer.appendChild(retryBtn)
        transcriptionArea.appendChild(errContainer)
        transcriptionArea.classList.remove('d-none')
      }

      const unsubscribeState = $bus.on('transcription:state_change', ({ localUuid, state: transcriptionState, text, error }) => {
        if (localUuid !== state.localUuid) {
          return
        }

        if (transcriptionState === 'transcribing') {
          isTranscribing = true
          renderProgress(0, 'Transcribing...')
        } else if (transcriptionState === 'done') {
          isTranscribing = false
          renderTranscript(text)
        } else if (transcriptionState === 'error') {
          isTranscribing = false
          renderError(error)
        }
      })

      const unsubscribeProgress = $bus.on('transcription:progress', (data) => {
        if (!isTranscribing) {
          return
        }
        if (data && data.status === 'progress') {
          const pct = Math.round(data.progress)
          renderProgress(pct, `Loading model... ${pct}%`)
        } else if (data && data.status === 'ready') {
          renderProgress(100, 'Model loaded, transcribing...')
        }
      })

      signal.addEventListener('abort', () => {
        unsubscribeState()
        unsubscribeProgress()
      })

      const loadAudio = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }
  
          if (lastLoadedUuid !== state.localUuid) {
            state.isLoaded = false
            state.isError = false
          } else if (state.isLoaded) {
            return
          }

          // sync cache check
          const cached = state.localUuid ? $state.decryptionCache.get(state.localUuid) : null
          if (cached && state.localUuid) {
            const objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            // still need message for waveform_data
            const message = await $storage.getMessage(state.localUuid)
            if (callId !== lastCallId || signal.aborted) {
              return
            }
            renderAudio(objectUrl, message?.waveform_data, message?.duration || 0)
          }

          // async lifecycle: fetch from DB and decrypt
          if (!state.localUuid) {
            return
          }
          const message = await $storage.getMessage(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          let objectUrl = typeof cached === 'string' ? cached : cached?.blobUrl
          if (!objectUrl) {
            if (['pending', 'pending_p2p'].includes(state.status)) {
              return
            }
            if (!message || !message.file_key) {
              throw new Error('Message or key missing')
            }

            let encryptedData
            const localFile = await $storage.getFile(state.localUuid || message.media_id)
            if (localFile) {
              encryptedData = await localFile.arrayBuffer()
            } else if (message.media_id) {
              const mediaRecord = await pb.collection('media').getOne(message.media_id)
              const fileUrl = pb.files.getURL(mediaRecord, mediaRecord.file)

              const response = await fetch(fileUrl, { signal })
              if (!response.ok) {
                throw new Error('Fetch failed')
              }
              encryptedData = await response.arrayBuffer()
            } else {
              throw new Error('Audio file not found locally or on server')
            }
            if (callId !== lastCallId || signal.aborted) {
              return
            }

            const decryptedData = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: encryptedData,
              nonce: message.file_nonce,
              key: message.file_key
            })

            if (!decryptedData) {
              throw new Error('Decryption failed')
            }

            const blob = new Blob([decryptedData], { type: message.mime_type || 'audio/webm' })
            objectUrl = URL.createObjectURL(blob)
            $state.decryptionCache.set(state.localUuid, {
              blobUrl: objectUrl,
              mimeType: message.mime_type || 'audio/webm'
            })
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderAudio(objectUrl, message?.waveform_data, message?.duration || 0)

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[atoll-chat-timeline-item-voice] Error:', err)
          state.isError = true
          loading.innerHTML = `
            <atoll-icon name="warning" size="24" color="var(--bs-warning)"></atoll-icon>
            <div class="x-small ms-2">Failed to load audio</div>
          `
        }
      }

      loadAudio()

      observe('status', loadAudio)
      observe('localUuid', loadAudio)

      signal.addEventListener('abort', cleanup)
    }
  })
</script>
