<template id="timeline-date-separator">
  <div class="date-separator text-center w-100">
    <span class="badge rounded-pill date-separator-pill px-3 py-1 text-uppercase font-monospace" style="background-color: var(--atoll-chat-date-separator-bg, var(--atoll-bg-surface-tertiary, #EEEEEE)); color: var(--atoll-chat-date-separator-color, var(--atoll-secondary-color, #777777)); font-size: 0.7rem; font-weight: 500;">
      {{ formattedDate }}
    </span>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      timestamp: String
    },
    getters: {
      formattedDate: (state) => {
        if (!state.timestamp) {
          return ''
        }
        try {
          const d = new Date(state.timestamp)
          const options = {
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }
          return d.toLocaleDateString('en-AU', options)
        } catch {
          return state.timestamp
        }
      }
    }
  })
</script>
