<template id="atoll-chat-timeline-system-message">
  <div class="atoll-chat-system-message w-100 text-center my-3 clearfix" data-message-id="{{ messageId }}" data-local-uuid="{{ localUuid }}">
    <span class="d-inline-block max-w-80 text-break px-3 py-1 rounded-pill system-message-pill border shadow-sm">
      <i class="bi {{ iconClass }} me-1"></i>
      {{ message }}
    </span>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .atoll-chat-system-message {
    width: 100%;
    text-align: center;
    margin-top: 1rem;
    margin-bottom: 1rem;
  }

  .system-message-pill {
    background-color: var(--atoll-chat-surface-glass) !important;
    color: var(--atoll-chat-text-secondary) !important;
    border-color: var(--atoll-chat-border) !important;
    font-size: 0.7rem;
  }

  .system-message-pill .text-success {
    color: var(--atoll-chat-accent, #06C755) !important;
  }

  .system-message-pill .text-primary {
    color: var(--atoll-chat-accent, #0d6efd) !important;
  }

  .system-message-pill .text-danger {
    color: var(--bs-danger, #dc3545) !important;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      type: String,
      content: String,
      messageId: String,
      localUuid: String,
      mediaTypes: String
    },
    getters: {
      iconClass: (state) => {
        switch (state.type) {
          case 'call_offer': return 'bi-telephone-plus-fill text-success'
          case 'call_answer': return 'bi-telephone-forward-fill text-primary'
          case 'call_end': return 'bi-telephone-x-fill text-danger'
          default: return 'bi-info-circle-fill'
        }
      },
      message: (state) => {
        switch (state.type) {
          case 'call_offer': {
            const hasVideo = !state.mediaTypes || state.mediaTypes.split(',').includes('video')
            return hasVideo ? 'Video Call' : 'Audio Call'
          }
          case 'call_answer': return 'Call joined'
          case 'call_end': return 'Call ended'
          default: return state.content || 'System notification'
        }
      }
    }
  })
</script>
