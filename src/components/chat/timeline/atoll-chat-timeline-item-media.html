<template id="atoll-chat-timeline-item-media">
  <div id="timeline-item-{{ localUuid }}" ref="container" class="media-preview-container rounded-3 overflow-hidden mb-1 position-relative" style="min-height: 200px; min-width: 250px;">
    <div ref="loading" class="{{ loadingClass }} w-100 h-100 d-flex flex-column align-items-center justify-content-center p-3 text-center" style="background: var(--bs-tertiary-bg);">
      <div class="placeholder col-8 mb-2" style="height: 24px;"></div>
      <div class="placeholder col-4" style="height: 16px;"></div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String
    },
    server: () => ({
      isLoaded: false,
      isError: false
    }),
    getters: {
      loadingClass: (state) => {
        if (state.isLoaded) {
          return 'd-none'
        }
  
        if (state.isError) {
          return ''
        }

        return ['pending', 'pending_p2p'].includes(state.status) ? 'placeholder-glow' : 'placeholder-wave'
      }
    },
    client: async ({ refs, state, storage, globalStore, eventBus, signal, utils, observe }) => {
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $time, $media } = utils
      const container = refs('container')
      const loading = refs('loading')

      let lastCallId = 0
      let lastLoadedUuid = null

      container.onclick = async () => {
        if (!state.localUuid) {
          return
        }
        const msg = await $storage.getMessage(state.localUuid)
        const mediaAtts = Array.isArray(msg?.attachments)
          ? msg.attachments.filter(a => a.isImage || a.isVideo || (a.mime_type || '').startsWith('image/') || (a.mime_type || '').startsWith('video/'))
          : []
        const singleAtt = mediaAtts[0] || null
        const mediaId = singleAtt?.media_id || singleAtt?.id || msg?.media_id

        $bus.emit('ui:open_chat_media_modal', {
          roomId: msg.room_id,
          localUuid: state.localUuid,
          mediaId
        })
      }

      const renderVideoPlaceholder = (_duration = 0) => {
        container.innerHTML = ''
        container.appendChild(loading)
        loading.classList.add('d-none')
        container.style.minHeight = 'auto'

        const placeholderDiv = document.createElement('div')
        placeholderDiv.className = 'w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-body-secondary position-relative rounded-3'
        placeholderDiv.style.minHeight = '200px'
        placeholderDiv.style.minWidth = '250px'
        placeholderDiv.innerHTML = `
          <div class="d-flex flex-column align-items-center video-placeholder-content">
            <atoll-icon name="videocam" size="32" class="mb-2"></atoll-icon>
            <span class="x-small">Video (No Thumbnail)</span>
          </div>
        `
        container.appendChild(placeholderDiv)

        const overlay = document.createElement('div')
        overlay.className = 'position-absolute bottom-0 start-0 p-2 d-flex align-items-center'
        overlay.style.background = 'linear-gradient(transparent, rgba(0,0,0,0.5))'

        const playBtn = document.createElement('button')
        playBtn.className = 'btn btn-sm btn-light rounded-circle shadow me-2'
        playBtn.setAttribute('type', 'button')
        playBtn.setAttribute('aria-label', 'Play video')
        playBtn.innerHTML = '<atoll-icon name="play" size="16"></atoll-icon>'
        overlay.appendChild(playBtn)

        container.appendChild(overlay)
        state.isLoaded = true
        lastLoadedUuid = state.localUuid
      }

      const renderMedia = (objectUrl, mimeType, duration = 0) => {
        if (!objectUrl) {
          return
        }

        // Deduplication check
        const existing = container.querySelector('img')
        if (existing) {
          if (existing.src === objectUrl || existing.src.endsWith(objectUrl)) {
            state.isLoaded = true
            lastLoadedUuid = state.localUuid
            loading.classList.add('d-none')
            container.style.minHeight = 'auto'
            return
          }
        }
        container.innerHTML = ''
        container.appendChild(loading)

        loading.classList.add('d-none')
        container.style.minHeight = 'auto'

        const img = document.createElement('img')
        img.className = 'rounded-3 shadow-sm mw-100 mh-100'
        img.style.maxHeight = '300px'
        img.onload = () => {
          $bus.emit('ui:media_loaded')
          if (!container.querySelector('.media-hover-overlay')) {
            const hoverOverlay = document.createElement('div')
            hoverOverlay.className = 'media-hover-overlay'
            const isVideo = (mimeType || '').startsWith('video/')
            const iconName = isVideo ? 'play' : 'search'
            hoverOverlay.innerHTML = `
              <div class="media-hover-icon d-flex align-items-center justify-content-center">
                <atoll-icon name="${iconName}" size="18"></atoll-icon>
              </div>
            `
            container.appendChild(hoverOverlay)
          }
        }
        img.src = objectUrl
        container.appendChild(img)

        if (mimeType.startsWith('video/')) {
          const overlay = document.createElement('div')
          overlay.className = 'position-absolute bottom-0 start-0 p-2 d-flex align-items-center'
          overlay.style.background = 'linear-gradient(transparent, rgba(0,0,0,0.5))'
          overlay.style.width = '100%'

          const badge = document.createElement('div')
          badge.className = 'bg-black bg-opacity-75 text-white px-2 py-1 rounded-pill d-flex align-items-center'
          badge.style.fontSize = '0.75rem'

          const icon = document.createElement('atoll-icon')
          icon.setAttribute('name', 'play')
          icon.setAttribute('size', '14')
          icon.classList.add('me-1')

          const span = document.createElement('span')
          span.textContent = $time.formatDuration(duration)

          badge.appendChild(icon)
          badge.appendChild(span)
          overlay.appendChild(badge)
          container.appendChild(overlay)
        }
        state.isLoaded = true
        lastLoadedUuid = state.localUuid
      }

      const loadMedia = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }
          if (lastLoadedUuid !== state.localUuid) {
            state.isLoaded = false
            state.isError = false
          } else if (state.isLoaded) {
            return
          }

          const message = await $storage.getMessage(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          const mediaAtts = Array.isArray(message?.attachments)
            ? message.attachments.filter(a => a.isImage || a.isVideo || (a.mime_type || '').startsWith('image/') || (a.mime_type || '').startsWith('video/'))
            : []
          const singleAtt = mediaAtts[0] || null
          const attSubId = singleAtt?.id ? `${state.localUuid}_${singleAtt.id}` : state.localUuid

          const localKey = `local:${attSubId}`
          const localThumbKey = `thumb:${attSubId}`
          const mimeType = singleAtt?.mime_type || message?.mime_type || 'image/webp'
          const isVideo = mimeType.startsWith('video/')
          const mediaId = singleAtt?.media_id || message?.media_id
          const thumbMediaId = singleAtt?.thumbnail?.media_id || singleAtt?.media_id || message?.thumbnail?.media_id || message?.media_id
          const thumbKey = `thumb:${thumbMediaId}`
          const mediaKey = `media:${mediaId}`
          const duration = singleAtt?.duration || message?.duration || 0

          let cached
          if (isVideo) {
            cached = $state.decryptionCache.get(localThumbKey) ||
                     $state.decryptionCache.get(`thumb:${state.localUuid}`) ||
                     $state.decryptionCache.get(thumbKey)
          } else {
            cached = $state.decryptionCache.get(localKey) ||
                     $state.decryptionCache.get(`local:${state.localUuid}`) ||
                     $state.decryptionCache.get(mediaKey)
          }

          if (cached) {
            const objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            if (objectUrl) {
              const cachedMime = (typeof cached === 'object' ? cached.mimeType : null) || mimeType
              renderMedia(objectUrl, cachedMime, duration)
              return
            }
          }

          let objectUrl = null

          if (isVideo) {
            const thumb = singleAtt?.thumbnail || message?.thumbnail
            if (thumb) {
              objectUrl = await $media.decrypt(thumb, {
                isThumbnail: true,
                signal
              })
            }
            if (!objectUrl) {
              renderVideoPlaceholder(duration)
              return
            }
          } else {
            if (['pending', 'pending_p2p'].includes(state.status)) {
              return
            }
            const fileKey = singleAtt?.file_key || message?.file_key
            const fileNonce = singleAtt?.file_nonce || message?.file_nonce
            if (!mediaId || !fileKey) {
              throw new Error('Message or key missing')
            }

            objectUrl = await $media.decrypt({
              media_id: mediaId,
              file_key: fileKey,
              file_nonce: fileNonce,
              mime_type: mimeType,
              localUuid: state.localUuid
            }, { signal })
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderMedia(objectUrl, mimeType, duration)

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[atoll-chat-timeline-item-media] Error:', err)
          state.isError = true
          loading.innerHTML = `
            <atoll-icon name="warning" size="24" color="var(--bs-warning)"></atoll-icon>
            <div class="x-small mt-1">Failed to load</div>
          `
        }
      }

      observe('status', loadMedia)
      observe('localUuid', loadMedia)

      loadMedia()
    }
  })
</script>
