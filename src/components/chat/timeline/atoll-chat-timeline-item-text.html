<template id="atoll-chat-timeline-item-text">
  <div id="timeline-item-{{ localUuid }}" class="message-bubble atoll-text-body-1 {{ bubbleClass }} d-flex align-items-center">
    <span class="{{ glowClass }} flex-grow-1">
      <div ref="markdownBody" class="markdown-body {{ placeholderClass }}"></div>
    </span>
  </div>
</template>

<style>
  :host {
    display: block;
    max-width: 80%;
  }

  .message-bubble {
    padding: 0.5rem 0.75rem;
    word-wrap: break-word;
    font-size: var(--bs-font-size-body-1, 1rem);
    line-height: var(--bs-line-height-body-1, 1.5);
    font-weight: var(--bs-font-weight-normal, 400);
  }

  .atoll-chat-bubble-sent {
    border-radius: 1.25rem;
    align-self: flex-end;
    background-color: var(--atoll-chat-bubble-sent-bg);
    color: var(--atoll-chat-bubble-sent-color);
    border: 1px solid var(--atoll-chat-bubble-sent-border, transparent) !important;
    backdrop-filter: var(--atoll-chat-bubble-sent-backdrop-filter, none);
    -webkit-backdrop-filter: var(--atoll-chat-bubble-sent-backdrop-filter, none);
  }

  .atoll-chat-bubble-sent a,
  .atoll-chat-bubble-sent .markdown-body a {
    color: var(--atoll-chat-bubble-sent-link-color, var(--atoll-chat-bubble-sent-color, #ffffff)) !important;
    text-decoration: underline;
  }

  .atoll-chat-bubble-received {
    border-radius: 1.25rem;
    align-self: flex-start;
    background-color: var(--atoll-chat-bubble-received-bg);
    color: var(--atoll-chat-bubble-received-color);
    border: 1px solid var(--atoll-chat-bubble-received-border, transparent) !important;
    backdrop-filter: var(--atoll-chat-bubble-received-backdrop-filter, none);
    -webkit-backdrop-filter: var(--atoll-chat-bubble-received-backdrop-filter, none);
  }

  .atoll-chat-bubble-received a,
  .atoll-chat-bubble-received .markdown-body a {
    color: var(--atoll-chat-accent) !important;
    text-decoration: underline;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      content: {
        type: String,
        default: ''
      },
      isSent: {
        type: Boolean,
        default: false
      },
      status: {
        type: String,
        default: 'sent'
      }
    },
    getters: {
      bubbleClass: (state) => {
        return state.isSent ? 'atoll-chat-bubble-sent' : 'atoll-chat-bubble-received'
      },
      glowClass: (state) => (state.status === 'pending' ? 'placeholder-glow' : ''),
      placeholderClass: (state) => (state.status === 'pending' ? 'placeholder col-12' : '')
    },
    client: ({ refs, state, eventBus, observe, markdown }) => {
      const markdownBody = refs('markdownBody')
      const { $bus } = eventBus
      const { renderMarkdown } = markdown

      const render = async () => {
        if (!state.content) {
          markdownBody.innerHTML = ''
          return
        }

        try {
          const cleanHtml = await renderMarkdown(state.content)
  
          if (markdownBody.innerHTML !== cleanHtml) {
            markdownBody.innerHTML = cleanHtml
            $bus.emit('ui:media_loaded')
          }
        } catch (err) {
          console.error('[atoll-chat-timeline-item-text] Render error:', err)
          markdownBody.textContent = state.content
        }
      }

      // Initial render
      render()

      // Watch for content changes
      observe('content', render)
    }
  })
</script>
