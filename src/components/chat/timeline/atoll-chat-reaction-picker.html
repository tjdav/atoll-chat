<template id="atoll-chat-reaction-picker">
  <div ref="container" class="atoll-chat-reaction-picker shadow border rounded bg-body" hidden style="position: fixed; z-index: 2000; width: 350px; height: 400px; max-width: 90vw;">
    <div ref="pickerContainer" style="width: 100%; height: 100%;"></div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: (ctx) => {
      const { refs, eventBus, signal, emojiPicker } = ctx
      const { $bus } = eventBus
      const { $emojiPicker } = emojiPicker
      const container = refs('container')
      const pickerContainer = refs('pickerContainer')
  
      let currentTargetId = null
      let picker = null

      const initPicker = async () => {
        if (picker || !$emojiPicker) {
          return
        }
  
        console.log('[atoll-chat-reaction-picker] Initializing picker')
        picker = await $emojiPicker.createPicker({})
        picker.classList.add('light')
        pickerContainer.appendChild(picker)
  
        picker.addEventListener('emoji-click', (event) => {
          console.log('[atoll-chat-reaction-picker] Emoji clicked:', event.detail.unicode)
          if (currentTargetId === 'CHAT_INPUT') {
            $bus.emit('ui:emoji_selected', {
              emoji: event.detail.unicode
            })
          } else if (currentTargetId) {
            $bus.emit('message:send_reaction', {
              targetId: currentTargetId,
              content: {
                type: 'emoji',
                value: event.detail.unicode
              }
            })
          }
          hide()
        })
      }

      const show = async (payload) => {
        const { x, y, targetId } = payload
        console.log('[atoll-chat-reaction-picker] show called', payload)
        currentTargetId = targetId
  
        await initPicker()
  
        container.style.left = `${x}px`
        container.style.top = `${y}px`

        // use requestAnimationFrame to position after rendering
        container.hidden = false

        await new Promise(resolve => requestAnimationFrame(resolve))

        // Adjust position if it goes off screen
        const rect = container.getBoundingClientRect()
        if (rect.right > window.innerWidth) {
          container.style.left = `${window.innerWidth - rect.width - 10}px`
        }
        if (rect.bottom > window.innerHeight) {
          container.style.top = `${window.innerHeight - rect.height - 10}px`
        }
        if (rect.left < 0) {
          container.style.left = '10px'
        }
        if (rect.top < 0) {
          container.style.top = '10px'
        }
        console.log('[atoll-chat-reaction-picker] Picker visible at', container.style.left, container.style.top)
      }

      const hide = () => {
        container.hidden = true
        currentTargetId = null
      }

      // Hide on click outside
      const handleClickOutside = (e) => {
        if (!container.contains(e.target) && !container.hidden) {
          hide()
        }
      }

      document.addEventListener('mousedown', handleClickOutside)
      signal.addEventListener('abort', () => document.removeEventListener('mousedown', handleClickOutside))

      $bus.on('ui:show_reaction_picker', show)
      $bus.on('ui:hide_reaction_picker', hide)
    }
  })
</script>
