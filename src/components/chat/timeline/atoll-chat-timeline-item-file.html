<template id="atoll-chat-timeline-item-file">
  <div id="timeline-item-{{ localUuid }}" class="atoll-chat-file-attachment p-2 mb-1 border rounded d-flex align-items-center" style="min-width: 250px; max-width: 350px;">
    <div ref="loading" class="{{ loadingClass }} d-flex align-items-center w-100">
      <div class="placeholder rounded me-2" style="width: 40px; height: 40px;"></div>
      <div class="flex-grow-1">
        <div class="placeholder col-8 mb-1" style="height: 14px;"></div>
        <div class="placeholder col-4" style="height: 12px;"></div>
      </div>
    </div>
    
    <div ref="content" class="d-none w-100 d-flex align-items-center">
      <div class="atoll-chat-file-icon-wrapper me-3 text-primary d-flex align-items-center justify-content-center">
        <atoll-icon ref="fileIcon" name="document" size="24"></atoll-icon>
      </div>
      <div class="flex-grow-1 overflow-hidden">
        <div ref="fileName" class="atoll-chat-file-name fw-bold small text-truncate mb-0"></div>
        <div ref="fileSize" class="atoll-chat-file-size x-small mb-0"></div>
      </div>
      <atoll-button variant="outline" size="sm" leading-icon="download" icon-only="true" ref="downloadBtn" title="Download" aria-label="Download"></atoll-button>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      status: String
    },
    server: () => ({
      isLoaded: false,
      isError: false
    }),
    getters: {
      loadingClass: (state) => {
        if (state.isLoaded) {
          return 'd-none'
        }
        if (state.isError) {
          return ''
        }
        return ['pending', 'pending_p2p'].includes(state.status) ? 'placeholder-glow' : 'placeholder-wave'
      }
    },
    client: async ({ refs, state, storage, globalStore, eventBus, signal, utils, observe }) => {
      const { $storage } = storage
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $media } = utils
  
      const loading = refs('loading')
      const content = refs('content')
      const fileNameEl = refs('fileName')
      const fileSizeEl = refs('fileSize')
      const downloadBtn = refs('downloadBtn')
      const fileIcon = refs('fileIcon')

      let lastCallId = 0
      let lastLoadedUuid = null

      const renderFile = (objectUrl, mimeType, filename) => {
        if (!objectUrl) {
          return
        }

        loading.classList.add('d-none')
        content.classList.remove('d-none')
        content.classList.add('d-flex')

        fileNameEl.textContent = filename || 'Attachment'
        fileSizeEl.textContent = mimeType || 'Unknown Type'
        if (fileIcon) {
          fileIcon.setAttribute('name', 'document')
        }

        if (downloadBtn) {
          downloadBtn.onclick = (e) => {
            e.preventDefault()
            e.stopPropagation()
            const a = document.createElement('a')
            a.href = objectUrl
            a.download = filename || 'attachment'
            a.click()
          }
        }
  
        $bus.emit('ui:media_loaded')
        state.isLoaded = true
        lastLoadedUuid = state.localUuid
      }

      const loadFile = async () => {
        const callId = ++lastCallId
        try {
          if (!state.localUuid || signal.aborted) {
            return
          }
  
          if (lastLoadedUuid !== state.localUuid) {
            state.isLoaded = false
            state.isError = false
          } else if (state.isLoaded) {
            return
          }

          const message = await $storage.getMessage(state.localUuid)
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          const mediaAtts = Array.isArray(message?.attachments) ? message.attachments : []
          const fileAtt = mediaAtts.find(a => !a.isImage && !a.isVideo && !a.isAudio &&
            !(a.mime_type || '').startsWith('image/') && !(a.mime_type || '').startsWith('video/') && !(a.mime_type || '').startsWith('audio/')) || null
          const attSubId = fileAtt?.id ? `${state.localUuid}_${fileAtt.id}` : state.localUuid

          const localKey = `local:${attSubId}`
          const mediaId = fileAtt?.media_id || message?.media_id
          const mediaKey = `media:${mediaId}`

          let cached = $state.decryptionCache.get(localKey) ||
                       $state.decryptionCache.get(`local:${state.localUuid}`) ||
                       $state.decryptionCache.get(mediaKey)

          if (cached) {
            const objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            const mimeType = (typeof cached === 'object' ? cached.mimeType : null) || fileAtt?.mime_type || message?.mime_type || ''
            renderFile(objectUrl, mimeType, fileAtt?.filename || message?.filename || message?.content)
            return
          }

          if (['pending', 'pending_p2p'].includes(state.status)) {
            return
          }
          const fileKey = fileAtt?.file_key || message?.file_key
          const fileNonce = fileAtt?.file_nonce || message?.file_nonce
          if (!mediaId || !fileKey) {
            throw new Error('Message or key missing')
          }

          const objectUrl = await $media.decrypt({
            media_id: mediaId,
            file_key: fileKey,
            file_nonce: fileNonce,
            mime_type: fileAtt?.mime_type || message?.mime_type,
            localUuid: state.localUuid
          }, { signal })

          if (callId !== lastCallId || signal.aborted) {
            return
          }
          renderFile(objectUrl, fileAtt?.mime_type || message?.mime_type, fileAtt?.filename || message?.filename || message?.content)

        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[atoll-chat-timeline-item-file] Error:', err)
          state.isError = true
          loading.innerHTML = `
            <atoll-icon name="warning" size="24" color="var(--bs-warning)"></atoll-icon>
            <div class="x-small ms-2">Failed to load file</div>
          `
        }
      }

      loadFile()

      observe('status', loadFile)
      observe('localUuid', loadFile)
    }
  })
</script>
