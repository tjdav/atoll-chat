<template id="atoll-chat-timeline-item-link">
  <a id="timeline-item-{{ localUuid }}" href="{{ urlHref }}" target="_blank" class="atoll-chat-link-preview mw-450 shadow-sm mb-1">
    <div class="preview-image-col {{ imageDisplayClass }}">
      <div ref="imageContainer" class="h-100">
        <!-- Decrypted image will be appended here -->
      </div>
    </div>
    <div class="p-2 flex-grow-1 overflow-hidden d-flex flex-column justify-content-center">
      <div class="small fw-bold text-truncate mb-0">{{ title }}</div>
      <div class="fs-7 link-preview-summary text-truncate-2 mb-1">{{ summary }}</div>
      <div class="fs-7 link-preview-domain text-truncate mt-auto d-flex align-items-center">
        <atoll-icon name="link" size="14" class="me-1"></atoll-icon>{{ domain }}
      </div>
    </div>
  </a>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      localUuid: String,
      linkIndex: Number,
      url: String,
      title: String,
      summary: String,
      domain: String,
      imageUrl: String,
      mediaId: String,
      fileKey: String,
      fileNonce: String
    },
    getters: {
      imageDisplayClass: (state) => (state.title ? '' : 'd-none'),
      urlHref: (state) => state.url
    },
    client: ({ state, refs, storage, globalStore, eventBus, pocketbase, signal, cryptoWorker, observe }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $worker } = cryptoWorker

      const decryptionCache = $state.decryptionCache
      const imageContainer = refs('imageContainer')

      let lastCallId = 0

      const renderImage = (src) => {
        // Deduplication check
        const existing = imageContainer.querySelector('img')
        if (existing) {
          if (existing.src === src || existing.src.endsWith(src)) {
            return
          }
          existing.remove()
        }

        const img = document.createElement('img')
        img.src = src
        img.className = 'img-fluid rounded-start'
        imageContainer.appendChild(img)
      }

      const loadPreviewImage = async () => {
        const callId = ++lastCallId
        const uuid = state.localUuid
        const linkIndex = state.linkIndex || 0
        const cacheKey = `${uuid}:${linkIndex}`

        if (!uuid || !decryptionCache || signal.aborted) {
          return
        }

        // check cache
        if (decryptionCache.has(cacheKey)) {
          const cached = decryptionCache.get(cacheKey)
          const cachedUrl = typeof cached === 'string' ? cached : cached.blobUrl
          if (cachedUrl) {
            renderImage(cachedUrl)
            return
          }
        }

        // query db
        const msg = await $storage.getMessage(uuid)
        if (callId !== lastCallId || signal.aborted) {
          return
        }

        const mediaId = state.mediaId || msg?.media_id
        const fileKey = state.fileKey || msg?.file_key
        const fileNonce = state.fileNonce || msg?.file_nonce

        // If it's a newer message with image_url, we can use it as fallback
        if (state.imageUrl && !mediaId) {
          renderImage(state.imageUrl)
        }

        if (!mediaId || !fileKey || !fileNonce) {
          return
        }

        try {
          const record = await pb.collection('media').getOne(mediaId)
          const fileUrl = pb.files.getURL(record, record.file)
  
          const response = await fetch(fileUrl, { signal })
          const encryptedBuffer = await response.arrayBuffer()
          if (callId !== lastCallId || signal.aborted) {
            return
          }

          let decrypted
          if (fileNonce === 'AES-GCM') {
            const base64Text = new TextDecoder().decode(encryptedBuffer).trim()
            const binaryString = atob(base64Text.replace(/-/g, '+').replace(/_/g, '/'))
            const len = binaryString.length
            const bytes = new Uint8Array(len)
            for (let i = 0; i < len; i++) {
              bytes[i] = binaryString.charCodeAt(i)
            }
            const iv = bytes.slice(0, 12)
            const ciphertextWithTag = bytes.slice(12)

            const rawKey = new TextEncoder().encode(fileKey)
            const cryptoKey = await window.crypto.subtle.importKey(
              'raw',
              rawKey,
              { name: 'AES-GCM' },
              false,
              ['decrypt']
            )

            decrypted = await window.crypto.subtle.decrypt(
              {
                name: 'AES-GCM',
                iv: iv
              },
              cryptoKey,
              ciphertextWithTag
            )
          } else {
            decrypted = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: encryptedBuffer,
              nonce: fileNonce,
              key: fileKey
            })
          }

          if (callId !== lastCallId || signal.aborted) {
            return
          }

          if (!decrypted) {
            throw new Error('Decryption failed')
          }

          const blob = new Blob([decrypted], { type: 'image/jpeg' })
          const blobUrl = URL.createObjectURL(blob)

          decryptionCache.set(cacheKey, {
            blobUrl,
            mimeType: 'image/jpeg'
          })
          renderImage(blobUrl)
          $bus.emit('ui:media_loaded')
        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[atoll-chat-timeline-item-link] Failed to decrypt preview image:', err)
        }
      }

      loadPreviewImage()

      const container = refs('imageContainer').parentElement
      container.addEventListener('click', async (e) => {
        e.preventDefault()
        const uuid = state.localUuid
        const linkIndex = state.linkIndex || 0
        const msg = await $storage.getMessage(uuid)
        const links = msg?.links || []
  
        $state.currentAppView = 'links'
        $state.activeSelectionType = 'links'
        $state.activeSelectionId = links.length > 1 ? `${uuid}:${linkIndex}` : uuid
      })

      observe('status', loadPreviewImage)
      observe('localUuid', loadPreviewImage)
    }
  })
</script>
