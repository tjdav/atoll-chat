<template id="atoll-chat-input">
  <div class="container mx-auto mb-3">
    <div class="atoll-chat-input-container py-3 px-4 rounded-5">
      <!-- Attachment Preview Bar -->
      <div class="{{ attachmentPreviewClass }}">
        <atoll-chat-attachment-preview 
          file-name="{{ fileName }}" 
          upload-status="{{ uploadStatus }}"
          is-video="{{ isVideo }}"
          thumbnail-url="{{ thumbnailPreviewUrl }}"
          is-custom="{{ isCustomCover }}"
          is-compressing="{{ isCompressing }}"
          is-uploading="{{ isUploading }}"
          progress="{{ progress }}"
        ></atoll-chat-attachment-preview>
      </div>

      <!-- Link Preview Bar -->
      <div class="{{ linkPreviewClass }}" ref="linkPreviewContainer">
        <!-- link-preview-input will be mounted here -->
      </div>

      <!-- Normal Input Mode -->
      <div class="{{ inputGroupClass }}" data-testid="chat-input-wrapper">
        <atoll-chat-input-text
          is-sending="{{ isSending }}"
          is-uploading="{{ isUploading }}"
          is-compressing="{{ isCompressing }}"
        ></atoll-chat-input-text>
      </div>

      <!-- Recording Mode -->
      <div ref="voiceRecorderContainer" class="{{ recordingUIClass }}">
        <!-- chat-voice-recorder will be mounted here -->
      </div>
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isSending: false,
      isUploading: false,
      isCompressing: false,
      uploadStatus: '',
      fileName: '',
      hasFile: false,
      isRecording: false,
      selectedFile: null,
      thumbnailBlob: null,
      duration: 0,
      pendingLinkData: [],
      ignoredUrls: {},
      isVideo: false,
      thumbnailPreviewUrl: '',
      isCustomCover: false,
      autoExtractedThumbnailBlob: null,
      progress: 0
    }),
    getters: {
      attachmentPreviewClass: (state) => (state.hasFile ? 'd-block' : 'd-none'),
      linkPreviewClass: (state) => (state.pendingLinkData.length > 0 ? 'd-block' : 'd-none'),
      inputGroupClass: (state) => (state.isRecording ? 'd-none' : 'd-block'),
      recordingUIClass: (state) => (state.isRecording ? 'd-flex w-100' : 'd-none')
    },
    client: ({ state, globalStore, storage, eventBus, refs, _signal, cryptoWorker, pocketbase, utils, media, config }) => {
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
      const { pb } = pocketbase
      const { $func } = utils
      const { $media } = media
      const { $config } = config

      let currentMusicMetadata = null
      let currentAlbumArtBlob = null
      let currentAudioWaveformData = null

      /**
       * Revokes the object URL of the thumbnail preview to free up memory.
       */
      const revokePreviewUrl = () => {
        if (state.thumbnailPreviewUrl) {
          URL.revokeObjectURL(state.thumbnailPreviewUrl)
          state.thumbnailPreviewUrl = ''
        }
      }

      /**
       * Resets the entire input UI state and components back to their defaults.
       */
      const resetUI = () => {
        state.isSending = false
        state.isUploading = false
        state.uploadStatus = ''
        state.fileName = ''
        state.hasFile = false
        state.isRecording = false
        state.selectedFile = null
        state.thumbnailBlob = null
        state.duration = 0
        state.pendingLinkData = []
        state.ignoredUrls = {}
        state.isVideo = false
        state.isCustomCover = false
        state.autoExtractedThumbnailBlob = null
        state.progress = 0
        revokePreviewUrl()
        currentMusicMetadata = null
        currentAlbumArtBlob = null
        currentAudioWaveformData = null
        $state.currentMessageText = ''
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
        const linkContainer = refs('linkPreviewContainer')
        linkContainer.innerHTML = ''
      }

      const URL_REGEX = /(?:\[[^\]]+\]\((https?:\/\/[^\s)]+)\))|(?:^|\s)(https?:\/\/[^\s]+)(?=\s|$)/gi

      /**
       * Analyzes text for URLs and fetches link previews if found.
       * @param {string} text - The text to check for URLs.
       * @returns {Promise<void>}
       */
      const checkUrl = $func.debounce(async (text) => {
        if (state.hasFile || state.isRecording) {
          return
        }

        const matches = Array.from(text.matchAll(URL_REGEX))
        if (matches.length > 0) {
          const urls = matches.map(m => m[1] || m[2]).filter(u => !state.ignoredUrls[u])
  
          // Remove previews for URLs that are no longer in the text
          const currentUrlsInText = new Set(matches.map(m => m[1] || m[2]))
          state.pendingLinkData = state.pendingLinkData.filter(d => currentUrlsInText.has(d.url))

          // Fetch metadata for new URLs
          const existingUrls = new Set(state.pendingLinkData.map(d => d.url))
          const newUrls = urls.filter(u => !existingUrls.has(u))

          for (const url of newUrls) {
            try {
              const data = await pb.send('/api/link-extraction', {
                query: { url }
              })
  
              if (data && (data.title || data.description || data.image)) {
                state.pendingLinkData = [...state.pendingLinkData, {
                  ...data,
                  url
                }]
              }
            } catch {
              // Gracefully ignore failed link metadata fetch
            }
          }

          // Update UI
          const container = refs('linkPreviewContainer')
          container.innerHTML = ''
          state.pendingLinkData.forEach(data => {
            const el = document.createElement('ui-link-preview-input')
            el.setAttribute('title', data.title || '')
            el.setAttribute('description', data.description || '')
            el.setAttribute('image', data.image || '')
            el.setAttribute('domain', data.domain || '')
            el.setAttribute('url', data.url)
            container.appendChild(el)
          })
        } else {
          state.pendingLinkData = []
          const container = refs('linkPreviewContainer')
          container.innerHTML = ''
        }
      }, 500)

      $state.subscribe('currentMessageText', (val) => {
        checkUrl(val || '')
      })

      /**
       * Dispatches a message to the worker and updates local database/storage state.
       * @param {Object} params - The message configuration parameters.
       * @returns {Promise<Object>} The dispatch results.
       * @throws {Error} Re-throws any unexpected internal errors.
       */
      const dispatchMessage = async (params) => {
        const localUuid = crypto.randomUUID()
        const room_id = $state.activeSelectionId

        // Optimistic Media Cache (Sender side)
        if (params.file) {
          const blobUrl = URL.createObjectURL(params.file)
          let thumbnailBlobUrl = null
          if (params.thumbnail_blob) {
            thumbnailBlobUrl = URL.createObjectURL(params.thumbnail_blob)
          }

          $state.decryptionCache.set(localUuid, {
            blobUrl,
            thumbnailBlobUrl,
            mimeType: params.mime_type || params.file.type,
            duration: params.duration
          })
        }

        // Optimistic Write
        const optimisticMessage = {
          local_uuid: localUuid,
          id: null,
          room_id: room_id,
          sender_id: $state.currentUser.id,
          type: params.type,
          content: params.content,
          status: params.status || 'pending',
          transfer_mode: params.transfer_mode,
          created_at: new Date().toISOString(),
          // Include any specific metadata for UI rendering while pending
          mime_type: params.mime_type,
          filename: params.filename,
          waveform_data: params.waveform_data,
          music_metadata: params.music_metadata,
          duration: params.duration,
          links: params.links
        }

        await $storage.saveMessage(optimisticMessage)
        $bus.emit('db:new_local_data', {
          room_id: room_id,
          message: optimisticMessage
        })

        if (!$state.isOnline) {
          if (params.file || params.thumbnail_blob || params.album_art_blob) {
            await $storage.saveFile(localUuid, params)
          }
          return {
            success: true,
            queued: true,
            id: null,
            localUuid
          }
        }

        try {
          // Dispatch to worker
          const result = await $worker.execute('worker:send_message', {
            room_id,
            localUuid,
            ...params
          })
  
          $bus.emit('message:sent', result)
          return result
        } catch (err) {
          throw err
        }
      }

      /**
       * Submits the user's composed message (whether text, media file, or link).
       * @param {Blob} [recordedBlob=null] - Optional voice recording audio blob.
       * @param {Blob} [recordedBlob=null] - Optional voice recording audio blob.
       * @param {string} [waveformData=null] - Optional voice recording waveform peak data.
       * @param {number} [recordedDuration=null] - Optional voice recording duration in seconds.
       * @returns {Promise<void>}
       * @throws {Error} If the sending process fails.
       */
      const sendMessage = async (recordedBlob = null, waveformData = null, recordedDuration = null) => {
        if (state.isSending || state.isUploading || state.isCompressing) {
          return
        }

        const text = ($state.currentMessageText || '').trim()
        const file = recordedBlob || state.selectedFile

        if (!text && !file) {
          return
        }

        state.isSending = true

        try {
          if (file) {
            state.isUploading = true
            state.progress = 100

            // Determine appropriate sending label based on file details
            let label = 'Sending file...'
            const isGif = (file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif'))
            if (isGif) {
              label = 'Sending animated GIF...'
            } else if (file.type.startsWith('image/')) {
              label = 'Sending image...'
            } else if (file.type.startsWith('video/')) {
              label = 'Sending video...'
            } else if (file.type.startsWith('audio/') || recordedBlob) {
              label = 'Sending audio...'
            } else {
              // Try checking compatibility category if available
              const compatibility = await $media.checkCompatibility(file)
              if (compatibility.category === 'image') {
                label = 'Sending image...'
              } else if (compatibility.category === 'video') {
                label = 'Sending video...'
              } else if (compatibility.category === 'audio') {
                label = 'Sending audio...'
              }
            }

            state.uploadStatus = label

            let musicMetadata = currentMusicMetadata
            let albumArtBlob = currentAlbumArtBlob
            let audioWaveformData = currentAudioWaveformData

            const maxServerUpload = $config ? $config.get('maxServerUploadSizeBytes') : 26214400
            const isP2P = file.size > maxServerUpload

            if (isP2P) {
              const activeRoomId = $state.activeSelectionId
              const room = await $storage.getRoom(activeRoomId)
              const participantsCount = room?.participants?.length || 0

              if (participantsCount > 2) {
                state.isSending = false
                state.isUploading = false
                state.uploadStatus = ''
                $bus.emit('ui:prompt_p2p_reroute', {
                  file,
                  room
                })
                resetUI()
                return
              } else {
                const recipient = room?.participants?.find(p => p.id !== $state.currentUser?.id)
                if (recipient) {
                  state.isSending = false
                  state.isUploading = false
                  state.uploadStatus = ''
                  $bus.emit('action:execute_p2p_transfer', {
                    file,
                    selectedUserId: recipient.id,
                    roomId: activeRoomId
                  })
                  resetUI()
                  return
                }
              }
            }

            const payloadToDispatch = {
              type: 'media',
              content: recordedBlob ? '' : text,
              file: file,
              filename: file.name,
              mime_type: file.type,
              waveform_data: recordedBlob ? waveformData : audioWaveformData,
              music_metadata: musicMetadata,
              album_art_blob: albumArtBlob,
              thumbnail_blob: state.thumbnailBlob,
              duration: recordedDuration ?? state.duration,
              timestamp: Date.now()
            }
            await dispatchMessage(payloadToDispatch)
          } else if (state.pendingLinkData.length > 0) {
            // Link Preview Flow
            await dispatchMessage({
              type: 'link',
              content: text,
              links: state.pendingLinkData,
              timestamp: Date.now()
            })
          } else {
            // Standard Text Flow
            await dispatchMessage({
              type: 'text',
              content: text,
              timestamp: Date.now()
            })
          }

          resetUI()
          $bus.emit('ui:focus_input')
        } catch (err) {
          state.isSending = false
          state.isUploading = false
          alert('Failed to send: ' + err.message)
          throw err
        }
      }

      // Event Bus Subscriptions
      $bus.on('ui:cancel', () => {
        resetUI()
      })

      // Listen for video and audio compression progress
      $bus.on('media:video_progress', (payload) => {
        state.uploadStatus = `Compressing video... ${payload.progress}%`
      })
      $bus.on('media:audio_progress', (payload) => {
        state.uploadStatus = `Converting audio... ${payload.progress}%`
      })

      $bus.on('ui:file_selected', async (payload) => {
        let file = payload.file
        if (!file) {
          return
        }

        state.selectedFile = file
        state.fileName = file.name
        state.hasFile = true
        state.progress = 0

        // Check format compatibility for web playback across browsers and devices
        const compatibility = await $media.checkCompatibility(file)
        if (compatibility.requiresConversion) {
          state.uploadStatus = `Converting ${compatibility.category} to web format...`
        }

        const isGif = (file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif'))

        if (isGif) {
          if (file.size > 15 * 1024 * 1024) {
            state.isCompressing = true
            state.uploadStatus = 'Compressing animated GIF...'
            try {
              file = await $media.compressGif(file)
            } catch {
              // Proceed with original file on compression failure
            } finally {
              state.isCompressing = false
            }
          }
        } else if (file.type.startsWith('image/') || compatibility.category === 'image') {
          state.isCompressing = true
          state.uploadStatus = 'Compressing image...'
          try {
            const compressedBlob = await $media.compressImage(file, {
              maxWidth: 1200,
              maxHeight: 1200,
              quality: 0.8,
              format: 'image/webp'
            })
            // Create a new File from the Blob to keep the original name (with new extension)
            const lastDot = file.name.lastIndexOf('.')
            const baseName = lastDot !== -1 ? file.name.substring(0, lastDot) : file.name
            const newName = baseName + '.webp'
            file = new File([compressedBlob], newName, { type: 'image/webp' })
          } catch {
            // Proceed with original file on compression failure
          } finally {
            state.isCompressing = false
          }
        } else if (file.type.startsWith('video/') || compatibility.category === 'video') {
          state.isCompressing = true
          state.progress = 0
          state.uploadStatus = 'Processing video...'
          state.isVideo = true
          state.isCustomCover = false
          state.autoExtractedThumbnailBlob = null
          revokePreviewUrl()
          try {
            // Extract thumbnail and duration first
            const result = await $media.extractThumbnail(file)
            if (result.thumbnail) {
              state.thumbnailBlob = result.thumbnail
              state.autoExtractedThumbnailBlob = result.thumbnail
              state.thumbnailPreviewUrl = URL.createObjectURL(result.thumbnail)
            }
            state.duration = result.duration

            // Evaluate video file size against ENV server limit
            const maxServerUploadSizeBytes = $config ? $config.get('maxServerUploadSizeBytes') : 26214400
            const evalResult = await $media.evaluateVideo(file, {
              duration: result.duration,
              maxServerUploadSizeBytes
            })

            // If non-universal format (.mkv, .mov, .avi, .ts), always force transcoding to MP4 for web playback
            if (compatibility.requiresConversion || evalResult.shouldCompress) {
              state.uploadStatus = compatibility.requiresConversion
                ? 'Converting video to MP4 for web playback... 0%'
                : 'Compressing video for server upload... 0%'
              file = await $media.compressVideo(file, {
                duration: result.duration,
                bitrate: evalResult.targetBitrate || undefined,
                onProgress: (progress, status) => {
                  state.progress = progress
                  if (status) {
                    state.uploadStatus = status
                  } else {
                    state.uploadStatus = compatibility.requiresConversion
                      ? `Converting video to MP4... ${progress}%`
                      : `Compressing video... ${progress}%`
                  }
                }
              })
            } else if (evalResult.useWebRTC) {
              state.uploadStatus = 'Queued for P2P direct transfer (exceeds server limit)'
            }
          } catch {
            state.uploadStatus = 'Ready to send (original format)'
          } finally {
            state.isCompressing = false
          }
        } else if (file.type.startsWith('audio/') || compatibility.category === 'audio') {
          state.isCompressing = true
          state.progress = 0
          state.uploadStatus = 'Extracting metadata...'
          try {
            // Convert uncompressed or non-universal audio (WAV, FLAC) to MP4/AAC (.m4a)
            if (compatibility.requiresConversion) {
              state.uploadStatus = 'Converting audio to web format...'
              file = await $media.convertAudio(file)
            }

            const result = await $media.extractThumbnail(file)
            if (result) {
              currentMusicMetadata = result.metadata
              state.duration = result.duration
              currentAlbumArtBlob = result.albumArt
            }
          } catch {
            // Proceed with fallback audio handling if metadata fails
          }

          state.uploadStatus = 'Generating waveform...'
          try {
            currentAudioWaveformData = await utils.$media.generateWaveform(file)
          } catch {
            // Proceed with fallback audio handling if waveform generation fails
          }
          state.isCompressing = false
        }

        if (file.size > 100 * 1024 * 1024) {
          alert('File is too large. Maximum size is 100MB.')
          resetUI()
          return
        }
        state.selectedFile = file
        state.fileName = file.name
        state.uploadStatus = 'Ready to send'
      })

      $bus.on('ui:mic_clicked', () => {
        state.isRecording = true
        const container = refs('voiceRecorderContainer')

        container.innerHTML = ''
        const el = document.createElement('atoll-chat-voice-recorder')
        container.appendChild(el)
      })

      $bus.on('ui:send_clicked', () => {
        sendMessage()
      })

      $bus.on('ui:voice_ready', (payload) => {
        sendMessage(payload.blob, payload.waveformData, payload.duration)
      })

      $bus.on('ui:voice_discarded', () => {
        state.isRecording = false
  
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
        $bus.emit('ui:focus_input')
      })

      $bus.on('ui:dismiss_link_preview', (payload) => {
        const url = payload.url
        state.ignoredUrls = {
          ...state.ignoredUrls,
          [url]: true
        }
        state.pendingLinkData = state.pendingLinkData.filter(d => d.url !== url)
  
        const container = refs('linkPreviewContainer')
        const el = container.querySelector(`ui-link-preview-input[url="${url}"]`)
        if (el) {
          el.remove()
        }
      })

      $bus.on('ui:custom_cover_selected', async (payload) => {
        const file = payload.file
        if (!file) {
          return
        }

        state.isCompressing = true
        state.uploadStatus = 'Compressing custom cover...'
        try {
          // Compress custom cover directly in the main thread (<= 50KB constraint)
          const compressed = await $media.compressImage(file, {
            maxWidth: 480,
            maxHeight: 480,
            quality: 0.6,
            format: 'image/webp'
          })

          state.thumbnailBlob = compressed
          state.isCustomCover = true

          // Swap the preview URL
          revokePreviewUrl()
          state.thumbnailPreviewUrl = URL.createObjectURL(compressed)
          state.uploadStatus = 'Custom cover applied'
        } catch (err) {
          alert('Failed to process custom cover: ' + err.message)
          throw err
        } finally {
          state.isCompressing = false
        }
      })

      $bus.on('ui:remove_custom_cover_clicked', () => {
        state.isCustomCover = false
        state.thumbnailBlob = state.autoExtractedThumbnailBlob

        // Restore original preview
        revokePreviewUrl()
        if (state.autoExtractedThumbnailBlob) {
          state.thumbnailPreviewUrl = URL.createObjectURL(state.autoExtractedThumbnailBlob)
        }
        state.uploadStatus = 'Ready to send'
      })
    }
  })
</script>
