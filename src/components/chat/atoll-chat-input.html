<template id="atoll-chat-input">
  <div class="container mx-auto mb-3">
    <div class="atoll-chat-input-container py-3 px-4 rounded-5">
      <!-- Attachment Preview Bar -->
      <div class="{{ attachmentPreviewClass }}">
        <atoll-chat-attachment-preview 
          ref="attachmentPreview"
        ></atoll-chat-attachment-preview>
      </div>

      <!-- Link Preview Bar -->
      <div class="{{ linkPreviewClass }}" ref="linkPreviewContainer">
        <!-- link-preview-input will be mounted here -->
      </div>

      <!-- Normal Input Mode -->
      <div class="{{ inputGroupClass }}" data-testid="chat-input-wrapper">
        <atoll-chat-input-text
          is-sending="{{ isSending }}"
          is-uploading="{{ isUploading }}"
          is-compressing="{{ isCompressing }}"
        ></atoll-chat-input-text>
      </div>

      <!-- Recording Mode -->
      <div ref="voiceRecorderContainer" class="{{ recordingUIClass }}">
        <!-- chat-voice-recorder will be mounted here -->
      </div>
    </div>

    <!-- File Too Large Alert -->
    <atoll-popup
      ref="fileTooLargePopup"
      data-testid="fileTooLargePopup"
      size="sm"
      variant="alert"
      title="File Too Large"
      description="File is too large. Maximum size is 100MB."
      primary-text="Dismiss"
    ></atoll-popup>

    <!-- Media Conversion Error Alert -->
    <atoll-popup
      ref="mediaConversionErrorPopup"
      data-testid="mediaConversionErrorPopup"
      size="sm"
      variant="alert"
      title="Media Conversion Failed"
      description="This media file could not be converted for web playback."
      primary-text="Dismiss"
    ></atoll-popup>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isSending: false,
      isUploading: false,
      isCompressing: false,
      hasFile: false,
      isRecording: false,
      attachments: [],
      pendingLinkData: [],
      ignoredUrls: {}
    }),
    getters: {
      attachmentPreviewClass: (state) => (state.hasFile ? 'd-block' : 'd-none'),
      linkPreviewClass: (state) => (state.pendingLinkData.length > 0 ? 'd-block' : 'd-none'),
      inputGroupClass: (state) => (state.isRecording ? 'd-none' : 'd-block'),
      recordingUIClass: (state) => (state.isRecording ? 'd-flex w-100' : 'd-none')
    },
    client: ({ root, state, globalStore, storage, eventBus, refs, signal, cryptoWorker, pocketbase, utils, media, config }) => {
      if (root) {
        Object.defineProperty(root, 'attachments', {
          get: () => state.attachments || [],
          configurable: true
        })
      }
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
      const { pb } = pocketbase
      const { $func } = utils
      const { $media } = media
      const { $config } = config

      let fileProcessingToken = 0

      // File-size alert popup (single Dismiss button)
      const fileTooLargePopup = refs('fileTooLargePopup')
      fileTooLargePopup.addEventListener('atoll-popup-primary', () => {
        fileTooLargePopup.hide()
      }, { signal })

      // Media conversion error popup
      const mediaConversionErrorPopup = refs('mediaConversionErrorPopup')
      mediaConversionErrorPopup.addEventListener('atoll-popup-primary', () => {
        mediaConversionErrorPopup.hide()
      }, { signal })

      /**
       * Displays media conversion failure alert modal.
       */
      const showConversionError = (title, description) => {
        mediaConversionErrorPopup.setAttribute('title', title)
        mediaConversionErrorPopup.setAttribute('description', description)
        mediaConversionErrorPopup.show()
      }

      /**
       * Revokes object URLs for queued attachments to free up memory.
       */
      const revokeAttachmentUrls = (attachment) => {
        if (!attachment) {
          return
        }

        if (attachment.thumbnailPreviewUrl && typeof attachment.thumbnailPreviewUrl === 'string' && attachment.thumbnailPreviewUrl.startsWith('blob:')) {
          try {
            URL.revokeObjectURL(attachment.thumbnailPreviewUrl)
          } catch {
          }
          attachment.thumbnailPreviewUrl = null
        }
  
        if (attachment.blobUrl && typeof attachment.blobUrl === 'string' && attachment.blobUrl.startsWith('blob:')) {
          try {
            URL.revokeObjectURL(attachment.blobUrl)
          } catch {
          }
          attachment.blobUrl = null
        }
      }

      /**
       * Synchronizes attachment list to the preview component.
       */
      const syncAttachmentPreview = () => {
        $bus.emit('ui:attachments_updated', { attachments: state.attachments || [] })
        const previewComp = refs('attachmentPreview')
        if (previewComp) {
          previewComp.attachments = state.attachments || []
        }
      }

      /**
       * Resets the entire input UI state and components back to their defaults.
       */
      const resetUI = () => {
        fileProcessingToken++
        state.isSending = false
        state.isUploading = false
        state.isCompressing = false
        state.hasFile = false
        state.isRecording = false
        if (state.attachments) {
          state.attachments.forEach(revokeAttachmentUrls)
        }
        state.attachments = []
        state.pendingLinkData = []
        state.ignoredUrls = {}
        $state.currentMessageText = ''
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
        const linkContainer = refs('linkPreviewContainer')
        linkContainer.innerHTML = ''
        syncAttachmentPreview()
      }

      const URL_REGEX = /(?:\[[^\]]+\]\((https?:\/\/[^\s)]+)\))|(?:^|\s)(https?:\/\/[^\s]+)(?=\s|$)/gi

      /**
       * Analyzes text for URLs and fetches link previews if found.
       * @param {string} text - The text to check for URLs.
       * @returns {Promise<void>}
       */
      const checkUrl = $func.debounce(async (text) => {
        if (state.hasFile || state.isRecording) {
          return
        }

        const matches = Array.from(text.matchAll(URL_REGEX))
        if (matches.length > 0) {
          const urls = matches.map(m => m[1] || m[2]).filter(u => !state.ignoredUrls[u])
  
          // Remove previews for URLs that are no longer in the text
          const currentUrlsInText = new Set(matches.map(m => m[1] || m[2]))
          state.pendingLinkData = state.pendingLinkData.filter(d => currentUrlsInText.has(d.url))

          // Fetch metadata for new URLs
          const existingUrls = new Set(state.pendingLinkData.map(d => d.url))
          const newUrls = urls.filter(u => !existingUrls.has(u))

          for (const url of newUrls) {
            try {
              const data = await pb.send('/api/link-extraction', {
                query: { url }
              })
  
              if (data && (data.title || data.description || data.image)) {
                state.pendingLinkData = [...state.pendingLinkData, {
                  ...data,
                  url
                }]
              }
            } catch {
              // Gracefully ignore failed link metadata fetch
            }
          }

          // Update UI
          const container = refs('linkPreviewContainer')
          container.innerHTML = ''
          state.pendingLinkData.forEach(data => {
            const el = document.createElement('ui-link-preview-input')
            el.setAttribute('title', data.title || '')
            el.setAttribute('description', data.description || '')
            el.setAttribute('image', data.image || '')
            el.setAttribute('domain', data.domain || '')
            el.setAttribute('url', data.url)
            container.appendChild(el)
          })
        } else {
          state.pendingLinkData = []
          const container = refs('linkPreviewContainer')
          container.innerHTML = ''
        }
      }, 500)

      $state.subscribe('currentMessageText', (val) => {
        checkUrl(val || '')
      })

      /**
       * Dispatches a message to the worker and updates local database/storage state.
       * @param {Object} params - The message configuration parameters.
       * @returns {Promise<Object>} The dispatch results.
       * @throws {Error} Re-throws any unexpected internal errors.
       */
      const dispatchMessage = async (params) => {
        const localUuid = crypto.randomUUID()
        const room_id = $state.activeSelectionId

        // Optimistic Media Cache (Sender side)
        if (params.attachments && params.attachments.length > 0) {
          params.attachments.forEach((att, idx) => {
            if (att.file) {
              const blobUrl = URL.createObjectURL(att.file)
              const subId = att.id ? `${localUuid}_${att.id}` : (idx === 0 ? localUuid : `${localUuid}_${idx}`)
              const localKey = `local:${subId}`
              $state.decryptionCache.set(localKey, {
                blobUrl,
                blob: att.file,
                mimeType: att.mime_type || att.file.type,
                duration: att.duration
              })
              if (att.thumbnail_blob) {
                const thumbBlobUrl = URL.createObjectURL(att.thumbnail_blob)
                $state.decryptionCache.set(`thumb:${subId}`, {
                  blobUrl: thumbBlobUrl,
                  blob: att.thumbnail_blob,
                  mimeType: 'image/webp'
                })
              }
            }
          })
        } else if (params.file) {
          const blobUrl = URL.createObjectURL(params.file)
          const localKey = `local:${localUuid}`
          $state.decryptionCache.set(localKey, {
            blobUrl,
            blob: params.file,
            mimeType: params.mime_type || params.file.type,
            duration: params.duration
          })
          if (params.thumbnail_blob) {
            const thumbBlobUrl = URL.createObjectURL(params.thumbnail_blob)
            $state.decryptionCache.set(`thumb:${localUuid}`, {
              blobUrl: thumbBlobUrl,
              blob: params.thumbnail_blob,
              mimeType: 'image/webp'
            })
          }
        }

        // Optimistic Write
        const optimisticMessage = {
          local_uuid: localUuid,
          id: null,
          room_id: room_id,
          sender_id: $state.currentUser.id,
          type: params.type,
          content: params.content,
          status: params.status || 'pending',
          transfer_mode: params.transfer_mode,
          created_at: new Date().toISOString(),
          attachments: params.attachments ? params.attachments.map(a => ({
            id: a.id,
            filename: a.filename,
            mime_type: a.mime_type,
            duration: a.duration,
            waveform_data: a.waveform_data,
            music_metadata: a.music_metadata,
            isVideo: a.isVideo,
            isAudio: a.isAudio,
            isImage: a.isImage
          })) : undefined,
          mime_type: params.mime_type,
          filename: params.filename,
          waveform_data: params.waveform_data,
          music_metadata: params.music_metadata,
          duration: params.duration,
          links: params.links
        }

        await $storage.saveMessage(optimisticMessage)
        $bus.emit('db:new_local_data', {
          room_id: room_id,
          message: optimisticMessage
        })

        if (!$state.isOnline) {
          if (params.file || params.thumbnail_blob || params.album_art_blob) {
            await $storage.saveFile(localUuid, params)
          }
          return {
            success: true,
            queued: true,
            id: null,
            localUuid
          }
        }

        try {
          // Dispatch to worker
          const result = await $worker.execute('worker:send_message', {
            room_id,
            localUuid,
            ...params
          })
  
          $bus.emit('message:sent', result)
          return result
        } catch (err) {
          await $storage.deleteRecord('local_messages', localUuid).catch(() => {
          })
          await $storage.deleteRecord('local_files', localUuid).catch(() => {
          })
          $state.decryptionCache.delete(`local:${localUuid}`)
          $state.decryptionCache.delete(`thumb:${localUuid}`)
          if (params.attachments && params.attachments.length > 0) {
            params.attachments.forEach((att, idx) => {
              const subId = att.id ? `${localUuid}_${att.id}` : (idx === 0 ? localUuid : `${localUuid}_${idx}`)
              $state.decryptionCache.delete(`local:${subId}`)
              $state.decryptionCache.delete(`thumb:${subId}`)
            })
          }
          $bus.emit('db:new_local_data', { room_id })
          $bus.emit('ui:show_toast', {
            message: 'Failed to send: ' + err.message,
            type: 'danger'
          })
          resetUI()
          throw err
        }
      }

      /**
       * Submits the user's composed message (whether text, media file, or link).
       * @param {Blob} [recordedBlob=null] - Optional voice recording audio blob.
       * @param {string} [waveformData=null] - Optional voice recording waveform peak data.
       * @param {number} [recordedDuration=null] - Optional voice recording duration in seconds.
       * @returns {Promise<void>}
       * @throws {Error} If the sending process fails.
       */
      const sendMessage = async (recordedBlob = null, waveformData = null, recordedDuration = null) => {
        if (state.isSending || state.isUploading || state.isCompressing) {
          return
        }

        const text = ($state.currentMessageText || '').trim()
        const hasAttachments = state.attachments && state.attachments.length > 0

        if (!text && !hasAttachments && !recordedBlob) {
          return
        }

        // Check if any attachment is still processing or in error state
        if (hasAttachments) {
          for (const att of state.attachments) {
            if (att.file) {
              const comp = await $media.checkCompatibility(att.file)
              if (comp.requiresConversion) {
                $bus.emit('ui:show_toast', {
                  message: 'Cannot send unconverted media format',
                  type: 'warning'
                })
                resetUI()
                return
              }
            }
          }
          if (state.attachments.some(att => att.isCompressing)) {
            $bus.emit('ui:show_toast', {
              message: 'Please wait for media compression to complete',
              type: 'warning'
            })
            return
          }
          if (state.attachments.some(att => att.isError)) {
            $bus.emit('ui:show_toast', {
              message: 'Please remove failed attachments before sending',
              type: 'warning'
            })
            return
          }
        }

        state.isSending = true

        try {
          if (recordedBlob) {
            // Voice Message Flow
            state.isUploading = true
            await dispatchMessage({
              type: 'media',
              content: '',
              file: recordedBlob,
              filename: 'voice-message.webm',
              mime_type: recordedBlob.type || 'audio/webm',
              waveform_data: waveformData,
              duration: recordedDuration,
              timestamp: Date.now()
            })
            state.isSending = false
            state.isUploading = false
            state.isRecording = false
            const container = refs('voiceRecorderContainer')
            if (container) {
              container.innerHTML = ''
            }
            $bus.emit('ui:focus_input')
            return
          } else if (hasAttachments) {
            state.isUploading = true
            const maxServerUpload = $config ? $config.get('maxServerUploadSizeBytes') : 26214400

            // Check if any attachment exceeds server limit for P2P direct transfer
            const oversizedItem = state.attachments.find(att => att.file && att.file.size > maxServerUpload)
            if (oversizedItem) {
              const activeRoomId = $state.activeSelectionId
              const room = await $storage.getRoom(activeRoomId)
              const participantsCount = room?.participants?.length || 0

              if (participantsCount > 2) {
                state.isSending = false
                state.isUploading = false
                showConversionError(
                  'File Too Large',
                  `File "${oversizedItem.fileName}" exceeds the 25MB server upload limit for group chats.`
                )
                return
              } else {
                const recipient = room?.participants?.find(p => p.id !== $state.currentUser?.id)
                if (recipient) {
                  state.isSending = false
                  state.isUploading = false
                  $bus.emit('action:execute_p2p_transfer', {
                    file: oversizedItem.file,
                    selectedUserId: recipient.id,
                    roomId: activeRoomId
                  })
                  resetUI()
                  return
                }
              }
            }

            const attachmentsPayload = state.attachments.map(att => ({
              id: att.id,
              file: att.file,
              filename: att.fileName,
              mime_type: att.mimeType,
              waveform_data: att.waveform_data,
              music_metadata: att.music_metadata,
              album_art_blob: att.album_art_blob,
              thumbnail_blob: att.thumbnailBlob,
              duration: att.duration,
              isVideo: att.isVideo,
              isAudio: att.isAudio,
              isImage: att.isImage
            }))

            const payloadToDispatch = {
              type: 'media',
              content: text,
              attachments: attachmentsPayload,
              timestamp: Date.now()
            }
            await dispatchMessage(payloadToDispatch)
          } else if (state.pendingLinkData.length > 0) {
            // Link Preview Flow
            await dispatchMessage({
              type: 'link',
              content: text,
              links: state.pendingLinkData,
              timestamp: Date.now()
            })
          } else {
            // Standard Text Flow
            await dispatchMessage({
              type: 'text',
              content: text,
              timestamp: Date.now()
            })
          }

          resetUI()
          $bus.emit('ui:focus_input')
        } catch (err) {
          state.isSending = false
          state.isUploading = false
          if (recordedBlob) {
            state.isRecording = false
            const container = refs('voiceRecorderContainer')
            if (container) {
              container.innerHTML = ''
            }
          } else {
            resetUI()
          }
          $bus.emit('ui:show_toast', {
            message: 'Failed to send: ' + err.message,
            type: 'danger'
          })
        }
      }

      // Event Bus Subscriptions
      $bus.on('ui:cancel', () => {
        resetUI()
      })

      // Listen for video and audio compression progress
      $bus.on('media:video_progress', (payload) => {
        state.uploadStatus = `Compressing video... ${payload.progress}%`
      })
      $bus.on('media:audio_progress', (payload) => {
        state.uploadStatus = `Converting audio... ${payload.progress}%`
      })

      /**
       * Process an individual file and populate attachment record state.
       */
      const processAttachmentItem = async (item, currentToken) => {
        let file = item.file

        if (file.size > 100 * 1024 * 1024) {
          item.isCompressing = false
          item.isError = true
          item.errorMessage = 'File is too large (>100MB)'
          item.status = 'Error'
          syncAttachmentPreview()
          return
        }

        try {
          const compatibility = await $media.checkCompatibility(file)
          if (currentToken !== fileProcessingToken) {
            return
          }

          const isGif = (file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif'))

          if (isGif) {
            item.isImage = true
            if (file.size > 15 * 1024 * 1024) {
              item.status = 'Compressing GIF...'
              try {
                file = await $media.compressGif(file)
              } catch {
                // proceed with original
              }
              if (currentToken !== fileProcessingToken) {
                return
              }
            }
            item.file = file
            item.thumbnailPreviewUrl = URL.createObjectURL(file)
            item.isCompressing = false
            item.status = 'Ready'
          } else if (file.type.startsWith('image/') || compatibility.category === 'image') {
            item.isImage = true
            item.status = 'Compressing image...'
            syncAttachmentPreview()
            try {
              const compressedBlob = await $media.compressImage(file, {
                maxWidth: 1200,
                maxHeight: 1200,
                quality: 0.8,
                format: 'image/webp'
              })
              if (currentToken !== fileProcessingToken) {
                return
              }
              const lastDot = file.name.lastIndexOf('.')
              const baseName = lastDot !== -1 ? file.name.substring(0, lastDot) : file.name
              const newName = baseName + '.webp'
              file = new File([compressedBlob], newName, { type: 'image/webp' })
              item.file = file
              item.mimeType = file.type
            } catch {
              if (currentToken !== fileProcessingToken) {
                return
              }
              if (compatibility.requiresConversion) {
                resetUI()
                showConversionError(
                  'Image Conversion Failed',
                  'This image format could not be converted for web display. Please choose a supported image format (such as JPEG, PNG, or WebP).'
                )
                return
              }
            }
            item.thumbnailPreviewUrl = URL.createObjectURL(item.file)
            item.isCompressing = false
            item.status = 'Ready'
          } else if (file.type.startsWith('video/') || compatibility.category === 'video') {
            item.isVideo = true
            item.status = 'Processing video...'
            syncAttachmentPreview()
            try {
              const result = await $media.extractThumbnail(file)
              if (currentToken !== fileProcessingToken) {
                return
              }
              if (result.thumbnail) {
                item.thumbnailBlob = result.thumbnail
                item.autoExtractedThumbnailBlob = result.thumbnail
                item.thumbnailPreviewUrl = URL.createObjectURL(result.thumbnail)
              }
              item.duration = result.duration

              const maxServerUploadSizeBytes = $config ? $config.get('maxServerUploadSizeBytes') : 26214400
              const evalResult = await $media.evaluateVideo(file, {
                duration: result.duration,
                maxServerUploadSizeBytes
              })
              if (currentToken !== fileProcessingToken) {
                return
              }

              if (compatibility.requiresConversion || evalResult.shouldCompress) {
                item.status = 'Compressing video...'
                file = await $media.compressVideo(file, {
                  duration: result.duration,
                  bitrate: evalResult.targetBitrate || undefined,
                  onProgress: (progress, status) => {
                    if (currentToken !== fileProcessingToken) {
                      return
                    }
                    item.progress = progress
                    if (status) {
                      item.status = status
                    }
                    syncAttachmentPreview()
                  }
                })
                if (currentToken !== fileProcessingToken) {
                  return
                }
                item.file = file
                item.mimeType = file.type
                item.status = 'Ready'
              } else {
                item.status = 'Ready'
              }
            } catch {
              if (currentToken !== fileProcessingToken) {
                return
              }
              if (compatibility.requiresConversion) {
                resetUI()
                showConversionError(
                  'Video Conversion Failed',
                  'This video could not be converted for web playback. Please choose a supported format (such as MP4 or WebM).'
                )
                return
              }
              const maxServerUploadSizeBytes = $config ? $config.get('maxServerUploadSizeBytes') : 26214400
              if (file.size > maxServerUploadSizeBytes) {
                const activeRoomId = $state.activeSelectionId
                const room = await $storage.getRoom(activeRoomId)
                const participantsCount = room?.participants?.length || 0
                if (participantsCount > 2) {
                  item.isError = true
                  item.errorMessage = 'Exceeds 25MB limit'
                  item.status = 'Error'
                  item.isCompressing = false
                  resetUI()
                  showConversionError(
                    'Video Conversion Failed',
                    'This video exceeds the 25MB server limit and could not be compressed for group chat.'
                  )
                  return
                }
              } else {
                item.status = 'Ready to send (original format)'
              }
            }
            item.isCompressing = false
            item.status = item.status || 'Ready'
          } else if (file.type.startsWith('audio/') || compatibility.category === 'audio') {
            item.isAudio = true
            item.status = 'Extracting audio...'
            syncAttachmentPreview()
            try {
              if (compatibility.requiresConversion) {
                file = await $media.convertAudio(file)
                if (currentToken !== fileProcessingToken) {
                  return
                }
                item.file = file
                item.mimeType = file.type
              }
              const result = await $media.extractThumbnail(file)
              if (currentToken !== fileProcessingToken) {
                return
              }
              if (result) {
                item.music_metadata = result.metadata
                item.duration = result.duration
                item.album_art_blob = result.albumArt
                if (result.albumArt) {
                  item.thumbnailBlob = result.albumArt
                  item.thumbnailPreviewUrl = URL.createObjectURL(result.albumArt)
                }
              }
            } catch {
              if (currentToken !== fileProcessingToken) {
                return
              }
              if (compatibility.requiresConversion) {
                resetUI()
                showConversionError(
                  'Audio Conversion Failed',
                  'This audio format could not be converted for web playback. Please choose a supported audio format (such as MP3 or M4A).'
                )
                return
              }
            }

            try {
              item.waveform_data = await $media.generateWaveform(file)
            } catch {
            }
            item.isCompressing = false
            item.status = 'Ready'
          } else {
            // Non-media document
            item.isCompressing = false
            item.status = 'Ready'
          }
        } catch (err) {
          item.isError = true
          item.errorMessage = err.message || 'Processing failed'
          item.status = 'Error'
          item.isCompressing = false
        }

        syncAttachmentPreview()
      }

      /**
       * Queues multiple files for batch processing.
       */
      const handleFilesSelected = async (incomingFiles) => {
        if (!incomingFiles || incomingFiles.length === 0) {
          return
        }

        const currentAttachments = state.attachments || []
        const currentCount = currentAttachments.length

        if (currentCount >= 10) {
          $bus.emit('ui:show_toast', {
            message: 'Maximum 10 attachments per message',
            type: 'warning'
          })
          return
        }

        let filesToAdd = incomingFiles
        if (currentCount + incomingFiles.length > 10) {
          $bus.emit('ui:show_toast', {
            message: 'Maximum 10 attachments per message',
            type: 'warning'
          })
          filesToAdd = incomingFiles.slice(0, 10 - currentCount)
        }

        const currentToken = ++fileProcessingToken

        const newItems = filesToAdd.map(file => ({
          id: crypto.randomUUID(),
          file: file,
          fileName: file.name,
          fileSize: file.size,
          mimeType: file.type,
          isVideo: false,
          isAudio: false,
          isImage: false,
          thumbnailBlob: null,
          thumbnailPreviewUrl: null,
          autoExtractedThumbnailBlob: null,
          isCustomCover: false,
          duration: 0,
          waveform_data: null,
          music_metadata: null,
          album_art_blob: null,
          isCompressing: true,
          isUploading: false,
          isError: false,
          errorMessage: null,
          progress: 0,
          status: 'Processing...'
        }))

        state.attachments = [...currentAttachments, ...newItems]
        state.hasFile = true
        syncAttachmentPreview()

        // Concurrently process files
        await Promise.all(newItems.map(item => processAttachmentItem(item, currentToken)))
      }

      $bus.on('ui:file_selected', (payload) => {
        if (payload.file) {
          handleFilesSelected([payload.file])
        }
      })

      $bus.on('ui:files_selected', (payload) => {
        if (payload.files && payload.files.length > 0) {
          handleFilesSelected(payload.files)
        }
      })

      $bus.on('ui:remove_attachment', (payload) => {
        const id = payload.id
        if (!id) {
          return
        }
        const removed = (state.attachments || []).find(a => a.id === id)
        if (removed) {
          revokeAttachmentUrls(removed)
        }
        state.attachments = (state.attachments || []).filter(a => a.id !== id)
        if (state.attachments.length === 0) {
          state.hasFile = false
        }
        syncAttachmentPreview()
      })

      $bus.on('ui:clear_all_attachments', () => {
        resetUI()
      })

      $bus.on('ui:mic_clicked', () => {
        state.isRecording = true
        const container = refs('voiceRecorderContainer')

        container.innerHTML = ''
        const el = document.createElement('atoll-chat-voice-recorder')
        container.appendChild(el)
      })

      $bus.on('ui:send_clicked', async () => {
        await sendMessage()
      })

      $bus.on('ui:voice_ready', (payload) => {
        sendMessage(payload.blob, payload.waveformData, payload.duration)
      })

      $bus.on('ui:voice_discarded', () => {
        state.isRecording = false
  
        const container = refs('voiceRecorderContainer')
        container.innerHTML = ''
        $bus.emit('ui:focus_input')
      })

      $bus.on('ui:dismiss_link_preview', (payload) => {
        const url = payload.url
        state.ignoredUrls = {
          ...state.ignoredUrls,
          [url]: true
        }
        state.pendingLinkData = state.pendingLinkData.filter(d => d.url !== url)
  
        const container = refs('linkPreviewContainer')
        const el = container.querySelector(`ui-link-preview-input[url="${url}"]`)
        if (el) {
          el.remove()
        }
      })

      $bus.on('ui:attachment_cover_selected', async (payload) => {
        const { id, file } = payload
        if (!id || !file) {
          return
        }
        const item = (state.attachments || []).find(a => a.id === id)
        if (!item) {
          return
        }

        item.isCompressing = true
        item.status = 'Compressing cover...'
        syncAttachmentPreview()
        try {
          const compressed = await $media.compressImage(file, {
            maxWidth: 480,
            maxHeight: 480,
            quality: 0.6,
            format: 'image/webp'
          })

          item.thumbnailBlob = compressed
          item.isCustomCover = true
          if (item.thumbnailPreviewUrl) {
            URL.revokeObjectURL(item.thumbnailPreviewUrl)
          }
          item.thumbnailPreviewUrl = URL.createObjectURL(compressed)
          item.status = 'Custom cover applied'
        } catch (err) {
          $bus.emit('ui:show_toast', {
            message: 'Failed to process custom cover: ' + err.message,
            type: 'danger'
          })
        } finally {
          item.isCompressing = false
          syncAttachmentPreview()
        }
      })

      $bus.on('ui:attachment_cover_removed', (payload) => {
        const { id } = payload
        if (!id) {
          return
        }
        const item = (state.attachments || []).find(a => a.id === id)
        if (!item) {
          return
        }

        item.isCustomCover = false
        item.thumbnailBlob = item.autoExtractedThumbnailBlob
        if (item.thumbnailPreviewUrl) {
          URL.revokeObjectURL(item.thumbnailPreviewUrl)
        }
        if (item.autoExtractedThumbnailBlob) {
          item.thumbnailPreviewUrl = URL.createObjectURL(item.autoExtractedThumbnailBlob)
        }
        item.status = 'Ready'
        syncAttachmentPreview()
      })
    }
  })
</script>
