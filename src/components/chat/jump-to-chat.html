<template id="jump-to-chat">
  <atoll-button 
    ref="btnJump"
    variant="{{ buttonVariant }}" 
    size="{{ buttonSize }}" 
    pill="true" 
    leading-icon="{{ buttonIcon }}" 
    text="{{ buttonLabel }}"
    aria-label="{{ buttonLabel }}"
    title="{{ buttonLabel }}"
    icon-only="{{ isIconOnly }}"
    data-testid="btnJumpToChat"
  >
  </atoll-button>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      variant: {
        type: String,
        default: 'primary'
      },
      size: {
        type: String,
        default: 'md'
      },
      label: {
        type: String,
        default: 'Jump to Chat'
      },
      icon: {
        type: String,
        default: 'chat'
      },
      roomId: {
        type: String,
        default: ''
      },
      messageId: {
        type: String,
        default: ''
      },
      iconOnly: {
        type: Boolean,
        default: false
      },
      responsive: {
        type: Boolean,
        default: true
      }
    },
    getters: {
      buttonVariant: (state) => state.variant || 'primary',
      buttonSize: (state) => state.size || 'md',
      buttonIcon: (state) => state.icon || 'chat',
      buttonLabel: (state) => state.label || 'Jump to Chat',
      isIconOnly: (state) => Boolean(state.iconOnly || (state.responsive && state.isMobile))
    },
    server: () => ({
      isMobile: false
    }),
    client: ({ refs, root, state, storage, globalStore, eventBus, signal }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const btnJump = refs('btnJump')

      // Handle responsive collapsing on mobile screens
      if (state.responsive && typeof window !== 'undefined' && typeof window.matchMedia === 'function') {
        const mediaQuery = window.matchMedia('(max-width: 767.98px)')
        const handleMediaChange = (e) => {
          state.isMobile = e.matches
        }

        if (typeof mediaQuery.addEventListener === 'function') {
          mediaQuery.addEventListener('change', handleMediaChange)
          signal.addEventListener('abort', () => {
            mediaQuery.removeEventListener('change', handleMediaChange)
          })
        } else if (typeof mediaQuery.addListener === 'function') {
          mediaQuery.addListener(handleMediaChange)
          signal.addEventListener('abort', () => {
            mediaQuery.removeListener(handleMediaChange)
          })
        }

        state.isMobile = mediaQuery.matches
      }

      btnJump.addEventListener('click', async () => {
        let targetRoomId = state.roomId || null
        let targetMessageId = state.messageId || null

        if (!targetRoomId || !targetMessageId) {
          if ($state.mediaViewerSourceChatRoomId && $state.mediaViewerSourceMessageId) {
            targetRoomId = $state.mediaViewerSourceChatRoomId
            targetMessageId = $state.mediaViewerSourceMessageId
          }
        }

        if (!targetRoomId || !targetMessageId) {
          const id = $state.activeSelectionId
          const type = $state.activeSelectionType

          if (!id || !type) {
            $bus.emit('ui:show_toast', {
              message: 'No active media or message selected',
              type: 'warning'
            })
            return
          }

          try {
            if (type === 'links') {
              const msg = await $storage.getMessage(id)
              if (msg) {
                targetRoomId = msg.room_id
                targetMessageId = id
              }
            } else {
              // For pictures, videos, music, documents
              const asset = await $storage.getAsset(id)
              if (asset) {
                targetRoomId = asset.room_id
                targetMessageId = asset.message_id
              } else {
                // Fallback to message lookup if selection ID matches message record
                const msg = await $storage.getMessage(id)
                if (msg) {
                  targetRoomId = msg.room_id
                  targetMessageId = id
                }
              }
            }
          } catch {
            // Gracefully catch storage errors and fall through to unresolvable check
          }
        }

        // Execution & Navigation
        if (targetRoomId && targetMessageId) {
          // Clear source tracking
          $state.mediaViewerSourceChatRoomId = null
          $state.mediaViewerSourceMessageId = null

          // Set jumping state and navigate
          $state.isJumpingToMessage = true
          $state.jumpToMessageId = targetMessageId
          $state.currentAppView = 'chats'
          $state.activeSelectionId = targetRoomId
          $state.activeSelectionType = 'chats'

          // Emit scroll command for timeline
          setTimeout(() => {
            $bus.emit('message:scroll_to', { messageId: targetMessageId })
          }, 100)

          root.dispatchEvent(new CustomEvent('jump-to-chat:success', {
            bubbles: true,
            composed: true,
            detail: {
              roomId: targetRoomId,
              messageId: targetMessageId
            }
          }))
        } else {
          $bus.emit('ui:show_toast', {
            message: 'Could not locate original chat message',
            type: 'warning'
          })
        }
      }, { signal })
    }
  })
</script>
