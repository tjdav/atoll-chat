<template id="jump-to-chat">
  <atoll-button variant="primary" size="md" pill="true" leading-icon="chat" ref="btnJump">
    <span class="atoll-btn-text">Jump to Chat</span>
  </atoll-button>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, storage, globalStore, eventBus, signal }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const btnJump = refs('btnJump')

      // Media query to dynamically set icon-only on mobile/tablet view
      const mediaQuery = window.matchMedia('(max-width: 767.98px)')
      const updateIconOnly = (e) => {
        if (e.matches) {
          btnJump.setAttribute('icon-only', 'true')
        } else {
          btnJump.removeAttribute('icon-only')
        }
      }
      mediaQuery.addEventListener('change', updateIconOnly)
      updateIconOnly(mediaQuery)

      signal.addEventListener('abort', () => {
        mediaQuery.removeEventListener('change', updateIconOnly)
      })

      btnJump.addEventListener('click', async () => {
        const id = $state.activeSelectionId
        const type = $state.activeSelectionType
  
        if (!id || !type) {
          return
        }

        let room_id = null
        let messageId = null

        try {
          if (type === 'links') {
            const msg = await $storage.getMessage(id)
            if (msg) {
              room_id = msg.room_id
              messageId = id
            }
          } else {
            // For pictures, videos, music, documents
            const asset = await $storage.getAsset(id)
            if (asset) {
              room_id = asset.room_id
              messageId = asset.message_id
            }
          }

          if (room_id && messageId) {
            $state.isJumpingToMessage = true
            $state.jumpToMessageId = messageId
            $state.currentAppView = 'chats'
            $state.activeSelectionId = room_id
            $state.activeSelectionType = 'chats'
  
            // Wait for timeline to mount and then emit scroll
            setTimeout(() => {
              $bus.emit('message:scroll_to', { messageId })
            }, 100)
          } else {
            console.warn('[jump-to-chat] Could not resolve room or message for', {
              id,
              type
            })
          }
        } catch (err) {
          console.error('[jump-to-chat] Error jumping to chat:', err)
        }
      }, { signal })
    }
  })
</script>
