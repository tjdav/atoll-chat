<template id="atoll-chat-voice-recorder">
  <div class="atoll-chat-voice-recorder-ui d-flex align-items-center gap-2 w-100">
    <atoll-button 
      type="button"
      variant="ghost" 
      size="sm" 
      pill="true" 
      icon-only="true" 
      ref="discardButton" 
      class="atoll-chat-input-btn-discard" 
      title="Discard" 
      aria-label="Discard" 
      data-testid="discardButton"
    >
      <atoll-icon name="trash" size="20"></atoll-icon>
    </atoll-button>
    
    <div class="atoll-chat-recording-controls flex-grow-1 d-flex align-items-center rounded-pill px-3 py-1">
      <atoll-button 
        type="button"
        variant="primary" 
        leading-icon="{{ pauseResumeIcon }}" 
        icon-only="true" 
        pill="true" 
        size="sm" 
        ref="pauseResumeButton" 
        class="atoll-chat-recording-btn-pause-resume" 
        title="Pause or Resume" 
        aria-label="Pause or Resume" 
        data-testid="pauseResumeButton"
      ></atoll-button>

      <atoll-button 
        type="button"
        variant="ghost" 
        leading-icon="restart" 
        icon-only="true" 
        size="sm" 
        ref="redoButton" 
        title="Restart" 
        aria-label="Restart recording" 
        data-testid="redoButton" 
        class="atoll-chat-recording-btn-redo" 
        hidden="{{ hideRedoControls }}"
      ></atoll-button>

      <div class="atoll-chat-recording-visualizer flex-grow-1 d-flex align-items-center overflow-hidden" style="height: 32px;">
        <canvas ref="visualizerCanvas" width="400" height="32" class="w-100 h-100" role="img" aria-label="Voice visualizer waveform"></canvas>
      </div>

      <span class="atoll-chat-recording-timer small fw-bold font-monospace ms-2">{{ formattedDuration }}</span>

      <atoll-button 
        type="button"
        variant="ghost" 
        leading-icon="mic" 
        icon-only="true" 
        size="sm" 
        ref="resumeMicButton" 
        title="Add more" 
        aria-label="Resume recording" 
        data-testid="resumeMicButton" 
        class="atoll-chat-recording-btn-resume" 
        hidden="{{ hideRedoControls }}"
      ></atoll-button>
    </div>

    <atoll-button 
      type="button"
      variant="primary" 
      leading-icon="send" 
      icon-only="true" 
      pill="true" 
      ref="sendVoiceButton" 
      title="Send Voice Message" 
      aria-label="Send Voice Message" 
      data-testid="sendVoiceButton"
    ></atoll-button>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isPaused: false,
      recordingDuration: 0
    }),
    getters: {
      pauseResumeIcon: (state) => (state.isPaused ? 'play' : 'pause'),
      hideRedoControls: (state) => (!state.isPaused),
      formattedDuration: (state) => {
        const mins = Math.floor(state.recordingDuration / 60)
        const secs = state.recordingDuration % 60
        return `${mins}:${secs.toString().padStart(2, '0')}`
      }
    },
    client: ({ refs, state, eventBus, signal }) => {
      const { $bus } = eventBus
      let mediaRecorder = null
      let activeStream = null
      let audioChunks = []
      let timerInterval = null
      let shouldSendVoice = false

      // Web Audio API variables
      let audioContext = null
      let analyser = null
      let dataArray = null
      let animationFrameId = null
      let drawFn = null
      let recordedAmplitudes = []
      let lastSampleTime = 0
      const SAMPLE_INTERVAL = 100
      const barWidth = 3
      const gap = 1

      const startTimer = () => {
        stopTimer()
        timerInterval = setInterval(() => {
          if (!state.isPaused) {
            state.recordingDuration++
          }
        }, 1000)
      }

      const stopTimer = () => {
        if (timerInterval) {
          clearInterval(timerInterval)
          timerInterval = null
        }
      }

      const cleanupAudioContext = () => {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId)
          animationFrameId = null
        }
        if (audioContext) {
          if (audioContext.state !== 'closed') {
            audioContext.close().catch(err => console.error('[atoll-chat-voice-recorder] Error closing audio context:', err))
          }
          audioContext = null
        }
        recordedAmplitudes = []
      }

      const teardown = () => {
        stopTimer()
        cleanupAudioContext()

        if (mediaRecorder) {
          mediaRecorder.onstop = null
          mediaRecorder.ondataavailable = null
          if (mediaRecorder.state !== 'inactive') {
            try {
              mediaRecorder.stop()
            } catch (err) {
              console.error('[atoll-chat-voice-recorder] Error stopping media recorder:', err)
            }
          }
          mediaRecorder = null
        }

        if (activeStream) {
          try {
            activeStream.getTracks().forEach(track => track.stop())
          } catch (err) {
            console.error('[atoll-chat-voice-recorder] Error stopping stream tracks:', err)
          }
          activeStream = null
        }
      }

      signal.addEventListener('abort', teardown)

      const generateWaveformImage = () => {
        if (recordedAmplitudes.length === 0) {
          return null
        }

        // Generate as inline SVG for robust dynamic styling!
        const height = 40
        const width = recordedAmplitudes.length * (barWidth + gap)
        let paths = ''
        recordedAmplitudes.forEach((amp, i) => {
          const barHeight = Math.max(2, amp * height)
          const x = i * (barWidth + gap)
          const y = (height - barHeight) / 2
          paths += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="1"/>`
        })

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" preserveAspectRatio="none" style="fill: var(--atoll-chat-waveform-active, var(--bs-primary));">${paths}</svg>`
      }

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
          activeStream = stream
  
          // Audio Visualizer Setup
          audioContext = new (window.AudioContext || window.webkitAudioContext)()
          await audioContext.resume()
  
          analyser = audioContext.createAnalyser()
          const source = audioContext.createMediaStreamSource(stream)
          source.connect(analyser)
          analyser.fftSize = 256
          const bufferLength = analyser.frequencyBinCount
          dataArray = new Uint8Array(bufferLength)
          recordedAmplitudes = []

          let canvasEl = null
          let ctx2d = null
          let activeColor = '#007bff'
          let inactiveColor = 'rgba(0, 123, 255, 0.15)'
          let lastDpr = 1
          let lastClientWidth = 0
          let lastClientHeight = 0

          const updateColorsAndDPI = () => {
            if (!canvasEl) return
            const dpr = window.devicePixelRatio || 1
            const clientWidth = canvasEl.clientWidth || 400
            const clientHeight = canvasEl.clientHeight || 32

            // Check if resize or DPI change or initialization is needed
            if (clientWidth !== lastClientWidth || clientHeight !== lastClientHeight || dpr !== lastDpr || canvasEl.width === 400) {
              canvasEl.width = clientWidth * dpr
              canvasEl.height = clientHeight * dpr
              ctx2d.setTransform(1, 0, 0, 1, 0, 0)
              ctx2d.scale(dpr, dpr)
              lastClientWidth = clientWidth
              lastClientHeight = clientHeight
              lastDpr = dpr

              // Only read computed styles on resize/init to avoid layout thrashing at 60 FPS
              activeColor = window.getComputedStyle(canvasEl).getPropertyValue('--atoll-chat-waveform-active').trim() || '#007bff'
              inactiveColor = window.getComputedStyle(canvasEl).getPropertyValue('--atoll-chat-waveform-inactive').trim() || 'rgba(0, 123, 255, 0.15)'
            }
          }

          const draw = (timestamp) => {
            if (!canvasEl) {
              canvasEl = refs('visualizerCanvas')
              if (canvasEl) {
                ctx2d = canvasEl.getContext('2d')
              }
            }

            if (state.isPaused) {
              animationFrameId = null
              return
            }

            animationFrameId = requestAnimationFrame(draw)

            const now = timestamp || performance.now()
            if (now - lastSampleTime >= SAMPLE_INTERVAL) {
              analyser.getByteFrequencyData(dataArray)
  
              let sum = 0
              for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i]
              }
              const average = sum / bufferLength
              const normalizedAmp = Math.min(1, average / 100)
              recordedAmplitudes.push(normalizedAmp)
              lastSampleTime = now
            }

            if (!canvasEl || !ctx2d) {
              return
            }
  
            updateColorsAndDPI()

            const w = lastClientWidth
            const h = lastClientHeight
  
            ctx2d.clearRect(0, 0, w, h)

            // Draw faint baseline
            ctx2d.fillStyle = inactiveColor
            ctx2d.fillRect(0, (h/2) - 1, w, 2)

            ctx2d.fillStyle = activeColor
            const maxVisibleBars = Math.floor(w / (barWidth + gap))
            const startIdx = Math.max(0, recordedAmplitudes.length - maxVisibleBars)
  
            for (let i = startIdx; i < recordedAmplitudes.length; i++) {
              const amp = recordedAmplitudes[i]
              const barHeight = Math.max(2, amp * h)
              const x = (i - startIdx) * (barWidth + gap)
              const y = (h - barHeight) / 2
              ctx2d.fillRect(x, y, barWidth, barHeight)
            }
          }

          drawFn = draw

          const options = {
            audioBitsPerSecond: 32000
          }

          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            options.mimeType = 'audio/webm;codecs=opus'
          } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
            options.mimeType = 'audio/ogg;codecs=opus'
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            options.mimeType = 'audio/mp4'
          }

          mediaRecorder = new MediaRecorder(stream, options)
          audioChunks = []

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              audioChunks.push(e.data)
            }
          }

          mediaRecorder.onstop = () => {
            if (activeStream) {
              const tracks = activeStream.getTracks()
              tracks.forEach(track => track.stop())
              activeStream = null
            }
  
            if (shouldSendVoice && audioChunks.length > 0) {
              let extension = 'bin'
              if (mediaRecorder.mimeType.includes('webm')) {
                extension = 'webm'
              } else if (mediaRecorder.mimeType.includes('ogg')) {
                extension = 'ogg'
              } else if (mediaRecorder.mimeType.includes('mp4')) {
                extension = 'm4a'
              }
  
              const filename = `voice-note-${Date.now()}.${extension}`
              const file = new File(audioChunks, filename, { type: mediaRecorder.mimeType })
              const waveformData = generateWaveformImage()
              $bus.emit('ui:voice_ready', {
                blob: file,
                waveformData,
                duration: state.recordingDuration
              })
            } else {
              cleanupAudioContext()
            }
            shouldSendVoice = false
            stopTimer()
          }

          mediaRecorder.start()
          lastSampleTime = 0
          requestAnimationFrame(draw)
          shouldSendVoice = false
          state.isPaused = false
          state.recordingDuration = 0
          startTimer()
        } catch (err) {
          console.error('[atoll-chat-voice-recorder] Failed to start recording:', err)
          $bus.emit('ui:show_toast', { message: 'Microphone access denied or unavailable.', type: 'danger' })
          $bus.emit('ui:voice_discarded')
        }
      }

      // Initial start
      startRecording()

      refs('discardButton').addEventListener('click', () => {
        shouldSendVoice = false
        teardown()
        $bus.emit('ui:voice_discarded')
      }, { signal })

      refs('pauseResumeButton').addEventListener('click', () => {
        if (!mediaRecorder) {
          return
        }
        if (state.isPaused) {
          mediaRecorder.resume()
          state.isPaused = false
          // Restart draw loop
          if (!animationFrameId && drawFn) {
            requestAnimationFrame(drawFn)
          }
        } else {
          mediaRecorder.pause()
          state.isPaused = true
        }
      }, { signal })

      refs('resumeMicButton').addEventListener('click', () => {
        if (mediaRecorder && state.isPaused) {
          mediaRecorder.resume()
          state.isPaused = false
          // Restart draw loop
          if (!animationFrameId && drawFn) {
            requestAnimationFrame(drawFn)
          }
        }
      }, { signal })

      refs('redoButton').addEventListener('click', () => {
        shouldSendVoice = false
        teardown()
        startRecording()
      }, { signal })

      refs('sendVoiceButton').addEventListener('click', () => {
        if (!mediaRecorder) {
          return
        }
        shouldSendVoice = true
        mediaRecorder.stop()
      }, { signal })
    }
  })
</script>
