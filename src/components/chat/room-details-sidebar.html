<template id="room-details-sidebar">
  <div class="room-details-container d-flex flex-column h-100 bg-body" style="display: flex !important; flex-direction: column !important; height: 100% !important; min-height: 0 !important; overflow: hidden !important;">
    <!-- Header -->
    <div class="offcanvas-header border-bottom py-3 px-4 d-flex justify-content-between align-items-center bg-body">
      <h5 class="offcanvas-title fw-bold d-flex align-items-center gap-2" id="roomDetailsOffcanvasLabel">
        <atoll-icon name="settings" size="20"></atoll-icon>
        Room Settings
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" ref="btnClose" data-testid="sidebar-close-btn"></button>
    </div>

    <!-- Scrollable Body Content -->
    <div class="offcanvas-body p-0 d-flex flex-column bg-body-secondary" style="background-color: var(--atoll-bg-surface-secondary, #F5F5F5) !important; flex: 1 !important; min-height: 0 !important; overflow: hidden !important;">
      <div class="flex-grow-1 overflow-y-auto" style="flex: 1 !important; min-height: 0 !important; overflow-y: auto !important;">
        
        <!-- Hero Header Section -->
        <div class="hero-header text-center py-4 px-3 bg-body border-bottom mb-3">
          <div class="mb-3 d-flex justify-content-center">
            <atoll-profile ref="roomAvatar" size="3xl"></atoll-profile>
          </div>
          <h4 class="fw-bold mb-2 text-primary-emphasis" ref="roomNameText">{{ roomName }}</h4>
          <div class="d-flex justify-content-center">
            <atoll-chip size="sm" variant="outline" class="e2e-badge">
              <span slot="leading"><atoll-icon name="lock" size="14"></atoll-icon></span>
              End-to-End Encrypted
            </atoll-chip>
          </div>
        </div>

        <!-- Accordion Settings groups -->
        <atoll-accordion multiple="true" class="room-settings-groups d-flex flex-column px-3 pb-3" id="roomSettingsAccordion">
          
          <!-- Group 1: Chat Customisation -->
          <atoll-accordion-item 
            title="Customise chat" 
            icon="palette"
            expanded="false" 
            data-testid="accordion-customise-btn" 
            body-testid="collapse-customise"
            ref="headerCustomise"
            class="room-settings-card overflow-hidden"
          >
            <atoll-list>
              <atoll-list-item ref="btnChangeTheme" clickable="true" chevron="true" title="Change theme" description="Personalise your chat colors and background" data-testid="btnChangeTheme">
                <span slot="leading">
                  <atoll-profile size="xs" palette="theme">
                    <atoll-icon slot="image" name="palette" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
              </atoll-list-item>
              <atoll-list-item ref="btnEditNicknames" clickable="true" chevron="true" title="Edit nicknames" description="Set custom aliases for room participants" data-testid="btnEditNicknames">
                <span slot="leading">
                  <atoll-profile size="xs" palette="nicknames">
                    <atoll-icon slot="image" name="Aa" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
              </atoll-list-item>
              <atoll-list-item ref="btnEditRoom" clickable="true" chevron="true" title="Edit room" description="Modify the room's name, avatar, and settings" data-testid="btnEditRoom" hidden="{{ hideEditRoom }}">
                <span slot="leading">
                  <atoll-profile size="xs" palette="room">
                    <atoll-icon slot="image" name="edit" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
              </atoll-list-item>
            </atoll-list>
          </atoll-accordion-item>

          <!-- Group 2: Privacy & Support -->
          <atoll-accordion-item 
            title="Privacy & support" 
            icon="bell"
            expanded="false" 
            data-testid="accordion-privacy-btn" 
            body-testid="collapse-privacy"
            ref="headerPrivacy"
            class="room-settings-card overflow-hidden"
          >
            <atoll-list>
              <atoll-list-item ref="btnMuteNotifications" clickable="true" title="Mute notifications" description="Silence alerts for incoming messages in this room" data-testid="btnMuteNotifications">
                <span slot="leading">
                  <atoll-profile size="xs" palette="mute">
                    <atoll-icon slot="image" name="bell" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
                <div slot="right" class="d-flex align-items-center gap-2">
                  <span class="d-none" ref="muteStatusBadge">Off</span>
                  <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" role="switch" ref="muteStatusSwitch" data-testid="mute-switch" style="pointer-events: none;">
                  </div>
                </div>
              </atoll-list-item>
              <atoll-list-item ref="btnReadReceipts" clickable="true" title="Read receipts" description="Allow others to see when you have read their messages" data-testid="btnReadReceipts">
                <span slot="leading">
                  <atoll-profile size="xs" palette="receipts">
                    <atoll-icon slot="image" name="eye" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
                <div slot="right" class="d-flex align-items-center gap-2">
                  <span class="d-none" ref="readReceiptsStatusText">On</span>
                  <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" role="switch" ref="readReceiptsSwitch" data-testid="read-receipts-switch" style="pointer-events: none;">
                  </div>
                </div>
              </atoll-list-item>
              <atoll-list-item ref="btnBlock" clickable="true" title="Block" description="Prevent this participant from contacting you" class="text-danger" data-testid="btnBlock">
                <span slot="leading">
                  <atoll-profile size="xs" palette="block">
                    <atoll-icon slot="image" name="block" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
              </atoll-list-item>
              <atoll-list-item ref="btnDelete" clickable="true" title="{{ deleteLabel }}" description="Remove this conversation from your inbox" class="text-danger" data-testid="btnDelete">
                <span slot="leading">
                  <atoll-profile size="xs" palette="delete">
                    <atoll-icon slot="image" name="trash" size="16" color="#FFFFFF"></atoll-icon>
                  </atoll-profile>
                </span>
              </atoll-list-item>
            </atoll-list>
          </atoll-accordion-item>

          <!-- Group 3: Members -->
          <atoll-accordion-item 
            title="Members" 
            icon="user"
            badge="{{ memberCount }}"
            expanded="false" 
            data-testid="accordion-members-btn" 
            body-testid="collapse-members"
            ref="headerMembers"
            class="room-settings-card overflow-hidden"
          >
            <div class="member-list list-group list-group-flush py-2" ref="memberList" data-testid="memberListContainer">
              <!-- Members rendered dynamically -->
            </div>
          </atoll-accordion-item>

        </atoll-accordion>

      </div>
    </div>

    <!-- Loading Overlay -->
    <div class="position-absolute top-0 start-0 w-100 h-100 bg-body bg-opacity-75 {{ loadingClass }} align-items-center justify-content-center" style="z-index: 1060;" ref="loadingOverlay">
      <div class="text-center">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="small fw-bold">{{ loadingMessage }}</div>
      </div>
    </div>

    <!-- Standalone Modal Components -->
    <atoll-theme-selector-modal ref="themeSelectorModal"></atoll-theme-selector-modal>
    <atoll-nicknames-modal ref="nicknamesModal"></atoll-nicknames-modal>
    <atoll-block-modal ref="blockModal"></atoll-block-modal>
  </div>
</template>

<style>
  :host {
    display: block !important;
    height: 100% !important;
    min-height: 0 !important;
  }

  .room-details-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .room-details-container .offcanvas-body {
    flex: 1;
    min-height: 0;
  }

  #roomDetailsOffcanvas,
  div[ref="roomDetailsOffcanvas"] {
    display: flex !important;
    flex-direction: column !important;
  }

  #roomDetailsOffcanvas.showing,
  #roomDetailsOffcanvas.show,
  #roomDetailsOffcanvas.hiding,
  div[ref="roomDetailsOffcanvas"].showing,
  div[ref="roomDetailsOffcanvas"].show,
  div[ref="roomDetailsOffcanvas"].hiding {
    display: flex !important;
    flex-direction: column !important;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      members: [],
      isAdmin: false,
      isSaving: false,
      isLoading: false,
      loadingMessage: 'Loading...',
      roomName: 'Unnamed Chat',
      roomTheme: 'classic',
      readReceipts: true,
      nicknames: {},
      isGroup: false
    }),
    getters: {
      memberCount: (state) => (state.members || []).length,
      loadingClass: (state) => (state.isLoading ? 'd-flex' : 'd-none'),
      hideEditRoom: (state) => !state.isAdmin,
      deleteLabel: (state) => (state.isGroup ? 'Leave group' : 'Delete chat')
    },
    client: async ({ refs, state, pocketbase, eventBus, globalStore, storage, cryptoWorker, utils, signal }) => {
      const { resolveRoomName } = await import('../../utils/room-name.js')
      const { getParsedAvatar } = await import('../../utils/room-avatar.js')
      const { pb } = pocketbase
      const { $crypto } = utils
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $storage } = storage
      const memberListContainer = refs('memberList')

      const showLoading = (text) => {
        state.loadingMessage = text || 'Loading...'
        state.isLoading = true
      }

      const hideLoading = () => {
        state.isLoading = false
      }

      const fetchRoomAndSettings = async () => {
        const room_id = $state.activeSelectionId
        if (!room_id) {
          return
        }

        showLoading('Fetching details...')
        try {
          // Fetch room
          const room = await $storage.getRoom(room_id)
          let participants = []
          if (room) {
            state.roomTheme = room.theme || 'classic'
            state.isGroup = room.is_group === true || room.is_group === 'true'

            // Parse room name avatar
            participants = (room.participants || []).filter(p => p.id !== $state.currentUser?.id)
            state.roomName = resolveRoomName(room, {
              currentUser: $state.currentUser,
              nicknames: room.nicknames
            })

            // Sync room avatar
            const roomAvatarComp = refs('roomAvatar')
            if (roomAvatarComp) {
              const existingSlots = roomAvatarComp.querySelectorAll('[slot="image"]')
              existingSlots.forEach(el => el.remove())

              if (room.avatar) {
                const avatarData = getParsedAvatar(room)
                if (avatarData) {
                  roomAvatarComp.setAttribute('type', 'single')
                  roomAvatarComp.setAttribute('size', '3xl')
                  roomAvatarComp.setAttribute('name', state.roomName)
                  roomAvatarComp.setAttribute('alt', state.roomName)
                  roomAvatarComp.removeAttribute('user-id')
                  roomAvatarComp.removeAttribute('src')

                  const $media = utils.$media
                  if ($media && typeof $media.decrypt === 'function' && (avatarData.media_id || avatarData.id)) {
                    $media.decrypt(avatarData, signal).then((url) => {
                      roomAvatarComp.setAttribute('src', url)
                    }).catch(err => {
                      console.error('[sidebar] Failed to decrypt room avatar:', err)
                      roomAvatarComp.removeAttribute('src')
                    })
                  }
                } else {
                  roomAvatarComp.removeAttribute('src')
                  roomAvatarComp.removeAttribute('user-id')
                }
              } else if (!room.is_group && participants.length > 0) {
                const other = participants[0]
                const displayName = state.roomName || other.name || other.username
                roomAvatarComp.setAttribute('type', 'single')
                roomAvatarComp.setAttribute('size', '3xl')
                roomAvatarComp.setAttribute('name', displayName)
                roomAvatarComp.setAttribute('alt', displayName)

                if (other.id) {
                  roomAvatarComp.setAttribute('user-id', other.id)
                } else {
                  roomAvatarComp.removeAttribute('user-id')
                }
  
                if (other.avatar && pb?.files) {
                  const getUrlFn = pb.files.getUrl || pb.files.getURL
                  if (typeof getUrlFn === 'function') {
                    roomAvatarComp.setAttribute('src', getUrlFn.call(pb.files, other, other.avatar, { thumb: '100x100' }))
                  } else {
                    roomAvatarComp.removeAttribute('src')
                  }
                } else {
                  roomAvatarComp.removeAttribute('src')
                }
              } else if (room.is_group) {
                roomAvatarComp.removeAttribute('user-id')
                roomAvatarComp.removeAttribute('src')
                roomAvatarComp.setAttribute('type', 'multiparty')
                roomAvatarComp.setAttribute('size', '3xl')
                const splitCount = Math.min(Math.max(participants.length, 2), 4)
                roomAvatarComp.setAttribute('split-count', splitCount)

                const slotDiv = document.createElement('div')
                slotDiv.setAttribute('slot', 'image')
                const displayCount = Math.min(participants.length, splitCount)
                for (let i = 0; i < displayCount; i++) {
                  const p = participants[i]
                  if (p) {
                    const img = document.createElement('img')
                    img.alt = p.name || p.username || 'Member'
                    if (p.avatar && pb?.files) {
                      img.src = pb.files.getURL(p, p.avatar, { thumb: '50x50' })
                    }
                    slotDiv.appendChild(img)
                  }
                }
                roomAvatarComp.appendChild(slotDiv)
              } else {
                roomAvatarComp.removeAttribute('user-id')
                roomAvatarComp.removeAttribute('src')
                roomAvatarComp.setAttribute('type', 'single')
                roomAvatarComp.setAttribute('size', '3xl')
                roomAvatarComp.setAttribute('name', state.roomName)
                roomAvatarComp.setAttribute('alt', state.roomName)
              }
            }
          }

          // Fetch members from server
          const members = await pb.collection('room_members').getFullList({
            filter: pb.filter('room_id = {:room_id}', { room_id }),
            expand: 'user_id'
          })

          state.members = members
          const currentUser = $state.currentUser
          const currentMember = members.find(m => m.user_id === currentUser.id)
          state.isAdmin = currentMember && currentMember.role === 'admin'

          // Fetch private room_settings
          let settingsRecord = null
          try {
            settingsRecord = await pb.collection('room_settings').getFirstListItem(
              pb.filter('room_id = {:room_id} && user_id = {:user_id}', {
                room_id,
                user_id: currentUser.id
              }),
              { requestKey: null }
            )
          } catch (_e) {
            // Lazy creation on-demand
          }

          // Setup Mute status badge
          const isMuted = settingsRecord && settingsRecord.is_muted === true
          const muteStatusBadge = refs('muteStatusBadge')
          muteStatusBadge.textContent = isMuted ? 'On' : 'Off'
          if (isMuted) {
            muteStatusBadge.style.backgroundColor = 'var(--atoll-danger-subtle, #FFE5E8)'
            muteStatusBadge.style.color = 'var(--atoll-danger, #FF334B)'
          } else {
            muteStatusBadge.style.backgroundColor = 'var(--atoll-brand-subtle-bg, #E6F9EE)'
            muteStatusBadge.style.color = 'var(--atoll-brand-primary, #06C755)'
          }
          const muteStatusSwitch = refs('muteStatusSwitch')
          muteStatusSwitch.checked = isMuted

          // Setup read receipts default
          state.readReceipts = true
          state.nicknames = {}

          // Decrypt settings from room_settings
          if (settingsRecord && settingsRecord.settings && settingsRecord.settings.ciphertext) {
            const roomKeyB64 = room?.key_history?.find(h => h.epoch_id === 1)?.key
            if (roomKeyB64) {
              try {
                const decryptedBytes = await $worker.execute('worker:crypto_secretbox_open_easy', {
                  ciphertext: settingsRecord.settings.ciphertext,
                  nonce: settingsRecord.settings.nonce,
                  key: roomKeyB64
                })
                if (decryptedBytes) {
                  const decodedStr = new TextDecoder().decode(decryptedBytes)
                  const settingsObj = JSON.parse(decodedStr)
                  state.nicknames = settingsObj.nicknames || {}
                  state.readReceipts = settingsObj.read_receipts !== false

                  // Update room name with decrypted nickname immediately
                  if (!state.isGroup && participants.length > 0) {
                    const other = participants[0]
                    state.roomName = state.nicknames[other.id] || other.name || other.username
                  }
                }
              } catch (e) {
                console.error('[sidebar] Failed to decrypt member settings:', e)
              }
            }
          }

          // Sync read receipts status text and switch
          const rrStatus = refs('readReceiptsStatusText')
          rrStatus.textContent = state.readReceipts ? 'On' : 'Off'
          const readReceiptsSwitch = refs('readReceiptsSwitch')
          readReceiptsSwitch.checked = state.readReceipts

          renderMembers()
        } catch (err) {
          console.error('[sidebar] Failed to fetch data:', err)
        } finally {
          hideLoading()
        }
      }

      const renderMembers = () => {
        memberListContainer.innerHTML = ''

        state.members.forEach(member => {
          const user = member.expand?.user_id
          if (!user) {
            return
          }
          const isCurrentUser = user.id === $state.currentUser.id

          const item = document.createElement('div')
          item.className = 'member-item d-flex align-items-center justify-content-between px-4 py-2 border-bottom'

          const info = document.createElement('div')
          info.className = 'd-flex align-items-center'

          const avatar = document.createElement('atoll-profile')
          avatar.setAttribute('size', 'xs')
          avatar.setAttribute('alt', user.name || user.username || 'Member')
          avatar.className = 'me-3 flex-shrink-0'
          if (user.id) {
            avatar.setAttribute('user-id', user.id)
          }
          if (user.avatar) {
            avatar.setAttribute('src', pb.files.getURL(user, user.avatar, { thumb: '32x32' }))
          }

          const nameWrapper = document.createElement('div')
          const name = document.createElement('div')
          name.className = 'fw-bold fs-7'

          // Use nickname if set
          const activeNick = state.nicknames[user.id] || ''
          name.textContent = (activeNick || user.name || user.username) + (isCurrentUser ? ' (You)' : '')

          const role = document.createElement('span')
          role.className = 'badge bg-light text-dark border ms-2 small fs-8'
          role.textContent = member.role === 'admin' ? 'Admin' : 'Member'

          name.appendChild(role)
          nameWrapper.appendChild(name)
          info.appendChild(avatar)
          info.appendChild(nameWrapper)
          item.appendChild(info)

          // Show Remove button if current user is admin and the member is not themselves
          if (state.isAdmin && !isCurrentUser) {
            const removeBtn = document.createElement('button')
            removeBtn.type = 'button'
            removeBtn.className = 'btn btn-sm btn-outline-danger border-0 d-flex align-items-center justify-content-center'
            removeBtn.style.width = '32px'
            removeBtn.style.height = '32px'
            removeBtn.style.borderRadius = '50%'
            removeBtn.title = 'Remove member'
            removeBtn.innerHTML = '<atoll-icon name="block" size="20" color="var(--atoll-danger, #FF334B)"></atoll-icon>'
            removeBtn.title = 'Remove member'
            removeBtn.onclick = () => handleKickUser(member)
            item.appendChild(removeBtn)
          }

          memberListContainer.appendChild(item)
        })
      }

      const handleKickUser = async (member) => {
        const user = member.expand?.user_id
        if (!user) {
          return
        }
        const userName = user.name || user.username
        if (!confirm(`Are you sure you want to remove ${userName} from the room? This will rotate all cryptographic keys.`)) {
          return
        }

        $bus.emit('ui:trigger_kick_user', {
          kickedMemberId: member.id,
          kickedUserId: user.id,
          kickedUsername: userName,
          room_id: $state.activeSelectionId
        })
      }

      // Initial load and event subscriptions
      fetchRoomAndSettings()

      $state.subscribe('activeSelectionId', () => {
        fetchRoomAndSettings()
      })

      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          fetchRoomAndSettings()
        }
      })

      $bus.on('room:nicknames_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          fetchRoomAndSettings()
        }
      })

      // Group 1: Chat Customisation Actions (Trigger local modals)
      const btnChangeTheme = refs('btnChangeTheme')
      btnChangeTheme.addEventListener('click', () => {
        const modal = refs('themeSelectorModal')
        if (modal && typeof modal.show === 'function') {
          modal.show()
        }
      })

      const btnEditNicknames = refs('btnEditNicknames')
      btnEditNicknames.addEventListener('click', () => {
        const modal = refs('nicknamesModal')
        if (modal && typeof modal.show === 'function') {
          modal.show()
        }
      })

      // Group 2: Privacy & Support Actions
      const btnMuteNotifications = refs('btnMuteNotifications')
      btnMuteNotifications.addEventListener('click', () => {
        const room_id = $state.activeSelectionId
        const muteStatusSwitch = refs('muteStatusSwitch')
        const isMuted = muteStatusSwitch ? muteStatusSwitch.checked : false
  
        // Toggle locally immediately for rapid visual feedback
        if (muteStatusSwitch) {
          muteStatusSwitch.checked = !isMuted
        }
        const muteStatusBadge = refs('muteStatusBadge')
        if (muteStatusBadge) {
          muteStatusBadge.textContent = !isMuted ? 'On' : 'Off'
        }

        $bus.emit('room:toggle_mute', {
          room_id,
          isMuted
        })
      })

      const btnReadReceipts = refs('btnReadReceipts')
      btnReadReceipts.addEventListener('click', async () => {
        state.readReceipts = !state.readReceipts

        // Update switch and text immediately for rapid feedback
        const readReceiptsSwitch = refs('readReceiptsSwitch')
        if (readReceiptsSwitch) {
          readReceiptsSwitch.checked = state.readReceipts
        }
        const rrStatus = refs('readReceiptsStatusText')
        if (rrStatus) {
          rrStatus.textContent = state.readReceipts ? 'On' : 'Off'
        }

        showLoading('Saving read receipts...')
        try {
          const room_id = $state.activeSelectionId
          const room = await $storage.getRoom(room_id)
          const roomKeyB64 = room?.key_history?.find(h => h.epoch_id === 1)?.key
          if (!roomKeyB64) {
            throw new Error('Room secret key not found locally')
          }

          let theme = room?.theme || 'classic'
          let custom_theme = room?.custom_theme || null

          let settingsRecord = null
          try {
            settingsRecord = await pb.collection('room_settings').getFirstListItem(
              `room_id="${room_id}" && user_id="${$state.currentUser.id}"`, { requestKey: null }
            )
          } catch (_e) {
          }

          if (settingsRecord?.settings?.ciphertext) {
            try {
              const decryptedBytes = await $worker.execute('worker:crypto_secretbox_open_easy', {
                ciphertext: settingsRecord.settings.ciphertext,
                nonce: settingsRecord.settings.nonce,
                key: roomKeyB64
              })
              if (decryptedBytes) {
                const settingsObj = JSON.parse(new TextDecoder().decode(decryptedBytes))
                if (settingsObj.theme !== undefined) {
                  theme = settingsObj.theme || 'classic'
                }
                if (settingsObj.custom_theme !== undefined) {
                  custom_theme = settingsObj.custom_theme || null
                }
              }
            } catch (decErr) {
              console.warn('[sidebar] Preserving theme settings read failed:', decErr)
            }
          }

          const payloadStr = JSON.stringify({
            nicknames: state.nicknames,
            read_receipts: state.readReceipts,
            theme,
            custom_theme
          })

          const nonceBytes = await $worker.execute('worker:randombytes_buf', { length: 24 })
          const encryptedBytes = await $worker.execute('worker:crypto_secretbox_easy', {
            message: payloadStr,
            nonce: nonceBytes.slice(),
            key: roomKeyB64
          })

          const encryptedPayload = {
            ciphertext: $crypto.toBase64(encryptedBytes),
            nonce: $crypto.toBase64(nonceBytes)
          }

          if (settingsRecord) {
            await pb.collection('room_settings').update(settingsRecord.id, {
              settings: encryptedPayload
            })
          } else {
            await pb.collection('room_settings').create({
              room_id,
              user_id: $state.currentUser.id,
              is_muted: false,
              settings: encryptedPayload
            })
          }

          room.read_receipts = state.readReceipts
          await $storage.saveRoom(room)

          $bus.emit('room:member_updated', { room_id })
          $bus.emit('ui:show_toast', {
            message: state.readReceipts ? 'Read receipts enabled' : 'Read receipts disabled',
            type: 'success'
          })
        } catch (e) {
          console.error('[sidebar] Failed to save read receipts:', e)
        } finally {
          hideLoading()
        }
      })

      const btnBlock = refs('btnBlock')
      btnBlock.addEventListener('click', () => {
        const modal = refs('blockModal')
        if (modal && typeof modal.show === 'function') {
          modal.show()
        }
      })

      const btnEditRoom = refs('btnEditRoom')
      btnEditRoom.addEventListener('click', () => {
        const room_id = $state.activeSelectionId
        $bus.emit('room:edit', { room_id })
      })

      const btnDelete = refs('btnDelete')
      btnDelete.addEventListener('click', () => {
        const room_id = $state.activeSelectionId
        $bus.emit('room:delete', {
          room_id,
          isGroup: state.isGroup
        })
      })
    }
  })
</script>
