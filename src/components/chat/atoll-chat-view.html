<template id="atoll-chat-view">
  <div class="atoll-chat-view d-flex flex-column h-100" ref="chatViewRoot" data-testid="atoll-chat-view-container">
    <!-- Chat Header -->
    <header class="app-header atoll-chat-view-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <atoll-button variant="ghost" leading-icon="chevron-left" icon-only="true" pill="true" ref="btnBack" class="d-inline-block d-md-none me-3" data-testid="chatBackBtn" title="Back to chats" aria-label="Back to chats"></atoll-button>
        <atoll-profile ref="headerAvatar" size="sm" class="d-inline-block me-3" alt="{{ roomName }}"></atoll-profile>
        <div>
          <h6 class="atoll-text-title-2 mb-0">{{ roomName }}</h6>
          <small class="atoll-chat-view-header-subtitle mb-0" aria-live="polite" aria-atomic="true">{{ roomStatus }}</small>
        </div>
      </div>
      <div class="d-flex gap-2">
        <atoll-button 
          ref="btnAudioCall" 
          icon-only="true" 
          variant="secondary" 
          size="md" 
          pill="true" 
          title="Audio Call" 
          aria-label="Audio Call" 
          data-testid="btnAudioCall"
        >
          <atoll-icon name="phone" size="24"></atoll-icon>
        </atoll-button>
        <atoll-button 
          ref="btnVideoCall" 
          icon-only="true" 
          variant="secondary" 
          size="md" 
          pill="true" 
          title="Video Call" 
          aria-label="Video Call" 
          data-testid="btnVideoCall"
        >
          <atoll-icon name="videocam" size="24"></atoll-icon>
        </atoll-button>
        <atoll-button 
          ref="btnDetails"
          icon-only="true"
          variant="secondary" 
          size="md" 
          pill="true"
          title="Room Settings"
          aria-label="Room Settings"
          data-testid="btnRoomSettings"
        >
          <atoll-icon name="settings" size="24"></atoll-icon>
        </atoll-button>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-grow-1 position-relative overflow-hidden">
      <!-- Message Timeline -->
      <atoll-chat-timeline></atoll-chat-timeline>
    </div>

    <!-- Room Details Sidebar (Bootstrap Offcanvas drawer) -->
    <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" ref="roomDetailsOffcanvas" id="roomDetailsOffcanvas" aria-labelledby="roomDetailsOffcanvasLabel" data-testid="roomDetailsOffcanvas">
      <room-details-sidebar></room-details-sidebar>
    </div>

    <!-- Chat Input -->
    <atoll-chat-input></atoll-chat-input>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      roomName: 'Loading...',
      roomStatus: 'Encrypted',
      isRoomDetailsOpen: false,
      roomTheme: 'classic',
      nicknames: {}
    }),
    getters: {
    },
    client: async ({ refs, state, globalStore, storage, pocketbase, utils, signal, eventBus, webrtc: webrtcPluginContext, bootstrap }) => {
      const { hexToRgb, getRelativeLuminance, updateNativeStatusBar } = await import('../../utils/color-contrast.js')
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { $webrtc } = webrtcPluginContext
      const { pb } = pocketbase || {}
      const headerAvatar = refs('headerAvatar')

      const { Offcanvas } = bootstrap
      const offcanvasEl = refs('roomDetailsOffcanvas')
      let bsOffcanvas = new Offcanvas(offcanvasEl)

      signal.addEventListener('abort', () => {
        try {
          bsOffcanvas?.dispose?.()
        } catch (e) {
          console.error('Failed to dispose offcanvas', e)
        }
      }, { once: true })

      // Swipe to close right offcanvas (swipe right)
      let rTouchStartX = 0
      let rTouchStartY = 0
      let rTouchEndX = 0
      let rTouchEndY = 0

      offcanvasEl.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          rTouchStartX = e.touches[0].clientX
          rTouchStartY = e.touches[0].clientY
          rTouchEndX = rTouchStartX
          rTouchEndY = rTouchStartY
        }
      }, {
        passive: true,
        signal
      })

      offcanvasEl.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          rTouchEndX = e.touches[0].clientX
          rTouchEndY = e.touches[0].clientY
        }
      }, {
        passive: true,
        signal
      })

      offcanvasEl.addEventListener('touchend', () => {
        const deltaX = rTouchEndX - rTouchStartX
        const deltaY = rTouchEndY - rTouchStartY
        // Swipe right (positive deltaX) of at least 50px with dominant horizontal gesture
        if (deltaX >= 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
          bsOffcanvas.hide()
        }
      }, {
        passive: true,
        signal
      })

      offcanvasEl.addEventListener('hide.bs.offcanvas', () => {
        state.isRoomDetailsOpen = false
        $state.isRoomDetailsOpen = false
      }, { signal })

      offcanvasEl.addEventListener('show.bs.offcanvas', () => {
        state.isRoomDetailsOpen = true
        $state.isRoomDetailsOpen = true
      }, { signal })

      state.isRoomDetailsOpen = $state.isRoomDetailsOpen || false
      if (state.isRoomDetailsOpen && bsOffcanvas) {
        bsOffcanvas.show()
      }

      /**
       * Renders the room header avatar, including decryption of single avatar and generation of multiparty avatars.
       * @param {Object} room - The active room object.
       * @param {Array<Object>} participants - List of participants in the room.
       * @returns {void}
       */
      const renderHeaderAvatar = (room, participants) => {
        if (!headerAvatar || !room) {
          return
        }
        const existingSlot = headerAvatar.querySelector('[slot="image"]')
        if (existingSlot) {
          existingSlot.remove()
        }

        if (room.avatar) {
          try {
            const avatarData = typeof room.avatar === 'string' ? JSON.parse(room.avatar) : room.avatar
            headerAvatar.setAttribute('type', 'single')
            headerAvatar.setAttribute('size', 'sm')
            headerAvatar.setAttribute('name', state.roomName)
            headerAvatar.setAttribute('alt', state.roomName)

            const $media = utils?.$media
            if ($media && typeof $media.decrypt === 'function' && avatarData.media_id) {
              $media.decrypt(avatarData, signal).then((url) => {
                headerAvatar.setAttribute('src', url)
              }).catch(() => {
                headerAvatar.removeAttribute('src')
              })
            }
            return
          } catch {
            // Proceed with fallback single or multiparty rendering on parsing error
          }
        }

        if (!room.is_group && participants.length > 0) {
          const otherUser = participants[0]
          const displayName = state.roomName
          headerAvatar.setAttribute('type', 'single')
          headerAvatar.setAttribute('size', 'sm')
          headerAvatar.setAttribute('name', displayName)
          headerAvatar.setAttribute('alt', displayName)
          if (otherUser.id) {
            headerAvatar.setAttribute('user-id', otherUser.id)
          } else {
            headerAvatar.removeAttribute('user-id')
          }
          if (otherUser.avatar && pb?.files) {
            headerAvatar.setAttribute('src', pb.files.getURL(otherUser, otherUser.avatar, { thumb: '42x42' }))
          } else {
            headerAvatar.removeAttribute('src')
          }
        } else if (room.is_group) {
          headerAvatar.removeAttribute('user-id')
          headerAvatar.setAttribute('type', 'multiparty')
          headerAvatar.setAttribute('size', 'sm')
          const splitCount = Math.min(Math.max(participants.length, 2), 4)
          headerAvatar.setAttribute('split-count', splitCount)
          headerAvatar.removeAttribute('src')

          const slotDiv = document.createElement('div')
          slotDiv.setAttribute('slot', 'image')

          const displayCount = Math.min(participants.length, splitCount)
          for (let i = 0; i < displayCount; i++) {
            const p = participants[i]
            if (p) {
              const pName = p.name || p.username || 'Member'
              const img = document.createElement('img')
              img.alt = pName
              if (p.avatar && pb?.files) {
                img.src = pb.files.getURL(p, p.avatar, { thumb: '30x30' })
              }
              slotDiv.appendChild(img)
            }
          }
          headerAvatar.appendChild(slotDiv)
        } else {
          headerAvatar.setAttribute('type', 'single')
          headerAvatar.setAttribute('size', 'sm')
          headerAvatar.setAttribute('name', state.roomName)
          headerAvatar.setAttribute('alt', state.roomName)
          headerAvatar.removeAttribute('src')
          headerAvatar.removeAttribute('user-id')
        }
      }

      /**
       * Clears all inline CSS custom properties of custom themes on the chatViewRoot.
       * @param {HTMLElement} chatViewRoot
       */
      const clearCustomThemeProperties = (chatViewRoot) => {
        if (!chatViewRoot) {
          return
        }
  
        chatViewRoot.style.removeProperty('--atoll-chat-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-input-container-bg-custom')
        chatViewRoot.style.removeProperty('--atoll-chat-glassy-text-color')
        chatViewRoot.style.removeProperty('--atoll-chat-bubble-sent-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-bubble-sent-color')
        chatViewRoot.style.removeProperty('--atoll-chat-bubble-received-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-bubble-received-color')
        chatViewRoot.style.removeProperty('--atoll-chat-bg-image')
        chatViewRoot.style.removeProperty('--atoll-chat-bg-blur')
        chatViewRoot.style.removeProperty('--atoll-chat-bg-dim')
        chatViewRoot.style.removeProperty('--atoll-chat-sent-status-color')
        chatViewRoot.style.removeProperty('--atoll-chat-sender-name-color')
        chatViewRoot.style.removeProperty('--atoll-chat-timestamp-color')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-attach-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-attach-color')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-voice-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-voice-color')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-send-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-btn-send-color')
        chatViewRoot.style.removeProperty('--atoll-chat-input-emoji-color')
        chatViewRoot.style.removeProperty('--atoll-chat-waveform-active')
        chatViewRoot.style.removeProperty('--atoll-chat-waveform-inactive')
        chatViewRoot.style.removeProperty('--atoll-chat-attachment-card-bg')
        chatViewRoot.style.removeProperty('--atoll-chat-attachment-card-border')
      }

      /**
       * Fetches active room details from storage and updates the component's state, theme, and headers.
       * @param {string} room_id - The active room's identifier.
       * @returns {Promise<void>}
       * @throws {Error} If retrieval or custom theme application fails.
       */
      const updateRoomInfo = async (room_id) => {
        if (!room_id || typeof room_id !== 'string' || $state.activeSelectionType !== 'chats') {
          state.roomName = ''
          state.roomStatus = ''
          clearCustomThemeProperties(refs('chatViewRoot'))
          return
        }
  
        try {
          const room = await $storage.getRoom(room_id)

          // Guard against race conditions after the async operation
          if ($state.activeSelectionId !== room_id || $state.activeSelectionType !== 'chats') {
            return
          }

          if (room) {
            // Load theme & nicknames
            state.roomTheme = room.theme || 'classic'
            state.nicknames = room.nicknames || {}

            const isAppDark =
              document.documentElement.getAttribute('data-atoll-theme') === 'dark' ||
              document.documentElement.getAttribute('data-bs-theme') === 'dark' ||
              document.body.getAttribute('data-atoll-theme') === 'dark' ||
              (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)

            let statusBarColor = isAppDark ? '#1F1F1F' : '#FFFFFF'
            if (room.theme === 'classic-dark') {
              statusBarColor = '#1F1F1F'
            } else if (room.theme === 'ocean') {
              statusBarColor = '#0f2027'
            } else if (room.theme === 'forest') {
              statusBarColor = '#0C3328'
            } else if (room.theme === 'sunset') {
              statusBarColor = '#2C1014'
            } else if (room.theme === 'custom' && room.custom_theme) {
              statusBarColor = room.custom_theme.bgColor || (isAppDark ? '#1F1F1F' : '#FFFFFF')
            }
            updateNativeStatusBar(statusBarColor).catch(() => {
            })

            const participants = (room.participants || []).filter(p => p.id !== $state.currentUser?.id)
            if (!room.is_group && participants.length > 0) {
              const other = participants[0]
              state.roomName = state.nicknames[other.id] || other.name || other.username
            } else {
              state.roomName = room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')
            }
  
            const typingParticipants = participants.filter(p => p.is_typing === true)
            let baseStatus = room.is_group ? 'Group Chat' : 'Private'
            if (typingParticipants.length > 0) {
              if (room.is_group) {
                const names = typingParticipants.map(p => state.nicknames[p.id] || p.name || p.username).join(', ')
                baseStatus = `${names} ${typingParticipants.length === 1 ? 'is' : 'are'} typing...`
              } else {
                baseStatus = 'typing...'
              }
            }

            if ($state.callStatus && $state.callStatus !== 'idle' && $state.activeCallRoomId === room_id) {
              state.roomStatus = $state.callStatus === 'active' ? 'In Call' : 'Calling...'
            } else {
              state.roomStatus = baseStatus
            }

            const chatViewRoot = refs('chatViewRoot')
            if (room.theme) {
              chatViewRoot.setAttribute('data-theme', room.theme)
            } else {
              chatViewRoot.removeAttribute('data-theme')
            }

            // Apply custom theme CSS properties
            if (room.theme === 'custom' && room.custom_theme) {
              const ct = room.custom_theme
              chatViewRoot.style.setProperty('--atoll-chat-bg', ct.bgColor || '#FFFFFF')

              const rgbBg = hexToRgb(ct.bgColor || '#FFFFFF')
              const bgLuminance = getRelativeLuminance(rgbBg[0], rgbBg[1], rgbBg[2])
              const inputContainerBg = bgLuminance < 0.5 ? 'rgba(31, 31, 31, 0.75)' : 'rgba(255, 255, 255, 0.75)'
              chatViewRoot.style.setProperty('--atoll-chat-input-container-bg-custom', inputContainerBg)
              const glassyTextColor = bgLuminance < 0.5 ? '#FFFFFF' : '#111111'
              chatViewRoot.style.setProperty('--atoll-chat-glassy-text-color', glassyTextColor)

              chatViewRoot.style.setProperty('--atoll-chat-bubble-sent-bg', ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-bubble-sent-color', ct.sentColor || '#FFFFFF')
              chatViewRoot.style.setProperty('--atoll-chat-bubble-received-bg', ct.receivedBg || '#EEEEEE')
              chatViewRoot.style.setProperty('--atoll-chat-bubble-received-color', ct.receivedColor || '#111111')
              chatViewRoot.style.setProperty('--atoll-chat-bg-image', ct.useBgImage && ct.bgImage ? `url(${ct.bgImage})` : 'none')
              chatViewRoot.style.setProperty('--atoll-chat-bg-blur', `${ct.bgBlur || 0}px`)
              chatViewRoot.style.setProperty('--atoll-chat-bg-dim', `${(ct.bgDim !== undefined ? ct.bgDim : 30) / 100}`)

              // Set newly expanded custom theme variables on chatViewRoot
              chatViewRoot.style.setProperty('--atoll-chat-sent-status-color', ct.sentStatusColor || ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-sender-name-color', ct.senderNameColor || ct.receivedColor || '#111111')
              chatViewRoot.style.setProperty('--atoll-chat-timestamp-color', ct.timestampColor || ct.receivedColor || '#111111')
              chatViewRoot.style.setProperty('--atoll-chat-btn-attach-bg', ct.btnAttachBg || 'transparent')
              chatViewRoot.style.setProperty('--atoll-chat-btn-attach-color', ct.btnAttachColor || ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-btn-voice-bg', ct.btnVoiceBg || 'transparent')
              chatViewRoot.style.setProperty('--atoll-chat-btn-voice-color', ct.btnVoiceColor || ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-btn-send-bg', ct.btnSendBg || ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-btn-send-color', ct.btnSendColor || '#FFFFFF')
              chatViewRoot.style.setProperty('--atoll-chat-input-emoji-color', ct.inputEmojiColor || ct.receivedColor || '#111111')
              chatViewRoot.style.setProperty('--atoll-chat-waveform-active', ct.waveformActive || ct.sentBg || '#06C755')
              chatViewRoot.style.setProperty('--atoll-chat-waveform-inactive', ct.waveformInactive || (bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.35)' : 'rgba(17, 17, 17, 0.25)'))
              chatViewRoot.style.setProperty('--atoll-chat-attachment-card-bg', ct.attachmentCardBg || ct.receivedBg || '#EEEEEE')
              chatViewRoot.style.setProperty('--atoll-chat-attachment-card-border', ct.attachmentCardBorder || 'rgba(0, 0, 0, 0.08)')
            } else {
              clearCustomThemeProperties(chatViewRoot)
            }

            renderHeaderAvatar(room, participants)
          }
        } catch (err) {
          throw err
        }
      }

      // Initial load
      updateRoomInfo($state.activeSelectionId).catch(() => {
      })

      // Watch for room changes
      $state.subscribe('activeSelectionId', (val) => {
        updateRoomInfo(val).catch(() => {
        })
        // Close details when switching rooms
        state.isRoomDetailsOpen = false
        $state.isRoomDetailsOpen = false
      })

      $state.subscribe('activeSelectionType', () => {
        updateRoomInfo($state.activeSelectionId).catch(() => {
        })
      })

      $state.subscribe('callStatus', () => {
        updateRoomInfo($state.activeSelectionId).catch(() => {
        })
      })

      $state.subscribe('activeCallRoomId', () => {
        updateRoomInfo($state.activeSelectionId).catch(() => {
        })
      })

      $bus.on('room:theme_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          updateRoomInfo($state.activeSelectionId).catch(() => {
          })
        }
      })

      $bus.on('room:nicknames_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          updateRoomInfo($state.activeSelectionId).catch(() => {
          })
        }
      })

      $bus.on('room:member_updated', (payload) => {
        if (payload && payload.room_id === $state.activeSelectionId) {
          updateRoomInfo($state.activeSelectionId).catch(() => {
          })
        }
      })

      $bus.on('user:blocked', (payload) => {
        if (payload) {
          // Close details sidebar
          state.isRoomDetailsOpen = false
          $state.isRoomDetailsOpen = false
          bsOffcanvas.hide()

          $bus.emit('ui:show_toast', {
            message: `${payload.targetUsername} blocked successfully`,
            type: 'success'
          })

          // Refresh active room info & timeline
          updateRoomInfo($state.activeSelectionId).catch(() => {
          })
          $bus.emit('db:new_local_data', { room_id: $state.activeSelectionId })
        }
      })

      $state.subscribe('isRoomDetailsOpen', (val) => {
        state.isRoomDetailsOpen = val
        if (val) {
          bsOffcanvas.show()
        } else {
          bsOffcanvas.hide()
        }
      })

      const btnDetails = refs('btnDetails')
      btnDetails.addEventListener('click', () => {
        state.isRoomDetailsOpen = !state.isRoomDetailsOpen
        $state.isRoomDetailsOpen = state.isRoomDetailsOpen
      }, { signal })

      $bus.on('ui:close_room_details', () => {
        state.isRoomDetailsOpen = false
        $state.isRoomDetailsOpen = false
      })

      refs('btnBack').addEventListener('click', () => {
        $state.activeSelectionId = null
        $state.activeSelectionType = null
        $bus.emit('ui:open_mobile_nav')
      }, { signal })

      /**
       * Initiates an E2E media call (audio and optionally video) in the current room.
       * @param {boolean} [video=true] - Whether video streaming is requested.
       * @returns {Promise<void>}
       * @throws {Error} Re-throws unexpected signaling, network, or hardware errors.
       */
      const initiateCall = async (video = true) => {
        if ($state.callStatus !== 'idle') {
          return
        }

        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          $bus.emit('ui:show_toast', {
            message: 'No microphone or camera detected',
            type: 'error'
          })
          return
        }

        let localStream = null
        try {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: video
            })
          } catch (err) {
            if (video) {
              localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
              })
            } else {
              throw err
            }
          }
        } catch (err) {
          const errName = err?.name || err?.message || ''
          let errMsg = 'No microphone or camera detected'
          if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
            errMsg = 'Microphone or camera permission was denied'
          } else if (errName === 'NotFoundError' || errName === 'DevicesNotFoundError') {
            errMsg = 'No microphone or camera detected'
          }
          $bus.emit('ui:show_toast', {
            message: errMsg,
            type: 'error'
          })
          return
        }

        try {
          $state.activeCallRoomId = $state.activeSelectionId
          $state.set('callStatus', 'active')
  
          // Emit event so call-overlay can pick up the localStream we just created
          $bus.emit('call:initiated_locally', { localStream })
  
          await $webrtc.initiateCall($state.activeCallRoomId, localStream)
        } catch (err) {
          console.error('[atoll-call] initiateCall failed:', err)
          if (localStream) {
            try {
              localStream.getTracks().forEach(t => t.stop())
            } catch (cleanupErr) {
              console.error('Failed to cleanup stream tracks', cleanupErr)
            }
          }
          $state.callStatus = 'idle'
          $state.activeCallRoomId = null

          $bus.emit('ui:show_toast', {
            message: 'Failed to establish call connection. Please check your network.',
            type: 'error'
          })
        }
      }

      refs('btnAudioCall').addEventListener('click', () => {
        initiateCall(false).catch(err => {
          console.error('[atoll-chat-view] Audio call initiation failed:', err)
        })
      }, { signal })
      refs('btnVideoCall').addEventListener('click', () => {
        initiateCall(true).catch(err => {
          console.error('[atoll-chat-view] Video call initiation failed:', err)
        })
      }, { signal })
    }
  })
</script>
