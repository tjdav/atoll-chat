<template id="edit-room-modal">
  <atoll-popup
    ref="editModal"
    title="Edit Room Details"
    primary-text="Save Changes"
    secondary-text="Cancel"
  >
    <div>
      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Room Name</label>
        <input type="text" class="form-control" placeholder="Enter group name" ref="roomNameInput">
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Room Avatar</label>
        <div class="d-flex align-items-center gap-3">
          <div class="room-avatar-preview bg-body-tertiary border d-flex align-items-center justify-content-center overflow-hidden" ref="avatarPreview" style="width: 64px; height: 64px; border-radius: 12px;">
            <atoll-icon name="camera" size="24" class="text-muted"></atoll-icon>
          </div>
          <div>
            <input type="file" class="d-none" ref="avatarInput" accept="image/*">
            <button type="button" class="btn btn-sm btn-outline-secondary" ref="btnSelectAvatar">Change Image</button>
            <button type="button" class="btn btn-sm btn-link text-danger d-none" ref="btnClearAvatar">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      roomName: '',
      roomAvatar: null,
      isSaving: false,
      activeRoom: null,
      roomId: null
    }),
    getters: {
      canSave: (state) => Boolean(state.roomName.trim()) && !state.isSaving
    },
    client: ({ refs, state, pocketbase, eventBus, storage, cryptoWorker, utils, signal }) => {
      const { pb } = pocketbase
      const { $crypto } = utils
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $storage } = storage
      const modal = refs('editModal')
  
      const roomNameInput = refs('roomNameInput')
      const avatarInput = refs('avatarInput')
      const avatarPreview = refs('avatarPreview')
      const btnSelectAvatar = refs('btnSelectAvatar')
      const btnClearAvatar = refs('btnClearAvatar')

      $bus.on('ui:open_edit_room_modal', async (room) => {
        if (!room) {
          return
        }
        state.roomId = room.id
        state.activeRoom = room
        state.roomName = room.name || ''
        state.roomAvatar = null
        roomNameInput.value = state.roomName
  
        // Initial Avatar Preview
        avatarPreview.innerHTML = '<atoll-icon name="camera" size="24" class="text-muted"></atoll-icon>'
        btnClearAvatar.classList.add('d-none')
  
        if (room.avatar) {
          try {
            const avatarData = JSON.parse(room.avatar)
            const record = await pb.collection('media').getOne(avatarData.media_id)
            const encryptedUrl = pb.files.getURL(record, record.file)
            const resp = await fetch(encryptedUrl)
            const buffer = await resp.arrayBuffer()

            const decrypted = await $worker.execute('worker:crypto_secretbox_open_easy', {
              ciphertext: buffer,
              nonce: avatarData.nonce,
              key: avatarData.key
            })

            if (decrypted) {
              const blob = new Blob([decrypted], { type: 'image/jpeg' })
              const url = URL.createObjectURL(blob)
              avatarPreview.innerHTML = ''
              const img = document.createElement('img')
              img.src = url
              img.className = 'w-100 h-100 object-fit-cover'
              avatarPreview.appendChild(img)
              btnClearAvatar.classList.remove('d-none')
              signal.addEventListener('abort', () => URL.revokeObjectURL(url))
            }
          } catch (e) {
            console.error('Failed to load existing avatar in edit modal:', e)
          }
        }

        modal.show()
        setTimeout(() => roomNameInput.focus(), 100)
      })

      roomNameInput.oninput = (e) => {
        state.roomName = e.target.value
      }

      btnSelectAvatar.onclick = () => avatarInput.click()
      avatarInput.onchange = (e) => {
        const file = e.target.files[0]
        if (file) {
          state.roomAvatar = file
          const reader = new FileReader()
          reader.onload = (re) => {
            avatarPreview.innerHTML = ''
            const img = document.createElement('img')
            img.src = re.target.result
            img.className = 'w-100 h-100 object-fit-cover'
            avatarPreview.appendChild(img)
            btnClearAvatar.classList.remove('d-none')
          }
          reader.readAsDataURL(file)
        }
      }
      btnClearAvatar.onclick = () => {
        state.roomAvatar = 'CLEAR'
        avatarInput.value = ''
        avatarPreview.innerHTML = '<atoll-icon name="camera" size="24" class="text-muted"></atoll-icon>'
        btnClearAvatar.classList.add('d-none')
      }

      const saveChanges = async () => {
        if (!state.canSave) {
          return
        }
        state.isSaving = true

        try {
          const room = state.activeRoom
          const roomKeyB64 = room.key_history?.find(h => h.epoch_id === 1)?.key
          if (!roomKeyB64) {
            throw new Error('Room secret key not found locally')
          }

          let avatarPayload = room.avatar || ''
          if (state.roomAvatar === 'CLEAR') {
            avatarPayload = ''
          } else if (state.roomAvatar instanceof File) {
            const fileBuffer = await state.roomAvatar.arrayBuffer()
            const avatarKey = await $worker.execute('worker:randombytes_buf', { length: 32 })
            const avatarNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
            const encryptedAvatar = await $worker.execute('worker:crypto_secretbox_easy', {
              message: fileBuffer,
              nonce: avatarNonce,
              key: avatarKey
            })

            const blob = new Blob([encryptedAvatar], { type: 'application/octet-stream' })
            const formData = new FormData()
            formData.append('file', blob, 'avatar.bin')
            const mediaRecord = await pb.collection('media').create(formData)

            avatarPayload = JSON.stringify({
              media_id: mediaRecord.id,
              key: $crypto.toBase64(avatarKey),
              nonce: $crypto.toBase64(avatarNonce)
            })
          }

          const metadata = JSON.stringify({
            name: state.roomName,
            avatar: avatarPayload
          })
          const metadataNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
          const encryptedMetadata = await $worker.execute('worker:crypto_secretbox_easy', {
            message: metadata,
            nonce: metadataNonce,
            key: roomKeyB64
          })

          const metadataPayload = {
            ciphertext: $crypto.toBase64(encryptedMetadata),
            nonce: $crypto.toBase64(metadataNonce)
          }

          await pb.collection('rooms').update(room.id, {
            encrypted_metadata: metadataPayload
          })

          // Update local cache
          await $storage.updateRoom(room.id, {
            name: state.roomName,
            avatar: avatarPayload,
            updated_at: new Date().toISOString()
          })

          $bus.emit('db:new_local_room', { room_id: room.id })
          modal.hide()
        } catch (err) {
          console.error('[edit-room-modal] Save failed:', err)
          alert('Save failed: ' + err.message)
        } finally {
          state.isSaving = false
        }
      }

      modal.addEventListener('atoll-popup-primary', saveChanges, { signal })
    }
  })
</script>
