<template id="edit-room-modal">
  <atoll-popup
    ref="editModal"
    title="Edit Room Details"
    size="md"
    primary-text="Save Changes"
    secondary-text="Cancel"
    primary-disabled="{{ disableSave }}"
    primary-loading="{{ isSaving }}"
    data-testid="editRoomModal"
  >
    <div class="d-flex flex-column gap-3">
      <!-- Room Name Input -->
      <div class="mb-1 text-start">
        <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.05em;">Room Name</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Enter room name" 
          ref="roomNameInput"
          data-testid="editRoomNameInput"
        >
      </div>

      <!-- Room Avatar Control -->
      <div class="mb-1 text-start">
        <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.05em;">Room Avatar</label>
        <div class="d-flex align-items-center gap-3">
          <div 
            class="room-avatar-preview bg-body-tertiary border d-flex align-items-center justify-content-center overflow-hidden" 
            ref="avatarPreview" 
            style="width: 64px; height: 64px; border-radius: 12px;"
          >
            <atoll-icon name="camera" size="24" class="text-muted"></atoll-icon>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input type="file" class="d-none" ref="avatarInput" accept="image/*" data-testid="editAvatarInput">
            <button type="button" class="btn btn-sm btn-outline-secondary" ref="btnSelectAvatar" data-testid="btnSelectAvatar">Change Image</button>
            <button type="button" class="btn btn-sm btn-link text-danger d-none" ref="btnClearAvatar" data-testid="btnClearAvatar">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      roomName: '',
      initialName: '',
      roomAvatar: null,
      hasExistingAvatar: false,
      isSaving: false,
      activeRoom: null,
      roomId: null
    }),
    getters: {
      isDirty: (state) => {
        const nameChanged = (state.roomName || '').trim() !== (state.initialName || '').trim()
        const avatarChanged = state.roomAvatar !== null
        return nameChanged || avatarChanged
      },
      canSave: (state) => Boolean((state.roomName || '').trim()) && !state.isSaving && state.isDirty,
      disableSave: (state) => !state.canSave
    },
    client: ({ root, refs, state, pocketbase, eventBus, storage, cryptoWorker, utils, signal }) => {
      const { pb } = pocketbase
      const { $crypto, $media } = utils
      const { $worker } = cryptoWorker
      const { $bus } = eventBus
      const { $storage } = storage

      const modal = refs('editModal')
      const roomNameInput = refs('roomNameInput')
      const avatarInput = refs('avatarInput')
      const avatarPreview = refs('avatarPreview')
      const btnSelectAvatar = refs('btnSelectAvatar')
      const btnClearAvatar = refs('btnClearAvatar')

      let currentBlobUrl = null

      /**
       * Safely revokes active object URLs to prevent memory leaks.
       *
       * @returns {void}
       */
      const cleanupBlobUrl = () => {
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl)
          currentBlobUrl = null
        }
      }

      signal.addEventListener('abort', cleanupBlobUrl)

      /**
       * Resets the avatar preview container to the default camera placeholder icon.
       *
       * @returns {void}
       */
      const resetAvatarPreview = () => {
        cleanupBlobUrl()
        avatarPreview.replaceChildren()
        const icon = document.createElement('atoll-icon')
        icon.setAttribute('name', 'camera')
        icon.setAttribute('size', '24')
        icon.className = 'text-muted'
        avatarPreview.appendChild(icon)
      }

      /**
       * Renders an image element inside the avatar preview container.
       *
       * @param {string} src - Image URL or Data URL.
       * @returns {void}
       */
      const renderAvatarPreview = (src) => {
        avatarPreview.replaceChildren()
        const img = document.createElement('img')
        img.src = src
        img.className = 'w-100 h-100 object-fit-cover'
        avatarPreview.appendChild(img)
      }

      /**
       * Resets all internal component state and revokes any active object URLs.
       *
       * @returns {void}
       */
      const resetState = () => {
        cleanupBlobUrl()
        state.roomName = ''
        state.initialName = ''
        state.roomAvatar = null
        state.hasExistingAvatar = false
        state.isSaving = false
        state.activeRoom = null
        state.roomId = null

        roomNameInput.value = ''
        avatarInput.value = ''
        resetAvatarPreview()
        btnClearAvatar.classList.add('d-none')
      }

      /**
       * Opens the edit room modal and populates metadata and avatar preview.
       *
       * @param {Object} room - Room object containing details.
       * @param {string} room.id - Unique ID of the room.
       * @param {string} room.name - Name of the room.
       * @param {string} [room.avatar] - Serialized avatar JSON string.
       * @returns {Promise<void>}
       * @throws {Error} Re-throws unexpected retrieval or decryption exceptions.
       */
      const openEditRoomModal = async (room) => {
        if (!room) {
          return
        }

        resetState()

        state.roomId = room.id
        state.activeRoom = room
        state.roomName = room.name || ''
        state.initialName = room.name || ''
        roomNameInput.value = state.roomName

        if (room.avatar) {
          try {
            const avatarData = typeof room.avatar === 'string' ? JSON.parse(room.avatar) : room.avatar
            if ($media && typeof $media.decrypt === 'function' && (avatarData.media_id || avatarData.id)) {
              currentBlobUrl = await $media.decrypt(avatarData, signal)
              if (currentBlobUrl) {
                renderAvatarPreview(currentBlobUrl)
                state.hasExistingAvatar = true
                btnClearAvatar.classList.remove('d-none')
              }
            }
          } catch {
            $bus.emit('ui:show_toast', {
              message: 'Could not load room avatar preview',
              type: 'warning'
            })
          }
        }

        if (typeof modal.show === 'function') {
          modal.show()
        } else if (typeof modal.setAttribute === 'function') {
          modal.setAttribute('open', 'true')
        }

        setTimeout(() => roomNameInput.focus(), 100)
      }

      /**
       * Closes the edit room modal.
       *
       * @returns {void}
       */
      const closeEditRoomModal = () => {
        if (typeof modal.hide === 'function') {
          modal.hide()
        } else if (typeof modal.removeAttribute === 'function') {
          modal.removeAttribute('open')
        }
        resetState()
      }

      // Expose public API on component host root
      if (root) {
        root.show = openEditRoomModal
        root.hide = closeEditRoomModal
      }

      $bus.on('ui:open_edit_room_modal', openEditRoomModal, { signal })
      $bus.on('ui:open_edit_room', openEditRoomModal, { signal })

      roomNameInput.addEventListener('input', (e) => {
        state.roomName = e.target.value
      }, { signal })

      roomNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && state.canSave) {
          e.preventDefault()
          saveChanges()
        }
      }, { signal })

      btnSelectAvatar.addEventListener('click', () => {
        avatarInput.click()
      }, { signal })

      avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0]
        if (file) {
          state.roomAvatar = file
          cleanupBlobUrl()
          currentBlobUrl = URL.createObjectURL(file)
          renderAvatarPreview(currentBlobUrl)
          btnClearAvatar.classList.remove('d-none')
        }
      }, { signal })

      btnClearAvatar.addEventListener('click', () => {
        state.roomAvatar = 'CLEAR'
        avatarInput.value = ''
        resetAvatarPreview()
        btnClearAvatar.classList.add('d-none')
      }, { signal })

      /**
       * Persists updated room name and avatar changes to PocketBase and local storage.
       *
       * @returns {Promise<void>}
       * @throws {Error} Displays toast and throws error on save failure.
       */
      const saveChanges = async () => {
        if (!state.canSave) {
          return
        }

        state.isSaving = true

        try {
          const room = state.activeRoom
          const roomKeyB64 = room?.key_history?.find(h => h.epoch_id === 1)?.key
          if (!roomKeyB64) {
            throw new Error('Room secret key not found locally')
          }

          let avatarPayload = room.avatar || ''

          if (state.roomAvatar === 'CLEAR') {
            avatarPayload = ''
          } else if (state.roomAvatar instanceof File || state.roomAvatar instanceof Blob) {
            let processedBlob = state.roomAvatar
            if ($media && typeof $media.compressImage === 'function') {
              try {
                processedBlob = await $media.compressImage(state.roomAvatar, {
                  maxWidth: 512,
                  maxHeight: 512,
                  quality: 0.85,
                  format: 'image/jpeg',
                  cropToSquare: true
                })
              } catch {
                processedBlob = state.roomAvatar
              }
            }

            const fileBuffer = await processedBlob.arrayBuffer()
            const avatarKey = await $worker.execute('worker:randombytes_buf', { length: 32 })
            const avatarNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
            const encryptedAvatar = await $worker.execute('worker:crypto_secretbox_easy', {
              message: fileBuffer,
              nonce: avatarNonce.slice(0),
              key: avatarKey.slice(0)
            })

            const file = new File([encryptedAvatar], 'avatar.bin', { type: 'application/octet-stream' })
            const formData = new FormData()
            formData.append('file', file)
            const mediaRecord = await pb.collection('media').create(formData)

            avatarPayload = JSON.stringify({
              media_id: mediaRecord.id,
              key: $crypto.toBase64(avatarKey),
              nonce: $crypto.toBase64(avatarNonce)
            })
          }

          const trimmedName = (state.roomName || '').trim()
          const metadata = JSON.stringify({
            name: trimmedName,
            avatar: avatarPayload
          })
          const metadataNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
          const encryptedMetadata = await $worker.execute('worker:crypto_secretbox_easy', {
            message: metadata,
            nonce: metadataNonce.slice(0),
            key: roomKeyB64
          })

          const metadataPayload = {
            ciphertext: $crypto.toBase64(encryptedMetadata),
            nonce: $crypto.toBase64(metadataNonce)
          }

          await pb.collection('rooms').update(room.id, {
            encrypted_metadata: metadataPayload
          })

          await $storage.updateRoom(room.id, {
            name: trimmedName,
            avatar: avatarPayload,
            updated_at: new Date().toISOString()
          })

          $bus.emit('db:new_local_room', { room_id: room.id })
          $bus.emit('room:member_updated', { room_id: room.id })
          $bus.emit('ui:show_toast', {
            message: 'Room updated successfully',
            type: 'success'
          })

          closeEditRoomModal()
        } catch (err) {
          $bus.emit('ui:show_toast', {
            message: 'Failed to update room: ' + err.message,
            type: 'danger'
          })
          throw err
        } finally {
          state.isSaving = false
        }
      }

      modal.addEventListener('atoll-popup-primary', saveChanges, { signal })
      modal.addEventListener('atoll-popup-close', resetState, { signal })
    }
  })
</script>
