<template id="atoll-chat-input-text">
  <div class="d-flex gap-2 align-items-center atoll-chat-input-text">
    <input type="file" ref="fileInput" class="d-none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.rtf,.zip,.rar,.7z,.tar,.gz" multiple data-testid="fileInput" aria-hidden="true" tabindex="-1">
    
    <!-- Attachment Button -->
    <atoll-button 
      icon-only="true" 
      variant="primary" 
      size="sm"
      pill="true"
      ref="attachButton" 
      class="atoll-chat-input-btn-attach"
      title="Attach File" 
      aria-label="Attach File"
      disabled="{{ isButtonDisabled }}"
    >
      <atoll-icon name="attach" size="20"></atoll-icon>
    </atoll-button>

    <div class="position-relative flex-grow-1">
      <textarea
        ref="messageInput"
        class="form-control rounded-pill w-100 pe-6"
        placeholder="Type a message..."
        aria-label="Type a message"
        rows="1"
        enterkeyhint="send"
        autocapitalize="sentences"
        spellcheck="true"
        disabled="{{ isInputDisabled }}"
        style="resize: none; max-height: 160px; overflow-y: auto;"
      ></textarea>
      
      <atoll-button 
        icon-only="true" 
        variant="ghost" 
        size="sm"
        pill="true"
        class="d-inline-block atoll-chat-emoji-button position-absolute top-50 end-0 translate-middle-y me-1" 
        ref="emojiButton" 
        title="Emojis" 
        aria-label="Select Emoji"
        disabled="{{ isButtonDisabled }}"
      >
        <atoll-icon name="emoji" size="20"></atoll-icon>
      </atoll-button>
    </div>

    <atoll-button 
      icon-only="true" 
      variant="primary" 
      size="sm" 
      pill="true"
      ref="micButton" 
      class="atoll-chat-input-btn-voice"
      title="Voice message" 
      aria-label="Voice message"
      disabled="{{ isButtonDisabled }}" 
      data-testid="btn-mic-toggle"
    >
      <atoll-icon name="mic" size="20"></atoll-icon>
    </atoll-button>

    <atoll-button 
      icon-only="true" 
      variant="primary" 
      size="sm" 
      pill="true"
      ref="sendButton" 
      class="atoll-chat-input-btn-send"
      title="Send Message"
      aria-label="Send Message"
      disabled="{{ isButtonDisabled }}" 
      loading="{{ isButtonDisabled }}"
      data-testid="sendButton"
    >
      <atoll-icon name="send" size="20"></atoll-icon>
    </atoll-button>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      isSending: Boolean,
      isUploading: Boolean,
      isCompressing: Boolean
    },
    server: () => ({
      currentMessageText: ''
    }),
    getters: {
      isDisabled: (state) => Boolean(state.isSending || state.isUploading || state.isCompressing),
      isInputDisabled: (state) => Boolean(state.isUploading || state.isCompressing),
      isButtonDisabled: (state) => Boolean(state.isSending || state.isUploading || state.isCompressing)
    },
    client: ({ refs, state, globalStore, eventBus, signal, utils, storage, pocketbase }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { $device } = utils
      const { $storage } = storage
      const { pb } = pocketbase
      const messageInput = refs('messageInput')
      const emojiButton = refs('emojiButton')
      const micButton = refs('micButton')
      const sendButton = refs('sendButton')

      if (!messageInput) {
        return
      }

      // Sync initial global state
      state.currentMessageText = $state.currentMessageText || ''
      messageInput.value = state.currentMessageText

      const autoExpand = () => {
        messageInput.style.height = 'auto'
        const scrollHeight = messageInput.scrollHeight
        messageInput.style.height = scrollHeight + 'px'
  
        // Toggle multiline class based on height threshold
        messageInput.classList.toggle('is-multiline', scrollHeight > 40)
      }

      let isLocalTyping = false
      let typingTimeout = null
      let previousRoomId = $state.activeSelectionId

      const setServerTyping = async (isTyping, targetRoomId = null) => {
        const room_id = targetRoomId || $state.activeSelectionId
        const userId = $state.currentUser?.id
        if (!room_id || !userId || !pb) {
          return
        }

        try {
          const room = await $storage.getRoom(room_id)
          if (!room || room.read_receipts === false) {
            return
          }

          let stateRecord = null
          try {
            stateRecord = await pb.collection('room_member_states').getFirstListItem(
              `room_id="${room_id}" && user_id="${userId}"`, { requestKey: null }
            )
          } catch (e) {
          }

          if (stateRecord) {
            if (stateRecord.is_typing !== isTyping) {
              await pb.collection('room_member_states').update(stateRecord.id, {
                is_typing: isTyping
              }, { requestKey: null })
            }
          } else {
            await pb.collection('room_member_states').create({
              room_id,
              user_id: userId,
              last_read_message_id: null,
              is_typing: isTyping
            }, { requestKey: null })
          }
        } catch (err) {
          console.warn('[atoll-chat-input-text] Failed to update typing state on server:', err)
        }
      }

      const handleTypingActivity = () => {
        const text = messageInput.value.trim()
        if (text.length > 0) {
          if (!isLocalTyping) {
            isLocalTyping = true
            setServerTyping(true)
          }
          if (typingTimeout) {
            clearTimeout(typingTimeout)
          }
          typingTimeout = setTimeout(() => {
            isLocalTyping = false
            setServerTyping(false)
          }, 3000)
        } else {
          if (isLocalTyping) {
            isLocalTyping = false
            if (typingTimeout) {
              clearTimeout(typingTimeout)
              typingTimeout = null
            }
            setServerTyping(false)
          }
        }
      }

      const resetTyping = () => {
        if (isLocalTyping) {
          isLocalTyping = false
          if (typingTimeout) {
            clearTimeout(typingTimeout)
            typingTimeout = null
          }
          setServerTyping(false)
        }
      }

      messageInput.addEventListener('input', () => {
        $state.currentMessageText = messageInput.value
        state.currentMessageText = messageInput.value
        autoExpand()
        handleTypingActivity()
      }, { signal })

      const isStickerCandidate = (file) => {
        if (!file) {
          return false
        }
        const rawType = (file.type || '').toLowerCase().split(';')[0].trim()
        const fileName = (file.name || '').toLowerCase()
        const ext = fileName.lastIndexOf('.') !== -1 ? fileName.substring(fileName.lastIndexOf('.') + 1) : ''
        const stickerMimes = ['image/webp', 'image/png', 'image/gif', 'application/json']
        const stickerExts = ['webp', 'png', 'gif', 'json', 'lottie']
        return stickerMimes.includes(rawType) || stickerExts.includes(ext)
      }

      // Handle paste: convert HTML to Markdown or dispatch clipboard file
      messageInput.addEventListener('paste', async (e) => {
        let files = Array.from(e.clipboardData?.files || [])
        if (files.length === 0 && e.clipboardData?.items) {
          const items = Array.from(e.clipboardData.items)
          files = items
            .filter(item => item.kind === 'file')
            .map(item => item.getAsFile())
            .filter(Boolean)
        }

        if (files && files.length > 0) {
          const fileList = files.filter(f => f && (f.type || f.size > 0))
          if (fileList.length === 1) {
            const targetFile = fileList[0]
            const isTextEmpty = !messageInput.value.trim()
            if (isStickerCandidate(targetFile) && targetFile.size <= 2 * 1024 * 1024 && isTextEmpty) {
              e.preventDefault()
              $bus.emit('ui:sticker_pasted', { file: targetFile })
              return
            } else {
              e.preventDefault()
              $bus.emit('ui:file_selected', { file: targetFile })
              return
            }
          } else if (fileList.length > 1) {
            e.preventDefault()
            $bus.emit('ui:files_selected', { files: fileList })
            return
          }
        }

        const html = e.clipboardData.getData('text/html')
        if (html) {
          e.preventDefault()
  
          try {
            const { default: TurndownService } = await import('turndown')
            const turndownService = new TurndownService({
              headingStyle: 'atx',
              codeBlockStyle: 'fenced'
            })
  
            const markdown = turndownService.turndown(html)
  
            const start = messageInput.selectionStart
            const end = messageInput.selectionEnd
            const text = messageInput.value
            const newValue = text.substring(0, start) + markdown + text.substring(end)
  
            messageInput.value = newValue
            $state.currentMessageText = newValue
            state.currentMessageText = newValue
  
            const newPos = start + markdown.length
            messageInput.setSelectionRange(newPos, newPos)
  
            autoExpand()
            handleTypingActivity()
          } catch (_e) {
            // Fall back to native plain text insertion if Turndown fails
            const plainText = e.clipboardData.getData('text/plain')
            if (plainText) {
              const start = messageInput.selectionStart
              const end = messageInput.selectionEnd
              const text = messageInput.value
              const newValue = text.substring(0, start) + plainText + text.substring(end)
  
              messageInput.value = newValue
              $state.currentMessageText = newValue
              state.currentMessageText = newValue
  
              const newPos = start + plainText.length
              messageInput.setSelectionRange(newPos, newPos)
  
              autoExpand()
              handleTypingActivity()
            }
          }
        }
      }, { signal })

      // Watch for programmatic changes to currentMessageText
      if (typeof $state.subscribe === 'function') {
        $state.subscribe('currentMessageText', (val) => {
          if (messageInput.value !== val) {
            messageInput.value = val || ''
            state.currentMessageText = val || ''
            autoExpand()
          }
        })

        // Track active selection changes to reset server typing in previous room
        $state.subscribe('activeSelectionId', (newRoomId) => {
          if (previousRoomId && previousRoomId !== newRoomId && isLocalTyping) {
            setServerTyping(false, previousRoomId)
            resetTyping()
          }
          previousRoomId = newRoomId
        })
      }

      // Clean up timer and server typing on component disconnect
      signal.addEventListener('abort', () => {
        if (typingTimeout) {
          clearTimeout(typingTimeout)
          typingTimeout = null
        }
        if (isLocalTyping && previousRoomId) {
          setServerTyping(false, previousRoomId)
          isLocalTyping = false
        }
      })

      // Initial expand
      autoExpand()

      const setupFileInput = (btnRef, inputRef) => {
        const btn = refs(btnRef)
        const input = refs(inputRef)

        const clickHandler = (e) => {
          if (e) {
            e.preventDefault()
          }
          input.click()
        }

        if (btn) {
          btn.addEventListener('click', clickHandler, { signal })
        }

        if (input) {
          input.addEventListener('change', () => {
            const files = Array.from(input.files || [])
            if (files.length === 1) {
              $bus.emit('ui:file_selected', { file: files[0] })
            } else if (files.length > 1) {
              $bus.emit('ui:files_selected', { files })
            }
            input.value = ''
          }, { signal })
        }
      }

      setupFileInput('attachButton', 'fileInput')

      micButton.addEventListener('click', () => {
        $bus.emit('ui:mic_clicked')
      }, { signal })

      sendButton.addEventListener('pointerdown', (e) => {
        // Keep textarea focused on touch/pointer down
        e.preventDefault()
      }, { signal })

      sendButton.addEventListener('mousedown', (e) => {
        e.preventDefault()
      }, { signal })

      sendButton.addEventListener('click', () => {
        resetTyping()
        $bus.emit('ui:send_clicked')
        requestAnimationFrame(() => {
          messageInput.focus()
        })
      }, { signal })

      emojiButton.addEventListener('click', () => {
        const rect = emojiButton.getBoundingClientRect()
        $bus.emit('ui:show_reaction_picker', {
          x: rect.left - 300,
          y: rect.top - 410,
          targetId: 'CHAT_INPUT'
        })
      }, { signal })

      $bus.on('ui:emoji_selected', (payload) => {
        const emoji = payload.emoji
        const start = messageInput.selectionStart
        const end = messageInput.selectionEnd
        const text = messageInput.value
        const before = text.substring(0, start)
        const after = text.substring(end)
  
        const newValue = before + emoji + after
        messageInput.value = newValue
        $state.currentMessageText = newValue
        state.currentMessageText = newValue
  
        // Restore focus and set caret position
        messageInput.focus()
        const newPos = start + emoji.length
        messageInput.setSelectionRange(newPos, newPos)
  
        autoExpand()
        handleTypingActivity()
      })

      messageInput.addEventListener('keydown', (e) => {
        if (((e.key === 'Enter' && !e.shiftKey) || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) && !e.isComposing) {
          e.preventDefault()
          resetTyping()
          $bus.emit('ui:send_clicked')
        }
      }, { signal })

      // Handle focus and blur to lock page jump and ensure message list matches virtual keyboard layout
      messageInput.addEventListener('focus', () => {
        if (!$device.isTouch()) {
          return
        }
        window.scrollTo(0, 0)
        // Trigger scroll immediately to start adjustment
        $bus.emit('ui:scroll_to_bottom', { smooth: true })
        // Trigger scroll again after layout & virtual keyboard slide transition is fully complete
        setTimeout(() => {
          window.scrollTo(0, 0)
          $bus.emit('ui:scroll_to_bottom', { smooth: true })
        }, 100)
      }, { signal })

      messageInput.addEventListener('blur', () => {
        window.scrollTo(0, 0)
      }, { signal })

      // Drag and Drop support
      const containerEl = messageInput.closest('.atoll-chat-input-text') || messageInput
      containerEl.addEventListener('dragover', (e) => {
        e.preventDefault()
        e.stopPropagation()
      }, { signal })

      containerEl.addEventListener('drop', (e) => {
        e.preventDefault()
        e.stopPropagation()
        const files = Array.from(e.dataTransfer?.files || [])
        if (files.length === 1) {
          const targetFile = files[0]
          const isTextEmpty = !messageInput.value.trim()
          if (isStickerCandidate(targetFile) && targetFile.size <= 2 * 1024 * 1024 && isTextEmpty) {
            $bus.emit('ui:sticker_pasted', { file: targetFile })
            return
          }
        }
        if (files.length > 0) {
          $bus.emit('ui:files_selected', { files })
        }
      }, { signal })

      $bus.on('ui:focus_input', () => {
        requestAnimationFrame(() => {
          messageInput.focus()
          if ($device.isTouch()) {
            $bus.emit('ui:scroll_to_bottom', { smooth: true })
          }
        })
      })
    }
  })
</script>
