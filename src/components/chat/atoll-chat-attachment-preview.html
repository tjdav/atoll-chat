<template id="atoll-chat-attachment-preview">
  <div class="atoll-chat-attachment-preview p-2 mb-2 rounded-4 d-flex align-items-center justify-content-between border">
    <div class="d-flex align-items-center">
      <!-- Thumbnail Container (Video or Image) -->
      <div class="atoll-chat-attachment-tile atoll-chat-attachment-preview-thumbnail-container position-relative me-2 bg-dark rounded-3 border d-flex align-items-center justify-content-center" hidden="{{ isThumbnailContainerHidden }}">
        <img ref="thumbnailImg" class="w-100 h-100 object-fit-cover" alt="Cover Preview" hidden="{{ isThumbnailHidden }}">
        <atoll-icon name="videocam" size="28" color="#ffffff" hidden="{{ isVideoIconHidden }}"></atoll-icon>
        
        <!-- Standard file picker restricted to image files, visually hidden -->
        <input type="file" ref="coverInput" class="d-none" accept="image/jpeg, image/png, image/webp" data-testid="cover-file-input">
        
        <!-- Action Button overlaid (Video only) -->
        <button class="btn btn-sm {{ coverBtnClass }} atoll-chat-tile-cover-btn atoll-chat-attachment-preview-cover-btn position-absolute bottom-0 start-50 translate-middle-x mb-1" 
                hidden="{{ isCoverBtnHidden }}"
                ref="coverBtn" 
                data-testid="btn-change-cover">
          {{ coverBtnText }}
        </button>
      </div>

      <!-- Generic Document/File Icon if no thumbnail container -->
      <atoll-icon name="document" size="24" color="var(--atoll-brand-primary, #06C755)" class="me-2" hidden="{{ isGenericIconHidden }}"></atoll-icon>
      
      <div>
        <div class="small fw-bold text-truncate atoll-chat-attachment-preview-name atoll-chat-attachment-preview-text-max-width">{{ effectiveFileName }}</div>
        <div class="x-small atoll-chat-attachment-preview-status text-truncate atoll-chat-attachment-preview-text-max-width">{{ effectiveUploadStatus }}</div>
        
        <!-- Progress Bar Indicator -->
        <div class="progress mt-1 atoll-chat-attachment-preview-progress" hidden="{{ isProgressHidden }}">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
               role="progressbar" 
               style="{{ progressBarStyle }}" 
               aria-valuenow="{{ progress }}" 
               aria-valuemin="0" 
               aria-valuemax="100"></div>
        </div>
      </div>
    </div>
    <atoll-button variant="ghost" leading-icon="close" icon-only="true" ref="cancelFileButton" title="Cancel"></atoll-button>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      fileName: String,
      filename: String,
      uploadStatus: String,
      'upload-status': String,
      isVideo: Boolean,
      'is-video': Boolean,
      thumbnailUrl: String,
      'thumbnail-url': String,
      isCustom: Boolean,
      'is-custom': Boolean,
      isCompressing: Boolean,
      'is-compressing': Boolean,
      isUploading: Boolean,
      'is-uploading': Boolean,
      progress: Number
    },
    getters: {
      effectiveFileName: (state) => state.fileName || state.filename || '',
      effectiveUploadStatus: (state) => state.uploadStatus || state['upload-status'] || '',
      effectiveIsVideo: (state) => Boolean(state.isVideo || state['is-video']),
      effectiveThumbnailUrl: (state) => state.thumbnailUrl || state['thumbnail-url'] || '',
      effectiveIsCustom: (state) => Boolean(state.isCustom || state['is-custom']),
      effectiveIsCompressing: (state) => Boolean(state.isCompressing || state['is-compressing']),
      effectiveIsUploading: (state) => Boolean(state.isUploading || state['is-uploading']),
      isThumbnailContainerHidden: (state) => !state.effectiveIsVideo && !state.effectiveThumbnailUrl,
      isCoverBtnHidden: (state) => !state.effectiveIsVideo,
      isVideoIconHidden: (state) => !state.effectiveIsVideo || !!state.effectiveThumbnailUrl,
      isThumbnailHidden: (state) => !state.effectiveThumbnailUrl,
      isGenericIconHidden: (state) => !!state.effectiveIsVideo || !!state.effectiveThumbnailUrl,
      coverBtnText: (state) => (state.effectiveIsCustom ? 'Remove Custom Cover' : 'Change Cover'),
      coverBtnClass: (state) => (state.effectiveIsCustom ? 'btn-danger' : 'btn-dark'),
      isProgressHidden: (state) => !(state.effectiveIsCompressing || state.effectiveIsUploading),
      progressBarStyle: (state) => 'width: ' + Math.min(100, Math.max(0, Number(state.progress) || 0)) + '%'
    },
    client: ({ refs, state, eventBus, signal, observe }) => {
      const { $bus } = eventBus
      const cancelBtn = refs('cancelFileButton')
      const coverBtn = refs('coverBtn')
      const coverInput = refs('coverInput')
      const thumbnailImg = refs('thumbnailImg')

      /**
       * Synchronizes the image source element with the reactive thumbnailUrl state.
       */
      const updateThumbnail = () => {
        thumbnailImg.src = state.effectiveThumbnailUrl || ''
      }

      updateThumbnail()
      observe('thumbnailUrl', updateThumbnail)
      observe('thumbnail-url', updateThumbnail)

      thumbnailImg.addEventListener('error', () => {
        thumbnailImg.src = ''
      }, { signal })

      cancelBtn.addEventListener('click', () => {
        $bus.emit('ui:cancel')
      }, { signal })

      coverBtn.addEventListener('click', (e) => {
        e.preventDefault()
        e.stopPropagation()
        if (state.effectiveIsCustom) {
          $bus.emit('ui:remove_custom_cover_clicked')
        } else {
          coverInput.click()
        }
      }, { signal })

      coverInput.addEventListener('change', () => {
        const file = coverInput.files[0]
        if (file) {
          $bus.emit('ui:custom_cover_selected', { file })
          coverInput.value = ''
        }
      }, { signal })
    }
  })
</script>
