<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({}),
    getters: {},
    client: async ({ refs, globalStore, storage, pocketbase, utils, signal, eventBus, cryptoWorker }) => {
      const { ensureWCAGContrast, generateImagePalettes } = await import('../../utils/color-contrast.js')
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { pb } = pocketbase || {}
      const { $worker } = cryptoWorker
      const { $crypto } = utils

      const themeModal = refs('themeModal')
      let highlightedTheme = 'classic'
      const themes = ['classic', 'ocean', 'forest', 'sunset', 'custom']

      // Structured Token Definitions for Predefined themes to synchronize live preview perfectly
      const preDefinedThemeTokens = {
        classic: {
          'sent-status-color': 'var(--atoll-text-tertiary, #999999)',
          'btn-attach-bg': 'transparent',
          'btn-attach-color': 'var(--atoll-secondary-color, #777777)',
          'btn-voice-bg': 'transparent',
          'btn-voice-color': 'var(--atoll-secondary-color, #777777)',
          'btn-send-bg': 'var(--atoll-brand-primary, #06C755)',
          'btn-send-color': '#ffffff',
          'waveform-active': 'var(--atoll-brand-primary, #06C755)',
          'waveform-inactive': 'rgba(6, 199, 85, 0.2)',
          'attachment-card-bg': 'var(--atoll-bg-surface-tertiary, #EEEEEE)',
          'attachment-card-border': 'rgba(0, 0, 0, 0.08)'
        },
        ocean: {
          'sent-status-color': 'rgba(255, 255, 255, 0.7)',
          'btn-attach-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-attach-color': '#ffffff',
          'btn-voice-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-voice-color': '#ffffff',
          'btn-send-bg': '#0083b0',
          'btn-send-color': '#ffffff',
          'waveform-active': '#0083b0',
          'waveform-inactive': 'rgba(0, 131, 176, 0.25)',
          'attachment-card-bg': '#142830',
          'attachment-card-border': 'rgba(255, 255, 255, 0.15)'
        },
        forest: {
          'sent-status-color': 'rgba(255, 255, 255, 0.7)',
          'btn-attach-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-attach-color': '#ffffff',
          'btn-voice-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-voice-color': '#ffffff',
          'btn-send-bg': '#11998e',
          'btn-send-color': '#ffffff',
          'waveform-active': '#11998e',
          'waveform-inactive': 'rgba(17, 153, 142, 0.25)',
          'attachment-card-bg': '#0C3328',
          'attachment-card-border': 'rgba(255, 255, 255, 0.15)'
        },
        sunset: {
          'sent-status-color': 'rgba(255, 255, 255, 0.7)',
          'btn-attach-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-attach-color': '#ffffff',
          'btn-voice-bg': 'rgba(255, 255, 255, 0.1)',
          'btn-voice-color': '#ffffff',
          'btn-send-bg': '#f12711',
          'btn-send-color': '#ffffff',
          'waveform-active': '#f12711',
          'waveform-inactive': 'rgba(241, 39, 17, 0.25)',
          'attachment-card-bg': '#2C1014',
          'attachment-card-border': 'rgba(255, 255, 255, 0.15)'
        }
      }

      // Custom theme state variables
      let customBgImage = null
      let customBgBlur = 5
      let customBgDim = 30
      let customUseBgImage = false
      let customPalette = []
      let customPaletteModeIdx = 0
      const paletteModes = ['vibrant', 'muted', 'pastel', 'deep']
  
      let customSentBg = '#06C755'
      let customSentColor = '#FFFFFF'
      let customReceivedBg = '#EEEEEE'
      let customReceivedColor = '#111111'

      // Derivable sub-colors
      let customSentStatusColor = '#999999'
      let customBtnAttachBg = 'transparent'
      let customBtnAttachColor = '#777777'
      let customBtnVoiceBg = 'transparent'
      let customBtnVoiceColor = '#777777'
      let customBtnSendBg = '#06C755'
      let customBtnSendColor = '#FFFFFF'
      let customWaveformActive = '#06C755'
      let customWaveformInactive = 'rgba(6, 199, 85, 0.2)'
      let customAttachmentCardBg = '#EEEEEE'
      let customAttachmentCardBorder = 'rgba(0, 0, 0, 0.08)'

      const customThemeControls = refs('customThemeControls')
      const imageUploader = refs('imageUploader')
      const btnGeneratePalette = refs('btnGeneratePalette')
      const btnRandomizeColors = refs('btnRandomizeColors')
      const paletteContainer = refs('paletteContainer')
      const swatchList = refs('swatchList')
      const useBgImageToggle = refs('useBgImageToggle')
      const bgSlidersContainer = refs('bgSlidersContainer')
      const blurSlider = refs('blurSlider')
      const dimSlider = refs('dimSlider')
      const blurValueText = refs('blurValueText')
      const dimValueText = refs('dimValueText')
      const previewChatWindow = refs('previewChatWindow')
      const previewBubbleIncoming = refs('previewBubbleIncoming')
      const previewBubbleOutgoing = refs('previewBubbleOutgoing')

      // Create an offscreen image object to parse uploaded files
      const offscreenImg = new Image()

      const showModal = async () => {
        const room = await $storage.getRoom($state.activeSelectionId)
        highlightedTheme = room?.theme || 'classic'

        // Hydrate from existing custom theme settings if they exist
        if (room?.custom_theme) {
          const ct = room.custom_theme
          customBgImage = ct.bgImage || null
          customBgBlur = ct.bgBlur !== undefined ? ct.bgBlur : 5
          customBgDim = ct.bgDim !== undefined ? ct.bgDim : 30
          customUseBgImage = !!ct.useBgImage
          customPalette = ct.palette || []
          customSentBg = ct.sentBg || '#06C755'
          customSentColor = ct.sentColor || '#FFFFFF'
          customReceivedBg = ct.receivedBg || '#EEEEEE'
          customReceivedColor = ct.receivedColor || '#111111'
          customSentStatusColor = ct.sentStatusColor || '#999999'
          customBtnAttachBg = ct.btnAttachBg || 'transparent'
          customBtnAttachColor = ct.btnAttachColor || '#777777'
          customBtnVoiceBg = ct.btnVoiceBg || 'transparent'
          customBtnVoiceColor = ct.btnVoiceColor || '#777777'
          customBtnSendBg = ct.btnSendBg || '#06C755'
          customBtnSendColor = ct.btnSendColor || '#FFFFFF'
          customWaveformActive = ct.waveformActive || '#06C755'
          customWaveformInactive = ct.waveformInactive || 'rgba(6, 199, 85, 0.2)'
          customAttachmentCardBg = ct.attachmentCardBg || '#EEEEEE'
          customAttachmentCardBorder = ct.attachmentCardBorder || 'rgba(0, 0, 0, 0.08)'
        } else {
          // Reset custom theme state if none exist
          customBgImage = null
          customBgBlur = 5
          customBgDim = 30
          customUseBgImage = false
          customPalette = []
          customSentBg = '#06C755'
          customSentColor = '#FFFFFF'
          customReceivedBg = '#EEEEEE'
          customReceivedColor = '#111111'
          customSentStatusColor = '#999999'
          customBtnAttachBg = 'transparent'
          customBtnAttachColor = '#777777'
          customBtnVoiceBg = 'transparent'
          customBtnVoiceColor = '#777777'
          customBtnSendBg = '#06C755'
          customBtnSendColor = '#FFFFFF'
          customWaveformActive = '#06C755'
          customWaveformInactive = 'rgba(6, 199, 85, 0.2)'
          customAttachmentCardBg = '#EEEEEE'
          customAttachmentCardBorder = 'rgba(0, 0, 0, 0.08)'
        }

        // Apply state values to UI controls
        blurSlider.value = customBgBlur
        blurValueText.textContent = `${customBgBlur}px`
        dimSlider.value = customBgDim
        dimValueText.textContent = `${customBgDim}%`
        useBgImageToggle.checked = customUseBgImage

        if (customBgImage) {
          btnGeneratePalette.removeAttribute('disabled')
          btnRandomizeColors.removeAttribute('disabled')
          renderPaletteSwatches()
        } else {
          btnGeneratePalette.setAttribute('disabled', 'true')
          btnRandomizeColors.setAttribute('disabled', 'true')
          paletteContainer.classList.add('d-none')
          swatchList.innerHTML = ''
        }

        updateThemeListHighlight()
        themeModal.show()
      }

      const hideModal = () => {
        themeModal.hide()
      }

      // Expose public methods
      const root = refs('themeModal').parentElement
      root.show = showModal
      root.hide = hideModal

      // Listen for open event
      $bus.on('ui:open_theme_modal', showModal)

      const innerModal = themeModal.querySelector('.modal')
      if (innerModal) {
        innerModal.addEventListener('click', (e) => {
          const item = e.target.closest('atoll-list-item')
          if (item) {
            const themeId = item.getAttribute('data-theme-id')
            if (themeId) {
              highlightedTheme = themeId
              updateThemeListHighlight()
            }
          }
        })
      }

      const updateThemeListHighlight = () => {
        const modalContainer = innerModal || themeModal
        themes.forEach(tName => {
          const checkRef = modalContainer.querySelector(`[data-testid$="check${tName.charAt(0).toUpperCase() + tName.slice(1)}"]`)
          if (checkRef) {
            if (tName === highlightedTheme) {
              checkRef.classList.remove('d-none')
            } else {
              checkRef.classList.add('d-none')
            }
          }
        })

        // Apply theme data-theme attribute to Live Preview window
        previewChatWindow.setAttribute('data-theme', highlightedTheme)

        if (highlightedTheme === 'custom') {
          customThemeControls.classList.remove('d-none')
          if (customUseBgImage) {
            bgSlidersContainer.classList.remove('d-none')
          } else {
            bgSlidersContainer.classList.add('d-none')
          }
          // Smoothly scroll the container to show custom options
          const themeListContainer = refs('themeListContainer')
          setTimeout(() => {
            themeListContainer.scrollTo({
              top: themeListContainer.scrollHeight,
              behavior: 'smooth'
            })
          }, 100)
        } else {
          customThemeControls.classList.add('d-none')
          bgSlidersContainer.classList.add('d-none')
        }

        updateLivePreviewStyles()
      }

      // Render the custom palette colors as clickable color swatches
      const renderPaletteSwatches = () => {
        if (!customPalette || customPalette.length === 0) {
          paletteContainer.classList.add('d-none')
          swatchList.innerHTML = ''
          return
        }

        paletteContainer.classList.remove('d-none')
        swatchList.innerHTML = ''

        customPalette.forEach(hex => {
          const swatch = document.createElement('div')
          swatch.style.width = '28px'
          swatch.style.height = '28px'
          swatch.style.borderRadius = '4px'
          swatch.style.backgroundColor = hex
          swatch.style.cursor = 'pointer'
          swatch.style.border = '2px solid transparent'
          swatch.title = hex
          swatch.setAttribute('data-color', hex)
          swatch.className = 'palette-swatch shadow-sm'

          if (hex === customSentBg || hex === customReceivedBg) {
            swatch.style.borderColor = '#000000'
          }

          // Clicking a swatch opens a small selection prompt or alternates Sent/Received selection
          swatch.addEventListener('click', () => {
            // Alternate applying to Sent and Received for fun custom customization
            const isSentSelection = confirm(`Apply ${hex} to Sent bubble? (Cancel applies to Received bubble)`)
            const compliance = ensureWCAGContrast(hex, 4.5)
            if (isSentSelection) {
              customSentBg = compliance.bgHex
              customSentColor = compliance.textColor
              customBtnSendBg = compliance.bgHex
              customBtnSendColor = compliance.textColor
              customWaveformActive = compliance.bgHex
              customWaveformInactive = hexToRgbaStr(compliance.bgHex, 0.2)
              customSentStatusColor = compliance.bgHex
            } else {
              customReceivedBg = compliance.bgHex
              customReceivedColor = compliance.textColor
              customAttachmentCardBg = compliance.bgHex
              customAttachmentCardBorder = hexToRgbaStr(compliance.bgHex, 0.15)
            }
            renderPaletteSwatches()
            updateLivePreviewStyles()
          })

          swatchList.appendChild(swatch)
        }, { signal })
      }

      // Helper to generate rgba string from hex
      const hexToRgbaStr = (hex, opacity) => {
        const cleanHex = hex.replace('#', '')
        const num = parseInt(cleanHex, 16)
        const r = (num >> 16) & 255
        const g = (num >> 8) & 255
        const b = num & 255
        return `rgba(${r}, ${g}, ${b}, ${opacity})`
      }

      // Live Preview custom style applicator
      const updateLivePreviewStyles = () => {
        // Synchronize data-theme attribute on preview chat window with highlightedTheme
        if (highlightedTheme) {
          previewChatWindow.setAttribute('data-theme', highlightedTheme)
        } else {
          previewChatWindow.removeAttribute('data-theme')
        }

        // Clear inline custom styles first
        previewChatWindow.style.backgroundImage = ''
        previewChatWindow.style.setProperty('--atoll-chat-bg-image', '')
        previewChatWindow.style.setProperty('--atoll-chat-bg-blur', '')
        previewChatWindow.style.setProperty('--atoll-chat-bg-dim', '')
  
        previewBubbleOutgoing.style.backgroundColor = ''
        previewBubbleOutgoing.style.color = ''
        previewBubbleIncoming.style.backgroundColor = ''
        previewBubbleIncoming.style.color = ''

        // Clear custom theme properties from live preview first
        previewChatWindow.style.removeProperty('--atoll-chat-sent-status-color')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-attach-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-attach-color')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-voice-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-voice-color')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-send-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-btn-send-color')
        previewChatWindow.style.removeProperty('--atoll-chat-waveform-active')
        previewChatWindow.style.removeProperty('--atoll-chat-waveform-inactive')
        previewChatWindow.style.removeProperty('--atoll-chat-attachment-card-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-attachment-card-border')

        // Clear extra variables in live preview
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-color')

        if (highlightedTheme === 'custom') {
          previewBubbleOutgoing.style.backgroundColor = customSentBg
          previewBubbleOutgoing.style.color = customSentColor
          previewBubbleIncoming.style.backgroundColor = customReceivedBg
          previewBubbleIncoming.style.color = customReceivedColor

          previewChatWindow.style.setProperty('--atoll-chat-sent-status-color', customSentStatusColor)
          previewChatWindow.style.setProperty('--atoll-chat-btn-attach-bg', customBtnAttachBg)
          previewChatWindow.style.setProperty('--atoll-chat-btn-attach-color', customBtnAttachColor)
          previewChatWindow.style.setProperty('--atoll-chat-btn-voice-bg', customBtnVoiceBg)
          previewChatWindow.style.setProperty('--atoll-chat-btn-voice-color', customBtnVoiceColor)
          previewChatWindow.style.setProperty('--atoll-chat-btn-send-bg', customBtnSendBg)
          previewChatWindow.style.setProperty('--atoll-chat-btn-send-color', customBtnSendColor)
          previewChatWindow.style.setProperty('--atoll-chat-waveform-active', customWaveformActive)
          previewChatWindow.style.setProperty('--atoll-chat-waveform-inactive', customWaveformInactive)
          previewChatWindow.style.setProperty('--atoll-chat-attachment-card-bg', customAttachmentCardBg)
          previewChatWindow.style.setProperty('--atoll-chat-attachment-card-border', customAttachmentCardBorder)

          if (customUseBgImage && customBgImage) {
            previewChatWindow.style.setProperty('--atoll-chat-bg-image', `url(${customBgImage})`)
            previewChatWindow.style.setProperty('--atoll-chat-bg-blur', `${customBgBlur}px`)
            previewChatWindow.style.setProperty('--atoll-chat-bg-dim', `${customBgDim / 100}`)

            // Set background inline using a generated dynamic linear-gradient or background rules for preview rendering
            previewChatWindow.style.backgroundImage = `linear-gradient(rgba(0,0,0, ${customBgDim / 100}), rgba(0,0,0, ${customBgDim / 100})), url(${customBgImage})`
            previewChatWindow.style.backgroundSize = 'cover'
            previewChatWindow.style.backgroundPosition = 'center'
            previewChatWindow.style.backdropFilter = `blur(${customBgBlur}px)`
          } else {
            previewChatWindow.style.backgroundImage = ''
            previewChatWindow.style.backdropFilter = ''
          }
        } else {
          // It's a pre-defined theme (classic, ocean, forest, sunset)
          const tokens = preDefinedThemeTokens[highlightedTheme]
          if (tokens) {
            previewChatWindow.style.setProperty('--atoll-chat-sent-status-color', tokens['sent-status-color'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-attach-bg', tokens['btn-attach-bg'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-attach-color', tokens['btn-attach-color'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-voice-bg', tokens['btn-voice-bg'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-voice-color', tokens['btn-voice-color'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-send-bg', tokens['btn-send-bg'])
            previewChatWindow.style.setProperty('--atoll-chat-btn-send-color', tokens['btn-send-color'])
            previewChatWindow.style.setProperty('--atoll-chat-waveform-active', tokens['waveform-active'])
            previewChatWindow.style.setProperty('--atoll-chat-waveform-inactive', tokens['waveform-inactive'])
            previewChatWindow.style.setProperty('--atoll-chat-attachment-card-bg', tokens['attachment-card-bg'])
            previewChatWindow.style.setProperty('--atoll-chat-attachment-card-border', tokens['attachment-card-border'])
          }
        }
      }

      // Handle image file uploads
      imageUploader.addEventListener('change', async (e) => {
        const file = e.target.files[0]
        if (!file) {
          return
        }

        $bus.emit('ui:show_toast', {
          message: 'Analyzing image...',
          type: 'info'
        })
  
        const reader = new FileReader()
        reader.onload = (event) => {
          offscreenImg.src = event.target.result
        }
        reader.readAsDataURL(file)
      }, { signal })

      // Offscreen image load event handler
      offscreenImg.onload = () => {
        // Create canvas to scale and extract palette
        const canvas = document.createElement('canvas')
        const maxDim = 800
        let w = offscreenImg.width
        let h = offscreenImg.height

        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w)
            w = maxDim
          } else {
            w = Math.round((w * maxDim) / h)
            h = maxDim
          }
        }

        canvas.width = w
        canvas.height = h
        const ctx = canvas.getContext('2d')
        if (ctx) {
          ctx.drawImage(offscreenImg, 0, 0, w, h)
  
          // Store compressed background JPEG
          customBgImage = canvas.toDataURL('image/jpeg', 0.7)

          // Extract initial Vibrant palette
          customPaletteModeIdx = 0
          customPalette = generateImagePalettes(canvas, 'vibrant')

          // Setup initial Sent and Received bubble colors
          if (customPalette && customPalette.length >= 2) {
            const complianceSent = ensureWCAGContrast(customPalette[0], 4.5)
            customSentBg = complianceSent.bgHex
            customSentColor = complianceSent.textColor
            customBtnSendBg = complianceSent.bgHex
            customBtnSendColor = complianceSent.textColor
            customWaveformActive = complianceSent.bgHex
            customWaveformInactive = hexToRgbaStr(complianceSent.bgHex, 0.2)
            customSentStatusColor = complianceSent.bgHex

            const complianceReceived = ensureWCAGContrast(customPalette[1], 4.5)
            customReceivedBg = complianceReceived.bgHex
            customReceivedColor = complianceReceived.textColor
            customAttachmentCardBg = complianceReceived.bgHex
            customAttachmentCardBorder = hexToRgbaStr(complianceReceived.bgHex, 0.15)
          }

          // Enable Custom Theme controls
          btnGeneratePalette.removeAttribute('disabled')
          btnRandomizeColors.removeAttribute('disabled')

          renderPaletteSwatches()
          updateLivePreviewStyles()

          $bus.emit('ui:show_toast', {
            message: 'Custom palette extracted successfully!',
            type: 'success'
          })
        }
      }

      // "Generate New Palette" Action Handler
      btnGeneratePalette.addEventListener('click', () => {
        if (!customBgImage) {
          return
        }

        // Cycle through our 4 distinct color extraction modes
        customPaletteModeIdx = (customPaletteModeIdx + 1) % paletteModes.length
        const mode = paletteModes[customPaletteModeIdx]

        // Sample offscreenImg using offscreen canvas representation
        const canvas = document.createElement('canvas')
        canvas.width = 100
        canvas.height = 100
        const ctx = canvas.getContext('2d')
        if (ctx) {
          ctx.drawImage(offscreenImg, 0, 0, 100, 100)
          customPalette = generateImagePalettes(canvas, mode)

          // Setup compliant Sent and Received colors from the new palette
          if (customPalette && customPalette.length >= 2) {
            const complianceSent = ensureWCAGContrast(customPalette[0], 4.5)
            customSentBg = complianceSent.bgHex
            customSentColor = complianceSent.textColor
            customBtnSendBg = complianceSent.bgHex
            customBtnSendColor = complianceSent.textColor
            customWaveformActive = complianceSent.bgHex
            customWaveformInactive = hexToRgbaStr(complianceSent.bgHex, 0.2)
            customSentStatusColor = complianceSent.bgHex

            const complianceReceived = ensureWCAGContrast(customPalette[1], 4.5)
            customReceivedBg = complianceReceived.bgHex
            customReceivedColor = complianceReceived.textColor
            customAttachmentCardBg = complianceReceived.bgHex
            customAttachmentCardBorder = hexToRgbaStr(complianceReceived.bgHex, 0.15)
          }

          renderPaletteSwatches()
          updateLivePreviewStyles()

          $bus.emit('ui:show_toast', {
            message: `Generated new ${mode} palette!`,
            type: 'info'
          })
        }
      }, { signal })

      // "Randomize Colors" Action Handler
      btnRandomizeColors.addEventListener('click', () => {
        if (!customPalette || customPalette.length < 2) {
          return
        }

        // Randomly pick two distinct colors from our active palette
        let idx1 = Math.floor(Math.random() * customPalette.length)
        let idx2 = Math.floor(Math.random() * customPalette.length)
        while (idx1 === idx2 && customPalette.length > 1) {
          idx2 = Math.floor(Math.random() * customPalette.length)
        }

        const color1 = customPalette[idx1]
        const color2 = customPalette[idx2]

        const complianceSent = ensureWCAGContrast(color1, 4.5)
        customSentBg = complianceSent.bgHex
        customSentColor = complianceSent.textColor
        customBtnSendBg = complianceSent.bgHex
        customBtnSendColor = complianceSent.textColor
        customWaveformActive = complianceSent.bgHex
        customWaveformInactive = hexToRgbaStr(complianceSent.bgHex, 0.2)
        customSentStatusColor = complianceSent.bgHex

        const complianceReceived = ensureWCAGContrast(color2, 4.5)
        customReceivedBg = complianceReceived.bgHex
        customReceivedColor = complianceReceived.textColor
        customAttachmentCardBg = complianceReceived.bgHex
        customAttachmentCardBorder = hexToRgbaStr(complianceReceived.bgHex, 0.15)

        renderPaletteSwatches()
        updateLivePreviewStyles()
      }, { signal })

      // Toggle Custom Background Image Switch
      useBgImageToggle.addEventListener('change', (e) => {
        customUseBgImage = e.target.checked
        if (customUseBgImage) {
          bgSlidersContainer.classList.remove('d-none')
        } else {
          bgSlidersContainer.classList.add('d-none')
        }
        updateLivePreviewStyles()
      }, { signal })

      // Background Blur slider update
      blurSlider.addEventListener('input', (e) => {
        customBgBlur = parseInt(e.target.value)
        blurValueText.textContent = `${customBgBlur}px`
        updateLivePreviewStyles()
      }, { signal })

      // Background Dimming slider update
      dimSlider.addEventListener('input', (e) => {
        customBgDim = parseInt(e.target.value)
        dimValueText.textContent = `${customBgDim}%`
        updateLivePreviewStyles()
      }, { signal })

      // Primary Button Select event callback
      themeModal.addEventListener('atoll-popup-primary', async () => {
        const room_id = $state.activeSelectionId
        $bus.emit('ui:show_toast', {
          message: 'Applying theme...',
          type: 'info'
        })
        try {
          const room = await $storage.getRoom(room_id)
          const roomKeyB64 = room.key_history?.find(h => h.epoch_id === 1)?.key
          if (!roomKeyB64) {
            throw new Error('Room secret key not found locally')
          }

          // Create the dynamic custom theme data block to sync via Room Metadata
          const customThemeObj = highlightedTheme === 'custom' ? {
            sentBg: customSentBg,
            sentColor: customSentColor,
            receivedBg: customReceivedBg,
            receivedColor: customReceivedColor,
            bgImage: customBgImage,
            bgBlur: customBgBlur,
            bgDim: customBgDim,
            useBgImage: customUseBgImage,
            palette: customPalette,
            sentStatusColor: customSentStatusColor,
            btnAttachBg: customBtnAttachBg,
            btnAttachColor: customBtnAttachColor,
            btnVoiceBg: customBtnVoiceBg,
            btnVoiceColor: customBtnVoiceColor,
            btnSendBg: customBtnSendBg,
            btnSendColor: customBtnSendColor,
            waveformActive: customWaveformActive,
            waveformInactive: customWaveformInactive,
            attachmentCardBg: customAttachmentCardBg,
            attachmentCardBorder: customAttachmentCardBorder
          } : (room.custom_theme || null)

          const metadata = JSON.stringify({
            name: room.name,
            avatar: room.avatar || '',
            theme: highlightedTheme,
            custom_theme: customThemeObj
          })

          const metadataNonce = await $worker.execute('worker:randombytes_buf', { length: 24 })
          const encryptedMetadata = await $worker.execute('worker:crypto_secretbox_easy', {
            message: metadata,
            nonce: metadataNonce.slice(),
            key: roomKeyB64
          })

          await pb.collection('rooms').update(room.id, {
            theme: highlightedTheme,
            encrypted_metadata: {
              ciphertext: $crypto.toBase64(encryptedMetadata),
              nonce: $crypto.toBase64(metadataNonce)
            }
          })

          room.theme = highlightedTheme
          room.custom_theme = customThemeObj
          await $storage.saveRoom(room)

          $bus.emit('room:theme_updated', {
            room_id,
            theme: highlightedTheme
          })
          $bus.emit('room:member_updated', { room_id })
          $bus.emit('db:new_local_room', { room_id })
          $bus.emit('ui:show_toast', {
            message: `Theme updated to ${highlightedTheme}`,
            type: 'success'
          })
          themeModal.hide()
        } catch (err) {
          console.error('[atoll-theme-selector-modal] Failed to save theme:', err)
          alert('Failed to save theme: ' + err.message)
        }
      })
    }
  })
</script>
