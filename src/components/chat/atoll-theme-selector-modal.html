            </span>
            <span slot="right" class="theme-check-icon d-none" ref="checkOcean" data-testid="checkOcean">
              <atoll-icon name="check" size="18" color="var(--atoll-brand-primary, #06C755)"></atoll-icon>
            </span>

            <div class="message-bubble atoll-chat-bubble-received p-2 rounded-3 text-start shadow-sm" ref="previewBubbleIncoming" style="position: relative;">

                  <svg viewBox="0 0 100 24" style="width: 240px; height: 100%; fill: var(--atoll-chat-waveform-active, var(--bs-primary, #06C755));" class="preview-waveform-active-svg">

                <div style="position: absolute; top: 0; left: 45%; width: 2px; height: 100%; background-color: var(--atoll-chat-waveform-active, var(--bs-primary, #06C755));"></div>
              </div>
              <span class="x-small font-monospace" style="color: var(--atoll-chat-text-muted, #999999);">0:08</span>
            </div>
          </div>

          <!-- Sent Bubble -->
          <div class="align-self-end d-flex flex-column align-items-end gap-1" style="max-width: 80%; z-index: 2;">
            <div class="message-bubble atoll-chat-bubble-sent p-2 rounded-3 text-end shadow-sm" ref="previewBubbleOutgoing">
              Wow, this live preview looks amazing!
            </div>
            <!-- Sent Status Indicator -->

              <input type="text" class="form-control form-control-sm rounded-pill" placeholder="Type a message..." disabled style="background-color: var(--atoll-chat-input-bg, #F5F5F5); color: var(--atoll-chat-input-color, #111111); border: 1px solid transparent; padding-right: 32px; font-size: 0.8rem; height: 28px;">

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({}),
    getters: {},
    client: async ({ root, refs, globalStore, storage, pocketbase, utils, signal, eventBus, cryptoWorker }) => {
      const { hexToRgb, rgbToHex, getRelativeLuminance, ensureWCAGContrast, ensureForegroundContrast, generateImagePalettes, getAverageColor, generateThemeImageVariants } = await import('../../utils/color-contrast.js')
      const { compositeColor } = await import('../../utils/chat-theme-contrast.js')
      const { $state } = globalStore
      const { $storage } = storage
      const { $bus } = eventBus
      const { pb } = pocketbase || {}
      const { $worker } = cryptoWorker
      const { $crypto } = utils

      /**
       * Helper to resolve template refs safely across slotted component boundaries.
       * @param {string} name - The ref name to resolve.
       * @returns {Element|null} The resolved DOM element.
       */
      const getRef = (name) => refs(name) || root.querySelector(`[ref$="${name}"], [ref="${name}"]`)

      let highlightedTheme = 'classic'
      let isSaving = false
      let isControlListenersBound = false
      const themes = ['classic', 'ocean', 'forest', 'sunset', 'custom']

      // Structured Token Definitions for Predefined themes to synchronize live preview perfectly
      const preDefinedThemeTokens = {
        classic: {
          'text-primary': 'var(--atoll-text-primary, #111111)',
          'text-secondary': '#525252',
          'text-muted': '#525252',
          'accent': 'var(--atoll-brand-primary, #047835)',
          'surface-glass': 'rgba(255, 255, 255, 0.8)',
          'border': 'var(--atoll-border-color-translucent, rgba(0, 0, 0, 0.08))'
        },
        ocean: {
          'text-primary': '#ffffff',
          'text-secondary': 'rgba(255, 255, 255, 0.85)',
          'text-muted': 'rgba(255, 255, 255, 0.7)',
          'accent': '#00d2ff',
          'surface-glass': 'rgba(15, 32, 39, 0.75)',
          'border': 'rgba(255, 255, 255, 0.15)'
        },
        forest: {
          'text-primary': '#ffffff',
          'text-secondary': 'rgba(255, 255, 255, 0.85)',
          'text-muted': 'rgba(255, 255, 255, 0.7)',
          'accent': '#38ef7d',
          'surface-glass': 'rgba(10, 45, 35, 0.70)',
          'border': 'rgba(255, 255, 255, 0.18)'
        },
        sunset: {
          'text-primary': '#ffffff',
          'text-secondary': 'rgba(255, 255, 255, 0.85)',
          'text-muted': 'rgba(255, 255, 255, 0.7)',
          'accent': '#f5af19',
          'surface-glass': 'rgba(40, 10, 15, 0.65)',
          'border': 'rgba(255, 255, 255, 0.2)'
        }
      }

      // Custom theme state variables
      let customBgColor = '#FFFFFF'
      let customBgImage = null
      let customBgImages = null
      let customBgBlur = 5
      let customBgDim = 30
      let customUseBgImage = true
      let customPalette = []
      let customPaletteModeIdx = 0
      const paletteModes = ['vibrant', 'muted', 'pastel', 'deep']
  
      let customSentBg = '#06C755'
      let customSentColor = '#FFFFFF'
      let customSentLinkColor = '#FFFFFF'
      let customSentTimestampColor = '#FFFFFF'
      let customReceivedBg = '#EEEEEE'
      let customReceivedColor = '#111111'
      let customReceivedLinkColor = '#06C755'
      let customReceivedTimestampColor = '#111111'

      let customSenderNameColor = '#111111'
      let customTimestampColor = '#111111'
      let selectedSwatchColor = null

      // Derivable sub-colors
      let customSentStatusColor = '#999999'
      let customHeaderColor = '#111111'
      let customHeaderSubtitleColor = '#595959'
      let customBtnAttachBg = 'transparent'
      let customBtnAttachColor = '#777777'
      let customBtnVoiceBg = 'transparent'
      let customBtnVoiceColor = '#777777'
      let customBtnSendBg = '#06C755'
      let customBtnSendColor = '#FFFFFF'
      let customInputBg = '#F5F5F5'
      let customInputColor = '#111111'
      let customInputPlaceholderColor = '#595959'
      let customInputEmojiColor = '#595959'
      let customDateSeparatorColor = '#111111'
      let customDateSeparatorBorder = 'rgba(0, 0, 0, 0.08)'
      let customReactionPillColor = '#111111'
      let customReactionPillBorder = 'rgba(0, 0, 0, 0.08)'
      let customWaveformActive = '#06C755'
      let customWaveformInactive = 'rgba(6, 199, 85, 0.2)'
      let customAttachmentCardBg = '#EEEEEE'
      let customAttachmentCardBorder = 'rgba(0, 0, 0, 0.08)'

      // Create an offscreen image object to parse uploaded files safely if Image is available
      const offscreenImg = typeof Image !== 'undefined' ? new Image() : null

      /**
       * Binds event listeners to template controls.
       */
      const bindControlListeners = () => {
        if (isControlListenersBound) {
          return
        }
        isControlListenersBound = true

        getRef('themeListContainer').addEventListener('click', (e) => {
          const item = e.target.closest('atoll-list-item')
          if (item) {
            const themeId = item.getAttribute('data-theme-id')
            if (themeId) {
              highlightedTheme = themeId
              updateThemeListHighlight()
            }
          }
        }, { signal })

        getRef('btnApplySent').addEventListener('click', () => {
          if (!selectedSwatchColor) {
            return
          }
          customSentBg = selectedSwatchColor
          normalizeCustomThemeContrast()
          renderPaletteSwatches()
          updateLivePreviewStyles()
        }, { signal })

        getRef('btnApplyReceived').addEventListener('click', () => {
          if (!selectedSwatchColor) {
            return
          }
          customReceivedBg = selectedSwatchColor
          normalizeCustomThemeContrast()
          renderPaletteSwatches()
          updateLivePreviewStyles()
        }, { signal })

        getRef('btnApplyBackground').addEventListener('click', () => {
          if (!selectedSwatchColor) {
            return
          }
          customBgColor = selectedSwatchColor
          normalizeCustomThemeContrast()
          renderPaletteSwatches()
          updateLivePreviewStyles()
        }, { signal })

        const imageUploader = getRef('imageUploader')
        imageUploader.addEventListener('change', async (e) => {
          const file = e.target.files[0]
          if (!file) {
            return
          }

          if (!file.type.startsWith('image/')) {
            $bus.emit('ui:show_toast', {
              message: 'Please select a valid image file.',
              type: 'danger'
            })
            imageUploader.value = ''
            return
          }

          if (file.size > 10 * 1024 * 1024) {
            $bus.emit('ui:show_toast', {
              message: 'Image size must be under 10MB.',
              type: 'danger'
            })
            imageUploader.value = ''
            return
          }

          $bus.emit('ui:show_toast', {
            message: 'Analyzing image...',
            type: 'info'
          })
  
          const reader = new FileReader()
          reader.onload = (event) => {
            if (offscreenImg) {
              offscreenImg.src = event.target.result
            }
          }
          reader.readAsDataURL(file)
        }, { signal })

        getRef('btnGeneratePalette').addEventListener('click', () => {
          if (!customBgImage || !offscreenImg) {
            return
          }

          customPaletteModeIdx = (customPaletteModeIdx + 1) % paletteModes.length
          const mode = paletteModes[customPaletteModeIdx]

          const canvas = document.createElement('canvas')
          canvas.width = 100
          canvas.height = 100
          const ctx = canvas.getContext('2d')
          if (ctx) {
            ctx.drawImage(offscreenImg, 0, 0, 100, 100)
            customPalette = generateImagePalettes(canvas, mode)

            if (customPalette && customPalette.length >= 2) {
              customSentBg = customPalette[0]
              customReceivedBg = customPalette[1]
              normalizeCustomThemeContrast()
            }

            renderPaletteSwatches()
            updateLivePreviewStyles()

            $bus.emit('ui:show_toast', {
              message: `Generated new ${mode} palette!`,
              type: 'info'
            })
          }
        }, { signal })

        getRef('btnRandomizeColors').addEventListener('click', () => {
          if (!customPalette || customPalette.length < 2) {
            return
          }

          let idx1 = Math.floor(Math.random() * customPalette.length)
          let idx2 = Math.floor(Math.random() * customPalette.length)
          while (idx1 === idx2 && customPalette.length > 1) {
            idx2 = Math.floor(Math.random() * customPalette.length)
          }

          customSentBg = customPalette[idx1]
          customReceivedBg = customPalette[idx2]
          normalizeCustomThemeContrast()

          renderPaletteSwatches()
          updateLivePreviewStyles()
        }, { signal })

        const useBgImageToggle = getRef('useBgImageToggle')
        useBgImageToggle.addEventListener('change', (e) => {
          customUseBgImage = e.target.checked
          const bgSlidersContainer = getRef('bgSlidersContainer')
          if (customUseBgImage) {
            bgSlidersContainer.classList.remove('d-none')
          } else {
            bgSlidersContainer.classList.add('d-none')
          }
          updateLivePreviewStyles()
        }, { signal })

        const blurSlider = getRef('blurSlider')
        blurSlider.addEventListener('input', (e) => {
          customBgBlur = parseInt(e.target.value)
          blurSlider.setAttribute('aria-valuenow', customBgBlur)
          getRef('blurValueText').textContent = `${customBgBlur}px`
          updateLivePreviewStyles()
        }, { signal })

        const dimSlider = getRef('dimSlider')
        dimSlider.addEventListener('input', (e) => {
          customBgDim = parseInt(e.target.value)
          dimSlider.setAttribute('aria-valuenow', customBgDim)
          getRef('dimValueText').textContent = `${customBgDim}%`
          updateLivePreviewStyles()
        }, { signal })

        getRef('themeModal').addEventListener('atoll-popup-primary', async () => {
          if (isSaving) {
            return
          }
          isSaving = true

          const room_id = $state.activeSelectionId
          $bus.emit('ui:show_toast', {
            message: 'Applying theme...',
            type: 'info'
          })
          try {
            const room = await $storage.getRoom(room_id)
            const roomKeyB64 = room?.key_history?.find(h => h.epoch_id === 1)?.key
            if (!roomKeyB64) {
              throw new Error('Room secret key not found locally')
            }

            const customThemeObj = highlightedTheme === 'custom' ? {
              bgColor: customBgColor,
              sentBg: customSentBg,
              sentColor: customSentColor,
              sentLinkColor: customSentLinkColor,
              sentTimestampColor: customSentTimestampColor,
              receivedBg: customReceivedBg,
              receivedColor: customReceivedColor,
              receivedLinkColor: customReceivedLinkColor,
              receivedTimestampColor: customReceivedTimestampColor,
              bgImage: customBgImage,
              bgImages: customBgImages,
              bgBlur: customBgBlur,
              bgDim: customBgDim,
              useBgImage: customUseBgImage,
              palette: customPalette,
              sentStatusColor: customSentStatusColor,
              senderNameColor: customSenderNameColor,
              timestampColor: customReceivedTimestampColor,
              headerColor: customHeaderColor,
              headerSubtitleColor: customHeaderSubtitleColor,
              btnAttachBg: customBtnAttachBg,
              btnAttachColor: customBtnAttachColor,
              btnVoiceBg: customBtnVoiceBg,
              btnVoiceColor: customBtnVoiceColor,
              btnSendBg: customBtnSendBg,
              btnSendColor: customBtnSendColor,
              inputBg: customInputBg,
              inputColor: customInputColor,
              inputPlaceholderColor: customInputPlaceholderColor,
              inputEmojiColor: customInputEmojiColor,
              dateSeparatorColor: customDateSeparatorColor,
              dateSeparatorBorder: customDateSeparatorBorder,
              reactionPillColor: customReactionPillColor,
              reactionPillBorder: customReactionPillBorder,
              waveformActive: customWaveformActive,
              waveformInactive: customWaveformInactive,
              attachmentCardBg: customAttachmentCardBg,
              attachmentCardBorder: customAttachmentCardBorder
            } : (room?.custom_theme || null)

            let settingsRecord = null
            if (pb?.collection) {
              try {
                settingsRecord = await pb.collection('room_settings').getFirstListItem(
                  `room_id="${room_id}" && user_id="${$state.currentUser?.id}"`, { requestKey: null }
                )
              } catch {
              }
            }

            let nicknames = room?.nicknames || {}
            let read_receipts = room?.read_receipts !== false
            if (settingsRecord?.settings?.ciphertext) {
              try {
                const decryptedBytes = await $worker.execute('worker:crypto_secretbox_open_easy', {
                  ciphertext: settingsRecord.settings.ciphertext,
                  nonce: settingsRecord.settings.nonce,
                  key: roomKeyB64
                })
                if (decryptedBytes) {
                  const decodedStr = new TextDecoder().decode(decryptedBytes)
                  const settingsObj = JSON.parse(decodedStr)
                  if (settingsObj.nicknames) {
                    nicknames = settingsObj.nicknames
                  }
                  if (settingsObj.read_receipts !== undefined) {
                    read_receipts = settingsObj.read_receipts !== false
                  }
                }
              } catch (decErr) {
                console.warn('[atoll-theme-selector-modal] Decrypting existing settings failed:', decErr)
              }
            }

            const payloadStr = JSON.stringify({
              nicknames,
              read_receipts,
              theme: highlightedTheme,
              custom_theme: customThemeObj
            })

            const nonceBytes = await $worker.execute('worker:randombytes_buf', { length: 24 })
            const encryptedBytes = await $worker.execute('worker:crypto_secretbox_easy', {
              message: payloadStr,
              nonce: nonceBytes.slice(),
              key: roomKeyB64
            })

            const encryptedPayload = {
              ciphertext: $crypto.toBase64(encryptedBytes),
              nonce: $crypto.toBase64(nonceBytes)
            }

            if (pb?.collection) {
              if (settingsRecord) {
                await pb.collection('room_settings').update(settingsRecord.id, {
                  settings: encryptedPayload
                })
              } else {
                await pb.collection('room_settings').create({
                  room_id,
                  user_id: $state.currentUser?.id,
                  is_muted: false,
                  settings: encryptedPayload
                })
              }
            }

            room.theme = highlightedTheme
            room.custom_theme = customThemeObj
            await $storage.saveRoom(room)

            $bus.emit('room:theme_updated', {
              room_id,
              theme: highlightedTheme,
              custom_theme: customThemeObj
            })
            $bus.emit('room:member_updated', { room_id })
            $bus.emit('db:new_local_room', { room_id })
            $bus.emit('ui:show_toast', {
              message: `Theme updated to ${highlightedTheme}`,
              type: 'success'
            })
            getRef('themeModal').hide()
          } catch (err) {
            $bus.emit('ui:show_toast', {
              message: 'Failed to save theme: ' + err.message,
              type: 'danger'
            })
          } finally {
            isSaving = false
          }
        }, { signal })
      }

      /**
       * Opens the theme selector modal and hydrates room theme settings.
       * @returns {Promise<void>}
       */
      const showModal = async () => {
        const room = await $storage.getRoom($state.activeSelectionId)
        highlightedTheme = room?.theme || 'classic'

        selectedSwatchColor = null

        // Hydrate from existing custom theme settings if they exist
        if (room?.custom_theme) {
          const ct = room.custom_theme
          customBgColor = ct.bgColor || '#FFFFFF'
          customBgImages = ct.bgImages || (ct.bgImage ? {
            sm: ct.bgImage,
            md: ct.bgImage,
            lg: ct.bgImage
          } : null)
          customBgImage = ct.bgImage || (customBgImages ? (customBgImages.lg || customBgImages.md || customBgImages.sm) : null)
          customBgBlur = ct.bgBlur !== undefined ? ct.bgBlur : 5
          customBgDim = ct.bgDim !== undefined ? ct.bgDim : 30
          customUseBgImage = ct.useBgImage !== undefined ? !!ct.useBgImage : true
          customPalette = ct.palette || []
          customSentBg = ct.sentBg || '#06C755'
          customSentColor = ct.sentColor || '#FFFFFF'
          customSentLinkColor = ct.sentLinkColor || ct.sentColor || '#FFFFFF'
          customSentTimestampColor = ct.sentTimestampColor || ct.sentColor || '#FFFFFF'
          customReceivedBg = ct.receivedBg || '#EEEEEE'
          customReceivedColor = ct.receivedColor || '#111111'
          customReceivedLinkColor = ct.receivedLinkColor || ct.waveformActive || '#06C755'
          customReceivedTimestampColor = ct.receivedTimestampColor || ct.receivedColor || '#111111'
          customSenderNameColor = ct.senderNameColor || '#111111'
          customTimestampColor = ct.timestampColor || '#111111'
          customSentStatusColor = ct.sentStatusColor || '#999999'
          customHeaderColor = ct.headerColor || '#111111'
          customHeaderSubtitleColor = ct.headerSubtitleColor || '#595959'
          customBtnAttachBg = ct.btnAttachBg || 'transparent'
          customBtnAttachColor = ct.btnAttachColor || '#777777'
          customBtnVoiceBg = ct.btnVoiceBg || 'transparent'
          customBtnVoiceColor = ct.btnVoiceColor || '#777777'
          customBtnSendBg = ct.btnSendBg || '#06C755'
          customBtnSendColor = ct.btnSendColor || '#FFFFFF'
          customInputBg = ct.inputBg || '#F5F5F5'
          customInputColor = ct.inputColor || '#111111'
          customInputPlaceholderColor = ct.inputPlaceholderColor || '#595959'
          customInputEmojiColor = ct.inputEmojiColor || '#595959'
          customDateSeparatorColor = ct.dateSeparatorColor || '#111111'
          customDateSeparatorBorder = ct.dateSeparatorBorder || 'rgba(0, 0, 0, 0.08)'
          customReactionPillColor = ct.reactionPillColor || '#111111'
          customReactionPillBorder = ct.reactionPillBorder || 'rgba(0, 0, 0, 0.08)'
          customWaveformActive = ct.waveformActive || '#06C755'
          customWaveformInactive = ct.waveformInactive || 'rgba(6, 199, 85, 0.2)'
          customAttachmentCardBg = ct.attachmentCardBg || '#EEEEEE'
          customAttachmentCardBorder = ct.attachmentCardBorder || 'rgba(0, 0, 0, 0.08)'
        } else {
          // Reset custom theme state if none exist
          customBgColor = '#FFFFFF'
          customBgImage = null
          customBgImages = null
          customBgBlur = 5
          customBgDim = 30
          customUseBgImage = true
          customPalette = []
          customSentBg = '#06C755'
          customSentColor = '#FFFFFF'
          customSentLinkColor = '#FFFFFF'
          customSentTimestampColor = '#FFFFFF'
          customReceivedBg = '#EEEEEE'
          customReceivedColor = '#111111'
          customReceivedLinkColor = '#06C755'
          customReceivedTimestampColor = '#111111'
          customSenderNameColor = '#111111'
          customTimestampColor = '#111111'
          customSentStatusColor = '#999999'
          customHeaderColor = '#111111'
          customHeaderSubtitleColor = '#595959'
          customBtnAttachBg = 'transparent'
          customBtnAttachColor = '#777777'
          customBtnVoiceBg = 'transparent'
          customBtnVoiceColor = '#777777'
          customBtnSendBg = '#06C755'
          customBtnSendColor = '#FFFFFF'
          customInputBg = '#F5F5F5'
          customInputColor = '#111111'
          customInputPlaceholderColor = '#595959'
          customInputEmojiColor = '#595959'
          customDateSeparatorColor = '#111111'
          customDateSeparatorBorder = 'rgba(0, 0, 0, 0.08)'
          customReactionPillColor = '#111111'
          customReactionPillBorder = 'rgba(0, 0, 0, 0.08)'
          customWaveformActive = '#06C755'
          customWaveformInactive = 'rgba(6, 199, 85, 0.2)'
          customAttachmentCardBg = '#EEEEEE'
          customAttachmentCardBorder = 'rgba(0, 0, 0, 0.08)'
        }

        bindControlListeners()

        getRef('swatchActionsContainer').classList.add('d-none')
        getRef('imageUploader').value = ''

        // Apply state values to UI controls
        const blurSlider = getRef('blurSlider')
        blurSlider.value = customBgBlur
        blurSlider.setAttribute('aria-valuenow', customBgBlur)
        getRef('blurValueText').textContent = `${customBgBlur}px`

        const dimSlider = getRef('dimSlider')
        dimSlider.value = customBgDim
        dimSlider.setAttribute('aria-valuenow', customBgDim)
        getRef('dimValueText').textContent = `${customBgDim}%`

        getRef('useBgImageToggle').checked = customUseBgImage

        const btnGeneratePalette = getRef('btnGeneratePalette')
        const btnRandomizeColors = getRef('btnRandomizeColors')
        const paletteContainer = getRef('paletteContainer')
        const swatchList = getRef('swatchList')

        if (customBgImage) {
          btnGeneratePalette.removeAttribute('disabled')
          btnRandomizeColors.removeAttribute('disabled')
          renderPaletteSwatches()
        } else {
          btnGeneratePalette.setAttribute('disabled', 'true')
          btnRandomizeColors.setAttribute('disabled', 'true')
          paletteContainer.classList.add('d-none')
          swatchList.innerHTML = ''
        }

        updateThemeListHighlight()
        getRef('themeModal').show()
      }

      /**
       * Hides the theme selector modal popup.
       */
      const hideModal = () => {
        getRef('themeModal').hide()
      }

      // Expose public methods on component host root
      root.show = showModal
      root.hide = hideModal

      // Listen for open event
      $bus.on('ui:open_theme_modal', showModal)

      /**
       * Synchronizes theme list selection checkmarks and toggles custom controls.
       */
      const updateThemeListHighlight = () => {
        const checkRefs = {
          classic: getRef('checkClassic'),
          ocean: getRef('checkOcean'),
          forest: getRef('checkForest'),
          sunset: getRef('checkSunset'),
          custom: getRef('checkCustom')
        }

        themes.forEach(tName => {
          const checkRef = checkRefs[tName]
          if (checkRef) {
            if (tName === highlightedTheme) {
              checkRef.classList.remove('d-none')
            } else {
              checkRef.classList.add('d-none')
            }
          }
        })

        const previewChatWindow = getRef('previewChatWindow')
        previewChatWindow.setAttribute('data-theme', highlightedTheme)

        const customThemeControls = getRef('customThemeControls')
        const bgSlidersContainer = getRef('bgSlidersContainer')
        const themeListContainer = getRef('themeListContainer')

        if (highlightedTheme === 'custom') {
          customThemeControls.classList.remove('d-none')
          if (customUseBgImage) {
            bgSlidersContainer.classList.remove('d-none')
          } else {
            bgSlidersContainer.classList.add('d-none')
          }
          themeListContainer.scrollTo({
            top: themeListContainer.scrollHeight,
            behavior: 'smooth'
          })
        } else {
          customThemeControls.classList.add('d-none')
          bgSlidersContainer.classList.add('d-none')
        }

        updateLivePreviewStyles()
      }

      /**
       * Renders palette swatches as keyboard-accessible interactive buttons.
       */
      const renderPaletteSwatches = () => {
        const paletteContainer = getRef('paletteContainer')
        const swatchList = getRef('swatchList')
        const swatchActionsContainer = getRef('swatchActionsContainer')
        const selectedColorText = getRef('selectedColorText')

        if (!customPalette || customPalette.length === 0) {
          paletteContainer.classList.add('d-none')
          swatchList.innerHTML = ''
          return
        }

        paletteContainer.classList.remove('d-none')
        swatchList.innerHTML = ''

        customPalette.forEach(hex => {
          const swatch = document.createElement('div')
          swatch.style.width = '28px'
          swatch.style.height = '28px'
          swatch.style.borderRadius = '4px'
          swatch.style.backgroundColor = hex
          swatch.style.cursor = 'pointer'
          swatch.style.border = '2px solid transparent'
          swatch.title = hex
          swatch.setAttribute('data-color', hex)
          swatch.setAttribute('role', 'button')
          swatch.setAttribute('tabindex', '0')
          swatch.setAttribute('aria-label', `Color ${hex}`)
          const isSelected = hex === selectedSwatchColor
          swatch.setAttribute('aria-pressed', isSelected ? 'true' : 'false')
          swatch.className = 'palette-swatch shadow-sm'

          if (hex === customSentBg || hex === customReceivedBg || hex === customBgColor) {
            swatch.style.borderColor = '#000000'
          }
          if (isSelected) {
            swatch.style.borderColor = 'var(--atoll-brand-primary, #06C755)'
            swatch.style.transform = 'scale(1.15)'
          }

          const handleSelect = () => {
            selectedSwatchColor = hex
            selectedColorText.textContent = hex
            selectedColorText.style.color = hex
            swatchActionsContainer.classList.remove('d-none')
            renderPaletteSwatches()
          }

          swatch.addEventListener('click', handleSelect, { signal })
          swatch.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault()
              handleSelect()
            }
          }, { signal })

          swatchList.appendChild(swatch)
        })
      }

      /**
       * Normalizes custom theme foreground colors for WCAG 2.2 AA contrast compliance.
       */
      const normalizeCustomThemeContrast = () => {
        // Canvas Background & Luminance
        const rgbBg = compositeColor(customBgColor, '#FFFFFF')
        const rgbBgHex = rgbToHex(rgbBg[0], rgbBg[1], rgbBg[2])
        const bgLuminance = getRelativeLuminance(rgbBg[0], rgbBg[1], rgbBg[2])

        // Glassy Fill Selection & Compositing
        const glassyBgHex = bgLuminance < 0.5 ? 'rgba(31, 31, 31, 0.75)' : 'rgba(255, 255, 255, 0.75)'
        const glassyFill = compositeColor(glassyBgHex, rgbBg)
        const glassyFillHex = rgbToHex(glassyFill[0], glassyFill[1], glassyFill[2])

        //  Sent Bubble Normalization
        const compSent = ensureWCAGContrast(customSentBg, 4.5)
        customSentBg = compSent.bgHex
        customSentColor = compSent.textColor
        customSentLinkColor = ensureForegroundContrast(customSentColor, customSentBg, 4.5)
        customSentTimestampColor = ensureForegroundContrast(customSentColor, customSentBg, 4.5)

        // Received Bubble Normalization
        const compReceived = ensureWCAGContrast(customReceivedBg, 4.5)
        customReceivedBg = compReceived.bgHex
        customReceivedColor = compReceived.textColor
        customReceivedLinkColor = ensureForegroundContrast(customWaveformActive || customSentBg, customReceivedBg, 4.5)
        customReceivedTimestampColor = ensureForegroundContrast(customReceivedColor, customReceivedBg, 4.5)

        // Canvas Direct Elements (Sender name & Sent status vs Canvas BG)
        const baseCanvasText = bgLuminance < 0.5 ? '#FFFFFF' : '#111111'
        customSenderNameColor = ensureForegroundContrast(baseCanvasText, rgbBgHex, 4.5)
        customSentStatusColor = ensureForegroundContrast(baseCanvasText, rgbBgHex, 4.5)

        // Floating Glassy Container Elements (Header, Icons, Pills vs Glassy Fill)
        customHeaderColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)
        customHeaderSubtitleColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)
        customBtnAttachColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)
        customBtnVoiceColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)
        customDateSeparatorColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)
        customReactionPillColor = ensureForegroundContrast(baseCanvasText, glassyFillHex, 4.5)

        // Input Container Bar (Input field vs Input BG)
        customInputBg = bgLuminance < 0.5 ? '#2A2A2A' : '#F5F5F5'
        const solidInputBg = compositeColor(customInputBg, glassyFill)
        const solidInputBgHex = rgbToHex(solidInputBg[0], solidInputBg[1], solidInputBg[2])
        customInputColor = ensureForegroundContrast(baseCanvasText, solidInputBgHex, 4.5)
        customInputPlaceholderColor = ensureForegroundContrast(bgLuminance < 0.5 ? '#B0B0B0' : '#595959', solidInputBgHex, 4.5)
        customInputEmojiColor = ensureForegroundContrast(bgLuminance < 0.5 ? '#B0B0B0' : '#595959', solidInputBgHex, 4.5)

        customBtnSendBg = customSentBg
        customBtnSendColor = customSentColor

        // Attachment Card & Graphical Components
        customAttachmentCardBg = bgLuminance < 0.5 ? 'rgba(31, 31, 31, 0.75)' : 'rgba(255, 255, 255, 0.75)'
        const solidCardBg = compositeColor(customAttachmentCardBg, glassyFill)
        const solidCardBgHex = rgbToHex(solidCardBg[0], solidCardBg[1], solidCardBg[2])

        // Graphical UI elements (target >= 3.0:1)
        customWaveformActive = ensureForegroundContrast(customSentBg, solidCardBgHex, 3.0)
        customWaveformInactive = ensureForegroundContrast(bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.35)' : 'rgba(17, 17, 17, 0.25)', solidCardBgHex, 3.0)
        customAttachmentCardBorder = ensureForegroundContrast(bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.15)', glassyFillHex, 3.0)
        customDateSeparatorBorder = ensureForegroundContrast(bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.15)', glassyFillHex, 3.0)
        customReactionPillBorder = ensureForegroundContrast(bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.15)', glassyFillHex, 3.0)
      }

      /**
       * Updates the live preview window styles and CSS custom properties.
       */
      const updateLivePreviewStyles = () => {
        const previewChatWindow = getRef('previewChatWindow')
        const previewBgPicture = getRef('previewBgPicture')
        const previewBgSourceLg = getRef('previewBgSourceLg')
        const previewBgSourceMd = getRef('previewBgSourceMd')

        if (highlightedTheme) {
          previewChatWindow.setAttribute('data-theme', highlightedTheme)

        // Clear inline custom styles first
        previewChatWindow.style.backgroundImage = ''
        previewChatWindow.style.backgroundColor = ''

        previewChatWindow.style.removeProperty('--atoll-chat-bg-image')
        previewChatWindow.style.removeProperty('--atoll-chat-bg-blur')

        if (previewBgPicture) {

        }
  
        const previewBubbleOutgoing = getRef('previewBubbleOutgoing')
        const previewBubbleIncoming = getRef('previewBubbleIncoming')

        previewBubbleOutgoing.style.backgroundColor = ''
        previewBubbleOutgoing.style.color = ''
        previewBubbleIncoming.style.backgroundColor = ''
        previewBubbleIncoming.style.color = ''

        previewChatWindow.style.removeProperty('--atoll-chat-text-primary')
        previewChatWindow.style.removeProperty('--atoll-chat-text-secondary')
        previewChatWindow.style.removeProperty('--atoll-chat-text-muted')
        previewChatWindow.style.removeProperty('--atoll-chat-accent')
        previewChatWindow.style.removeProperty('--atoll-chat-surface-glass')
        previewChatWindow.style.removeProperty('--atoll-chat-border')

        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-link-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-timestamp-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-sent-status-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-bg')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-link-color')
        previewChatWindow.style.removeProperty('--atoll-chat-bubble-received-timestamp-color')

        if (highlightedTheme === 'custom') {
          previewBubbleOutgoing.style.backgroundColor = customSentBg
          previewBubbleOutgoing.style.color = customSentColor
          previewBubbleIncoming.style.backgroundColor = customReceivedBg
          previewBubbleIncoming.style.color = customReceivedColor

          previewChatWindow.style.setProperty('--atoll-chat-bg', customBgColor)
          previewChatWindow.style.backgroundColor = customBgColor

          const rgbBg = compositeColor(customBgColor, '#FFFFFF')
          const bgLuminance = getRelativeLuminance(rgbBg[0], rgbBg[1], rgbBg[2])

          previewChatWindow.style.setProperty('--atoll-chat-text-primary', bgLuminance < 0.5 ? '#FFFFFF' : '#111111')
          previewChatWindow.style.setProperty('--atoll-chat-text-secondary', bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.75)' : '#525252')
          previewChatWindow.style.setProperty('--atoll-chat-text-muted', bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.6)' : '#767676')
          previewChatWindow.style.setProperty('--atoll-chat-accent', customSentBg || '#06C755')
          previewChatWindow.style.setProperty('--atoll-chat-surface-glass', bgLuminance < 0.5 ? 'rgba(31, 31, 31, 0.8)' : 'rgba(255, 255, 255, 0.8)')
          previewChatWindow.style.setProperty('--atoll-chat-border', bgLuminance < 0.5 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)')

          previewChatWindow.style.setProperty('--atoll-chat-bubble-sent-bg', customSentBg)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-sent-color', customSentColor)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-sent-link-color', customSentLinkColor)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-sent-timestamp-color', customSentTimestampColor)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-sent-status-color', customSentStatusColor)

          previewChatWindow.style.setProperty('--atoll-chat-bubble-received-bg', customReceivedBg)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-received-color', customReceivedColor)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-received-link-color', customReceivedLinkColor)
          previewChatWindow.style.setProperty('--atoll-chat-bubble-received-timestamp-color', customReceivedTimestampColor)

          const resolvedVariants = customBgImages || (customBgImage ? {
            sm: customBgImage,
            md: customBgImage,
            lg: customBgImage
          } : null)
          const fallbackSrc = resolvedVariants ? (resolvedVariants.sm || resolvedVariants.md || resolvedVariants.lg || '') : ''

          if (customUseBgImage && fallbackSrc) {
            previewChatWindow.style.setProperty('--atoll-chat-bg-blur', `${customBgBlur}px`)
            previewChatWindow.style.setProperty('--atoll-chat-bg-dim', `${customBgDim / 100}`)

            if (previewBgSourceLg) {
              previewBgSourceLg.srcset = resolvedVariants.lg || resolvedVariants.md || resolvedVariants.sm || fallbackSrc
            }
            if (previewBgSourceMd) {
              previewBgSourceMd.srcset = resolvedVariants.md || resolvedVariants.lg || resolvedVariants.sm || fallbackSrc
            }
            if (previewBgImg) {
              previewBgImg.src = fallbackSrc
            }
            if (previewBgPicture) {
              previewBgPicture.style.display = 'block'
            }
          } else {
            previewChatWindow.style.removeProperty('--atoll-chat-bg-blur')
            previewChatWindow.style.removeProperty('--atoll-chat-bg-dim')
            if (previewBgPicture) {
              previewBgPicture.style.display = 'none'
            }
            if (previewBgSourceLg) {
              previewBgSourceLg.removeAttribute('srcset')
            }
            if (previewBgSourceMd) {
              previewBgSourceMd.removeAttribute('srcset')
            }
            if (previewBgImg) {
              previewBgImg.removeAttribute('src')
            }
          }
        } else {
          // It's a pre-defined theme (classic, ocean, forest, sunset)
          const tokens = preDefinedThemeTokens[highlightedTheme]
          if (tokens) {
            previewChatWindow.style.setProperty('--atoll-chat-text-primary', tokens['text-primary'])
            previewChatWindow.style.setProperty('--atoll-chat-text-secondary', tokens['text-secondary'])
            previewChatWindow.style.setProperty('--atoll-chat-text-muted', tokens['text-muted'])
            previewChatWindow.style.setProperty('--atoll-chat-accent', tokens['accent'])
            previewChatWindow.style.setProperty('--atoll-chat-surface-glass', tokens['surface-glass'])
            previewChatWindow.style.setProperty('--atoll-chat-border', tokens['border'])
          }
        }
      }

      // Offscreen image load event handler
      if (offscreenImg) {
        offscreenImg.onload = () => {
          customBgImages = generateThemeImageVariants(offscreenImg)
          customBgImage = customBgImages.lg || customBgImages.md || customBgImages.sm || null

          // Sample canvas for fast palette and average color extraction
          const sampleCanvas = document.createElement('canvas')
          sampleCanvas.width = 100
          sampleCanvas.height = 100
          const ctx = sampleCanvas.getContext('2d')
          if (ctx) {
            ctx.drawImage(offscreenImg, 0, 0, 100, 100)
            customBgColor = getAverageColor(sampleCanvas)

            customPaletteModeIdx = 0
            customPalette = generateImagePalettes(sampleCanvas, 'vibrant')

            if (customPalette && customPalette.length >= 2) {
              customSentBg = customPalette[0]
              customReceivedBg = customPalette[1]
              normalizeCustomThemeContrast()
            }
          }

          getRef('btnGeneratePalette').removeAttribute('disabled')
          getRef('btnRandomizeColors').removeAttribute('disabled')

          renderPaletteSwatches()
          updateLivePreviewStyles()

          $bus.emit('ui:show_toast', {
            message: 'Custom palette extracted successfully!',
            type: 'success'
          })
        }
      }
    }
  })
</script>
