<template id="list-pane">
  <div class="list-pane-custom d-flex flex-column h-100">
    <header class="app-header list-pane-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0 fw-bold text-capitalize" ref="paneTitle">Chats</h4>
      <button class="btn btn-sm btn-primary rounded-circle" ref="btnCreateRoom" title="Create Room" style="display: none;">
        <i class="bi bi-pencil-square"></i>
      </button>
    </header>
    <div class="search-container-pill" ref="searchContainer" style="display: none;">
      <div class="input-group">
        <span class="input-group-text ps-3">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input type="text" 
               class="form-control pe-3" 
               placeholder="Search messages" 
               ref="searchInput">
      </div>
    </div>
    <div class="flex-grow-1 overflow-hidden" ref="listContainer">
      <!-- Specialized list components will be mounted here -->
    </div>
    <!-- Component Registration for Bundle Inclusion -->
    <div style="display: none !important;" ref="registrationDiv">
      <reaction-picker></reaction-picker>
    </div>
  </div>
</template>


<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, state, globalStore, eventBus, signal }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      state.currentAppView = $state.currentAppView || 'chats'
      $state.listSearchQuery = ''

      // Clear registration div on client mount to avoid duplicate elements in DOM
      const regDiv = refs('registrationDiv')
      if (regDiv) {
        regDiv.innerHTML = ''
      }

      const updateView = () => {
        const view = state.currentAppView
        const container = refs('listContainer')
        const titleRef = refs('paneTitle')
        const btnCreateRoom = refs('btnCreateRoom')
        const searchContainer = refs('searchContainer')
        const searchInput = refs('searchInput')

        if (!container) {
          return
        }

        // Update Title
        if (titleRef) {
          titleRef.textContent = view.charAt(0).toUpperCase() + view.slice(1)
        }

        // Update Create Room Button visibility
        if (btnCreateRoom) {
          btnCreateRoom.style.display = (view === 'chats') ? 'block' : 'none'
        }

        // Update Search visibility
        const searchableViews = ['chats', 'pictures', 'videos', 'music', 'documents']
        if (searchContainer) {
          searchContainer.style.display = searchableViews.includes(view) ? 'block' : 'none'
        }

        // Reset search on view change
        $state.listSearchQuery = ''
        if (searchInput) {
          searchInput.value = ''
        }

        // Clear container
        container.innerHTML = ''

        // Mount specialized component
        let componentName = ''
        if (view === 'chats') {
          componentName = 'chat-list'
        } else if (view === 'pictures') {
          componentName = 'picture-list'
        } else if (view === 'videos') {
          componentName = 'video-list'
        } else if (view === 'music') {
          componentName = 'music-list'
        } else if (view === 'documents') {
          componentName = 'document-list'
        } else if (view === 'links') {
          componentName = 'link-list'
        } else if (view === 'media-engine') {
          componentName = 'media-engine'
        } else if (view === 'settings') {
          componentName = 'settings-view'
        }

        if (componentName) {
          const el = document.createElement(componentName)
          container.appendChild(el)
        }
      }

      // Initial render
      updateView()

      // Handle Search Input
      const searchInput = refs('searchInput')
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          $state.listSearchQuery = e.target.value.toLowerCase()
        })
      }

      // Handle Create Room button click
      const btnCreateRoom = refs('btnCreateRoom')
      if (btnCreateRoom) {
        btnCreateRoom.addEventListener('click', () => {
          $bus.emit('open-create-room')
        })
      }

      // Reactivity to global state
      $state.subscribe('currentAppView', (val) => {
        state.currentAppView = val
        updateView()
      })
    }
  })
</script>
