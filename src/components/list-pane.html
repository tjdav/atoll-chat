<template id="list-pane">
  <div class="list-pane d-flex flex-column h-100">
    <header class="p-3 border-bottom bg-body d-flex justify-content-between align-items-center">
      <h5 id="{{ ref_paneTitle }}" class="mb-0 text-capitalize" ref="paneTitle">Chats</h5>
      <button id="{{ ref_btnCreateRoom }}" class="btn btn-sm btn-primary rounded-circle" ref="btnCreateRoom" title="Create Room" style="display: none;">
        <i class="bi bi-plus-lg"></i>
      </button>
    </header>
    <div id="{{ ref_listContainer }}" class="flex-grow-1 overflow-hidden" ref="listContainer">
      <!-- Specialized list components will be mounted here -->
    </div>
  </div>
</template>

<style>
  .list-pane {
    background-color: var(--bs-tertiary-bg);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, state, globalStore, eventBus }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      state.currentAppView = $state.currentAppView || 'chats'

      const updateView = () => {
        const view = state.currentAppView
        const container = refs('listContainer')
        const titleRef = refs('paneTitle')
        const btnCreateRoom = refs('btnCreateRoom')

        if (!container) {
          return
        }

        // Update Title
        if (titleRef) {
          titleRef.textContent = view.charAt(0).toUpperCase() + view.slice(1)
        }

        // Update Create Room Button visibility
        if (btnCreateRoom) {
          btnCreateRoom.style.display = (view === 'chats') ? 'block' : 'none'
        }

        // Clear container
        container.innerHTML = ''

        // Mount specialized component
        let componentName = ''
        if (view === 'chats') {
          componentName = 'chat-list'
        } else if (view === 'pictures') {
          componentName = 'picture-list'
        } else if (view === 'videos') {
          componentName = 'video-list'
        } else if (view === 'music') {
          componentName = 'music-list'
        } else if (view === 'settings') {
          const settingsDiv = document.createElement('div')
          settingsDiv.className = 'p-4'
  
          const title = document.createElement('h6')
          title.className = 'mb-3'
          title.textContent = 'Media Settings'
          settingsDiv.appendChild(title)

          const autoHideCheck = document.createElement('div')
          autoHideCheck.className = 'form-check form-switch'
  
          const input = document.createElement('input')
          input.className = 'form-check-input'
          input.type = 'checkbox'
          input.role = 'switch'
          input.id = 'autoHideMediaBar'
          input.checked = $state.autoHideMediaBar
  
          const label = document.createElement('label')
          label.className = 'form-check-label'
          label.htmlFor = 'autoHideMediaBar'
          label.textContent = 'Auto-hide Media Bar when idle'
  
          autoHideCheck.appendChild(input)
          autoHideCheck.appendChild(label)
          settingsDiv.appendChild(autoHideCheck)

          input.addEventListener('change', (e) => {
            $state.autoHideMediaBar = e.target.checked
            // Trigger visibility update in the bar
            if ($state.playbackStatus === 'idle') {
              $state.playbackStatus = 'idle'
            }
          })

          container.appendChild(settingsDiv)
          return
        }

        if (componentName) {
          const el = document.createElement(componentName)
          container.appendChild(el)
        }
      }

      // Initial render
      updateView()

      // Handle Create Room button click
      const btnCreateRoom = refs('btnCreateRoom')
      if (btnCreateRoom) {
        btnCreateRoom.addEventListener('click', () => {
          $bus.emit('open-create-room')
        })
      }

      // Reactivity to global state
      $state.subscribe('currentAppView', (val) => {
        state.currentAppView = val
        updateView()
      })
    }
  })
</script>
