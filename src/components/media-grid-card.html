<template id="media-grid-card">
  <div class="col">
    <div ref="card" class="card h-100 border-0 shadow-sm overflow-hidden clickable-card {{ activeClass }}">
      <div ref="mediaContainer" class="ratio {{ ratioClass }} d-flex align-items-center justify-content-center bg-secondary bg-opacity-25 overflow-hidden">
        <i class="bi {{ iconClass }} fs-1 text-secondary opacity-50"></i>
      </div>
      <div class="card-body p-2">
        <small class="d-block text-truncate text-muted">{{ dateStr }}</small>
        <small class="d-block text-truncate text-muted opacity-75" style="font-size: 0.75rem;">{{ timeStr }}</small>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      assetId: String,
      mediaId: String,
      mimeType: String,
      isActive: String,
      type: String,
      dateStr: String,
      timeStr: String,
      fileKey: String,
      fileNonce: String
    },
    getters: {
      activeClass: (state) => (state.isActive === 'true' ? 'is-active-card' : ''),
      ratioClass: (state) => ((state.mimeType || '').startsWith('video/') ? 'ratio-16x9' : 'ratio-1x1'),
      iconClass: (state) => ((state.mimeType || '').startsWith('video/') ? 'bi-camera-video' : 'bi-image')
    },
    client: ({ refs, state, localDb, globalStore, pocketbase, eventBus, signal, utils }) => {
      const { $localDb } = localDb
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $utils } = utils
      const card = refs('card')
      const mediaContainer = refs('mediaContainer')

      const objectUrls = new Map()
      const cleanupUrls = () => {
        objectUrls.forEach(url => URL.revokeObjectURL(url))
        objectUrls.clear()
      }
      signal.addEventListener('abort', cleanupUrls)

      const isVideo = (state.mimeType || '').startsWith('video/')

      card.onclick = () => {
        $state.activeSelectionId = state.assetId
        $state.activeSelectionType = state.type
      }

      // Decrypt and render preview (This stays in client block as it requires libsodium and fetching)
      const renderPreview = async () => {
        if (!state.mediaId || !state.fileKey || !state.fileNonce) {
          return
        }
  
        try {
          const asset = await $localDb.local_assets.get(state.assetId)
          let objectUrl = null

          if (isVideo) {
            if (asset?.thumbnail) {
              objectUrl = await $utils.fetchAndDecrypt(asset.thumbnail, signal)
            } else {
              throw new Error('Video thumbnail missing')
            }
          } else {
            objectUrl = await $utils.fetchAndDecrypt({
              media_id: state.mediaId,
              file_key: state.fileKey,
              file_nonce: state.fileNonce,
              mime_type: state.mimeType,
              id: state.assetId
            }, signal)
          }

          if (signal.aborted) {
            return
          }

          objectUrls.set(state.assetId, objectUrl)

          mediaContainer.innerHTML = ''
          const img = document.createElement('img')
          img.src = objectUrl
          img.className = 'object-fit-cover w-100 h-100'
          mediaContainer.appendChild(img)

          if (isVideo) {
            const overlay = document.createElement('div')
            overlay.className = 'position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center'
            overlay.innerHTML = '<i class="bi bi-play-fill text-white fs-1 opacity-75"></i>'
            mediaContainer.appendChild(overlay)
          }
        } catch (err) {
          console.error('[media-grid-card] Preview error:', err)
        }
      }

      renderPreview()
    }
  })
</script>
