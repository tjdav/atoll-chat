<template id="app-layout">
  <div class="atoll-main-layout {{ layoutClasses }}">
    <!-- Mobile Nav Offcanvas -->
    <div class="offcanvas-md offcanvas-start h-100" tabindex="-1" ref="mobileNav" data-testid="mobileNav">
      <div class="d-flex h-100">
        <!-- Column 1: Navigation Sidebar -->
        <nav-sidebar></nav-sidebar>

        <!-- Column 2: Sidebar list pane -->
        <div class="atoll-sidebar-pane contextual-list">
          <list-pane></list-pane>
        </div>
      </div>
    </div>

    <!-- Column 3: Main Detail View / Chat Pane -->
    <div class="atoll-chat-pane detail-view {{ layoutClasses }}">
      <div class="h-100 d-flex align-items-center justify-content-center" hidden="{{ isDetailView }}">
        <div class="text-center">
          <atoll-icon name="menu-links" size="48" class="text-secondary mb-3 d-block"></atoll-icon>
          <p class="text-muted mb-0">Select a conversation or item</p>
        </div>
      </div>
      <div ref="detailHost" class="h-100" hidden="{{ hideDetailHost }}"></div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <atoll-bottom-navigation></atoll-bottom-navigation>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      activeSelectionId: null,
      activeSelectionType: null,
      currentAppView: 'chats',
      toastMessage: ''
    }),
    getters: {
      isDetailView: (state) => {
        if (state.currentAppView === 'settings') {
          return window.innerWidth >= 768 || !!state.activeSelectionId
        }
        return !!(state.activeSelectionId && ['chats', 'pictures', 'videos', 'music', 'documents', 'links'].includes(state.activeSelectionType))
      },
      layoutClasses: (state) => (state.isDetailView ? 'chat-active' : ''),
      hideDetailHost: (state) => !state.isDetailView
    },
    client: ({ state, globalStore, eventBus, bootstrap, refs, root }) => {
      const { $state } = globalStore
      const { $bus } = eventBus
      const { Offcanvas } = bootstrap

      state.activeSelectionId = $state.activeSelectionId
      state.activeSelectionType = $state.activeSelectionType
      state.currentAppView = $state.currentAppView

      const mobileNavEl = refs('mobileNav')
      const detailHost = refs('detailHost')
      const mobileNav = new Offcanvas(mobileNavEl)

      // Swipe to close left offcanvas (swipe left)
      let touchStartX = 0
      let touchStartY = 0
      let touchEndX = 0
      let touchEndY = 0

      mobileNavEl.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          touchStartX = e.touches[0].clientX
          touchStartY = e.touches[0].clientY
          touchEndX = touchStartX
          touchEndY = touchStartY
        }
      }, { passive: true })

      mobileNavEl.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          touchEndX = e.touches[0].clientX
          touchEndY = e.touches[0].clientY
        }
      }, { passive: true })

      mobileNavEl.addEventListener('touchend', () => {
        const deltaX = touchEndX - touchStartX
        const deltaY = touchEndY - touchStartY
        // Swipe left (negative deltaX) of at least 50px with dominant horizontal gesture
        if (deltaX <= -50 && Math.abs(deltaX) > Math.abs(deltaY)) {
          mobileNav.hide()
        }
      }, { passive: true })

      const callOverlayElement = document.createElement('call-overlay')
      const reactionPickerElement = document.createElement('atoll-chat-reaction-picker')
      const avatarEditorElement = document.createElement('ui-avatar-editor')

      root.appendChild(callOverlayElement)
      root.appendChild(reactionPickerElement)
      root.appendChild(avatarEditorElement)

      $bus.on('ui:open_mobile_nav', () => {
        mobileNav.show()
      })

      $bus.on('ui:selection_made', () => {
        if (window.innerWidth < 768) {
          mobileNav.hide()
        }
      })

      const typeTagMap = {
        chats: 'atoll-chat-view',
        pictures: 'image-viewer',
        videos: 'video-player-view',
        music: 'audio-player-view',
        documents: 'document-viewer',
        links: 'link-viewer',
        settings: 'settings-main'
      }

      let currentMountedTag = null

      const syncActiveViewer = () => {
        const isSettings = $state.currentAppView === 'settings'
        const activeType = isSettings ? 'settings' : $state.activeSelectionType
        const hasSelection = isSettings ? (window.innerWidth >= 768 || !!$state.activeSelectionId) : Boolean($state.activeSelectionId && typeTagMap[activeType])

        if (!hasSelection) {
          if (detailHost.hasChildNodes()) {
            detailHost.replaceChildren()
            currentMountedTag = null
          }
          return
        }

        const targetTag = typeTagMap[activeType]
        if (targetTag && currentMountedTag !== targetTag) {
          detailHost.replaceChildren(document.createElement(targetTag))
          currentMountedTag = targetTag
        }
      }

      $state.subscribe('currentAppView', (val) => {
        state.currentAppView = val
        syncActiveViewer()
      })
      $state.subscribe('activeSelectionId', (val) => {
        state.activeSelectionId = val
        // Close offcanvas when selection changes on mobile, except when navigating via sidebar tabs
        if (window.innerWidth < 768 && !$state.isSidebarNavigating) {
          mobileNav.hide()
        }
        syncActiveViewer()
      })
      $state.subscribe('activeSelectionType', (val) => {
        state.activeSelectionType = val
        syncActiveViewer()
      })

      syncActiveViewer()
    }
  })
</script>
