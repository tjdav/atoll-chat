<template id="app-root">
  <div class="vh-100 vw-100 d-flex flex-column overflow-hidden">
    <ui-offline-banner></ui-offline-banner>
    <div ref="container" class="flex-grow-1 position-relative"></div>

    <!-- Global Toast Container -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 1100">
      <div ref="globalToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" ref="toastBody"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ globalStore, pocketbase, refs, signal, eventBus, router, storage, push, appLifecycle, network, cryptoWorker, deeplink, webrtcTransfer, bootstrap, notifications }) => {
      /**
       * Computes the SHA-256 hash of a given text string.
       *
       * @param {string} text - The input plain text to hash.
       * @returns {Promise<string>} The hexadecimal representation of the SHA-256 hash.
       */
      async function sha256 (text) {
        const msgUint8 = new TextEncoder().encode(text)
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
        const hashArray = Array.from(new Uint8Array(hashBuffer))
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
      }

      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $storage } = storage
      const { $push } = push
      const { $worker } = cryptoWorker
      const container = refs('container')

      // Initialize global toast
      let toastInstance = null
      const toastEl = refs('globalToast')
      const toastBody = refs('toastBody')

      try {
        const { Toast } = bootstrap
        if (Toast) {
          toastInstance = new Toast(toastEl)
        }
      } catch {
        // Safe recovery: fallback gracefully if toast initialization fails.
        toastInstance = null
      }

      $bus.on('ui:show_toast', ({ message, variant = 'primary', type = 'primary' }) => {
        const toastType = variant || type
        toastBody.textContent = message
        toastEl.className = `toast align-items-center text-white bg-${toastType} border-0 shadow`
        if (toastInstance) {
          toastInstance.show()
        }
      })

      // Global Context Menu Controller
      let activeContextMenu = null
      let lastShowTime = 0

      /**
       * Dismisses the currently active context menu if the time guard threshold has passed.
       *
       * @returns {void}
       */
      const dismissContextMenu = () => {
        if (Date.now() - lastShowTime < 100) {
          return
        }
        if (activeContextMenu) {
          activeContextMenu.remove()
          activeContextMenu = null
        }
      }

      document.addEventListener('click', dismissContextMenu, { signal })
      document.addEventListener('contextmenu', (e) => {
        // If target is inside an existing context menu, don't dismiss immediately before the click event fires
        if (activeContextMenu && activeContextMenu.contains(e.target)) {
          return
        }
        dismissContextMenu()
      }, { signal })
      window.addEventListener('resize', dismissContextMenu, { signal })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          dismissContextMenu()
        }
      }, { signal })

      $bus.on('ui:show_context_menu', ({ x, y, items }) => {
        // Bypass time guard for clean recreation
        if (activeContextMenu) {
          activeContextMenu.remove()
          activeContextMenu = null
        }
        lastShowTime = Date.now()

        if (!items || items.length === 0) {
          return
        }

        const menu = document.createElement('div')
        menu.className = 'dropdown-menu show shadow-sm'
        menu.style.position = 'fixed'
        menu.style.left = `${x}px`
        menu.style.top = `${y}px`
        menu.style.zIndex = '1200'
        menu.style.minWidth = '180px'

        const list = document.createElement('ul')
        list.className = 'list-unstyled m-0 p-1'

        items.forEach((item) => {
          if (item.type === 'separator') {
            const hr = document.createElement('hr')
            hr.className = 'dropdown-divider'
            list.appendChild(hr)
            return
          }

          const li = document.createElement('li')
          const a = document.createElement('a')
          a.href = '#'
          a.className = `dropdown-item d-flex align-items-center gap-2 py-2 px-3 rounded-2 ${item.danger ? 'text-danger' : ''}`
          const testId = `context-item-${item.label.toLowerCase().replace(/\s+/g, '-')}`
          a.setAttribute('data-testid', testId)

          if (item.icon) {
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', item.icon)
            icon.setAttribute('size', '16')
            if (item.danger) {
              icon.setAttribute('color', 'var(--atoll-danger, #FF334B)')
            } else {
              icon.setAttribute('color', 'currentColor')
            }
            a.appendChild(icon)
          }

          const span = document.createElement('span')
          span.textContent = item.label
          a.appendChild(span)

          a.addEventListener('click', (e) => {
            e.preventDefault()
            e.stopPropagation()
            dismissContextMenu()
            if (typeof item.action === 'function') {
              item.action()
            }
          }, { signal })

          li.appendChild(a)
          list.appendChild(li)
        })

        menu.appendChild(list)
        document.body.appendChild(menu)

        // Adjust position to prevent screen clipping
        const rect = menu.getBoundingClientRect()
        const viewportWidth = window.innerWidth
        const viewportHeight = window.innerHeight

        if (rect.right > viewportWidth) {
          menu.style.left = `${viewportWidth - rect.width - 8}px`
        }
        if (rect.bottom > viewportHeight) {
          menu.style.top = `${viewportHeight - rect.height - 8}px`
        }

        activeContextMenu = menu
      })

      // Keep worker auth token in sync with PocketBase auth store
      pb.authStore.onChange((token) => {
        if (token) {
          $worker.execute('worker:set_token', { token }).catch(() => {
            // Background update fail-safe: do not disrupt user session.
            return
          })
        } else {
          $worker.execute('worker:wipe_keys').catch(() => {
            // Background cleanup fail-safe: proceed with offline logout sequence.
            return
          })
        }
      })
      if (pb.authStore.token) {
        $worker.execute('worker:set_token', { token: pb.authStore.token }).catch(() => {
          // Background boot sync fail-safe: continue handshake sequence.
          return
        })
      }

      let isDeviceTrusted = false
      let isLifecycleRegistered = false
      let isFlushing = false

      /**
       * Performs a fetch request with a configurable network timeout.
       *
       * @param {RequestInfo|URL} resource - The resource URL or Request object to fetch.
       * @param {object} [options={}] - The configuration options.
       * @param {number} [options.timeout=2000] - The timeout threshold in milliseconds.
       * @returns {Promise<Response>} The fetch Response.
       * @throws {DOMException} Throws an AbortError if the timeout threshold is exceeded.
       */
      async function fetchWithTimeout (resource, options = {}) {
        const { timeout = 2000 } = options
        const controller = new AbortController()
        const id = setTimeout(() => controller.abort(), timeout)
        try {
          const response = await fetch(resource, {
            ...options,
            signal: controller.signal
          })
          clearTimeout(id)
          return response
        } catch (error) {
          clearTimeout(id)
          throw error
        }
      }

      /**
       * Fetches the app metadata from the PocketBase server to verify connection status.
       *
       * @returns {Promise<object|null>} The server metadata object, or null if fetching failed.
       */
      const fetchServerMetadata = async () => {
        try {
          const pbBaseUrl = pb.baseUrl || '/'
          const metadataUrl = pbBaseUrl.replace(/\/+$/, '') + '/api/collections/app_metadata/records'
          const res = await fetchWithTimeout(metadataUrl, { timeout: 2000 })
          if (res.ok) {
            const data = await res.json()
            if (data && data.items && data.items.length > 0) {
              return data.items[0]
            }
          }
        } catch (err) {
          // Verify if it is an expected timeout or network abort failure
          if (err instanceof DOMException && err.name === 'AbortError') {
            return null
          }
  
          if (err instanceof TypeError) {
            return null
          }
          throw err
        }
        return null
      }

      /**
       * Evaluates and deletes legacy or orphaned client databases to reclaim storage.
       *
       * @param {string} activeInstanceId - The current active server instance ID to exclude from garbage collection.
       * @returns {Promise<void>}
       * @throws {Error} Re-throws unexpected IndexedDB failures.
       */
      async function runGarbageCollection (activeInstanceId) {
        if (typeof indexedDB === 'undefined' || typeof indexedDB.databases !== 'function') {
          return
        }
        try {
          const dbs = await indexedDB.databases()
          for (const dbInfo of dbs) {
            const name = dbInfo.name
            if (name && name.startsWith('atoll_data_')) {
              const suffix = name.substring('atoll_data_'.length)
              if (suffix !== activeInstanceId) {
                indexedDB.deleteDatabase(name)
              }
            }
          }
        } catch (err) {
          // If IndexedDB is blocked (e.g., Firefox private browsing SecurityError), proceed gracefully
          if (err instanceof Error && (err.name === 'SecurityError' || err.name === 'UnknownError')) {
            return
          }
          throw err
        }
      }

      /**
       * Flushes the pending message queue sequentially over the network.
       *
       * @returns {Promise<void>}
       */
      const flushQueue = async () => {
        if (isFlushing) {
          return
        }

        isFlushing = true

        try {
          const rooms = await $storage.getAllRoomsSorted()
          const pendingMessages = []

          for (const room of rooms) {
            const msgs = await $storage.getMessagesByRoom(room.id)
            const pMsgs = msgs.filter(m => m.status === 'pending')
            pendingMessages.push(...pMsgs)
          }

          pendingMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

          if (pendingMessages.length === 0) {
            return
          }

          for (const msg of pendingMessages) {
            if (!$state.isOnline) {
              break
            }

            try {
              const storedParams = await $storage.getFile(msg.local_uuid)

              let params
              if (storedParams) {
                params = storedParams
              } else {
                params = {
                  type: msg.type,
                  content: msg.content,
                  links: msg.links,
                  timestamp: new Date(msg.created_at).getTime()
                }
              }

              const result = await $worker.execute('worker:send_message', {
                room_id: msg.room_id,
                localUuid: msg.local_uuid,
                ...params
              })

              $bus.emit('message:sent', result)

              if (storedParams) {
                await $storage.deleteRecord('local_files', msg.local_uuid)
              }
            } catch (err) {
              // Fail-safe network interruption recovery: stop queue loop on individual delivery failures.
              break
            }
          }
        } catch (err) {
          // Unexpected systematic store error, re-throw to propagate
          throw err
        } finally {
          isFlushing = false
        }
      }

      router.init()
      notifications.init()

      let pendingInviteRoomId = null

      /**
       * Checks and processes any deep-linked room invitation that was queued during boot.
       *
       * @returns {Promise<void>}
       */
      const processPendingInvite = async () => {
        if (pendingInviteRoomId && $state.isAuthenticated && $state.isVaultUnlocked) {
          const roomId = pendingInviteRoomId
          pendingInviteRoomId = null
          await handleJoinRoom(roomId)
        }
      }

      /**
       * Joins a room based on an invite or ID, creating local DB room records and navigating.
       *
       * @param {string} roomId - The ID of the room to join.
       * @returns {Promise<void>}
       */
      const handleJoinRoom = async (roomId) => {
        if (!$state.currentUser || !$state.isVaultUnlocked) {
          pendingInviteRoomId = roomId
          return
        }

        try {
          // Replace routine try/catch block for membership lookup with standard non-throwing getList
          const membersRes = await pb.collection('room_members').getList(1, 1, {
            filter: `room_id="${roomId}" && user_id="${$state.currentUser.id}"`,
            requestKey: null
          })
          const isAlreadyMember = membersRes.items.length > 0

          if (!isAlreadyMember) {
            const roomRecord = await pb.collection('rooms').getOne(roomId, { requestKey: null })

            await pb.collection('room_members').create({
              room_id: roomId,
              user_id: $state.currentUser.id,
              epoch_id: 1,
              role: 'member',
              encrypted_room_key: '',
              key_nonce: ''
            }, { requestKey: null })

            let participants = []
            try {
              const participantsRes = await pb.collection('room_members').getList(1, 100, {
                filter: `room_id="${roomId}"`,
                expand: 'user_id',
                requestKey: null
              })
              participants = participantsRes.items.map(m => m.expand?.user_id).filter(Boolean)
            } catch (err) {
              // Safe fallback default: proceed with just the current user if retrieval fails
              participants = [$state.currentUser]
              if (err && err.name === 'ClientResponseError') {
                return
              }
              throw err
            }

            if (participants.length === 0) {
              participants = [$state.currentUser]
            }

            await $storage.saveRoom({
              id: roomId,
              is_group: roomRecord.is_group || false,
              weight: typeof roomRecord.weight === 'number' ? roomRecord.weight : 0,
              name: roomRecord.name || 'Joined Room',
              avatar: roomRecord.avatar || '',
              participants: participants.map(u => ({
                id: u.id,
                username: u.username,
                avatar: u.avatar,
                collectionId: u.collectionId,
                collectionName: u.collectionName
              })),
              user_role: 'member',
              key_history: [{
                epoch_id: 1,
                key: ''
              }],
              created_at: roomRecord.created,
              updated_at: roomRecord.updated
            })

            $bus.emit('db:new_local_room', { room_id: roomId })
          }

          $bus.emit('room:select', { room_id: roomId })
        } catch (err) {
          $bus.emit('ui:show_toast', {
            message: 'Failed to join group room. It may have been deleted or you do not have permission.',
            type: 'danger'
          })
        }
      }

      /**
       * Verifies if the current browser device is trusted via local TOTP trust tokens.
       *
       * @returns {Promise<void>}
       * @throws {Error} Re-throws unexpected database or validation errors.
       */
      const checkDeviceTrust = async () => {
        if (!$state.isAuthenticated) {
          isDeviceTrusted = false
          return
        }

        const user = pb.authStore.model
        if (!user) {
          isDeviceTrusted = false
          return
        }

        if (!user.totp_enabled) {
          isDeviceTrusted = true
          return
        }

        const localToken = localStorage.getItem('device_trust_token')
        if (!localToken) {
          isDeviceTrusted = false
          return
        }

        try {
          const hash = await sha256(localToken)
          const record = await pb.collection('users').getOne(user.id)
          const hashes = record.trusted_device_hashes || []
          isDeviceTrusted = hashes.includes(hash)
        } catch (err) {
          // Security safeguard: fail closed if verification check fails for any reason
          isDeviceTrusted = false
          if (err && err.name === 'ClientResponseError') {
            return
          }
          throw err
        }
      }

      /**
       * Redraws the main container interface based on connection and authorization state.
       *
       * @returns {void}
       */
      const updateUI = () => {
        while (container.firstChild) {
          container.removeChild(container.firstChild)
        }

        if ($state.isOfflineSetup) {
          container.className = 'vh-100 vw-100 d-flex align-items-center justify-content-center bg-body-tertiary'
          const setupDiv = document.createElement('div')
          setupDiv.className = 'card shadow-sm p-4 text-center'
          setupDiv.style.maxWidth = '400px'
          setupDiv.innerHTML = `
            <div class="mb-3 text-danger d-flex align-items-center justify-content-center">
              <atoll-icon name="permissions" size="48" color="var(--atoll-danger, #FF334B)"></atoll-icon>
            </div>
            <h4 class="card-title mb-2">Connection Required</h4>
            <p class="card-text text-muted">Atoll needs to connect to the server once to initialize your secure environment.</p>
            <atoll-button variant="primary" block="true" leading-icon="restart" onclick="window.location.reload()">Retry Connection</atoll-button>
          `
          container.appendChild(setupDiv)
          return
        }

        if ($state.isAuthenticated && $state.isVaultUnlocked) {
          container.className = 'h-100 w-100 overflow-hidden d-flex'

          const mainContent = document.createElement('div')
          mainContent.className = 'flex-grow-1 h-100 position-relative d-flex'
          mainContent.appendChild(document.createElement('app-layout'))
          mainContent.appendChild(document.createElement('create-room-modal'))
          mainContent.appendChild(document.createElement('edit-room-modal'))
          mainContent.appendChild(document.createElement('p2p-reroute-modal'))
          mainContent.appendChild(document.createElement('p2p-consent-modal'))
          container.appendChild(mainContent)
        } else {
          container.className = 'h-100 w-100 overflow-hidden d-flex'

          const mainContent = document.createElement('div')
          mainContent.className = 'flex-grow-1 h-100 position-relative d-flex'

          const rightSection = document.createElement('div')
          rightSection.className = 'flex-grow-1 h-100 position-relative d-flex align-items-center justify-content-center bg-body-tertiary'
          mainContent.appendChild(rightSection)
          container.appendChild(mainContent)

          renderAuthFlow(rightSection)
        }
      }

      /**
       * Renders the register, login, TOTP, or vault unlock views inside the specified container.
       *
       * @param {HTMLElement} [targetContainer] - The element in which to mount the authorization components.
       * @returns {void}
       */
      const renderAuthFlow = (targetContainer) => {
        const parent = targetContainer || container
        if (!targetContainer) {
          parent.className = 'h-100 w-100 d-flex align-items-center justify-content-center bg-body-tertiary'
        }

        const contentWrapper = document.createElement('div')
        contentWrapper.className = 'container'

        const row = document.createElement('div')
        row.className = 'row justify-content-center'

        const col = document.createElement('div')
        col.className = 'col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4'

        row.appendChild(col)
        contentWrapper.appendChild(row)
        parent.appendChild(contentWrapper)

        if (!$state.isAuthenticated) {
          if ($state.authView === 'register') {
            col.appendChild(document.createElement('auth-register'))
          } else {
            col.appendChild(document.createElement('auth-login'))
          }
        } else if (!$state.isVaultUnlocked) {
          /* Session restored on page refresh (or 2FA challenge required) */
          if (!isDeviceTrusted) {
            col.appendChild(document.createElement('totp-challenge'))
          } else {
            col.appendChild(document.createElement('vault-unlock'))
          }
        }
      }

      /* Listen for unified deep link route events */
      $bus.on('app:route_requested', async ({ path: routePath, queryParams }) => {
        const rawInviteParam = queryParams?.invite_code || queryParams?.code || queryParams?.invite
        if (rawInviteParam && typeof rawInviteParam === 'string') {
          const trimmed = rawInviteParam.trim()
          // Differentiate user registration invite codes (e.g. INV-XXXX-XXXX or contains hyphens) from 15-char PB room record IDs
          const isRegCode = trimmed.toUpperCase().startsWith('INV-') || queryParams?.invite_code || queryParams?.code || (trimmed.includes('-') && !routePath?.startsWith('/invite/'))
          if (isRegCode) {
            if (!$state.isAuthenticated) {
              $state.pendingRegistrationInvite = trimmed
              $state.authView = 'register'
              $bus.emit('auth:invite_code_received', { code: trimmed })
            }
            return
          }
        }

        const inviteRoomId = queryParams?.invite || (routePath && routePath.startsWith('/invite/') ? routePath.split('/invite/')[1]?.split('?')[0]?.trim() : null)
        if (inviteRoomId) {
          await handleJoinRoom(inviteRoomId)
        }
      })

      /**
       * Evaluates server instance ID compatibility upon network reconnection.
       *
       * @param {object} [prefetchedMetadata=null] - Prefetched server metadata, if available.
       * @returns {Promise<void>}
       */
      const handleReconnectionHandshake = async (prefetchedMetadata = null) => {
        const metadata = prefetchedMetadata || await fetchServerMetadata()
        if (!metadata) {
          return
        }

        const activeId = localStorage.getItem('atoll_active_instance_id')
        const newId = metadata.instance_id

        if (activeId && activeId !== newId) {
          // Sever database connection
          if (window.$localDb) {
            try {
              await window.$localDb.close()
            } catch (err) {
              window.$localDb = null
            }
          }

          // Trigger Garbage Collection to delete current database and other orphans
          try {
            if (typeof indexedDB !== 'undefined') {
              indexedDB.deleteDatabase('atoll_data_' + activeId)
            }
          } catch (err) {
            // DB deletion failed, we perform recovery by purging session and reloading immediately
            pb.authStore.clear()
            localStorage.removeItem('device_trust_token')
            localStorage.removeItem('atoll_active_instance_id')
            window.location.reload()
            return
          }

          // Run general GC to be thorough
          await runGarbageCollection(newId)

          // Purge user session tokens
          pb.authStore.clear()
          localStorage.removeItem('device_trust_token')
          localStorage.removeItem('atoll_active_instance_id')

          // Force hard reload to push user back to clean login screen
          window.location.reload()
          return
        }

        // IDs match: hide Offline Mode and resume
        $state.isOnline = true
      }

      let reconnectPollInterval = null

      /**
       * Starts polling the server at regular intervals to check for connection recovery.
       *
       * @returns {void}
       */
      const startReconnectPolling = () => {
        if (reconnectPollInterval) {
          return
        }
        reconnectPollInterval = setInterval(async () => {
          if (!$state.isOnline) {
            await attemptReconnect(false)
          } else {
            stopReconnectPolling()
          }
        }, 5000)
      }

      /**
       * Stops the reconnection polling timer.
       *
       * @returns {void}
       */
      const stopReconnectPolling = () => {
        if (reconnectPollInterval) {
          clearInterval(reconnectPollInterval)
          reconnectPollInterval = null
        }
      }

      /**
       * Attempts a connection handshake with the backend, notifying the user if requested manually.
       *
       * @param {boolean} [isManual=false] - Whether this attempt was triggered manually by user interaction.
       * @returns {Promise<void>}
       */
      const attemptReconnect = async (isManual = false) => {
        const metadata = await fetchServerMetadata()
        if (metadata) {
          await handleReconnectionHandshake(metadata)
          $bus.emit('app:reconnected')
          if (isManual) {
            $bus.emit('ui:show_toast', {
              message: 'Connected to server!',
              variant: 'success'
            })
          }
        } else if (isManual) {
          $bus.emit('ui:show_toast', {
            message: 'Could not connect to server. Please try again.',
            variant: 'danger'
          })
        }
      }

      // Network status listener
      $bus.on('app:network_change', (payload) => {
        if (payload.isOnline) {
          handleReconnectionHandshake().catch((err) => {
            // Reconnection background error recovery path
            return
          })
        } else {
          $state.isOnline = false
        }
      })

      window.addEventListener('online', () => {
        handleReconnectionHandshake().catch((err) => {
          // Reconnection background error recovery path
          return
        })
      }, { signal })

      $bus.on('app:request_reconnect', async () => {
        await attemptReconnect(true)
      })

      // Auth lifecycle management
      $bus.on('auth:unlocked', ({ keys, userRecord }) => {
        $state.currentUser = {
          ...userRecord,
          ...keys
        }

        processPendingInvite().catch((err) => {
          // Invite processing recovery path
          return
        })

        if (!isLifecycleRegistered) {
          isLifecycleRegistered = true
          appLifecycle.registerListeners()
            .catch((err) => {
              // Ensure we don't crash app-root if non-critical listener registration fails
              return
            })

          network.registerListeners()
            .catch((err) => {
              // Ensure we don't crash app-root if network listener registration fails
              return
            })
        }

        // Only perform background registration silently if browser permissions have already been granted
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          $push.register()
            .then((token) => {
              if (token) {
                return pb.collection('users').update(userRecord.id, {
                  push_subscription: token
                })
              }
            })
            .then((updatedUser) => {
              if (updatedUser) {
                $state.currentUser = {
                  ...$state.currentUser,
                  push_subscription: updatedUser.push_subscription
                }
              }
            })
            .catch((err) => {
              // Background task: handle silent push subscription updates without crashing
              return
            })
        }
      })

      $bus.on('auth:logout', () => {
        $state.currentUser = null
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false

        if ($state.decryptionCache && $state.decryptionCache.forEach) {
          $state.decryptionCache.forEach((cached) => {
            if (!cached) {
              return
            }

            try {
              if (typeof cached === 'string') {
                if (cached.startsWith('blob:')) {
                  URL.revokeObjectURL(cached)
                }
              } else {
                if (cached.blobUrl && typeof cached.blobUrl === 'string' && cached.blobUrl.startsWith('blob:')) {
                  URL.revokeObjectURL(cached.blobUrl)
                }
                if (cached.thumbnailBlobUrl && typeof cached.thumbnailBlobUrl === 'string' && cached.thumbnailBlobUrl.startsWith('blob:')) {
                  URL.revokeObjectURL(cached.thumbnailBlobUrl)
                }
              }
            } catch (err) {
              // Non-critical resource cleanup failure, continue revoking other URLs
              return
            }
          })

          $state.decryptionCache.clear()
        }
      })

      $bus.on('auth:totp_passed', () => {
        isDeviceTrusted = true
        updateUI()
      })

      /**
       * Executes the dynamic client boot sequence, initializing local storage and deep links.
       *
       * @returns {Promise<void>}
       */
      const startBootHandshake = async () => {
        const metadata = await fetchServerMetadata()
        let instanceId = null

        if (metadata) {
          instanceId = metadata.instance_id
          localStorage.setItem('atoll_active_instance_id', instanceId)
          $state.isOnline = true
        } else {
          // Fallback to cached instance_id
          instanceId = localStorage.getItem('atoll_active_instance_id')
          $state.isOnline = false
        }

        if (!instanceId) {
          // Cold boot offline with no server contact ever - Block access entirely!
          $state.isOfflineSetup = true
          updateUI()
          return
        }

        $state.isOfflineSetup = false
        $state.activeInstanceId = instanceId

        const dbName = 'atoll_data_' + instanceId
        await $storage.initialize(dbName)

        const savedModel = await $storage.getConfig('transcription_model')
        if (savedModel) {
          $state.transcriptionModel = savedModel
        }

        // Asynchronously run Garbage Collection in background
        runGarbageCollection(instanceId).catch((err) => {
          // Background task fail-safe: GC failure should not disrupt boot handshake
          return
        })

        // Continue normal boot
        $state.isAuthenticated = pb.authStore.isValid
        if ($state.isAuthenticated) {
          $state.currentUser = pb.authStore.model
          const user = pb.authStore.model
          if (!user || !user.public_box_key) {
            $state.isVaultUnlocked = false
          }
        }

        if (!$state.authView) {
          $state.authView = 'login'
        }

        /* Initialize deep link plugin on boot */
        deeplink.initialize().then(async () => {
          if (webrtcTransfer) {
            // webrtcTransfer plugin registered.
          }
          await checkDeviceTrust()
          updateUI()
        }).catch(async (err) => {
          await checkDeviceTrust()
          updateUI()
        })
      }

      let updateNativeStatusBarRef = null
      import('../../utils/color-contrast.js').then((m) => {
        updateNativeStatusBarRef = m.updateNativeStatusBar
      }).catch(() => {
      })

      /**
       * Dynamically calculates and updates the native status bar style and background color.
       *
       * @returns {Promise<void>}
       */
      const updateAppStatusBar = async () => {
        try {
          if (!updateNativeStatusBarRef) {
            const m = await import('../../utils/color-contrast.js')
            updateNativeStatusBarRef = m.updateNativeStatusBar
          }

          if (updateNativeStatusBarRef) {
            // Detect if the overall application/system is in dark mode
            const isAppDark =
              document.documentElement.getAttribute('data-atoll-theme') === 'dark' ||
              document.body.getAttribute('data-atoll-theme') === 'dark' ||
              (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)

            //  Default colors for light/dark modes
            const defaultLightColor = '#F5F5F5'
            const defaultDarkColor = '#111111'

            let statusBarColor = isAppDark ? defaultDarkColor : defaultLightColor

            // Resolve status bar background color based on app state
            if (!$state.isAuthenticated || !$state.isVaultUnlocked || $state.isOfflineSetup) {
              // Unauthenticated / Locked Screens / Offline Setup
              statusBarColor = isAppDark ? defaultDarkColor : defaultLightColor
            } else {
              // Main App - Authenticated & Unlocked
              const activeType = $state.activeSelectionType
              const activeId = $state.activeSelectionId

              if (activeId) {
                // Inside detail views
                if (activeType === 'chats') {
                  return
                } else if (activeType === 'pictures' || activeType === 'videos') {
                  // Image/Video viewers are styled dark even in light mode
                  statusBarColor = '#111111'
                } else {
                  // Other detail views (Music, Documents, Links, Settings) use light/dark headers
                  statusBarColor = isAppDark ? defaultDarkColor : '#FFFFFF'
                }
              } else {
                // Standard sidebar list panes
                statusBarColor = isAppDark ? defaultDarkColor : '#FFFFFF'
              }
            }

            await updateNativeStatusBarRef(statusBarColor)
          }
        } catch {
          // Fail gracefully if status bar utility fails to load/execute
        }
      }

      /**
       * Dynamically calculates and sets the visual viewport height as a CSS custom property.
       *
       * @returns {void}
       */
      const updateVisualViewportHeight = () => {
        if (window.visualViewport) {
          const height = window.visualViewport.height
          document.documentElement.style.setProperty('--atoll-visual-viewport-height', `${height}px`)
          window.scrollTo(0, 0)
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateVisualViewportHeight, { signal })
        window.visualViewport.addEventListener('scroll', updateVisualViewportHeight, { signal })
        updateVisualViewportHeight()
      }

      /**
       * Determines and configures the top safe area inset for native platforms.
       * Sets the custom CSS variable `--atoll-safe-area-top` globally.
       *
       * @returns {Promise<void>}
       */
      const configureSafeInsets = async () => {
        const { Capacitor } = await import('@capacitor/core')
        if (Capacitor && typeof Capacitor.isNativePlatform === 'function' && Capacitor.isNativePlatform()) {
          const { StatusBar } = await import('@capacitor/status-bar')
          const info = await StatusBar.getInfo()
          const platform = Capacitor.getPlatform()
          let barHeight = info && typeof info.height === 'number' ? info.height : 0

          if (platform === 'android') {
            if (barHeight === 0) {
              // Generous default fallback in case info.height is not yet available on Android
              barHeight = 32
            }
          } else if (platform === 'ios') {
            if (barHeight === 0) {
              // Generous default fallback in case info.height is not yet available on iOS
              barHeight = 47
            }
          }

          if (barHeight > 0) {
            document.documentElement.style.setProperty('--atoll-safe-area-top', `${barHeight}px`)
          }
        }
      }

      /* Initialize boot handshake & status bar */
      startBootHandshake()
        .then(async () => {
          updateAppStatusBar()
          await configureSafeInsets()
        })
        .catch((err) => {
          // Critical system failure: transition UI to offline setup mode to prompt reconnection
          $state.isOfflineSetup = true
          updateUI()
          updateAppStatusBar()
          // Re-throw unexpected system failures so they are caught by global handlers
          throw err
        })

      // Update status bar when system theme changes
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          updateAppStatusBar()
        })
      }

      $state.subscribe('isAuthenticated', async () => {
        const user = pb.authStore.model
        if ($state.isAuthenticated && (!user || !user.public_box_key)) {
          $state.isVaultUnlocked = false
        }
        await checkDeviceTrust()
        updateUI()
        updateAppStatusBar()
      })
      $state.subscribe('isVaultUnlocked', () => {
        updateUI()
        updateAppStatusBar()
        processPendingInvite().catch((err) => {
          // Invite processing recovery path
          return
        })
      })
      $state.subscribe('authView', () => {
        updateUI()
        updateAppStatusBar()
      })
      $state.subscribe('isOfflineSetup', () => {
        updateAppStatusBar()
      })
      $state.subscribe('currentAppView', () => {
        updateAppStatusBar()
      })
      $state.subscribe('activeSelectionId', () => {
        updateAppStatusBar()
      })
      $state.subscribe('activeSelectionType', () => {
        updateAppStatusBar()
      })

      $state.subscribe('isOnline', (val) => {
        if (val) {
          flushQueue().catch((err) => {
            // Flush queue background error recovery path
            return
          })
          stopReconnectPolling()
        } else {
          startReconnectPolling()
        }
      })
    }
  })
</script>
