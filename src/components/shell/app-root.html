<template id="app-root">
  <div class="vh-100 vw-100 d-flex flex-column overflow-hidden">
    <ui-offline-banner></ui-offline-banner>
    <div ref="container" class="flex-grow-1 position-relative"></div>

    <!-- Global Toast Container -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 1100">
      <div ref="globalToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" ref="toastBody"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ globalStore, pocketbase, refs, signal, eventBus, router, storage, push, appLifecycle, network, cryptoWorker, deeplink, webrtcTransfer, bootstrap, notifications }) => {
      async function sha256 (text) {
        const msgUint8 = new TextEncoder().encode(text)
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8)
        const hashArray = Array.from(new Uint8Array(hashBuffer))
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('')
      }

      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $storage } = storage
      const { $push } = push
      const { $worker } = cryptoWorker
      const container = refs('container')

      // Initialize global toast
      let toastInstance = null
      const toastEl = refs('globalToast')
      const toastBody = refs('toastBody')

      try {
        const { Toast } = bootstrap
        if (Toast) {
          toastInstance = new Toast(toastEl)
        }
      } catch (err) {
        console.error('Failed to initialize bootstrap Toast:', err)
      }

      $bus.on('ui:show_toast', ({ message, variant = 'primary', type = 'primary' }) => {
        const toastType = variant || type
        toastBody.textContent = message
        toastEl.className = `toast align-items-center text-white bg-${toastType} border-0 shadow`
        if (toastInstance) {
          toastInstance.show()
        }
      })

      // Global Context Menu Controller
      let activeContextMenu = null
      let lastShowTime = 0

      const dismissContextMenu = () => {
        if (Date.now() - lastShowTime < 100) {
          return
        }
        if (activeContextMenu) {
          activeContextMenu.remove()
          activeContextMenu = null
        }
      }

      document.addEventListener('click', dismissContextMenu, { signal })
      document.addEventListener('contextmenu', (e) => {
        // If target is inside an existing context menu, don't dismiss immediately before the click event fires
        if (activeContextMenu && activeContextMenu.contains(e.target)) {
          return
        }
        dismissContextMenu()
      }, { signal })
      window.addEventListener('resize', dismissContextMenu, { signal })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          dismissContextMenu()
        }
      }, { signal })

      $bus.on('ui:show_context_menu', ({ x, y, items }) => {
        console.log('[app-root] Received ui:show_context_menu!', {
          x,
          y,
          itemCount: items?.length
        })
  
        // Bypass time guard for clean recreation
        if (activeContextMenu) {
          activeContextMenu.remove()
          activeContextMenu = null
        }
        lastShowTime = Date.now()

        if (!items || items.length === 0) {
          console.warn('[app-root] Context menu items list is empty or falsy!')
          return
        }

        const menu = document.createElement('div')
        menu.className = 'dropdown-menu show shadow-sm'
        menu.style.position = 'fixed'
        menu.style.left = `${x}px`
        menu.style.top = `${y}px`
        menu.style.zIndex = '1200'
        menu.style.minWidth = '180px'

        const list = document.createElement('ul')
        list.className = 'list-unstyled m-0 p-1'

        items.forEach((item) => {
          if (item.type === 'separator') {
            const hr = document.createElement('hr')
            hr.className = 'dropdown-divider'
            list.appendChild(hr)
            return
          }

          const li = document.createElement('li')
          const a = document.createElement('a')
          a.href = '#'
          a.className = `dropdown-item d-flex align-items-center gap-2 py-2 px-3 rounded-2 ${item.danger ? 'text-danger' : ''}`
          const testId = `context-item-${item.label.toLowerCase().replace(/\s+/g, '-')}`
          a.setAttribute('data-testid', testId)
          console.log('[app-root] Created context menu item:', item.label, 'testId:', testId)

          if (item.icon) {
            const icon = document.createElement('atoll-icon')
            icon.setAttribute('name', item.icon)
            icon.setAttribute('size', '16')
            if (item.danger) {
              icon.setAttribute('color', 'var(--atoll-danger, #FF334B)')
            } else {
              icon.setAttribute('color', 'currentColor')
            }
            a.appendChild(icon)
          }

          const span = document.createElement('span')
          span.textContent = item.label
          a.appendChild(span)

          a.addEventListener('click', (e) => {
            e.preventDefault()
            e.stopPropagation()
            dismissContextMenu()
            if (typeof item.action === 'function') {
              item.action()
            }
          }, { signal })

          li.appendChild(a)
          list.appendChild(li)
        })

        menu.appendChild(list)
        document.body.appendChild(menu)

        // Adjust position to prevent screen clipping
        const rect = menu.getBoundingClientRect()
        const viewportWidth = window.innerWidth
        const viewportHeight = window.innerHeight

        if (rect.right > viewportWidth) {
          menu.style.left = `${viewportWidth - rect.width - 8}px`
        }
        if (rect.bottom > viewportHeight) {
          menu.style.top = `${viewportHeight - rect.height - 8}px`
        }

        activeContextMenu = menu
      })

      // Keep worker auth token in sync with PocketBase auth store
      pb.authStore.onChange((token) => {
        if (token) {
          $worker.execute('worker:set_token', { token }).catch(console.error)
        } else {
          $worker.execute('worker:wipe_keys').catch(console.error)
        }
      })
      if (pb.authStore.token) {
        $worker.execute('worker:set_token', { token: pb.authStore.token }).catch(console.error)
      }

      let isDeviceTrusted = false
      let isLifecycleRegistered = false
      let isFlushing = false

      async function fetchWithTimeout (resource, options = {}) {
        const { timeout = 2000 } = options
        const controller = new AbortController()
        const id = setTimeout(() => controller.abort(), timeout)
        try {
          const response = await fetch(resource, {
            ...options,
            signal: controller.signal
          })
          clearTimeout(id)
          return response
        } catch (error) {
          clearTimeout(id)
          throw error
        }
      }

      const fetchServerMetadata = async () => {
        try {
          const pbBaseUrl = pb.baseUrl || '/'
          const metadataUrl = pbBaseUrl.replace(/\/+$/, '') + '/api/collections/app_metadata/records'
          const res = await fetchWithTimeout(metadataUrl, { timeout: 2000 })
          if (res.ok) {
            const data = await res.json()
            if (data && data.items && data.items.length > 0) {
              return data.items[0]
            }
          }
        } catch (err) {
          console.warn('[app-root] Failed to fetch app metadata:', err)
        }
        return null
      }

      async function runGarbageCollection (activeInstanceId) {
        if (typeof indexedDB === 'undefined' || typeof indexedDB.databases !== 'function') {
          console.warn('[app-root] indexedDB.databases is not supported.')
          return
        }
        try {
          const dbs = await indexedDB.databases()
          console.log('[app-root] Enumerated databases for garbage collection:', dbs)
          for (const dbInfo of dbs) {
            const name = dbInfo.name
            if (name && name.startsWith('atoll_data_')) {
              const suffix = name.substring('atoll_data_'.length)
              if (suffix !== activeInstanceId) {
                console.log('[app-root] Deleting orphaned database:', name)
                indexedDB.deleteDatabase(name)
              }
            }
          }
        } catch (err) {
          console.error('[app-root] Error during garbage collection:', err)
        }
      }

      const flushQueue = async () => {
        if (isFlushing) {
          console.log('[Queue] Flush is already in progress. Skipping duplicate invocation.')
          return
        }

        isFlushing = true

        try {
          const rooms = await $storage.getAllRoomsSorted()
          const pendingMessages = []

          for (const room of rooms) {
            const msgs = await $storage.getMessagesByRoom(room.id)
            const pMsgs = msgs.filter(m => m.status === 'pending')
            pendingMessages.push(...pMsgs)
          }

          pendingMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

          if (pendingMessages.length === 0) {
            console.log('[Queue] No pending messages to flush.')
            return
          }

          console.log(`[Queue] Found ${pendingMessages.length} pending messages to flush.`)

          for (const msg of pendingMessages) {
            if (!$state.isOnline) {
              console.log('[Queue] Connection lost during flush. Aborting.')
              break
            }

            try {
              const storedParams = await $storage.getFile(msg.local_uuid)

              let params
              if (storedParams) {
                params = storedParams
              } else {
                params = {
                  type: msg.type,
                  content: msg.content,
                  links: msg.links,
                  timestamp: new Date(msg.created_at).getTime()
                }
              }

              console.log(`[Queue] Flushing message ${msg.local_uuid}...`)
              const result = await $worker.execute('worker:send_message', {
                room_id: msg.room_id,
                localUuid: msg.local_uuid,
                ...params
              })

              $bus.emit('message:sent', result)

              if (storedParams) {
                await $storage.deleteRecord('local_files', msg.local_uuid)
              }

              console.log(`[Queue] Message ${msg.local_uuid} flushed successfully.`)
            } catch (err) {
              console.error(`[Queue] Failed to flush message ${msg.local_uuid}:`, err)
              break
            }
          }
        } catch (err) {
          console.error('[Queue] Error during flushQueue:', err)
        } finally {
          isFlushing = false
        }
      }

      router.init()
      notifications.init()

      let pendingInviteRoomId = null

      const processPendingInvite = async () => {
        if (pendingInviteRoomId && $state.isAuthenticated && $state.isVaultUnlocked) {
          const roomId = pendingInviteRoomId
          pendingInviteRoomId = null
          console.log(`[app-root] Processing pending room invitation for room ${roomId}`)
          await handleJoinRoom(roomId)
        }
      }

      /* Handler to join room from a deep-linked group invitation */
      const handleJoinRoom = async (roomId) => {
        if (!$state.currentUser || !$state.isVaultUnlocked) {
          console.log(`[app-root] Queueing pending room invitation for ${roomId} (waiting for auth and vault unlock)`)
          pendingInviteRoomId = roomId
          return
        }

        try {
          let isAlreadyMember = false
          try {
            await pb.collection('room_members').getFirstListItem(`room_id="${roomId}" && user_id="${$state.currentUser.id}"`, { requestKey: null })
            isAlreadyMember = true
          } catch (_err) {
            /* Not a member yet */
          }

          if (!isAlreadyMember) {
            console.log(`[app-root] User not a member of room ${roomId}. Creating membership record...`)
            const roomRecord = await pb.collection('rooms').getOne(roomId, { requestKey: null })

            await pb.collection('room_members').create({
              room_id: roomId,
              user_id: $state.currentUser.id,
              epoch_id: 1,
              role: 'member',
              encrypted_room_key: '',
              key_nonce: ''
            }, { requestKey: null })

            let participants = []
            try {
              const membersRes = await pb.collection('room_members').getList(1, 100, {
                filter: `room_id="${roomId}"`,
                expand: 'user_id',
                requestKey: null
              })
              participants = membersRes.items.map(m => m.expand?.user_id).filter(Boolean)
            } catch (err) {
              console.error('[app-root] Failed to fetch participants for joined room:', err)
            }

            if (participants.length === 0) {
              participants = [$state.currentUser]
            }

            await $storage.saveRoom({
              id: roomId,
              is_group: roomRecord.is_group || false,
              name: roomRecord.name || 'Joined Room',
              avatar: roomRecord.avatar || '',
              participants: participants.map(u => ({
                id: u.id,
                username: u.username,
                avatar: u.avatar,
                collectionId: u.collectionId,
                collectionName: u.collectionName
              })),
              user_role: 'member',
              key_history: [{
                epoch_id: 1,
                key: ''
              }],
              created_at: roomRecord.created,
              updated_at: roomRecord.updated
            })

            $bus.emit('db:new_local_room', { room_id: roomId })
          }

          console.log(`[app-root] Selecting room ${roomId}`)
          $bus.emit('room:select', { room_id: roomId })
        } catch (err) {
          console.error('[app-root] Failed to join room:', err)
          $bus.emit('ui:show_toast', {
            message: 'Failed to join group room. It may have been deleted or you do not have permission.',
            type: 'danger'
          })
        }
      }

      const checkDeviceTrust = async () => {
        if (!$state.isAuthenticated) {
          isDeviceTrusted = false
          return
        }

        const user = pb.authStore.model
        if (!user) {
          isDeviceTrusted = false
          return
        }

        if (!user.totp_enabled) {
          isDeviceTrusted = true
          return
        }

        const localToken = localStorage.getItem('device_trust_token')
        if (!localToken) {
          isDeviceTrusted = false
          return
        }

        try {
          const hash = await sha256(localToken)
          const record = await pb.collection('users').getOne(user.id)
          const hashes = record.trusted_device_hashes || []
          isDeviceTrusted = hashes.includes(hash)
        } catch (err) {
          console.error('Device trust check failed:', err)
          isDeviceTrusted = false
        }
      }

      const updateUI = () => {
        console.log('[app-root] updateUI called', {
          isAuthenticated: $state.isAuthenticated,
          hasModel: !!pb.authStore.model,
          public_box_key: pb.authStore.model?.public_box_key
        })

        while (container.firstChild) {
          container.removeChild(container.firstChild)
        }

        if ($state.isOfflineSetup) {
          container.className = 'vh-100 vw-100 d-flex align-items-center justify-content-center bg-body-tertiary'
          const setupDiv = document.createElement('div')
          setupDiv.className = 'card shadow-sm p-4 text-center'
          setupDiv.style.maxWidth = '400px'
          setupDiv.innerHTML = `
            <div class="mb-3 text-danger d-flex align-items-center justify-content-center">
              <atoll-icon name="permissions" size="48" color="var(--atoll-danger, #FF334B)"></atoll-icon>
            </div>
            <h4 class="card-title mb-2">Connection Required</h4>
            <p class="card-text text-muted">Atoll needs to connect to the server once to initialize your secure environment.</p>
            <atoll-button variant="primary" block="true" leading-icon="restart" onclick="window.location.reload()">Retry Connection</atoll-button>
          `
          container.appendChild(setupDiv)
          return
        }

        if ($state.isAuthenticated && $state.isVaultUnlocked) {
          container.className = 'h-100 w-100 overflow-hidden d-flex'

          const mainContent = document.createElement('div')
          mainContent.className = 'flex-grow-1 h-100 position-relative d-flex'
          mainContent.appendChild(document.createElement('app-layout'))
          mainContent.appendChild(document.createElement('create-room-modal'))
          mainContent.appendChild(document.createElement('edit-room-modal'))
          mainContent.appendChild(document.createElement('p2p-reroute-modal'))
          mainContent.appendChild(document.createElement('p2p-consent-modal'))
          container.appendChild(mainContent)
        } else {
          container.className = 'h-100 w-100 overflow-hidden d-flex'

          const mainContent = document.createElement('div')
          mainContent.className = 'flex-grow-1 h-100 position-relative d-flex'

          const rightSection = document.createElement('div')
          rightSection.className = 'flex-grow-1 h-100 position-relative d-flex align-items-center justify-content-center bg-body-tertiary'
          mainContent.appendChild(rightSection)
          container.appendChild(mainContent)

          renderAuthFlow(rightSection)
        }
      }

      const renderAuthFlow = (targetContainer) => {
        const parent = targetContainer || container
        if (!targetContainer) {
          parent.className = 'h-100 w-100 d-flex align-items-center justify-content-center bg-body-tertiary'
        }

        const contentWrapper = document.createElement('div')
        contentWrapper.className = 'container'

        const row = document.createElement('div')
        row.className = 'row justify-content-center'

        const col = document.createElement('div')
        col.className = 'col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4'

        row.appendChild(col)
        contentWrapper.appendChild(row)
        parent.appendChild(contentWrapper)

        if (!$state.isAuthenticated) {
          if ($state.authView === 'register') {
            col.appendChild(document.createElement('auth-register'))
          } else {
            col.appendChild(document.createElement('auth-login'))
          }
        } else if (!$state.isVaultUnlocked) {
          /* Session restored on page refresh (or 2FA challenge required) */
          if (!isDeviceTrusted) {
            col.appendChild(document.createElement('totp-challenge'))
          } else {
            col.appendChild(document.createElement('vault-unlock'))
          }
        }
      }

      /* Listen for unified deep link route events */
      $bus.on('app:route_requested', async ({ path: routePath, queryParams }) => {
        console.log('[app-root] Deep link route requested:', {
          path: routePath,
          queryParams
        })

        const inviteRoomId = queryParams?.invite || (routePath && routePath.startsWith('/invite/') ? routePath.split('/invite/')[1]?.split('?')[0]?.trim() : null)
        if (inviteRoomId) {
          console.log('[app-root] Deep Link Room invitation detected for room:', inviteRoomId)
          await handleJoinRoom(inviteRoomId)
        }
      })

      // Reconnection verification and conflict resolution
      const handleReconnectionHandshake = async () => {
        console.log('[app-root] Reconnection detected. Fetching app metadata in background...')
        const metadata = await fetchServerMetadata()
        if (!metadata) {
          console.warn('[app-root] Reconnection verification fetch failed. Remaining in offline state.')
          return
        }

        const activeId = localStorage.getItem('atoll_active_instance_id')
        const newId = metadata.instance_id

        if (activeId && activeId !== newId) {
          console.error('[app-root] INSTANCE ID MISMATCH DETECTED ON RECONNECTION!', {
            activeId,
            newId
          })
          console.log('[app-root] Server was wiped/rebuilt while offline. Cleaning up local state.')

          // sever database connection
          if (window.$localDb) {
            try {
              await window.$localDb.close()
              console.log('[app-root] Local database closed.')
            } catch (err) {
              console.error('[app-root] Error closing local database:', err)
            }
          }

          // trigger Garbage Collection to delete current database and other orphans
          try {
            if (typeof indexedDB !== 'undefined') {
              indexedDB.deleteDatabase('atoll_data_' + activeId)
              console.log('[app-root] Deleted mismatched database:', 'atoll_data_' + activeId)
            }
          } catch (err) {
            console.error('[app-root] Error deleting mismatched database:', err)
          }

          // Run general GC to be thorough
          await runGarbageCollection(newId)

          // purge user session tokens
          pb.authStore.clear()
          localStorage.removeItem('device_trust_token')
          localStorage.removeItem('atoll_active_instance_id')
          console.log('[app-root] Session tokens and credentials purged.')

          // force hard reload to push user back to clean login screen
          window.location.reload()
          return
        }

        // IDs match: hide Offline Mode and resume
        $state.isOnline = true
        console.log('[app-root] Reconnection verification successful. Instance ID matches.')
      }

      // Network status listener
      $bus.on('app:network_change', (payload) => {
        console.log('[app-root] Network status changed:', payload)
        if (payload.isOnline) {
          handleReconnectionHandshake().catch(console.error)
        } else {
          $state.isOnline = false
        }
      })

      window.addEventListener('online', () => {
        handleReconnectionHandshake().catch(console.error)
      }, { signal })

      // Auth lifecycle management
      $bus.on('auth:unlocked', ({ keys, userRecord }) => {
        $state.currentUser = {
          ...userRecord,
          ...keys
        }

        processPendingInvite().catch(console.error)

        if (!isLifecycleRegistered) {
          isLifecycleRegistered = true
          appLifecycle.registerListeners()
            .then(() => {
              console.log('[app-root] App lifecycle listeners registered successfully.')
            })
            .catch((err) => {
              console.error('[app-root] Failed to register app lifecycle listeners:', err)
            })

          network.registerListeners()
            .then(() => {
              console.log('[app-root] Network listeners registered successfully.')
            })
            .catch((err) => {
              console.error('[app-root] Failed to register network listeners:', err)
            })
        }

        // Only perform background registration silently if browser permissions have already been granted
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          $push.register()
            .then((token) => {
              if (token) {
                console.log('[app-root] Silent push registration successful, transmitting token to backend:', token)
                return pb.collection('users').update(userRecord.id, {
                  push_subscription: token
                })
              }
            })
            .then((updatedUser) => {
              if (updatedUser) {
                console.log('[app-root] Push subscription updated on backend successfully.')
                $state.currentUser = {
                  ...$state.currentUser,
                  push_subscription: updatedUser.push_subscription
                }
              }
            })
            .catch((err) => {
              console.error('[app-root] Silent background push registration/update failed:', err)
            })
        }
      })

      $bus.on('auth:logout', () => {
        $state.currentUser = null
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false

        if ($state.decryptionCache && $state.decryptionCache.forEach) {
          $state.decryptionCache.forEach((cached) => {
            if (!cached) {
              return
            }

            try {
              if (typeof cached === 'string') {
                if (cached.startsWith('blob:')) {
                  URL.revokeObjectURL(cached)
                }
              } else {
                if (cached.blobUrl && typeof cached.blobUrl === 'string' && cached.blobUrl.startsWith('blob:')) {
                  URL.revokeObjectURL(cached.blobUrl)
                }
                if (cached.thumbnailBlobUrl && typeof cached.thumbnailBlobUrl === 'string' && cached.thumbnailBlobUrl.startsWith('blob:')) {
                  URL.revokeObjectURL(cached.thumbnailBlobUrl)
                }
              }
            } catch (err) {
              console.warn('[app-root] Failed to revoke cached object URL:', err)
            }
          })

          $state.decryptionCache.clear()
        }
      })

      $bus.on('auth:totp_passed', () => {
        isDeviceTrusted = true
        updateUI()
      })

      // The dynamic frontend boot handshake
      const startBootHandshake = async () => {
        const metadata = await fetchServerMetadata()
        let instanceId = null

        if (metadata) {
          instanceId = metadata.instance_id
          localStorage.setItem('atoll_active_instance_id', instanceId)
          $state.isOnline = true
        } else {
          // Fallback to cached instance_id
          instanceId = localStorage.getItem('atoll_active_instance_id')
          $state.isOnline = false
        }

        if (!instanceId) {
          // Cold boot offline with no server contact ever - Block access entirely!
          console.error('[app-root] Cold boot offline: No cached instance_id available. Blocking access.')
          $state.isOfflineSetup = true
          updateUI()
          return
        }

        $state.isOfflineSetup = false
        $state.activeInstanceId = instanceId

        const dbName = 'atoll_data_' + instanceId
        console.log('[app-root] Initializing dynamic local database:', dbName)
        await $storage.initialize(dbName)

        // Asynchronously run Garbage Collection in background
        runGarbageCollection(instanceId).catch(err => {
          console.warn('[app-root] Garbage collection failed:', err)
        })

        // Continue normal boot
        $state.isAuthenticated = pb.authStore.isValid
        if ($state.isAuthenticated) {
          $state.currentUser = pb.authStore.model
          const user = pb.authStore.model
          if (!user || !user.public_box_key) {
            $state.isVaultUnlocked = false
          }
        }

        if (!$state.authView) {
          $state.authView = 'login'
        }

        /* Initialize deep link plugin on boot */
        deeplink.initialize().then(async () => {
          console.log('[app-root] DeepLink plugin initialized.')
          if (webrtcTransfer) {
            console.log('[app-root] webrtcTransfer plugin registered.')
          }
          await checkDeviceTrust()
          updateUI()
        }).catch(async (err) => {
          console.error('[app-root] Failed to initialize DeepLink plugin:', err)
          await checkDeviceTrust()
          updateUI()
        })
      }

      // Listen to visual viewport resize & scroll to dynamically adjust layout height and prevent scrolling shifts
      const updateVisualViewportHeight = () => {
        if (window.visualViewport) {
          const height = window.visualViewport.height
          document.documentElement.style.setProperty('--atoll-visual-viewport-height', `${height}px`)
          window.scrollTo(0, 0)
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateVisualViewportHeight, { signal })
        window.visualViewport.addEventListener('scroll', updateVisualViewportHeight, { signal })
        updateVisualViewportHeight()
      }

      /* Initialize boot handshake */
      startBootHandshake().catch((err) => {
        console.error('[app-root] Boot handshake failed:', err)
      })

      $state.subscribe('isAuthenticated', async () => {
        const user = pb.authStore.model
        if ($state.isAuthenticated && (!user || !user.public_box_key)) {
          $state.isVaultUnlocked = false
        }
        await checkDeviceTrust()
        updateUI()
      })
      $state.subscribe('isVaultUnlocked', () => {
        updateUI()
        processPendingInvite().catch(console.error)
      })
      $state.subscribe('authView', updateUI)

      $state.subscribe('isOnline', (val) => {
        if (val) {
          console.log('[app-root] Network is back online. Triggering flushQueue.')
          flushQueue().catch(console.error)
        }
      })
    }
  })
</script>
