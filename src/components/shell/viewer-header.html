<template id="viewer-header">
  <header class="p-3 border-bottom d-flex justify-content-between align-items-center shadow-sm {{ headerClass }}">
    <div class="d-flex align-items-center overflow-hidden">
      <atoll-button variant="ternary" leading-icon="chevron-left" icon-only="true" ref="btnBack" pill="true" class="d-inline-block d-md-none me-3"></atoll-button>
      <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold me-3 flex-shrink-0 {{ iconContainerClass }}" style="width: 40px; height: 40px;">
        <atoll-icon name="{{ icon }}" size="20"></atoll-icon>
      </div>
      <div class="overflow-hidden">
        <h6 class="mb-0 fw-bold text-truncate {{ textClass }}">{{ title }}</h6>
        <small class="{{ subtitleClass }} text-truncate d-block">{{ subtitle }}</small>
      </div>
    </div>
    <div class="flex-shrink-0 ms-3 d-flex align-items-center gap-2">
      <jump-to-chat></jump-to-chat>
      <ui-share-button></ui-share-button>
      <atoll-button
        variant="secondary"
        size="md"
        pill="true"
        icon-only="true"
        leading-icon="close"
        ref="btnClose"
        title="Close"
        aria-label="Close"
        hidden="{{ isCloseHidden }}"
        data-testid="viewerCloseBtn"></atoll-button>
    </div>
  </header>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: String,
      subtitle: String,
      icon: String,
      theme: String
    },
    server: () => ({
      hasSourceChat: false
    }),
    getters: {
      headerClass: (state) => (state.theme === 'dark' ? 'bg-dark border-secondary text-white' : 'bg-body text-body'),
      iconContainerClass: (state) => (state.theme === 'dark' ? 'bg-secondary text-white' : 'bg-primary-subtle text-primary'),
      textClass: (state) => (state.theme === 'dark' ? 'text-white' : 'text-body'),
      subtitleClass: (state) => (state.theme === 'dark' ? 'text-white-50' : 'text-muted'),
      isCloseHidden: (state) => !state.hasSourceChat
    },
    client: ({ state, refs, eventBus, globalStore, signal }) => {
      const { $bus } = eventBus
      const { $state } = globalStore

      const syncSourceChat = () => {
        state.hasSourceChat = Boolean(
          $state.mediaViewerSourceChatRoomId &&
          ($state.activeSelectionType === 'pictures' || $state.activeSelectionType === 'videos')
        )
      }

      const closeViewer = () => {
        const sourceRoomId = $state.mediaViewerSourceChatRoomId
        const sourceMessageId = $state.mediaViewerSourceMessageId

        if (sourceRoomId) {
          $state.mediaViewerSourceChatRoomId = null
          $state.mediaViewerSourceMessageId = null

          if (sourceMessageId) {
            $state.isJumpingToMessage = true
            $state.jumpToMessageId = sourceMessageId
          }

          $state.currentAppView = 'chats'
          $state.activeSelectionId = sourceRoomId
          $state.activeSelectionType = 'chats'
        }
      }

      refs('btnBack').addEventListener('click', () => {
        $bus.emit('ui:open_mobile_nav')
      }, { signal })

      refs('btnClose').addEventListener('click', closeViewer, { signal })

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.hasSourceChat) {
          e.preventDefault()
          closeViewer()
        }
      }, { signal })

      $state.subscribe('mediaViewerSourceChatRoomId', () => {
        syncSourceChat()
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type !== 'pictures' && type !== 'videos') {
          $state.mediaViewerSourceChatRoomId = null
          $state.mediaViewerSourceMessageId = null
        }
        syncSourceChat()
      })

      syncSourceChat()
    }
  })
</script>
