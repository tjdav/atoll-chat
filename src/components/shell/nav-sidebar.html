<template id="nav-sidebar">
  <nav class="nav-sidebar d-flex flex-column align-items-center py-3 border-end bg-body h-100" data-testid="navSidebar" role="navigation" aria-label="Main menu">
    <div class="nav flex-column nav-pills w-100 gap-2" hidden="{{ isSidebarMenuHidden }}">
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isChatsActive }}" ref="btnChats" title="Chats" data-testid="btnChats">
        <div class="atoll-badge-container">
          <img src="/logo.svg" alt="Atoll chat logo" class="img-fluid">
          <atoll-badge count="{{ totalUnread }}" size="sm" class="atoll-badge-positioned" data-testid="chats-unread-badge"></atoll-badge>
        </div>
      </button>
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isMusicActive }}" ref="btnMusic" title="Music" data-testid="btnMusic">
        <atoll-icon name="music" size="24" active="{{ isMusicActiveBool }}"></atoll-icon>
      </button>
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isPicturesActive }}" ref="btnPictures" title="Pictures" data-testid="btnPictures">
        <atoll-icon name="gallery" size="24" active="{{ isPicturesActiveBool }}"></atoll-icon>
      </button>
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isVideosActive }}" ref="btnVideos" title="Videos" data-testid="btnVideos">
        <atoll-icon name="videocam" size="24" active="{{ isVideosActiveBool }}"></atoll-icon>
      </button>
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isDocumentsActive }}" ref="btnDocuments" title="Documents" data-testid="btnDocuments">
        <atoll-icon name="document" size="24" active="{{ isDocumentsActiveBool }}"></atoll-icon>
      </button>
      <button class="nav-link d-flex align-items-center justify-content-center atoll-touch-target {{ isLinksActive }}" ref="btnLinks" title="Links" data-testid="btnLinks">
        <atoll-icon name="link" size="24" active="{{ isLinksActiveBool }}"></atoll-icon>
      </button>
    </div>
    
    <div class="mt-auto w-100 px-2 d-flex flex-column gap-3 position-relative align-items-center">
      <!-- Profile Avatar / Settings Dropup -->
      <div class="dropup w-100 d-flex justify-content-center align-items-center" ref="profileDropupContainer">
        <button class="btn p-0 border-0 d-flex align-items-center justify-content-center atoll-touch-target" 
                type="button" 
                data-bs-toggle="dropdown" 
                aria-expanded="false" 
                ref="profileBtn" 
                data-testid="profileBtn" 
                title="Account">
          <div ref="avatarContainer" class="d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
            <!-- Render avatar dynamically or standard fallback inside client -->
          </div>
        </button>
        <ul class="dropdown-menu shadow p-0 overflow-hidden" style="min-width: 200px; margin-bottom: 8px;" ref="profileDropdownMenu" data-testid="profileDropdownMenu">
          <!-- Settings Section -->
          <li>
            <button class="dropdown-item d-flex align-items-center gap-2 py-2 px-3 {{ isSettingsActive }}" ref="btnSettings" data-testid="btnSettings">
              <atoll-icon name="settings" size="20"></atoll-icon>
              <span>Settings</span>
            </button>
          </li>
          
          <li><hr class="dropdown-divider m-0"></li>
          
          <!-- Logout Section -->
          <li>
            <button class="dropdown-item d-flex align-items-center gap-2 py-2 px-3" ref="btnLogout" data-testid="btnLogout">
              <atoll-icon name="logout" size="20"></atoll-icon>
              <span>Logout</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      currentAppView: 'chats',
      isAuthenticated: false,
      isVaultUnlocked: false,
      totalUnread: 0
    }),
    getters: {
      isChatsActive: (state) => (state.currentAppView === 'chats' ? 'active' : ''),
      isMusicActive: (state) => (state.currentAppView === 'music' ? 'active' : ''),
      isPicturesActive: (state) => (state.currentAppView === 'pictures' ? 'active' : ''),
      isVideosActive: (state) => (state.currentAppView === 'videos' ? 'active' : ''),
      isDocumentsActive: (state) => (state.currentAppView === 'documents' ? 'active' : ''),
      isLinksActive: (state) => (state.currentAppView === 'links' ? 'active' : ''),
      isSettingsActive: (state) => (state.currentAppView === 'settings' ? 'active' : ''),
      isMusicActiveBool: (state) => state.currentAppView === 'music',
      isPicturesActiveBool: (state) => state.currentAppView === 'pictures',
      isVideosActiveBool: (state) => state.currentAppView === 'videos',
      isDocumentsActiveBool: (state) => state.currentAppView === 'documents',
      isLinksActiveBool: (state) => state.currentAppView === 'links',
      isSidebarMenuHidden: (state) => !(state.isAuthenticated && state.isVaultUnlocked)
    },
    client: async ({ refs, state, globalStore, pocketbase, eventBus, cryptoWorker, bootstrap, storage }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $worker } = cryptoWorker
      const { Dropdown } = await bootstrap
      const { $storage } = storage

      // Init and subscribe to states
      state.currentAppView = $state.currentAppView || 'chats'
      state.isAuthenticated = $state.isAuthenticated || false
      state.isVaultUnlocked = $state.isVaultUnlocked || false
      state.totalUnread = 0

      const calculateTotalUnread = async () => {
        if (!state.isAuthenticated || !state.isVaultUnlocked) {
          state.totalUnread = 0
          return
        }
        try {
          const rooms = await $storage.getAllRoomsSorted()
          let unreadCount = 0
          for (const room of rooms) {
            const latestMsg = await $storage.getLatestMessage(room.id)
            if (latestMsg) {
              const me = room.participants?.find(p => p.id === $state.currentUser?.id)
              let isUnread = latestMsg && (
                me?.last_read_message_id === null ||
                (latestMsg.sender_id !== $state.currentUser?.id && latestMsg.id !== me?.last_read_message_id)
              )
  
              if ($state.currentAppView === 'chats' && $state.activeSelectionId === room.id) {
                isUnread = false
              }
  
              if (isUnread) {
                unreadCount++
              }
            }
          }
          state.totalUnread = unreadCount
        } catch (err) {
          console.error('[nav-sidebar] Failed to calculate total unread chats:', err)
          state.totalUnread = 0
        }
      }

      const updateUnread = () => {
        calculateTotalUnread().catch(console.error)
      }

      $bus.on('db:new_local_data', updateUnread)
      $bus.on('db:new_local_room', updateUnread)
      $bus.on('db:room_deleted', updateUnread)
      $bus.on('room:member_updated', updateUnread)
      $bus.on('room:read_state_changed', updateUnread)
      $bus.on('sync:complete', updateUnread)
      $bus.on('auth:unlocked', updateUnread)
      $bus.on('auth:logout', updateUnread)

      $state.subscribe('currentAppView', (value) => state.currentAppView = value)
      $state.subscribe('isAuthenticated', (value) => {
        state.isAuthenticated = value
        updateAvatar()
        updateUnread()
      })
      $state.subscribe('isVaultUnlocked', (value) => {
        state.isVaultUnlocked = value
        updateAvatar()
        updateUnread()
      })

      if (state.isAuthenticated && state.isVaultUnlocked) {
        updateUnread()
      }

      // Setup view navigation buttons
      const btnChats = refs('btnChats')
      const btnMusic = refs('btnMusic')
      const btnPictures = refs('btnPictures')
      const btnVideos = refs('btnVideos')
      const btnDocuments = refs('btnDocuments')
      const btnLinks = refs('btnLinks')
      const profileDropupContainer = refs('profileDropupContainer')
      const profileDropdownMenu = refs('profileDropdownMenu')
      void btnChats; void btnMusic; void btnPictures; void btnVideos; void btnDocuments; void btnLinks; void profileDropupContainer; void profileDropdownMenu

      const views = {
        btnChats: 'chats',
        btnMusic: 'music',
        btnPictures: 'pictures',
        btnVideos: 'videos',
        btnDocuments: 'documents',
        btnLinks: 'links',
        btnSettings: 'settings'
      }

      Object.entries(views).forEach(([refName, viewName]) => {
        const btn = refs(refName)
        if (btn) {
          btn.addEventListener('click', () => {
            // Hide dropdown if clicked Settings inside the dropdown
            if (refName === 'btnSettings' && dropdownInstance) {
              dropdownInstance.hide()
            }

            if ($state.currentAppView === viewName) {
              return
            }

            // Set transient flag to prevent closing offcanvas on mobile during view switch
            $state.isSidebarNavigating = true

            if (!$state.lastSelections) {
              $state.lastSelections = {}
            }

            if ($state.activeSelectionId) {
              $state.lastSelections[$state.currentAppView] = {
                id: $state.activeSelectionId,
                type: $state.activeSelectionType
              }
            } else {
              delete $state.lastSelections[$state.currentAppView]
            }

            $state.currentAppView = viewName

            const last = $state.lastSelections[viewName]
            if (last) {
              $state.activeSelectionId = last.id
              $state.activeSelectionType = last.type
            } else {
              $state.activeSelectionId = null
              $state.activeSelectionType = null
            }

            setTimeout(() => {
              $state.isSidebarNavigating = false
            }, 0)
          })
        }
      })

      // Set up dropup trigger & dropdown initialization
      const profileBtn = refs('profileBtn')
      let dropdownInstance = new Dropdown(profileBtn)

      // Render profile avatar / fallback inside the dropup button
      const avatarContainer = refs('avatarContainer')
      const updateAvatar = () => {
        avatarContainer.innerHTML = ''

        const avatar = document.createElement('atoll-profile')
        avatar.setAttribute('size', 'sm')

        if (state.isAuthenticated && pb.authStore.model) {
          const user = pb.authStore.model
          avatar.setAttribute('alt', user.name || user.username || 'User profile')
          if (user.id) {
            avatar.setAttribute('user-id', user.id)
          }
          if (user.avatar) {
            const avatarUrl = pb.files.getURL(user, user.avatar, { thumb: '42x42' })
            avatar.setAttribute('src', avatarUrl)
          }
        } else {
          avatar.setAttribute('alt', 'Guest')
        }

        avatarContainer.appendChild(avatar)
      }

      // Button: Logout Action
      const btnLogout = refs('btnLogout')
      btnLogout.addEventListener('click', async () => {
        if (dropdownInstance) {
          dropdownInstance.hide()
        }
        pb.authStore.clear()
        $state.authView = 'login'
        $bus.emit('auth:logout')

        try {
          await $worker.execute('worker:wipe_keys')
        } catch (err) {
          console.warn('[nav-sidebar] Failed to wipe keys in worker:', err)
        }
      })

      // Initialize renders
      updateAvatar()

      $bus.on('auth:logout', () => {
        updateAvatar()
      })
    }
  })
</script>
