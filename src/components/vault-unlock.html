<template id="vault-unlock">
  <div ref="modal" class="modal fade" tabindex="-1" aria-labelledby="{{ ref_modalTitle }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="{{ ref_modalTitle }}" class="modal-title" ref="modalTitle">Unlock Your Vault</h5>
        </div>
        <div class="modal-body">
          <p>Your session is active, but your cryptographic keys are locked. Please enter your password to unlock them.</p>
          <form ref="unlockForm">
            <div class="form-group mb-3">
              <label for="{{ ref_pin }}">Vault Password</label>
              <input id="{{ ref_pin }}" ref="pin" type="password" class="form-control" placeholder="Enter Password" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Unlock with Password</button>
              <button type="button" class="btn btn-outline-primary d-none" ref="btnPasskey">Unlock with Passkey</button>
            </div>
          </form>
          <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link btn-sm" ref="btnLogout">Logout</button>
        </div>
      </div>
    </div>
  </div>
</template>

<style>
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, eventBus, realtimeSync, globalStore, cryptoWorker, bootstrap, signal }) => {
      const [{ default: sodium }, { deriveKeyFromPin, decryptVault }] = await Promise.all([
        import('libsodium-wrappers-sumo'),
        import('../utils/cryptoUtils.js')
      ])
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const { Modal } = bootstrap
      const modalEl = refs('modal')
      const modal = new Modal(modalEl, {
        backdrop: 'static',
        keyboard: false
      })
      modal.show()

      const unlockForm = refs('unlockForm')
      const pinInput = refs('pin')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')
      const btnPasskey = refs('btnPasskey')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      btnLogout.addEventListener('click', () => {
        pb.authStore.clear()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      const checkPasskeySupport = async () => {
        const record = pb.authStore.model
        if (record && record.passkey_credential_id) {
          btnPasskey.classList.remove('d-none')
        }
      }

      checkPasskeySupport()

      const completeUnlock = async (decryptedKeys, record) => {
        updateStatus('Vault unlocked!')

        // Initialize worker with decrypted keys and token
        const { $worker } = cryptoWorker
        await $worker.execute('SET_TOKEN', { token: pb.authStore.token })
        await $worker.execute('INIT_KEYS', decryptedKeys)

        // Set global state immediately to transition UI
        $state.isVaultUnlocked = true

        // Emit successful unlock event
        $bus.emit('auth:unlocked', {
          keys: decryptedKeys,
          userRecord: record
        })

        modal.hide()

        // Start real-time subscriptions in background
        $sync.startSubscriptions().catch(err => {
          console.error('[vault-unlock] Background sync failed:', err)
        })
      }

      signal.addEventListener('abort', () => {
        modal.dispose()
      })

      unlockForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        const pin = pinInput.value

        try {
          updateStatus('Locating vault...')
          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const { pin_salt: pinSaltBase64, encrypted_master_keys: encryptedMasterKeys } = record

          if (!encryptedMasterKeys) {
            updateStatus('Error: Secure vault not found on server.')
            return
          }

          updateStatus('Unlocking secure vault...')
  
          await sodium.ready

          const pinSalt = sodium.from_base64(pinSaltBase64, sodium.base64_variants.ORIGINAL)
          const KEK = await deriveKeyFromPin(pin, pinSalt, sodium)

          const decryptedKeys = decryptVault(
            encryptedMasterKeys.ciphertext,
            encryptedMasterKeys.nonce,
            KEK,
            sodium
          )

          await completeUnlock(decryptedKeys, record)
        } catch (error) {
          console.error('Unlock error:', error)
          let errorMessage = 'Unlock failed'
  
          if (error.message && error.message.includes('decrypt')) {
            errorMessage = 'Invalid Password or Corrupt Vault'
          } else if (error.message) {
            errorMessage = error.message
          }
  
          updateStatus(errorMessage)
        }
      })

      btnPasskey.addEventListener('click', async () => {
        try {
          updateStatus('Locating vault...')
          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const {
            passkey_credential_id: credentialIdBase64,
            passkey_prf_salt: prfSaltBase64,
            encrypted_master_keys_passkey: encryptedMasterKeys
          } = record

          if (!encryptedMasterKeys || !credentialIdBase64 || !prfSaltBase64) {
            updateStatus('Error: Passkey vault not found on server.')
            return
          }

          updateStatus('Waiting for Passkey...')
          const [{ default: sodium }, { deriveKeyFromPasskey, decryptVault }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])
          await sodium.ready

          const credentialId = sodium.from_base64(credentialIdBase64, sodium.base64_variants.ORIGINAL)
          const prfSalt = sodium.from_base64(prfSaltBase64, sodium.base64_variants.ORIGINAL)
          const challenge = crypto.getRandomValues(new Uint8Array(32))

          const KEK = await deriveKeyFromPasskey(credentialId, challenge, prfSalt)

          const decryptedKeys = decryptVault(
            encryptedMasterKeys.ciphertext,
            encryptedMasterKeys.nonce,
            KEK,
            sodium
          )

          await completeUnlock(decryptedKeys, record)
        } catch (error) {
          console.error('Unlock error:', error)
          updateStatus(`Error: ${error.message || 'Unlock failed'}`)
        }
      })
    }
  })
</script>
