<template id="vault-unlock">
  <div class="vault-unlock-overlay" ref="overlay">
    <div class="vault-unlock-modal">
      <div class="modal-header">
        <h5 class="modal-title">Unlock Your Vault</h5>
      </div>
      <div class="modal-body">
        <p>Your session is active, but your cryptographic keys are locked.</p>
        <form ref="unlockForm">
          <div class="form-group mb-3">
            <label for="pin">Vault PIN</label>
            <input ref="pin" id="pin" type="password" class="form-control" placeholder="Enter PIN" required>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Unlock with PIN</button>
            <button type="button" class="btn btn-outline-secondary" ref="btnPasskey" disabled>Unlock with Passkey (Coming Soon)</button>
          </div>
        </form>
        <div ref="statusMsg" class="status-message mt-3 text-muted text-center"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link btn-sm" ref="btnLogout">Logout</button>
      </div>
    </div>
  </div>
</template>

<style>
  .vault-unlock-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }
  .vault-unlock-modal {
    background: white;
    padding: 2rem;
    border-radius: 0.5rem;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    max-width: 400px;
    width: 90%;
  }
  .status-message {
    font-size: 0.875rem;
    min-height: 1.25rem;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    script: ({ refs, pocketbase, eventBus, realtimeSync, globalStore }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $sync } = realtimeSync
      const { $state } = globalStore
      const unlockForm = refs('unlockForm')
      const pinInput = refs('pin')
      const statusMsg = refs('statusMsg')
      const btnLogout = refs('btnLogout')

      const updateStatus = (message) => {
        statusMsg.textContent = message
      }

      btnLogout.addEventListener('click', () => {
        pb.authStore.clear()
        $state.isAuthenticated = false
        $state.isVaultUnlocked = false
      })

      unlockForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        const pin = pinInput.value

        try {
          updateStatus('Locating vault...')
          
          // Re-fetch user record to ensure we have the latest vault data
          const record = await pb.collection('users').getOne(pb.authStore.model.id)
  
          const { pin_salt: pinSaltBase64, encrypted_master_keys: encryptedMasterKeys } = record

          if (!encryptedMasterKeys) {
            updateStatus('Error: Vault not found on server.')
            return
          }

          updateStatus('Unlocking secure vault...')

          // Dynamically import dependencies
          const [{ default: sodium }, {
            deriveKeyFromPin,
            decryptVault
          }] = await Promise.all([
            import('libsodium-wrappers-sumo'),
            import('../utils/cryptoUtils.js')
          ])

          await sodium.ready

          const pinSalt = sodium.from_base64(pinSaltBase64, sodium.base64_variants.ORIGINAL)
          const KEK = await deriveKeyFromPin(pin, pinSalt, sodium)

          // Decrypt the vault
          const decryptedKeys = decryptVault(
            encryptedMasterKeys.ciphertext,
            encryptedMasterKeys.nonce,
            KEK,
            sodium
          )

          updateStatus('Vault unlocked!')

          // Initialize worker with decrypted keys
          const { $worker } = await import('coralite').then(m => m.getContext().cryptoWorker())
          await $worker.execute('INIT_KEYS', decryptedKeys)

          // Start real-time subscriptions
          await $sync.startSubscriptions()

          // Emit successful unlock event
          $bus.emit('auth:unlocked', {
            keys: decryptedKeys,
            userRecord: record
          })

          $state.isVaultUnlocked = true

        } catch (error) {
          console.error('Unlock error:', error)
          let errorMessage = 'Unlock failed'
  
          if (error.message && error.message.includes('decrypt')) {
            errorMessage = 'Invalid PIN or Corrupt Vault'
          } else if (error.message) {
            errorMessage = error.message
          }
  
          updateStatus(errorMessage)
        }
      })
    }
  })
</script>
