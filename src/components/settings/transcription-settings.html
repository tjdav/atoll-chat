<template id="transcription-settings">
  <div class="d-flex flex-column gap-3">
    <div>
      <h6 class="mb-1">Local Speech-to-Text Model</h6>
      <p class="text-muted small mb-3">Configure the speech-to-text transcription engine. Models run 100% locally and securely in your browser sandbox.</p>
    </div>

    <atoll-list mode="selection" divided="true" class="shadow-sm rounded border bg-body">
      <atoll-list-item
        ref="itemTiny"
        title="Moonshine Tiny"
        description="Ultra-fast transcription with extremely low memory usage. Perfect for most short voice messages."
        value="onnx-community/moonshine-tiny-ONNX"
        checked="{{ isTinyChecked }}"
        highlighted="{{ isTinySelected }}"
        selected="{{ isTinySelected }}"
        data-testid="opt-moonshine-tiny"
      ></atoll-list-item>

      <atoll-list-item
        ref="itemSmall"
        title="Moonshine Base (Small)"
        description="Higher accuracy with robust recognition. Requires slightly more memory and compute."
        value="onnx-community/moonshine-base-ONNX"
        checked="{{ isSmallChecked }}"
        highlighted="{{ isSmallSelected }}"
        selected="{{ isSmallSelected }}"
        data-testid="opt-moonshine-base"
      ></atoll-list-item>

      <atoll-list-item
        ref="itemMedium"
        title="Whisper Medium"
        description="Highest transcription accuracy for multilingual and complex audio. Requires more compute."
        value="onnx-community/whisper-medium"
        checked="{{ isMediumChecked }}"
        highlighted="{{ isMediumSelected }}"
        selected="{{ isMediumSelected }}"
        data-testid="opt-whisper-medium"
      ></atoll-list-item>
    </atoll-list>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      selectedModel: 'onnx-community/moonshine-tiny-ONNX'
    }),
    getters: {
      isTinyChecked: (state) => (state.selectedModel === 'onnx-community/moonshine-tiny-ONNX' ? 'true' : null),
      isTinySelected: (state) => (state.selectedModel === 'onnx-community/moonshine-tiny-ONNX' ? 'true' : null),
      isSmallChecked: (state) => (state.selectedModel === 'onnx-community/moonshine-base-ONNX' ? 'true' : null),
      isSmallSelected: (state) => (state.selectedModel === 'onnx-community/moonshine-base-ONNX' ? 'true' : null),
      isMediumChecked: (state) => (state.selectedModel === 'onnx-community/whisper-medium' ? 'true' : null),
      isMediumSelected: (state) => (state.selectedModel === 'onnx-community/whisper-medium' ? 'true' : null)
    },
    client: async ({ refs, state, globalStore, storage, root }) => {
      const { $state } = globalStore
      const { $storage } = storage

      const itemTiny = refs('itemTiny') || root.querySelector('[data-testid="opt-moonshine-tiny"]')
      const itemSmall = refs('itemSmall') || root.querySelector('[data-testid="opt-moonshine-base"]')
      const itemMedium = refs('itemMedium') || root.querySelector('[data-testid="opt-whisper-medium"]')

      if (!itemTiny || !itemSmall || !itemMedium) {
        return
      }

      state.selectedModel = $state.transcriptionModel || 'onnx-community/moonshine-tiny-ONNX'

      // Synchronize item DOM checked, selected, and highlighted attributes on initial load
      const syncDOMAttributes = (model) => {
        const isTiny = model === 'onnx-community/moonshine-tiny-ONNX'
        const isSmall = model === 'onnx-community/moonshine-base-ONNX'
        const isMedium = model === 'onnx-community/whisper-medium'

        // Since checked, selected, highlighted are mapped inside atoll-list-item as Boolean/String attributes
        if (isTiny) {
          itemTiny.setAttribute('checked', 'true')
          itemTiny.setAttribute('selected', 'true')
          itemTiny.setAttribute('highlighted', 'true')
        } else {
          itemTiny.removeAttribute('checked')
          itemTiny.removeAttribute('selected')
          itemTiny.removeAttribute('highlighted')
        }

        if (isSmall) {
          itemSmall.setAttribute('checked', 'true')
          itemSmall.setAttribute('selected', 'true')
          itemSmall.setAttribute('highlighted', 'true')
        } else {
          itemSmall.removeAttribute('checked')
          itemSmall.removeAttribute('selected')
          itemSmall.removeAttribute('highlighted')
        }

        if (isMedium) {
          itemMedium.setAttribute('checked', 'true')
          itemMedium.setAttribute('selected', 'true')
          itemMedium.setAttribute('highlighted', 'true')
        } else {
          itemMedium.removeAttribute('checked')
          itemMedium.removeAttribute('selected')
          itemMedium.removeAttribute('highlighted')
        }
      }

      syncDOMAttributes(state.selectedModel)

      const updateSelection = async (model) => {
        state.selectedModel = model
        $state.transcriptionModel = model
        await $storage.saveConfig('transcription_model', model)
        syncDOMAttributes(model)
      }

      const handleSelectionChange = async (e) => {
        // e.detail is an array containing the selection item info: [{ checked, value }]
        const detail = e.detail?.[0]
        if (!detail) {
          return
        }

        // Since it behaves like a radio choice, if they try to deselect, we enforce it to be checked
        if (!detail.checked && detail.value === state.selectedModel) {
          // Re-apply attributes so it stays selected
          syncDOMAttributes(state.selectedModel)
          return
        }

        if (detail.checked) {
          await updateSelection(detail.value)
        }
      }

      itemTiny.addEventListener('atoll-selection-change', handleSelectionChange)
      itemSmall.addEventListener('atoll-selection-change', handleSelectionChange)
      itemMedium.addEventListener('atoll-selection-change', handleSelectionChange)

      $state.subscribe('transcriptionModel', (val) => {
        if (val && val !== state.selectedModel) {
          state.selectedModel = val
          syncDOMAttributes(val)
        }
      })
    }
  })
</script>
