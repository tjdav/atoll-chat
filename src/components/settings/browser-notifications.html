<template id="browser-notifications">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h6 class="mb-0">Browser Notifications</h6>
      <p class="text-muted small mb-0">Get alerted when new messages arrive.</p>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" ref="notifSwitch" checked="{{ notifChecked }}">
    </div>
  </div>
  <div class="alert alert-warning align-items-center {{ permissionAlertClass }}" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div class="small">
      Notifications are blocked by your browser. Please enable them in your browser settings to use this feature.
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      notificationsEnabled: true,
      permissionStatus: 'default'
    }),
    getters: {
      notifChecked: (state) => (state.notificationsEnabled && state.permissionStatus !== 'denied' ? 'checked' : ''),
      permissionAlertClass: (state) => (state.permissionStatus === 'denied' ? 'd-flex' : 'd-none')
    },
    client: async ({ refs, state, globalStore, notifications, push, pocketbase }) => {
      const { $state } = globalStore
      const { $notifications } = notifications
      const { $push } = push
      const { pb } = pocketbase

      state.notificationsEnabled = $state.notificationsEnabled ?? true
      state.permissionStatus = typeof Notification !== 'undefined' ? Notification.permission : 'default'

      const notifSwitch = refs('notifSwitch')
      if (notifSwitch) {
        notifSwitch.checked = state.notificationsEnabled && state.permissionStatus !== 'denied'
  
        notifSwitch.addEventListener('change', async () => {
          if (notifSwitch.checked) {
            const granted = await $notifications.requestPermission()
            if (granted) {
              $state.notificationsEnabled = true
              state.notificationsEnabled = true

              // Generate the VAPID subscription and save/PATCH it in PocketBase
              try {
                const token = await $push.register()
                if (token && pb.authStore.model) {
                  await pb.collection('users').update(pb.authStore.model.id, {
                    push_subscription: token
                  })
                  console.log('[browser-notifications] Push registration successful, transmitting token to backend:', token)
                }
              } catch (err) {
                console.error('[browser-notifications] Failed to register push subscription on toggle:', err)
              }
            } else {
              notifSwitch.checked = false
              $state.notificationsEnabled = false
              state.notificationsEnabled = false
            }
          } else {
            $state.notificationsEnabled = false
            state.notificationsEnabled = false

            // Nullify the push subscription on backend
            try {
              if (pb.authStore.model) {
                await pb.collection('users').update(pb.authStore.model.id, {
                  push_subscription: null
                })
                console.log('[browser-notifications] Push subscription disabled/removed on backend successfully.')
              }
            } catch (err) {
              console.error('[browser-notifications] Failed to clear push subscription on disable:', err)
            }
          }
          state.permissionStatus = Notification.permission
        })
      }
    }
  })
</script>
