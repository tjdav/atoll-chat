<template id="account-danger-zone">
  <section class="mt-4">
    <h6 class="text-uppercase text-danger fw-bold small mb-3">Danger Zone</h6>

    <!-- Delete Message History Card -->
    <div class="card shadow-sm border border-danger-subtle mb-3 bg-body">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="fw-semibold text-danger mb-1">Delete Message History</div>
            <div class="small text-muted">
              Permanently delete all messages and media you have sent across all rooms. Your rooms and memberships will remain intact.
            </div>
          </div>
          <button ref="btnDeleteHistory" data-testid="btnDeleteHistory" class="btn btn-outline-danger btn-sm ms-3 text-nowrap">
            Delete Message History
          </button>
        </div>
      </div>
    </div>

    <!-- Delete Account Card -->
    <div class="card shadow-sm border border-danger mb-0 bg-body">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="fw-semibold text-danger mb-1">Delete Account</div>
            <div class="small text-muted">
              Permanently delete your account record, encrypted keys, biometric credentials, memberships, and all sent content. This action is irreversible.
            </div>
          </div>
          <button ref="btnDeleteAccount" data-testid="btnDeleteAccount" class="btn btn-danger btn-sm ms-3 text-nowrap">
            Delete Account
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Reusable Permission & Password Modal -->
  <atoll-permission-modal ref="permissionModal" data-testid="permissionModal"></atoll-permission-modal>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase, storage, cryptoWorker, biometric, eventBus, signal }) => {
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $storage } = storage
      const { $worker } = cryptoWorker

      const btnDeleteHistory = refs('btnDeleteHistory')
      const btnDeleteAccount = refs('btnDeleteAccount')
      const permissionModal = refs('permissionModal')

      // Delete History Action
      btnDeleteHistory.addEventListener('click', async () => {
        if (!permissionModal || typeof permissionModal.prompt !== 'function') {
          return
        }

        const result = await permissionModal.prompt({
          title: 'Delete Message History',
          description: 'Are you sure you want to delete your entire message history? All messages and media uploaded by you will be permanently removed from the server and local storage.',
          actionLabel: 'Delete History',
          variant: 'danger',
          allowBiometric: true
        })

        if (!result || (!result.keyB && !result.password)) {
          return
        }

        const password = result.keyB || result.password

        try {
          const res = await pb.send('/api/custom/history/delete', {
            method: 'POST',
            body: { password }
          })

          if (res && res.success) {
            if ($storage && typeof $storage.clearLocalHistory === 'function') {
              await $storage.clearLocalHistory()
            }
            if ($worker && typeof $worker.execute === 'function') {
              await $worker.execute('worker:clear_local_history').catch(() => {
              })
            }

            $bus.emit('db:history_cleared')
            $bus.emit('ui:show_toast', {
              message: 'Message history deleted successfully.',
              variant: 'success',
              type: 'success'
            })
          } else {
            throw new Error(res?.message || 'Failed to delete message history.')
          }
        } catch (err) {
          console.error('[account-danger-zone] Delete history error:', err)
          $bus.emit('ui:show_toast', {
            message: err.data?.message || err.message || 'Failed to delete message history.',
            variant: 'danger',
            type: 'danger'
          })
        }
      }, { signal })

      // Delete Account Action
      btnDeleteAccount.addEventListener('click', async () => {
        if (!permissionModal || typeof permissionModal.prompt !== 'function') {
          return
        }

        const result = await permissionModal.prompt({
          title: 'Delete Account',
          description: 'This will permanently destroy your user account, room memberships, authored messages, and cryptographic vault. This action cannot be undone.',
          actionLabel: 'Permanently Delete Account',
          variant: 'danger',
          allowBiometric: true
        })

        if (!result || (!result.keyB && !result.password)) {
          return
        }

        const password = result.keyB || result.password
        const userId = pb.authStore.model?.id

        try {
          const res = await pb.send('/api/custom/account/delete', {
            method: 'POST',
            body: { password }
          })

          if (res && res.success) {
            // Teardown Sequence
            if (userId) {
              if (biometric && typeof biometric.deleteMasterKey === 'function') {
                await biometric.deleteMasterKey(userId).catch(() => {
                })
              }
              localStorage.removeItem(`atoll_biometric_credentials_${userId}`)
              try {
                const bioUsers = JSON.parse(localStorage.getItem('atoll_biometric_users') || '[]')
                const filtered = bioUsers.filter(u => u.id !== userId)
                localStorage.setItem('atoll_biometric_users', JSON.stringify(filtered))
              } catch (_) {
              }
            }

            if ($worker && typeof $worker.execute === 'function') {
              await $worker.execute('worker:wipe_keys').catch(() => {
              })
            }

            const activeInstanceId = localStorage.getItem('atoll_active_instance_id')
            if (activeInstanceId && typeof indexedDB !== 'undefined') {
              try {
                indexedDB.deleteDatabase('atoll_data_' + activeInstanceId)
              } catch (_) {
              }
            }

            localStorage.removeItem('device_trust_token')
            localStorage.removeItem('atoll_active_instance_id')

            pb.authStore.clear()
            $bus.emit('auth:logout')

            window.location.reload()
          } else {
            throw new Error(res?.message || 'Failed to delete account.')
          }
        } catch (err) {
          console.error('[account-danger-zone] Delete account error:', err)
          $bus.emit('ui:show_toast', {
            message: err.data?.message || err.message || 'Failed to delete account.',
            variant: 'danger',
            type: 'danger'
          })
        }
      }, { signal })
    }
  })
</script>
