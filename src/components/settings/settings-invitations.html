<template id="settings-invitations">
  <div class="settings-invitations">
    <div class="mb-4">
      <h5 class="fw-bold mb-3">Your Quota & Privileges</h5>
      <div class="d-flex align-items-center mb-3">
        <div class="bg-primary-subtle text-primary p-3 rounded-circle me-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
          <atoll-icon name="key" size="24"></atoll-icon>
        </div>
        <div>
          <div class="text-muted small">Invite Quota Remaining</div>
          <h3 class="fw-bold mb-0" ref="quotaValue" data-testid="quotaValue">--</h3>
        </div>
      </div>

      <div class="alert alert-warning d-none" ref="revokedAlert" data-testid="revokedAlert">
        <atoll-icon name="info" size="18" class="me-2"></atoll-icon>
        Your invite generation privileges have been suspended by an administrator.
      </div>

      <div class="alert alert-danger d-none" ref="strictAlert" data-testid="strictAlert">
        <atoll-icon name="info" size="18" class="me-2"></atoll-icon>
        Instance invitation generation is currently in strict/owner-only mode.
      </div>

      <div class="mt-4">
        <atoll-button variant="primary" ref="btnGenerateInvite" data-testid="btnGenerateInvite">Generate Invitation Link</atoll-button>
      </div>
    </div>

    <!-- Generated Invitations List Section -->
    <div ref="historySection">
      <hr class="my-4">
      <h5 class="fw-bold mb-3">Your Generated Invitations</h5>

      <!-- Empty State Card -->
      <div class="card bg-light border-0 text-center p-4 my-3 d-none" ref="emptyStateCard" data-testid="emptyStateCard">
        <div class="card-body">
          <div class="text-muted mb-2">
            <atoll-icon name="key" size="36"></atoll-icon>
          </div>
          <h6 class="fw-bold text-dark mb-1">No Invitations Generated Yet</h6>
          <p class="text-muted small mb-0">Click "Generate Invitation Link" above to create your first invite link and share it with others.</p>
        </div>
      </div>

      <!-- History List Container -->
      <div class="d-none" ref="historyCard" data-testid="historyCard">
        <atoll-list divided="true" ref="invitationsList" data-testid="invitationsList">
          <!-- Dynamically populated list items -->
        </atoll-list>
      </div>
    </div>

    <!-- Invite Request Panel -->
    <div class="d-none" ref="requestQuotaCard" data-testid="requestQuotaCard">
      <hr class="my-4">
      <h5 class="fw-bold mb-3">Request Invite Quota</h5>
      <p class="text-muted small">Your quota is currently 0. You can submit a request to the instance administrator for additional invite credits. Your justification note will be encrypted with the owner's public key (Zero-Knowledge) and will not leak plaintext to any server.</p>

      <form ref="requestQuotaForm">
        <div class="mb-3">
          <label class="form-label small fw-bold">Requested Credits Count</label>
          <atoll-select ref="requestedCountSelect" data-testid="requestedCountSelect">
            <option value="1">1 Credit</option>
            <option value="2" selected>2 Credits</option>
            <option value="5">5 Credits</option>
            <option value="10">10 Credits</option>
          </atoll-select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Justification / Reason (Zero-Knowledge Encrypted)</label>
          <textarea class="form-control" rows="3" ref="requestReasonTextarea" required placeholder="Describe why you need invitations..." data-testid="requestReasonTextarea"></textarea>
        </div>

        <div class="alert alert-success d-none" ref="requestSuccessAlert" data-testid="requestSuccessAlert">
          <atoll-icon name="check-circle" size="18" class="me-2"></atoll-icon>
          Invite request submitted successfully!
        </div>

        <div class="alert alert-danger d-none" ref="requestErrorAlert">
          <atoll-icon name="danger" size="18" class="me-2"></atoll-icon>
          <span ref="requestErrorText">Failed to submit request.</span>
        </div>

        <div class="d-grid mt-4">
          <atoll-button variant="primary" type="submit" ref="btnSubmitRequest" data-testid="btnSubmitRequest">Submit Sealed Request</atoll-button>
        </div>
      </form>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, globalStore, pocketbase, signal }) => {
      const { $state, $bus } = globalStore
      const pb = pocketbase

      const quotaValue = refs('quotaValue')
      const revokedAlert = refs('revokedAlert')
      const strictAlert = refs('strictAlert')
      const btnGenerateInvite = refs('btnGenerateInvite')

      const requestQuotaCard = refs('requestQuotaCard')
      const requestQuotaForm = refs('requestQuotaForm')
      const requestedCountSelect = refs('requestedCountSelect')
      const requestReasonTextarea = refs('requestReasonTextarea')
      const requestSuccessAlert = refs('requestSuccessAlert')
      const requestErrorAlert = refs('requestErrorAlert')
      const requestErrorText = refs('requestErrorText')
      const btnSubmitRequest = refs('btnSubmitRequest')

      const emptyStateCard = refs('emptyStateCard')
      const historyCard = refs('historyCard')
      const invitationsList = refs('invitationsList')

      let currentQuota = 0
      let isOwner = false
      let isRevoked = false
      let currentInviteMode = 'delegated'
      let invitationsData = []

      const formatRelativeTime = (isoString) => {
        if (!isoString) {
          return '—'
        }
        const date = new Date(isoString)
        const now = new Date()
        const diffInSeconds = Math.floor((now - date) / 1000)

        if (isNaN(diffInSeconds) || diffInSeconds < 0) {
          return 'Just now'
        }
        if (diffInSeconds < 60) {
          return 'Just now'
        }
        if (diffInSeconds < 3600) {
          return `${Math.floor(diffInSeconds / 60)}m ago`
        }
        if (diffInSeconds < 86400) {
          return `${Math.floor(diffInSeconds / 3600)}h ago`
        }
        if (diffInSeconds < 604800) {
          return `${Math.floor(diffInSeconds / 86400)}d ago`
        }
        return date.toLocaleDateString()
      }

      const createListItemForInvite = (inv, highlight = false) => {
        const item = document.createElement('atoll-list-item')

        if (highlight) {
          item.setAttribute('highlighted', 'true')
          setTimeout(() => {
            item.removeAttribute('highlighted')
          }, 2000)
        }

        // Determine status badge
        let statusBadge = '<span class="badge bg-success-subtle text-success border border-success-subtle ms-2">Active</span>'
        if (inv.is_used || inv.used_count >= inv.max_uses) {
          statusBadge = '<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle ms-2">Used</span>'
        } else if (inv.expires_at) {
          const expiresTime = new Date(inv.expires_at).getTime()
          if (expiresTime < Date.now()) {
            statusBadge = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle ms-2">Expired</span>'
          }
        }

        // Determine description string
        let description = `${inv.used_count || 0} / ${inv.max_uses || 3} uses`
        if (inv.used_by) {
          const username = inv.used_by.username || (typeof inv.used_by === 'string' ? inv.used_by : 'unknown')
          description += ` • Claimed by @${username}`
        }

        const createdText = formatRelativeTime(inv.created)

        item.setAttribute('title', inv.code)
        item.setAttribute('description', description)
        item.setAttribute('timestamp', createdText)

        item.innerHTML = `
          <div slot="leading" class="bg-primary-subtle text-primary p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
            <atoll-icon name="key" size="18"></atoll-icon>
          </div>
          <div class="d-flex align-items-center">
            <code class="fw-bold text-primary user-select-all fs-6 mb-0">${inv.code}</code>
            ${statusBadge}
          </div>
          <div slot="right" class="d-inline-flex gap-1 align-items-center">
            <button type="button" class="btn btn-sm btn-outline-primary btn-copy-link d-inline-flex align-items-center gap-1" data-code="${inv.code}">
              <atoll-icon name="link" size="14"></atoll-icon>
              <span class="btn-copy-link-text">Copy Link</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary btn-copy-code btn-copy-history" data-code="${inv.code}" title="Copy Code">
              <atoll-icon name="copy" size="14"></atoll-icon>
            </button>
          </div>
        `

        return item
      }

      const renderInvitationsList = () => {
        if (!invitationsData || invitationsData.length === 0) {
          historyCard.classList.add('d-none')
          emptyStateCard.classList.remove('d-none')
          return
        }

        emptyStateCard.classList.add('d-none')
        historyCard.classList.remove('d-none')
        invitationsList.innerHTML = ''

        invitationsData.forEach((inv) => {
          const item = createListItemForInvite(inv)
          invitationsList.appendChild(item)
        })
      }

      const fetchInvitations = async () => {
        try {
          const list = await pb.send('/api/custom/invites/list', { method: 'GET' }).catch(() => [])
          if (signal?.aborted) {
            return
          }

          invitationsData = Array.isArray(list) ? list : []
          renderInvitationsList()
        } catch (err) {
          if (!signal?.aborted) {
            console.error('Failed to load invitations history:', err)
          }
        }
      }

      const fetchStatus = async () => {
        try {
          // Fetch governance configuration
          const metaRes = await pb.send('/api/custom/admin/overview', { method: 'GET' }).catch(() => null)
          if (metaRes) {
            currentInviteMode = metaRes.metadata?.invite_mode || 'delegated'

            if (currentInviteMode === 'strict') {
              strictAlert.classList.remove('d-none')
            } else {
              strictAlert.classList.add('d-none')
            }
          }

          // Fetch active user trust parameters
          const authRecord = pb.authStore.record
          if (authRecord) {
            const trustList = await pb.collection('user_trust').getFullList({
              filter: `user = "${authRecord.id}"`
            }).catch(() => [])

            let trustRec = trustList[0]
            if (!trustRec) {
              await pb.send('/api/custom/owner/public-key', { method: 'GET' }).catch(() => null)
              const updatedTrust = await pb.collection('user_trust').getFullList({
                filter: `user = "${authRecord.id}"`
              }).catch(() => [])
              trustRec = updatedTrust[0]
            }

            if (trustRec) {
              currentQuota = trustRec.invite_quota || 0
              isOwner = trustRec.tier === 'owner'
              isRevoked = !!trustRec.invites_revoked

              quotaValue.textContent = isOwner ? 'Unlimited (Owner)' : currentQuota

              if (isRevoked) {
                revokedAlert.classList.remove('d-none')
                btnGenerateInvite.setAttribute('disabled', 'true')
              } else {
                revokedAlert.classList.add('d-none')
                btnGenerateInvite.removeAttribute('disabled')
              }

              // Show request quota form if quota is 0, user is not owner, and requests are allowed
              const allowRequests = !metaRes || metaRes.metadata?.allow_quota_requests !== false
              if (currentQuota === 0 && !isOwner && !isRevoked && allowRequests) {
                requestQuotaCard.classList.remove('d-none')
              } else {
                requestQuotaCard.classList.add('d-none')
              }
            }
          }

          // Fetch history of generated invitation codes
          await fetchInvitations()
        } catch (err) {
          if (!signal?.aborted) {
            throw err
          }
        }
      }

      await fetchStatus()

      // Event delegation for copy actions
      historyCard.addEventListener('click', (e) => {
        // Copy Link Button
        const btnLink = e.target.closest('.btn-copy-link')
        if (btnLink) {
          const code = btnLink.getAttribute('data-code')
          if (code) {
            const fullUrl = `${window.location.origin}/?invite=${code}`
            navigator.clipboard.writeText(fullUrl)

            const iconEl = btnLink.querySelector('atoll-icon')
            const textEl = btnLink.querySelector('.btn-copy-link-text')
            if (iconEl) {
              iconEl.setAttribute('name', 'check')
            }
            if (textEl) {
              textEl.textContent = 'Copied!'
            }

            if ($bus) {
              $bus.emit('ui:show_toast', {
                message: 'Invitation link copied to clipboard!',
                type: 'success'
              })
            }

            setTimeout(() => {
              if (iconEl) {
                iconEl.setAttribute('name', 'link')
              }
              if (textEl) {
                textEl.textContent = 'Copy Link'
              }
            }, 2000)
          }
          return
        }

        // Copy Code Button
        const btnCode = e.target.closest('.btn-copy-code')
        if (btnCode) {
          const code = btnCode.getAttribute('data-code')
          if (code) {
            navigator.clipboard.writeText(code)

            const iconEl = btnCode.querySelector('atoll-icon')
            if (iconEl) {
              iconEl.setAttribute('name', 'check')
            }

            if ($bus) {
              $bus.emit('ui:show_toast', {
                message: 'Invite code copied to clipboard!',
                type: 'success'
              })
            }

            setTimeout(() => {
              if (iconEl) {
                iconEl.setAttribute('name', 'copy')
              }
            }, 1500)
          }
        }
      }, { signal })

      // Wire up the generate invitation button
      btnGenerateInvite.addEventListener('click', async () => {
        try {
          btnGenerateInvite.setAttribute('loading', 'true')
          const newInv = await pb.send('/api/custom/invites/generate', { method: 'POST' })

          if ($bus) {
            $bus.emit('ui:show_toast', {
              message: 'Invitation link generated successfully!',
              type: 'success'
            })
          }

          // Decrement local quota if not owner
          if (!isOwner && currentQuota > 0) {
            currentQuota -= 1
            quotaValue.textContent = currentQuota
            if (currentQuota === 0) {
              requestQuotaCard.classList.remove('d-none')
            }
          }

          // Prepend new invitation to list
          invitationsData.unshift(newInv)
          emptyStateCard.classList.add('d-none')
          historyCard.classList.remove('d-none')

          const item = createListItemForInvite(newInv, true)
          invitationsList.insertBefore(item, invitationsList.firstChild)
        } catch (err) {
          if ($bus) {
            $bus.emit('ui:show_toast', {
              message: err.message || 'Failed to generate invitation link.',
              type: 'danger'
            })
          } else {
            alert(err.message || 'Failed to generate invitation link.')
          }
        } finally {
          btnGenerateInvite.removeAttribute('loading')
        }
      }, { signal })

      // Submit the sealed zero-knowledge quota request
      requestQuotaForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        requestSuccessAlert.classList.add('d-none')
        requestErrorAlert.classList.add('d-none')

        const count = requestedCountSelect.value
        const reason = requestReasonTextarea.value.trim()

        if (!reason) {
          return
        }

        try {
          btnSubmitRequest.setAttribute('loading', 'true')

          // Fetch Instance Owner's public key
          const pubKeyRes = await pb.send('/api/custom/owner/public-key', { method: 'GET' })
          const ownerPubKey = pubKeyRes.ownerPublicKey

          if (!ownerPubKey) {
            throw new Error('Could not retrieve instance owner public key.')
          }

          // Execute libsodium.crypto_box_seal inside worker
          const sealedReason = await $state.cryptoWorker.request('worker:crypto_box_seal', {
            message: reason,
            publicKey: ownerPubKey
          })

          // Submit to PocketBase custom endpoint
          await pb.send('/api/custom/invites/request', {
            method: 'POST',
            body: {
              requested_count: parseInt(count, 10),
              encrypted_reason: sealedReason
            }
          })

          requestSuccessAlert.classList.remove('d-none')
          requestReasonTextarea.value = ''

          await fetchStatus()
        } catch (err) {
          requestErrorText.textContent = err.message || 'Failed to submit sealed request.'
          requestErrorAlert.classList.remove('d-none')
        } finally {
          btnSubmitRequest.removeAttribute('loading')
        }
      }, { signal })
    }
  })
</script>
