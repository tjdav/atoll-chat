<template id="settings-main">
  <div class="settings-main d-flex flex-column h-100 bg-body">
    <!-- Top Bar Header -->
    <header class="app-header atoll-chat-view-header d-flex justify-content-between align-items-center border-bottom bg-body px-3">
      <div class="d-flex align-items-center">
        <atoll-button variant="ghost" leading-icon="chevron-left" icon-only="true" ref="btnBack" pill="true" class="d-inline-block d-md-none me-3" data-testid="settingsBackBtn"></atoll-button>
        <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 40px; height: 40px;">
          <atoll-icon name="setting-two" size="20"></atoll-icon>
        </div>
        <div>
          <h6 class="atoll-text-title-2 mb-0">Account &amp; Preferences</h6>
          <small class="atoll-chat-view-header-subtitle mb-0 text-muted">Profile, security, and application options</small>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <div ref="scrollContainer" data-testid="scrollContainer" class="flex-grow-1 overflow-y-auto p-4" style="position: relative;" data-bs-spy="scroll" data-bs-target="#settings-navbar" data-bs-offset="30">
      <div class="container-fluid pb-5">
        <div class="row">
          <div class="col-12 col-md-10 offset-md-1 col-lg-8 offset-lg-2">
            
            <!-- Section: Account Info -->
            <div id="section-account">
              <account-info></account-info>
            </div>
            <hr class="my-5 opacity-25">

            <!-- Section: Profile Settings -->
            <div id="section-profile">
              <profile-settings></profile-settings>
            </div>
            <hr class="my-5 opacity-25">

            <!-- Section: Notifications -->
            <div id="section-notifications">
              <h6 class="text-uppercase text-muted fw-bold small mb-3">Notifications</h6>
              <notifications-settings></notifications-settings>
              <hr class="my-4">
              <sound-notifications></sound-notifications>
            </div>
            <hr class="my-5 opacity-25">

            <!-- Section: Security -->
            <div id="section-security">
              <h6 class="text-uppercase text-muted fw-bold small mb-3">Security</h6>
              <passkey-settings></passkey-settings>
              <hr class="my-4">
              <totp-settings></totp-settings>
            </div>
            <hr class="my-5 opacity-25">

            <!-- Section: Voice & Transcription -->
            <div id="section-transcription">
              <h6 class="text-uppercase text-muted fw-bold small mb-3">Voice & Transcription</h6>
              <transcription-settings></transcription-settings>
            </div>
            <hr class="my-5 opacity-25">

            <!-- Section: Invitations -->
            <div id="section-invitations">
              <h6 class="text-uppercase text-muted fw-bold small mb-3">Invitations</h6>
              <settings-invitations></settings-invitations>
            </div>

            <!-- Section: Administration Group (rendered for owner tier) -->
            <div ref="adminContentGroup" class="d-none">
              <hr class="my-5 opacity-25">
              <!-- Section: Admin Overview -->
              <div id="section-admin-overview">
                <h6 class="text-uppercase text-muted fw-bold small mb-3">Administration: Overview</h6>
                <admin-overview></admin-overview>
              </div>
              <hr class="my-5 opacity-25">

              <!-- Section: Admin Trust Matrix -->
              <div id="section-admin-trust">
                <h6 class="text-uppercase text-muted fw-bold small mb-3">Administration: User Trust Matrix</h6>
                <admin-trust-matrix></admin-trust-matrix>
              </div>
              <hr class="my-5 opacity-25">

              <!-- Section: Admin Requests -->
              <div id="section-admin-requests">
                <h6 class="text-uppercase text-muted fw-bold small mb-3">Administration: Invite Requests</h6>
                <admin-requests></admin-requests>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, eventBus, bootstrap, globalStore, pocketbase, root, signal }) => {
      const { $bus } = eventBus
      const { $state } = globalStore
      const { ScrollSpy } = bootstrap
      const pb = pocketbase
      const adminContentGroup = refs('adminContentGroup')

      // Check if user is owner to show administration sections
      const authRecord = pb.authStore.record
      if (authRecord) {
        pb.collection('user_trust').getFullList({
          filter: `user = "${authRecord.id}"`
        }).then((trustList) => {
          const trustRec = trustList ? trustList[0] : null
          if (trustRec && trustRec.tier === 'owner') {
            adminContentGroup.classList.remove('d-none')
          }
        }).catch((err) => {
          // Identify expected permission or auto-cancellation issues from PocketBase
          const isExpectedPbError = err && (err.status === 404 || err.status === 403 || err.isAbort)
          if (!isExpectedPbError && err instanceof Error && !(err.name === 'ClientResponseError')) {
            throw err
          }
          // Failing closed: do not show admin content on expected permission/abort errors
          return null
        })
      }

      const btnBack = refs('btnBack')
      btnBack.addEventListener('click', () => {
        $state.activeSelectionId = null
        $state.activeSelectionType = null
        $bus.emit('ui:open_mobile_nav')
      }, { signal })

      const scrollEl = refs('scrollContainer')
      let spyInstance = null

      /**
       * Initializes the Bootstrap ScrollSpy on the settings scroll container.
       */
      const initScrollSpy = () => {
        if (document.querySelector('#settings-navbar')) {
          spyInstance = new ScrollSpy(scrollEl, {
            target: '#settings-navbar',
            offset: 30,
            smoothScroll: true
          })
        }
      }

      // Defer initialization to guarantee elements are fully mounted and sized
      setTimeout(initScrollSpy, 400)

      /**
       * Synchronizes the active settings section with the sidebar menu by
       * calculating scroll positions and emitting the active section ID.
       */
      const handleScrollSync = () => {
        if (spyInstance) {
          spyInstance.refresh()
        }

        // Supplementary high-reliability active class sync
        const sections = [
          '#section-account',
          '#section-profile',
          '#section-notifications',
          '#section-security',
          '#section-transcription',
          '#section-invitations',
          '#section-admin-overview',
          '#section-admin-trust',
          '#section-admin-requests'
        ]
        let activeId = sections[0]

        for (const id of sections) {
          const el = root.querySelector(id)
          if (el) {
            const rect = el.getBoundingClientRect()
            const parentRect = scrollEl.getBoundingClientRect()
            if (rect.top - parentRect.top <= 120) {
              activeId = id
            }
          }
        }

        $bus.emit('settings:section_active', { activeId })
      }

      scrollEl.addEventListener('scroll', handleScrollSync, {
        passive: true,
        signal
      })

      // Listen for the custom scroll-to-section event from settings-pane
      $bus.on('settings:scroll_to_section', ({ targetId }) => {
        const targetEl = root.querySelector(targetId)
        if (targetEl) {
          targetEl.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          })
        }
      }, { signal })
    }
  })
</script>
