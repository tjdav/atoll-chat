<template id="settings-pane">
  <div class="settings-pane h-100 d-flex flex-column bg-body-tertiary">
    <div class="flex-grow-1 overflow-y-auto p-3">
      <atoll-list id="settings-navbar" class="shadow-sm rounded border bg-body">
        <atoll-list-item 
          title="Account Info" 
          href="#section-account" 
          selected="true" 
          clickable="true" 
          data-testid="nav-account"
        >
          <atoll-icon slot="left" name="user" size="20"></atoll-icon>
        </atoll-list-item>

        <atoll-list-item 
          title="Profile Settings" 
          href="#section-profile" 
          clickable="true" 
          data-testid="nav-profile"
        >
          <atoll-icon slot="left" name="setting-two" size="20"></atoll-icon>
        </atoll-list-item>

        <atoll-list-item 
          title="Notifications" 
          href="#section-notifications" 
          clickable="true" 
          data-testid="nav-notifications"
        >
          <atoll-icon slot="left" name="remind" size="20"></atoll-icon>
        </atoll-list-item>

        <atoll-list-item 
          title="Security & Passkeys" 
          href="#section-security" 
          clickable="true" 
          data-testid="nav-security"
        >
          <atoll-icon slot="left" name="permissions" size="20"></atoll-icon>
        </atoll-list-item>

        <atoll-list-item 
          title="Voice & Transcription" 
          href="#section-transcription" 
          clickable="true" 
          data-testid="nav-transcription"
        >
          <atoll-icon slot="left" name="mic" size="20"></atoll-icon>
        </atoll-list-item>

        <atoll-list-item 
          title="Invitations" 
          href="#section-invitations" 
          clickable="true" 
          data-testid="nav-invitations"
        >
          <atoll-icon slot="left" name="key" size="20"></atoll-icon>
        </atoll-list-item>
      </atoll-list>

      <!-- ADMINISTRATION Section Header and sub-menu (Only rendered for owner tier) -->
      <div ref="adminGroup" class="d-none mt-4">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-2">Administration</h6>
        <atoll-list id="admin-settings-navbar" class="shadow-sm rounded border bg-body">
          <atoll-list-item 
            title="Overview & Settings" 
            href="#section-admin-overview" 
            clickable="true" 
            data-testid="nav-admin-overview"
          >
            <atoll-icon slot="left" name="setting-two" size="20"></atoll-icon>
          </atoll-list-item>

          <atoll-list-item 
            title="User Trust Matrix" 
            href="#section-admin-trust" 
            clickable="true" 
            data-testid="nav-admin-trust"
          >
            <atoll-icon slot="left" name="user" size="20"></atoll-icon>
          </atoll-list-item>

          <atoll-list-item 
            title="Invite Requests" 
            href="#section-admin-requests" 
            clickable="true" 
            data-testid="nav-admin-requests"
          >
            <atoll-icon slot="left" name="remind" size="20"></atoll-icon>
          </atoll-list-item>
        </atoll-list>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ eventBus, globalStore, pocketbase, refs, root, signal }) => {
      const { $bus } = eventBus
      const { $state } = globalStore
      const pb = pocketbase
      const adminGroup = refs('adminGroup')

      /**
       * Checks if the currently authenticated user has the 'owner' tier trust level.
       *
       * @param {Object} pbClient - Pocketbase instance client.
       * @param {string} userId - The identifier of the user to check.
       * @returns {Promise<boolean>} True if the user is verified as an owner, false otherwise.
       * @throws {Error} Propagates unexpected PocketBase or network failures.
       */
      async function checkUserOwnerTier (pbClient, userId) {
        if (!pbClient || !userId) {
          return false
        }

        try {
          const trustList = await pbClient.collection('user_trust').getFullList({
            filter: `user = "${userId}"`
          })
          const trustRec = trustList[0]
          return !!(trustRec && trustRec.tier === 'owner')
        } catch (err) {
          if (err && typeof err === 'object' && 'status' in err) {
            const status = err.status
            if (status === 404 || status === 403 || status === 401) {
              return false
            }
          }
          throw err
        }
      }

      // Check if user is owner safely
      const authRecord = pb.authStore.record
      if (authRecord) {
        try {
          const isOwner = await checkUserOwnerTier(pb, authRecord.id)
          if (isOwner) {
            adminGroup.classList.remove('d-none')
          }
        } catch (err) {
          // Fail closed safely without exposing or elevating rights
          adminGroup.classList.add('d-none')
          // Propagate the unexpected system error as requested by rules
          throw err
        }
      }

      /**
       * Synchronizes navbar selection highlights and fires event to scroll
       * the selected setting main section into view.
       *
       * @param {HTMLElement} item - The clicked navbar list item element.
       * @param {HTMLElement[]} allNavbarItems - Array of all settings navbar elements.
       */
      const syncNavbarSelections = (item, allNavbarItems) => {
        try {
          const targetId = item.getAttribute('href')

          /* Set active selection to trigger detail view on mobile */
          $state.activeSelectionType = 'settings'
          $state.activeSelectionId = targetId

          $bus.emit('ui:selection_made')

          // Update selection highlights manually
          allNavbarItems.forEach(i => i.setAttribute('selected', 'false'))
          item.setAttribute('selected', 'true')

          // Emit custom event rather than querying other component elements directly
          $bus.emit('settings:scroll_to_section', { targetId })
        } catch (err) {
          // Re-throw unexpected runtime errors
          throw err
        }
      }

      const allItems = []
      // Restrict DOM lookup within the component's root to preserve component boundaries
      root.querySelectorAll('#settings-navbar atoll-list-item').forEach(i => allItems.push(i))
      root.querySelectorAll('#admin-settings-navbar atoll-list-item').forEach(i => allItems.push(i))

      allItems.forEach(item => {
        item.addEventListener('atoll-item-click', (e) => {
          e.preventDefault()
          syncNavbarSelections(item, allItems)
        }, { signal })
      })

      // Sync active selection on scroll event from settings-main
      $bus.on('settings:section_active', ({ activeId }) => {
        allItems.forEach(link => {
          if (link.getAttribute('href') === activeId) {
            link.setAttribute('selected', 'true')
          } else {
            link.setAttribute('selected', 'false')
          }
        })
      }, { signal })
    }
  })
</script>
