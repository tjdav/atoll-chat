<template id="account-info">
  <section class="mb-4">
    <h6 class="text-uppercase text-muted fw-bold small mb-3">Account Information</h6>
    <div class="mb-0">
      <label class="form-label small text-muted text-uppercase fw-bold">Username</label>
      <div class="form-control bg-body-tertiary">{{ username }}</div>
    </div>
  </section>

  <!-- Data & Privacy / GDPR Export Section -->
  <section class="mt-4">
    <h6 class="text-uppercase text-muted fw-bold small mb-3">Data & Privacy</h6>
    <div class="card shadow-sm border bg-body">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="fw-semibold text-body mb-1">Export Account Data (GDPR)</div>
            <div class="small text-muted">
              Download a full machine-readable copy of your account profile, rooms, media metadata, invitations, and decrypted message history in compliance with GDPR Article 15 & 20.
            </div>
          </div>
          <button ref="btnExportData" data-testid="btnExportData" class="btn btn-outline-primary btn-sm ms-3 text-nowrap">
            <atoll-icon name="download" class="me-1"></atoll-icon>Export Data
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="mt-4">
    <h6 class="text-uppercase text-muted fw-bold small mb-3">Local Storage & Cache</h6>
    <div class="card shadow-sm border bg-body">
      <div class="card-body">
        <!-- Chat Messages Card -->
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <div>
            <div class="fw-semibold text-body mb-1">
              Chat Messages
              <span class="badge bg-secondary-subtle text-secondary-emphasis ms-2 fw-normal">{{ messagesUsageText }}</span>
            </div>
            <div class="small text-muted">Clear cached text and link message history stored on this device.</div>
          </div>
          <button ref="btnClearMessages" data-testid="btnClearMessages" class="btn btn-outline-secondary btn-sm ms-3 text-nowrap">
            Clear Messages
          </button>
        </div>

        <!-- Voice Messages Card -->
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <div>
            <div class="fw-semibold text-body mb-1">
              Voice Notes
              <span class="badge bg-secondary-subtle text-secondary-emphasis ms-2 fw-normal">{{ voiceUsageText }}</span>
            </div>
            <div class="small text-muted">Clear cached voice recordings and waveforms stored locally.</div>
          </div>
          <button ref="btnClearVoice" data-testid="btnClearVoice" class="btn btn-outline-secondary btn-sm ms-3 text-nowrap">
            Clear Voice Notes
          </button>
        </div>

        <!-- Media & Attachments Card -->
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <div>
            <div class="fw-semibold text-body mb-1">
              Media & Attachments
              <span class="badge bg-secondary-subtle text-secondary-emphasis ms-2 fw-normal">{{ mediaUsageText }}</span>
            </div>
            <div class="small text-muted">Clear cached images, videos, audio clips, and document files stored locally.</div>
          </div>
          <button ref="btnClearMedia" data-testid="btnClearMedia" class="btn btn-outline-secondary btn-sm ms-3 text-nowrap">
            Clear Media
          </button>
        </div>

        <!-- Total Storage Footer -->
        <div class="d-flex align-items-center justify-content-between pt-1">
          <div class="fw-semibold text-body">
            Total Local Storage: <span>{{ totalUsageText }}</span>
          </div>
          <button ref="btnClearAllCache" data-testid="btnClearAllCache" class="btn btn-outline-primary btn-sm text-nowrap">
            Clear All Cache
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Reusable Permission & Password Modal -->
  <atoll-permission-modal ref="permissionModal" data-testid="permissionModal"></atoll-permission-modal>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      username: 'User',
      messagesUsageText: '0 B',
      voiceUsageText: '0 B',
      mediaUsageText: '0 B',
      totalUsageText: '0 B'
    }),
    client: async ({ state, globalStore, pocketbase, storage, eventBus, refs, signal }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $storage } = storage

      const formatBytes = (bytes) => {
        if (!bytes || bytes <= 0) {
          return '0 B'
        }
        const units = ['B', 'KB', 'MB', 'GB', 'TB']
        const i = Math.floor(Math.log(bytes) / Math.log(1024))
        if (i === 0) {
          return `${bytes} B`
        }
        const num = bytes / Math.pow(1024, i)
        const formatted = num % 1 === 0 ? num.toFixed(0) : num.toFixed(1)
        return `${formatted} ${units[i]}`
      }

      const loadUserData = () => {
        const user = $state.currentUser
        state.username = user?.username || 'User'
      }

      const refreshStorageUsage = async () => {
        if (!$storage || typeof $storage.getStorageUsage !== 'function') {
          return
        }
        try {
          const usage = await $storage.getStorageUsage()
          const { messagesBytes, messagesCount, voiceBytes, voiceCount, mediaBytes, mediaCount, totalBytes } = usage || {}

          const msgBytes = messagesBytes || 0
          const msgCount = messagesCount || 0
          const vBytes = voiceBytes || 0
          const vCount = voiceCount || 0
          const mBytes = mediaBytes || 0
          const mCount = mediaCount || 0
          const totBytes = totalBytes || 0

          state.messagesUsageText = msgCount === 0
            ? '0 B'
            : `${formatBytes(msgBytes)} • ${msgCount} ${msgCount === 1 ? 'message' : 'messages'}`

          state.voiceUsageText = vCount === 0
            ? '0 B'
            : `${formatBytes(vBytes)} • ${vCount} ${vCount === 1 ? 'note' : 'notes'}`

          state.mediaUsageText = mCount === 0
            ? '0 B'
            : `${formatBytes(mBytes)} • ${mCount} ${mCount === 1 ? 'file' : 'files'}`

          state.totalUsageText = formatBytes(totBytes)
        } catch (err) {
          console.error('[account-info] Failed to calculate storage usage:', err)
        }
      }

      loadUserData()
      await refreshStorageUsage()

      $state.subscribe('currentUser', loadUserData, { signal })

      $bus.on('db:new_local_data', refreshStorageUsage, { signal })
      $bus.on('db:history_cleared', refreshStorageUsage, { signal })

      const btnExportData = refs('btnExportData')
      const permissionModal = refs('permissionModal')
      const btnClearMedia = refs('btnClearMedia')
      const btnClearVoice = refs('btnClearVoice')
      const btnClearMessages = refs('btnClearMessages')
      const btnClearAllCache = refs('btnClearAllCache')

      if (btnExportData) {
        btnExportData.addEventListener('click', async () => {
          try {
            if (!permissionModal || typeof permissionModal.prompt !== 'function') {
              return
            }

            const authRes = await permissionModal.prompt({
              title: 'Export Account Data',
              description: 'Export all personal account data, room metadata, cryptographic keys, and decrypted chat history in compliance with GDPR Article 15 & 20.',
              actionLabel: 'Export Data',
              allowBiometric: true
            })

            if (!authRes || (!authRes.keyB && !authRes.password)) {
              return
            }

            const password = authRes.keyB || authRes.password
            const username = $state.currentUser?.username || pb?.authStore?.model?.username || 'user'
            const userId = $state.currentUser?.id || pb?.authStore?.model?.id || ''

            let localData = {
              rooms: [],
              messages: [],
              config: [],
              assets: []
            }
            if ($storage && typeof $storage.exportLocalData === 'function') {
              try {
                localData = await $storage.exportLocalData()
              } catch (err) {
                console.warn('[account-info] Local data export warning:', err)
              }
            }

            let isOffline = false
            let serverData = null

            if (pb && typeof pb.send === 'function') {
              try {
                const res = await pb.send('/api/custom/account/export', {
                  method: 'POST',
                  body: { password }
                })
                if (res && res.success && res.data) {
                  serverData = res.data
                } else {
                  isOffline = true
                }
              } catch (err) {
                console.warn('[account-info] Server data export request failed, falling back to offline export:', err)
                isOffline = true
              }
            } else {
              isOffline = true
            }

            // Process client preferences from local config
            const clientPreferences = {}
            if (Array.isArray(localData.config)) {
              for (const item of localData.config) {
                if (item && item.key) {
                  clientPreferences[item.key] = item.value
                }
              }
            }

            // Process room conversations from local messages
            const roomConversations = {}
            const localMsgMap = new Map()
            if (Array.isArray(localData.messages)) {
              for (const locMsg of localData.messages) {
                if (locMsg.id) {
                  localMsgMap.set(locMsg.id, locMsg)
                }
                if (locMsg.local_uuid) {
                  localMsgMap.set(locMsg.local_uuid, locMsg)
                }

                const rId = locMsg.room_id
                if (!rId) {
                  continue
                }
                if (!roomConversations[rId]) {
                  roomConversations[rId] = []
                }
                roomConversations[rId].push({
                  local_uuid: locMsg.local_uuid || '',
                  id: locMsg.id || locMsg.local_uuid || '',
                  room_id: rId,
                  sender_id: locMsg.sender_id || '',
                  sender_name: locMsg.sender_name || locMsg.sender || '',
                  type: locMsg.type || 'text',
                  text: locMsg.text || locMsg.content || '',
                  created_at: locMsg.created_at || locMsg.timestamp || 0
                })
              }
            }

            let finalExport = null

            if (!isOffline && serverData) {
            // Merge decrypted_content into authored_messages if local message exists
              const mergedAuthoredMessages = (serverData.authored_messages || []).map((m) => {
                const locMsg = localMsgMap.get(m.id) || localMsgMap.get(m.previous_msg_uuid)
                const decrypted_content = locMsg
                  ? {
                    type: locMsg.type || 'text',
                    text: locMsg.text || '',
                    reactions: locMsg.reactions || []
                  }
                  : {
                    type: 'text',
                    text: '',
                    reactions: []
                  }
                return {
                  ...m,
                  decrypted_content
                }
              })

              finalExport = {
                gdpr_compliance: {
                  standard: 'GDPR (EU 2016/679)',
                  rights_covered: [
                    'Article 15 (Right of Access)',
                    'Article 20 (Right to Data Portability)'
                  ],
                  exported_at: new Date().toISOString(),
                  export_version: '1.0',
                  offline_export: false
                },
                user_profile: serverData.user_profile,
                cryptographic_credentials: serverData.cryptographic_credentials,
                trust_and_governance: serverData.trust_and_governance,
                rooms: serverData.rooms,
                authored_messages: mergedAuthoredMessages,
                room_conversations: roomConversations,
                media_records: serverData.media_records,
                invitations: serverData.invitations,
                invite_requests: serverData.invite_requests,
                client_preferences: clientPreferences
              }
            } else {
            // Offline fallback export construction
              const user = $state.currentUser || pb?.authStore?.model || {}
              finalExport = {
                gdpr_compliance: {
                  standard: 'GDPR (EU 2016/679)',
                  rights_covered: [
                    'Article 15 (Right of Access)',
                    'Article 20 (Right to Data Portability)'
                  ],
                  exported_at: new Date().toISOString(),
                  export_version: '1.0',
                  offline_export: true
                },
                user_profile: {
                  id: user.id || userId,
                  username: user.username || username,
                  email: user.email || '',
                  name: user.name || user.username || username,
                  avatar: user.avatar || '',
                  created: user.created || null,
                  updated: user.updated || null
                },
                cryptographic_credentials: {
                  public_box_key: user.public_box_key || '',
                  public_sign_key: user.public_sign_key || '',
                  vault_salt: user.vault_salt || '',
                  passkey_credential_id: user.passkey_credential_id || null,
                  passkey_public_key: user.passkey_public_key || null,
                  passkey_counter: user.passkey_counter || 0
                },
                trust_and_governance: null,
                rooms: (localData.rooms || []).map((r) => ({
                  id: r.id,
                  name: r.name || '',
                  is_group: Boolean(r.is_group),
                  created_by: r.created_by || '',
                  role: r.role || 'member',
                  is_muted: Boolean(r.is_muted),
                  last_seen_message_id: r.last_seen_message_id || null,
                  last_seen_at: r.last_seen_at || null,
                  custom_name: r.custom_name || '',
                  theme: r.theme || '',
                  is_pinned: Boolean(r.is_pinned),
                  is_archived: Boolean(r.is_archived),
                  draft: r.draft || ''
                })),
                authored_messages: (localData.messages || [])
                  .filter((m) => m.sender_id === userId)
                  .map((m) => ({
                    id: m.id || m.local_uuid,
                    room_id: m.room_id,
                    sender_id: m.sender_id,
                    epoch_id: m.epoch_id || 0,
                    previous_msg_uuid: m.previous_msg_uuid || null,
                    signature: m.signature || '',
                    media_id: m.media_id || null,
                    created: m.created || new Date(m.created_at || Date.now()).toISOString(),
                    decrypted_content: {
                      type: m.type || 'text',
                      text: m.text || '',
                      reactions: m.reactions || []
                    }
                  })),
                room_conversations: roomConversations,
                media_records: (localData.assets || []).map((a) => ({
                  id: a.id,
                  file: a.file || a.fileName || '',
                  mime_type: a.mime_type || '',
                  size: a.size || 0,
                  created: a.created || new Date(a.created_at || Date.now()).toISOString()
                })),
                invitations: [],
                invite_requests: [],
                client_preferences: clientPreferences
              }
            }

            // Trigger JSON File Download
            const dateStr = new Date().toISOString().split('T')[0]
            const jsonContent = JSON.stringify(finalExport, null, 2)
            const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8' })
            let downloadUrl = ''
            try {
              downloadUrl = URL.createObjectURL(blob)
            } catch (_) {
              downloadUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonContent)
            }
            const a = document.createElement('a')
            a.href = downloadUrl
            a.download = `atoll-data-export-${username}-${dateStr}.json`
            try {
              document.body.appendChild(a)
              a.click()
              document.body.removeChild(a)
            } catch (clickErr) {
              console.warn('[account-info] Download click notice:', clickErr)
            }
            if (downloadUrl.startsWith('blob:')) {
              setTimeout(() => {
                try {
                  URL.revokeObjectURL(downloadUrl)
                } catch (_) {
                }
              }, 1000)
            }

            $bus.emit('ui:show_toast', {
              message: 'Account data exported successfully.',
              variant: 'success',
              type: 'success'
            })
          } catch (exportError) {
            console.error('[account-info] GDPR export error:', exportError)
          }
        }, { signal })
      }

      if (btnClearMedia) {
        btnClearMedia.addEventListener('click', async () => {
          if ($storage && typeof $storage.clearLocalMediaCache === 'function') {
            await $storage.clearLocalMediaCache()
            await refreshStorageUsage()
            $bus.emit('ui:show_toast', {
              message: 'Local media cache cleared.',
              variant: 'success',
              type: 'success'
            })
          }
        }, { signal })
      }

      if (btnClearVoice) {
        btnClearVoice.addEventListener('click', async () => {
          if ($storage && typeof $storage.clearLocalVoiceCache === 'function') {
            await $storage.clearLocalVoiceCache()
            await refreshStorageUsage()
            $bus.emit('ui:show_toast', {
              message: 'Local voice notes cache cleared.',
              variant: 'success',
              type: 'success'
            })
          }
        }, { signal })
      }

      if (btnClearMessages) {
        btnClearMessages.addEventListener('click', async () => {
          if ($storage && typeof $storage.clearLocalMessagesCache === 'function') {
            await $storage.clearLocalMessagesCache()
            await refreshStorageUsage()
            $bus.emit('ui:show_toast', {
              message: 'Local messages cache cleared.',
              variant: 'success',
              type: 'success'
            })
          }
        }, { signal })
      }

      if (btnClearAllCache) {
        btnClearAllCache.addEventListener('click', async () => {
          if ($storage && typeof $storage.clearLocalHistory === 'function') {
            await $storage.clearLocalHistory()
            await refreshStorageUsage()
            $bus.emit('ui:show_toast', {
              message: 'All local cache cleared.',
              variant: 'success',
              type: 'success'
            })
          }
        }, { signal })
      }
    }
  })
</script>
