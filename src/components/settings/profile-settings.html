<template id="profile-settings">
  <section class="mb-5">
    <h6 class="text-uppercase text-muted fw-bold small mb-3">Profile</h6>
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center gap-4 mb-4">
          <div class="position-relative cursor-pointer flex-shrink-0" ref="avatarContainer" data-testid="avatarContainer">
            <atoll-profile ref="avatarProfile" size="2xl" icon-name="camera" alt="{{ displayName }}" user-id="{{ currentUserId }}"></atoll-profile>
            <input type="file" class="d-none" ref="avatarInput" accept="image/*">
          </div>
          <div class="flex-grow-1">
            <label class="form-label small text-muted text-uppercase fw-bold">Display Name</label>
            <input type="text" class="form-control" ref="nameInput" value="{{ displayName }}" placeholder="Enter your display name" data-testid="nameInput">
            <p class="text-muted small mb-0 mt-1">This name will be visible to your contacts.</p>
          </div>
        </div>
        <div class="d-flex justify-content-end">
          <button class="btn btn-primary" ref="btnSave" disabled="{{ saveBtnDisabled }}" data-testid="btnSave">
            {{ saveBtnText }}
          </button>
        </div>
      </div>
    </div>
  </section>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      displayName: '',
      currentUserId: '',
      userInitial: 'U',
      isSaving: false,
      hasChanges: false
    }),
    getters: {
      saveBtnDisabled: (state) => (!state.hasChanges || state.isSaving ? 'disabled' : ''),
      saveBtnText: (state) => (state.isSaving ? 'Saving...' : 'Save Changes')
    },
    client: async ({ refs, state, globalStore, pocketbase, eventBus, cryptoWorker }) => {
      const { $state } = globalStore
      const { records, files } = pocketbase
      const { $bus } = eventBus
      const { $worker } = cryptoWorker || {}

      const nameInput = refs('nameInput')
      const avatarInput = refs('avatarInput')
      const avatarContainer = refs('avatarContainer')
      const avatarProfile = refs('avatarProfile')
      const btnSave = refs('btnSave')

      let pendingAvatarBlob = null

      const loadUserData = () => {
        const user = $state.currentUser
        const name = user?.name || user?.username || ''
        state.displayName = name
        state.userInitial = name.charAt(0).toUpperCase()
        state.currentUserId = user?.id || ''

        nameInput.value = state.displayName

        if (user?.avatar && !pendingAvatarBlob) {
          const avatarUrl = files.getUrl(user, user.avatar, { thumb: '100x100' })
          avatarProfile.setAttribute('src', avatarUrl)
        } else if (pendingAvatarBlob) {
          const url = URL.createObjectURL(pendingAvatarBlob)
          avatarProfile.setAttribute('src', url)
        } else {
          avatarProfile.removeAttribute('src')
        }
      }

      loadUserData()

      const updateBtnState = () => {
        const currentName = nameInput.value.trim()
        const originalName = $state.currentUser?.name || $state.currentUser?.username || ''
        state.hasChanges = (currentName !== originalName) || !!pendingAvatarBlob
      }

      nameInput.addEventListener('input', updateBtnState)
      nameInput.addEventListener('change', updateBtnState)

      avatarContainer.onclick = () => avatarInput.click()

      avatarInput.onchange = (e) => {
        const file = e.target.files[0]
        if (file) {
          $bus.emit('ui:open_avatar_editor', file)
        }
        avatarInput.value = ''
      }

      $bus.on('ui:avatar_editor_applied', (blob) => {
        pendingAvatarBlob = blob
        const url = URL.createObjectURL(blob)
        avatarProfile.setAttribute('src', url)
        updateBtnState()
      })

      btnSave.onclick = async () => {
        if (state.isSaving || !state.hasChanges) {
          return
        }
  
        state.isSaving = true

        try {
          const formData = new FormData()
          formData.append('name', nameInput.value.trim())
          if (pendingAvatarBlob) {
            formData.append('avatar', pendingAvatarBlob, 'avatar.webp')
          }

          const updatedUser = await records.update('users', $state.currentUser.id, formData)
  
          // Update main thread globalStore users map
          $state.users = {
            ...$state.users,
            [updatedUser.id]: {
              ...($state.users?.[updatedUser.id] || {}),
              ...updatedUser
            }
          }

          $state.currentUser = {
            ...$state.currentUser,
            ...updatedUser
          }

          if ($worker) {
            $worker.execute('worker:update_user_data', updatedUser).catch(console.error)
          }

          pendingAvatarBlob = null
          state.isSaving = false
          loadUserData()
          updateBtnState()
  
          $bus.emit('ui:show_toast', {
            message: 'Profile updated successfully!',
            type: 'success'
          })
        } catch (err) {
          console.error('[profile-settings] Save failed:', err)
          $bus.emit('ui:show_toast', {
            message: 'Failed to save profile: ' + (err.message || 'Unknown error'),
            type: 'danger'
          })
          state.isSaving = false
          updateBtnState()
        }
      }

      $state.subscribe('currentUser', () => {
        if (!state.isSaving) {
          loadUserData()
        }
      })
    }
  })
</script>
