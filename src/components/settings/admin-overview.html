<template id="admin-overview">
  <div class="admin-overview">
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h5 class="fw-bold mb-4">Instance Governance & Settings</h5>

        <form ref="governanceForm">
          <div class="mb-3">
            <label class="form-label small fw-bold">Delegation Mode</label>
            <div class="d-flex flex-column gap-2 mt-1">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="invite_mode" id="modeDelegated" value="delegated" checked ref="modeDelegated" data-testid="modeDelegated">
                <label class="form-check-label" for="modeDelegated">
                  <strong>Delegated Trust (Default)</strong>
                  <div class="text-muted small">Standard users generate invitations with quota credit deductions. Owners can adjust quotas.</div>
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="invite_mode" id="modeStrict" value="strict" ref="modeStrict" data-testid="modeStrict">
                <label class="form-check-label" for="modeStrict">
                  <strong>Strict (Owner Only)</strong>
                  <div class="text-muted small">Only the instance owner can generate invitations. Standard users cannot invite anyone.</div>
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="invite_mode" id="modeOpen" value="open" ref="modeOpen" data-testid="modeOpen">
                <label class="form-check-label" for="modeOpen">
                  <strong>Open Enrollment</strong>
                  <div class="text-muted small">No invitation check applied. Anyone can register without codes (not fully recommended for zero-knowledge privacy hubs).</div>
                </label>
              </div>
            </div>
          </div>

          <div class="mb-3 mt-4">
            <label class="form-label small fw-bold" for="inputDefaultQuota">Default Trusted Quota</label>
            <atoll-input type="number" min="0" ref="inputDefaultQuota" data-testid="inputDefaultQuota" placeholder="5"></atoll-input>
            <span class="text-muted small">Starting quota given to trusted promoted members.</span>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold" for="inputMaxUses">Max Uses Per Invitation Link</label>
            <atoll-input type="number" min="1" ref="inputMaxUses" data-testid="inputMaxUses" placeholder="3"></atoll-input>
            <span class="text-muted small">The number of times a newly generated link can be used before expiring.</span>
          </div>

          <div class="mb-3 form-check form-switch mt-4">
            <input class="form-check-input" type="checkbox" id="switchAllowRequests" ref="switchAllowRequests" data-testid="switchAllowRequests">
            <label class="form-check-label fw-bold small" for="switchAllowRequests">Allow Quota Requests</label>
            <div class="text-muted small">Allow users with 0 quota to request more invite credits through secure encrypted notes.</div>
          </div>

          <div class="alert alert-success d-none mt-4" ref="saveSuccessAlert" data-testid="saveSuccessAlert">
            <atoll-icon name="check-circle" size="18" class="me-2"></atoll-icon>
            Governance settings saved successfully!
          </div>

          <div class="d-flex justify-content-end mt-4">
            <atoll-button variant="primary" type="submit" ref="btnSaveGovernance" data-testid="btnSaveGovernance">Save Changes</atoll-button>
          </div>
        </form>
      </div>
    </div>

    <!-- Active Statistics Dashboard Card -->
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <h5 class="fw-bold mb-4">Instance Statistics</h5>
        <div class="row g-3">
          <div class="col-6 col-md-3">
            <div class="p-3 border rounded text-center">
              <div class="text-muted small text-uppercase">Total Users</div>
              <h3 class="fw-bold mb-0 mt-1" ref="statTotalUsers" data-testid="statTotalUsers">--</h3>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="p-3 border rounded text-center">
              <div class="text-muted small text-uppercase">Active Rooms</div>
              <h3 class="fw-bold mb-0 mt-1" ref="statActiveRooms" data-testid="statActiveRooms">--</h3>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="p-3 border rounded text-center">
              <div class="text-muted small text-uppercase">Pending Requests</div>
              <h3 class="fw-bold mb-0 mt-1" ref="statPendingRequests" data-testid="statPendingRequests">--</h3>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="p-3 border rounded text-center">
              <div class="text-muted small text-uppercase">Unused Invites</div>
              <h3 class="fw-bold mb-0 mt-1" ref="statActiveInvitations" data-testid="statActiveInvitations">--</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: async ({ refs, pocketbase }) => {
      const pb = pocketbase

      const governanceForm = refs('governanceForm')
      const modeDelegated = refs('modeDelegated')
      const modeStrict = refs('modeStrict')
      const modeOpen = refs('modeOpen')
      const inputDefaultQuota = refs('inputDefaultQuota')
      const inputMaxUses = refs('inputMaxUses')
      const switchAllowRequests = refs('switchAllowRequests')
      const saveSuccessAlert = refs('saveSuccessAlert')
      const btnSaveGovernance = refs('btnSaveGovernance')

      const statTotalUsers = refs('statTotalUsers')
      const statActiveRooms = refs('statActiveRooms')
      const statPendingRequests = refs('statPendingRequests')
      const statActiveInvitations = refs('statActiveInvitations')

      const loadOverview = async () => {
        try {
          const res = await pb.send('/api/custom/admin/overview', { method: 'GET' })

          // Map stats
          statTotalUsers.textContent = res.stats.totalUsers
          statActiveRooms.textContent = res.stats.activeRooms
          statPendingRequests.textContent = res.stats.pendingInviteRequests
          statActiveInvitations.textContent = res.stats.activeInvitations

          // Map form fields
          const mode = res.metadata.invite_mode || 'delegated'
          if (mode === 'delegated') {
            modeDelegated.checked = true
          } else if (mode === 'strict') {
            modeStrict.checked = true
          } else if (mode === 'open') {
            modeOpen.checked = true
          }

          inputDefaultQuota.value = res.metadata.default_trusted_quota || 5
          inputMaxUses.value = res.metadata.max_uses_per_invite || 3
          switchAllowRequests.checked = res.metadata.allow_quota_requests !== false
        } catch (err) {
          console.error('[admin-overview] Failed to load statistics & metadata:', err)
        }
      }

      await loadOverview()

      governanceForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        saveSuccessAlert.classList.add('d-none')

        // Find active invite mode radio
        let mode = 'delegated'
        if (modeStrict.checked) {
          mode = 'strict'
        } else if (modeOpen.checked) {
          mode = 'open'
        }

        try {
          btnSaveGovernance.setAttribute('loading', 'true')
          await pb.send('/api/custom/admin/settings', {
            method: 'POST',
            body: {
              invite_mode: mode,
              default_trusted_quota: parseInt(inputDefaultQuota.value, 10),
              max_uses_per_invite: parseInt(inputMaxUses.value, 10),
              allow_quota_requests: switchAllowRequests.checked
            }
          })

          saveSuccessAlert.classList.remove('d-none')
          setTimeout(() => saveSuccessAlert.classList.add('d-none'), 3000)
  
          await loadOverview()
        } catch (err) {
          alert(err.message || 'Failed to update governance settings.')
        } finally {
          btnSaveGovernance.removeAttribute('loading')
        }
      })
    }
  })
</script>
