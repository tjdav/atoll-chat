<template id="totp-settings">
  <div class="d-flex align-items-center justify-content-between mt-4">
    <div>
      <h6 class="mb-0">Two-Step Authentication</h6>
      <p class="text-muted small mb-0">{{ totpStatus }}</p>
    </div>
    <button class="btn btn-outline-primary btn-sm" ref="btnManageTotp" data-testid="btnManageTotp">
      {{ totpActionLabel }}
    </button>
  </div>

  <!-- Enable TOTP Modal -->
  <atoll-popup
    ref="setupModal"
    title="Enable 2-Step Authentication"
  >
    <div class="text-center">
      <p class="small text-muted mb-4">Scan this QR code with your authenticator app (such as Google Authenticator, Authy, or 1Password) to enroll.</p>
      
      <div class="mb-3 d-flex justify-content-center">
        <img ref="qrImg" src="" alt="QR Code" class="img-fluid border p-2 bg-white" style="max-width: 200px; max-height: 200px;">
      </div>

      <div class="mb-4">
        <span class="text-muted small d-block">Secret Key:</span>
        <code class="fs-6 select-all" ref="secretText" data-testid="secretText"></code>
      </div>

      <form ref="verifyForm" class="text-start">
        <div class="mb-3">
          <label class="form-label small fw-bold">6-Digit Verification Code</label>
          <input type="text" class="form-control text-center fs-4 font-monospace" ref="otpInput" data-testid="otpInput" required placeholder="000000" maxlength="6" pattern="\d{6}">
        </div>
        <div ref="verifyError" class="alert alert-danger d-none small p-2 mb-0"></div>
      </form>
    </div>

    <div slot="actions" class="atoll-popup-actions atoll-popup-actions-horizontal d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-primary" ref="btnVerifyEnable" data-testid="btnVerifyEnable">Verify & Enable</button>
    </div>
  </atoll-popup>

  <!-- Disable TOTP Modal -->
  <atoll-popup
    ref="disableModal"
    title="Disable 2-Step Authentication"
    variant="danger"
  >
    <div class="text-start">
      <p class="small text-muted mb-4">To disable 2-step authentication, please enter the 6-digit verification code from your authenticator app.</p>
      
      <form ref="disableForm">
        <div class="mb-3">
          <label class="form-label small fw-bold">6-Digit Verification Code</label>
          <input type="text" class="form-control text-center fs-4 font-monospace" ref="disableOtpInput" data-testid="disableOtpInput" required placeholder="000000" maxlength="6" pattern="\d{6}">
        </div>
        <div ref="disableError" class="alert alert-danger d-none small p-2 mb-0"></div>
      </form>
    </div>

    <div slot="actions" class="atoll-popup-actions atoll-popup-actions-horizontal d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-danger" ref="btnVerifyDisable" data-testid="btnVerifyDisable">Verify & Disable</button>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      totpEnabled: false,
      totpActionLabel: 'Enable 2FA',
      totpStatus: 'Disabled'
    }),
    client: async ({ refs, state, globalStore, pocketbase, eventBus, totp, signal }) => {
      const { $state } = globalStore
      const { pb } = pocketbase
      const { $bus } = eventBus
      const { $totp } = await totp

      const updateTotpState = () => {
        state.totpEnabled = !!pb.authStore.model?.totp_enabled
        state.totpActionLabel = state.totpEnabled ? 'Disable 2FA' : 'Enable 2FA'
        state.totpStatus = state.totpEnabled ? 'Enabled' : 'Disabled'
      }

      updateTotpState()
      $state.subscribe('currentUser', updateTotpState)

      const btnManageTotp = refs('btnManageTotp')
  
      const setupModal = refs('setupModal')
      const qrImg = refs('qrImg')
      const secretText = refs('secretText')
      const verifyForm = refs('verifyForm')
      const otpInput = refs('otpInput')
      const verifyError = refs('verifyError')
      const btnVerifyEnable = refs('btnVerifyEnable')

      const disableModal = refs('disableModal')
      const disableForm = refs('disableForm')
      const disableOtpInput = refs('disableOtpInput')
      const disableError = refs('disableError')
      const btnVerifyDisable = refs('btnVerifyDisable')

      let currentSecret = ''

      btnManageTotp.addEventListener('click', async () => {
        if (!state.totpEnabled) {
          /* Setup / Enable Flow */
          currentSecret = $totp.generateSecret()
          secretText.textContent = currentSecret
          otpInput.value = ''
          verifyError.classList.add('d-none')

          const username = pb.authStore.model.username
          const otpauthUri = `otpauth://totp/Atoll%20Chat:${username}?secret=${currentSecret}&issuer=Atoll%20Chat`
  
          try {
            const { default: QRCode } = await import('qrcode')
            const qrDataUrl = await QRCode.toDataURL(otpauthUri)
            qrImg.src = qrDataUrl
            setupModal.show()
            setTimeout(() => otpInput.focus(), 100)
          } catch (err) {
            console.error('QR code generation failed:', err)
          }
        } else {
          /* Disable Flow */
          disableOtpInput.value = ''
          disableError.classList.add('d-none')
          disableModal.show()
          setTimeout(() => disableOtpInput.focus(), 100)
        }
      })

      const handleEnableSubmit = async () => {
        const code = otpInput.value.trim()

        verifyError.classList.add('d-none')

        try {
          const isValid = await $totp.verify(code, currentSecret)
          if (!isValid) {
            throw new Error('Invalid verification code. Please try again.')
          }

          /* Enable TOTP on server */
          await pb.collection('users').update(pb.authStore.model.id, {
            totp_secret: currentSecret,
            totp_enabled: true,
            trusted_device_hashes: []
          })

          await pb.collection('users').authRefresh()
          updateTotpState()
          setupModal.hide()

          $bus.emit('ui:show_toast', {
            message: 'Two-Step Authentication enabled successfully!',
            type: 'success'
          })
        } catch (err) {
          console.error('Enable TOTP error:', err)
          verifyError.textContent = err.message || 'Verification failed.'
          verifyError.classList.remove('d-none')
        }
      }

      const handleDisableSubmit = async () => {
        const code = disableOtpInput.value.trim()

        disableError.classList.add('d-none')

        try {
          const record = await pb.collection('users').getOne(pb.authStore.model.id)
          const isValid = await $totp.verify(code, record.totp_secret)
          if (!isValid) {
            throw new Error('Invalid verification code. Please try again.')
          }

          /* Disable TOTP on server */
          await pb.collection('users').update(record.id, {
            totp_secret: '',
            totp_enabled: false,
            trusted_device_hashes: []
          })

          await pb.collection('users').authRefresh()
          updateTotpState()
          disableModal.hide()

          $bus.emit('ui:show_toast', {
            message: 'Two-Step Authentication disabled successfully.',
            type: 'success'
          })
        } catch (err) {
          console.error('Disable TOTP error:', err)
          disableError.textContent = err.message || 'Verification failed.'
          disableError.classList.remove('d-none')
        }
      }

      btnVerifyEnable.onclick = handleEnableSubmit
      verifyForm.addEventListener('submit', (e) => {
        e.preventDefault()
        handleEnableSubmit()
      }, { signal })

      btnVerifyDisable.onclick = handleDisableSubmit
      disableForm.addEventListener('submit', (e) => {
        e.preventDefault()
        handleDisableSubmit()
      }, { signal })
    }
  })
</script>
