<template id="audio-player-view">
  <div class="audio-player-container d-flex flex-column h-100 bg-body-secondary position-relative">
    <viewer-header 
      title="Audio Details" 
      subtitle="{{ fileName }}" 
      icon="bi-music-note-beamed"
      theme="light">
    </viewer-header>

    <div ref="carousel" class="carousel slide flex-grow-1 overflow-hidden" data-bs-interval="false">
      <div class="carousel-inner h-100" ref="carouselInner">
        <!-- Carousel items will be rendered here -->
      </div>
      
      <button class="carousel-control-prev" type="button" ref="btnPrev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" ref="btnNext">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="alert alert-danger m-3 position-absolute top-0 start-0 end-0" hidden="{{ isErrorHidden }}" style="z-index: 1050;">
      {{ errorMessage }}
    </div>
    <div class="d-none">
      <audio ref="audioPlayer"></audio>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      fileName: 'Untitled Audio'
    }),
    client: async ({ state, signal, refs, pocketbase, localDb, globalStore, utils, eventBus, bootstrap }) => {
      const { $localDb } = localDb
      const { $state } = globalStore
      const { $utils } = utils
      const { $bus } = eventBus
      const { Carousel } = bootstrap
      const carouselEl = refs('carousel')
      const carouselInner = refs('carouselInner')
      const btnPrev = refs('btnPrev')
      const btnNext = refs('btnNext')
      const audio = refs('audioPlayer')

      let carouselInstance = null
      let loadedItems = []
      let hasMore = true
      let lastTimestamp = null
      const BATCH_SIZE = 24
      let isInternalChange = false

      // Local Playback State
      let playbackState = {
        currentId: null,
        status: 'idle',
        progress: 0,
        duration: 0,
        currentTime: 0
      }

      const cleanup = () => {
        if (carouselInstance) {
          carouselInstance.dispose()
          carouselInstance = null
        }
        stopLocalPlayback()
      }
      signal.addEventListener('abort', cleanup)

      const stopLocalPlayback = () => {
        if (audio) {
          audio.pause()
          audio.removeAttribute('src')
          audio.load()
        }
        playbackState = {
          currentId: null,
          status: 'idle',
          progress: 0,
          duration: 0,
          currentTime: 0
        }
        syncAll()
      }

      const updateItemUI = async (item, container) => {
        const room = await $localDb.local_rooms.get(item.room_id)
        const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
        const artistAlbum = item.artist ? `${item.artist}${item.album ? ' • ' + item.album : ''}` : ''

        container.querySelector('.audio-filename').textContent = item.filename || item.name || 'Audio File'
        container.querySelector('.audio-artist').textContent = artistAlbum
        container.querySelector('.audio-room').textContent = roomName
  
        syncPlaybackState(item.id, container)
      }

      const syncPlaybackState = (id, container) => {
        const isSelectedThis = playbackState.currentId === id
        const icon = container.querySelector('.btn-big-play i')
        const loadingSpinner = container.querySelector('.loading-spinner')
        const playIcon = container.querySelector('.play-icon')

        if (icon) {
          const isActuallyPlaying = isSelectedThis && playbackState.status === 'playing'
          icon.className = `bi ${isActuallyPlaying ? 'bi-pause-fill' : 'bi-play-fill'}`
        }

        if (loadingSpinner && playIcon) {
          if (isSelectedThis && playbackState.status === 'loading') {
            loadingSpinner.classList.remove('d-none')
            playIcon.classList.add('d-none')
          } else {
            loadingSpinner.classList.add('d-none')
            playIcon.classList.remove('d-none')
          }
        }

        const progressContainer = container.querySelector('.audio-progress-container')
        const progressBar = container.querySelector('.progress-bar')
        const currentTimeEl = container.querySelector('.current-time')
        const durationEl = container.querySelector('.duration')

        if (isSelectedThis && playbackState.status !== 'loading') {
          progressContainer.classList.remove('opacity-25')
          const progress = playbackState.progress || 0
          progressBar.style.width = `${progress}%`
  
          const cur = playbackState.currentTime || 0
          currentTimeEl.textContent = `${Math.floor(cur / 60)}:${Math.floor(cur % 60).toString().padStart(2, '0')}`
  
          const dur = playbackState.duration || 0
          durationEl.textContent = `${Math.floor(dur / 60)}:${Math.floor(dur % 60).toString().padStart(2, '0')}`
        } else {
          progressContainer.classList.add('opacity-25')
          progressBar.style.width = '0%'
          currentTimeEl.textContent = '0:00'
          durationEl.textContent = '0:00'
        }
      }

      const playLocalMedia = async (item) => {
        if (playbackState.currentId === item.id) {
          if (playbackState.status === 'playing') {
            audio.pause()
            playbackState.status = 'paused'
          } else {
            try {
              await audio.play()
              playbackState.status = 'playing'
            } catch (e) {
              console.warn('[audio-player-view] Play failed:', e)
            }
          }
          syncAll()
          return
        }

        stopLocalPlayback()
        playbackState.currentId = item.id
        playbackState.status = 'loading'
        syncAll()

        try {
          const objectUrl = await $utils.fetchAndDecrypt(item, signal)
          audio.src = objectUrl
          audio.volume = $state.mediaVolume
          await audio.play()
          playbackState.status = 'playing'
        } catch (err) {
          if (err.name === 'AbortError') {
            return
          }
          console.error('[audio-player-view] Playback error:', err)
          state.errorMessage = `Playback error: ${err.message}`
          state.isErrorHidden = false
          playbackState.status = 'idle'
        }
        syncAll()
      }

      const createCarouselItem = (item, isActive) => {
        const div = document.createElement('div')
        div.className = `carousel-item h-100 ${isActive ? 'active' : ''}`
        div.dataset.id = item.id
        div.innerHTML = `
          <div class="d-flex flex-column justify-content-center align-items-center p-4 h-100 overflow-hidden">
            <div class="text-center w-100" style="max-width: 500px;">
              <div class="mb-4">
                <i class="bi bi-music-note-beamed text-primary" style="font-size: 5rem;"></i>
              </div>
              <div class="mb-4">
                <h4 class="mb-1 text-truncate audio-filename">Loading...</h4>
                <div class="text-muted mb-1 audio-artist"></div>
                <div class="text-muted small">From: <span class="fw-bold audio-room"></span></div>
              </div>
              <div class="d-flex flex-column align-items-center gap-4 w-100">
                <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center btn-big-play" style="width: 120px; height: 120px;">
                  <div class="spinner-border text-light d-none loading-spinner" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <i class="bi bi-play-fill play-icon" style="font-size: 4rem;"></i>
                </button>
                <div class="w-100 mt-2 audio-progress-container opacity-25">
                   <div class="d-flex justify-content-between text-muted small mb-1">
                      <span class="current-time">0:00</span>
                      <span class="duration">0:00</span>
                   </div>
                   <div class="progress" style="height: 8px; cursor: pointer;">
                      <div class="progress-bar" role="progressbar" style="width: 0%;"></div>
                   </div>
                </div>
              </div>
            </div>
          </div>
        `
        const btnPlay = div.querySelector('.btn-big-play')
        btnPlay.onclick = () => playLocalMedia(item)

        const progress = div.querySelector('.progress')
        progress.onclick = (e) => {
          if (playbackState.currentId === item.id && audio.duration) {
            const rect = progress.getBoundingClientRect()
            const percent = (e.clientX - rect.left) / rect.width
            audio.currentTime = percent * audio.duration
          }
        }

        return div
      }

      const fetchNextBatch = async () => {
        if (!hasMore) {
          return []
        }
        let query = $localDb.local_assets.where('mime_type').startsWith('audio/').reverse()
        const allMatching = await query.toArray()
        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMatching.findIndex(a => a.created_at === lastTimestamp) + 1
        }
        const rawItems = allMatching.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }
        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          loadedItems = [...loadedItems, ...rawItems]
        }
        return rawItems
      }

      const renderBatch = (items, activeId) => {
        items.forEach(item => {
          const isActive = item.id === activeId
          const el = createCarouselItem(item, isActive)
          carouselInner.appendChild(el)
          if (isActive) {
            state.fileName = item.filename || item.name || 'Audio File'
            updateItemUI(item, el)
          }
        })
      }

      const initCarousel = async () => {
        cleanup()
        carouselInner.innerHTML = ''
        loadedItems = []
        lastTimestamp = null
        hasMore = true

        const activeId = $state.activeSelectionId
        while (!loadedItems.find(i => i.id === activeId) && hasMore) {
          await fetchNextBatch()
        }

        renderBatch(loadedItems, activeId)
  
        carouselInstance = new Carousel(carouselEl, {
          interval: false,
          touch: true,
          wrap: false
        })

        carouselEl.addEventListener('slid.bs.carousel', (e) => {
          const activeItem = e.relatedTarget
          const id = activeItem.dataset.id
          const item = loadedItems.find(i => i.id === id)
          if (item) {
            isInternalChange = true
            $state.activeSelectionId = id
            state.fileName = item.filename || item.name || 'Audio File'
            updateItemUI(item, activeItem)
            isInternalChange = false
          }
          const index = loadedItems.findIndex(i => i.id === id)
          if (index >= loadedItems.length - 3 && hasMore) {
            fetchNextBatch().then(batch => renderBatch(batch, null))
          }
        })
      }

      btnPrev.onclick = () => carouselInstance?.prev()
      btnNext.onclick = async () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (!activeItem) {
          return
        }
        const id = activeItem.dataset.id
        const index = loadedItems.findIndex(i => i.id === id)
  
        if (index === loadedItems.length - 1 && hasMore) {
          const nextBatch = await fetchNextBatch()
          if (nextBatch.length > 0) {
            renderBatch(nextBatch, null)
            setTimeout(() => carouselInstance?.next(), 0)
          }
        } else {
          carouselInstance?.next()
        }
      }

      $state.subscribe('activeSelectionId', (id) => {
        if (isInternalChange || $state.activeSelectionType !== 'music') {
          return
        }

        // Stop playback when switching items
        if (playbackState.currentId !== id) {
          stopLocalPlayback()
        }

        const index = loadedItems.findIndex(i => i.id === id)
        if (index !== -1) {
          carouselInstance?.to(index)
        } else {
          initCarousel()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type === 'music') {
          initCarousel()
        }
      })

      const syncAll = () => {
        const activeItem = carouselInner.querySelector('.carousel-item.active')
        if (activeItem) {
          syncPlaybackState(activeItem.dataset.id, activeItem)
        }
      }

      $state.subscribe('mediaVolume', (vol) => {
        if (audio) {
          audio.volume = vol
        }
      })

      audio.ontimeupdate = () => {
        if (audio.duration) {
          playbackState.currentTime = audio.currentTime
          playbackState.duration = audio.duration
          playbackState.progress = (audio.currentTime / audio.duration) * 100
          syncAll()
        }
      }

      audio.onended = () => {
        playbackState.status = 'idle'
        syncAll()
      }

      audio.onpause = () => {
        if (playbackState.status === 'playing') {
          playbackState.status = 'paused'
          syncAll()
        }
      }

      audio.onplay = () => {
        playbackState.status = 'playing'
        syncAll()
      }

      if ($state.activeSelectionType === 'music') {
        initCarousel()
      }
    }
  })
</script>
