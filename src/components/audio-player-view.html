<template id="audio-player-view">
  <div class="audio-player-container d-flex flex-column justify-content-center align-items-center h-100 bg-body-secondary p-4">
    <div class="spinner-border text-primary mb-3" ref="loader" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    
    <div class="alert alert-danger m-3" hidden="{{ isErrorHidden }}">
      {{ errorMessage }}
    </div>

    <div ref="playerContent" class="d-none text-center w-100" style="max-width: 500px;">
      <div class="mb-4">
        <i class="bi bi-music-note-beamed text-primary" style="font-size: 5rem;"></i>
      </div>
      
      <div class="mb-4">
        <h4 class="mb-1 text-truncate">{{ fileName }}</h4>
        <div class="text-muted mb-1">{{ artistAlbum }}</div>
        <div class="text-muted small">From: <span class="fw-bold">{{ roomName }}</span></div>
      </div>

      <div class="d-flex flex-column align-items-center gap-4 w-100">
        <div ref="playButtonContainer">
          <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" ref="btnBigPlay" style="width: 120px; height: 120px;">
            <i class="bi {{ bigPlayIcon }}" style="font-size: 4rem;"></i>
          </button>
        </div>

        <div class="w-100 mt-2">
           <div class="d-flex justify-content-between text-muted small mb-1">
              <span>{{ currentTimeFormatted }}</span>
              <span>{{ durationFormatted }}</span>
           </div>
           <div class="progress" style="height: 8px; cursor: pointer;" ref="progressContainer">
              <div class="progress-bar" role="progressbar" style="width: {{ mediaProgress }}%;"></div>
           </div>
        </div>

        <div class="text-muted small">
           Playing on Global Media Manager
        </div>
      </div>
    </div>
  </div>
</template>

<style>
  .audio-player-container {
    width: 100%;
    height: 100%;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: () => ({
      isErrorHidden: true,
      errorMessage: '',
      fileName: 'Untitled Audio',
      artistAlbum: '',
      roomName: 'Unknown Chat'
    }),
    getters: {
      bigPlayIcon: (state) => {
        if (state.isPlayingThis && state.playbackStatus === 'playing') {
          return 'bi-pause-fill'
        }
  
        return 'bi-play-fill'
      },
      currentTimeFormatted: (state) => {
        const seconds = state.mediaCurrentTime || 0
        const mins = Math.floor(seconds / 60)
        const secs = Math.floor(seconds % 60)
        return `${mins}:${secs.toString().padStart(2, '0')}`
      },
      durationFormatted: (state) => {
        const seconds = state.mediaDuration || 0
        const mins = Math.floor(seconds / 60)
        const secs = Math.floor(seconds % 60)
        return `${mins}:${secs.toString().padStart(2, '0')}`
      }
    },
    client: async ({ state, signal, refs, pocketbase, localDb, globalStore, utils, eventBus }) => {
      const { pb } = pocketbase
      const { $localDb } = localDb
      const { $state } = globalStore
      const { $utils } = utils
      const { $bus } = eventBus
      const loader = refs('loader')
      const playerContent = refs('playerContent')
      const btnBigPlay = refs('btnBigPlay')
      const progressContainer = refs('progressContainer')

      state.playbackStatus = $state.playbackStatus
      state.mediaProgress = $state.mediaProgress
      state.mediaCurrentTime = $state.mediaCurrentTime
      state.mediaDuration = $state.mediaDuration
      state.isPlayingThis = false

      const syncUI = async () => {
        const id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!id || type !== 'music') {
          return
        }

        // Reset UI
        state.isErrorHidden = true
        state.errorMessage = ''
        loader.classList.remove('d-none')
        playerContent.classList.add('d-none')

        try {
          const asset = await $localDb.local_assets.get(id)
          if (!asset) {
            throw new Error('Audio asset not found in local database')
          }

          const room = await $localDb.local_rooms.get(asset.room_id)
          state.roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
          state.fileName = asset.name || 'Audio File'
          state.artistAlbum = asset.artist ? `${asset.artist}${asset.album ? ' • ' + asset.album : ''}` : ''

          // If this is the current media, update big play icon
          state.isPlayingThis = ($state.currentMedia && $state.currentMedia.id === id)

          loader.classList.add('d-none')
          playerContent.classList.remove('d-none')

        } catch (err) {
          console.error('[audio-player-view] Error:', err)
          state.errorMessage = err.message || 'Error loading media'
          state.isErrorHidden = false
          loader.classList.add('d-none')
        }
      }

      btnBigPlay.addEventListener('click', () => {
        const id = $state.activeSelectionId
        if (!id) {
          return
        }

        if ($state.currentMedia && $state.currentMedia.id === id) {
          $bus.emit('MEDIA:TOGGLE')
        } else {
          $bus.emit('MEDIA:PLAY', {
            mediaId: id,
            type: 'music'
          })
        }
      })

      progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect()
        const percent = ((e.clientX - rect.left) / rect.width) * 100
        $bus.emit('MEDIA:SEEK', { percent })
      })

      const debouncedSync = $utils.debounce(syncUI, 50)
      debouncedSync()

      $state.subscribe('activeSelectionId', debouncedSync)
      $state.subscribe('activeSelectionType', debouncedSync)
      $state.subscribe('playbackStatus', (val) => {
        state.playbackStatus = val
        state.isPlayingThis = ($state.currentMedia && $state.currentMedia.id === $state.activeSelectionId)
      })
      $state.subscribe('mediaProgress', (val) => state.mediaProgress = val)
      $state.subscribe('mediaCurrentTime', (val) => state.mediaCurrentTime = val)
      $state.subscribe('mediaDuration', (val) => state.mediaDuration = val)
    }
  })
</script>
