<template id="link-list">
  <div class="link-list h-100 overflow-y-auto">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Links will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const listGroup = refs('listGroup')

      let currentRenderId = 0
      const render = async () => {
        if (!listGroup) {
          return
        }

        const renderId = ++currentRenderId
        try {
          // Fetch all messages of type 'link'
          const links = await $localDb.local_messages
            .where('type')
            .equals('link')
            .reverse()
            .sortBy('created_at')

          if (renderId !== currentRenderId) {
            return
          }

          if (links.length === 0) {
            listGroup.innerHTML = '<div class="p-4 text-center text-muted">No links found</div>'
            return
          }

          const fragment = document.createDocumentFragment()
          for (const link of links) {
            const room = await $localDb.local_rooms.get(link.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            const timestamp = new Date(link.created_at).toLocaleString()
            const isActive = link.local_uuid === $state.activeSelectionId && $state.activeSelectionType === 'links'

            // Extract sender name
            let senderName = 'Unknown'
            if (room && room.participants) {
              const sender = room.participants.find(p => p.id === link.sender_id)
              if (sender) {
                senderName = sender.name || sender.username || 'Unknown'
              }
            }

            const btn = document.createElement('button')
            btn.type = 'button'
            btn.className = `list-group-item list-group-item-action d-flex align-items-center border-0 py-3 ${isActive ? 'active' : ''}`
  
            const iconWrapper = document.createElement('div')
            iconWrapper.className = 'list-item-icon'
            const icon = document.createElement('i')
            icon.className = 'bi bi-link-45deg fs-5'
            iconWrapper.appendChild(icon)

            const contentWrapper = document.createElement('div')
            contentWrapper.className = 'text-truncate'

            const titleDiv = document.createElement('div')
            titleDiv.className = 'fw-bold text-truncate'
            titleDiv.textContent = link.link_title || link.content || 'Untitled Link'

            const subTextSmall = document.createElement('small')
            subTextSmall.className = 'opacity-75 d-block text-truncate'
            const domain = link.link_domain ? `${link.link_domain} • ` : ''
            subTextSmall.textContent = `${domain}${senderName} in ${roomName}`

            contentWrapper.appendChild(titleDiv)
            contentWrapper.appendChild(subTextSmall)

            btn.appendChild(iconWrapper)
            btn.appendChild(contentWrapper)

            const arrowIcon = document.createElement('i')
            arrowIcon.className = 'bi bi-chevron-right ms-auto opacity-50'
            btn.appendChild(arrowIcon)

            btn.addEventListener('click', () => {
              $state.activeSelectionType = 'links'
              $state.activeSelectionId = link.local_uuid
            })

            fragment.appendChild(btn)
          }

          if (renderId === currentRenderId) {
            listGroup.innerHTML = ''
            listGroup.appendChild(fragment)
          }
        } catch (error) {
          console.error('[link-list] Error fetching links:', error)
        }
      }

      // Initial render
      render()

      const debouncedRender = $utils.debounce(render, 10)

      // Handle selection change
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'links') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => {
        debouncedRender()
      })

      const handleNewData = () => {
        debouncedRender()
      }

      $bus.on('db:new_local_data', handleNewData)
    }
  })
</script>
