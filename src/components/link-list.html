<template id="link-list">
  <div class="link-list h-100 overflow-y-auto" ref="scrollRoot">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Links will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $list } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const scrollRoot = refs('scrollRoot')

      const BATCH_SIZE = 24

      const { manager, debouncedRender } = $list.createManager({
        listId: 'links',
        scrollRoot,
        state,
        utils,
        globalStore,
        bus: eventBus,
        Fuse: $Fuse,
        fetchNextBatch: async (lastItem) => {
          const allMessages = await $localDb.local_messages
            .where('type')
            .equals('link')
            .reverse()
            .sortBy('created_at')

          let startIndex = 0
          if (lastItem) {
            startIndex = allMessages.findIndex(m => m.created_at === lastItem.message.created_at) + 1
          }

          const rawItems = allMessages.slice(startIndex, startIndex + BATCH_SIZE)
          const items = []
          for (const message of rawItems) {
            const room = await $localDb.local_rooms.get(message.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
            let senderName = 'Unknown'
            if (room && room.participants) {
              const sender = room.participants.find(p => p.id === message.sender_id)
              if (sender) {
                senderName = sender.name || sender.username || 'Unknown'
              }
            }

            const messageLinks = message.links || [{
              title: message.link_title,
              domain: message.link_domain,
              url: message.content
            }]

            messageLinks.forEach((link, idx) => {
              const selectionId = messageLinks.length > 1 ? `${message.local_uuid}:${idx}` : message.local_uuid
              const searchContent = `${link.title || ''} ${link.domain || ''} ${link.url || ''} ${senderName} ${roomName}`.toLowerCase()
              items.push({
                message,
                link,
                selectionId,
                roomName,
                senderName,
                searchContent,
                timestamp: new Date(message.created_at).toLocaleString()
              })
            })
          }
          return { items }
        },
        render: async (itemsToDisplay, query) => {
          if (itemsToDisplay.length === 0) {
            listGroup.innerHTML = `<div class="p-4 text-center text-body-secondary">${query ? 'No matches found' : 'No links found'}</div>`
            return
          }
          const fragment = document.createDocumentFragment()
          itemsToDisplay.forEach(({ link, selectionId, roomName, senderName }) => {
            const btn = document.createElement('button')
            btn.type = 'button'
            const isActive = selectionId === $state.activeSelectionId && $state.activeSelectionType === 'links'
            btn.className = `app-list-item border-0 w-100 text-start bg-transparent ${isActive ? 'active' : ''}`
            const domainStr = link.domain ? `${link.domain} • ` : ''
            btn.innerHTML = `<div class="list-item-icon d-flex align-items-center justify-content-center"><i class="bi bi-link-45deg fs-5"></i></div><div class="text-truncate flex-grow-1"><div class="fw-bold text-truncate"></div><small class="text-body-secondary d-block text-truncate"></small></div><i class="bi bi-chevron-right ms-auto text-body-secondary opacity-50"></i>`
            btn.querySelector('.fw-bold').textContent = link.title || link.url || 'Untitled Link'
            btn.querySelector('small').textContent = `${domainStr}${senderName} in ${roomName}`
            btn.onclick = () => {
              $state.activeSelectionType = 'links'
              $state.activeSelectionId = selectionId
              $bus.emit('ui:selection_made')
              debouncedRender()
            }
            fragment.appendChild(btn)
          })
          listGroup.innerHTML = ''; listGroup.appendChild(fragment)
        }
      })

      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'links') {
          debouncedRender()
        }
      })
      $state.subscribe('activeSelectionType', () => debouncedRender())
      $state.subscribe('listSearchQuery', () => debouncedRender())
      $bus.on('db:new_local_data', () => {
        manager.reset(); debouncedRender()
      })

      debouncedRender()
    }
  })
</script>
