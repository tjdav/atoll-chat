<template id="link-list">
  <div class="link-list h-100 overflow-y-auto" ref="scrollRoot">
    <div class="list-group list-group-flush" ref="listGroup">
      <!-- Links will be rendered here -->
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ state, signal, localDb, eventBus, globalStore, refs, utils, fuse }) => {
      const { $localDb } = localDb
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $utils } = utils
      const { $Fuse } = fuse
      const listGroup = refs('listGroup')
      const scrollRoot = refs('scrollRoot')

      let loadedEnrichedItems = []
      let lastTimestamp = null
      let hasMore = true
      let isLoading = false
      let fuseInstance = null
      let lastIndexedCount = 0
      const BATCH_SIZE = 24
      let currentRenderId = 0

      const fetchNextBatch = async () => {
        if (!hasMore || isLoading) {
          return
        }

        isLoading = true
        // Fetch messages of type 'link'
        const allMessages = await $localDb.local_messages
          .where('type')
          .equals('link')
          .reverse()
          .sortBy('created_at')

        let startIndex = 0
        if (lastTimestamp) {
          startIndex = allMessages.findIndex(m => m.created_at === lastTimestamp) + 1
        }

        const rawItems = allMessages.slice(startIndex, startIndex + BATCH_SIZE)
        if (rawItems.length < BATCH_SIZE) {
          hasMore = false
        }

        if (rawItems.length > 0) {
          lastTimestamp = rawItems[rawItems.length - 1].created_at
          
          const enriched = []
          for (const message of rawItems) {
            const room = await $localDb.local_rooms.get(message.room_id)
            const roomName = room ? (room.name || (room.is_group ? 'Unnamed Group' : 'Direct Message')) : 'Unknown Chat'
  
            // Extract sender name
            let senderName = 'Unknown'
            if (room && room.participants) {
              const sender = room.participants.find(p => p.id === message.sender_id)
              if (sender) {
                senderName = sender.name || sender.username || 'Unknown'
              }
            }

            const messageLinks = message.links || [{
              title: message.link_title,
              domain: message.link_domain,
              url: message.content
            }]

            messageLinks.forEach((link, idx) => {
              const selectionId = messageLinks.length > 1 ? `${message.local_uuid}:${idx}` : message.local_uuid
              const searchContent = `${link.title || ''} ${link.domain || ''} ${link.url || ''} ${senderName} ${roomName}`.toLowerCase()
              
              enriched.push({
                message,
                link,
                selectionId,
                roomName,
                senderName,
                searchContent,
                timestamp: new Date(message.created_at).toLocaleString()
              })
            })
          }
          loadedEnrichedItems = [...loadedEnrichedItems, ...enriched]
        }
        isLoading = false
      }

      const render = async () => {
        if (!listGroup) {
          return
        }

        const renderId = ++currentRenderId
        if (loadedEnrichedItems.length === 0) {
          await fetchNextBatch()
        }

        if (renderId !== currentRenderId) {
          return
        }

        let itemsToDisplay = loadedEnrichedItems
        const query = ($state.listSearchQuery || '').trim().toLowerCase()

        if (query && $Fuse) {
          if (!fuseInstance || lastIndexedCount !== loadedEnrichedItems.length) {
            fuseInstance = new $Fuse(loadedEnrichedItems, {
              keys: ['searchContent'],
              threshold: 0.4
            })
            lastIndexedCount = loadedEnrichedItems.length
          }
          itemsToDisplay = fuseInstance.search(query).map(r => r.item)
        }

        if (itemsToDisplay.length === 0) {
          listGroup.innerHTML = `<div class="p-4 text-center text-muted">${query ? 'No matches found in loaded links' : 'No links found'}</div>`
          return
        }

        const fragment = document.createDocumentFragment()
        itemsToDisplay.forEach(({ link, selectionId, roomName, senderName }) => {
          const btn = document.createElement('button')
          btn.type = 'button'
          const isActive = selectionId === $state.activeSelectionId && $state.activeSelectionType === 'links'
          btn.className = `app-list-item ${isActive ? 'active' : ''}`
          
          const domainStr = link.domain ? `${link.domain} • ` : ''
          
          const iconWrapper = document.createElement('div')
          iconWrapper.className = 'list-item-icon'
          const icon = document.createElement('i')
          icon.className = 'bi bi-link-45deg fs-5'
          iconWrapper.appendChild(icon)

          const contentWrapper = document.createElement('div')
          contentWrapper.className = 'text-truncate'

          const titleDiv = document.createElement('div')
          titleDiv.className = 'fw-bold text-truncate'
          titleDiv.textContent = link.title || link.url || 'Untitled Link'

          const subTextSmall = document.createElement('small')
          subTextSmall.className = 'opacity-75 d-block text-truncate'
          subTextSmall.textContent = `${domainStr}${senderName} in ${roomName}`

          contentWrapper.appendChild(titleDiv)
          contentWrapper.appendChild(subTextSmall)

          const arrowIcon = document.createElement('i')
          arrowIcon.className = 'bi bi-chevron-right ms-auto opacity-50'

          btn.appendChild(iconWrapper)
          btn.appendChild(contentWrapper)
          btn.appendChild(arrowIcon)

          btn.onclick = () => {
            $state.activeSelectionType = 'links'
            $state.activeSelectionId = selectionId
          }

          fragment.appendChild(btn)
        })

        if (renderId === currentRenderId) {
          listGroup.innerHTML = ''
          listGroup.appendChild(fragment)

          // Restore scroll position after first render
          if (!state.__scrollRestored && $state.listScrollPositions?.links !== undefined) {
            setTimeout(() => {
              if (scrollRoot) {
                scrollRoot.scrollTop = $state.listScrollPositions.links
              }
            }, 50)
            state.__scrollRestored = true
          }
        }
      }

      const saveListScroll = () => {
        if (!scrollRoot || (scrollRoot.offsetWidth === 0 && scrollRoot.offsetHeight === 0)) {
          return
        }
        if (!$state.listScrollPositions) {
          $state.listScrollPositions = {}
        }
        $state.listScrollPositions.links = scrollRoot.scrollTop
      }

      const debouncedSave = $utils.debounce(saveListScroll, 100)

      if (signal) {
        signal.addEventListener('abort', saveListScroll)
      }

      const resetAndRender = async () => {
        loadedEnrichedItems = []
        lastTimestamp = null
        hasMore = true
        fuseInstance = null
        lastIndexedCount = 0
        await render()
      }

      if (scrollRoot) {
        scrollRoot.onscroll = async () => {
          if (scrollRoot.scrollTop + scrollRoot.clientHeight >= scrollRoot.scrollHeight - 50 && hasMore) {
            await fetchNextBatch()
            render()
          }
          debouncedSave()
        }
      }

      // Initial render
      render()

      const debouncedRender = $utils.debounce(render, 50)
      const debouncedFullRender = $utils.debounce(resetAndRender, 50)

      // Handle selection change
      $state.subscribe('activeSelectionId', () => {
        if ($state.activeSelectionType === 'links') {
          render()
        }
      })
      $state.subscribe('activeSelectionType', () => {
        render()
      })

      $state.subscribe('listSearchQuery', () => {
        debouncedRender()
      })

      const handleNewData = () => {
        debouncedFullRender()
      }

      $bus.on('db:new_local_data', handleNewData)
    }
  })
</script>
