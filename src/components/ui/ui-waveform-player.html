<template id="ui-waveform-player">
  <div class="w-100 position-relative">
    <!-- Waveform layout Slot -->
    <slot name="waveform"></slot>

    <!-- Fallback native audio controls layout -->
    <div class="w-100" hidden="{{ hasWaveform }}">
      <audio ref="fallbackAudio" class="w-100" controls></audio>
    </div>

    <!-- Hidden audio element for the waveform player -->
    <audio ref="internalAudio" hidden></audio>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      audioId: String,
      src: String,
      waveformSrc: String,
      duration: {
        type: Number,
        default: 0
      }
    },
    server: () => ({
      hasWaveform: false,
      playbackStatus: 'idle'
    }),
    slots: {
      waveform (nodes, { state }) {
        if (nodes && nodes.length > 0) {
          return nodes
        }

        if (state.hasWaveform) {
          const container = document.createElement('div')
          container.className = 'atoll-chat-waveform-player w-100'

          const playBtn = document.createElement('atoll-button')
          playBtn.setAttribute('variant', 'primary')
          playBtn.setAttribute('icon-only', 'true')
          playBtn.setAttribute('pill', 'true')
          playBtn.className = 'play-pause-btn'
          playBtn.style.zIndex = '2'

          const spinner = document.createElement('div')
          spinner.className = 'spinner-border spinner-border-sm text-light'
          spinner.hidden = true
          spinner.setAttribute('role', 'status')
          spinner.style.width = '1rem'
          spinner.style.height = '1rem'

          const spinnerSpan = document.createElement('span')
          spinnerSpan.className = 'visually-hidden'
          spinnerSpan.textContent = 'Loading...'
          spinner.appendChild(spinnerSpan)

          const playIcon = document.createElement('atoll-icon')
          playIcon.setAttribute('name', 'play')
          playIcon.setAttribute('size', '18')
          playIcon.setAttribute('color', 'var(--atoll-chat-btn-send-color, #ffffff)')

          playBtn.appendChild(spinner)
          playBtn.appendChild(playIcon)

          const waveContainer = document.createElement('div')
          waveContainer.className = 'waveform-container'

          const waveBg = document.createElement('div')
          waveBg.className = 'position-relative w-100 h-100 wave-bg'

          const waveProgress = document.createElement('div')
          waveProgress.className = 'waveform-progress'

          const seeker = document.createElement('div')
          seeker.className = 'waveform-seeker'

          waveContainer.appendChild(waveBg)
          waveContainer.appendChild(waveProgress)
          waveContainer.appendChild(seeker)

          const formatTime = (seconds) => {
            if (!seconds || isNaN(seconds)) {
              return '0:00'
            }
            const mins = Math.floor(seconds / 60)
            const secs = Math.floor(seconds % 60)
            return `${mins}:${secs.toString().padStart(2, '0')}`
          }

          const timeDisplay = document.createElement('div')
          timeDisplay.className = 'x-small text-muted font-monospace time-display'
          timeDisplay.textContent = formatTime(state.duration)

          container.appendChild(playBtn)
          container.appendChild(waveContainer)
          container.appendChild(timeDisplay)

          return [container]
        }
        return null
      }
    },
    client: async ({ root, state, refs, utils, signal, storage, globalStore, eventBus, observe }) => {
      const { $storage } = storage
      const { $state } = globalStore
      const { $media } = utils
      const { $bus } = eventBus

      const internalAudio = refs('internalAudio')
      const fallbackAudio = refs('fallbackAudio')

      let audio = internalAudio
      let isLoaded = false
      let waveEl = null
      let progressEl = null
      let resizeObserver = null

      let updateFrameId = null

      const stopUpdateLoop = () => {
        if (updateFrameId) {
          cancelAnimationFrame(updateFrameId)
          updateFrameId = null
        }
      }

      const cleanup = () => {
        stopUpdateLoop()
        if (audio) {
          audio.pause()
          audio.removeAttribute('src')
          audio.load()
        }
        fallbackAudio.pause()
        fallbackAudio.removeAttribute('src')
        fallbackAudio.load()
        if (resizeObserver) {
          resizeObserver.disconnect()
        }
      }
      signal.addEventListener('abort', cleanup)

      const formatTime = (seconds) => {
        if (!seconds || isNaN(seconds)) {
          return '0:00'
        }
        const mins = Math.floor(seconds / 60)
        const secs = Math.floor(seconds % 60)
        return `${mins}:${secs.toString().padStart(2, '0')}`
      }

      if (state.duration) {
        const timeDisplay = root.querySelector('.time-display')
        if (timeDisplay) {
          timeDisplay.textContent = formatTime(state.duration)
        }
      }

      const updateProgress = () => {
        if (!audio) {
          return
        }
        let dur = audio.duration
        if (!dur || isNaN(dur) || dur === Infinity || dur <= 0) {
          dur = state.duration
        }
        const current = audio.currentTime || 0
        const percent = (dur && dur > 0) ? Math.min(100, Math.max(0, (current / dur) * 100)) : 0
        const waveProgress = root.querySelector('.waveform-progress')
        const seeker = root.querySelector('.waveform-seeker')
        const timeDisplay = root.querySelector('.time-display')

        if (waveProgress) {
          waveProgress.style.width = `${percent}%`
        }
        if (seeker) {
          seeker.style.left = `${percent}%`
        }
        if (timeDisplay) {
          timeDisplay.textContent = formatTime(current)
        }
      }

      const tick = () => {
        updateProgress()
        if (audio && !audio.paused && !audio.ended) {
          updateFrameId = requestAnimationFrame(tick)
        } else {
          updateFrameId = null
        }
      }

      const startUpdateLoop = () => {
        if (!updateFrameId && audio && !audio.paused && !audio.ended) {
          updateFrameId = requestAnimationFrame(tick)
        }
      }

      audio.onplay = () => {
        state.playbackStatus = 'playing'
        updatePlaybackUI()
        startUpdateLoop()
      }

      audio.onplaying = () => {
        state.playbackStatus = 'playing'
        updatePlaybackUI()
        startUpdateLoop()
      }

      audio.ontimeupdate = () => {
        updateProgress()
        startUpdateLoop()
      }

      audio.onpause = () => {
        state.playbackStatus = 'paused'
        updatePlaybackUI()
        stopUpdateLoop()
      }

      audio.onended = () => {
        audio.currentTime = 0
        if (audio.currentTime !== 0) {
          audio.load()
        }
        updateProgress()
        state.playbackStatus = 'paused'
        updatePlaybackUI()
        stopUpdateLoop()
      }

      audio.oncanplaythrough = () => {
        if (state.playbackStatus === 'loading') {
          state.playbackStatus = 'playing'
          startUpdateLoop()
        }
        updatePlaybackUI()
      }

      const updatePlaybackUI = () => {
        const playBtn = root.querySelector('.play-pause-btn')
        if (!playBtn) {
          return
        }
        const spinner = playBtn.querySelector('.spinner-border')
        const playIcon = playBtn.querySelector('atoll-icon')

        if (state.playbackStatus === 'loading') {
          if (spinner) {
            spinner.hidden = false
          }
          if (playIcon) {
            playIcon.hidden = true
          }
        } else if (state.playbackStatus === 'playing') {
          if (spinner) {
            spinner.hidden = true
          }
          if (playIcon) {
            playIcon.hidden = false
            playIcon.setAttribute('name', 'pause')
          }
        } else {
          if (spinner) {
            spinner.hidden = true
          }
          if (playIcon) {
            playIcon.hidden = false
            playIcon.setAttribute('name', 'play')
          }
        }
      }

      const renderWaveform = (waveformData) => {
        const waveContainer = root.querySelector('.waveform-container')
        const waveBg = root.querySelector('.wave-bg')
        const waveProgress = root.querySelector('.waveform-progress')
        if (!waveContainer || !waveBg || !waveProgress) {
          return
        }

        waveBg.innerHTML = ''
        waveProgress.innerHTML = ''

        const isSvg = waveformData && (waveformData.startsWith('<svg') || waveformData.startsWith('data:image/svg+xml'))

        if (isSvg) {
          try {
            let svgString = waveformData
            if (waveformData.startsWith('data:image/svg+xml')) {
              const headerIndex = waveformData.indexOf(',')
              if (headerIndex !== -1) {
                const rawContent = waveformData.slice(headerIndex + 1)
                if (waveformData.includes('base64')) {
                  svgString = atob(rawContent)
                } else {
                  svgString = decodeURIComponent(rawContent)
                }
              }
            }

            const parser = new DOMParser()
            const doc = parser.parseFromString(svgString, 'image/svg+xml')
            const parsedSvg = doc.querySelector('svg')
            if (parsedSvg) {
              parsedSvg.setAttribute('preserveAspectRatio', 'none')
              parsedSvg.setAttribute('class', 'waveform-image text-primary')
              parsedSvg.setAttribute('style', 'width: 100%; height: 100%; object-fit: fill;')
              waveEl = parsedSvg.cloneNode(true)

              progressEl = parsedSvg.cloneNode(true)
              progressEl.setAttribute('preserveAspectRatio', 'none')
              progressEl.setAttribute('class', 'waveform-image text-primary')
              progressEl.setAttribute('style', 'height: 100%; object-fit: fill; max-width: none;')
            }
          } catch (err) {
            console.warn('[waveform-player] Failed to parse inline SVG waveform, falling back to img:', err)
          }
        }

        if (!waveEl) {
          waveEl = document.createElement('img')
          waveEl.src = waveformData
          waveEl.className = 'waveform-image'
        }
        if (!progressEl) {
          progressEl = document.createElement('img')
          progressEl.src = waveformData
          progressEl.className = 'waveform-image'
        }

        waveBg.appendChild(waveEl)
        waveProgress.appendChild(progressEl)

        if (resizeObserver) {
          resizeObserver.disconnect()
        }
        resizeObserver = new ResizeObserver(entries => {
          for (const entry of entries) {
            if (progressEl) {
              progressEl.style.width = `${entry.contentRect.width}px`
            }
          }
        })
        resizeObserver.observe(waveContainer)
      }

      const setupFallbackAudio = async () => {
        try {
          let objectUrl = state.src
          if (!objectUrl && state.audioId) {
            const mediaKey = `media:${state.audioId}`
            const cached = $state.decryptionCache.get(mediaKey)
            if (cached) {
              objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            } else {
              const asset = await $storage.getAsset(state.audioId)
  
              if (asset) {
                objectUrl = await $media.decrypt(asset, { signal })
              }
            }
          }
          if (signal.aborted) {
            return
          }
          if (objectUrl) {
            fallbackAudio.src = objectUrl
            fallbackAudio.volume = $state.mediaVolume
          }
        } catch (err) {
          console.error('[waveform-player] Fallback setup error:', err)
        }
      }

      const loadWaveform = async () => {
        let waveformData = state.waveformSrc

        if (!waveformData && state.audioId) {
          try {
            const asset = await $storage.getAsset(state.audioId)

            if (asset && asset.message_id) {
              const msg = await $storage.getMessage(asset.message_id)
              if (msg && msg.waveform_data) {
                waveformData = msg.waveform_data
              }
            }
          } catch (err) {
            console.warn('[waveform-player] Failed to load asset or message:', err)
          }
        }

        if (waveformData) {
          state.hasWaveform = true
          renderWaveform(waveformData)
          if (state.duration) {
            const timeDisplay = root.querySelector('.time-display')
            if (timeDisplay) {
              timeDisplay.textContent = formatTime(state.duration)
            }
          }
        } else {
          state.hasWaveform = false
          setupFallbackAudio()
        }
      }

      const playAudio = async () => {
        if (state.playbackStatus === 'loading') {
          return
        }

        if (isLoaded) {
          if (audio.ended) {
            audio.currentTime = 0
            if (audio.currentTime !== 0) {
              audio.load()
            }
          }
          if (audio.paused) {
            triggerPlay()
          } else {
            audio.pause()
          }
          return
        }

        state.playbackStatus = 'loading'
        updatePlaybackUI()

        try {
          let objectUrl = state.src

          if (!objectUrl && state.audioId) {
            const mediaKey = `media:${state.audioId}`
            const cached = $state.decryptionCache.get(mediaKey)
            if (cached) {
              objectUrl = typeof cached === 'string' ? cached : cached.blobUrl
            } else {
              const asset = await $storage.getAsset(state.audioId)

              if (!asset) {
                throw new Error('Asset not found in local database')
              }
  
              objectUrl = await $media.decrypt(asset, { signal })
            }
          }

          if (signal.aborted) {
            return
          }

          if (!objectUrl) {
            throw new Error('No audio source URL available')
          }

          audio.src = objectUrl
          audio.volume = $state.mediaVolume
          isLoaded = true

          triggerPlay()
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('[waveform-player] Playback error:', err)
            state.playbackStatus = 'error'
            updatePlaybackUI()
          }
        }
      }

      const triggerPlay = () => {
        $bus.emit('waveform_player:play', { audioId: state.audioId })

        audio.play().catch(err => {
          if (err.name !== 'AbortError') {
            console.warn('[waveform-player] Play failed:', err)
            state.playbackStatus = 'paused'
            updatePlaybackUI()
          }
        })
      }

      root.addEventListener('click', (e) => {
        const playBtn = e.target.closest('.play-pause-btn')
        if (playBtn && root.contains(playBtn)) {
          e.stopPropagation()
          playAudio()
          return
        }

        const waveContainer = e.target.closest('.waveform-container')
        if (waveContainer && root.contains(waveContainer)) {
          e.stopPropagation()
          if (!audio || !isLoaded || isNaN(audio.duration)) {
            return
          }
          const rect = waveContainer.getBoundingClientRect()
          const percent = (e.clientX - rect.left) / rect.width
          audio.currentTime = percent * audio.duration
          updateProgress()
        }
      }, { signal })

      // Sync settings volume
      $state.subscribe('mediaVolume', (vol) => {
        if (audio) {
          audio.volume = vol
        }
        fallbackAudio.volume = vol
      })

      // Exclusive playback coordinator
      const unsubscribePlay = $bus.on('waveform_player:play', ({ audioId }) => {
        if (audioId !== state.audioId && audio && !audio.paused) {
          audio.pause()
        }
      })
      signal.addEventListener('abort', unsubscribePlay)

      // Automatic pausing when context changes
      $state.subscribe('activeSelectionId', (id) => {
        if (id !== state.audioId && audio && !audio.paused) {
          audio.pause()
        }
      })

      $state.subscribe('activeSelectionType', (type) => {
        if (type !== 'music' && audio && !audio.paused) {
          audio.pause()
        }
      })

      $state.subscribe('currentAppView', (view) => {
        if (view !== 'music' && audio && !audio.paused) {
          audio.pause()
        }
      })

      loadWaveform()

      const handleSourceChange = () => {
        isLoaded = false
        cleanup()
        loadWaveform()
      }

      observe('duration', (dur) => {
        const timeDisplay = root.querySelector('.time-display')
        if (timeDisplay) {
          timeDisplay.textContent = formatTime(dur)
        }
      })

      observe('audioId', handleSourceChange)
      observe('src', handleSourceChange)
      observe('waveformSrc', handleSourceChange)
    }
  })
</script>
