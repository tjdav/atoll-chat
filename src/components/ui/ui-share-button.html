<template id="ui-share-button">
  <button ref="btnOpenShare" class="btn btn-primary btn-sm rounded-pill px-3 ms-2">
    <i class="bi bi-share me-1"></i> Share
  </button>

  <atoll-popup
    ref="shareModal"
    title="Share to..."
  >
    <div class="list-group list-group-flush overflow-y-auto text-start" style="max-height: 400px;" ref="roomList">
      <!-- Rooms will be rendered here -->
    </div>

    <div slot="actions" class="atoll-popup-actions atoll-popup-actions-horizontal d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-primary" ref="btnSend" disabled>Send</button>
    </div>
  </atoll-popup>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client: ({ refs, root, storage, globalStore, eventBus, pocketbase, cryptoWorker, signal }) => {
      const { $storage } = storage
      const { $bus } = eventBus
      const { $state } = globalStore
      const { $worker } = cryptoWorker
      const { pb } = pocketbase

      const modal = refs('shareModal')
      const roomList = refs('roomList')
      const getBtnSend = () => refs('btnSend') || root.querySelector('[ref="btnSend"]') || root.querySelector('[ref$="btnSend"]')

      let selectedRoomIds = new Set()
      let loadedRooms = []

      const updateSendButton = () => {
        const btn = getBtnSend()
        if (btn) {
          btn.disabled = selectedRoomIds.size === 0
        }
      }

      const getCurrentUserId = () => $state.currentUser?.id || pb?.authStore?.model?.id

      const createAvatarEl = (room) => {
        const profile = document.createElement('atoll-profile')
        profile.setAttribute('size', 'sm')

        let roomName = room.name
        if (!room.is_group) {
          const currentUserId = getCurrentUserId()
          const otherUser = (room.participants || []).find(p => p && (p.id || p.user_id) !== currentUserId)
          roomName = otherUser ? (otherUser.name || otherUser.username) : 'Direct Message'
          if (otherUser) {
            profile.setAttribute('name', roomName)
            profile.setAttribute('alt', roomName)
            if (otherUser.id || otherUser.user_id) {
              profile.setAttribute('user-id', otherUser.id || otherUser.user_id)
            }
            if (otherUser.avatar) {
              profile.setAttribute('src', pb.files.getURL(otherUser, otherUser.avatar, { thumb: '42x42' }))
            }
          }
        } else {
          profile.setAttribute('name', roomName || 'Unnamed Room')
          profile.setAttribute('alt', roomName || 'Unnamed Room')
        }

        return profile
      }

      const renderRooms = () => {
        roomList.innerHTML = ''
        if (loadedRooms.length === 0) {
          roomList.innerHTML = '<div class="p-4 text-center text-muted">No rooms found</div>'
          return
        }

        const currentUserId = getCurrentUserId()

        loadedRooms.forEach(room => {
          const label = document.createElement('label')
          label.className = 'list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 cursor-pointer'
  
          const checkbox = document.createElement('input')
          checkbox.type = 'checkbox'
          checkbox.className = 'form-check-input flex-shrink-0'
          checkbox.checked = selectedRoomIds.has(room.id)
          const handleCheckChange = () => {
            if (checkbox.checked) {
              selectedRoomIds.add(room.id)
            } else {
              selectedRoomIds.delete(room.id)
            }
            updateSendButton()
          }
          checkbox.onchange = handleCheckChange
          checkbox.onclick = handleCheckChange

          const avatar = createAvatarEl(room)
  
          let roomName = ''
          const participants = room.participants || []
          if (!room.is_group) {
            const otherParticipants = participants.filter(p => p && (p.id || p.user_id) !== currentUserId)
            roomName = otherParticipants.length > 0 ? (otherParticipants[0].name || otherParticipants[0].username) : (room.name || 'Direct Message')
          } else {
            roomName = room.name || 'Unnamed Group'
          }

          const nameSpan = document.createElement('span')
          nameSpan.className = 'text-truncate fw-medium'
          nameSpan.textContent = roomName || 'Unnamed Room'

          label.appendChild(checkbox)
          label.appendChild(avatar)
          label.appendChild(nameSpan)
          roomList.appendChild(label)
        })
      }

      const sendShare = async () => {
        const id = $state.activeSelectionId
        const type = $state.activeSelectionType

        if (!id || !type || selectedRoomIds.size === 0) {
          return
        }

        const btn = getBtnSend()
        if (btn) {
          btn.disabled = true
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...'
        }

        try {
          let shareParams = null

          if (type === 'links') {
            const msg = await $storage.getMessage(id)
            if (msg) {
              shareParams = {
                type: 'link',
                content: msg.content,
                links: msg.links
              }
            }
          } else {
            const asset = await $storage.getAsset(id)
            if (asset) {
              shareParams = {
                type: 'media',
                content: '',
                filename: asset.filename,
                mime_type: asset.mime_type,
                media_id: asset.id,
                file_key: asset.file_key,
                file_nonce: asset.file_nonce,
                music_metadata: asset.music_metadata,
                album_art: asset.album_art
              }
            }
          }

          if (!shareParams) {
            throw new Error('Could not resolve item to share')
          }

          if (shareParams.type === 'media') {
            const mime = shareParams.mime_type || ''
            if (mime.startsWith('image/')) {
              shareParams.media_types = ['image']
            } else if (mime.startsWith('video/')) {
              shareParams.media_types = ['video']
            } else if (mime.startsWith('audio/')) {
              shareParams.media_types = ['audio']
            }
          }

          const sendPromises = Array.from(selectedRoomIds).map(room_id => {
            return $worker.execute('worker:send_message', {
              room_id,
              localUuid: crypto.randomUUID(),
              ...shareParams,
              timestamp: Date.now()
            })
          })

          await Promise.all(sendPromises)

          $bus.emit('ui:show_toast', {
            message: `Shared with ${selectedRoomIds.size} room${selectedRoomIds.size > 1 ? 's' : ''}`,
            type: 'success'
          })

          modal.hide()
        } catch (err) {
          console.error('[share-button] Failed to share:', err)
          $bus.emit('ui:show_toast', {
            message: 'Failed to share: ' + err.message,
            type: 'danger'
          })
        } finally {
          const btnEnd = getBtnSend()
          if (btnEnd) {
            btnEnd.disabled = selectedRoomIds.size === 0
            btnEnd.innerHTML = 'Send'
          }
        }
      }

      root.addEventListener('click', async (e) => {
        const sendTarget = e.target.closest('[ref="btnSend"]') || e.target.closest('[ref$="btnSend"]')
        if (sendTarget) {
          sendShare()
          return
        }

        const openTarget = e.target.closest('[ref="btnOpenShare"]') || e.target.closest('[ref$="btnOpenShare"]') || (e.target.tagName === 'BUTTON' && !e.target.closest('atoll-popup'))
        if (openTarget) {
          selectedRoomIds.clear()
          updateSendButton()
          modal.show()

          loadedRooms = await $storage.getAllRoomsSorted()
          renderRooms()
        }
      }, { signal })
    }
  })
</script>

<style>
  .cursor-pointer {
    cursor: pointer;
  }
  .w-40px { width: 40px; }
  .h-40px { height: 40px; }
</style>
