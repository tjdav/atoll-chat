<template id="ui-avatar-group">
  <div class="ui-avatar-group position-relative d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
    <slot name="avatar"></slot>
  </div>
</template>

<style>
  .ui-avatar-group ::slotted(ui-avatar) {
    position: absolute !important;
    border: 2px solid var(--bs-body-bg);
    border-radius: 50%;
  }

  /* 2 participants */
  .ui-avatar-group:has(::slotted(ui-avatar:nth-child(2))):not(:has(::slotted(ui-avatar:nth-child(3)))) ::slotted(ui-avatar:nth-child(1)) {
    top: 0;
    right: 0;
    z-index: 2;
  }
  .ui-avatar-group:has(::slotted(ui-avatar:nth-child(2))):not(:has(::slotted(ui-avatar:nth-child(3)))) ::slotted(ui-avatar:nth-child(2)) {
    bottom: 0;
    left: 0;
    z-index: 1;
  }

  /* 3+ participants */
  .ui-avatar-group:has(::slotted(ui-avatar:nth-child(3))) ::slotted(ui-avatar:nth-child(1)) {
    top: 0;
    left: 10px;
    z-index: 3;
  }
  .ui-avatar-group:has(::slotted(ui-avatar:nth-child(3))) ::slotted(ui-avatar:nth-child(2)) {
    bottom: 0;
    left: 0;
    z-index: 2;
  }
  .ui-avatar-group:has(::slotted(ui-avatar:nth-child(3))) ::slotted(ui-avatar:nth-child(3)) {
    bottom: 0;
    right: 0;
    z-index: 1;
  }
</style>
