<template id="ui-link-preview-input">
  <div class="link-preview-input-container p-2 mb-2 position-relative">
    <div class="d-flex align-items-center flex-grow-1 overflow-hidden">
      <div class="preview-image-col me-2 {{ imageDisplayClass }}">
        <img ref="previewImg" class="rounded" style="width: 60px; height: 60px;" alt="Preview">
      </div>
      <div class="preview-text-container overflow-hidden">
        <div class="small fw-bold text-truncate">{{ title }}</div>
        <div class="fs-7 text-muted text-truncate">{{ description }}</div>
        <div class="fs-7 text-primary text-truncate">{{ domain }}</div>
      </div>
    </div>
    <atoll-button variant="ghost" leading-icon="close" icon-only="true" ref="removeBtn" title="Dismiss preview"></atoll-button>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .link-preview-input-container {
    display: flex;
    align-items: center;
    border-radius: var(--bs-border-radius-lg, 12px);
    background-color: var(--atoll-chat-attachment-card-bg, var(--bs-tertiary-bg, #f8f9fa));
    border: 1px solid var(--atoll-chat-attachment-card-border, var(--bs-border-color, rgba(0, 0, 0, 0.175)));
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    attributes: {
      title: String,
      description: String,
      image: String,
      domain: String,
      url: String
    },
    getters: {
      imageDisplayClass: (state) => (state.image ? 'd-block' : 'd-none')
    },
    client: ({ state, refs, eventBus, signal, observe }) => {
      const { $bus } = eventBus
      const cancelBtn = refs('removeBtn')
      const previewImg = refs('previewImg')

      const updateImage = () => {
        previewImg.src = state.image || ''
      }

      updateImage()
      observe('image', updateImage)
  
      cancelBtn.addEventListener('click', () => {
        $bus.emit('ui:dismiss_link_preview', { url: state.url })
      }, { signal })
    }
  })
</script>
