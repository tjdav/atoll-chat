[package]
name = "server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
altcha = "0.2.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
