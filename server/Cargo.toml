[package]
name = "server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[dependencies]
toml = "0.8"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
altcha = "0.2.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-s3 = "0.35"
aes-gcm = "0.10"
hkdf = "0.12"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
p256 = { version = "0.13", features = ["ecdsa"] }
web-push = "0.10"
futures = "0.3"
a2 = "0.10"
jsonwebtoken = "9"
yup-oauth2 = "11"
voprf = "=0.5.0"
ed25519-dalek = "2.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
regex = "1"
flate2 = "1.0"
url = "2.5"
argon2 = "=0.5.3"
subtle = "=2.6.1"
sha1 = "0.10"
