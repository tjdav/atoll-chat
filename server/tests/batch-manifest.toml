# Test batch manifest.
#
# Every file in tests/*.rs MUST appear in exactly one batch.
# The test `test_batch_manifest.rs` enforces this invariant.
#
# To add a new test file:
#   1. Add it to the batch that matches its domain.
#   2. If no batch fits, add a new batch.
#   3. Update the Makefile (see below) — or the Makefile can read this file.
#
# Batch runtime budget: 60 seconds per batch.

[[batch]]
name = "identity"
description = "OPRF identity, registration, login, lookup, profile, GDPR"
files = [
    "gdpr",
    "gdpr_identity",
    "identity_schema",
    "login_oprf",
    "lookup_oprf",
    "profile_oprf",
    "register_oprf",
    "registration",
]
timeout_seconds = 60

