services:
  atoll:
    build: 
      context: ../../../
      args:
        - ATOLL_POCKETBASE_URL=/
        - ATOLL_VAPID_KEY=${ATOLL_VAPID_PUBLIC_KEY}
    container_name: atoll-chat
    ports:
      - "8080:8080"
    volumes:
      - ../../../pb_data:/pb/pb_data
    environment:
      - ATOLL_PUSH_WORKER_URL=http://push-worker:3000
      - ATOLL_PUSH_WORKER_SECRET=${ATOLL_PUSH_WORKER_SECRET}
      - ATOLL_S3_ENDPOINT=${ATOLL_S3_ENDPOINT}
      - ATOLL_S3_BUCKET=${ATOLL_S3_BUCKET}
      - ATOLL_S3_ACCESS_KEY=${ATOLL_S3_ACCESS_KEY}
      - ATOLL_S3_SECRET=${ATOLL_S3_SECRET}
      - ATOLL_TURN_SHARED_SECRET=${ATOLL_TURN_SHARED_SECRET}
      - ATOLL_TURN_URIS=${ATOLL_TURN_URIS}
      - ATOLL_SMTP_ENABLED=${ATOLL_SMTP_ENABLED}
      - ATOLL_SMTP_HOST=${ATOLL_SMTP_HOST}
      - ATOLL_SMTP_PORT=${ATOLL_SMTP_PORT}
      - ATOLL_SMTP_USERNAME=${ATOLL_SMTP_USERNAME}
      - ATOLL_SMTP_PASSWORD=${ATOLL_SMTP_PASSWORD}
      - ATOLL_SMTP_TLS=${ATOLL_SMTP_TLS}
      - ATOLL_SMTP_AUTH_METHOD=${ATOLL_SMTP_AUTH_METHOD}
      - ATOLL_SMTP_LOCAL_NAME=${ATOLL_SMTP_LOCAL_NAME}
      - ATOLL_SMTP_SENDER_NAME=${ATOLL_SMTP_SENDER_NAME}
      - ATOLL_SMTP_SENDER_ADDRESS=${ATOLL_SMTP_SENDER_ADDRESS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  push-worker:
    build: ../../../push-worker
    container_name: atoll-push-worker
    depends_on:
      atoll:
        condition: service_healthy
    environment:
      - PORT=3000
      - ATOLL_VAPID_PUBLIC_KEY=${ATOLL_VAPID_PUBLIC_KEY}
      - ATOLL_VAPID_PRIVATE_KEY=${ATOLL_VAPID_PRIVATE_KEY}
      - ATOLL_VAPID_SUBJECT=${ATOLL_VAPID_SUBJECT}
      - ATOLL_PUSH_WORKER_SECRET=${ATOLL_PUSH_WORKER_SECRET}
      - ATOLL_INTERNAL_POCKETBASE_URL=http://atoll:8080
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    container_name: atoll-coturn
    network_mode: "host"
    command:
      - -n
      - --lt-cred-mech
      - --user=testuser:testpass
      - --realm=atoll-chat
      - --listening-port=3478
    restart: unless-stopped