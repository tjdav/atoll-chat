services:
  pocketbase-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: atoll-pocketbase-dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./database/pb_hooks:/pb/pb_hooks
      - ./database/pb_migrations:/pb/pb_migrations
    env_file:
      - path: .env
        required: false
    environment:
      - ATOLL_APP_URL
      - ATOLL_PUSH_WORKER_URL=${ATOLL_PUSH_WORKER_URL:-http://host.docker.internal:3001}
      - ATOLL_PUSH_WORKER_SECRET=${ATOLL_PUSH_WORKER_SECRET:-test_secret_123}
      - ATOLL_SMTP_ENABLED
      - ATOLL_SMTP_HOST
      - ATOLL_SMTP_PORT
      - ATOLL_SMTP_USERNAME
      - ATOLL_SMTP_PASSWORD
      - ATOLL_SMTP_TLS
      - ATOLL_SMTP_AUTH_METHOD
      - ATOLL_SMTP_LOCAL_NAME
      - ATOLL_SMTP_SENDER_NAME
      - ATOLL_SMTP_SENDER_ADDRESS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    container_name: atoll-coturn
    network_mode: "host"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command:
      - -n
      - --lt-cred-mech
      - --fingerprint
      - --user=testuser:testpass
      - --realm=atoll-chat
      - --listening-port=3478
      - --listening-ip=0.0.0.0
      - --no-cli
    restart: unless-stopped
