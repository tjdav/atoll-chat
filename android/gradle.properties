# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true

android.builtInKotlin=false
android.newDsl=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true

# Suppress AGP deprecation and library constraint warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,FLAT_DIR_REPOSITORY_USED,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED,DEPRECATED_DSL
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
