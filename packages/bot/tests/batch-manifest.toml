# Batch manifest for @atoll/bot tests.
#
# Every *.test.js file under tests/unit/ and tests/integration/ must
# appear in exactly one batch. Files under tests/canary/ are excluded:
# they are type-checked by test:canary (tsc --noEmit), not executed.
#
# Each batch must complete in under max_batch_seconds. Split a batch
# before exceeding the budget.
#
# Paths in `files` are relative to tests/ and use forward slashes.

[meta]
max_batch_seconds = 60

[[batch]]
name = "keystore"
files = [
  "unit/keystore.test.js",
]

[[batch]]
name = "keychain-resolver"
files = [
  "unit/keychain-resolver.test.js",
]

[[batch]]
name = "prompt-resolver"
files = [
  "unit/prompt-resolver.test.js",
]

[[batch]]
name = "keychain-write"
files = [
  "unit/keychain-write.test.js",
]
