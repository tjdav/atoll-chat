<template id="rail-host">
  <nav class="rail" aria-label="{{ app_rail_aria_label }}" data-testid="rail">
    <ul class="rail__list" ref="railList">
      <li class="rail__item"></li>
    </ul>
  </nav>
</template>

<style>
  :host {
    display: contents;
  }

  .rail {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow-y: auto;
  }

  .rail__list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    list-style: none;
    margin: 0;
    padding: var(--space-3) 0;
  }

  .rail__button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
  }

  .rail__button:hover {
    background: var(--surface-2);
  }

  .rail__button[aria-current="page"] {
    background: var(--accent-fill);
    color: var(--text-inverse);
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      ...i18n.strings([
        'app_rail_aria_label'
      ])
    }
  },

  client({ state, refs, i18n, extensions, router, signal }) {
    i18n.subscribeLocale(
      (locale) => {
        state.locale = locale
        Object.assign(state, i18n.strings([
          'app_rail_aria_label'
        ]))
      },
      { signal }
    )

    const list = refs('railList')
    if (!list) return

    let renderAbort = new AbortController()

    function getEffectiveRailId() {
      const active = router.getActiveRail()
      if (active) return active
      const byOrder = extensions.byRailOrder()
      return byOrder.length > 0 ? byOrder[0].id : null
    }

    function renderRail() {
      renderAbort.abort()
      renderAbort = new AbortController()

      const railExtensions = extensions.byRailOrder()
      const activeId = getEffectiveRailId()

      list.innerHTML = ''

      for (const ext of railExtensions) {
        const li = document.createElement('li')
        li.className = 'rail__item'
        li.dataset.extensionId = ext.id

        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'rail__button'
        button.dataset.railId = ext.id
        button.setAttribute('aria-label', ext.label)
        button.setAttribute('aria-current', ext.id === activeId ? 'page' : 'false')

        const icon = document.createElement('ui-icon')
        icon.setAttribute('name', ext.rail.icon.name)
        icon.setAttribute('size', 'md')
        icon.setAttribute('label', '')

        button.appendChild(icon)
        li.appendChild(button)
        list.appendChild(li)

        button.addEventListener('click', () => {
          router.navigate({ rail: ext.id })
        }, { signal: renderAbort.signal })
      }
    }

    renderRail()

    router.subscribe(() => {
      renderRail()
    })
  }
})
</script>
