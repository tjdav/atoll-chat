<template id="message-bubble">
  <div class="bubble-row">
    <ui-profile class="bubble-avatar" name="{{ senderName }}" size="sm" hidden="{{ avatarHidden }}"></ui-profile>
    <div class="bubble">
      <span class="bubble-sender" hidden="{{ senderNameHidden }}">{{ senderName }}</span>
      <span class="bubble-text">{{ bodyText }}</span>
      <span class="bubble-meta">
        <span class="bubble-status" hidden="{{ statusHidden }}">{{ statusText }}</span>
        <span class="bubble-time">{{ timeText }}</span>
      </span>
    </div>
  </div>
</template>

<style>
  :host {
    display: block;
  }

  :host([is-first-in-group]) {
    margin-top: var(--space-3);
  }

  :host([is-last-in-group]) {
    margin-bottom: var(--space-1);
  }

  .bubble-row {
    display: flex;
    align-items: flex-end;
    gap: var(--space-2);
    max-width: min(75%, 600px);
  }

  :host([is-own]) .bubble-row {
    flex-direction: row-reverse;
    margin-left: auto;
  }

  .bubble-avatar {
    flex-shrink: 0;
  }

  .bubble {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-xl);
    background: var(--bubble-incoming);
    color: var(--text-primary);
    word-wrap: break-word;
    white-space: pre-wrap;
    min-width: 0;
  }

  :host([is-own]) .bubble {
    background: var(--bubble-outgoing);
    color: var(--bubble-outgoing-text);
    border-bottom-right-radius: var(--radius-sm);
  }

  :host(:not([is-own])) .bubble {
    border-bottom-left-radius: var(--radius-sm);
  }

  :host([is-tombstone]) .bubble {
    background: var(--surface-2);
    color: var(--text-muted);
    font-style: italic;
  }

  :host([is-failed]) .bubble {
    border: 1px solid var(--status-error);
  }

  :host([is-pending]) .bubble {
    opacity: 0.7;
  }

  .bubble-sender {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: var(--accent-text);
  }

  .bubble-text {
    font-size: var(--text-base);
    line-height: var(--leading-normal);
  }

  .bubble-meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-1);
    font-size: var(--text-xs);
    color: var(--text-muted);
    margin-top: 2px;
  }

  :host([is-own]) .bubble-meta {
    color: var(--bubble-outgoing-text);
    opacity: 0.7;
  }

  .bubble-status {
    white-space: nowrap;
  }

  .bubble-time {
    white-space: nowrap;
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    messageId: { type: String, default: '' },
    senderName: { type: String, default: '' },
    senderInitials: { type: String, default: '' },
    bodyText: { type: String, default: '' },
    timeText: { type: String, default: '' },
    statusText: { type: String, default: '' },
    isOwn: { type: Boolean, default: false, reflect: true },
    isTombstone: { type: Boolean, default: false, reflect: true },
    isFailed: { type: Boolean, default: false, reflect: true },
    isPending: { type: Boolean, default: false, reflect: true },
    isFirstInGroup: { type: Boolean, default: false, reflect: true },
    isLastInGroup: { type: Boolean, default: false, reflect: true }
  },

  getters: {
    avatarHidden: ({ state }) => state.isOwn || !state.isLastInGroup,
    senderNameHidden: ({ state }) => state.isOwn || !state.isFirstInGroup,
    statusHidden: ({ state }) => !state.statusText
  }
})
</script>
