<template id="message-bubble">
  <div class="bubble-row" ref="row" data-testid="conversation-row">
    <div class="bubble" ref="bubble">
      <div class="bubble__header" hidden="{{ headerHidden }}">
        <span class="bubble__sender">{{ senderName }}</span>
      </div>

      <div class="bubble__content" ref="content">
        <p class="bubble__text" hidden="{{ textHidden }}">{{ textContent }}</p>
        <p class="bubble__tombstone" hidden="{{ tombstoneHidden }}">{{ deletedText }}</p>
      </div>

      <div class="bubble__footer">
        <span class="bubble__time">{{ formattedTime }}</span>
        <span class="bubble__status" hidden="{{ statusHidden }}">{{ statusText }}</span>
      </div>
    </div>
  </div>
</template>

<style>
:host {
  display: block;
  margin-block: var(--space-1);
}

.bubble-row {
  display: flex;
  width: 100%;
}

:host([is-own]) .bubble-row {
  justify-content: flex-end;
}

.bubble {
  max-width: 70%;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

:host([is-own]) .bubble {
  background: var(--accent-primary);
  color: var(--text-on-accent);
}

:host([is-tombstone]) .bubble {
  background: var(--surface-1);
  border: 1px dashed var(--border-subtle);
  color: var(--text-muted);
  font-style: italic;
}

:host([is-pending]) .bubble {
  opacity: 0.7;
}

:host([is-failed]) .bubble {
  border: 1px solid var(--status-error);
}

.bubble__header {
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  color: var(--text-secondary);
}

:host([is-own]) .bubble__header {
  display: none;
}

.bubble__text {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: var(--text-sm);
  line-height: var(--leading-normal);
}

.bubble__tombstone {
  margin: 0;
  font-size: var(--text-sm);
}

.bubble__footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-1);
  font-size: var(--text-xs);
  color: var(--text-muted);
}

:host([is-own]) .bubble__footer {
  color: var(--text-on-accent-muted, rgba(255, 255, 255, 0.75));
}

.bubble__status {
  font-size: var(--text-xs);
}
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    messageId: { type: String, default: '' },
    senderName: { type: String, default: '' },
    formattedTime: { type: String, default: '' },
    textContent: { type: String, default: '' },
    isOwn: { type: Boolean, default: false, reflect: true },
    isTombstone: { type: Boolean, default: false, reflect: true },
    isPending: { type: Boolean, default: false, reflect: true },
    isFailed: { type: Boolean, default: false, reflect: true },
    isFirstInGroup: { type: Boolean, default: true },
    isLastInGroup: { type: Boolean, default: true }
  },

  getters: {
    headerHidden: ({ state }) => state.isOwn || !state.isFirstInGroup || state.isTombstone,
    textHidden: ({ state }) => state.isTombstone,
    tombstoneHidden: ({ state }) => !state.isTombstone,
    statusHidden: ({ state }) => !state.isOwn || state.isTombstone,
    deletedText: ({ state }) => state.chat_message_deleted || 'This message was deleted.',
    statusText: ({ state }) => {
      if (state.isFailed) return '!'
      if (state.isPending) return '...'
      return '✓'
    }
  },

  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      ...i18n.strings(['chat_message_deleted'])
    }
  },

  client({ state, refs, emit, i18n, signal }) {
    i18n.subscribeLocale(
      (locale) => {
        state.locale = locale
        Object.assign(state, i18n.strings(['chat_message_deleted']))
      },
      { signal }
    )

    const row = refs('row')
    if (row) {
      row.addEventListener('contextmenu', (event) => {
        event.preventDefault()
        emit('bubble:contextmenu', {
          messageId: state.messageId,
          x: event.clientX,
          y: event.clientY
        })
      }, { signal })

      let longPressTimer = null
      row.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse') return
        longPressTimer = setTimeout(() => {
          emit('bubble:contextmenu', {
            messageId: state.messageId,
            x: event.clientX,
            y: event.clientY
          })
        }, 500)
      }, { signal })

      const cancel = () => {
        if (longPressTimer) clearTimeout(longPressTimer)
        longPressTimer = null
      }
      row.addEventListener('pointerup', cancel, { signal })
      row.addEventListener('pointercancel', cancel, { signal })
      row.addEventListener('pointermove', cancel, { signal })
    }
  }
})
</script>
