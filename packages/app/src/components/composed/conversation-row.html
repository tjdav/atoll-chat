<template id="conversation-row">
  <button ref="row" type="button" class="row" data-testid="conversation-row" data-room-id="{{ roomId }}" data-unread="{{ isUnread }}" aria-current="{{ ariaCurrent }}">
    <ui-profile name="{{ name }}" size="md"></ui-profile>
    <div class="row__body">
      <div class="row__top">
        <span class="row__name">{{ name }}</span>
        <span class="row__time">{{ timestamp }}</span>
      </div>
      <div class="row__bottom">
        <span class="row__preview {{ previewClass }}">{{ preview }}</span>
        <span class="row__unread" hidden="{{ unreadHidden }}" aria-label="Unread"></span>
      </div>
    </div>
  </button>
</template>

<style>
  :host {
    display: block;
  }

  .row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
    border-radius: var(--radius-md);
    box-sizing: border-box;
  }

  .row:hover { background: var(--surface-2); }
  .row[aria-current="true"] { background: var(--surface-3); }

  .row__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .row__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .row__name { font-weight: var(--weight-medium); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row[data-unread="true"] .row__name { font-weight: var(--weight-bold); }
  .row__time { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
  .row__bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
  .row__preview { font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row__preview--draft { font-style: italic; }
  .row__unread { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--accent-fill); flex-shrink: 0; }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    roomId: { type: String, default: '' },
    name: { type: String, default: '' },
    preview: { type: String, default: '' },
    timestamp: { type: String, default: '' },
    isUnread: { type: Boolean, default: false },
    isActive: { type: Boolean, default: false },
    hasDraft: { type: Boolean, default: false },
    isGroup: { type: Boolean, default: false }
  },

  getters: {
    ariaCurrent: ({ state }) => (state.isActive ? 'true' : 'false'),
    previewClass: ({ state }) => (state.hasDraft ? 'row__preview--draft' : ''),
    unreadHidden: ({ state }) => !state.isUnread
  },

  client({ state, refs, emit, signal }) {
    const rowEl = refs('row')
    if (rowEl) {
      rowEl.addEventListener('click', () => {
        emit('conversation-selected', { roomId: state.roomId })
      }, { signal })
    }
  }
})
</script>
