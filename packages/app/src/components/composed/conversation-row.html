<template id="conversation-row">
  <button
    ref="button"
    type="button"
    class="row"
    aria-current="{{ ariaCurrent }}"
    data-testid="conversation-row"
  >
    <ui-profile
      name="{{ title }}"
      size="md"
      class="row__avatar"
    ></ui-profile>
    <div class="row__content">
      <div class="row__header">
        <span class="row__name">{{ title }}</span>
        <span class="row__time" hidden="{{ timeHidden }}">{{ formattedTime }}</span>
      </div>
      <div class="row__footer">
        <span class="row__snippet">{{ lastMessageSnippet }}</span>
      </div>
    </div>
  </button>
</template>

<style>
  :host {
    display: block;
  }

  .row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    padding: var(--space-3) var(--space-4);
    border: none;
    background: transparent;
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
    font: inherit;
    transition: background var(--duration-fast, 150ms) ease;
  }

  .row:hover {
    background: var(--surface-2);
  }

  .row[aria-current="true"] {
    background: var(--surface-3, var(--surface-2));
  }

  :host([is-unread]) .row__name,
  :host([isunread]) .row__name {
    font-weight: var(--weight-bold);
  }

  .row__avatar {
    flex-shrink: 0;
  }

  .row__content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .row__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }

  .row__name {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row__time {
    font-size: var(--text-xs);
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .row__footer {
    display: flex;
    align-items: center;
  }

  .row__snippet {
    font-size: var(--text-xs);
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    roomId: { type: String, default: '' },
    title: { type: String, default: '' },
    lastMessageSnippet: { type: String, default: '' },
    lastMessageTimestamp: { type: Number, default: 0 },
    isUnread: { type: Boolean, default: false, reflect: true },
    isActive: { type: Boolean, default: false }
  },

  getters: {
    ariaCurrent: ({ state }) => (state.isActive ? 'true' : 'false'),
    timeHidden: ({ state }) => state.lastMessageTimestamp === 0,
    formattedTime: ({ state }) => {
      if (!state.lastMessageTimestamp) return ''
      const date = new Date(state.lastMessageTimestamp)
      const now = new Date()
      const isToday = date.toDateString() === now.toDateString()
      if (isToday) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
      return date.toLocaleDateString([], { month: 'short', day: 'numeric' })
    }
  },

  client({ refs, emit, state, signal }) {
    const button = refs('button')
    if (button) {
      button.addEventListener('click', () => {
        emit('select', { roomId: state.roomId })
      }, { signal })
    }
  }
})
</script>
