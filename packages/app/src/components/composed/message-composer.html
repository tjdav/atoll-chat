<template id="message-composer">
  <div class="composer" data-testid="composer">
    <button ref="attach" type="button" class="composer__btn composer__btn--attach" aria-label="{{ attachLabel }}" disabled>
      <span aria-hidden="true">+</span>
    </button>
    <button ref="emoji" type="button" class="composer__btn composer__btn--emoji" aria-label="{{ emojiLabel }}" disabled>
      <span aria-hidden="true">☺</span>
    </button>
    <button ref="readaloud" type="button" class="composer__btn composer__btn--speak" aria-label="{{ readaloudLabel }}" disabled>
      <span aria-hidden="true">🔊</span>
    </button>
    <textarea
      ref="input"
      class="composer__input"
      rows="1"
      placeholder="{{ placeholder }}"
      disabled="{{ disabled }}"
      aria-label="{{ inputLabel }}"
    ></textarea>
    <button ref="send" type="button" class="composer__btn composer__btn--send" aria-label="{{ sendLabel }}" disabled="{{ sendDisabled }}">
      <span aria-hidden="true">{{ sendGlyph }}</span>
    </button>
  </div>
</template>

<style>
:host {
  display: block;
  padding: var(--space-2);
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-2);
  background: var(--surface-2);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-subtle);
}

.composer__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: var(--text-base);
  flex-shrink: 0;
}

.composer__btn:hover:not(:disabled) {
  background: var(--surface-3);
}

.composer__btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.composer__btn--send {
  background: var(--accent-fill);
  color: var(--text-inverse);
}

.composer__btn--send:hover:not(:disabled) {
  filter: brightness(1.05);
}

.composer__btn--send:disabled {
  background: var(--surface-3);
  color: var(--text-muted);
}

.composer__input {
  flex: 1;
  min-height: 24px;
  max-height: 200px;
  resize: none;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  padding: var(--space-1) 0;
  outline: none;
  overflow-y: auto;
}

.composer__input::placeholder {
  color: var(--text-muted);
}
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    placeholder: { type: String, default: '' },
    disabled: { type: Boolean, default: false, reflect: true },
    hasText: { type: Boolean, default: false, reflect: true },
    attachLabel: { type: String, default: 'Attach' },
    emojiLabel: { type: String, default: 'Emoji' },
    readaloudLabel: { type: String, default: 'Read aloud' },
    inputLabel: { type: String, default: 'Message' },
    sendLabel: { type: String, default: 'Send' }
  },

  getters: {
    sendDisabled: ({ state }) => state.disabled || !state.hasText,
    sendGlyph: ({ state }) => (state.hasText ? '➤' : '🎤')
  },

  client({ state, refs, emit, signal }) {
    const input = refs('input')

    function autoGrow() {
      input.style.height = 'auto'
      input.style.height = `${input.scrollHeight}px`
    }

    input.addEventListener('input', () => {
      autoGrow()
      state.hasText = input.value.trim().length > 0
    }, { signal })

    function trySend() {
      const text = input.value
      if (!text.trim()) return
      emit('composer:send', { text })
      input.value = ''
      state.hasText = false
      autoGrow()
    }

    input.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return
      const isDesktop = window.matchMedia('(pointer: fine)').matches
      if (isDesktop && !event.shiftKey) {
        event.preventDefault()
        trySend()
      }
    }, { signal })

    refs('send').addEventListener('click', trySend, { signal })

    refs('attach').addEventListener('click', () => {
      emit('composer:attach', {})
    }, { signal })

    refs('emoji').addEventListener('click', () => {
      emit('composer:emoji', {})
    }, { signal })

    refs('readaloud').addEventListener('click', () => {
      emit('composer:readaloud', {})
    }, { signal })

    autoGrow()
  }
})
</script>
