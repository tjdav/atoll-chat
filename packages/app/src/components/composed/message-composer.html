<template id="message-composer">
  <div class="composer-wrapper">
    <div class="composer-banner" hidden="{{ bannerHidden }}">
      <span class="composer-banner__label">{{ editBannerLabel }}</span>
      <button ref="cancel" type="button" class="composer-banner__cancel" aria-label="{{ editCancelLabel }}">✕</button>
    </div>
    <div class="composer" data-testid="composer">
      <button ref="attach" type="button" class="composer__btn composer__btn--attach" aria-label="{{ attachLabel }}" disabled>
        <span aria-hidden="true">+</span>
      </button>
      <button ref="emoji" type="button" class="composer__btn composer__btn--emoji" aria-label="{{ emojiLabel }}" disabled>
        <span aria-hidden="true">☺</span>
      </button>
      <button ref="readaloud" type="button" class="composer__btn composer__btn--speak" aria-label="{{ readaloudLabel }}" disabled>
        <span aria-hidden="true">🔊</span>
      </button>
      <textarea
        ref="input"
        class="composer__input"
        rows="1"
        placeholder="{{ placeholder }}"
        disabled="{{ disabled }}"
        aria-label="{{ inputLabel }}"
      ></textarea>
      <button ref="send" type="button" class="composer__btn composer__btn--send" aria-label="{{ sendAriaLabel }}" disabled="{{ sendDisabled }}">
        <span aria-hidden="true">{{ sendGlyph }}</span>
      </button>
    </div>
  </div>
</template>

<style>
:host {
  display: block;
  padding: var(--space-2);
}

.composer-wrapper {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.composer-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-1) var(--space-2);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.composer-banner__label {
  font-weight: var(--weight-medium);
}

.composer-banner__cancel {
  border: none;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  padding: 0 var(--space-2);
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-2);
  background: var(--surface-2);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-subtle);
}

.composer__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: var(--text-base);
  flex-shrink: 0;
}

.composer__btn:hover:not(:disabled) {
  background: var(--surface-3);
}

.composer__btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.composer__btn--send {
  background: var(--accent-fill);
  color: var(--text-inverse);
}

.composer__btn--send:hover:not(:disabled) {
  filter: brightness(1.05);
}

.composer__btn--send:disabled {
  background: var(--surface-3);
  color: var(--text-muted);
}

.composer__input {
  flex: 1;
  min-height: 24px;
  max-height: 200px;
  resize: none;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  padding: var(--space-1) 0;
  outline: none;
  overflow-y: auto;
}

.composer__input::placeholder {
  color: var(--text-muted);
}
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    placeholder: { type: String, default: '' },
    disabled: { type: Boolean, default: false, reflect: true },
    hasText: { type: Boolean, default: false, reflect: true },
    editing: { type: Boolean, default: false, reflect: true },
    prefill: { type: String, default: '' },
    editBannerLabel: { type: String, default: 'Editing' },
    editCancelLabel: { type: String, default: 'Cancel edit' },
    editSaveLabel: { type: String, default: 'Save edit' },
    attachLabel: { type: String, default: 'Attach' },
    emojiLabel: { type: String, default: 'Emoji' },
    readaloudLabel: { type: String, default: 'Read aloud' },
    inputLabel: { type: String, default: 'Message' },
    sendLabel: { type: String, default: 'Send' }
  },

  getters: {
    bannerHidden: ({ state }) => !state.editing,
    sendGlyph: ({ state }) => state.editing ? '✓' : (state.hasText ? '➤' : '🎤'),
    sendAriaLabel: ({ state }) => state.editing ? state.editSaveLabel : state.sendLabel,
    sendDisabled: ({ state }) => state.disabled || !state.hasText
  },

  client({ state, refs, emit, observe, signal }) {
    const input = refs('input')

    function autoGrow() {
      input.style.height = 'auto'
      input.style.height = `${input.scrollHeight}px`
    }

    function applyPrefill(value) {
      if (input.value === value) return
      input.value = value
      autoGrow()
      queueMicrotask(() => {
        state.hasText = input.value.trim().length > 0
      })
    }

    if (state.prefill) applyPrefill(state.prefill)

    observe('prefill', (newVal) => {
      applyPrefill(newVal ?? '')
    })

    input.addEventListener('input', () => {
      autoGrow()
      state.hasText = input.value.trim().length > 0
    }, { signal })

    function trySend() {
      const text = input.value
      if (!text.trim()) return
      if (state.editing) {
        emit('composer:edit-submit', { text })
      } else {
        emit('composer:send', { text })
        input.value = ''
        state.hasText = false
        autoGrow()
      }
    }

    input.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return
      const isDesktop = window.matchMedia('(pointer: fine)').matches
      if (isDesktop && !event.shiftKey) {
        event.preventDefault()
        trySend()
      }
    }, { signal })

    refs('send').addEventListener('click', trySend, { signal })

    refs('cancel').addEventListener('click', () => {
      emit('composer:edit-cancel', {})
    }, { signal })

    refs('attach').addEventListener('click', () => {
      emit('composer:attach', {})
    }, { signal })

    refs('emoji').addEventListener('click', () => {
      emit('composer:emoji', {})
    }, { signal })

    refs('readaloud').addEventListener('click', () => {
      emit('composer:readaloud', {})
    }, { signal })

    autoGrow()
  }
})
</script>
