<template id="message-reply-preview">
  <div class="preview" data-testid="reply-preview">
    <div class="preview__body">
      <span class="preview__sender">{{ senderName }}</span>
      <span class="preview__snippet">{{ snippet }}</span>
    </div>
    <button ref="close" type="button" class="preview__close" aria-label="{{ closeLabel }}">✕</button>
  </div>
</template>

<style>
:host {
  display: block;
}

[hidden] {
  display: none !important;
}

.preview {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-left: 3px solid var(--accent-fill);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-1);
}

.preview__body {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  gap: 2px;
}

.preview__sender {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--accent-text);
}

.preview__snippet {
  font-size: var(--text-sm);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.preview__close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: var(--text-sm);
  flex-shrink: 0;
}

.preview__close:hover {
  background: var(--surface-3);
}
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    senderName: { type: String, default: '' },
    snippet: { type: String, default: '' },
    closeLabel: { type: String, default: 'Cancel reply' }
  },

  client({ refs, emit, signal }) {
    refs('close').addEventListener('click', () => {
      emit('reply-preview:dismiss', {})
    }, { signal })
  }
})
</script>
