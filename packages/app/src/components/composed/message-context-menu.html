<template id="message-context-menu">
  <div class="menu" role="menu" ref="menu" hidden="{{ menuHidden }}">
    <div class="menu__reactions" ref="reactions" hidden="{{ reactionsHidden }}">
      <button ref="emoji0" type="button" class="menu__emoji" aria-label="{{ menu_react_label_0 }}">👍</button>
      <button ref="emoji1" type="button" class="menu__emoji" aria-label="{{ menu_react_label_1 }}">❤️</button>
      <button ref="emoji2" type="button" class="menu__emoji" aria-label="{{ menu_react_label_2 }}">😂</button>
      <button ref="emoji3" type="button" class="menu__emoji" aria-label="{{ menu_react_label_3 }}">😮</button>
      <button ref="emoji4" type="button" class="menu__emoji" aria-label="{{ menu_react_label_4 }}">😢</button>
      <button ref="emoji5" type="button" class="menu__emoji" aria-label="{{ menu_react_label_5 }}">🎉</button>
    </div>
    <button ref="edit" type="button" class="menu__item" role="menuitem" hidden="{{ editHidden }}">{{ menu_edit }}</button>
    <button ref="copy" type="button" class="menu__item" role="menuitem" hidden="{{ copyHidden }}">{{ menu_copy }}</button>
    <button ref="unsend" type="button" class="menu__item" role="menuitem" hidden="{{ unsendHidden }}">{{ menu_unsend }}</button>
    <button ref="delete" type="button" class="menu__item menu__item--danger" role="menuitem">{{ menu_delete_for_me }}</button>
  </div>
</template>

<style>
:host { display: contents; }

[hidden] { display: none !important; }

.menu {
  position: fixed;
  left: var(--menu-x, 0);
  top: var(--menu-y, 0);
  z-index: var(--z-popover);
  min-width: 180px;
  padding: var(--space-1);
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: var(--text-sm);
}

.menu__reactions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2px;
  padding: var(--space-1) var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-1);
}

.menu__emoji {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  cursor: pointer;
  font-size: var(--text-base);
  padding: 0;
}

.menu__emoji:hover { background: var(--surface-2); }

.menu__item {
  display: flex;
  align-items: center;
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
  color: var(--text-primary);
  font: inherit;
  border-radius: var(--radius-sm);
}

.menu__item:hover { background: var(--surface-2); }

.menu__item--danger { color: var(--status-error); }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    open: { type: Boolean, default: false, reflect: true },
    x: { type: Number, default: 0 },
    y: { type: Number, default: 0 },
    messageId: { type: String, default: '' },
    canUnsend: { type: Boolean, default: false },
    canCopy: { type: Boolean, default: true },
    canEdit: { type: Boolean, default: false },
    canReact: { type: Boolean, default: false }
  },

  getters: {
    menuHidden: ({ state }) => !state.open,
    editHidden: ({ state }) => !state.canEdit,
    copyHidden: ({ state }) => !state.canCopy,
    unsendHidden: ({ state }) => !state.canUnsend,
    reactionsHidden: ({ state }) => !state.canReact
  },

  style: {
    '--menu-x': (state) => `${state.x}px`,
    '--menu-y': (state) => `${state.y}px`
  },

  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      ...i18n.strings([
        'menu_edit',
        'menu_copy',
        'menu_delete_for_me',
        'menu_unsend',
        'menu_react_label_0',
        'menu_react_label_1',
        'menu_react_label_2',
        'menu_react_label_3',
        'menu_react_label_4',
        'menu_react_label_5'
      ])
    }
  },

  client({ state, refs, emit, i18n, signal }) {
    i18n.subscribeLocale(
      (locale) => {
        state.locale = locale
        Object.assign(state, i18n.strings([
          'menu_edit',
          'menu_copy',
          'menu_delete_for_me',
          'menu_unsend',
          'menu_react_label_0',
          'menu_react_label_1',
          'menu_react_label_2',
          'menu_react_label_3',
          'menu_react_label_4',
          'menu_react_label_5'
        ]))
      },
      { signal }
    )

    const emojis = ['👍', '❤️', '😂', '😮', '😢', '🎉']
    emojis.forEach((emoji, index) => {
      const btn = refs(`emoji${index}`)
      if (!btn) return
      btn.addEventListener('click', () => {
        emit('menu:react', { messageId: state.messageId, reaction: emoji })
      }, { signal })
    })

    refs('edit').addEventListener('click', () => {
      emit('menu:edit', { messageId: state.messageId })
    }, { signal })

    refs('copy').addEventListener('click', () => {
      emit('menu:copy', { messageId: state.messageId })
    }, { signal })

    refs('unsend').addEventListener('click', () => {
      emit('menu:unsend', { messageId: state.messageId })
    }, { signal })

    refs('delete').addEventListener('click', () => {
      emit('menu:delete', { messageId: state.messageId })
    }, { signal })

    function onDocumentClick(event) {
      if (!state.open) return
      const menu = refs('menu')
      if (menu && menu.contains(event.target)) return
      emit('menu:close', {})
    }
    document.addEventListener('click', onDocumentClick, { signal })
    document.addEventListener('contextmenu', onDocumentClick, { signal })

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.open) emit('menu:close', {})
    }, { signal })
  }
})
</script>
