<template id="ui-icon">
  <span
    ref="wrapper"
    class="icon"
    aria-hidden="{{ hidden }}"
    aria-label="{{ label }}"
  ></span>
</template>

<style>
  :host {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    line-height: 0;
    color: inherit;
  }

  .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1em;
    height: 1em;
    color: inherit;
  }

  .icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    name: { type: String, default: '' },
    size: { type: String, default: 'md' },
    color: { type: String, default: 'currentColor' },
    label: { type: String, default: '' }
  },

  getters: {
    hidden: ({ state }) => state.label === '' ? 'true' : 'false'
  },

  style: {
    fontSize: (state) => {
      if (state.size === 'sm') return 'var(--icon-size-sm, 16px)'
      if (state.size === 'md') return 'var(--icon-size-md, 20px)'
      if (state.size === 'lg') return 'var(--icon-size-lg, 24px)'
      return state.size
    },
    color: (state) => state.color
  },

  server({ state, icons }) {
    function safeGetSvg(name) {
      if (!name) return ''
      try {
        const svg = icons.get(name)
        return typeof svg === 'string' ? svg : String(svg)
      } catch {
        return ''
      }
    }

    return {
      svg: safeGetSvg(state.name)
    }
  },

  client({ state, refs, icons, observe }) {
    const wrapper = refs('wrapper')

    function render() {
      if (!wrapper) return
      if (!state.name) {
        wrapper.innerHTML = ''
        return
      }
      try {
        const svg = icons.get(state.name)
        wrapper.innerHTML = typeof svg === 'string' ? svg : String(svg)
      } catch {
        wrapper.innerHTML = ''
      }
    }

    render()

    if (typeof observe === 'function') {
      observe('name', render)
    }
  }
})
</script>
