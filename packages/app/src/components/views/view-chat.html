<template id="view-chat">
  <div class="chat" ref="root">
    <div class="chat__thread" ref="thread" role="log" aria-live="polite"></div>

    <button
      type="button"
      class="chat__scroll-btn"
      ref="scrollBtn"
      hidden="{{ scrollBtnHidden }}"
      aria-label="{{ chat_scroll_to_bottom }}"
    >
      <ui-icon name="alt-arrow-down" size="sm"></ui-icon>
    </button>

    <footer class="chat__composer">
      <message-reply-preview
        ref="replyPreview"
        sender-name="{{ replyPreviewSender }}"
        snippet="{{ replyPreviewSnippet }}"
        close-label="{{ reply_preview_close_label }}"
        hidden="{{ replyPreviewHidden }}"
      ></message-reply-preview>
      <message-composer
        ref="composer"
        placeholder="{{ chat_composer_placeholder }}"
        attach-label="{{ chat_composer_attach_label }}"
        emoji-label="{{ chat_composer_emoji_label }}"
        readaloud-label="{{ chat_composer_readaloud_label }}"
        input-label="{{ chat_composer_input_label }}"
        send-label="{{ chat_composer_send_label }}"
        editing="{{ composerEditing }}"
        prefill="{{ composerPrefill }}"
        edit-banner-label="{{ composer_edit_banner }}"
        edit-cancel-label="{{ composer_edit_cancel_label }}"
        edit-save-label="{{ composer_edit_save_label }}"
      ></message-composer>
    </footer>

    <message-context-menu
      ref="contextMenu"
      open="{{ menuOpen }}"
      x="{{ menuX }}"
      y="{{ menuY }}"
      message-id="{{ menuMessageId }}"
      can-reply="{{ menuCanReply }}"
      can-unsend="{{ menuCanUnsend }}"
      can-copy="{{ menuCanCopy }}"
      can-edit="{{ menuCanEdit }}"
      can-react="{{ menuCanReact }}"
    ></message-context-menu>

    <message-versions-sheet
      ref="versionsSheet"
      open="{{ versionsSheetOpen }}"
      message-id="{{ versionsSheetMessageId }}"
      history-json="{{ versionsSheetHistoryJson }}"
    ></message-versions-sheet>
  </div>
</template>

<style>
:host {
  display: block;
  height: 100%;
  width: 100%;
}

.chat {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100%;
  width: 100%;
  position: relative;
  box-sizing: border-box;
  background: var(--surface-0);
}

.chat__thread {
  grid-row: 2;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  scroll-behavior: smooth;
}

.chat__divider {
  display: flex;
  align-items: center;
  margin-block: var(--space-3);
  gap: var(--space-2);
}

.chat__divider-line {
  flex: 1;
  height: 1px;
  background: var(--status-error, #e53935);
}

.chat__divider-label {
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  color: var(--status-error, #e53935);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wider);
}

.chat__scroll-btn {
  position: absolute;
  right: var(--space-4);
  bottom: 80px;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  z-index: var(--z-popover);
}

.chat__scroll-btn:hover {
  background: var(--surface-3);
}

.chat__composer {
  grid-row: 3;
  border-top: 1px solid var(--border-subtle);
  background: var(--surface-1);
}
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    menuOpen: { type: Boolean, default: false },
    menuX: { type: Number, default: 0 },
    menuY: { type: Number, default: 0 },
    menuMessageId: { type: String, default: '' },
    menuCanReply: { type: Boolean, default: true },
    menuCanUnsend: { type: Boolean, default: false },
    menuCanCopy: { type: Boolean, default: true },
    menuCanEdit: { type: Boolean, default: false },
    menuCanReact: { type: Boolean, default: true },
    composerEditing: { type: Boolean, default: false },
    composerPrefill: { type: String, default: '' },
    editingMessageId: { type: String, default: '' },
    versionsSheetOpen: { type: Boolean, default: false },
    versionsSheetMessageId: { type: String, default: '' },
    versionsSheetHistoryJson: { type: String, default: '[]' },
    replyPreviewVisible: { type: Boolean, default: false },
    replyPreviewSender: { type: String, default: '' },
    replyPreviewSnippet: { type: String, default: '' },
    replyToMessageId: { type: String, default: '' }
  },

  getters: {
    scrollBtnHidden: ({ state }) => !state.showScrollBtn,
    replyPreviewHidden: ({ state }) => !state.replyPreviewVisible
  },

  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      showScrollBtn: false,
      menuOpen: false,
      menuX: 0,
      menuY: 0,
      menuMessageId: '',
      menuCanReply: true,
      menuCanUnsend: false,
      menuCanCopy: true,
      menuCanEdit: false,
      menuCanReact: true,
      composerEditing: false,
      composerPrefill: '',
      editingMessageId: '',
      versionsSheetOpen: false,
      versionsSheetMessageId: '',
      versionsSheetHistoryJson: '[]',
      replyPreviewVisible: false,
      replyPreviewSender: '',
      replyPreviewSnippet: '',
      replyToMessageId: '',
      ...i18n.strings([
        'chat_scroll_to_bottom',
        'chat_new_messages_divider',
        'chat_composer_placeholder',
        'chat_composer_attach_label',
        'chat_composer_emoji_label',
        'chat_composer_readaloud_label',
        'chat_composer_input_label',
        'chat_composer_send_label',
        'menu_reply',
        'menu_edit',
        'composer_edit_banner',
        'composer_edit_cancel_label',
        'composer_edit_save_label',
        'bubble_edited_label',
        'edit_history_title',
        'edit_history_current_label',
        'edit_history_original_label',
        'edit_history_close_label',
        'menu_react_label_0',
        'menu_react_label_1',
        'menu_react_label_2',
        'menu_react_label_3',
        'menu_react_label_4',
        'menu_react_label_5',
        'reply_preview_close_label',
        'reply_snippet_deleted',
        'reply_snippet_attachment',
        'chats_preview_you_prefix'
      ])
    }
  },

  async client({ state, refs, router, i18n, storage, repos, signal, globalStore }) {
    const reposApi = repos ?? storage?.repos?.()

    const {
      safeParsePayload,
      summarizePayload,
      groupMessages,
      insertDateSeparators,
      findNewMessagesDivider,
      formatTime
    } = await import('../../lib/views/view-chat-data.js')

    const { sendMessage } = await import('../../lib/views/send-message.js')
    const { isUnsendAvailable, copyMessage, unsend, deleteForMe } = await import('../../lib/views/message-actions.js')
    const { isEditAvailable, editMessage } = await import('../../lib/views/edit-message.js')
    const { buildHistory } = await import('../../lib/views/edit-history.js')
    const { toggleReaction, isReactionAllowed } = await import('../../lib/views/reactions.js')
    const { buildReplyContext, isReplyAllowed, truncateQuote } = await import('../../lib/views/reply.js')
    const { buildTextPayload, encodePayload, encodeCiphertextStub } = await import('../../lib/composer/index.js')

    let currentRoomId = null
    let clientId = (await storage?.meta?.get('client_id')) || 'c_me'

    const updateLocale = (locale) => {
      state.locale = locale
      Object.assign(
        state,
        i18n.strings([
          'chat_scroll_to_bottom',
          'chat_new_messages_divider',
          'chat_composer_placeholder',
          'chat_composer_attach_label',
          'chat_composer_emoji_label',
          'chat_composer_readaloud_label',
          'chat_composer_input_label',
          'chat_composer_send_label',
          'menu_reply',
          'menu_edit',
          'composer_edit_banner',
          'composer_edit_cancel_label',
          'composer_edit_save_label',
          'bubble_edited_label',
          'edit_history_title',
          'edit_history_current_label',
          'edit_history_original_label',
          'edit_history_close_label',
          'menu_react_label_0',
          'menu_react_label_1',
          'menu_react_label_2',
          'menu_react_label_3',
          'menu_react_label_4',
          'menu_react_label_5',
          'reply_preview_close_label',
          'reply_snippet_deleted',
          'reply_snippet_attachment',
          'chats_preview_you_prefix'
        ])
      )
    }
    updateLocale(i18n.getLocale())
    i18n.subscribeLocale(updateLocale, { signal })

    const threadEl = refs('thread')
    const scrollBtnEl = refs('scrollBtn')

    function scrollToBottom(smooth = false) {
      if (!threadEl) return
      threadEl.scrollTo({
        top: threadEl.scrollHeight,
        behavior: smooth ? 'smooth' : 'instant'
      })
      state.showScrollBtn = false
    }

    if (scrollBtnEl) {
      scrollBtnEl.addEventListener('click', () => scrollToBottom(true), { signal })
    }

    let readDebounceTimer = null
    function debouncedMarkRead(roomId, lastMessageId) {
      if (!roomId || !lastMessageId || !reposApi) return
      if (readDebounceTimer) clearTimeout(readDebounceTimer)
      readDebounceTimer = setTimeout(async () => {
        try {
          const userId = globalStore?.$state?.user?.id || 'u_me'
          await reposApi.readState.upsert({
            userId,
            roomId,
            lastReadMessageId: lastMessageId,
            lastReadAt: Date.now()
          })
        } catch (_) {}
      }, 500)
    }

    if (threadEl) {
      threadEl.addEventListener('scroll', () => {
        const distanceToBottom = threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight
        state.showScrollBtn = distanceToBottom > 150

        if (distanceToBottom < 80 && currentRoomId) {
          const bubbles = threadEl.querySelectorAll('message-bubble')
          if (bubbles.length > 0) {
            const lastBubble = bubbles[bubbles.length - 1]
            const msgId = lastBubble.getAttribute('message-id')
            if (msgId) debouncedMarkRead(currentRoomId, msgId)
          }
        }
      }, { signal })

      threadEl.addEventListener('reaction:toggle', async (event) => {
        const { messageId, reaction } = event.detail
        const userId = globalStore?.$state?.user?.id || 'u_me'
        await toggleReaction({ repos: reposApi, messageId, userId, clientId, reaction })
        currentRoomId = null
        await load()
      }, { signal })
    }

    async function load() {
      if (!reposApi) return
      const route = typeof router?.getRoute === 'function' ? router.getRoute() : null
      const roomId = route?.params?.id || new URLSearchParams(window.location.search).get('id') || 'r_1'
      currentRoomId = roomId

      const userId = globalStore?.$state?.user?.id || 'u_me'
      const rawMessages = (await reposApi.messages.listInRoom(roomId, { limit: 100 })) || []
      const chronological = rawMessages.slice().reverse()
      const readState = await reposApi.readState.get(userId, roomId)
      const usersList = (await reposApi.users.list({ limit: 100 })) || []
      const usersMap = new Map(usersList.map((u) => [u.user_id, u.display_name]))
      const roomReactions = (await reposApi.reactions.listForRoom(roomId)) || []

      const reactionsByMessage = new Map()
      for (const r of roomReactions) {
        if (r.deleted_at) continue
        const bucket = reactionsByMessage.get(r.message_id) ?? []
        bucket.push(r)
        reactionsByMessage.set(r.message_id, bucket)
      }

      const messages = chronological.map((m) => {
        const payload = safeParsePayload(m.decrypted_payload)
        const summary = summarizePayload(payload)
        return {
          id: m.message_id,
          senderId: m.sender_user_id,
          senderName: usersMap.get(m.sender_user_id) || m.sender_user_id,
          created_at: m.created_at,
          edited_at: m.edited_at,
          text: summary.kind === 'text' ? summary.text : (summary.kind === 'tombstone' ? '' : '[Media]'),
          isTombstone: Boolean(m.deleted_at),
          isPending: m.local_status === 'pending',
          isFailed: m.local_status === 'failed',
          isOwn: m.sender_user_id === userId
        }
      })

      const groups = groupMessages(messages)
      const items = insertDateSeparators(groups)
      const dividerIndex = findNewMessagesDivider(messages, readState?.last_read_message_id)

      if (!threadEl) return
      threadEl.replaceChildren()

      let globalMsgCounter = 0

      for (const item of items) {
        if (item.kind === 'date') {
          const sep = document.createElement('date-separator')
          sep.setAttribute('label', item.label)
          threadEl.appendChild(sep)
          continue
        }

        const group = item.group?.messages || []
        for (let i = 0; i < group.length; i++) {
          if (dividerIndex !== -1 && globalMsgCounter === dividerIndex) {
            const div = document.createElement('div')
            div.className = 'chat__divider'
            div.innerHTML = `
              <div class="chat__divider-line"></div>
              <span class="chat__divider-label">${state.chat_new_messages_divider}</span>
              <div class="chat__divider-line"></div>
            `
            threadEl.appendChild(div)
          }

          const msg = group[i]
          const bubble = document.createElement('message-bubble')
          bubble.setAttribute('message-id', msg.id)
          bubble.setAttribute('sender-name', msg.senderName)
          bubble.setAttribute('formatted-time', formatTime(msg.created_at))
          bubble.setAttribute('text-content', msg.text)
          bubble.setAttribute('is-edited', String(Boolean(msg.edited_at)))
          bubble.setAttribute('edited-label', state.bubble_edited_label || 'Edited')

          if (msg.isOwn) bubble.setAttribute('is-own', '')
          if (msg.isTombstone) bubble.setAttribute('is-tombstone', '')
          if (msg.isPending) bubble.setAttribute('is-pending', '')
          if (msg.isFailed) bubble.setAttribute('is-failed', '')

          if (i === 0) bubble.setAttribute('is-first-in-group', '')
          if (i === group.length - 1) bubble.setAttribute('is-last-in-group', '')

          const messageReactions = reactionsByMessage.get(msg.id) ?? []
          const userReactions = new Set()
          for (const r of messageReactions) {
            if (r.sender_user_id === userId) userReactions.add(r.reaction)
          }
          const aggregateMap = new Map()
          const seenUserPerReaction = new Set()
          for (const r of messageReactions) {
            const key = `${r.reaction}:${r.sender_user_id}`
            if (seenUserPerReaction.has(key)) continue
            seenUserPerReaction.add(key)
            aggregateMap.set(r.reaction, (aggregateMap.get(r.reaction) ?? 0) + 1)
          }
          const chips = []
          for (const [reaction, count] of aggregateMap) {
            chips.push({ reaction, count, isOwn: userReactions.has(reaction) })
          }
          bubble.setAttribute('reactions-json', JSON.stringify(chips))

          const rawMsg = rawMessages.find((rm) => rm.message_id === msg.id)
          if (rawMsg?.reply_to) {
            const parent = await reposApi.messages.get(rawMsg.reply_to)
            if (parent) {
              const parentSummary = summarizePayload(safeParsePayload(parent.decrypted_payload))
              const parentSenderUser = await reposApi.users.get(parent.sender_user_id)
              const parentSender = parentSenderUser?.display_name || (parent.sender_user_id === userId ? (state.chats_preview_you_prefix || 'You') : parent.sender_user_id)
              bubble.setAttribute('has-reply', 'true')
              bubble.setAttribute('reply-to-sender', parentSender)
              bubble.setAttribute(
                'reply-to-snippet',
                parent.deleted_at
                  ? (state.reply_snippet_deleted || 'Message deleted')
                  : (parentSummary.kind === 'text' ? truncateQuote(parentSummary.text) : (state.reply_snippet_attachment || 'Attachment'))
              )
            }
          }

          bubble.addEventListener('bubble:contextmenu', async (event) => {
            const { messageId, x, y } = event.detail
            const dbMsg = await reposApi.messages.get(messageId)
            if (!dbMsg) return
            state.menuMessageId = messageId
            state.menuX = x
            state.menuY = y
            state.menuCanReply = isReplyAllowed(dbMsg)
            state.menuCanUnsend = isUnsendAvailable(dbMsg, userId)
            state.menuCanCopy = !dbMsg.deleted_at
            state.menuCanEdit = isEditAvailable(dbMsg, userId)
            state.menuCanReact = isReactionAllowed(dbMsg)
            state.menuOpen = true
          }, { signal })

          bubble.addEventListener('bubble:show-original', async (event) => {
            const messageId = event.detail.messageId
            const versions = (await reposApi.messages.listVersions(messageId)) || []
            const history = buildHistory(versions, {
              formatTime: (ms) => formatTime(ms, { locale: state.locale || 'en' }),
              parsePayload: safeParsePayload,
              summarizePayload
            })
            state.versionsSheetMessageId = messageId
            state.versionsSheetHistoryJson = JSON.stringify(history)
            state.versionsSheetOpen = true
          }, { signal })

          threadEl.appendChild(bubble)
          globalMsgCounter++
        }
      }

      scrollToBottom()

      if (messages.length > 0) {
        const lastMsg = messages[messages.length - 1]
        debouncedMarkRead(roomId, lastMsg.id)
      }
    }

    const replyPreviewEl = refs('replyPreview')
    if (replyPreviewEl) {
      replyPreviewEl.addEventListener('reply-preview:dismiss', () => {
        state.replyPreviewVisible = false
        state.replyPreviewSender = ''
        state.replyPreviewSnippet = ''
        state.replyToMessageId = ''
      }, { signal })
    }

    const composerEl = refs('composer') || threadEl?.parentElement?.querySelector('message-composer')
    if (composerEl) {
      composerEl.addEventListener('composer:send', async (event) => {
        const text = event.detail?.text
        if (!text || !currentRoomId) return
        const replyTo = state.replyPreviewVisible ? state.replyToMessageId : null
        await sendMessage({
          deps: { repos: reposApi, storage, globalStore, crypto: window.crypto },
          roomId: currentRoomId,
          text,
          replyTo
        })
        state.replyPreviewVisible = false
        state.replyPreviewSender = ''
        state.replyPreviewSnippet = ''
        state.replyToMessageId = ''
        currentRoomId = null
        await load()
      }, { signal })

      composerEl.addEventListener('composer:edit-submit', async (event) => {
        const messageId = state.editingMessageId
        const userId = globalStore?.$state?.user?.id || 'u_me'
        if (!messageId) return
        await editMessage({
          deps: { repos: reposApi, buildTextPayload, encodePayload, encodeCiphertextStub },
          messageId,
          newText: event.detail.text,
          userId
        })
        state.composerEditing = false
        state.composerPrefill = ''
        state.editingMessageId = ''
        currentRoomId = null
        await load()
      }, { signal })

      composerEl.addEventListener('composer:edit-cancel', () => {
        state.composerEditing = false
        state.composerPrefill = ''
        state.editingMessageId = ''
      }, { signal })
    }

    const contextMenuEl = refs('contextMenu')
    if (contextMenuEl) {
      contextMenuEl.addEventListener('menu:reply', async (event) => {
        const context = await buildReplyContext({
          repos: reposApi,
          parentMessageId: event.detail.messageId,
          summarizePayload,
          parsePayload: safeParsePayload
        })
        if (!context) {
          state.menuOpen = false
          return
        }
        const senderUser = await reposApi.users.get(context.senderUserId)
        state.replyPreviewSender = senderUser?.display_name || context.senderUserId
        state.replyPreviewSnippet = context.isDeleted
          ? (state.reply_snippet_deleted || 'Message deleted')
          : (context.snippet || state.reply_snippet_attachment || 'Attachment')
        state.replyToMessageId = context.messageId
        state.replyPreviewVisible = true
        state.menuOpen = false
      }, { signal })

      contextMenuEl.addEventListener('menu:react', async (event) => {
        const { messageId, reaction } = event.detail
        const userId = globalStore?.$state?.user?.id || 'u_me'
        await toggleReaction({ repos: reposApi, messageId, userId, clientId, reaction })
        state.menuOpen = false
        currentRoomId = null
        await load()
      }, { signal })

      contextMenuEl.addEventListener('menu:edit', async (event) => {
        const dbMsg = await reposApi.messages.get(event.detail.messageId)
        if (!dbMsg) return
        const payload = safeParsePayload(dbMsg.decrypted_payload)
        const summary = summarizePayload(payload)
        if (summary.kind !== 'text') {
          state.menuOpen = false
          return
        }
        state.editingMessageId = event.detail.messageId
        state.composerPrefill = summary.text
        state.composerEditing = true
        state.menuOpen = false
      }, { signal })

      contextMenuEl.addEventListener('menu:copy', async (event) => {
        await copyMessage({
          deps: {
            repos: reposApi,
            clipboard: navigator.clipboard,
            parsePayload: safeParsePayload,
            summarizePayload
          },
          messageId: event.detail.messageId
        })
        state.menuOpen = false
      }, { signal })

      contextMenuEl.addEventListener('menu:unsend', async (event) => {
        const userId = globalStore?.$state?.user?.id || 'u_me'
        await unsend({ deps: { repos: reposApi }, messageId: event.detail.messageId, userId })
        state.menuOpen = false
        currentRoomId = null
        await load()
      }, { signal })

      contextMenuEl.addEventListener('menu:delete', async (event) => {
        await deleteForMe({ deps: { repos: reposApi }, messageId: event.detail.messageId })
        state.menuOpen = false
        currentRoomId = null
        await load()
      }, { signal })

      contextMenuEl.addEventListener('menu:close', () => {
        state.menuOpen = false
      }, { signal })
    }

    const versionsSheetEl = refs('versionsSheet')
    if (versionsSheetEl) {
      versionsSheetEl.addEventListener('sheet:close', () => {
        state.versionsSheetOpen = false
      }, { signal })
    }

    if (typeof router?.subscribe === 'function') {
      router.subscribe(() => {
        const route = typeof router?.getRoute === 'function' ? router.getRoute() : null
        const newRoomId = route?.params?.id || new URLSearchParams(window.location.search).get('id') || 'r_1'
        if (newRoomId !== currentRoomId) {
          currentRoomId = newRoomId
          load()
        }
      }, { signal })
    }

    window.addEventListener('test-storage-seeded', () => {
      currentRoomId = null
      load()
    }, { signal })

    await load()
  }
})
</script>
