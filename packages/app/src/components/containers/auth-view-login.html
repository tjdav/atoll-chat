<template id="auth-view-login">
  <section class="card">
    <header>
      <h1>Log in</h1>
    </header>
    <p ref="errorRegion" role="alert" class="error-message" hidden="{{ errorHidden }}">{{ error }}</p>
    <form ref="form" novalidate>
      <label class="field">
        <span class="field-label">Username</span>
        <input ref="username" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input ref="password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button ref="submit" type="submit" class="primary" disabled="{{ pending }}">{{ submitLabel }}</button>
    </form>
    <button ref="biometric" type="button" class="secondary" hidden="{{ biometricHidden }}">Log in with Face ID</button>
    <footer>
      <button ref="registerLink" type="button" class="link">Register with invite code →</button>
      <button ref="recoveryLink" type="button" class="link">Lost access? Use recovery →</button>
    </footer>
  </section>
</template>

<style>
  :host(:not([active="true"])) {
    display: none !important;
  }
  :host([active="true"]) {
    display: block;
  }
  .card {
    background-color: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  header h1 {
    margin: 0;
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
  }
  .error-message {
    margin: 0;
    padding: var(--space-2) var(--space-3);
    background-color: var(--surface-1);
    color: var(--destructive-500, #e53e3e);
    border: 1px solid var(--destructive-500, #e53e3e);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .field-label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }
  input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: var(--text-base);
  }
  input:focus {
    outline: 2px solid var(--accent-fill);
    outline-offset: 1px;
  }
  button.primary {
    width: 100%;
    padding: var(--space-2) var(--space-4);
    background-color: var(--accent-fill);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }
  button.secondary {
    width: 100%;
    padding: var(--space-2) var(--space-4);
    background-color: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    cursor: pointer;
  }
  footer {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-2);
  }
  button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent-fill);
    font-size: var(--text-sm);
    text-align: left;
    cursor: pointer;
  }
  button.link:hover {
    text-decoration: underline;
  }
</style>

<script type="module">
export default {
  attributes: {
    active: { type: String, default: 'false' },
    pending: { type: Boolean, default: false },
    error: { type: String, default: '' }
  },
  getters: {
    biometricHidden: () => true,
    submitLabel: ({ state }) => (state.pending ? 'Logging in…' : 'Log in'),
    errorHidden: ({ state }) => !state.error
  },
  client({ refs, emit, state, signal }) {
    refs('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      const username = refs('username').value
      const password = refs('password').value

      emit('auth:login:submit', { username, password })

      state.pending = true
      state.error = ''
      try {
        const { loginFlow } = await import('../../../lib/auth/flows.js')
        await loginFlow({ username, password })
        window.location.href = '/app.html'
      } catch (err) {
        state.error = err instanceof Error ? err.message : 'Login failed.'
      } finally {
        state.pending = false
      }
    }, { signal })

    refs('registerLink').addEventListener('click', () => {
      emit('auth:view-change', { view: 'register' })
    }, { signal })

    refs('recoveryLink').addEventListener('click', () => {
      emit('auth:view-change', { view: 'recovery' })
    }, { signal })

    refs('biometric').addEventListener('click', () => {
      emit('auth:biometric:request')
    }, { signal })
  }
}
</script>
