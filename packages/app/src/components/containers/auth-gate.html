<template id="auth-gate">
  <main class="gate">
    <div class="gate-column">
      <auth-view-login active="{{ loginActive }}"></auth-view-login>
      <auth-view-register active="{{ registerActive }}"></auth-view-register>
      <auth-view-recovery active="{{ recoveryActive }}"></auth-view-recovery>
      <auth-view-confirm active="{{ confirmActive }}"></auth-view-confirm>
    </div>
  </main>
</template>

<style>
  :host {
    display: block;
    width: 100%;
  }
  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: var(--space-4);
    background-color: var(--surface-0);
  }
  .gate-column {
    width: 100%;
    max-width: 360px;
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    view: { type: String, default: 'login' }
  },
  getters: {
    loginActive: ({ state }) => (state.view === 'login' ? 'true' : 'false'),
    registerActive: ({ state }) => (state.view === 'register' ? 'true' : 'false'),
    recoveryActive: ({ state }) => (state.view === 'recovery' ? 'true' : 'false'),
    confirmActive: ({ state }) => (state.view === 'confirm' ? 'true' : 'false')
  },
  client({ root, state, signal }) {
    root.addEventListener('auth:view-change', (event) => {
      const next = event.detail?.view
      if (next === 'login' || next === 'register' || next === 'recovery' || next === 'confirm') {
        state.view = next
      }
    }, { signal })

    root.addEventListener('auth:register:success', () => {
      state.view = 'confirm'
    }, { signal })
  }
})
</script>
