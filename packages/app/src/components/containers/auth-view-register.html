<template id="auth-view-register">
  <!-- coralite-ignore-data-attributes -->
  <section class="card">
    <header>
      <h1>{{ auth_register_title }}</h1>
    </header>
    <p ref="errorRegion" role="alert" class="error-message" hidden="{{ errorHidden }}">{{ error }}</p>
    <form ref="form" novalidate>
      <label class="field">
        <span class="field-label">{{ auth_register_invite_code_label }}</span>
        <input ref="inviteCode" type="text" name="inviteCode" autocomplete="off" autocapitalize="characters" maxlength="8" spellcheck="false" required>
      </label>
      <div ref="altcha" data-altcha></div>
      <label class="field">
        <span class="field-label">{{ auth_register_username_label }}</span>
        <input ref="username" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">{{ auth_register_display_name_label }}</span>
        <input ref="displayName" type="text" name="displayName" autocomplete="nickname" required>
      </label>
      <label class="field">
        <span class="field-label">{{ auth_register_password_label }}</span>
        <input ref="password" type="password" name="password" autocomplete="new-password" required>
      </label>
      <button ref="submit" type="submit" class="primary" disabled="{{ pending }}">{{ submitLabel }}</button>
    </form>
    <footer>
      <button ref="backLink" type="button" class="link">{{ auth_register_back_link }}</button>
    </footer>
  </section>
</template>

<style>
  :host(:not([active="true"])) {
    display: none !important;
  }
  :host([active="true"]) {
    display: block;
  }
  .card {
    background-color: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  header h1 {
    margin: 0;
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
  }
  .error-message {
    margin: 0;
    padding: var(--space-2) var(--space-3);
    background-color: var(--surface-1);
    color: var(--destructive-500, #e53e3e);
    border: 1px solid var(--destructive-500, #e53e3e);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .field-label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }
  input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: var(--text-base);
  }
  input:focus {
    outline: 2px solid var(--accent-fill);
    outline-offset: 1px;
  }
  button.primary {
    width: 100%;
    padding: var(--space-2) var(--space-4);
    background-color: var(--accent-fill);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }
  footer {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-2);
  }
  button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent-fill);
    font-size: var(--text-sm);
    text-align: left;
    cursor: pointer;
  }
  button.link:hover {
    text-decoration: underline;
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    active: { type: String, default: 'false' },
    pending: { type: Boolean, default: false },
    error: { type: String, default: '' }
  },
  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      ...i18n.strings([
        'auth_register_title',
        'auth_register_invite_code_label',
        'auth_register_username_label',
        'auth_register_display_name_label',
        'auth_register_password_label',
        'auth_register_submit_button',
        'auth_register_submit_pending',
        'auth_register_back_link'
      ])
    }
  },
  getters: {
    submitLabel: ({ state }) => (state.pending ? state.auth_register_submit_pending : state.auth_register_submit_button),
    errorHidden: ({ state }) => !state.error
  },
  client({ refs, emit, state, signal, i18n }) {
    const syncLocale = (locale) => {
      state.locale = locale
      Object.assign(state, i18n.strings([
        'auth_register_title',
        'auth_register_invite_code_label',
        'auth_register_username_label',
        'auth_register_display_name_label',
        'auth_register_password_label',
        'auth_register_submit_button',
        'auth_register_submit_pending',
        'auth_register_back_link'
      ]))
    }

    i18n.subscribeLocale(syncLocale, { signal })
    if (state.locale !== i18n.getLocale()) {
      syncLocale(i18n.getLocale())
    }

    refs('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      emit('auth:register:submit', {
        inviteCode: refs('inviteCode').value,
        username: refs('username').value,
        displayName: refs('displayName').value,
        password: refs('password').value
      })
    }, { signal })

    refs('backLink').addEventListener('click', () => {
      emit('auth:view-change', { view: 'login' })
    }, { signal })
  }
})
</script>
