<template id="auth-view-register">
  <section class="card">
    <header>
      <h1>Create account</h1>
    </header>
    <form ref="form" novalidate>
      <label class="field">
        <span class="field-label">Invite code</span>
        <input ref="inviteCode" type="text" name="inviteCode" autocomplete="off" autocapitalize="characters" maxlength="8" spellcheck="false" required>
      </label>
      <div ref="altcha" data-altcha></div>
      <label class="field">
        <span class="field-label">Username</span>
        <input ref="username" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Display name</span>
        <input ref="displayName" type="text" name="displayName" autocomplete="nickname" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input ref="password" type="password" name="password" autocomplete="new-password" required>
      </label>
      <button ref="submit" type="submit" class="primary">Create account</button>
    </form>
    <footer>
      <button ref="backLink" type="button" class="link">← Back to log in</button>
    </footer>
  </section>
</template>

<style>
  :host(:not([active="true"])) {
    display: none !important;
  }
  :host([active="true"]) {
    display: block;
  }
  .card {
    background-color: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  header h1 {
    margin: 0;
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .field-label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }
  input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: var(--text-base);
  }

    outline: 2px solid var(--accent-fill);

    background: none;

    text-decoration: underline;
  }

<script type="module">
export default {
  attributes: {
    active: { type: String, default: 'false' },
    pending: { type: Boolean, default: false },
    error: { type: String, default: '' }
  },
  getters: {
    submitLabel: ({ state }) => (state.pending ? 'Creating account…' : 'Create account'),
    errorHidden: ({ state }) => !state.error
  },
  client({ refs, emit, state, signal }) {
    const messages = {
      invite_invalid: 'That invite code is not valid or has expired.',
      altcha_failed: 'Verification failed. Try again.',
      username_taken: 'That username is already in use.',
      display_name_invalid: 'Display name is too long.',
      opaque_failed: 'Registration failed. Try again.',
      network: 'The server had a problem. Try again.',
      unknown: 'Something went wrong. Try again.'
    }

    refs('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      emit('auth:register:submit', {
        inviteCode: refs('inviteCode').value,
        username: refs('username').value,
        displayName: refs('displayName').value,
        password: refs('password').value
      })
    }, { signal })

    refs('backLink').addEventListener('click', () => {
      emit('auth:view-change', { view: 'login' })
    }, { signal })
  }
}
</script>
