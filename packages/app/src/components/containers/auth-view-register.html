<template id="auth-view-register">
  <section class="card">
    <header>
      <h1>Create account</h1>
    </header>
    <p ref="errorRegion" role="alert" class="error-message" hidden="{{ errorHidden }}">{{ error }}</p>
    <form ref="form" novalidate>
      <label class="field">
        <span class="field-label">Invite code</span>
        <input ref="inviteCode" type="text" name="inviteCode" autocomplete="off" autocapitalize="characters" maxlength="8" spellcheck="false" required>
      </label>
      <div class="field">
        <altcha-widget ref="altcha" challengeurl="/api/v1/auth/register/challenge"></altcha-widget>
      </div>
      <label class="field">
        <span class="field-label">Username</span>
        <input ref="username" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Display name</span>
        <input ref="displayName" type="text" name="displayName" autocomplete="nickname" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input ref="password" type="password" name="password" autocomplete="new-password" required>
      </label>
      <button ref="submit" type="submit" class="primary" disabled="{{ pending }}">{{ submitLabel }}</button>
    </form>
    <footer>
      <button ref="backLink" type="button" class="link">← Back to log in</button>
    </footer>
  </section>
</template>

<style>
  :host(:not([active="true"])) {
    display: none !important;
  }
  :host([active="true"]) {
    display: block;
  }
  .card {
    background-color: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  header h1 {
    margin: 0;
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
  }
  .error-message {
    margin: 0;
    padding: var(--space-2) var(--space-3);
    background-color: var(--surface-1);
    color: var(--destructive-500, #e53e3e);
    border: 1px solid var(--destructive-500, #e53e3e);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .field-label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }
  input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: var(--text-base);
  }
  input:focus {
    outline: 2px solid var(--accent-fill);
    outline-offset: 1px;
  }
  button.primary {
    width: 100%;
    padding: var(--space-2) var(--space-4);
    background-color: var(--accent-fill);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
  }
  footer {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-2);
  }
  button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent-fill);
    font-size: var(--text-sm);
    text-align: left;
    cursor: pointer;
  }
  button.link:hover {
    text-decoration: underline;
  }
</style>

<script type="module">
export default {
  attributes: {
    active: { type: String, default: 'false' },
    pending: { type: Boolean, default: false },
    error: { type: String, default: '' }
  },
  getters: {
    submitLabel: ({ state }) => (state.pending ? 'Creating account…' : 'Create account'),
    errorHidden: ({ state }) => !state.error
  },
  client({ refs, emit, state, signal }) {
    const messages = {
      invite_invalid: 'That invite code is not valid or has expired.',
      altcha_failed: 'Verification failed. Try again.',
      username_taken: 'That username is already in use.',
      display_name_invalid: 'Display name is too long.',
      opaque_failed: 'Registration failed. Try again.',
      network: 'The server had a problem. Try again.',
      unknown: 'Something went wrong. Try again.'
    }

    refs('form').addEventListener('submit', async (event) => {
      event.preventDefault()

      const inviteCode = refs('inviteCode').value
      const username = refs('username').value
      const displayName = refs('displayName').value
      const password = refs('password').value
      const altchaEl = refs('altcha')
      const altcha = altchaEl?.value || altchaEl?.getAttribute?.('value') || ''

      const payload = {
        inviteCode,
        altcha,
        username,
        displayName,
        password
      }

      emit('auth:register:submit', payload)

      state.pending = true
      state.error = ''

      try {
        const { registerFlow, RegisterError } = await import('../../../lib/auth/flows.js')
        const result = await registerFlow(payload)

        const { setPendingRegistration } = await import('../../../lib/auth/pending-registration.js')
        setPendingRegistration(result)

        emit('auth:register:success', { userId: result.userId })
      } catch (err) {
        if (err && typeof err === 'object' && err.code) {
          if (err.code === 'display_name_invalid' && err.message) {
            state.error = err.message
          } else {
            state.error = messages[err.code] || messages.unknown
          }
        } else {
          state.error = messages.unknown
        }
      } finally {
        state.pending = false
      }
    }, { signal })

    refs('backLink').addEventListener('click', () => {
      emit('auth:view-change', { view: 'login' })
    }, { signal })
  }
}
</script>
