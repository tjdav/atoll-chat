<template id="messenger-boot">
  <div ref="root" class="boot" data-testid="boot" data-state="{{ bootState }}">
    <p ref="loading" class="loading" hidden="{{ loadingHidden }}">
      <span class="spinner" aria-hidden="true"></span>
      <span>{{ boot_loading }}</span>
    </p>
    <p ref="error" class="error" role="alert" hidden="{{ errorHidden }}">{{ error }}</p>
  </div>
</template>

<style>
  :host {
    position: fixed;
    inset: 0;
    z-index: var(--z-modal, 1000);
    display: block;
    width: 100%;
    height: 100dvh;
  }

  :host([ready="true"]),
  :host([ready]) {
    display: none !important;
  }

  .boot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    background-color: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  .loading {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    font-size: var(--text-base);
    color: var(--text-secondary);
  }

  .spinner {
    width: 1.25rem;
    height: 1.25rem;
    border: 2px solid var(--border-subtle);
    border-top-color: var(--accent-500);
    border-radius: var(--radius-full);
    animation: spin var(--duration-slow, 1s) linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .error {
    color: var(--destructive-500, #ef4444);
    font-size: var(--text-base);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--destructive-500, #ef4444);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
  }
</style>

<script type="module">
import { defineComponent } from 'coralite'

export default defineComponent({
  attributes: {
    ready: { type: Boolean, default: false },
    error: { type: String, default: '' },
    hasOprfToken: { type: Boolean, default: false }
  },

  server({ i18n }) {
    return {
      locale: i18n.getLocale(),
      ...i18n.strings([
        'boot_loading',
        'boot_error_failed'
      ])
    }
  },

  getters: {
    bootState: ({ state }) => state.error ? 'error' : (state.ready ? 'ready' : 'booting'),
    loadingHidden: ({ state }) => state.ready || state.error !== '',
    errorHidden: ({ state }) => state.error === ''
  },

  client: async ({ refs, emit, state, signal, i18n, storage, sync, globalStore }) => {
    const syncLocale = (locale) => {
      state.locale = locale
      Object.assign(state, i18n.strings([
        'boot_loading',
        'boot_error_failed'
      ]))
    }

    i18n.subscribeLocale(syncLocale, { signal })
    if (state.locale !== i18n.getLocale()) {
      syncLocale(i18n.getLocale())
    }

    try {
      const { bootFlow } = await import('../../lib/auth/boot.js')
      const result = await bootFlow()
      if (result.redirected) {
        return
      }
      state.hasOprfToken = result.hasOprfToken
      state.ready = true

      if (globalStore?.$state) {
        globalStore.$state.isAuthenticated = true
        globalStore.$state.currentUser = result.user ?? null
        globalStore.$state.oprfToken = state.oprfToken ?? null
      }

      emit('app:ready', {
        hasOprfToken: result.hasOprfToken,
        user: result.user
      })

      if (storage?.open) {
        try {
          await storage.open()
          const persistent = typeof storage.isPersistent === 'function'
            ? await storage.isPersistent()
            : true
          if (globalStore?.$state) {
            globalStore.$state.storageReady = true
            globalStore.$state.storagePersistent = persistent
          }
          const root = refs('root')
          if (root) {
            root.dataset.storageReady = 'true'
            root.dataset.storagePersistent = String(persistent)
          }

          if (result.user?.id && sync?.runUserScopedSync) {
            try {
              const { api } = await import('../../lib/api/client.js')
              await sync.runUserScopedSync({
                userId: result.user.id,
                api,
                storage
              })
              if (root) {
                root.dataset.syncReady = 'true'
              }
            } catch (_syncErr) {
              // Sync failed. The local database is unchanged. A future task retries on reconnect.
            }
          }
        } catch (_err) {
          // Storage unavailable. storageReady remains false.
        }
      }
    } catch (err) {
      state.error = err instanceof Error ? err.message : i18n.t('boot_error_failed')
      emit('app:error', { message: state.error })
    }
  }
})
</script>
