<template id="messenger-boot">
  <div class="boot" data-testid="boot" data-state="{{ bootState }}">
    <p ref="loading" class="loading" hidden="{{ loadingHidden }}">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </p>
    <p ref="error" class="error" role="alert" hidden="{{ errorHidden }}">{{ error }}</p>
    <slot name="shell"></slot>
  </div>
</template>

<style>
  :host {
    display: block;
    width: 100%;
    height: 100dvh;
  }

  .boot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    background-color: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  .loading {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    font-size: var(--text-base);
    color: var(--text-secondary);
  }

  .spinner {
    width: 1.25rem;
    height: 1.25rem;
    border: 2px solid var(--border-subtle);
    border-top-color: var(--accent-500);
    border-radius: var(--radius-full);
    animation: spin var(--duration-slow, 1s) linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .error {
    color: var(--destructive-500, #ef4444);
    font-size: var(--text-base);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--destructive-500, #ef4444);
    border-radius: var(--radius-md);
    background-color: var(--surface-1);
  }
</style>

<script type="module">
export default {
  attributes: {
    ready: { type: Boolean, default: false },
    error: { type: String, default: '' },
    hasOprfToken: { type: Boolean, default: false }
  },

  getters: {
    bootState: ({ state }) => state.error ? 'error' : (state.ready ? 'ready' : 'booting'),
    loadingHidden: ({ state }) => state.ready || state.error !== '',
    errorHidden: ({ state }) => state.error === ''
  },

  client({ refs, emit, state, signal }) {
    (async () => {
      try {
        const { bootFlow } = await import('../../lib/auth/boot.js');
        const result = await bootFlow();
        if (result.redirected) {
          return;
        }
        state.hasOprfToken = result.hasOprfToken;
        state.ready = true;
        emit('app:ready', {
          hasOprfToken: result.hasOprfToken,
          user: result.user
        });
      } catch (err) {
        state.error = err instanceof Error ? err.message : 'Boot failed.';
        emit('app:error', { message: state.error });
      }
    })();
  }
}
</script>
