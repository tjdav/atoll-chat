services:
  atoll:
    build: .
    container_name: atoll-chat
    ports:
      - "8080:8080"
    volumes:
      - ./pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: docker.io/coturn/coturn:latest
    container_name: atoll-coturn
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
    command:
      - turnserver
      - -n
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --lt-cred-mech
      - --user=testuser:testpass
      - --realm=atoll-chat
    restart: unless-stopped
