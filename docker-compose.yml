services:
  atoll:
    build: .
    container_name: atoll-chat
    ports:
      - "8080:8080"
    volumes:
      - ./pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: atoll-coturn
    network_mode: "host"
    command: >
      turnserver
      --log-file=stdout
      --listening-port=3478
      --user=testuser:testpass
      --realm=atoll-chat
      --no-cli
    restart: unless-stopped
